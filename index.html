/* ==================================================== Daten ändern */
function mitPos(id, fn) {
  let treffer = null;
  Object.keys(S.daten).forEach(j => (S.daten[j]||[]).forEach(b => {
    if (b.art === 'schulden') (b.gruppen||[]).forEach(g => (g.pos||[]).forEach(p => { if (p.id === id) treffer = p; }));
    else (b.pos||[]).forEach(p => { if (p.id === id) treffer = p; });
  }));
  if (!treffer) return;
  fn(treffer); merke();
}
function findePos(id) {
  let out = null;
  Object.keys(S.daten).forEach(j => (S.daten[j]||[]).forEach(b => {
    if (b.art === 'schulden') (b.gruppen||[]).forEach(g => (g.pos||[]).forEach(p => {
      if (p.id === id) out = { p, j:parseInt(j,10), eltern:g.id }; }));
    else (b.pos||[]).forEach(p => { if (p.id === id) out = { p, j:parseInt(j,10), eltern:b.id }; });
  }));
  return out;
}
/* Eine Stelle rauf oder runter — der Weg fuer die Tastatur, wenn niemand ziehen
   will oder kann. */
function verschiebeUm(id, richtung) {
  const listen = [];
  Object.keys(S.daten).forEach(j => (S.daten[j]||[]).forEach(b => {
    if (b.art === 'schulden') (b.gruppen||[]).forEach(g => listen.push(g.pos));
    else listen.push(b.pos); }));
  for (const L of listen) {
    const i = L.findIndex(p => p.id === id);
    if (i < 0) continue;
    const k = i + richtung;
    if (k < 0 || k >= L.length) return;
    const [weg] = L.splice(i, 1); L.splice(k, 0, weg);
    fokusWunsch = '[data-griff="' + id + '"]';
    merke(); neu(); return;
  }
}

/* Verschieben nur innerhalb derselben Sektion. */
function verschiebe(vonId, aufId) {
  if (!vonId || !aufId || vonId === aufId) return;
  const listen = [];
  Object.keys(S.daten).forEach(j => (S.daten[j]||[]).forEach(b => {
    if (b.art === 'schulden') (b.gruppen||[]).forEach(g => listen.push(g.pos));
    else listen.push(b.pos);
  }));
  for (const L of listen) {
    const a = L.findIndex(p => p.id === vonId), b = L.findIndex(p => p.id === aufId);
    if (a < 0 || b < 0) continue;
    const [weg] = L.splice(a,1); L.splice(b,0,weg); merke(); return;
  }
}
function jahrAnlegen() {
  const vor = Math.max.apply(null, jahre()), neu = S.neu.jahr;
  if (!neu || S.jahre.indexOf(neu) >= 0) { S.neu = null; return; }
  const kopie = (S.daten[vor]||[]).map(b => {
    if (b.art === 'schulden') {
      return { id:neueId(), art:'schulden', name:b.name, key:b.key, vz:b.vz,
        gruppen: (b.gruppen||[]).map(g => ({ id:neueId(), name:g.name, key:g.key,
          pos: (g.pos||[]).map(p => ({ id:neueId(), key:p.key, name:p.name,
            basis: restVon(vor, g.key, p.key),
            reihe: S.neu.raten ? p.reihe.slice() : N12() }))
            .filter(p => p.basis !== 0 || S.neu.raten) })) };
    }
    return { id:neueId(), art:'block', name:b.name, key:b.key, vz:b.vz,
      pos: (b.pos||[]).map(p => ({ id:neueId(), key:p.key, name:p.name, basis:p.basis,
        reihe: S.neu.budget ? p.reihe.slice() : N12(), spiegel:p.spiegel, fix:p.fix })) };
  });
  S.daten[neu] = kopie; S.rechnungen[neu] = [];
  S.jahre = S.jahre.concat([neu]).sort((a,b) => a-b);
  S.jahr = neu; S.ansicht = 'budget'; S.neu = null; merke();
}
function jahrLoeschen(j) {
  if (S.jahre.length <= 1) return;
  /* Erledigt-Marken dieses Jahrgangs gehen mit, sonst wachsen Karteileichen. */
  const ids = [];
  (S.daten[j]||[]).forEach(b => {
    if (b.art === 'schulden') (b.gruppen||[]).forEach(g => (g.pos||[]).forEach(p => ids.push(p.id)));
    else (b.pos||[]).forEach(p => ids.push(p.id)); });
  (S.rechnungen[j]||[]).forEach(g => (g.rechnungen||[]).forEach(r => ids.push(r.id)));
  Object.keys(S.haken).forEach(k => {
    if (ids.indexOf(k.slice(0, k.lastIndexOf(':'))) >= 0) delete S.haken[k]; });
  delete S.daten[j]; delete S.rechnungen[j];
  S.jahre = S.jahre.filter(x => x !== j);
  if (S.jahr === j) {                       /* auf den naechsten Nachbarn, nicht ans Ende */
    const vor = S.jahre.filter(x => x < j), nach = S.jahre.filter(x => x > j);
    S.jahr = nach.length ? nach[0] : vor[vor.length - 1];
  }
  S.wegJahr = null; merke();
}

function uebertragen() {
  const u = S.ueb, von = Math.min(u.von, u.bis), bis = Math.max(u.von, u.bis);
  const setz = p => { for (let m = von; m <= bis; m++) p.reihe[m] = u.wert; };
  /* Der Block gehoert zur Kennung dazu. Zwei gleichnamige Zeilen in verschiedenen
     Kategorien tragen denselben Schluessel — ohne den Block wuerde das Fortschreiben
     eine fremde Zeile in einem Jahr ueberschreiben, das niemand ansieht. */
  let key = null, gKey = null, bKey = null;
  (S.daten[u.jahr]||[]).forEach(b => {
    if (b.art === 'schulden') (b.gruppen||[]).forEach(g => (g.pos||[]).forEach(p => {
      if (p.id === u.id) { setz(p); key = p.key; gKey = g.key; bKey = b.key; } }));
    else (b.pos||[]).forEach(p => { if (p.id === u.id) { setz(p); key = p.key; bKey = b.key; } });
  });
  if (u.folge && key) {
    jahre().filter(j => j > u.jahr).forEach(j => (S.daten[j]||[]).forEach(b => {
      if (b.key !== bKey) return;
      if (b.art === 'schulden') (b.gruppen||[]).forEach(g => (g.pos||[]).forEach(p => {
        if (p.key === key && (!gKey || g.key === gKey)) p.reihe = new Array(12).fill(u.wert); }));
      else (b.pos||[]).forEach(p => { if (p.key === key) p.reihe = new Array(12).fill(u.wert); });
    }));
  }
  fokusWunsch = '.zelle[data-z="' + u.id + '"][data-m="' + u.m + '"]';
  S.ueb = null; merke();
}

/* ---- Basis: uebertragen oder verteilen ---------------------------------- */
function basisTat(art) {
  const b = S.basis; if (!b) return;
  const wert = art === 'verteilen' ? proMonat(b.wert) : b.wert;
  mitPos(b.id, p => { p.reihe = new Array(12).fill(wert); });
  fokusWunsch = '.zelle[data-b="' + b.id + '"]';
  S.basis = null; neu();
}

/* ---- Saldokorrekturen bei Schulden -------------------------------------- */
let wartetTat = null;                 /* haengt an der Warnung, nicht am Zustand */

function korrOeffnen(id, art) {
  let treffer = null;
  (S.daten[S.jahr]||[]).forEach(b => { if (b.art !== 'schulden') return;
    (b.gruppen||[]).forEach(g => (g.pos||[]).forEach(p => {
      if (p.id === id) treffer = { gKey:g.key, pKey:p.key, name:p.name }; })); });
  if (!treffer) return;
  S.korr = { id, art, jahr:S.jahr, gKey:treffer.gKey, pKey:treffer.pKey,
    name:treffer.name, richtung:'plus', betrag:'', notiz:'' };
  zeichne();
}

/* Jede Aenderung an einer Korrektur wandert von selbst ins Folgejahr. Trägt
   dort schon eine eigene Korrektur am Anfangssaldo, wird vorher gefragt. */
function korrAnwenden(tat) {
  const k = S.korr; if (!k) return;
  const folge = folgeKorrekturen(k.jahr, k.gKey, k.pKey);
  if (folge.length) { wartetTat = tat; S.korrWarn = { folge }; return zeichne(); }
  tat(); merke(); neu();
}
function korrAufraeumen(p) {
  if (korrListe(p,'basis').length === 0 && korrListe(p,'rest').length === 0) delete p.korr;
}
function korrHinzu() {
  const k = S.korr; const p = posVon(k.jahr, k.gKey, k.pKey); if (!p) return;
  const betrag = (k.richtung === 'minus' ? -1 : 1) * Math.abs(zahl(k.betrag));
  if (!betrag) return;
  const notiz = String(k.notiz || '');
  korrAnwenden(() => {
    if (!p.korr) p.korr = {};
    if (!p.korr[k.art]) p.korr[k.art] = [];
    p.korr[k.art].push({ id:neueId(), betrag, notiz });
    S.korr.betrag = ''; S.korr.notiz = '';
  });
}
function korrWeg(eid) {
  const k = S.korr; const p = posVon(k.jahr, k.gKey, k.pKey); if (!p) return;
  korrAnwenden(() => {
    p.korr[k.art] = korrListe(p, k.art).filter(x => x.id !== eid);
    korrAufraeumen(p);
  });
}
function korrBetrag(eid, wert) {
  const k = S.korr; const p = posVon(k.jahr, k.gKey, k.pKey); if (!p) return;
  const n = zahl(wert);
  korrAnwenden(() => {
    if (n === 0) { p.korr[k.art] = korrListe(p, k.art).filter(x => x.id !== eid); korrAufraeumen(p); }
    else korrListe(p, k.art).forEach(x => { if (x.id === eid) x.betrag = n; });
  });
}
function korrNotiz(eid, wert) {
  const k = S.korr; const p = posVon(k.jahr, k.gKey, k.pKey); if (!p) return;
  korrListe(p, k.art).forEach(x => { if (x.id === eid) x.notiz = wert; });
  merke(); neu();                      /* Notizen aendern keine Zahl — keine Warnung */
}
function korrWarnAntwort(wahl) {
  const tat = wartetTat, folge = (S.korrWarn || {}).folge || [];
  wartetTat = null; S.korrWarn = null;
  if (wahl === 'ab') return zeichne();
  if (tat) tat();
  if (wahl === 'ueber') {
    const k = S.korr;
    folge.forEach(x => { const p = posVon(x.jahr, k.gKey, k.pKey);
      if (p && p.korr) { p.korr.basis = []; korrAufraeumen(p); } });
  }
  merke(); neu();
}

/* ================================================== Sichern und Laden */
const SCHLUESSEL = 'gaepp.tabelle.v1';
const CONF = 'gaepp.tabelle.anbindung';
let druck = null, warteMerken = null, letzterFinger = '';

function syncConf() {
  try { return Object.assign({ repo:'', pfad:'gaepp-daten.json', zweig:'main', token:'' },
    JSON.parse(localStorage.getItem(CONF) || '{}')); }
  catch(e) { return { repo:'', pfad:'gaepp-daten.json', zweig:'main', token:'' }; }
}
function setzeConf(feld, wert) {
  const c = syncConf(); c[feld] = wert;
  try { localStorage.setItem(CONF, JSON.stringify(c)); } catch(e) {}
}
function finger() {
  const d = nutzdaten(); delete d.meta;
  return JSON.stringify(d);
}
/* Anzeigezustand geht nie in den Fingerabdruck — sonst sichert GÄPP beim Klappen. */
function merke() {
  try { localStorage.setItem(SCHLUESSEL, JSON.stringify(nutzdaten())); } catch(e) {}
  const f = finger();
  if (f === letzterFinger) return;
  letzterFinger = f;
  const c = syncConf();
  if (!c.repo || !c.token) { S.sync = 'lokal'; S.syncText = 'Im Browser gesichert, kein Repo verbunden.'; return; }
  if (warteMerken) clearTimeout(warteMerken);
  warteMerken = setTimeout(() => { warteMerken = null; insRepo(true); }, 2500);
}
function anzeigeMerken() {
  try { localStorage.setItem(SCHLUESSEL + '.ansicht', JSON.stringify({
    theme:S.theme, jahr:S.jahr, ansicht:S.ansicht, alleWas:S.alleWas,
    nullen:S.nullen, auf:S.auf })); } catch(e) {}
}

async function repoLesen(still) {
  const c = syncConf();
  if (!c.repo || !c.token) { melde('fehler', 'Repo und Zugangsschlüssel fehlen.'); zeichneRahmen(); return; }
  melde('sichert', 'Hole aus dem Repo …'); zeichneRahmen();
  try {
    const u = 'https://api.github.com/repos/' + c.repo + '/contents/' + c.pfad + '?ref=' + encodeURIComponent(c.zweig);
    const a = await fetch(u, { headers:{ Authorization:'Bearer ' + c.token,
      Accept:'application/vnd.github+json' } });
    if (!a.ok) throw new Error('HTTP ' + a.status);
    const j = await a.json();
    druck = j.sha;
    const text = new TextDecoder().decode(Uint8Array.from(atob(j.content.replace(/\n/g,'')), ch => ch.charCodeAt(0)));
    uebernimm(JSON.parse(text));
    letzterFinger = finger();
    melde('gesichert', 'Aus dem Repo geholt.');
    S.syncAuf = false;
    zeichne();
  } catch(e) { melde('fehler', 'Holen misslungen: ' + e.message);
    if (still) zeichneRahmen(); else zeichne(); }
}
async function insRepo(still) {
  const c = syncConf();
  if (!c.repo || !c.token) { melde('fehler', 'Repo und Zugangsschlüssel fehlen.');
    if (still) zeichneRahmen(); else zeichne(); return; }
  melde('sichert', 'Sichert …'); if (still) zeichneRahmen(); else zeichne();
  const leib = () => {
    const roh = JSON.stringify(nutzdaten(), null, 1);
    const bytes = new TextEncoder().encode(roh);
    let bin = ''; for (let i = 0; i < bytes.length; i += 0x8000)
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    return btoa(bin);
  };
  const u = 'https://api.github.com/repos/' + c.repo + '/contents/' + c.pfad;
  const schick = async sha => fetch(u, { method:'PUT',
    headers:{ Authorization:'Bearer ' + c.token, Accept:'application/vnd.github+json',
      'Content-Type':'application/json' },
    body: JSON.stringify({ message:'GÄPP ' + new Date().toLocaleString('de-CH'),
      content: leib(), branch: c.zweig, sha: sha || undefined }) });
  try {
    let a = await schick(druck);
    if (a.status === 409 || a.status === 422) {          /* Stand veraltet — einmal neu holen */
      const g = await fetch(u + '?ref=' + encodeURIComponent(c.zweig),
        { headers:{ Authorization:'Bearer ' + c.token, Accept:'application/vnd.github+json' } });
      if (g.ok) { druck = (await g.json()).sha; a = await schick(druck); }
    }
    if (!a.ok) throw new Error('HTTP ' + a.status);
    druck = (await a.json()).content.sha;
    melde('gesichert', 'Ins Repo gesichert um ' + new Date().toLocaleTimeString('de-CH') + '.');
  } catch(e) { melde('fehler', 'Sichern misslungen: ' + e.message); }
  /* Beim stillen Sichern nur den Punkt oben nachfuehren — nicht das Blatt, in dem
     jemand gerade tippt. */
  if (still) zeichneRahmen(); else zeichne();
}
function melde(zustand, text) { S.sync = zustand; S.syncText = text; }

/* ------------------------------------------------------ Datei und Export */
function gib(name, text, typ) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type: typ }));
  a.download = name; document.body.appendChild(a); a.click(); a.remove();
}
function jsonSichern() {
  gib('gaepp-daten.json', JSON.stringify(nutzdaten(), null, 1), 'application/json');
  S.exp = null; zeichne();
}
function dateiLaden() {
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = '.json,application/json';
  inp.onchange = () => { const f = inp.files[0]; if (!f) return;
    const l = new FileReader();
    l.onload = () => { try { uebernimm(JSON.parse(l.result));
        letzterFinger = finger(); merke();
        S.syncAuf = false; melde('lokal', 'Aus Datei geladen.');
        zeichne();
      } catch(e) { melde('fehler', 'Datei nicht lesbar: ' + e.message); zeichne(); } };
    l.readAsText(f); };
  inp.click();
}

/* Der Browserspeicher hat beim Start Vorrang. Wer eine neue Startdatei neben die
   App legt, kommt sonst nicht an sie heran. */
function frischHolen() {
  if (!confirm('Der Stand aus dem Browserspeicher wird durch gaepp-daten.json ersetzt. Fortfahren?')) return;
  melde('sichert', 'Hole die Startdatei …'); zeichne();
  /* Erst holen, dann ersetzen. Der alte Stand bleibt, solange das Holen nicht geglückt ist. */
  fetch('gaepp-daten.json', { cache:'no-store' })
    .then(a => { if (!a.ok) throw new Error('HTTP ' + a.status); return a.json(); })
    .then(d => { uebernimm(d); letzterFinger = finger(); S.syncAuf = false;
      melde('lokal', 'Startdatei neu geholt.'); merke(); zeichne(); })
    .catch(e => {
      melde('fehler', 'Keine Startdatei neben der App gefunden — dein Stand ist unverändert. '
        + 'Wähle die Datei von Hand.');
      zeichne(); dateiLaden(); });
}

function csvSichern() {
  const js = jahre().filter(j => S.exp.jahre.indexOf(j) >= 0);
  if (!js.length) return;
  const zell = v => { const s = String(v == null ? '' : v);
    return /[";\r\n]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s; };
  const z = a => a.map(zell).join(';');
  const erledigt = pid => MK.filter((k,m) => hakenAn(pid, m)).join(' ');
  /* Korrekturen gehoeren in den Export — sonst erklaert die Zahl sich nicht. */
  const korrText = id => { const f = findePos(id); if (!f || !f.p.korr) return '';
    const teil = [];
    ['basis','rest'].forEach(a => korrListe(f.p, a).forEach(x => {
      teil.push((a === 'basis' ? 'Vortrag ' : 'Rest ') + (x.betrag > 0 ? '+' : '')
        + x.betrag + (x.notiz ? ' ' + x.notiz : '')); }));
    return teil.join(' | '); };
  js.forEach(j => {
    const b = bau(j, true), L = [];
    L.push(z(['GÄPP V ' + VERSION, 'Budget ' + j, 'Stand ' + new Date().toLocaleDateString('de-CH')]));
    L.push('');
    L.push(z(['Ebene','Position','Basis'].concat(MK).concat(['Jahr / Rest','Erledigt','Korrektur'])));
    L.push(z(['Kennzahl','Saldo budgetiert',''].concat(b.saldo).concat([su(b.saldo),'',''])));
    L.push(z(['Kennzahl','Saldo kumuliert',''].concat(b.kum).concat([b.kum[11],'',''])));
    b.zeilen.forEach(x => {
      const eb = x.typ === 'kopf' ? 'Kategorie' : x.typ === 'gkopf' ? 'Gruppe'
        : x.typ === 'pos' ? 'Position' : 'Summe';
      L.push(z([eb, x.name, x.bs || ''].concat(x.reihe)
        .concat([x.jw, x.typ === 'pos' ? erledigt(x.id) : '',
                 x.typ === 'pos' ? korrText(x.id) : ''])));
    });
    if (S.exp.rech) {
      const gruppen = steller(j);
      L.push(''); L.push(z(['Rechnungen ' + j]));
      L.push(z(['Ebene','Rechnungssteller / Zweck','Datum','Betrag'].concat(MK)
        .concat(['Saldo','Stand','Erledigt'])));
      const tot = N12(), off = N12(), bez = N12();
      let tb = 0, ob = 0, bb = 0, ts = 0;
      gruppen.forEach(g => {
        const liste = g.rechnungen || [], mon = N12();
        let bet = 0, sal = 0;
        liste.forEach(r => { bet += r.betrag; sal += r.betrag - su(r.reihe);
          (r.reihe||[]).forEach((v,m) => { mon[m] += v; tot[m] += v;
            if (r.stand === 'Bezahlt') bez[m] += v; else off[m] += v; });
          if (r.stand === 'Bezahlt') bb += r.betrag; else ob += r.betrag; });
        tb += bet; ts += sal;
        L.push(z(['Steller', g.name, '', bet].concat(mon).concat([sal,'',''])));
        liste.forEach(r => L.push(z(['Rechnung', r.zweck, r.datum, r.betrag]
          .concat(r.reihe || N12())
          .concat([r.betrag - su(r.reihe), r.stand, erledigt(r.id)]))));
      });
      L.push(z(['Total','','',tb].concat(tot).concat([ts,'',''])));
      L.push(z(['Offen','','',ob].concat(off).concat(['','',''])));
      L.push(z(['Bezahlt','','',bb].concat(bez).concat(['','',''])));
    }
    gib('GAEPP-' + j + '.csv', '﻿' + L.join('\r\n') + '\r\n', 'text/csv;charset=utf-8');
  });
  S.exp = null; zeichne();
}

/* ---------- HTML: dieselbe Tabelle, eingefroren, eine Datei ---------- */
function htmlSichern() {
  const js = jahre().filter(j => S.exp.jahre.indexOf(j) >= 0);
  if (!js.length) return;
  const alt = { jahr:S.jahr, ansicht:S.ansicht, alleWas:S.alleWas, auf:S.auf.slice() };
  const ids = [];
  jahre().forEach(j => (S.daten[j]||[]).forEach(b => { ids.push(b.id);
    if (b.art === 'schulden') (b.gruppen||[]).forEach(g => ids.push(g.id)); }));
  jahre().forEach(j => (S.rechnungen[j]||[]).forEach(g => ids.push(g.id)));
  S.auf = ids;

  const vid = (j,a) => 'v-' + (a.indexOf('alle') === 0 ? a : j + '-' + a);
  const sicht = [];
  const mach = (j, a) => {
    S.jahr = j;
    if (a.indexOf('alle') === 0) { S.ansicht = 'alle';
      S.alleWas = a === 'alle-rechnung' ? 'rechnung' : 'budget'; }
    else S.ansicht = a;
    const d = document.createElement('div');
    d.innerHTML = '<div class="leiste">' + leiste() + '</div>' + band()
      + '<div class="blatt">' + blatt() + '</div>'
      + '<div class="fusszeile">' + fusszeile() + '</div>';
    /* Eingabefelder werden Text mit denselben Stilen; was ändern würde, fällt weg. */
    d.querySelectorAll('input').forEach(i => { const s = document.createElement('span');
      s.setAttribute('class', i.getAttribute('class') || '');
      /* Der eigene Stil des Feldes wandert mit — sonst verliert der fett gesetzte
         Name des Rechnungsstellers im eingefrorenen Blatt seine Staerke. */
      s.setAttribute('style', 'display:inline-block;border-color:transparent;background:none;'
        + (i.className.indexOf('zelle') >= 0 || i.className.indexOf('datum') >= 0 ? 'text-align:right;' : '')
        + 'padding:3px 4px;' + (i.getAttribute('style') || ''));
      s.textContent = i.value; i.parentNode.replaceChild(s, i); });
    /* Im eingefrorenen Blatt tut ein Doppelklick nichts — der Hinweis muss weg. */
    d.querySelectorAll('.mkorr').forEach(x => x.setAttribute('title', 'Manuell angepasst'));
    d.querySelectorAll('select').forEach(sel => { const s = document.createElement('span');
      s.setAttribute('style', (sel.getAttribute('style')||'') + ';padding:2px 4px');
      const o = sel.options[sel.selectedIndex]; s.textContent = o ? o.text : '';
      sel.parentNode.replaceChild(s, sel); });
    d.querySelectorAll('.werkzeug,.plus,.neusteller,[data-exp],[data-drucken],[data-theme],'
      + '[data-nullen],[data-sync-auf],[data-neu-jahr],[data-theme-um],[data-weg-jahr],'
      + '[data-hb]').forEach(x => x.remove());
    d.querySelectorAll('[data-klapp]').forEach(b => { b.removeAttribute('data-klapp'); });
    d.querySelectorAll('.chev').forEach(c => c.setAttribute('data-chev','1'));
    d.querySelectorAll('[data-alle-um]').forEach(b => { b.textContent = 'Alles zuklappen'; });
    d.setAttribute('data-view','1'); d.setAttribute('data-zu','0'); d.id = vid(j,a);
    sicht.push({ id:d.id, jahr:j, ansicht:a, el:d });
  };
  js.forEach(j => { mach(j,'budget'); if (S.exp.rech) mach(j,'rechnung'); });
  if (js.length > 1) { mach(js[0], 'alle-budget'); if (S.exp.rech) mach(js[0], 'alle-rechnung'); }
  S.jahr = alt.jahr; S.ansicht = alt.ansicht; S.alleWas = alt.alleWas; S.auf = alt.auf;

  const hat = id => sicht.some(s => s.id === id);
  const istAlle = a => a.indexOf('alle') === 0;
  /* Die Datei oeffnet mit der Ansicht, aus der heraus gesichert wurde — nicht mit
     dem ersten Jahrgang der Liste, der oft ein leeres Geruest ist. */
  const gewuenscht = alt.ansicht === 'alle' ? vid(null, 'alle-' + alt.alleWas)
                                            : vid(alt.jahr, alt.ansicht);
  const start = hat(gewuenscht) ? gewuenscht : sicht[0].id;
  sicht.forEach(s => {
    s.el.querySelectorAll('[data-geh-jahr]').forEach(b => {
      const j = parseInt(b.dataset.gehJahr,10);
      const a = istAlle(s.ansicht) ? 'budget' : s.ansicht;
      const ziel = hat(vid(j,a)) ? vid(j,a) : vid(j,'budget');
      if (hat(ziel)) b.setAttribute('data-ziel', ziel); else b.remove(); });
    s.el.querySelectorAll('[data-geh-ansicht]').forEach(b => {
      const w = b.dataset.gehAnsicht;
      const ziel = istAlle(s.ansicht) ? vid(null, 'alle-' + w) : vid(s.jahr, w);
      if (hat(ziel)) b.setAttribute('data-ziel', ziel); else b.remove(); });
    s.el.querySelectorAll('[data-geh-alle]').forEach(b => {
      const w = istAlle(s.ansicht) ? s.ansicht : 'alle-' + s.ansicht;
      const ziel = hat(vid(null,w)) ? vid(null,w) : vid(null,'alle-budget');
      if (hat(ziel)) b.setAttribute('data-ziel', ziel); else b.remove(); });
    if (s.id !== start) s.el.style.display = 'none';
  });

  const css = document.querySelector('style').textContent;
  const skript = '<' + 'script>(function(){'
    /* Die Klebehoehen der Saldozeilen stehen erst fest, wenn die Ansicht sichtbar ist. */
    + 'function kleb(v){var t=v.querySelector("thead th");if(!t)return;'
    + 'var o=Math.round(t.getBoundingClientRect().height);'
    + '[].slice.call(v.querySelectorAll("tr.saldo")).forEach(function(r){'
    + '[].slice.call(r.querySelectorAll("td")).forEach(function(c){c.style.top=o+"px";});'
    + 'o+=Math.round(r.getBoundingClientRect().height);});}'
    + 'function zeige(id){[].slice.call(document.querySelectorAll("[data-view]")).forEach('
    + 'function(v){v.style.display=(v.id===id)?"":"none";if(v.id===id)kleb(v);});}'
    + '[].slice.call(document.querySelectorAll("[data-ziel]")).forEach(function(b){'
    + 'b.addEventListener("click",function(e){e.preventDefault();zeige(b.getAttribute("data-ziel"));});});'
    + 'function kinder(w,id){return [].slice.call(w.querySelectorAll(\'tr[data-p="\'+id+\'"]\'));}'
    + 'function zu(w,id,aus){kinder(w,id).forEach(function(tr){tr.style.display=aus?"none":"";'
    + 'var k=tr.getAttribute("data-k");if(k){var c=tr.querySelector("[data-chev]");'
    + 'if(aus){zu(w,k,true);}else if(c&&c.textContent.indexOf("\\u25b8")>=0){zu(w,k,true);}}});}'
    + '[].slice.call(document.querySelectorAll("tr[data-k]")).forEach(function(tr){'
    + 'tr.style.cursor="pointer";tr.addEventListener("click",function(){'
    + 'var w=tr.closest("[data-view]")||document;var k=tr.getAttribute("data-k");'
    + 'var c=tr.querySelector("[data-chev]");if(!c)return;'
    + 'var auf=c.textContent.indexOf("\\u25be")>=0;c.textContent=auf?"\\u25b8":"\\u25be";zu(w,k,auf);});});'
    + '[].slice.call(document.querySelectorAll("[data-alle-um]")).forEach(function(b){'
    + 'b.addEventListener("click",function(){var w=b.closest("[data-view]");if(!w)return;'
    + 'var z=w.getAttribute("data-zu")==="1";w.setAttribute("data-zu",z?"0":"1");'
    + '[].slice.call(w.querySelectorAll(\'tr[data-p]:not([data-p=""])\')).forEach(function(tr){'
    + 'tr.style.display=z?"":"none";});'
    + '[].slice.call(w.querySelectorAll("[data-chev]")).forEach(function(c){c.textContent=z?"\\u25be":"\\u25b8";});'
    + 'b.textContent=z?"Alles zuklappen":"Alles aufklappen";});});'
    + '[].slice.call(document.querySelectorAll("[data-view]")).forEach(function(v){'
    + 'if(v.style.display!=="none")kleb(v);});'
    + '})();</' + 'script>';
  const huelle = document.createElement('div');
  sicht.forEach(s => huelle.appendChild(s.el));
  const html = '<!DOCTYPE html><html lang="de-CH" data-theme="' + S.theme + '"><head><meta charset="utf-8">'
    + '<title>GÄPP · ' + js.join(', ') + '</title>'
    + '<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700'
    + '&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">'
    + '<style>' + css
    + '[data-view]{display:flex;flex-direction:column;height:100vh}'
    + '.stempel{position:fixed;right:14px;bottom:12px;z-index:20;'
    + "font:400 11px/1.4 'Space Grotesk',sans-serif;color:var(--chrome);background:var(--card);"
    + 'border:1px solid var(--line);border-radius:8px;padding:6px 10px}[data-ziel]{cursor:pointer}</style>'
    + '</head><body>' + huelle.innerHTML
    + '<div class="stempel">GÄPP V ' + VERSION + ' · eingefrorener Stand vom '
    + new Date().toLocaleDateString('de-CH') + ' · nur lesen</div>' + skript + '</body></html>';
  gib('GAEPP-' + js.join('-') + '.html', html, 'text/html');
  S.exp = null; zeichne();
}

/* ==================================================== Bedienung */
function daten(el, name) { let n = el; while (n && n !== document) {
  if (n.dataset && n.dataset[name] !== undefined) return n; n = n.parentNode; } return null; }

/* Wer ein Fenster schliesst, will dort weitermachen, wo er es geoeffnet hat —
   sonst liegt der Fokus danach auf nichts, und die naechste Taste geht ins Leere. */
function dialogFokus(was) {
  if (was === 'ueb' && S.ueb)
    fokusWunsch = '.zelle[data-z="' + S.ueb.id + '"][data-m="' + S.ueb.m + '"]';
  else if (was === 'basis' && S.basis)
    fokusWunsch = '.zelle[data-b="' + S.basis.id + '"]';
}

document.addEventListener('click', e => {
  const t = e.target;
  const tref = n => daten(t, n);
  let x;
  /* Der Wechsel zwischen einem Jahr und «Alle» behaelt, worauf man gerade schaut —
     wer in den Rechnungen ist, landet in «Alle» auch in den Rechnungen. */
  if ((x = tref('gehJahr')))    { S.jahr = parseInt(x.dataset.gehJahr,10);
                                  if (S.ansicht === 'alle') S.ansicht = S.alleWas; return neu(); }
  if ((x = tref('gehAnsicht'))) { if (S.ansicht === 'alle') S.alleWas = x.dataset.gehAnsicht;
                                  else S.ansicht = x.dataset.gehAnsicht; return neu(); }
  if ((x = tref('hb')))         { S.hb = true; return zeichne(); }
  if ((x = tref('basisTat')))   { return basisTat(x.dataset.basisTat); }
  if ((x = tref('korrRicht')))  { if (S.korr) S.korr.richtung = x.dataset.korrRicht; return zeichne(); }
  if ((x = tref('korrAdd')))    { return korrHinzu(); }
  if ((x = tref('korrWeg')))    { return korrWeg(x.dataset.korrWeg); }
  if ((x = tref('korrWarn')))   { return korrWarnAntwort(x.dataset.korrWarn); }
  if ((x = tref('gehAlle')))    { if (S.ansicht !== 'alle') S.alleWas = S.ansicht;
                                  S.ansicht = 'alle'; return neu(); }
  if ((x = tref('klapp')))      { const id = x.dataset.klapp;
                                  S.auf = offen(id) ? S.auf.filter(y => y !== id) : S.auf.concat([id]); return neu(); }
  if ((x = tref('alleUm')))     { if (S.auf.length) S.auf = []; else {
                                    const ids = []; jahre().forEach(j => (S.daten[j]||[]).forEach(b => { ids.push(b.id);
                                      if (b.art === 'schulden') (b.gruppen||[]).forEach(g => ids.push(g.id)); }));
                                    jahre().forEach(j => (S.rechnungen[j]||[]).forEach(g => ids.push(g.id)));
                                    S.auf = ids; } return neu(); }
  if ((x = tref('nullen')))     { S.nullen = !S.nullen; return neu(); }
  if ((x = tref('themeUm')))    { S.theme = S.theme === 'hell' ? 'dunkel' : 'hell'; return neu(); }
  if ((x = tref('drucken')))    { window.print(); return; }
  if ((x = tref('exp')))        { S.exp = { jahre: S.ansicht === 'alle' ? jahre() : [S.jahr], rech:true }; return zeichne(); }
  if ((x = tref('expJahr')))    { const j = parseInt(x.dataset.expJahr,10);
                                  S.exp.jahre = S.exp.jahre.indexOf(j) >= 0 ? S.exp.jahre.filter(y => y !== j)
                                    : S.exp.jahre.concat([j]); return zeichne(); }
  if ((x = tref('expRech')))    { S.exp.rech = !S.exp.rech; return zeichne(); }
  if ((x = tref('expCsv')))     return csvSichern();
  if ((x = tref('expHtml')))    return htmlSichern();
  if ((x = tref('laden')))      return dateiLaden();
  if ((x = tref('vergiss')))    { try { localStorage.removeItem(SCHLUESSEL);
                                    localStorage.removeItem(SCHLUESSEL + '.ansicht'); } catch(err) {}
                                  location.reload(); return; }
  if ((x = tref('syncAuf')))    { S.syncAuf = true; return zeichne(); }
  if ((x = tref('repoHolen')))  return repoLesen();
  if ((x = tref('repoSichern'))){ return insRepo(); }
  if ((x = tref('zu')))         { dialogFokus(x.dataset.zu);
                                  S[x.dataset.zu === 'sync' ? 'syncAuf' : x.dataset.zu] =
                                    x.dataset.zu === 'sync' ? false : null; return zeichne(); }
  if ((x = tref('schleier')) && t === x) { dialogFokus(x.dataset.schleier);
                                    S.ueb = null; S.neu = null; S.exp = null;
                                    S.wegJahr = null; S.syncAuf = false; S.hb = false;
                                    S.korr = null; S.korrWarn = null; S.basis = null;
                                    wartetTat = null; return zeichne(); }
  if ((x = tref('neuJahr')))    { S.neu = { jahr: Math.max.apply(null, jahre()) + 1, budget:true, raten:false }; return zeichne(); }
  if ((x = tref('wegJahrAn')))  { jahrLoeschen(S.wegJahr); return neu(); }
  if ((x = tref('wegJahr')))    { S.wegJahr = S.jahr; return zeichne(); }
  if ((x = tref('jsonSichern')))return jsonSichern();
  if ((x = tref('frisch')))     return frischHolen();
  if ((x = tref('neuBudget')))  { S.neu.budget = !S.neu.budget; return zeichne(); }
  if ((x = tref('neuRaten')))   { S.neu.raten = !S.neu.raten; return zeichne(); }
  if ((x = tref('neuAn')))      { jahrAnlegen(); return neu(); }
  if ((x = tref('uebFolge')))   { S.ueb.folge = !S.ueb.folge; return zeichne(); }
  if ((x = tref('uebAn')))      { uebertragen(); return neu(); }
  if ((x = tref('neuPos')))     { e.stopPropagation(); return neuePos(x.dataset.neuPos); }
  if ((x = tref('weg')))        { return loeschePos(x.dataset.weg); }
  if ((x = tref('neuSteller'))) { return neuerSteller(); }
  if ((x = tref('neuRech')))    { e.stopPropagation(); return neueRechnung(x.dataset.neuRech); }
  if ((x = tref('wegRech')))    { return loescheRechnung(x.dataset.wegRech); }
  if ((x = tref('wegSteller'))) { e.stopPropagation(); return loescheSteller(x.dataset.wegSteller); }
});

/* ---------- Werte tippen: neu gerechnet wird beim Verlassen der Zelle ---------- */
document.addEventListener('change', e => {
  const d = e.target.dataset || {};
  /* Die Felder im Korrekturfenster zuerst — sie tragen eigene Kennungen. */
  if (d.korrBetrag !== undefined) { if (S.korr) S.korr.betrag = e.target.value; return; }
  if (d.korrNotiz !== undefined)  { if (S.korr) S.korr.notiz = e.target.value; return; }
  if (d.korrB !== undefined)      { return korrBetrag(d.korrB, e.target.value); }
  if (d.korrN !== undefined)      { return korrNotiz(d.korrN, e.target.value); }
  if (d.z !== undefined && d.m !== undefined) {
    const w = zahl(e.target.value);
    mitPos(d.z, p => { p.reihe[+d.m] = w; });
    /* Eine Marke ohne Betrag waere unsichtbar und wuerde wieder wirken, sobald
       dort erneut eine Zahl steht. Sie faellt mit dem Betrag. */
    if (w === 0) delete S.haken[d.z + ':' + d.m];
    merke(); return neu(); }
  if (d.b !== undefined) {
    mitPos(d.b, p => { p.basis = zahl(e.target.value); }); return neu(); }
  if (d.p !== undefined && e.target.className.indexOf('namensfeld') >= 0) {
    mitPos(d.p, p => { p.name = e.target.value; schluesselNachziehen(p); }); return neu(); }
  if (d.rm !== undefined && d.m !== undefined) {
    const w = zahl(e.target.value);
    inRechnung(d.rm, r => { r.reihe[+d.m] = w; });
    if (w === 0) delete S.haken[d.rm + ':' + d.m];
    merke(); return neu(); }
  if (d.r !== undefined && d.f) {
    inRechnung(d.r, r => { r[d.f] = d.f === 'betrag' ? zahl(e.target.value) : e.target.value; }); return neu(); }
  if (d.s !== undefined && e.target.className.indexOf('namensfeld') >= 0) {
    (S.rechnungen[S.jahr]||[]).forEach(g => { if (g.id === d.s) g.name = e.target.value; });
    merke(); return neu(); }
  if (d.sc) { setzeConf(d.sc, e.target.value); melde(syncConf().token && syncConf().repo ? 'lokal' : 'nicht verbunden',
    'Anbindung geändert.'); return; }
  if (d.uebWert !== undefined) { S.ueb.wert = zahl(e.target.value); return; }
  if (d.uebVon !== undefined)  { S.ueb.von = parseInt(e.target.value,10); return zeichne(); }
  if (d.uebBis !== undefined)  { S.ueb.bis = parseInt(e.target.value,10); return zeichne(); }
  if (d.neuJahrWert !== undefined) { S.neu.jahr = parseInt(e.target.value,10) || S.neu.jahr; return; }
});

/* ---------- Tab: eine Zelle weiter, am Zeilenende in die nächste Zeile ----------
   Nötig, weil das Übernehmen eines Werts die Tabelle neu zeichnet: der Browser
   hätte den Fokus dann auf ein Feld gesetzt, das es nicht mehr gibt. */
const TIPPBAR = '#blatt .zelle,#blatt .namensfeld,#blatt .datumsfeld,#blatt .stand';
function kennung(el) {
  const d = el.dataset || {}, teile = [];
  ['z','b','rm','r','s','p','f','m'].forEach(k => {
    if (d[k] !== undefined) teile.push('[data-' + k + '="' + String(d[k]).replace(/"/g,'\\"') + '"]'); });
  if (!teile.length) return null;
  return teile.join('') + '.' + String(el.className).trim().split(/\s+/)[0];
}
/* Erst die Kennung des Ziels merken, dann uebernehmen (das zeichnet neu), dann
   das Feld an der Zielstelle suchen — das alte gibt es danach nicht mehr. */
function springeZu(el, ziel) {
  const marke = kennung(ziel);
  el.dispatchEvent(new Event('change', { bubbles: true }));
  zeichneJetztFalls();     /* die Taste wartet nicht — hier wird sofort gezeichnet */
  const frisch = marke ? document.querySelector(marke) : null;
  const nimm = frisch || ziel;
  if (!nimm || !nimm.isConnected) return;
  nimm.focus();
  if (nimm.select) { try { nimm.select(); } catch(err) {} }
}
document.addEventListener('keydown', e => {
  if (e.key !== 'Tab' || e.altKey || e.ctrlKey || e.metaKey) return;
  const el = e.target;
  if (!el || !el.matches || !el.matches(TIPPBAR)) return;
  const felder = Array.prototype.slice.call(document.querySelectorAll(TIPPBAR));
  const i = felder.indexOf(el);
  if (i < 0) return;
  const ziel = felder[i + (e.shiftKey ? -1 : 1)];
  if (!ziel) return;
  e.preventDefault();
  springeZu(el, ziel);
});

/* ---------- Pfeil rauf und runter: dieselbe Spalte, die naechste Zeile ------
   Gemessen wird ueber die Spaltennummer der Zelle, nicht ueber die Reihenfolge
   der Felder — sonst liefe der Sprung quer durch die Zeile. */
const TIPPBARROH = '.zelle,.namensfeld,.datumsfeld';
function spaltenNachbar(el, richtung) {
  const td = el.closest('td'), tr = el.closest('tr');
  if (!td || !tr) return null;
  const sp = td.cellIndex;
  const tab = tr.closest('table'); if (!tab) return null;
  const zeilen = Array.prototype.slice.call(tab.querySelectorAll('tr'));
  const i = zeilen.indexOf(tr); if (i < 0) return null;
  for (let k = i + richtung; k >= 0 && k < zeilen.length; k += richtung) {
    const z = zeilen[k].cells ? zeilen[k].cells[sp] : null;
    if (!z) continue;
    const f = z.querySelector(TIPPBARROH);
    if (f) return f;
  }
  return null;
}
document.addEventListener('keydown', e => {
  if (e.key !== 'ArrowUp' && e.key !== 'ArrowDown') return;
  if (e.altKey || e.ctrlKey || e.metaKey || e.shiftKey) return;
  const el = e.target;
  if (!el || !el.matches || !el.matches(TIPPBAR)) return;
  /* Im Auswahlfeld «Stand» gehoeren die Pfeile der Auswahl selbst. */
  if (el.matches('.stand')) return;
  const ziel = spaltenNachbar(el, e.key === 'ArrowDown' ? 1 : -1);
  if (!ziel) return;
  e.preventDefault();
  springeZu(el, ziel);
});

/* ---------- Escape schliesst das oberste Fenster ---------- */
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (!(S.ueb || S.neu || S.exp || S.wegJahr || S.syncAuf || S.korr || S.korrWarn
        || S.basis || S.hb)) return;
  e.preventDefault();
  if (S.korrWarn) return korrWarnAntwort('ab');
  dialogFokus(S.ueb ? 'ueb' : (S.basis ? 'basis' : ''));
  S.ueb = null; S.neu = null; S.exp = null; S.wegJahr = null; S.syncAuf = false;
  S.korr = null; S.basis = null; S.hb = false; wartetTat = null;
  zeichne();
});

/* ---------- Am Griff verschieben Pfeil rauf und runter die Zeile ---------- */
document.addEventListener('keydown', e => {
  if (e.key !== 'ArrowUp' && e.key !== 'ArrowDown') return;
  const g = e.target && e.target.dataset ? e.target.dataset.griff : undefined;
  if (g === undefined) return;
  e.preventDefault();
  verschiebeUm(g, e.key === 'ArrowDown' ? 1 : -1);
});

/* ---------- Rechtsklick: Monat erledigt / Rechnung bezahlt ---------- */
document.addEventListener('contextmenu', e => {
  const d = e.target.dataset || {};
  if (d.z !== undefined && d.m !== undefined) {
    e.preventDefault();
    /* Eine leere Zelle laesst sich nicht abhaken: die Marke waere unsichtbar und
       wuerde spaeter wirken, wenn dort eine Zahl steht. */
    const f = findePos(d.z);
    if (!f || !((f.p.reihe||[])[+d.m])) return;
    const k = d.z + ':' + d.m;
    if (S.haken[k]) delete S.haken[k]; else S.haken[k] = true;
    merke(); return neu();
  }
  /* Rechnungen: derselbe Griff wie im Budget — ein Monat, ein Haken. */
  if (d.rm !== undefined && d.m !== undefined) {
    e.preventDefault();
    const m = +d.m;
    inRechnung(d.rm, r => {
      if (!((r.reihe||[])[m])) return;   /* leere Zelle: nichts abzuhaken */
      /* «Bezahlt» heisst: jeder Monat gilt als abgehakt, ohne dass ein Haken
         gesetzt waere. Wer dann einen Monat zuruecknimmt, muss die uebrigen
         Haken zuerst wirklich bekommen — sonst nimmt der Klick nichts zurueck,
         sondern setzt den einzigen Haken und loescht alle anderen Marken. */
      if (r.stand === 'Bezahlt' && !rechnungRund(r))
        (r.reihe||[]).forEach((v,i) => { if (v !== 0) S.haken[r.id + ':' + i] = true; });
      const k = r.id + ':' + m;
      if (S.haken[k]) delete S.haken[k]; else S.haken[k] = true;
      if (rechnungRund(r)) r.stand = 'Bezahlt';
      else if (r.stand === 'Bezahlt') r.stand = 'Offen';
    });
    merke(); return neu();
  }
  /* Rechtsklick auf den Betrag schaltet die ganze Rechnung um. */
  if (d.bez !== undefined) {
    e.preventDefault();
    inRechnung(d.bez, r => {
      if (r.stand === 'Bezahlt') { r.stand = 'Offen';
        Object.keys(S.haken).forEach(k => { if (k.indexOf(r.id + ':') === 0) delete S.haken[k]; });
      } else r.stand = 'Bezahlt';
    });
    return neu();
  }
});

/* ---------- Doppelklick: übertragen, verteilen, korrigieren ---------- */
document.addEventListener('dblclick', e => {
  const d = e.target.dataset || {};
  if (d.z !== undefined && d.m !== undefined) {
    const f = findePos(d.z); if (!f) return;
    const m = +d.m;
    S.ueb = { id:d.z, jahr:S.jahr, m, von:m, bis:11, folge:false, wert:f.p.reihe[m], name:f.p.name };
    return zeichne();
  }
  let x;
  /* Basis oder Rest einer Schuld: das Korrekturfenster. */
  if ((x = daten(e.target, 'kb'))) { e.preventDefault(); return korrOeffnen(x.dataset.kb, 'basis'); }
  if ((x = daten(e.target, 'kr'))) { e.preventDefault(); return korrOeffnen(x.dataset.kr, 'rest'); }
  /* Basis ausserhalb der Schulden: uebertragen oder verteilen. */
  if ((x = daten(e.target, 'bs'))) {
    e.preventDefault();
    const id = x.dataset.bs, f = findePos(id); if (!f) return;
    const blk = (S.daten[S.jahr]||[]).find(b => (b.pos||[]).some(p => p.id === id));
    S.basis = { id, name:f.p.name, wert:f.p.basis || 0, verteilen: istRueckstellung(blk) };
    return zeichne();
  }
});

/* ---------- Ziehen: nur innerhalb derselben Sektion ---------- */
document.addEventListener('dragstart', e => {
  const g = daten(e.target, 'griff'); if (!g) { e.preventDefault(); return; }
  S.zieht = g.dataset.griff; S.ziel = null;
  if (e.dataTransfer) { e.dataTransfer.effectAllowed = 'move';
    try { e.dataTransfer.setData('text/plain', S.zieht); } catch(err) {} }
});
document.addEventListener('dragover', e => {
  const tr = daten(e.target, 'id'); if (!tr || tr.tagName !== 'TR' || !S.zieht) return;
  const id = tr.dataset.id; if (id === S.zieht) return;
  const a = findePos(S.zieht), b = findePos(id);
  if (!a || !b || a.eltern !== b.eltern) return;
  e.preventDefault();
  if (S.ziel === id) return;
  S.ziel = id;
  /* Hier wird NICHT neu gezeichnet: das Neuzeichnen loescht den Griff, an dem
     gerade gezogen wird, und Chromium bricht den Zug ab, sobald die Quelle aus
     dem Dokument verschwindet — «drop» kam dann nie an. Die Marke wird von Hand
     gesetzt, das Blatt bleibt stehen. */
  document.querySelectorAll('tr.ziel').forEach(x => x.classList.remove('ziel'));
  tr.classList.add('ziel');
});
document.addEventListener('drop', e => {
  const tr = daten(e.target, 'id'); if (!tr || tr.tagName !== 'TR') return;
  e.preventDefault(); verschiebe(S.zieht, tr.dataset.id);
  S.zieht = null; S.ziel = null; neu();
});
document.addEventListener('dragend', () => { S.zieht = null; S.ziel = null; zeichne(); });

/* ---------- Zeilen anlegen und löschen ---------- */
function neuePos(ziel) {
  const frisch = { id:neueId(), key:'neu' + ZAEHLER, name:'Neue Zeile', basis:0, reihe:N12() };
  let rein = false;
  (S.daten[S.jahr]||[]).forEach(b => {
    if (b.id === ziel && b.art === 'block') { b.pos.push(frisch); rein = true; }
    if (b.art === 'schulden') {
      if (b.id === ziel && (b.gruppen||[]).length) { b.gruppen[0].pos.push(frisch); rein = true; }
      (b.gruppen||[]).forEach(g => { if (g.id === ziel) { g.pos.push(frisch); rein = true; } });
    }
  });
  if (!rein) return;
  if (!offen(ziel)) S.auf = S.auf.concat([ziel]);
  fokusWunsch = '.namensfeld[data-p="' + frisch.id + '"]';
  merke(); neu();
}
/* Eine von Hand eingefuegte Zeile traegt zunaechst einen Verlegenheitsschluessel
   («neu17»). Beim Benennen wird daraus der Schluessel aus dem Namen — dann findet
   dieselbe Schuld ueber die Jahrgaenge von selbst zusammen, statt in jedem Jahr
   eine neue zu sein. Ein in derselben Liste schon vergebener Schluessel bleibt
   unangetastet: zwei Zeilen duerfen nicht auf denselben Vortrag zeigen. */
function schluesselNachziehen(p) {
  if (!/^neu\d+$/.test(String(p.key || ''))) return;
  const neuKey = slug(p.name); if (!neuKey) return;
  /* Geprueft wird der ganze Jahrgang, nicht nur die eigene Liste: zwei Zeilen mit
     demselben Schluessel in verschiedenen Kategorien waeren eine Falle. */
  let belegt = false;
  (S.daten[S.jahr]||[]).forEach(b => {
    const listen = b.art === 'schulden' ? (b.gruppen||[]).map(g => g.pos||[]) : [b.pos||[]];
    listen.forEach(L => L.forEach(x => { if (x !== p && x.key === neuKey) belegt = true; }));
  });
  if (!belegt) p.key = neuKey;
}

/* Nur im gezeigten Jahrgang. Eine Schuld, die 2027 erledigt ist, bleibt in den
   Vorjahren stehen — dort ist sie ja gelaufen. */
function loeschePos(id) {
  (S.daten[S.jahr]||[]).forEach(b => {
    if (b.art === 'schulden') (b.gruppen||[]).forEach(g => { g.pos = (g.pos||[]).filter(p => p.id !== id); });
    else b.pos = (b.pos||[]).filter(p => p.id !== id); });
  /* Erledigt-Marken gehen mit, sonst wachsen Karteileichen. */
  Object.keys(S.haken).forEach(k => { if (k.indexOf(id + ':') === 0) delete S.haken[k]; });
  merke(); neu();
}
function inRechnung(id, fn) {
  (S.rechnungen[S.jahr]||[]).forEach(g => (g.rechnungen||[]).forEach(r => { if (r.id === id) fn(r); }));
  merke();
}
function neuerSteller() {
  const g = { id:neueId(), name:'Neuer Rechnungssteller', rechnungen:[] };
  S.rechnungen[S.jahr] = (S.rechnungen[S.jahr]||[]).concat([g]);
  S.auf = S.auf.concat([g.id]);
  fokusWunsch = '.namensfeld[data-s="' + g.id + '"]';
  merke(); neu();
}
function neueRechnung(gid) {
  let neueRid = null;
  (S.rechnungen[S.jahr]||[]).forEach(g => { if (g.id !== gid) return;
    neueRid = neueId();
    g.rechnungen = (g.rechnungen||[]).concat([{ id:neueRid, zweck:'Neue Rechnung', datum:'',
      betrag:0, reihe:N12(), stand:'Offen' }]); });
  if (!offen(gid)) S.auf = S.auf.concat([gid]);
  if (neueRid) fokusWunsch = '.namensfeld[data-r="' + neueRid + '"][data-f="zweck"]';
  merke(); neu();
}
function loescheRechnung(id) {
  (S.rechnungen[S.jahr]||[]).forEach(g => { g.rechnungen = (g.rechnungen||[]).filter(r => r.id !== id); });
  Object.keys(S.haken).forEach(k => { if (k.indexOf(id + ':') === 0) delete S.haken[k]; });
  merke(); neu();
}
function loescheSteller(id) {
  (S.rechnungen[S.jahr]||[]).forEach(g => { if (g.id !== id) return;
    (g.rechnungen||[]).forEach(r => Object.keys(S.haken).forEach(k => {
      if (k.indexOf(r.id + ':') === 0) delete S.haken[k]; })); });
  S.rechnungen[S.jahr] = (S.rechnungen[S.jahr]||[]).filter(g => g.id !== id);
  merke(); neu();
}
function neu() { anzeigeMerken(); zeichneBald(); }

/* ==================================================== Start */
(function start() {
  try { const a = JSON.parse(localStorage.getItem(SCHLUESSEL + '.ansicht') || '{}');
    if (a.theme) S.theme = a.theme;
    if (a.ansicht) S.ansicht = a.ansicht;
    if (a.alleWas) S.alleWas = a.alleWas;
    if (a.nullen != null) S.nullen = a.nullen;
    if (Array.isArray(a.auf)) S.auf = a.auf;
    if (a.jahr) S.jahr = a.jahr;
  } catch(e) {}

  let da = false;
  try { const roh = localStorage.getItem(SCHLUESSEL);
    if (roh) { uebernimm(JSON.parse(roh)); letzterFinger = finger(); da = true;
      melde('lokal', 'Aus dem Browserspeicher.'); }
  } catch(e) {}

  zeichne();

  if (!da) {
    /* Beim ersten Start die Datei neben der App holen — auf GitHub Pages klappt das. */
    fetch('gaepp-daten.json', { cache:'no-store' })
      .then(a => { if (!a.ok) throw new Error('HTTP ' + a.status); return a.json(); })
      .then(d => { uebernimm(d); letzterFinger = finger();
        melde('lokal', 'Startdatei geladen.'); merke(); zeichne(); })
      .catch(() => { melde('nicht verbunden', 'Keine Datendatei gefunden.'); zeichne(); });
  }
})();
</script>
