<!DOCTYPE html>
<html lang="de-CH" data-theme="dunkel">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GÄPP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#1c1f23;--card:#23272c;--soft:#2b3036;--line:#2e3338;--rule:#3d444b;--ink:#edf0f2;
 --muted:#98a0a8;--chrome:#9aa2aa;--accent:#e6eaee;--onaccent:#1c1f23;--gruen:#8ec9a8;--flaeche:#4a5259;
 --gitter:#4f5760;--zebra:#16191d}
[data-theme="hell"]{--bg:#eceef0;--card:#f8f9fa;--soft:#e1e4e7;--line:#dcdfe3;--rule:#c1c6cc;--ink:#1a1e22;
 --muted:#5e656c;--chrome:#525862;--accent:#2b3137;--onaccent:#f8f9fa;--gruen:#1c6b46;--flaeche:#a8afb6;
 --gitter:#bcc3ca;--zebra:#e2e5e8}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg)}
body{font-family:'Space Grotesk',system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;
 height:100vh;overflow:hidden;display:flex;flex-direction:column}
input,select,button{font-family:inherit}

/* ---------- Leiste ---------- */
.leiste{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:14px 22px;
 border-bottom:1px solid var(--line);background:var(--card)}
.wort{font:700 18px/1 'Space Grotesk',sans-serif;letter-spacing:.02em;color:var(--ink)}
.gruppe{display:flex;align-items:center;gap:2px;background:var(--soft);border:1px solid var(--rule);
 border-radius:10px;padding:3px}
.gruppe button{background:none;border:none;border-radius:8px;padding:7px 15px;cursor:pointer;
 font:500 12.5px/1 'Space Grotesk',sans-serif;color:var(--muted)}
.gruppe button.mono{font-family:'IBM Plex Mono',monospace}
.gruppe button.an{background:var(--accent);color:var(--onaccent);font-weight:600}
.gruppe .trenn{width:1px;height:18px;background:var(--rule);margin:0 3px}
.rechts{margin-left:auto;display:flex;align-items:center;gap:7px}
.knopf{background:none;border:1px solid var(--rule);border-radius:9px;padding:7px 12px;cursor:pointer;
 font:500 11.5px/1 'Space Grotesk',sans-serif;color:var(--muted)}
.knopf:hover{color:var(--ink)}
.knopf.hell{color:var(--ink)}
.knopf.hell:hover{background:var(--soft)}
.punkt{width:9px;height:9px;border-radius:50%;background:var(--rule);flex:none}
.punkt[data-s="lokal"]{background:var(--muted)}
.punkt[data-s="sichert"]{background:var(--chrome)}
.punkt[data-s="gesichert"]{background:var(--gruen)}
.punkt[data-s="fehler"]{background:#e0a08d}

/* ---------- Kennzahlenband ---------- */
.band{display:flex;gap:1px;background:var(--line);border-bottom:1px solid var(--line)}
.band>span{flex:1;background:var(--card);padding:13px 22px;display:flex;flex-direction:column;gap:6px}
.band .k{font:500 9.5px/1 'IBM Plex Mono',monospace;letter-spacing:.13em;text-transform:uppercase;color:var(--muted)}
.band .v{font:500 21px/1 'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums}
.band .m{font:400 11.5px/1.4 'Space Grotesk',sans-serif;color:var(--chrome)}

/* ---------- Tabelle ---------- */
.blatt{flex:1;min-height:0;overflow:auto;padding:0 0 34px}
table{border-collapse:separate;border-spacing:0;font-variant-numeric:tabular-nums;
 width:100%;table-layout:fixed}
th{position:sticky;top:0;z-index:4;background:var(--card);border-bottom:1px solid var(--rule);
 padding:11px 8px;text-align:right;font:600 10px/1 'IBM Plex Mono',monospace;letter-spacing:.08em;
 text-transform:uppercase;color:var(--muted);white-space:nowrap}
th.ecke{left:0;z-index:5;text-align:left;border-right:1px solid var(--line);padding:11px 14px;letter-spacing:.11em}
th.jahr{border-left:1px solid var(--line);padding:11px 14px;color:var(--ink);letter-spacing:.11em}
td{padding:6px 8px;text-align:right;font:400 12px/1.25 'IBM Plex Mono',monospace;color:var(--ink);
 white-space:nowrap;border-top:1px dotted var(--gitter);border-right:1px dotted var(--gitter)}
tr td:last-child{border-right:none}
td.name{position:sticky;left:0;z-index:1;border-right:1px solid var(--rule);text-align:left;
 padding-right:12px;font-family:'Space Grotesk',sans-serif;overflow:hidden}
td.jahr{border-left:1px solid var(--line);padding-right:14px}
tr.kopf td{background:var(--card);font-weight:600}
tr.kopf td.name{background:var(--card)}
tr.pos td.name,tr.gkopf td.name,tr.summe td.name{background:var(--bg)}
tr.kopf td.name,tr.stark td.name{background:var(--card)}
tr.stark td{background:var(--card);font-weight:600}
/* Zebra zaehlt innerhalb der Sektion, nicht ueber die ganze Tabelle. */
tr.pos.zebra td,tr.pos.zebra td.name{background:var(--zebra)}
.gruen{color:var(--gruen)}
tr.pos td.abgehakt{background:var(--soft);font-weight:600}

/* Die beiden Saldozeilen tragen das Ergebnis — sie duerfen groesser sein. */
tr.saldo td{font-size:13px;padding-top:12px;padding-bottom:12px}
tr.saldo td.name{font:600 14.5px/1.2 'Space Grotesk',sans-serif;letter-spacing:.01em}
tr.saldo.stark td.name{font-weight:700}
tr.saldo.stark td{font-size:14px}
thead tr.saldo td{position:sticky;z-index:4;background:var(--card)}
thead tr.saldo td.name{left:0;z-index:5}
tbody tr:first-child td{border-top:none}
tr.saldoende td{box-shadow:inset 0 -2px 0 var(--rule)}
tr.luft td{height:22px;background:var(--bg);border:none;padding:0}
.klapper{display:flex;align-items:center;gap:9px;background:none;border:none;padding:0;cursor:pointer;
 text-align:left;color:var(--ink);font:inherit}
.chev{width:10px;font-size:9px;color:var(--muted);flex:none}
.anzahl{font:400 11px/1 'Space Grotesk',sans-serif;color:var(--chrome);margin-left:8px}
.marke{font:400 9.5px/1 'IBM Plex Mono',monospace;letter-spacing:.09em;text-transform:uppercase;
 color:var(--chrome);margin-left:8px}
.zelle{width:100%;background:none;border:1px solid transparent;border-radius:5px;text-align:right;
 padding:3px 4px;font:inherit;color:inherit;font-variant-numeric:tabular-nums}
.zelle:hover{border-color:var(--line)}
.zelle:focus{outline:none;border-color:var(--accent);background:var(--soft)}
.namensfeld{background:none;border:1px solid transparent;border-radius:5px;padding:3px 5px;
 font:400 13px/1.3 'Space Grotesk',sans-serif;color:var(--muted);flex:1 1 auto;min-width:0;width:100%}
.namensfeld:hover{border-color:var(--line)}
.namensfeld:focus{outline:none;border-color:var(--accent);background:var(--soft);color:var(--ink)}
.werkzeug{opacity:0;display:inline-flex;gap:5px;margin-left:6px}
tr:hover .werkzeug,tr:focus-within .werkzeug{opacity:1}
.griff{cursor:grab;color:var(--chrome);font-size:11px;background:none;border:none;padding:0 2px}
.weg{cursor:pointer;color:var(--chrome);font-size:12px;background:none;border:none;padding:0 2px;line-height:1}
.weg:hover{color:var(--ink)}
.plus{background:none;border:1px solid var(--rule);border-radius:7px;width:20px;height:20px;
 cursor:pointer;color:var(--muted);font-size:12px;line-height:1;padding:0}
.plus:hover{color:var(--ink)}
tr.ziel td{background:var(--soft)}
.fuss{padding:18px 24px 0;max-width:1300px;font:400 12.5px/1.7 'Space Grotesk',sans-serif;color:var(--chrome)}
.leer{padding:60px 24px;font:400 14px/1.7 'Space Grotesk',sans-serif;color:var(--muted);max-width:640px}

/* ---------- Dialoge ---------- */
.schleier{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:40;display:flex;
 align-items:center;justify-content:center}
.dialog{background:var(--card);border:1px solid var(--rule);border-radius:14px;padding:22px;
 min-width:400px;max-width:560px;display:flex;flex-direction:column;gap:14px}
.dialog h2{margin:0;font:600 15px/1.3 'Space Grotesk',sans-serif;color:var(--ink)}
.dialog p{margin:0;font:400 12.5px/1.6 'Space Grotesk',sans-serif;color:var(--chrome)}
.dialog label{font:500 10px/1 'IBM Plex Mono',monospace;letter-spacing:.11em;text-transform:uppercase;
 color:var(--muted);display:block;margin-bottom:6px}
.feld{background:var(--soft);border:1px solid var(--rule);border-radius:9px;padding:8px 10px;
 font:400 13px/1.2 'Space Grotesk',sans-serif;color:var(--ink);width:100%}
.feld:focus{outline:none;border-color:var(--accent)}
select.feld{font-family:'Space Grotesk',sans-serif}
.reihe{display:flex;gap:12px;align-items:flex-end}
.reihe>div{flex:1}
.haken{display:flex;align-items:center;gap:9px;background:none;border:none;padding:0;cursor:pointer;
 font:400 12.5px/1.4 'Space Grotesk',sans-serif;color:var(--ink);text-align:left}
.kasten{width:17px;height:17px;border:1px solid var(--rule);border-radius:5px;display:flex;
 align-items:center;justify-content:center;font-size:11px;color:var(--onaccent);flex:none}
.kasten.an{background:var(--accent);border-color:var(--accent)}
.dialog .tasten{display:flex;gap:9px;justify-content:flex-end;margin-top:4px}
.tat{background:var(--accent);color:var(--onaccent);border:none;border-radius:9px;padding:9px 16px;
 cursor:pointer;font:600 12.5px/1 'Space Grotesk',sans-serif}
.ab{background:none;border:1px solid var(--rule);color:var(--muted);border-radius:9px;padding:9px 16px;
 cursor:pointer;font:500 12.5px/1 'Space Grotesk',sans-serif}
.stand{background:none;border:1px solid transparent;border-radius:5px;padding:2px 4px;
 font:400 11px/1.2 'Space Grotesk',sans-serif;color:var(--ink);cursor:pointer;width:100%;
 text-align:right;-webkit-appearance:none;appearance:none;text-align-last:right}
.stand:hover{border-color:var(--line)}
.stand:focus{outline:none;border-color:var(--accent)}
.datumsfeld{background:none;border:1px solid transparent;border-radius:5px;padding:3px 2px;
 font:400 11px/1.2 'IBM Plex Mono',monospace;color:var(--muted);width:100%;text-align:right}
.datumsfeld:hover{border-color:var(--line)}
.datumsfeld:focus{outline:none;border-color:var(--accent);background:var(--soft);color:var(--ink)}
.neusteller{background:none;border:1px dashed var(--rule);border-radius:9px;padding:7px 14px;
 cursor:pointer;font:500 12px/1 'Space Grotesk',sans-serif;color:var(--muted);margin:12px 0 0 22px}
.neusteller:hover{color:var(--ink)}
@page{size:landscape;margin:10mm}
@media print{.leiste,.fuss,.schleier,.neusteller,.werkzeug,.plus{display:none !important}
 .blatt{overflow:visible;padding:0}body{background:#fff;height:auto;overflow:visible}
 th,tr.saldo td{position:static}}
</style>
</head>
<body>
<div class="leiste" id="leiste"></div>
<div id="band"></div>
<div class="blatt" id="blatt"></div>
<div id="dialoge"></div>
<script>
"use strict";
/* ==========================================================================
   GÄPP — Tabellenwerkzeug
   Zwei Tabellen je Jahr (Budget, Rechnungen) und eine Jahresübersicht.
   Alles gerechnet, nichts abgeschrieben. Keine Kommastellen.
   Die Daten stehen NICHT in dieser Datei — sie kommen aus gaepp-daten.json,
   aus dem Browserspeicher oder aus dem privaten Repo.
   ========================================================================== */

const MK = ['Jan','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'];
const ML = ['Januar','Februar','März','April','Mai','Juni','Juli','August',
            'September','Oktober','November','Dezember'];
const STAENDE = ['Offen','Bank','Bezahlt','Nicht eingetroffen'];
const N12 = () => new Array(12).fill(0);

let ZAEHLER = 0;
const neueId = () => 'p' + (++ZAEHLER);
const slug = s => String(s).toLowerCase().replace(/[^a-z0-9]+/g, '');
const esc = s => String(s == null ? '' : s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

/* ---------------------------------------------------------------- Zustand */
const S = {
  theme: 'dunkel', jahr: null, ansicht: 'budget', nullen: false,
  auf: [], haken: {}, jahre: [], daten: {}, rechnungen: {},
  neu: null, ueb: null, exp: null, wegJahr: null, zieht: null, ziel: null,
  stichmonat: '2026-08', sync: 'nicht verbunden', syncText: '',
  geladen: false
};

/* Anzeigezustand (auf, nullen, theme, jahr, ansicht) geht nie in die Datendatei. */
function nutzdaten() {
  return {
    schemaVersion: 1,
    meta: { waehrung:'CHF', stichmonat:S.stichmonat, geaendert:new Date().toISOString() },
    jahre: S.jahre.slice().sort((a,b) => a-b),
    daten: S.daten, rechnungen: S.rechnungen, haken: S.haken
  };
}
function uebernimm(d) {
  if (!d || typeof d !== 'object') throw new Error('Keine gültige Datei.');
  if (!d.daten || !d.jahre) throw new Error('Der Datei fehlen «jahre» oder «daten».');
  S.jahre = d.jahre.map(Number).sort((a,b) => a-b);
  S.daten = d.daten;
  S.rechnungen = d.rechnungen || {};
  S.haken = d.haken || {};
  if (d.meta && d.meta.stichmonat) S.stichmonat = d.meta.stichmonat;
  /* Zähler über alle vergebenen Ids heben, damit neue Ids nie kollidieren. */
  let hoch = 0;
  const merke = id => { const m = /^p(\d+)$/.exec(String(id||'')); if (m) hoch = Math.max(hoch, +m[1]); };
  S.jahre.forEach(j => (S.daten[j]||[]).forEach(b => { merke(b.id);
    if (b.art === 'schulden') (b.gruppen||[]).forEach(g => { merke(g.id); (g.pos||[]).forEach(p => merke(p.id)); });
    else (b.pos||[]).forEach(p => merke(p.id)); }));
  S.jahre.forEach(j => (S.rechnungen[j]||[]).forEach(g => { merke(g.id);
    (g.rechnungen||[]).forEach(r => merke(r.id)); }));
  ZAEHLER = Math.max(ZAEHLER, hoch);
  if (!S.jahr || S.jahre.indexOf(S.jahr) < 0) {
    const hj = parseInt(S.stichmonat.slice(0,4), 10);
    S.jahr = S.jahre.indexOf(hj) >= 0 ? hj : (S.jahre[S.jahre.length - 1] || null);
  }
  S.geladen = true;
}

/* ------------------------------------------------------------- Formatieren */
function fmt(n, immer) {
  const r = Math.round(n || 0);
  if (r === 0 && !S.nullen && !immer) return '';
  return (r < 0 ? '−' : '') + String(Math.abs(r)).replace(/\B(?=(\d{3})+(?!\d))/g, "'");
}
function zahl(v) {
  const n = parseFloat(String(v).replace(/[^0-9.,−-]/g,'').replace(/'/g,'')
    .replace('−','-').replace(',','.'));
  return isNaN(n) ? 0 : Math.round(n);
}
const su = r => (r || []).reduce((s,x) => s + (x||0), 0);
const jahre = () => S.jahre.slice().sort((a,b) => a-b);
const vorjahr = j => { const k = S.jahre.filter(x => x < j); return k.length ? Math.max.apply(null,k) : null; };
const offen = id => S.auf.indexOf(id) >= 0;
const hakenAn = (pid,m) => !!S.haken[pid + ':' + m];
const schuldBlock = j => (S.daten[j] || []).find(b => b.art === 'schulden');
/* Rechnungssteller stehen immer alphabetisch — Ansicht, Druck und Export gleich. */
const steller = j => (S.rechnungen[j] || []).slice().sort((a,b) =>
  String(a.name||'').localeCompare(String(b.name||''), 'de-CH', { sensitivity:'base', numeric:true }));

/* Anfangsstand = Rest des Vorjahrs. Ändert sich eine Rate 2026, wandert der
   neue Rest von selbst in 2027 und weiter. Rekursiv bis zum ersten Jahrgang. */
function basisVon(j, gKey, pKey, eigen) {
  const v = vorjahr(j);
  if (v === null) return eigen;
  const blk = schuldBlock(v); if (!blk) return eigen;
  const g = (blk.gruppen||[]).find(x => x.key === gKey); if (!g) return eigen;
  const p = (g.pos||[]).find(x => x.key === pKey); if (!p) return eigen;
  const vorBasis = basisVon(v, gKey, pKey, p.basis);
  /* Ein Jahrgang, der die Schuld nur dem Namen nach fuehrt — kein Anfangsstand,
     keine Rate — traegt nichts bei und ist durchlaessig. Sonst wuerde ein leeres
     Geruest den Anfangsstand des Folgejahrs auf null ziehen. */
  if (vorBasis === 0 && su(p.reihe) === 0) return eigen;
  return Math.max(0, vorBasis - su(p.reihe));
}

/* Traegt das direkte Vorjahr dieselbe Schuld? Dann ist die Basis geerbt und
   nicht tippbar — der Anfangsstand ist der Rest des Vorjahrs, keine Wahl. */
function basisGeerbt(j, gKey, pKey) {
  const v = vorjahr(j); if (v === null) return false;
  const blk = schuldBlock(v); if (!blk) return false;
  const g = (blk.gruppen||[]).find(x => x.key === gKey); if (!g) return false;
  const p = (g.pos||[]).find(x => x.key === pKey); if (!p) return false;
  return basisVon(v, gKey, pKey, p.basis) > 0 || su(p.reihe) !== 0;
}

/* ------------------------------------------------- Zeilen eines Jahrgangs */
function bau(jahr, alles) {
  const bl = S.daten[jahr] || [], out = [];
  const plus = (a,b) => a.map((x,i) => x + b[i]);
  let einnahmen = N12(), ausgaben = N12();

  /* Gegenposten Tilgung: Einnahmenseite der Jahre, die nur Schulden führen. */
  const tilgung = N12();
  bl.forEach(b => { if (b.art !== 'schulden') return;
    (b.gruppen||[]).forEach(g => (g.pos||[]).forEach(p =>
      (p.reihe||[]).forEach((v,m) => { tilgung[m] += v; }))); });

  bl.forEach(b => {
    const bAuf = alles || offen(b.id);
    let bsum = N12(), bBasis = 0, bRest = 0;
    const kinder = [];

    if (b.art === 'schulden') {
      (b.gruppen||[]).forEach(g => {
        const gAuf = alles || offen(g.id);
        let gsum = N12(), gBasis = 0, gRest = 0;
        const enkel = [];
        (g.pos||[]).forEach(p => {
          const basis = basisVon(jahr, g.key, p.key, p.basis);
          const rest = Math.max(0, basis - su(p.reihe));
          gsum = plus(gsum, p.reihe); gBasis += basis; gRest += rest;
          enkel.push({ typ:'pos', id:p.id, eltern:g.id, name:p.name, bs:basis,
            reihe:p.reihe, jw:rest, tief:3, geerbt: basisGeerbt(jahr, g.key, p.key) });
        });
        kinder.push({ typ:'gkopf', id:g.id, eltern:b.id, name:g.name, reihe:gsum, auf:gAuf,
          bs:gBasis, jw:gRest, anzahl:(g.pos||[]).length + ' Gläubiger' });
        if (gAuf) enkel.forEach(x => kinder.push(x));
        bsum = plus(bsum, gsum); bBasis += gBasis; bRest += gRest;
      });
    } else {
      (b.pos||[]).forEach(p => {
        const r = p.spiegel === 'tilgung' ? tilgung : p.reihe;
        bsum = plus(bsum, r);
        kinder.push({ typ:'pos', id:p.id, eltern:b.id, name:p.name, bs:p.basis, reihe:r,
          jw:su(r), tief:2, fix: !!p.fix,
          marke: p.spiegel === 'tilgung' ? 'gegenposten zur tilgung' : '' });
      });
      bRest = su(bsum);
    }

    out.push({ typ:'kopf', id:b.id, name:b.name, reihe:bsum, auf:bAuf,
      bs: b.art === 'schulden' ? bBasis : 0, jw:bRest, schulden: b.art === 'schulden',
      anzahl: b.art === 'schulden' ? (b.gruppen||[]).length + ' Gruppen'
                                   : (b.pos||[]).length + ' Positionen' });
    if (bAuf) kinder.forEach(x => out.push(x));
    if (b.vz === 1) einnahmen = plus(einnahmen, bsum); else ausgaben = plus(ausgaben, bsum);
  });

  const rech = N12();
  (S.rechnungen[jahr] || []).forEach(g => (g.rechnungen||[]).forEach(r =>
    (r.reihe||[]).forEach((v,m) => { rech[m] += v; })));
  out.push({ typ:'summe', id:'rech', name:'Rechnungen', reihe:rech, jw:su(rech),
    klein:true, marke:'aus dem Blatt Rechnungen' });
  ausgaben = ausgaben.map((x,i) => x + rech[i]);
  out.push({ typ:'summe', id:'aus', name:'Ausgaben zusammen', reihe:ausgaben,
    jw:su(ausgaben), stark:true });

  const saldo = einnahmen.map((e,i) => e - ausgaben[i]);
  let lauf = 0;
  const kum = saldo.map(s => (lauf += s));
  return { zeilen:out, saldo, kum, einnahmen, ausgaben, rech };
}

/* Kopfzelle grün, wenn jeder Posten darunter in diesem Monat abgehakt ist. */
function kopfGruen(jahr, blockId, m) {
  const b = (S.daten[jahr]||[]).find(x => x.id === blockId); if (!b) return false;
  const alle = b.art === 'schulden'
    ? (b.gruppen||[]).reduce((a,g) => a.concat(g.pos||[]), []) : (b.pos||[]);
  const mit = alle.filter(p => (p.reihe||[])[m] !== 0);
  return mit.length > 0 && mit.every(p => hakenAn(p.id, m));
}
function gruppeGruen(jahr, gid, m) {
  const b = schuldBlock(jahr); if (!b) return false;
  const g = (b.gruppen||[]).find(x => x.id === gid); if (!g) return false;
  const mit = (g.pos||[]).filter(p => (p.reihe||[])[m] !== 0);
  return mit.length > 0 && mit.every(p => hakenAn(p.id, m));
}

/* ------------------------------------------------------------ Kennzahlen */
function kennzahlen() {
  const js = jahre();
  if (!js.length) return null;
  const hj0 = parseInt(S.stichmonat.slice(0,4), 10);
  const hm = parseInt(S.stichmonat.slice(5,7), 10) - 1;
  const hj = js.indexOf(hj0) >= 0 ? hj0 : js[js.length-1];

  let rest = 0, getilgt = 0, anfang = 0;
  const blk = schuldBlock(hj);
  if (blk) (blk.gruppen||[]).forEach(g => (g.pos||[]).forEach(p => {
    const basis = basisVon(hj, g.key, p.key, p.basis);
    rest += Math.max(0, basis - su((p.reihe||[]).slice(0, hm+1)));
  }));
  /* Leere Jahrgaenge zaehlen nicht als Anfang — sonst waere die Quote null. */
  let erstJahr = null;
  for (const j of js) { const b = schuldBlock(j);
    if (b && (b.gruppen||[]).some(g => (g.pos||[]).length)) { erstJahr = j; break; } }
  const erst = erstJahr === null ? null : schuldBlock(erstJahr);
  if (erst) (erst.gruppen||[]).forEach(g => (g.pos||[]).forEach(p => { anfang += p.basis; }));
  js.forEach(j => { const b = schuldBlock(j); if (!b) return;
    (b.gruppen||[]).forEach(g => (g.pos||[]).forEach(p => {
      const bis = j < hj ? 12 : (j === hj ? hm+1 : 0);
      getilgt += su((p.reihe||[]).slice(0, bis)); })); });

  /* Schuldenfrei: Raten der erfassten Jahre, danach das letzte Jahr wiederholt. */
  const letzte = js[js.length-1];
  const ratenIn = j => { const b = schuldBlock(j >= letzte ? letzte : j), r = N12();
    if (b) (b.gruppen||[]).forEach(g => (g.pos||[]).forEach(p =>
      (p.reihe||[]).forEach((v,m) => { r[m] += v; }))); return r; };
  let stand = rest, jL = hj, mL = hm, schritte = 0, frei = null;
  while (schritte < 480) {
    mL++; if (mL > 11) { mL = 0; jL++; }
    const rate = ratenIn(jL)[mL];
    if (rate <= 0 && stand > 0 && schritte > 240) break;
    stand -= rate; schritte++;
    if (stand <= 0) { frei = { j:jL, m:mL }; break; }
  }

  let off = 0;
  (S.daten[hj]||[]).forEach(b => {
    if (b.vz === 1) return;
    const liste = b.art === 'schulden'
      ? (b.gruppen||[]).reduce((a,g) => a.concat(g.pos||[]), []) : (b.pos||[]);
    liste.forEach(p => { const v = (p.reihe||[])[hm];
      if (v !== 0 && !hakenAn(p.id, hm)) off += v; });
  });
  (S.rechnungen[hj]||[]).forEach(g => (g.rechnungen||[]).forEach(r => {
    if (r.stand === 'Offen') off += (r.reihe||[])[hm] || 0; }));

  return { jahr:hj, monat:hm, rest, getilgt, anfang, offen:off, erstJahr,
    quote: anfang ? Math.round(getilgt/anfang*100) : 0, frei };
}

/* Saldo budgetiert und Saldo kumuliert bleiben unter dem Tabellenkopf stehen,
   damit beim Tippen weiter unten sichtbar ist, wie der Saldo reagiert. */
function klebEinstellen() {
  const kopf = document.querySelector('thead th');
  if (!kopf) return;
  let oben = Math.round(kopf.getBoundingClientRect().height);
  document.querySelectorAll('tr.saldo').forEach(tr => {
    tr.querySelectorAll('td').forEach(td => { td.style.top = oben + 'px'; });
    oben += Math.round(tr.getBoundingClientRect().height);
  });
}

/* ------------------------------------------------------ Kennzahlenband */
function band() {
  if (!(S.ansicht === 'budget' || S.ansicht === 'alle') || !S.geladen) return '';
  const k = kennzahlen(); if (!k) return '';
  const js = jahre();
  const frei = k.frei ? ML[k.frei.m] + ' ' + k.frei.j : null;
  const monate = k.frei ? (k.frei.j - k.jahr) * 12 + (k.frei.m - k.monat) : null;
  const kach = [
    ['Restschuld heute', fmt(k.rest, true), '', ML[k.monat] + ' ' + k.jahr],
    ['Schuldenfrei', frei || 'nicht nach diesem Plan', frei ? '' : 'color:var(--muted)',
      frei ? 'in ' + monate + ' Monaten, wenn die Raten so laufen'
           : 'die Raten der letzten Jahre reichen nicht'],
    ['Getilgt bisher', fmt(k.getilgt, true), '',
      k.quote + ' % von ' + fmt(k.anfang, true) + ' seit ' + (k.erstJahr || js[0])],
    ['Offen in ' + ML[k.monat], fmt(k.offen, true),
      k.offen > 0 ? '' : 'color:var(--gruen)',

/* Die Spalten teilen sich die Fensterbreite im Verhaeltnis ihrer Grundmasse.
   Die Summe der Grundmasse ist zugleich die Mindestbreite: darunter wird quer
   gescrollt, darueber wachsen alle Spalten mit. */
function spalten(art) {
  const b = B[art];
  return anteile(art === 'budget'
    ? [b.name, b.basis].concat(new Array(12).fill(b.monat)).concat([b.jahr])
    : [b.name, b.datum, b.betrag].concat(new Array(12).fill(b.monat)).concat([b.saldo, b.stand]));
}
function anteile(masse) {
  const ganz = masse.reduce((s,x) => s + x, 0);
  return { min: ganz, tags: '<colgroup>' + masse.map(m =>
    '<col style="width:' + (Math.round(m / ganz * 1e6) / 1e4) + '%">').join('') + '</colgroup>' };
}
function tabelle(sp, inhalt) {
  return '<table style="min-width:' + sp.min + 'px">' + sp.tags + inhalt + '</table>';
}

/* -------------------------------------------------------- Rechnungen */

    + MK.map(m => '<th>' + m + '</th>').join('')
    + '<th>Saldo</th><th class="jahr">Stand</th></tr></thead>';

  const rMon = N12(), oMon = N12(), bMon = N12();
  let rBetrag = 0, rSaldo = 0, oBetrag = 0, bBetrag = 0;
  gruppen.forEach(g => (g.rechnungen||[]).forEach(r => {
    rBetrag += r.betrag; rSaldo += r.betrag - su(r.reihe);
    const ziel = r.stand === 'Bezahlt' ? bMon : oMon;
    if (r.stand === 'Bezahlt') bBetrag += r.betrag; else oBetrag += r.betrag;
    (r.reihe||[]).forEach((v,m) => { rMon[m] += v; ziel[m] += v; });
  }));

  const zeilen = [];
  gruppen.forEach(g => {

    let bet = 0, sal = 0, offene = 0;
    liste.forEach(r => { bet += r.betrag; sal += r.betrag - su(r.reihe);
      if (r.stand !== 'Bezahlt') offene++;
      (r.reihe||[]).forEach((v,m) => { mon[m] += v; }); });
    zeilen.push('<tr class="kopf" data-k="' + g.id + '" data-p="">'
      + '<td class="name" style="padding-left:12px;padding-top:10px;padding-bottom:10px;border-top:1px solid var(--rule)">'
      + '<span style="display:flex;align-items:center">'

      + '<button class="weg" data-weg-steller="' + g.id + '" title="Steller löschen">×</button></span>'
      + '</span></td>'
      + '<td style="border-top:1px solid var(--rule)"></td>'
      + '<td style="border-top:1px solid var(--rule);font-weight:600' + (offene ? '' : ';color:var(--gruen)') + '">'
      + fmt(bet, true) + '</td>'
      + mon.map(v => '<td style="border-top:1px solid var(--rule);font-weight:600'

    + '<td style="border-top:1px solid var(--' + (stark?'rule':'line') + ')"></td>'
    + '<td style="border-top:1px solid var(--' + (stark?'rule':'line') + ');font-weight:'
    + (stark?600:500) + (gruen ? ';color:var(--gruen)' : '') + '">' + fmt(betrag, true) + '</td>'
    + mon.map(v => '<td style="border-top:1px solid var(--' + (stark?'rule':'line') + ');font-weight:'
        + (stark?600:500) + (gruen ? ';color:var(--gruen)' : '') + '">' + fmt(v, true) + '</td>').join('')
    + '<td style="border-top:1px solid var(--' + (stark?'rule':'line') + ');font-weight:700">'
    + (saldo === null ? '' : fmt(saldo, true)) + '</td>'
    + '<td class="jahr" style="border-top:1px solid var(--' + (stark?'rule':'line') + ')"></td></tr>';
  zeilen.push(summe('Total', rBetrag, rMon, rSaldo, false, true));
  zeilen.push(summe('davon offen', oBetrag, oMon, null, false, false));
  zeilen.push(summe('davon bezahlt', bBetrag, bMon, null, true, false));

  return tabelle(spalten('rech'), kopf + '<tbody>' + zeilen.join('') + '</tbody>')
    + '<button class="neusteller" data-neu-steller="1">+ Neuer Rechnungssteller</button>'
    + '<div class="fuss">Wie im Excel: der Betrag steht links, verteilt wird er auf die Monate — eine Rechnung '
    + 'darf auf mehrere Monate aufgeteilt werden. «Saldo» zeigt, was vom Betrag noch nicht verteilt ist; steht dort '
    + 'ein Strich, stimmt es. Rechtsklick auf Betrag oder Monatszelle schaltet zwischen bezahlt und offen. Die '
    + 'Monatssummen unten erscheinen im Budget desselben Jahres als Zeile «Rechnungen» — dort nicht tippbar, weil '
    + 'sie hier entsteht.</div>';
}

/* -------------------------------------------------------- Alle Jahre */
function alleJahre() {
  const js = jahre(), bauten = js.map(j => bau(j, true));
  const kopfW = (b,n) => { const z = b.zeilen.find(x => x.typ === 'kopf' && x.name === n); return z ? su(z.reihe) : 0; };
  const restW = (b,n) => { const z = b.zeilen.find(x => x.typ === 'kopf' && x.name === n); return z ? z.jw : 0; };
  const grW   = (b,n) => { const z = b.zeilen.find(x => x.typ === 'gkopf' && x.name === n); return z ? su(z.reihe) : 0; };
  const def = [
    ['Einnahmen',            b => su(b.einnahmen),          {stark:1}],
    ['Fixkosten',            b => kopfW(b,'Fixkosten'),      {tief:1}],
    ['Lebenshaltung',        b => kopfW(b,'Lebenshaltung'),  {tief:1}],
    ['Abonnements',          b => kopfW(b,'Abonnements'),    {tief:1}],
    ['Rückstellungen',       b => kopfW(b,'Rückstellungen'), {tief:1}],
    ['Steuerverwaltung',     b => grW(b,'Steuerverwaltung'), {tief:1}],
    ['Schulden Privat',      b => grW(b,'Schulden Privat'),  {tief:1}],
    ['Schulden Firmen',      b => grW(b,'Schulden Firmen'),  {tief:1}],
    ['Raten zusammen',       b => kopfW(b,'Verbindlichkeiten'), {}],
    ['Rechnungen',           b => su(b.rech),                {tief:1}],
    ['Ausgaben',             b => su(b.ausgaben),            {stark:1}],
    ['Saldo',                b => su(b.saldo),               {stark:1}],
    ['Restschuld am 31.12.', b => restW(b,'Verbindlichkeiten'), {stark:1, letzte:1}]
  ];
  const kopf = '<thead><tr><th class="ecke">Alle Jahre</th>'
    + js.map(j => '<th>' + j + '</th>').join('')
    + '<th class="jahr">Total</th></tr></thead>';
  const zeilen = def.map(([name, fn, o]) => {
    const w = bauten.map(fn);
    const total = o.letzte ? w[w.length-1] : w.reduce((s,x) => s+x, 0);
    return '<tr class="' + (o.stark ? 'kopf stark' : 'pos') + '">'
      + '<td class="name" style="padding-left:' + (o.tief ? 32 : 14) + 'px;padding-top:11px;'
      + 'padding-bottom:11px;border-top:1px solid var(--' + (o.stark ? 'rule' : 'line') + ');font-weight:'
      + (o.stark ? 700 : (o.tief ? 400 : 600)) + ';color:var(--' + (o.tief ? 'muted' : 'ink') + ')">'
      + esc(name) + '</td>'
      + w.map(v => '<td style="border-top:1px solid var(--' + (o.stark?'rule':'line') + ');font-weight:'
          + (o.stark?600:500) + '">' + F(v) + '</td>').join('')
      + '<td class="jahr" style="border-top:1px solid var(--' + (o.stark?'rule':'line')
      + ');font-weight:700">' + F(total) + '</td></tr>';
  }).join('');
  const bre = Math.max(110, Math.min(210, Math.floor(1010 / Math.max(1, js.length))));
  const sp = anteile([B.budget.name].concat(js.map(() => bre)).concat([B.budget.jahr]));
  return tabelle(sp, kopf + '<tbody>' + zeilen + '</tbody>')
    + '<div class="fuss">Ein Jahr ist eine Spalte. Die letzte Zeile ist keine Summe, sondern der Stand am '
    + 'Jahresende — im Total steht deshalb der Rest des letzten Jahres.</div>';
}

/* ==================================================== Daten ändern */
function mitPos(id, fn) {
  let treffer = null;
  Object.keys(S.daten).forEach(j => (S.daten[j]||[]).forEach(b => {
    if (b.art === 'schulden') (b.gruppen||[]).forEach(g => (g.pos||[]).forEach(p => { if (p.id === id) treffer = p; }));
    else (b.pos||[]).forEach(p => { if (p.id === id) treffer = p; });
  }));
  if (!treffer) return;
  fn(treffer); merke();
}
function findePos(id) {
  let out = null;
  Object.keys(S.daten).forEach(j => (S.daten[j]||[]).forEach(b => {
    if (b.art === 'schulden') (b.gruppen||[]).forEach(g => (g.pos||[]).forEach(p => {
      if (p.id === id) out = { p, j:parseInt(j,10), eltern:g.id }; }));
    else (b.pos||[]).forEach(p => { if (p.id === id) out = { p, j:parseInt(j,10), eltern:b.id }; });
  }));
  return out;
}
/* Verschieben nur innerhalb derselben Sektion. */
function verschiebe(vonId, aufId) {
  if (!vonId || !aufId || vonId === aufId) return;
  const listen = [];
  Object.keys(S.daten).forEach(j => (S.daten[j]||[]).forEach(b => {
    if (b.art === 'schulden') (b.gruppen||[]).forEach(g => listen.push(g.pos));
    else listen.push(b.pos);
  }));
  for (const L of listen) {
    const a = L.findIndex(p => p.id === vonId), b = L.findIndex(p => p.id === aufId);
    if (a < 0 || b < 0) continue;
    const [weg] = L.splice(a,1); L.splice(b,0,weg); merke(); return;
  }
}
function jahrAnlegen() {
  const vor = Math.max.apply(null, jahre()), neu = S.neu.jahr;
  if (!neu || S.jahre.indexOf(neu) >= 0) { S.neu = null; return; }
  const kopie = (S.daten[vor]||[]).map(b => {
    if (b.art === 'schulden') {
      return { id:neueId(), art:'schulden', name:b.name, key:b.key, vz:b.vz,
        gruppen: (b.gruppen||[]).map(g => ({ id:neueId(), name:g.name, key:g.key,
          pos: (g.pos||[]).map(p => ({ id:neueId(), key:p.key, name:p.name,
            basis: Math.max(0, basisVon(vor, g.key, p.key, p.basis) - su(p.reihe)),
            reihe: S.neu.raten ? p.reihe.slice() : N12() }))
            .filter(p => p.basis > 0 || S.neu.raten) })) };
    }
    return { id:neueId(), art:'block', name:b.name, key:b.key, vz:b.vz,
      pos: (b.pos||[]).map(p => ({ id:neueId(), key:p.key, name:p.name, basis:p.basis,
        reihe: S.neu.budget ? p.reihe.slice() : N12(), spiegel:p.spiegel, fix:p.fix })) };
  });
  S.daten[neu] = kopie; S.rechnungen[neu] = [];
  S.jahre = S.jahre.concat([neu]).sort((a,b) => a-b);
  S.jahr = neu; S.ansicht = 'budget'; S.neu = null; merke();
}
function jahrLoeschen(j) {
  if (S.jahre.length <= 1) return;
  /* Erledigt-Marken dieses Jahrgangs gehen mit, sonst wachsen Karteileichen. */
  const ids = [];
  (S.daten[j]||[]).forEach(b => {
    if (b.art === 'schulden') (b.gruppen||[]).forEach(g => (g.pos||[]).forEach(p => ids.push(p.id)));
    else (b.pos||[]).forEach(p => ids.push(p.id)); });
  Object.keys(S.haken).forEach(k => {
    if (ids.indexOf(k.slice(0, k.lastIndexOf(':'))) >= 0) delete S.haken[k]; });
  delete S.daten[j]; delete S.rechnungen[j];
  S.jahre = S.jahre.filter(x => x !== j);
  if (S.jahr === j) {                       /* auf den naechsten Nachbarn, nicht ans Ende */
    const vor = S.jahre.filter(x => x < j), nach = S.jahre.filter(x => x > j);
    S.jahr = nach.length ? nach[0] : vor[vor.length - 1];
  }
  S.wegJahr = null; merke();
}

function uebertragen() {
  const u = S.ueb, von = Math.min(u.von, u.bis), bis = Math.max(u.von, u.bis);
  const setz = p => { for (let m = von; m <= bis; m++) p.reihe[m] = u.wert; };
  let key = null, gKey = null;
  (S.daten[u.jahr]||[]).forEach(b => {
    if (b.art === 'schulden') (b.gruppen||[]).forEach(g => (g.pos||[]).forEach(p => {
      if (p.id === u.id) { setz(p); key = p.key; gKey = g.key; } }));
    else (b.pos||[]).forEach(p => { if (p.id === u.id) { setz(p); key = p.key; } });
  });
  if (u.folge && key) {
    jahre().filter(j => j > u.jahr).forEach(j => (S.daten[j]||[]).forEach(b => {
      if (b.art === 'schulden') (b.gruppen||[]).forEach(g => (g.pos||[]).forEach(p => {
        if (p.key === key && (!gKey || g.key === gKey)) p.reihe = new Array(12).fill(u.wert); }));
      else (b.pos||[]).forEach(p => { if (p.key === key) p.reihe = new Array(12).fill(u.wert); });
    }));
  }
  S.ueb = null; merke();
}

/* ================================================== Sichern und Laden */
const SCHLUESSEL = 'gaepp.tabelle.v1';
const CONF = 'gaepp.tabelle.anbindung';
let druck = null, warteMerken = null, letzterFinger = '';

function syncConf() {
  try { return Object.assign({ repo:'', pfad:'gaepp-daten.json', zweig:'main', token:'' },
    JSON.parse(localStorage.getItem(CONF) || '{}')); }
  catch(e) { return { repo:'', pfad:'gaepp-daten.json', zweig:'main', token:'' }; }
}
function setzeConf(feld, wert) {
  const c = syncConf(); c[feld] = wert;
  try { localStorage.setItem(CONF, JSON.stringify(c)); } catch(e) {}
}
function finger() {
  const d = nutzdaten(); delete d.meta;
  return JSON.stringify(d);
}
/* Anzeigezustand geht nie in den Fingerabdruck — sonst sichert GÄPP beim Klappen. */
function merke() {
  try { localStorage.setItem(SCHLUESSEL, JSON.stringify(nutzdaten())); } catch(e) {}
  const f = finger();
  if (f === letzterFinger) return;
  letzterFinger = f;
  const c = syncConf();
  if (!c.repo || !c.token) { S.sync = 'lokal'; S.syncText = 'Im Browser gesichert, kein Repo verbunden.'; return; }
  if (warteMerken) clearTimeout(warteMerken);
  warteMerken = setTimeout(() => { warteMerken = null; insRepo(true); }, 2500);
}
function anzeigeMerken() {
  try { localStorage.setItem(SCHLUESSEL + '.ansicht', JSON.stringify({
    theme:S.theme, jahr:S.jahr, ansicht:S.ansicht, nullen:S.nullen, auf:S.auf })); } catch(e) {}
}

/* ------------------------------------------------------ GitHub Contents */
async function repoLesen(still) {
  const c = syncConf();
  if (!c.repo || !c.token) { melde('fehler', 'Repo und Zugangsschlüssel fehlen.'); return; }
  melde('sichert', 'Hole aus dem Repo …');
  try {
    const u = 'https://api.github.com/repos/' + c.repo + '/contents/' + c.pfad + '?ref=' + encodeURIComponent(c.zweig);
    const a = await fetch(u, { headers:{ Authorization:'Bearer ' + c.token,
      Accept:'application/vnd.github+json' } });
    if (!a.ok) throw new Error('HTTP ' + a.status);
    const j = await a.json();
    druck = j.sha;
    const text = new TextDecoder().decode(Uint8Array.from(atob(j.content.replace(/\n/g,'')), ch => ch.charCodeAt(0)));
    uebernimm(JSON.parse(text));
    letzterFinger = finger();
    melde('gesichert', 'Aus dem Repo geholt.');
    S.syncAuf = false;
    zeichne();
  } catch(e) { melde('fehler', 'Holen misslungen: ' + e.message); if (!still) zeichne(); }
}
async function insRepo(still) {
  const c = syncConf();
  if (!c.repo || !c.token) { melde('fehler', 'Repo und Zugangsschlüssel fehlen.'); zeichne(); return; }
  melde('sichert', 'Sichert …'); if (!still) zeichne();
  const leib = () => {
    const roh = JSON.stringify(nutzdaten(), null, 1);
    const bytes = new TextEncoder().encode(roh);
    let bin = ''; for (let i = 0; i < bytes.length; i += 0x8000)
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    return btoa(bin);
  };
  const u = 'https://api.github.com/repos/' + c.repo + '/contents/' + c.pfad;
  const schick = async sha => fetch(u, { method:'PUT',
    headers:{ Authorization:'Bearer ' + c.token, Accept:'application/vnd.github+json',
      'Content-Type':'application/json' },
    body: JSON.stringify({ message:'GÄPP ' + new Date().toLocaleString('de-CH'),
      content: leib(), branch: c.zweig, sha: sha || undefined }) });
  try {
    let a = await schick(druck);
    if (a.status === 409 || a.status === 422) {          /* Stand veraltet — einmal neu holen */
      const g = await fetch(u + '?ref=' + encodeURIComponent(c.zweig),
        { headers:{ Authorization:'Bearer ' + c.token, Accept:'application/vnd.github+json' } });
      if (g.ok) { druck = (await g.json()).sha; a = await schick(druck); }
    }
    if (!a.ok) throw new Error('HTTP ' + a.status);
    druck = (await a.json()).content.sha;
    melde('gesichert', 'Ins Repo gesichert um ' + new Date().toLocaleTimeString('de-CH') + '.');
  } catch(e) { melde('fehler', 'Sichern misslungen: ' + e.message); }
  zeichne();
}
function melde(zustand, text) { S.sync = zustand; S.syncText = text; }

/* ------------------------------------------------------ Datei und Export */
function gib(name, text, typ) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type: typ }));
  a.download = name; document.body.appendChild(a); a.click(); a.remove();
}
function jsonSichern() {
  gib('gaepp-daten.json', JSON.stringify(nutzdaten(), null, 1), 'application/json');
  S.exp = null; zeichne();
}
function dateiLaden() {
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = '.json,application/json';
  inp.onchange = () => { const f = inp.files[0]; if (!f) return;
    const l = new FileReader();
    l.onload = () => { try { uebernimm(JSON.parse(l.result));
        letzterFinger = finger(); merke();
        S.syncAuf = false; melde(syncConf().token ? 'lokal' : 'lokal', 'Aus Datei geladen.');
        zeichne();
      } catch(e) { melde('fehler', 'Datei nicht lesbar: ' + e.message); zeichne(); } };
    l.readAsText(f); };
  inp.click();
}

/* Der Browserspeicher hat beim Start Vorrang. Wer eine neue Startdatei neben die
   App legt, kommt sonst nicht an sie heran. */
function frischHolen() {
  if (!confirm('Der Stand aus dem Browserspeicher wird durch gaepp-daten.json ersetzt. Fortfahren?')) return;
  melde('sichert', 'Hole die Startdatei …'); zeichne();
  /* Erst holen, dann ersetzen. Der alte Stand bleibt, solange das Holen nicht geglückt ist. */
  fetch('gaepp-daten.json', { cache:'no-store' })
    .then(a => { if (!a.ok) throw new Error('HTTP ' + a.status); return a.json(); })
    .then(d => { uebernimm(d); letzterFinger = finger(); S.syncAuf = false;
      melde('lokal', 'Startdatei neu geholt.'); merke(); zeichne(); })
    .catch(e => {
      melde('fehler', 'Keine Startdatei neben der App gefunden — dein Stand ist unverändert. '
        + 'Wähle die Datei von Hand.');
      zeichne(); dateiLaden(); });
}

function csvSichern() {
  const js = jahre().filter(j => S.exp.jahre.indexOf(j) >= 0);
  if (!js.length) return;
  const zell = v => { const s = String(v == null ? '' : v);
    return /[";\r\n]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s; };
  const z = a => a.map(zell).join(';');
  const erledigt = pid => MK.filter((k,m) => hakenAn(pid, m)).join(' ');
  js.forEach(j => {
    const b = bau(j, true), L = [];
    L.push(z(['GÄPP', 'Budget ' + j, 'Stand ' + new Date().toLocaleDateString('de-CH')]));
    L.push('');
    L.push(z(['Ebene','Position','Basis'].concat(MK).concat(['Jahr / Rest','Erledigt'])));
    L.push(z(['Kennzahl','Saldo budgetiert',''].concat(b.saldo).concat([su(b.saldo),''])));
    L.push(z(['Kennzahl','Saldo kumuliert',''].concat(b.kum).concat([b.kum[11],''])));
    b.zeilen.forEach(x => {
      const eb = x.typ === 'kopf' ? 'Kategorie' : x.typ === 'gkopf' ? 'Gruppe'
        : x.typ === 'pos' ? 'Position' : 'Summe';
      L.push(z([eb, x.name, x.bs || ''].concat(x.reihe)
        .concat([x.jw, x.typ === 'pos' ? erledigt(x.id) : ''])));
    });
    if (S.exp.rech) {
      const gruppen = steller(j);
      L.push(''); L.push(z(['Rechnungen ' + j]));
      L.push(z(['Ebene','Rechnungssteller / Zweck','Datum','Betrag'].concat(MK).concat(['Saldo','Stand'])));
      const tot = N12(), off = N12(), bez = N12();
      let tb = 0, ob = 0, bb = 0;
      gruppen.forEach(g => {
        const liste = g.rechnungen || [], mon = N12();
        let bet = 0, sal = 0;
        liste.forEach(r => { bet += r.betrag; sal += r.betrag - su(r.reihe);
          (r.reihe||[]).forEach((v,m) => { mon[m] += v; tot[m] += v;
            if (r.stand === 'Bezahlt') bez[m] += v; else off[m] += v; });
          if (r.stand === 'Bezahlt') bb += r.betrag; else ob += r.betrag; });
        tb += bet;
        L.push(z(['Steller', g.name, '', bet].concat(mon).concat([sal,''])));
        liste.forEach(r => L.push(z(['Rechnung', r.zweck, r.datum, r.betrag]
          .concat(r.reihe || N12()).concat([r.betrag - su(r.reihe), r.stand]))));
      });
      L.push(z(['Total','','',tb].concat(tot).concat(['',''])));
      L.push(z(['Offen','','',ob].concat(off).concat(['',''])));
      L.push(z(['Bezahlt','','',bb].concat(bez).concat(['',''])));
    }
    gib('GAEPP-' + j + '.csv', '﻿' + L.join('\r\n') + '\r\n', 'text/csv;charset=utf-8');
  });
  S.exp = null; zeichne();
}

/* ==================================================== Bedienung */
function daten(el, name) { let n = el; while (n && n !== document) {
  if (n.dataset && n.dataset[name] !== undefined) return n; n = n.parentNode; } return null; }

document.addEventListener('click', e => {
  const t = e.target;
  const tref = n => daten(t, n);
  let x;
  if ((x = tref('gehJahr')))    { S.jahr = parseInt(x.dataset.gehJahr,10);
                                  if (S.ansicht === 'alle') S.ansicht = 'budget'; return neu(); }
  if ((x = tref('gehAnsicht'))) { S.ansicht = x.dataset.gehAnsicht; return neu(); }
  if ((x = tref('gehAlle')))    { S.ansicht = 'alle'; return neu(); }
  if ((x = tref('klapp')))      { const id = x.dataset.klapp;
                                  S.auf = offen(id) ? S.auf.filter(y => y !== id) : S.auf.concat([id]); return neu(); }
  if ((x = tref('alleUm')))     { if (S.auf.length) S.auf = []; else {
                                    const ids = []; jahre().forEach(j => (S.daten[j]||[]).forEach(b => { ids.push(b.id);
                                      if (b.art === 'schulden') (b.gruppen||[]).forEach(g => ids.push(g.id)); }));
                                    jahre().forEach(j => (S.rechnungen[j]||[]).forEach(g => ids.push(g.id)));
                                    S.auf = ids; } return neu(); }
  if ((x = tref('nullen')))     { S.nullen = !S.nullen; return neu(); }
  if ((x = tref('themeUm')))    { S.theme = S.theme === 'hell' ? 'dunkel' : 'hell'; return neu(); }
  if ((x = tref('drucken')))    { window.print(); return; }
  if ((x = tref('exp')))        { S.exp = { jahre: S.ansicht === 'alle' ? jahre() : [S.jahr], rech:true }; return zeichne(); }
  if ((x = tref('expJahr')))    { const j = parseInt(x.dataset.expJahr,10);
                                  S.exp.jahre = S.exp.jahre.indexOf(j) >= 0 ? S.exp.jahre.filter(y => y !== j)
                                    : S.exp.jahre.concat([j]); return zeichne(); }
  if ((x = tref('expRech')))    { S.exp.rech = !S.exp.rech; return zeichne(); }
  if ((x = tref('expJson')))    return jsonSichern();
  if ((x = tref('expCsv')))     return csvSichern();
  if ((x = tref('expHtml')))    return htmlSichern();
  if ((x = tref('laden')))      return dateiLaden();
  if ((x = tref('syncAuf')))    { S.syncAuf = true; return zeichne(); }
  if ((x = tref('repoHolen')))  return repoLesen();
  if ((x = tref('repoSichern'))){ druck = druck; return insRepo(); }
  if ((x = tref('zu')))         { S[x.dataset.zu === 'sync' ? 'syncAuf' : x.dataset.zu] =
                                    x.dataset.zu === 'sync' ? false : null; return zeichne(); }
  if ((x = tref('schleier')) && t === x) { S.ueb = null; S.neu = null; S.exp = null;
                                    S.wegJahr = null; S.syncAuf = false; return zeichne(); }
  if ((x = tref('neuJahr')))    { S.neu = { jahr: Math.max.apply(null, jahre()) + 1, budget:true, raten:false }; return zeichne(); }
  if ((x = tref('wegJahrAn')))  { jahrLoeschen(S.wegJahr); return neu(); }
  if ((x = tref('wegJahr')))    { S.wegJahr = S.jahr; return zeichne(); }
  if ((x = tref('jsonSichern')))return jsonSichern();
  if ((x = tref('frisch')))     return frischHolen();
  if ((x = tref('neuBudget')))  { S.neu.budget = !S.neu.budget; return zeichne(); }
  if ((x = tref('neuRaten')))   { S.neu.raten = !S.neu.raten; return zeichne(); }
  if ((x = tref('neuAn')))      { jahrAnlegen(); return neu(); }
  if ((x = tref('uebFolge')))   { S.ueb.folge = !S.ueb.folge; return zeichne(); }
  if ((x = tref('uebAn')))      { uebertragen(); return neu(); }
  if ((x = tref('neuPos')))     { e.stopPropagation(); return neuePos(x.dataset.neuPos); }
  if ((x = tref('weg')))        { return loeschePos(x.dataset.weg); }
  if ((x = tref('neuSteller'))) { return neuerSteller(); }
  if ((x = tref('neuRech')))    { e.stopPropagation(); return neueRechnung(x.dataset.neuRech); }
  if ((x = tref('wegRech')))    { return loescheRechnung(x.dataset.wegRech); }
  if ((x = tref('wegSteller'))) { e.stopPropagation(); return loescheSteller(x.dataset.wegSteller); }
});

  if (d.r !== undefined && d.f) {

  if (d.s !== undefined && e.target.className.indexOf('namensfeld') >= 0) {
    (S.rechnungen[S.jahr]||[]).forEach(g => { if (g.id === d.s) g.name = e.target.value; });
    merke(); return neu(); }
  if (d.sc) { setzeConf(d.sc, e.target.value); melde(syncConf().token && syncConf().repo ? 'lokal' : 'nicht verbunden',

/* ---------- Tab: eine Zelle weiter, am Zeilenende in die nächste Zeile ----------
   Nötig, weil das Übernehmen eines Werts die Tabelle neu zeichnet: der Browser
   hätte den Fokus dann auf ein Feld gesetzt, das es nicht mehr gibt. */
const TIPPBAR = '#blatt .zelle,#blatt .namensfeld,#blatt .datumsfeld,#blatt .stand';
function kennung(el) {
  const d = el.dataset || {}, teile = [];
  ['z','b','rm','r','s','p','f','m'].forEach(k => {
    if (d[k] !== undefined) teile.push('[data-' + k + '="' + String(d[k]).replace(/"/g,'\\"') + '"]'); });
  if (!teile.length) return null;
  return teile.join('') + '.' + String(el.className).trim().split(/\s+/)[0];
}
document.addEventListener('keydown', e => {
  if (e.key !== 'Tab' || e.altKey || e.ctrlKey || e.metaKey) return;
  const el = e.target;
  if (!el || !el.matches || !el.matches(TIPPBAR)) return;
  const felder = Array.prototype.slice.call(document.querySelectorAll(TIPPBAR));
  const i = felder.indexOf(el);
  if (i < 0) return;
  const ziel = felder[i + (e.shiftKey ? -1 : 1)];
  if (!ziel) return;
  e.preventDefault();
  const marke = kennung(ziel);
  el.dispatchEvent(new Event('change', { bubbles: true }));   /* zeichnet neu */
  const frisch = marke ? document.querySelector(marke) : null;
  const nimm = frisch || ziel;
  if (!nimm || !nimm.isConnected) return;
  nimm.focus();
  if (nimm.select) { try { nimm.select(); } catch(err) {} }
});

/* ---------- Rechtsklick: Monat erledigt / Rechnung bezahlt ---------- */
document.addEventListener('contextmenu', e => {
  const d = e.target.dataset || {};
  if (d.z !== undefined && d.m !== undefined) {
    e.preventDefault();
    const k = d.z + ':' + d.m;
    if (S.haken[k]) delete S.haken[k]; else S.haken[k] = true;
    merke(); return neu();
  }
  if (d.bez !== undefined) {
    e.preventDefault();
    inRechnung(d.bez, r => { r.stand = r.stand === 'Bezahlt' ? 'Offen' : 'Bezahlt'; });
    return neu();
  }
});

/* ---------- Doppelklick: Wert auf mehrere Monate übertragen ---------- */
document.addEventListener('dblclick', e => {
  const d = e.target.dataset || {};
  if (d.z === undefined || d.m === undefined) return;
  const f = findePos(d.z); if (!f) return;
  const m = +d.m;

});

/* ---------- Ziehen: nur innerhalb derselben Sektion ---------- */
document.addEventListener('dragstart', e => {
  const tr = daten(e.target, 'id'); if (!tr || tr.tagName !== 'TR') return;
  S.zieht = tr.dataset.id; S.ziel = null;
  if (e.dataTransfer) { e.dataTransfer.effectAllowed = 'move';
    try { e.dataTransfer.setData('text/plain', S.zieht); } catch(err) {} }
});
document.addEventListener('dragover', e => {
  const tr = daten(e.target, 'id'); if (!tr || tr.tagName !== 'TR' || !S.zieht) return;
  const id = tr.dataset.id; if (id === S.zieht) return;
  const a = findePos(S.zieht), b = findePos(id);
  if (!a || !b || a.eltern !== b.eltern) return;
  e.preventDefault();
  if (S.ziel !== id) { S.ziel = id; zeichne(); }
});
document.addEventListener('drop', e => {
  const tr = daten(e.target, 'id'); if (!tr || tr.tagName !== 'TR') return;
  e.preventDefault(); verschiebe(S.zieht, tr.dataset.id);
  S.zieht = null; S.ziel = null; neu();
});
document.addEventListener('dragend', () => { S.zieht = null; S.ziel = null; zeichne(); });

/* ---------- Zeilen anlegen und löschen ---------- */
function neuePos(ziel) {
  const frisch = { id:neueId(), key:'neu' + ZAEHLER, name:'Neue Zeile', basis:0, reihe:N12() };
  let rein = false;
  (S.daten[S.jahr]||[]).forEach(b => {
    if (b.id === ziel && b.art === 'block') { b.pos.push(frisch); rein = true; }
    if (b.art === 'schulden') {
      if (b.id === ziel && (b.gruppen||[]).length) { b.gruppen[0].pos.push(frisch); rein = true; }
      (b.gruppen||[]).forEach(g => { if (g.id === ziel) { g.pos.push(frisch); rein = true; } });
    }
  });
  if (!rein) return;
  if (!offen(ziel)) S.auf = S.auf.concat([ziel]);
  merke(); neu();
}
/* Nur im gezeigten Jahrgang. Eine Schuld, die 2027 erledigt ist, bleibt in den
   Vorjahren stehen — dort ist sie ja gelaufen. */
function loeschePos(id) {
  (S.daten[S.jahr]||[]).forEach(b => {
    if (b.art === 'schulden') (b.gruppen||[]).forEach(g => { g.pos = (g.pos||[]).filter(p => p.id !== id); });
    else b.pos = (b.pos||[]).filter(p => p.id !== id); });
