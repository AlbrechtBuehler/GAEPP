  <div class=\"feld voll\"><label>Takt<\u002Flabel>\n        <span class=\"schalter\" role=\"group\">\n          <button data-takt=\"monatlich\" aria-pressed=\"true\">Monatlich<\u002Fbutton>\n          <button data-takt=\"quartalsweise\" aria-pressed=\"false\">Quartalsweise<\u002Fbutton>\n          <button data-takt=\"jaehrlich\" aria-pressed=\"false\">Jährlich<\u002Fbutton><\u002Fspan><\u002Fdiv>\n      <div class=\"feld voll\"><label>Art<\u002Flabel>\n        <span class=\"schalter\" role=\"group\">\n          <button data-sart=\"ausgabe\" aria-pressed=\"true\">Ausgabe<\u002Fbutton>\n          <button data-sart=\"einnahme\" aria-pressed=\"false\">Einnahme<\u002Fbutton>\n          <button data-sart=\"umbuchung\" aria-pressed=\"false\">Umbuchung<\u002Fbutton><\u002Fspan><\u002Fdiv>\n      <div class=\"feld\"><label>Betrag<\u002Flabel><input class=\"num\" id=\"sBetrag\" type=\"text\" inputmode=\"decimal\"><\u002Fdiv>\n      <div class=\"feld\"><label>Tag im Monat<\u002Flabel><input class=\"num\" id=\"sTag\" type=\"text\" value=\"${D.meta.lohntag}\"><\u002Fdiv>\n      <div class=\"feld\"><label>Ab Konto<\u002Flabel><select id=\"sKonto\">${kontoOptionen(kontoId)}<\u002Fselect><\u002Fdiv>\n      <div class=\"feld\"><label>Gegenkonto (bei Umbuchung)<\u002Flabel>\n        <select id=\"sGegen\"><option value=\"\">—<\u002Foption>${kontoOptionen('', kontoId)}<\u002Fselect><\u002Fdiv>\n      <div class=\"feld voll\"><label>Position<\u002Flabel><select id=\"sZeile\">${positionOptionen('', kontoId, S.jahr)}<\u002Fselect><\u002Fdiv>\n      <div class=\"feld\"><label>Beginnt<\u002Flabel><input type=\"date\" id=\"sStart\" value=\"${heuteISO()}\"><\u002Fdiv>\n      <div class=\"feld\"><label>Endet — leer heisst: läuft immer<\u002Flabel><input type=\"date\" id=\"sEnde\"><\u002Fdiv>\n      <div class=\"feld voll\"><label>Bezeichnung<\u002Flabel><input type=\"text\" id=\"sText\"><\u002Fdiv>\n      <div class=\"aktion\"><button class=\"knopf primaer\" id=\"btnSerieSpeichern\">Serie anlegen<\u002Fbutton>\n        <span class=\"hint\">Im fälligen Monat liegt ein <b>Vorschlag<\u002Fb> bereit, keine Buchung.<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>` };\n}\n\n/* ===================================================================\n   Belegablage und Tagessicherung (E-12, E-13)\n   Ein Browser darf nicht frei ins Dateisystem schreiben. Er darf es,\n   wenn der Mensch ihm einen Ordner ausdruecklich freigibt.\n\n   Am 17.08.2026 an drei Stellen ueberarbeitet:\n\n   A0  GAEPP legte den gesuchten Unterordner blind an — auch dann, wenn\n       der freigegebene Ordner selbst schon der gesuchte war. Wer\n       «03 - Dokumente» freigab, bekam «03 - Dokumente\\03 - Dokumente».\n       Jetzt wird beim Freigeben geprueft, ob wirklich der GAEPP-Ordner\n       gewaehlt wurde, und gesagt, wenn nicht.\n\n   A1  Belege liegen nach Jahr getrennt in «04 - Rechnungsablage»; das\n       Jahr kommt aus der Faelligkeit. Beim Buchen der Zahlung wandert\n       der Beleg in den Unterordner «Bezahlt».\n\n   F-03 Die Tagessicherung lief beim Start der App und scheiterte dort\n       lautlos: Ein Browser erteilt eine Ordnerberechtigung nur nach\n       einer Nutzergeste, und beim Start gibt es keine. Sie hat deshalb\n       nie geschrieben. Jetzt fragt sie beim Start gar nicht erst,\n       sondern holt nach, sobald geklickt wird — und sagt, wenn sie\n       nicht schreiben konnte. Eine Sicherung, die lautlos ausfaellt,\n       ist gefaehrlicher als gar keine, weil man sich auf sie verlaesst.\n   =================================================================== */\n\n/* Woran GAEPP seinen eigenen Ordner erkennt (A0). */\nconst GAEPP_UNTERORDNER = ['00 - Inbox', '01 - APP', '02 -  DB Backup',\n                           '03 - Dokumente', '04 - Rechnungsablage', '05 Archiv'];\nconst ORD_BELEGE    = '04 - Rechnungsablage';\nconst ORD_SICHERUNG = '02 -  DB Backup';\nconst ORD_BEZAHLT   = 'Bezahlt';\n\nlet _ordner     = null;\nlet _ordnerRuege = null;   /* A0: was am freigegebenen Ordner nicht stimmt */\nlet _sichOffen  = false;   /* F-03: Sicherung wartet auf eine Nutzergeste */\nlet _sichFehler = null;    /* F-03: warum sie zuletzt nicht schreiben konnte */\n\n/* ---- A0: Ist das wirklich der GAEPP-Ordner? ------------------------- */\nasync function ordnerPruefen(h) {\n  if (!h) return null;\n  if (GAEPP_UNTERORDNER.includes(h.name)) {\n    return 'Du hast «' + h.name + '» freigegeben — das ist ein Ordner *innerhalb* von GÄPP. ' +\n           'GÄPP braucht den GÄPP-Ordner selbst, sonst legt es seine Ordner ein zweites Mal an. ' +\n           'Gib bitte den Ordner «GÄPP» frei.';\n  }\n  try {\n    let treffer = 0;\n    for await (const [name, eintrag] of h.entries()) {\n      if (eintrag.kind === 'directory' && GAEPP_UNTERORDNER.includes(name)) treffer++;\n    }\n    if (treffer < 2) {\n      return 'In «' + h.name + '» stehen die GÄPP-Ordner nicht. Wenn das der richtige Ordner ' +\n             'ist, legt GÄPP sie beim ersten Schreiben an — sonst gib bitte den Ordner ' +\n             '«GÄPP» frei.';\n    }\n  } catch (err) { return null; }   /* nicht lesbar: keine Behauptung aufstellen */\n  return null;\n}\n\nasync function ordnerFreigeben() {\n  if (!window.showDirectoryPicker) {\n    alert('Dieser Browser kann keinen Ordner freigeben. GÄPP braucht dafür Chrome oder Edge.'); return;\n  }\n  try {\n    _ordner = await window.showDirectoryPicker({ mode:'readwrite' });\n    _ordnerRuege = await ordnerPruefen(_ordner);\n    await ordnerMerken(_ordner);\n    if (_ordnerRuege) alert(_ordnerRuege);\n    if (_blatt && _blatt.art === 'verwaltung') blattZeichnen();\n  } catch (err) { /* abgebrochen */ }\n}\n/* Die Freigabe wird in IndexedDB gemerkt — localStorage kann keine Handles halten. */\nfunction idb() {\n  return new Promise((ok, nein) => {\n    const r = indexedDB.open('gaepp', 1);\n    r.onupgradeneeded = () => r.result.createObjectStore('h');\n    r.onsuccess = () => ok(r.result); r.onerror = () => nein(r.error);\n  });\n}\nasync function ordnerMerken(h) {\n  try { const db = await idb();\n    await new Promise(ok => { const t = db.transaction('h','readwrite');\n      t.objectStore('h').put(h, 'ordner'); t.oncomplete = ok; });\n  } catch (err) {}\n}\nasync function ordnerHolen() {\n  try {\n    const db = await idb();\n    const h = await new Promise(ok => { const t = db.transaction('h','readonly');\n      const q = t.objectStore('h').get('ordner'); q.onsuccess = () => ok(q.result); });\n    if (!h) return null;\n    await h.queryPermission({ mode:'readwrite' });\n    return h;                     /* Bestaetigungsklick kann noch noetig sein */\n  } catch (err) { return null; }\n}\n\n/* opt.ohneGeste: nur fragen, was ohne Nutzergeste erlaubt ist (F-03).\n   opt.nichtAnlegen: den Ordner nicht erzeugen, nur oeffnen, wenn er da ist. */\nasync function unterordner(name, opt) {\n  if (!_ordner) return null;\n  opt = opt || {};\n  try {\n    if ((await _ordner.queryPermission({ mode:'readwrite' })) !== 'granted') {\n      /* F-03: Ohne Nutzergeste lehnt der Browser requestPermission ab. Beim\n         Start wird deshalb gar nicht erst gefragt — es wird nachgeholt. */\n      if (opt.ohneGeste) return null;\n      if ((await _ordner.requestPermission({ mode:'readwrite' })) !== 'granted') return null;\n    }\n    /* A0: Ist der freigegebene Ordner selbst schon der gesuchte, wird nicht\n       gedoppelt. Das ist das Netz unter der Pruefung beim Freigeben. */\n    if (_ordner.name === name) return _ordner;\n    return await _ordner.getDirectoryHandle(name, { create: !opt.nichtAnlegen });\n  } catch (err) { return null; }\n}\n\n/* ---- A1: Jahresordner und «Bezahlt» --------------------------------- */\nfunction belegJahr(r) {\n  const d = (r && r.faelligkeit) || heuteISO();\n  return String(d).slice(0, 4);\n}\nasync function belegOrdner(jahr, bezahlt, opt) {\n  const wurzel = await unterordner(ORD_BELEGE, opt);\n  if (!wurzel) return null;\n  try {\n    const j = await wurzel.getDirectoryHandle(String(jahr), { create: !(opt && opt.nichtAnlegen) });\n    if (!bezahlt) return j;\n    return await j.getDirectoryHandle(ORD_BEZAHLT, { create: !(opt && opt.nichtAnlegen) });\n  } catch (err) { return null; }\n}\nfunction belegName(datei, stellerName, betrag, datum) {\n  const endung = (String(datei.name).match(/\\.[a-z0-9]+$/i) || ['.pdf'])[0];\n  return `${datum} - ${stellerName} - ${fmt(betrag)}${endung}`;\n}\n/* Ein Beleg geht nie verloren. Ist kein Ordner freigegeben oder klemmt der\n   Zugriff, wandert die Datei in den Zwischenspeicher des Browsers und wird\n   nachgereicht, sobald der Ordner wieder da ist. */\nasync function belegMerken(id, datei, name) {\n  try {\n    const db = await idb();\n    await new Promise(ok => { const t = db.transaction('h','readwrite');\n      t.objectStore('h').put({ blob: datei, name }, 'beleg:' + id); t.oncomplete = ok; });\n    return true;\n  } catch (err) { return false; }\n}\nasync function belegAusSpeicher(id) {\n  try {\n    const db = await idb();\n    return await new Promise(ok => { const t = db.transaction('h','readonly');\n      const q = t.objectStore('h').get('beleg:' + id); q.onsuccess = () => ok(q.result); });\n  } catch (err) { return null; }\n}\nasync function belegVergessen(id) {\n  try { const db = await idb();\n    await new Promise(ok => { const t = db.transaction('h','readwrite');\n      t.objectStore('h').delete('beleg:' + id); t.oncomplete = ok; });\n  } catch (err) {}\n}\nasync function belegSchreiben(datei, name, jahr) {\n  const ord = await belegOrdner(jahr || heuteISO().slice(0,4), false);\n  if (!ord) return false;\n  try {\n    const fh = await ord.getFileHandle(name, { create:true });\n    const w = await fh.createWritable();\n    await w.write(await datei.arrayBuffer()); await w.close();\n    return true;\n  } catch (err) { return false; }\n}\n/* Nachreichen: alles, was im Zwischenspeicher liegt, in den Ordner schreiben. */\nasync function belegeNachreichen() {\n  let n = 0;\n  for (const r of D.rechnungen.filter(x => x.belegOffen)) {\n    const g = await belegAusSpeicher(r.id);\n    if (!g) continue;\n    if (await belegSchreiben(g.blob, g.name, belegJahr(r))) {\n      r.belegDatei = g.name; r.belegOffen = false;\n      await belegVergessen(r.id); n++;\n    }\n  }\n  if (n) persist();\n  return n;\n}\n/* Wo ein Beleg liegen kann — in dieser Reihenfolge gesucht. Der flache\n   Wurzelordner steht mit drin, weil dort die Belege von vor dem Umbau\n   liegen; sie werden nicht von selbst einsortiert. */\nasync function belegHandle(r) {\n  const jahr = belegJahr(r);\n  const orte = [\n    () => belegOrdner(jahr, true,  { nichtAnlegen:true }),\n    () => belegOrdner(jahr, false, { nichtAnlegen:true }),\n    () => unterordner(ORD_BELEGE,  { nichtAnlegen:true })\n  ];\n  for (const hol of orte) {\n    const ord = await hol();\n    if (!ord) continue;\n    try { return { ordner: ord, datei: await ord.getFileHandle(r.belegDatei) }; }\n    catch (err) { /* hier nicht — naechster Ort */ }\n  }\n  return null;\n}\nasync function belegOeffnen(id) {\n  const r = D.rechnungen.find(x => x.id === id);\n  if (!r) return;\n  if (r.belegDatei) {\n    const gefunden = await belegHandle(r);\n    if (gefunden) {\n      try {\n        const f = await gefunden.datei.getFile();\n        window.open(URL.createObjectURL(f), '_blank');\n        return;\n      } catch (err) { /* unten weiterversuchen */ }\n    }\n  }\n  const g = await belegAusSpeicher(id);\n  if (g) { window.open(URL.createObjectURL(g.blob), '_blank'); return; }\n  alert('Der Beleg ist gerade nicht erreichbar. Gib den GÄPP-Ordner in der Verwaltung frei.');\n}\n/* A1: Beim Buchen der Zahlung wandert der Beleg nach «Bezahlt».\n   Verschieben kann Chrome mit move(). Wo das fehlt, wird kopiert — und\n   erst geloescht, wenn das Schreiben nachweislich geklappt hat. */\nasync function belegNachBezahlt(r) {\n  if (!r || !r.belegDatei) return false;\n  const gefunden = await belegHandle(r);\n  if (!gefunden) return false;\n  const ziel = await belegOrdner(belegJahr(r), true);\n  if (!ziel) return false;\n  if (gefunden.ordner === ziel) return true;          /* liegt schon richtig */\n  try {\n    if (typeof gefunden.datei.move === 'function') {\n      await gefunden.datei.move(ziel);\n      return true;\n    }\n    const f = await gefunden.datei.getFile();\n    const neu = await ziel.getFileHandle(r.belegDatei, { create:true });\n    const w = await neu.createWritable();\n    await w.write(await f.arrayBuffer()); await w.close();\n    const probe = await (await ziel.getFileHandle(r.belegDatei)).getFile();\n    if (probe.size !== f.size) return false;          /* nicht loeschen, wenn unklar */\n    await gefunden.ordner.removeEntry(r.belegDatei);\n    return true;\n  } catch (err) { return false; }\n}\n\n/* ---- F-03: Tagessicherung ------------------------------------------- */\n/* Beim ersten Oeffnen am Tag eine Sicherung — eine Sicherung, an die man\n   denken muss, ist im Ernstfall drei Monate alt. */\nasync function tagessicherung(opt) {\n  if (!D || _ro) return false;\n  const heute = heuteISO();\n  if (localStorage.getItem('gaepp.sicherung') === heute) {\n    _sichOffen = false; _sichFehler = null; return true;\n  }\n  const ord = await unterordner(ORD_SICHERUNG, opt);\n  if (!ord) {\n    /* Ohne Geste ist das kein Fehler, sondern ein «spaeter». Mit Geste\n       schon: dann fehlt die Freigabe wirklich. */\n    _sichOffen = true;\n    _sichFehler = (opt && opt.ohneGeste) ? null\n                : 'GÄPP konnte die Tagessicherung nicht ablegen — der GÄPP-Ordner ist nicht freigegeben.';\n    return false;\n  }\n  try {\n    const fh = await ord.getFileHandle('GAEPP-Daten-' + heute + '.json', { create:true });\n    const w = await fh.createWritable();\n    await w.write(JSON.stringify(D, null, 1)); await w.close();\n    localStorage.setItem('gaepp.sicherung', heute);\n    _sichOffen = false; _sichFehler = null;\n    return true;\n  } catch (err) {\n    _sichOffen = true;\n    _sichFehler = 'GÄPP konnte die Tagessicherung nicht schreiben: ' + (err.message || err);\n    return false;\n  }\n}\n/* Nachholen, sobald eine Nutzergeste vorliegt (F-03). Wird aus dem\n   Klick-Handler gerufen und laeuft hoechstens einmal je Sitzung an. */\nfunction sicherungNachholen() {\n  if (!_sichOffen || !_ordner) return;\n  _sichOffen = false;\n  tagessicherung().then(ok => { if (!ok && _sichFehler) sicherungMelden(); });\n}\nfunction sicherungMelden() {\n  const el = document.getElementById('vwSicherung');\n  if (el) el.textContent = sicherungText();\n}\n/* Was der Mensch ueber den Stand der Sicherung wissen muss. */\nfunction sicherungText() {\n  const letzte = localStorage.getItem('gaepp.sicherung');\n  if (_sichFehler) return _sichFehler;\n  if (letzte === heuteISO()) return 'Tagessicherung: heute abgelegt.';\n  if (!letzte) return 'Tagessicherung: bisher keine abgelegt. Gib dafür den GÄPP-Ordner frei.';\n  const tage = Math.round((new Date(heuteISO()) - new Date(letzte)) / 86400000);\n  return 'Tagessicherung: zuletzt am ' + letzte + (tage > 1 ? ' — das ist ' + tage + ' Tage her.' : '.');\n}\n/* Der Ausgang fuer den Menschen (A-89) */\nfunction jsonAb() {\n  const b = new Blob([JSON.stringify(D, null, 1)], { type:'application/json' });\n  const a = document.createElement('a');\n  a.href = URL.createObjectURL(b); a.download = 'GAEPP-Daten-' + heuteISO() + '.json';\n  a.click();\n}\nfunction jsonAuf() {\n  const i = document.createElement('input');\n  i.type = 'file'; i.accept = '.json,application/json';\n  i.onchange = async () => {\n    const f = i.files[0]; if (!f) return;\n    try {\n      const g = JSON.parse(await f.text());\n      if (!g.meta || !g.konten) throw new Error('Das ist keine GÄPP-Datei.');\n      uebernehmen(g); _sig = undefined; persist(); blattZu();\n    } catch (err) { alert('Konnte nicht gelesen werden: ' + err.message); }\n  };\n  i.click();\n}\n\n/* ===================================================================\n   F-07: Einen Gläubiger anlegen, ändern, ausblenden.\n   Bis zum 17.08.2026 gab es das nicht — die Verwaltung konnte\n   Kategorien, Rechnungssteller und Sparziele anlegen, Verbindlichkeiten\n   nicht. In einer App, deren Zweck die Entschuldung ist. Genau dieses\n   fehlende Bauteil hat dazu gefuehrt, dass eine neue Steuerschuld als\n   unsichtbarer Zuschlag auf eine bestehende Zeile geschrieben wurde,\n   statt als eigene Zeile zu entstehen.\n   =================================================================== */\n/* Eine Zeile der Dokumentliste. Sie wird beim Hinzufuegen ins DOM geschoben\n   statt das Blatt neu zu zeichnen — sonst waere jeder halb getippte Betrag\n   in den Feldern darueber weg. Gelesen wird erst beim Speichern, aus dem\n   DOM: ein zweiter Merker daneben waere ein zweiter Stand, der abweichen kann. */\nfunction dokZeileHtml(d) {\n  return `<div class=\"dok\">\n    <input type=\"text\" class=\"dokName\" value=\"${htmlAttr(d && d.name)}\" placeholder=\"Bezeichnung\">\n    <input type=\"text\" class=\"dokUrl\"  value=\"${htmlAttr(d && d.url)}\"  placeholder=\"https://…\">\n    <button class=\"knopf klein gefahr\" type=\"button\" data-dokweg=\"1\">Entfernen<\u002Fbutton><\u002Fdiv>`;\n}\nfunction blattGlaeubiger(arg) {\n  /* arg ist entweder «neu:<gruppe>» oder die id einer Verbindlichkeit. */\n  const neu = String(arg || '').startsWith('neu:');\n  const v = neu ? null : verbind(arg);\n  const gruppe = neu ? String(arg).slice(4) : (v ? v.gruppe : 'privat');\n  const e = v || { bezeichnung:'', gruppe, anfangsstand:'', anfangsdatum: heuteISO(),\n                   zinssatz:'', gebuehr:'', kontoId:'schuld', hinweis:'', vereinbarungBis:'',\n                   dokumente:[] };\n  return {\n    titel: v ? 'Gläubiger ändern' : 'Gläubiger anlegen',\n    kennung: v ? 'Verbindlichkeit · ' + (GRUPPEN.find(g=>g.id===v.gruppe)||{}).name : null,\n    koerper: `<div class=\"maske\">\n      ${v ? `<input type=\"hidden\" id=\"gId\" value=\"${v.id}\">` : ''}\n      <div class=\"feld voll\"><label>Bezeichnung<\u002Flabel>\n        <input type=\"text\" id=\"gName\" value=\"${(e.bezeichnung||'').replace(/\"/g,'&quot;')}\"\n               placeholder=\"z.B. Steuern 2026\"><\u002Fdiv>\n      <div class=\"feld\"><label>Gruppe<\u002Flabel>\n        <select id=\"gGruppe\">${GRUPPEN.map(g =>\n          `<option value=\"${g.id}\" ${e.gruppe===g.id?'selected':''}>${g.name}<\u002Foption>`).join('')}<\u002Fselect><\u002Fdiv>\n      <div class=\"feld\"><label>Zahlungskonto<\u002Flabel>\n        <select id=\"gKonto\">${kontoOptionen(e.kontoId || 'schuld')}<\u002Fselect><\u002Fdiv>\n      <div class=\"feld\"><label>Anfangssaldo<\u002Flabel>\n        <input class=\"num\" id=\"gStand\" type=\"text\" inputmode=\"decimal\"\n               value=\"${e.anfangsstand !== '' && e.anfangsstand != null ? fmt(e.anfangsstand) : ''}\"><\u002Fdiv>\n      <div class=\"feld\"><label>Stand per<\u002Flabel>\n        <input type=\"date\" id=\"gDatum\" value=\"${e.anfangsdatum || heuteISO()}\"><\u002Fdiv>\n      <div class=\"feld\"><label>Monatszins %<\u002Flabel>\n        <input class=\"num\" id=\"gZins\" type=\"text\" inputmode=\"decimal\"\n               value=\"${e.zinssatz != null && e.zinssatz !== '' ? e.zinssatz : ''}\" placeholder=\"leer = zinsfrei\"><\u002Fdiv>\n      <div class=\"feld\"><label>Monatsgebühr<\u002Flabel>\n        <input class=\"num\" id=\"gGebuehr\" type=\"text\" inputmode=\"decimal\"\n               value=\"${e.gebuehr != null && e.gebuehr !== '' ? fmt(e.gebuehr) : ''}\" placeholder=\"leer = keine\"><\u002Fdiv>\n      <div class=\"feld\"><label>Vereinbarung bis<\u002Flabel>\n        <input type=\"date\" id=\"gBis\" value=\"${e.vereinbarungBis || ''}\"><\u002Fdiv>\n      <div class=\"feld voll\"><label>Hinweis — woher der Stand stammt<\u002Flabel>\n        <input type=\"text\" id=\"gHinweis\" value=\"${(e.hinweis||'').replace(/\"/g,'&quot;')}\"\n               placeholder=\"z.B. Schlussabrechnung vom 04.06.2026\"><\u002Fdiv>\n      <div class=\"feld voll\"><label>Dokumente — Zahlungsvereinbarung, Betreibung, Schreiben<\u002Flabel>\n        <div class=\"doks\" id=\"gDoks\">${(e.dokumente || []).map(dokZeileHtml).join('')}<\u002Fdiv>\n        <div style=\"margin-top:6px\"><button class=\"knopf klein\" type=\"button\" id=\"btnDokNeu\">Dokument hinzufügen<\u002Fbutton><\u002Fdiv>\n        <span class=\"meldung\" style=\"margin-top:6px\">Reine Verweise: GÄPP legt nichts ab und prüft\n          nichts nach. Ein toter Link ist ehrlicher als eine Kopie, die auseinanderläuft.\n          Die Adresse muss mit <b>http://<\u002Fb> oder <b>https://<\u002Fb> beginnen.<\u002Fspan><\u002Fdiv>\n      <div class=\"feld voll\"><span class=\"meldung\">Der Stand wird von hier an gerechnet:\n        Anfangssaldo minus deine gebuchten Zahlungen plus Erhöhungen. Die Raten trägst du\n        anschliessend in der Verbindlichkeitentabelle ein — Monat für Monat, wie beim Budget.<\u002Fspan><\u002Fdiv>\n      <div class=\"aktion\"><button class=\"knopf primaer\" id=\"btnGlaeubigerSpeichern\">${v?'Ändern':'Anlegen'}<\u002Fbutton>\n        <span class=\"hint\" id=\"gHint\"><\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>`,\n    /* U-30: Ausblenden und Loeschen stehen nebeneinander, und das ist Absicht.\n       Sie beantworten zwei verschiedene Fragen — «ich will die Zeile nicht mehr\n       sehen» und «diesen Glaeubiger hat es nie gegeben» —, und bis U-30 gab es\n       auf die zweite gar keine Antwort: abhaengige('verbindlichkeit', …) konnte\n       die Kaskade seit U-22, aber KEIN Knopf im ganzen Quelltext bot sie an.\n       Wer einen falsch angelegten Glaeubiger loswerden wollte, blendete ihn aus\n       und trug ihn danach in jeder Summe als Null mit. */\n    fuss: (v ? `<button class=\"knopf klein\" data-gaus=\"${v.id}\">Ausblenden<\u002Fbutton>\n                <button class=\"knopf klein gefahr\" data-vwloesch=\"verbindlichkeit:${v.id}\">Löschen<\u002Fbutton>` : '') +\n          `<button class=\"knopf\" data-zu>Schliessen<\u002Fbutton>`\n  };\n}\n\n/* ===================================================================\n   U-30 — Ein Konto anlegen und ändern\n   -------------------------------------------------------------------\n   GAEPP konnte bis zum 18.08.2026 KEIN Konto anlegen. `data-vwneu` gab\n   es fuer Kategorie, Rechnungssteller und Sparziel — die drei kleinsten\n   Stammdaten. Das Konto, an dem alles haengt (Kategorie, Buchung,\n   Rechnung, Verbindlichkeit, Sparziel), war nur ueber die JSON zu\n   erreichen. Damit war GAEPP mit einer leeren Datei nicht einrichtbar:\n   die App setzt acht Konten voraus, die sie selbst nicht herstellen kann.\n\n   BLATT UND NICHT PROMPT — die Entscheidung und ihr Grund:\n   vwNeu() fragt mit prompt(), und fuer «Bezeichnung» reicht das. Ein Konto\n   hat acht Felder. Eine Kette aus acht prompt()-Fenstern hat kein Zurueck\n   (Abbrechen im sechsten wirft die ersten fuenf weg), keine Vorschau, keine\n   Vorgabe, die man sieht, und vor allem keinen Platz fuer den Satz, der\n   `frei` erklaert. Genau dieses Feld entscheidet ueber «verfügbar» und\n   «pro Tag» — die beiden Zahlen, wegen denen Albrecht die App taeglich\n   oeffnet. Ein Haken ohne Erklaerung waere hier der teuerste Klick der\n   ganzen App. Also dieselbe Bauart wie blattGlaeubiger (F-07): ein Blatt\n   mit einer Maske, dieselben Felder fuer Anlegen und Aendern, dieselben\n   Knoepfe in der Fusszeile.\n\n   `sektion` steht als Auswahl und nicht als Haken, weil sie zwei Orte\n   benennt und keinen Zustand: 'konten' erscheint im Bereich Konten und\n   zaehlt in dessen Summe, 'reserve' steht unten in der eigenen Sektion.\n   =================================================================== */\nfunction naechsteKontoNr() {\n  /* Die Nummer ist nicht die Kennung — sie ist das, was auf der Kachel und in\n     jeder Auswahlliste vorn steht. Vorgeschlagen wird die naechste freie, damit\n     niemand die Liste durchzaehlen muss; ueberschreiben laesst sie sich. */\n  const n = D.konten.map(k => parseInt(k.nr, 10)).filter(x => !isNaN(x));\n  return String((n.length ? Math.max(...n) : 0) + 1).padStart(2, '0');\n}\nfunction blattKontoMaske(arg) {\n  const neu = String(arg || '') === 'neu';\n  const k = neu ? null : konto(arg);\n  const e = k || { nr: naechsteKontoNr(), name:'', rang: Math.max(0, ...D.konten.map(x => x.rang || 0)) + 1,\n                   sektion:'konten', frei:true, rolle:'', anfangsstand:'', iban:'' };\n  return {\n    titel: k ? 'Konto ändern' : 'Konto anlegen',\n    kennung: k ? 'Konto ' + k.nr : null,\n    koerper: `<div class=\"maske\">\n      ${k ? `<input type=\"hidden\" id=\"kId\" value=\"${htmlAttr(k.id)}\">` : ''}\n      <div class=\"feld\"><label>Nummer<\u002Flabel>\n        <input type=\"text\" id=\"kNr\" value=\"${htmlAttr(e.nr)}\" placeholder=\"z.B. 09\"><\u002Fdiv>\n      <div class=\"feld\"><label>Reihenfolge<\u002Flabel>\n        <input class=\"num\" id=\"kRang\" type=\"text\" inputmode=\"numeric\" value=\"${htmlAttr(e.rang)}\"><\u002Fdiv>\n      <div class=\"feld voll\"><label>Name<\u002Flabel>\n        <input type=\"text\" id=\"kName\" value=\"${htmlAttr(e.name)}\" placeholder=\"z.B. Haushaltkonto\"><\u002Fdiv>\n      <div class=\"feld\"><label>Bereich<\u002Flabel>\n        <select id=\"kSektion\">\n          <option value=\"konten\" ${e.sektion !== 'reserve' ? 'selected' : ''}>Konten<\u002Foption>\n          <option value=\"reserve\" ${e.sektion === 'reserve' ? 'selected' : ''}>Reserve<\u002Foption>\n        <\u002Fselect><\u002Fdiv>\n      <div class=\"feld\"><label>Anfangssaldo<\u002Flabel>\n        <input class=\"num\" id=\"kStand\" type=\"text\" inputmode=\"decimal\"\n               value=\"${e.anfangsstand !== '' && e.anfangsstand != null ? fmt(e.anfangsstand) : ''}\"><\u002Fdiv>\n      <div class=\"feld voll\"><label>Rolle — wozu das Konto da ist<\u002Flabel>\n        <input type=\"text\" id=\"kRolle\" value=\"${htmlAttr(e.rolle)}\"\n               placeholder=\"z.B. laufende Ausgaben\"><\u002Fdiv>\n      <div class=\"feld voll\"><label>IBAN<\u002Flabel>\n        <input type=\"text\" id=\"kIban\" value=\"${htmlAttr(e.iban)}\" placeholder=\"CH..\"><\u002Fdiv>\n      <div class=\"feld haken voll\"><input type=\"checkbox\" id=\"kFrei\" ${e.frei ? 'checked' : ''}>\n        <label for=\"kFrei\">Das Geld auf diesem Konto ist frei verfügbar<\u002Flabel><\u002Fdiv>\n      <div class=\"feld voll\"><span class=\"meldung\"><b>Der Haken ist das wichtigste Feld dieser Maske.<\u002Fb>\n        Nur Konten mit Haken zählen in «verfügbar» und damit in «pro Tag» — die beiden Zahlen\n        oben im Kopf. Ein Konto <b>ohne<\u002Fb> Haken ist gebundenes Geld: Rückstellungen,\n        Kreditoren, alles, was schon jemandem gehört. Es steht weiter in der Liste und in der\n        Kontosumme, aber es erhöht nicht, was du heute ausgeben kannst.<\u002Fspan><\u002Fdiv>\n      <div class=\"feld voll\"><span class=\"meldung\"><b>Bereich<\u002Fb> entscheidet, wo die Kachel steht:\n        «Konten» oben im gleichnamigen Bereich und in dessen Summe, «Reserve» unten in der\n        eigenen Sektion. <b>Reihenfolge<\u002Fb> ist die Zahl, nach der sortiert wird —\n        kleiner steht weiter vorn.<\u002Fspan><\u002Fdiv>\n      <div class=\"aktion\"><button class=\"knopf primaer\" id=\"btnKontoSpeichern\">${k ? 'Ändern' : 'Anlegen'}<\u002Fbutton>\n        <span class=\"hint\" id=\"kHint\"><\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>`,\n    fuss: (k ? `<button class=\"knopf klein\" data-vwaus=\"konto:${k.id}\">${k.aktiv === false ? 'Einblenden' : 'Ausblenden'}<\u002Fbutton>\n                <button class=\"knopf klein gefahr\" data-vwloesch=\"konto:${k.id}\">Löschen<\u002Fbutton>` : '') +\n          `<button class=\"knopf\" data-zu>Schliessen<\u002Fbutton>`\n  };\n}\nfunction kontoSpeichern() {\n  const hint = t => { const h = $('#kHint'); if (h) h.textContent = t; };\n  /* A-88: Im Schreibschutz ist merkeStand() still. Eine Maske, die dann trotzdem\n     schriebe, legte ein Konto ohne Netz an — und in eine Datei, die die App gar\n     nicht versteht. Der Riegel steht hier und nicht nur im CSS: die Felder sind\n     dort abgeschaltet, der Knopf war es nie. */\n  if (_ro) return hint('GÄPP ist schreibgeschützt und legt nichts an.');\n  const name = ($('#kName').value || '').trim();\n  if (!name) return hint('Ohne Namen geht es nicht.');\n  let nr = ($('#kNr').value || '').trim();\n  if (!nr) return hint('Ohne Nummer geht es nicht — sie steht auf jeder Kachel und vorn in jeder Auswahlliste.');\n  /* Zweistellig, aber nur wenn es eine Zahl ist: «03» soll nicht als «3» neben\n     «04» stehen. Wer eine Nummer wie «K1» will, behaelt sie. */\n  if (/^\\d+$/.test(nr)) nr = nr.padStart(2, '0');\n  const alt = $('#kId') ? konto($('#kId').value) : null;\n  if (D.konten.some(x => x.nr === nr && x !== alt))\n    return hint('Die Nummer ' + nr + ' trägt schon ein anderes Konto. Zwei gleiche Nummern '\n              + 'liessen sich in den Auswahllisten nicht auseinanderhalten.');\n  const rangRoh = ($('#kRang').value || '').trim();\n  const rang = rangRoh === '' ? Math.max(0, ...D.konten.map(x => x.rang || 0)) + 1 : parseInt(rangRoh, 10);\n  if (isNaN(rang)) return hint('Die Reihenfolge muss eine Zahl sein.');\n  /* Erste Anweisung nach der letzten Pruefung, vor der ersten Zuweisung (U-20). */\n  merkeStand(alt ? 'Konto «' + name + '» geändert' : 'Konto «' + name + '» angelegt');\n  /* bankwerte und dokumente entstehen leer und werden hier nie angefasst: der\n     Bankabgleich sitzt in der Fusszeile des Kontoblatts, die Unterlagen im\n     vierten Reiter. Eine Maske, die sie mitschriebe, waere die zweite Stelle\n     fuer dieselbe Zahl. */\n  const o = alt || { id: neueId('ko'), bankwerte: [], dokumente: [], aktiv: true };\n  o.nr = nr;\n  o.name = name;\n  o.rang = rang;\n  o.sektion = $('#kSektion').value === 'reserve' ? 'reserve' : 'konten';\n  o.frei = !!$('#kFrei').checked;\n  o.rolle = ($('#kRolle').value || '').trim();\n  o.iban = ($('#kIban').value || '').trim();\n  o.anfangsstand = rd(zahl($('#kStand').value));\n  if (!alt) D.konten.push(o);\n  persist(); blattZu(); zeichne();\n}\n\n/* ===================================================================\n   GAEPP — Berichte, Export und Handbuch.\n\n   Fuenf Berichte, jeder mit einem Satz, was er zeigt. Zeitraum und\n   Kategorien werden vor dem Erzeugen gesetzt, nicht danach.\n\n   Drei Festlegungen tragen diesen Teil:\n\n   - **Ein Bericht sieht aus wie das Werkzeug, aus dem er kommt.**\n     Dieselbe Farbwelt, dieselben Schriften, dieselbe Kachelanatomie.\n     Erst der Druck macht Papier daraus — dann kippt die ganze Farbwelt\n     auf weiss, und zwar ueber die Tokens, nicht ueber Sonderregeln.\n\n   - **Zeilen lassen sich anklicken und ausblenden, und alles zieht mit.**\n     Summen, Anteilsbalken und die Kennzahlen im Kopf. Ein eingefrorener\n     Stand, bei dem das Total nach dem Ausblenden stehen bleibt,\n     behauptet etwas Falsches.\n\n   - **Gerechnet wird an einer Stelle.** Die Zahlenzellen tragen ihren\n     Rohwert als data-w; Summen, Balken und Kennzahlen entstehen erst\n     beim Zeichnen aus diesen Werten. Deshalb rechnet die gesicherte\n     HTML-Datei mit demselben Code wie die Vorschau — er wird woertlich\n     mitgegeben, nicht ein zweites Mal geschrieben.\n   =================================================================== */\n\n/* Was der naechste Bericht zeigen soll. Lebt nur in der Ansicht. */\nlet _ber = null;\n/* U-21: Welche Kategorien in einem Berichtszeitraum ueberhaupt vorkommen.\n   Laeuft der Bericht ueber eine Jahresgrenze, gilt die VEREINIGUNG der\n   Jahre: sichtbar in EINEM davon reicht. Ein Bericht darf nichts weglassen,\n   was im Zeitraum liegt — er beschreibt Vergangenes, und was vergangen ist,\n   aendert sich durch eine spaetere Entscheidung nicht mehr. */\nfunction berKategorien(von, bis) {\n  const a = jahrVon(von), b = Math.max(a, jahrVon(bis));\n  return D.kategorien.filter(k => {\n    for (let j = a; j <= b; j++) if (katSicht(k, j)) return true;\n    return false;\n  });\n}\n/* Wird der Zeitraum verschoben, kommen Kategorien hinzu, die es dort noch\n   (oder schon) gab. Die muessen von selbst angehakt sein, sonst fiele ihre\n   Buchung stillschweigend aus dem Bericht. Was vorher schon zur Wahl stand\n   und abgewaehlt war, bleibt abgewaehlt — das war eine Entscheidung. */\nfunction berZeitraumSetzen(von, bis) {\n  const vorher = berKategorien(_ber.von, _ber.bis).map(k => k.id);\n  _ber.von = von; _ber.bis = bis;\n  berKategorien(von, bis).forEach(k => {\n    if (!vorher.includes(k.id) && !_ber.kategorien.includes(k.id)) _ber.kategorien.push(k.id);\n  });\n}\nfunction berStandard() {\n  const von = iso(S.jahr, S.monat, 1);\n  const bis = iso(S.jahr, S.monat, tageImMonat(S.jahr, S.monat));\n  return { art:'monat', kontoId:'hhk', verbId:null, von, bis,\n           kategorien: berKategorien(von, bis).map(k => k.id),\n           verlauf: true };\n}\nconst BERICHTE = [\n  { id:'monat',   name:'Monatsauszug — alle Konten',\n    was:'Kopfzahlen, Verlauf, Aufstellung nach Kategorien mit Anteilsbalken, alle Konten mit Anfang und Ende, dazu die grössten Einzelposten.' },\n  { id:'jahr',    name:'Jahresauszug — alle Konten',\n    was:'Zwölf Monatsspalten je Konto, Kategorien über das ganze Jahr und Budget gegen Ist Monat für Monat. Querformat.' },\n  { id:'konto',   name:'Kontobericht',\n    was:'Ein Konto über den gewählten Zeitraum: Verlauf, Monat für Monat, jede Buchung mit laufendem Saldo, Bankwert und Differenz. Auch für eine Schuld.' },\n  { id:'schuld',  name:'Verbindlichkeiten über alle Jahre',\n    was:'Entwicklung je Gläubiger mit Stand, Rate, Zins und dem Monat, in dem sie getilgt ist — oder dem Vermerk, dass der Plan nicht reicht.' },\n  { id:'export',  name:'Ganzes Tool, eingefroren',\n    was:'Eine HTML-Datei zum Weiterreichen. Öffnet ohne Netz; Reiter, Klappköpfe und Filter arbeiten, ändern lässt sich nichts.' }\n];\n\nfunction blattBericht(arg) {\n  if (String(arg || '').startsWith('zeige:')) return berichtVorschau(arg.slice(6));\n  if (!_ber) _ber = berStandard();\n  /* Aus einem Konto- oder Schuldblatt heraus ist die Sache schon klar. */\n  const v = String(arg || '');\n  if (v.startsWith('konto:'))  { _ber.art = 'konto';  _ber.kontoId = v.slice(6); _ber.verbId = null; }\n  if (v.startsWith('schuld:')) { _ber.art = 'konto';  _ber.verbId  = v.slice(7); }\n  return berichtWahl();\n}\n\nfunction berichtWahl() {\n  const istKonto = _ber.art === 'konto';\n  return { weit:true, titel:'Bericht und Export', koerper: `\n    <div class=\"wahlliste\">${BERICHTE.map(b => `\n      <label><input type=\"radio\" name=\"ber\" value=\"${b.id}\" ${_ber.art===b.id?'checked':''}>\n        <span><span class=\"bez\">${b.name}<\u002Fspan><span class=\"erl\">${b.was}<\u002Fspan><\u002Fspan><\u002Flabel>`).join('')}\n    <\u002Fdiv>\n    <div class=\"maske\" style=\"margin-top:14px\">\n      ${istKonto ? `<div class=\"feld voll\"><label>Welches Konto oder welche Schuld<\u002Flabel>\n        <select id=\"berKonto\">\n          <optgroup label=\"Konten\">${D.konten.filter(k=>k.aktiv!==false).sort((a,b)=>a.rang-b.rang)\n            .map(k => `<option value=\"k:${k.id}\" ${!_ber.verbId&&_ber.kontoId===k.id?'selected':''}>${k.nr} ${k.name}<\u002Foption>`).join('')}<\u002Foptgroup>\n          <optgroup label=\"Verbindlichkeiten\">${D.verbindlichkeiten.filter(v=>v.aktiv!==false)\n            .map(v => `<option value=\"v:${v.id}\" ${_ber.verbId===v.id?'selected':''}>${v.bezeichnung}<\u002Foption>`).join('')}<\u002Foptgroup>\n        <\u002Fselect><\u002Fdiv>` : ''}\n      <div class=\"feld\"><label>Von<\u002Flabel><input type=\"date\" id=\"berVon\" value=\"${_ber.von}\"><\u002Fdiv>\n      <div class=\"feld\"><label>Bis<\u002Flabel><input type=\"date\" id=\"berBis\" value=\"${_ber.bis}\"><\u002Fdiv>\n      <div class=\"feld voll\"><span class=\"filterzeile\">\n        <span class=\"lab\">Zeitraum<\u002Fspan>\n        <button class=\"knopf klein\" data-zeit=\"monat\">Dieser Monat<\u002Fbutton>\n        <button class=\"knopf klein\" data-zeit=\"jahr\">Dieses Jahr<\u002Fbutton>\n        <button class=\"knopf klein\" data-zeit=\"alles\">Ganzer Zeitraum<\u002Fbutton>\n      <\u002Fspan><\u002Fdiv>\n      <div class=\"feld haken voll\"><input type=\"checkbox\" id=\"berVerlauf\" ${_ber.verlauf?'checked':''}>\n        <label for=\"berVerlauf\">Verlaufsgrafik mitgeben<\u002Flabel><\u002Fdiv>\n      <div class=\"feld voll\"><span class=\"filterzeile\"><span class=\"lab\">Kategorien<\u002Fspan>\n        ${berKategorien(_ber.von, _ber.bis).sort((a,b)=>a.rang-b.rang).map(k =>\n          `<button class=\"filter\" data-berkat=\"${k.id}\" aria-pressed=\"${_ber.kategorien.includes(k.id)}\">${k.name}<\u002Fbutton>`).join('')}\n      <\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>`,\n    fuss:`<button class=\"knopf\" data-zu>Abbrechen<\u002Fbutton>\n          <button class=\"knopf primaer\" id=\"btnBerichtErzeugen\">Erzeugen<\u002Fbutton>` };\n}\n\nfunction berichtVorschau(art) {\n  return { weit:true, titel:'Bericht',\n    koerper:`<div id=\"berichtVorschau\">${berichtHtml(art)}<\u002Fdiv>`,\n    fuss:`<button class=\"knopf\" id=\"btnBerichtZurueck\">Zurück zur Auswahl<\u002Fbutton>\n          <span class=\"meldung\" data-ausgeblendet style=\"margin-right:auto;margin-left:10px\"><\u002Fspan>\n          <button class=\"knopf\" id=\"btnBerichtHtml\">Als HTML sichern<\u002Fbutton>\n          <button class=\"knopf primaer\" id=\"btnDrucken\">Drucken oder als PDF<\u002Fbutton>`,\n    /* Summen, Balken und Kennzahlen entstehen erst hier — mit demselben Code,\n       der spaeter in der gesicherten Datei laeuft. */\n    danach: () => berichtRechnen($('#berichtVorschau')) };\n}\n\n/* ===================================================================\n   Zeilen ausblenden — und alles zieht nach.\n   Diese Funktion wird woertlich in die gesicherte HTML-Datei kopiert\n   (ueber Function.toString). Sie darf deshalb nichts aus der App\n   benutzen ausser fmt, das genauso mitgegeben wird.\n   =================================================================== */\nfunction berichtRechnen(wz) {\n  if (!wz) return;\n  const zahl = td => td ? (parseFloat(td.getAttribute('data-w')) || 0) : 0;\n  /* Eine Zelle beschriften. data-sig sagt, wie das Vorzeichen zu lesen ist. */\n  const zeig = (el, v) => {\n    const a = el.getAttribute('data-sig') || '';\n    const leer = Math.abs(v) < 0.005;\n    let t;\n    if (a === 'plus')       t = leer ? '–' : '+' + fmt(v);\n    else if (a === 'minus') t = leer ? '–' : '−' + fmt(Math.abs(v));\n    else if (a === 'saldo') t = (v < -0.005 ? '−' : '+') + fmt(Math.abs(v));\n    else                    t = fmt(v);\n    el.textContent = t;\n    el.classList.remove('ok', 'err');\n    if (a === 'saldo') { if (v > 0.005) el.classList.add('ok'); if (v < -0.005) el.classList.add('err'); }\n    else if (a === 'minus' && !leer) el.classList.add('err');\n    else if (a === 'plus'  && !leer) el.classList.add('ok');\n    else if (a === 'wert'  && v < -0.005) el.classList.add('err');\n  };\n  /* «1|-2» heisst: Spalte 1 minus Spalte 2, ueber alle sichtbaren Zeilen. */\n  const summe = (zeilen, formel) => formel.split('|').reduce((s, teil) => {\n    const neg = teil.charAt(0) === '-';\n    const c = parseInt(neg ? teil.slice(1) : teil, 10);\n    return s + (neg ? -1 : 1) * zeilen.reduce((x, tr) => x + zahl(tr.cells[c]), 0);\n  }, 0);\n  const rund = x => Math.round(x * 100) / 100;\n\n  Array.prototype.forEach.call(wz.querySelectorAll('table.btab'), tab => {\n    const alle  = Array.prototype.slice.call(tab.querySelectorAll('tbody tr.bz'));\n    const sicht = alle.filter(tr => !tr.classList.contains('aus'));\n\n    /* Fusszeile der Tabelle */\n    Array.prototype.forEach.call(tab.querySelectorAll('tfoot td[data-sum]'), td =>\n      zeig(td, rund(summe(sicht, td.getAttribute('data-sum')))));\n\n    /* Zwischensummen je Gruppe */\n    Array.prototype.forEach.call(tab.querySelectorAll('tbody tr[data-gsum]'), tr => {\n      const g = tr.getAttribute('data-gsum');\n      const teil = sicht.filter(x => x.getAttribute('data-g') === g);\n      Array.prototype.forEach.call(tr.querySelectorAll('td[data-sum]'), td =>\n        zeig(td, rund(summe(teil, td.getAttribute('data-sum')))));\n    });\n\n    /* Anteilsbalken — der Nenner ist die Summe der sichtbaren Zeilen. */\n    const ac = tab.getAttribute('data-anteil');\n    if (ac !== null && ac !== undefined) {\n      const ganz = sicht.reduce((x, tr) => x + Math.abs(zahl(tr.cells[+ac])), 0);\n      alle.forEach(tr => {\n        const bar = tr.querySelector('.bbar'), pct = tr.querySelector('.bpct');\n        if (!bar) return;\n        const p = (!tr.classList.contains('aus') && ganz)\n          ? Math.abs(zahl(tr.cells[+ac])) / ganz * 100 : 0;\n        bar.style.width = p.toFixed(1) + '%';\n        /* Eine leere Spur bedeutet nichts und lenkt ab — sie verschwindet ganz. */\n        if (bar.parentNode) bar.parentNode.style.visibility = p ? '' : 'hidden';\n        if (pct) pct.textContent = p >= 0.5 ? Math.round(p) + ' %' : '';\n      });\n    }\n\n    /* Kennzahlen im Kopf haengen an genau einer Tabelle. */\n    if (tab.getAttribute('data-kz')) {\n      Array.prototype.forEach.call(wz.querySelectorAll('.bkennz b[data-sum]'), b =>\n        zeig(b, rund(summe(sicht, b.getAttribute('data-sum')))));\n    }\n  });\n\n  const n = wz.querySelectorAll('table.btab tbody tr.bz.aus').length;\n  const txt = n ? n + (n === 1 ? ' Zeile ausgeblendet' : ' Zeilen ausgeblendet') : '';\n  const wurzel = wz.ownerDocument || document;\n  Array.prototype.forEach.call(wurzel.querySelectorAll('[data-ausgeblendet]'), el => {\n    el.textContent = txt;\n  });\n}\n\n/* ---- Bausteine, die alle Berichte teilen ---------------------------- */\nfunction dmy(d) { return d.slice(8,10) + '.' + d.slice(5,7) + '.' + d.slice(0,4); }\n\n/* Kopf: Etikett, Titel, Untertitel, rechts das Ausgabedatum. */\nfunction berichtKopf(etikett, titel, unter, zahlen) {\n  return `<div class=\"bericht\"><div class=\"bkopf\">\n      <div><div class=\"cap\">${etikett}<\u002Fdiv><h1 class=\"ser\">${titel}<\u002Fh1>\n        <div class=\"bsub\">${unter}<\u002Fdiv><\u002Fdiv>\n      <div class=\"bstand\"><div class=\"cap s\">Stand<\u002Fdiv>\n        <div class=\"num\">${dmy(heuteISO())}<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>` +\n    (zahlen ? `<div class=\"bkennz\">${zahlen.map(z =>\n      `<div><div class=\"cap s\">${z[0]}<\u002Fdiv><b class=\"${z[2]||''}\"${\n        z[3] ? ` data-sum=\"${z[3]}\" data-sig=\"${z[4]||'saldo'}\"` : ''}>${z[1]}<\u002Fb><\u002Fdiv>`).join('')}<\u002Fdiv>` : '');\n}\nfunction berichtFuss(zusatz) {\n  return `<div class=\"bfuss\">GÄPP · Passend | Präzise | Praktisch · erzeugt am ${dmy(heuteISO())}` +\n    (zusatz ? ' · ' + zusatz : '') +\n    /* Was ausgeblendet wurde, steht auch auf dem Papier — dort fehlen die\n       Zeilen ganz, und eine Summe ohne diesen Hinweis waere eine Behauptung. */\n    `<span data-ausgeblendet><\u002Fspan><\u002Fdiv><\u002Fdiv>`;\n}\n/* Eine Zahlenzelle. Der Rohwert steht als data-w daneben — das Ausblenden\n   ist so nicht auf Textzerlegung angewiesen. */\nfunction zz(v, art, klasse) {\n  const w = rd(v || 0);\n  const leer = Math.abs(w) < 0.005;\n  let t, kl = klasse ? ' ' + klasse : '';\n  if (art === 'plus')       { t = leer ? '<span class=\"nix\">–<\u002Fspan>' : '+' + fmt(w); if (!leer) kl += ' ok'; }\n  else if (art === 'minus') { t = leer ? '<span class=\"nix\">–<\u002Fspan>' : '−' + fmt(Math.abs(w)); if (!leer) kl += ' err'; }\n  else if (art === 'saldo') { t = (w < -0.005 ? '−' : '+') + fmt(Math.abs(w));\n                              kl += w < -0.005 ? ' err' : (w > 0.005 ? ' ok' : ''); }\n  /* Ein Bestand von null ist eine Aussage — er wird ausgeschrieben, nicht\n     durch einen Strich ersetzt. Der Strich steht nur, wo nichts geflossen ist. */\n  else                      { t = fmt(w); if (w < -0.005) kl += ' err'; art = art || 'wert'; }\n  return `<td class=\"bzahl${kl}\" data-w=\"${w}\" data-sig=\"${art}\">${t}<\u002Ftd>`;\n}\n/* Eine leere Fusszelle — ihren Wert setzt berichtRechnen. */\nfunction fz(formel, art) {\n  return `<td class=\"bzahl\" data-sum=\"${formel}\" data-sig=\"${art || 'wert'}\"><\u002Ftd>`;\n}\n/* Der Balken sitzt in einer Spur fester Breite — sonst schiebt ein Anteil von\n   neunzig Prozent den Prozentwert in die naechste Zeile. */\nconst balken = '<td class=\"banteil\"><span class=\"bspur\"><span class=\"bbar\"><\u002Fspan><\u002Fspan>' +\n               '<span class=\"bpct\"><\u002Fspan><\u002Ftd>';\n\n/* Der Verlauf als SVG — er ueberlebt Drucken, HTML-Sichern und Weiterreichen.\n   Farben kommen aus den Tokens, damit der Druck sie mitkippt. */\nfunction verlaufSvg(punkte, beschriftung, hoehe) {\n  if (!punkte.length) return '';\n  const h = hoehe || 150, b = 720, lr = 46, or_ = 12, ur = 22;\n  const min = Math.min(0, ...punkte), max = Math.max(1, ...punkte);\n  const x = i => lr + (punkte.length === 1 ? (b-lr-8)/2 : i * (b - lr - 8) / (punkte.length - 1));\n  const y = v => or_ + (h - or_ - ur) * (1 - (v - min) / ((max - min) || 1));\n  const d = punkte.map((v,i) => (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(v).toFixed(1)).join(' ');\n  const flaeche = d + ' L' + x(punkte.length-1).toFixed(1) + ' ' + y(min).toFixed(1) +\n                  ' L' + x(0).toFixed(1) + ' ' + y(min).toFixed(1) + ' Z';\n  return `<svg class=\"ber-verlauf\" viewBox=\"0 0 ${b} ${h}\" preserveAspectRatio=\"none\">\n    <path d=\"${flaeche}\" fill=\"var(--accent)\" fill-opacity=\".12\"/>\n    <line x1=\"${lr}\" y1=\"${y(0).toFixed(1)}\" x2=\"${b-8}\" y2=\"${y(0).toFixed(1)}\"\n      stroke=\"var(--rule)\" stroke-width=\".8\"/>\n    <path d=\"${d}\" fill=\"none\" stroke=\"var(--accent)\" stroke-width=\"1.8\"/>\n    ${punkte.map((v,i)=>`<circle cx=\"${x(i).toFixed(1)}\" cy=\"${y(v).toFixed(1)}\" r=\"2\" fill=\"var(--accent)\"/>`).join('')}\n    <text x=\"2\" y=\"${(y(max)+4).toFixed(1)}\" font-size=\"9\" fill=\"var(--muted)\">${fmt(max,0)}<\u002Ftext>\n    <text x=\"2\" y=\"${(y(min)+4).toFixed(1)}\" font-size=\"9\" fill=\"var(--muted)\">${fmt(min,0)}<\u002Ftext>\n    ${beschriftung.map((t,i)=> {\n      if (beschriftung.length > 14 && i % 2) return '';\n      /* Die erste und die letzte Beschriftung haengen am Rand — mittig gesetzt\n         wuerde die letzte aus dem Bild laufen und abgeschnitten. */\n      const anker = i === 0 ? 'start' : (i === beschriftung.length - 1 ? 'end' : 'middle');\n      const px = i === 0 ? x(0) - 10 : (i === beschriftung.length - 1 ? b - 2 : x(i));\n      return `<text x=\"${px.toFixed(1)}\" y=\"${h-7}\" font-size=\"9\" fill=\"var(--muted)\" text-anchor=\"${anker}\">${t}<\u002Ftext>`;\n    }).join('')}\n  <\u002Fsvg>`;\n}\n/* Alle Buchungen im gewaehlten Zeitraum, nach den gewaehlten Kategorien gefiltert */\nfunction berBuchungen(filter) {\n  return D.buchungen.filter(b => {\n    if (b.datum < _ber.von || b.datum > _ber.bis) return false;\n    if (b.zeileId) {\n      const z = zeile(b.zeileId);\n      if (z && !_ber.kategorien.includes(z.kategorieId)) return false;\n    }\n    return !filter || filter(b);\n  }).sort((a,b) => a.datum < b.datum ? -1 : 1);\n}\nfunction monateImZeitraum() {\n  const a = ymOf(_ber.von), e = ymOf(_ber.bis), out = [];\n  let j = a.j, m = a.m;\n  while (j < e.j || (j === e.j && m <= e.m)) { out.push({ j, m }); m++; if (m === 12) { m = 0; j++; } }\n  return out.slice(0, 120);\n}\n/* Was in einem Monat wirklich gebucht wurde — Gegenstueck zum Budgetwert. */\nfunction istSaldoMonat(j, m) {\n  return rd(D.buchungen.reduce((s, b) => {\n    const d = ymOf(b.datum);\n    if (d.j !== j || d.m !== m) return s;\n    if (b.art === 'einnahme')  return s + b.betrag;\n    if (b.art === 'ausgabe')   return s - b.betrag;\n    if (b.art === 'korrektur') return s + (b.richtung === 'minus' ? -b.betrag : b.betrag);\n    return s;\n  }, 0));\n}\n\nfunction berichtHtml(art) {\n  if (art === 'monat')  return berichtMonat();\n  if (art === 'jahr')   return berichtJahr();\n  if (art === 'konto')  return _ber.verbId ? berichtSchuld(_ber.verbId) : berichtKonto(_ber.kontoId);\n  if (art === 'schuld') return berichtSchuldenplan();\n  return '<p>Unbekannter Bericht.<\u002Fp>';\n}\n\n/* ---- Monatsauszug: Kopfzahlen, Kategorien, Konten, Einzelposten ------ */\nfunction berichtMonat() {\n  const b = berBuchungen();\n  const eb = ymOf(_ber.bis);\n\n  /* Nach Kategorien — diese Tabelle traegt die Kennzahlen im Kopf. */\n  const nachKat = {};\n  b.forEach(x => {\n    const z = x.zeileId ? zeile(x.zeileId) : null;\n    const k = z ? kategorie(z.kategorieId) : null;\n    const schl = k ? k.id : (x.art === 'umbuchung' ? '_um' : '_ohne');\n    const name = k ? k.name : (x.art === 'umbuchung' ? 'Umbuchungen' : 'Ohne Position');\n    const e = nachKat[schl] || (nachKat[schl] = { name, n:0, ein:0, aus:0 });\n    e.n++;\n    if (x.art === 'einnahme') e.ein += x.betrag;\n    else if (x.art === 'ausgabe') e.aus += x.betrag;\n    else if (x.art === 'korrektur') { if (x.richtung === 'minus') e.aus += x.betrag; else e.ein += x.betrag; }\n  });\n  const katZeilen = Object.values(nachKat).sort((a,b2) => (b2.aus - b2.ein) - (a.aus - a.ein)).map(e =>\n    `<tr class=\"bz\" data-bgrp=\"${e.name}\"><td class=\"bn\">${e.name}\n      <div class=\"bsub\">${e.n} ${e.n===1?'Buchung':'Buchungen'}<\u002Fdiv><\u002Ftd>\n      ${zz(e.ein,'plus')}${zz(e.aus,'minus')}${zz(rd(e.ein-e.aus),'saldo')}${balken}<\u002Ftr>`).join('');\n\n  /* Konten mit Anfang, Bewegung, Ende */\n  const a = ymOf(_ber.von);\n  const kontoZeilen = D.konten.filter(k => k.aktiv !== false).sort((x,y)=>x.rang-y.rang).map(k => {\n    const anf = kontosaldo(k.id, a.m === 0 ? a.j-1 : a.j, a.m === 0 ? 11 : a.m-1);\n    const end = kontosaldo(k.id, eb.j, eb.m);\n    return `<tr class=\"bz\" data-bgrp=\"${k.name}\"><td class=\"bn\">${k.nr} ${k.name}\n      <div class=\"bsub\">${k.frei ? 'frei verfügbar' : 'zweckgebunden'}<\u002Fdiv><\u002Ftd>\n      ${zz(anf)}${zz(rd(end-anf),'saldo')}${zz(end)}<\u002Ftr>`;\n  }).join('');\n  const gesamt = rd(D.konten.reduce((s,k) => s + kontosaldo(k.id, eb.j, eb.m), 0));\n\n  /* Die groessten Einzelposten — dort sieht man, wohin der Monat lief. */\n  const gross = b.filter(x => x.art === 'ausgabe' || (x.art === 'korrektur' && x.richtung === 'minus'))\n    .sort((x,y) => y.betrag - x.betrag).slice(0, 12);\n  const grossZeilen = gross.map(x => {\n    const z = x.zeileId ? zeile(x.zeileId) : null;\n    const k = konto(x.kontoId);\n    return `<tr class=\"bz\" data-bgrp=\"${x.id}\"><td class=\"bn\">${z ? z.bezeichnung : artName(x.art)}\n      <div class=\"bsub\">${dmy(x.datum)}${x.text ? ' · ' + x.text : ''}<\u002Fdiv><\u002Ftd>\n      <td>${k ? k.nr + ' ' + k.name : '–'}<\u002Ftd>${zz(x.betrag,'minus')}${balken}<\u002Ftr>`;\n  }).join('');\n\n  const mon = monateImZeitraum();\n  const verlauf = _ber.verlauf && mon.length > 1\n    ? verlaufSvg(mon.map(x => rd(D.konten.reduce((s,k)=>s+kontosaldo(k.id,x.j,x.m),0))),\n                 mon.map(x => MON[x.m]), 150)\n    : '';\n\n  return berichtKopf('GÄPP · Auszug nach Kategorien',\n      dmy(_ber.von) + ' bis ' + dmy(_ber.bis),\n      'Alle Konten · ' + b.length + (b.length===1?' Buchung':' Buchungen') + ' im Zeitraum',\n      [['Einnahmen', '', 'ok', '1', 'plus'],\n       ['Ausgaben',  '', 'err', '2', 'minus'],\n       ['Saldo',     '', '',   '1|-2', 'saldo'],\n       ['Vermögen',  fmt(gesamt)],\n       ['Schuldenstand', '−' + fmt(schuldenSumme(eb.j, eb.m)), 'err']]) +\n    verlauf +\n    `<h2 class=\"bh\">Nach Kategorien<\u002Fh2>\n     <table class=\"btab\" data-kz=\"1\" data-anteil=\"2\">\n       <thead><tr><th class=\"bn\">Kategorie<\u002Fth><th class=\"bzahl\">Einnahmen<\u002Fth>\n         <th class=\"bzahl\">Ausgaben<\u002Fth><th class=\"bzahl\">Saldo<\u002Fth>\n         <th class=\"banteil\">Anteil Ausgaben<\u002Fth><\u002Ftr><\u002Fthead>\n       <tbody>${katZeilen || '<tr><td class=\"bn\" colspan=\"5\">Im Zeitraum ist nichts gebucht.<\u002Ftd><\u002Ftr>'}<\u002Ftbody>\n       <tfoot><tr><td class=\"bn\">Total<\u002Ftd>${fz('1','plus')}${fz('2','minus')}${fz('1|-2','saldo')}\n         <td class=\"banteil\"><\u002Ftd><\u002Ftr><\u002Ftfoot><\u002Ftable>\n\n     <h2 class=\"bh\">Konten<\u002Fh2>\n     <table class=\"btab\">\n       <thead><tr><th class=\"bn\">Konto<\u002Fth><th class=\"bzahl\">Anfang<\u002Fth>\n         <th class=\"bzahl\">Bewegung<\u002Fth><th class=\"bzahl\">Ende<\u002Fth><\u002Ftr><\u002Fthead>\n       <tbody>${kontoZeilen}<\u002Ftbody>\n       <tfoot><tr><td class=\"bn\">Summe<\u002Ftd>${fz('1')}${fz('2','saldo')}${fz('3')}<\u002Ftr><\u002Ftfoot><\u002Ftable>\n\n     ${gross.length ? `<h2 class=\"bh\">Grösste Einzelposten<\u002Fh2>\n     <table class=\"btab\" data-anteil=\"2\">\n       <thead><tr><th class=\"bn\">Position<\u002Fth><th>Konto<\u002Fth><th class=\"bzahl\">Betrag<\u002Fth>\n         <th class=\"banteil\">Anteil<\u002Fth><\u002Ftr><\u002Fthead>\n       <tbody>${grossZeilen}<\u002Ftbody>\n       <tfoot><tr><td class=\"bn\">Summe dieser Posten<\u002Ftd><td><\u002Ftd>${fz('2','minus')}\n         <td class=\"banteil\"><\u002Ftd><\u002Ftr><\u002Ftfoot><\u002Ftable>` : ''}` +\n    berichtFuss('Budgetsaldo des Monats ' + fmt(saldoBudgetiert(eb.j, eb.m)));\n}\n\n/* ---- Jahresauszug --------------------------------------------------- */\nfunction berichtJahr() {\n  const j = ymOf(_ber.von).j;\n  const rows = D.konten.filter(k => k.aktiv !== false).sort((a,b)=>a.rang-b.rang).map(k =>\n    `<tr class=\"bz\" data-bgrp=\"${k.name}\"><td class=\"bn\">${k.nr} ${k.name}<\u002Ftd>${\n      MON.map((_,m)=>zz(kontosaldo(k.id,j,m))).join('')}${zz(kontosaldo(k.id,j,11))}<\u002Ftr>`).join('');\n  const verm = MON.map((_,m) => rd(D.konten.reduce((s,k)=>s+kontosaldo(k.id,j,m),0)));\n  const verlauf = _ber.verlauf ? verlaufSvg(verm, MON, 160) : '';\n\n  /* Kategorien ueber das ganze Jahr */\n  const von = _ber.von, bis = _ber.bis;\n  _ber.von = iso(j,0,1); _ber.bis = iso(j,11,31);\n  const jb = berBuchungen();\n  _ber.von = von; _ber.bis = bis;\n  const nachKat = {};\n  jb.forEach(x => {\n    const z = x.zeileId ? zeile(x.zeileId) : null;\n    const k = z ? kategorie(z.kategorieId) : null;\n    const schl = k ? k.id : (x.art === 'umbuchung' ? '_um' : '_ohne');\n    const name = k ? k.name : (x.art === 'umbuchung' ? 'Umbuchungen' : 'Ohne Position');\n    const e = nachKat[schl] || (nachKat[schl] = { name, n:0, ein:0, aus:0 });\n    e.n++;\n    if (x.art === 'einnahme') e.ein += x.betrag;\n    else if (x.art === 'ausgabe') e.aus += x.betrag;\n    else if (x.art === 'korrektur') { if (x.richtung === 'minus') e.aus += x.betrag; else e.ein += x.betrag; }\n  });\n  const katZeilen = Object.values(nachKat).sort((a,b2) => (b2.aus - b2.ein) - (a.aus - a.ein)).map(e =>\n    `<tr class=\"bz\" data-bgrp=\"${e.name}\"><td class=\"bn\">${e.name}\n      <div class=\"bsub\">${e.n} ${e.n===1?'Buchung':'Buchungen'}<\u002Fdiv><\u002Ftd>\n      ${zz(e.ein,'plus')}${zz(e.aus,'minus')}${zz(rd(e.ein-e.aus),'saldo')}${balken}<\u002Ftr>`).join('');\n\n  /* Budget gegen Ist — die Zeile, die zeigt, ob der Plan haelt */\n  const bvi = MON.map((_,m) => {\n    const plan = saldoBudgetiert(j,m), ist = istSaldoMonat(j,m);\n    return `<tr class=\"bz\" data-bgrp=\"${MON_LANG[m]}\"><td class=\"bn\">${MON_LANG[m]} ${j}<\u002Ftd>\n      ${zz(plan,'saldo')}${zz(ist,'saldo')}${zz(rd(ist-plan),'saldo')}<\u002Ftr>`;\n  }).join('');\n\n  return berichtKopf('GÄPP · Jahresauszug', 'Jahr ' + j, 'Kontostände am Monatsende',\n      [['Vermögen Ende', fmt(verm[11])],\n       ['Budgetsaldo', fmt(rd(MON.reduce((s,_,m)=>s+saldoBudgetiert(j,m),0)))],\n       ['Schulden Ende', '−' + fmt(schuldenPrognose(j,11)), 'err']]) +\n    verlauf +\n    `<h2 class=\"bh\">Konten Monat für Monat<\u002Fh2>\n     <table class=\"btab\">\n       <thead><tr><th class=\"bn\">Konto<\u002Fth>${MON.map(m=>`<th class=\"bzahl\">${m}<\u002Fth>`).join('')}\n         <th class=\"bzahl\">Ende<\u002Fth><\u002Ftr><\u002Fthead>\n       <tbody>${rows}<\u002Ftbody>\n       <tfoot><tr><td class=\"bn\">Vermögen<\u002Ftd>${MON.map((_,m)=>fz(String(m+1))).join('')}${fz('13')}<\u002Ftr><\u002Ftfoot><\u002Ftable>\n\n     <h2 class=\"bh\">Nach Kategorien im ganzen Jahr<\u002Fh2>\n     <table class=\"btab\" data-anteil=\"2\">\n       <thead><tr><th class=\"bn\">Kategorie<\u002Fth><th class=\"bzahl\">Einnahmen<\u002Fth>\n         <th class=\"bzahl\">Ausgaben<\u002Fth><th class=\"bzahl\">Saldo<\u002Fth>\n         <th class=\"banteil\">Anteil Ausgaben<\u002Fth><\u002Ftr><\u002Fthead>\n       <tbody>${katZeilen || '<tr><td class=\"bn\" colspan=\"5\">Im Jahr ist nichts gebucht.<\u002Ftd><\u002Ftr>'}<\u002Ftbody>\n       <tfoot><tr><td class=\"bn\">Total<\u002Ftd>${fz('1','plus')}${fz('2','minus')}${fz('1|-2','saldo')}\n         <td class=\"banteil\"><\u002Ftd><\u002Ftr><\u002Ftfoot><\u002Ftable>\n\n     <h2 class=\"bh\">Budget gegen Ist<\u002Fh2>\n     <table class=\"btab\">\n       <thead><tr><th class=\"bn\">Monat<\u002Fth><th class=\"bzahl\">Budgetiert<\u002Fth>\n         <th class=\"bzahl\">Gebucht<\u002Fth><th class=\"bzahl\">Abweichung<\u002Fth><\u002Ftr><\u002Fthead>\n       <tbody>${bvi}<\u002Ftbody>\n       <tfoot><tr><td class=\"bn\">Jahr ${j}<\u002Ftd>${fz('1','saldo')}${fz('2','saldo')}${fz('3','saldo')}<\u002Ftr><\u002Ftfoot><\u002Ftable>` +\n    berichtFuss('Gebucht heisst: wirklich erfasste Einnahmen und Ausgaben, ohne Umbuchungen');\n}\n\n/* ---- Kontobericht: Verlauf, Monat fuer Monat, jede Buchung ---------- */\nfunction berichtKonto(kId) {\n  const k = konto(kId);\n  const a = ymOf(_ber.von);\n  const alle = berBuchungen(b => b.kontoId === kId || b.gegenkontoId === kId);\n  let s = kontosaldo(kId, a.m === 0 ? a.j-1 : a.j, a.m === 0 ? 11 : a.m-1);\n  const anfang = s;\n  const punkte = [anfang];\n  const zeilen = alle.map(b => {\n    const w = wirkung(b, kId); s = rd(s + w); punkte.push(s);\n    const z = b.zeileId ? zeile(b.zeileId) : null;\n    return `<tr><td class=\"bn\">${z ? z.bezeichnung : artName(b.art)}\n      <div class=\"bsub\">${dmy(b.datum)}${b.text ? ' · ' + b.text : ''}${\n        b.art === 'umbuchung' ? ' · ' + (b.kontoId===kId ? 'an ' + konto(b.gegenkontoId).name\n                                                         : 'von ' + konto(b.kontoId).name) : ''}<\u002Fdiv><\u002Ftd>\n      ${zz(w,'saldo')}${zz(s)}<\u002Ftr>`;\n  }).join('');\n\n  /* Monat fuer Monat — der Teil, der im alten Bericht fehlte. */\n  const mon = monateImZeitraum();\n  let lauf = anfang;\n  const monZeilen = mon.map(x => {\n    let ein = 0, aus = 0;\n    alle.forEach(b => { const d = ymOf(b.datum);\n      if (d.j !== x.j || d.m !== x.m) return;\n      const w = wirkung(b, kId); if (w > 0) ein += w; else aus += -w; });\n    lauf = rd(lauf + ein - aus);\n    return `<tr class=\"bz\" data-bgrp=\"${MON[x.m]} ${x.j}\"><td class=\"bn\">${MON_LANG[x.m]} ${x.j}<\u002Ftd>\n      ${zz(ein,'plus')}${zz(aus,'minus')}${zz(rd(ein-aus),'saldo')}${zz(lauf)}${balken}<\u002Ftr>`;\n  }).join('');\n\n  const bw = letzterBankwert(k);\n  const eb = ymOf(_ber.bis);\n  const diff = bw ? rd(bw.wert - kontosaldo(kId, eb.j, eb.m)) : null;\n  const verlauf = _ber.verlauf && punkte.length > 1\n    ? verlaufSvg(punkte, alle.map(b => b.datum.slice(8,10) + '.' + b.datum.slice(5,7)), 150) : '';\n\n  return berichtKopf('GÄPP · Kontoauszug', k.nr + ' ' + k.name,\n      dmy(_ber.von) + ' bis ' + dmy(_ber.bis) + ' · ' + alle.length +\n        (alle.length===1?' Buchung':' Buchungen') + ' · ' + (k.frei ? 'frei verfügbar' : 'zweckgebunden'),\n      [['Anfang', fmt(anfang)], ['Ende', fmt(s), s < 0 ? 'err' : ''],\n       ['Bankauszug', bw ? fmt(bw.wert) : '–'],\n       ['Differenz', bw ? fmt(diff) : '–', diff ? 'err' : '']]) +\n    verlauf +\n    `<h2 class=\"bh\">Monat für Monat<\u002Fh2>\n     <table class=\"btab\" data-anteil=\"2\">\n       <thead><tr><th class=\"bn\">Monat<\u002Fth><th class=\"bzahl\">Ein<\u002Fth><th class=\"bzahl\">Aus<\u002Fth>\n         <th class=\"bzahl\">Bewegung<\u002Fth><th class=\"bzahl\">Endstand<\u002Fth>\n         <th class=\"banteil\">Anteil Ausgaben<\u002Fth><\u002Ftr><\u002Fthead>\n       <tbody>${monZeilen}<\u002Ftbody>\n       <tfoot><tr><td class=\"bn\">Zeitraum<\u002Ftd>${fz('1','plus')}${fz('2','minus')}${fz('1|-2','saldo')}\n         <td class=\"bzahl\">${fmt(s)}<\u002Ftd><td class=\"banteil\"><\u002Ftd><\u002Ftr><\u002Ftfoot><\u002Ftable>\n\n     <h2 class=\"bh\">Jede Buchung<\u002Fh2>\n     <table class=\"btab\">\n       <thead><tr><th class=\"bn\">Position<\u002Fth><th class=\"bzahl\">Betrag<\u002Fth>\n         <th class=\"bzahl\">Saldo<\u002Fth><\u002Ftr><\u002Fthead><tbody>\n       <tr><td class=\"bn\">Anfangsstand<div class=\"bsub\">${dmy(_ber.von)}<\u002Fdiv><\u002Ftd>\n         <td class=\"bzahl\"><span class=\"nix\">–<\u002Fspan><\u002Ftd>${zz(anfang)}<\u002Ftr>\n       ${zeilen}\n       <\u002Ftbody>\n       <tfoot><tr><td class=\"bn\">Endstand ${dmy(_ber.bis)}<\u002Ftd><td class=\"bzahl\"><\u002Ftd>\n         <td class=\"bzahl\">${fmt(s)}<\u002Ftd><\u002Ftr><\u002Ftfoot><\u002Ftable>` +\n    (bw ? `<p class=\"ber-notiz\">Bankauszug vom ${dmy(bw.datum)}: ${fmt(bw.wert)} · Quelle: ${bw.quelle || 'von Hand'}${\n       diff ? ' · Differenz zum gebuchten Stand ' + fmt(diff) : ' · stimmt mit dem gebuchten Stand überein'}<\u002Fp>` : '') +\n    berichtFuss();\n}\n\n/* ---- Bericht ueber eine Verbindlichkeit ----------------------------- */\nfunction berichtSchuld(vId) {\n  const v = verbind(vId);\n  const bew = [];\n  D.buchungen.filter(b => b.verbId === vId && b.datum >= _ber.von && b.datum <= _ber.bis)\n    .forEach(b => bew.push([b.datum, 'Zahlung' + (b.text ? ' · ' + b.text : ''), -b.betrag]));\n  (v.erhoehungen||[]).filter(e => e.datum >= _ber.von && e.datum <= _ber.bis)\n    .forEach(e => bew.push([e.datum, e.text || (e.art==='minderung'?'Minderung':'Erhöhung'),\n      e.art==='minderung' ? -e.betrag : e.betrag]));\n  bew.sort((a,b) => a[0] < b[0] ? -1 : 1);\n  const a = ymOf(_ber.von), eb = ymOf(_ber.bis);\n  let lauf = verbindStand(v, a.m === 0 ? a.j-1 : a.j, a.m === 0 ? 11 : a.m-1);\n  const anfang = lauf;\n  const zeilen = bew.map(r => { lauf = rd(lauf + r[2]);\n    return `<tr><td class=\"bn\">${r[1]}<div class=\"bsub\">${dmy(r[0])}<\u002Fdiv><\u002Ftd>\n      ${zz(r[2],'saldo')}${zz(lauf)}<\u002Ftr>`; }).join('');\n\n  const mon = monateImZeitraum();\n  const verlauf = _ber.verlauf && mon.length > 1\n    ? verlaufSvg(mon.map(x => verbindPrognose(v, x.j, x.m)), mon.map(x => MON[x.m]), 150) : '';\n\n  /* Jahr fuer Jahr — Stand, gezahlt, und was der Zins gefressen hat. */\n  const jahre = Object.keys(D.budget).map(Number).sort();\n  const jahrZeilen = jahre.map(j => {\n    const anf = j === jahre[0] ? verbindStand(v, j-1, 11) : verbindPrognose(v, j-1, 11);\n    const end = verbindPrognose(v, j, 11);\n    let gez = 0;\n    for (let m = 0; m < 12; m++) {\n      const g = rd(D.buchungen.reduce((x,b) => { const d = ymOf(b.datum);\n        return (b.verbId === v.id && d.j === j && d.m === m) ? x + b.betrag : x; }, 0));\n      const h = ymOf(heuteISO());\n      gez += g || (((j > h.j) || (j === h.j && m >= h.m)) ? rate(v, j, m) : 0);\n    }\n    const erh = rd((v.erhoehungen||[]).reduce((s,e) => ymOf(e.datum).j === j\n      ? s + (e.art === 'minderung' ? -e.betrag : e.betrag) : s, 0));\n    /* Was ueber Zahlungen und Erhoehungen hinaus dazukam, ist Zins und Gebuehr. */\n    const kosten = rd(end - anf + gez - erh);\n    return `<tr class=\"bz\" data-bgrp=\"${j}\"><td class=\"bn\">${j}<\u002Ftd>\n      ${zz(anf)}${zz(gez,'minus')}${zz(erh,'saldo')}${zz(kosten,'saldo')}${zz(end)}<\u002Ftr>`;\n  }).join('');\n\n  const ende = tilgungsende(v);\n  return berichtKopf('GÄPP · Verbindlichkeit', v.bezeichnung,\n      GRUPPEN.find(g=>g.id===v.gruppe).name + ' · ' + dmy(_ber.von) + ' bis ' + dmy(_ber.bis) +\n      ' · Herkunft: ' + v.herkunft,\n      [['Stand heute', fmt(verbindStandHeute(v)), 'err'],\n       ['Rate', fmt(rate(v, S.jahr, S.monat))],\n       ['Zins im Monat', v.zinssatz ? v.zinssatz + ' %' : '–'],\n       ['Gebühr', v.gebuehr ? fmt(v.gebuehr) : '–'],\n       ['Getilgt', ende || 'nach Plan nicht', ende ? 'ok' : 'err']]) +\n    verlauf +\n    `<h2 class=\"bh\">Bewegungen im Zeitraum<\u002Fh2>\n     <table class=\"btab\">\n       <thead><tr><th class=\"bn\">Vorgang<\u002Fth><th class=\"bzahl\">Betrag<\u002Fth>\n         <th class=\"bzahl\">Stand<\u002Fth><\u002Ftr><\u002Fthead><tbody>\n       <tr><td class=\"bn\">Stand zu Beginn<div class=\"bsub\">${dmy(_ber.von)}<\u002Fdiv><\u002Ftd>\n         <td class=\"bzahl\"><span class=\"nix\">–<\u002Fspan><\u002Ftd>${zz(anfang)}<\u002Ftr>\n       ${zeilen || '<tr><td class=\"bn\" colspan=\"3\">Im Zeitraum ist nichts gebucht.<\u002Ftd><\u002Ftr>'}\n       <\u002Ftbody>\n       <tfoot><tr><td class=\"bn\">Stand am Ende ${dmy(_ber.bis)}<\u002Ftd><td class=\"bzahl\"><\u002Ftd>\n         <td class=\"bzahl\">${fmt(lauf)}<\u002Ftd><\u002Ftr><\u002Ftfoot><\u002Ftable>\n\n     <h2 class=\"bh\">Jahr für Jahr<\u002Fh2>\n     <table class=\"btab\">\n       <thead><tr><th class=\"bn\">Jahr<\u002Fth><th class=\"bzahl\">Anfang<\u002Fth><th class=\"bzahl\">Gezahlt<\u002Fth>\n         <th class=\"bzahl\">Erhöhung<\u002Fth><th class=\"bzahl\">Zins und Gebühr<\u002Fth>\n         <th class=\"bzahl\">Ende<\u002Fth><\u002Ftr><\u002Fthead>\n       <tbody>${jahrZeilen}<\u002Ftbody>\n       <tfoot><tr><td class=\"bn\">Über alle Jahre<\u002Ftd><td class=\"bzahl\"><\u002Ftd>${fz('2','minus')}\n         ${fz('3','saldo')}${fz('4','saldo')}<td class=\"bzahl\"><\u002Ftd><\u002Ftr><\u002Ftfoot><\u002Ftable>\n\n     ${v.zahlung && v.zahlung.iban ? `<p class=\"ber-notiz\">Zahlung an ${v.zahlung.iban}${\n        v.zahlung.referenz ? ' · Referenz ' + v.zahlung.referenz : ''}<\u002Fp>` : ''}\n     ${v.vereinbarungBis ? `<p class=\"ber-notiz\">Vereinbarung befristet bis ${dmy(v.vereinbarungBis)}.<\u002Fp>` : ''}\n     ${v.hinweis ? `<p class=\"ber-notiz\">${v.hinweis}<\u002Fp>` : ''}` +\n    berichtFuss('Künftige Jahre sind gerechnet, nicht gebucht — mit Plan-Rate, Zins und Gebühr');\n}\n\n/* ---- Alle Verbindlichkeiten ueber alle Jahre ------------------------ */\nfunction berichtSchuldenplan() {\n  const jahre = Object.keys(D.budget).map(Number).sort();\n  const nJ = jahre.length;\n  const rows = GRUPPEN.map(g => {\n    const liste = D.verbindlichkeiten.filter(v => v.aktiv !== false && v.gruppe === g.id);\n    if (!liste.length) return '';\n    const kopf = `<tr class=\"grp\" data-gsum=\"${g.id}\"><td class=\"bn\">${g.name}<\u002Ftd>\n      ${jahre.map((_,i) => `<td class=\"bzahl\" data-sum=\"${i+1}\" data-sig=\"wert\"><\u002Ftd>`).join('')}\n      <td class=\"bn\"><\u002Ftd><\u002Ftr>`;\n    return kopf + liste.map(v => `<tr class=\"bz\" data-g=\"${g.id}\" data-bgrp=\"${v.bezeichnung}\">\n      <td class=\"bn\">${v.bezeichnung}<\u002Ftd>\n      ${jahre.map(j => zz(verbindPrognose(v, j, 11))).join('')}\n      <td class=\"bn\">${tilgungsende(v) || '<span class=\"err\">nach Plan nicht<\u002Fspan>'}<\u002Ftd><\u002Ftr>`).join('');\n  }).join('');\n  const summen = jahre.map(j => schuldenPrognose(j, 11));\n  const verlauf = _ber.verlauf ? verlaufSvg(summen, jahre.map(String), 160) : '';\n\n  /* Anteil am heutigen Schuldenberg — mit Rate, Zins und Balken. */\n  const heute = D.verbindlichkeiten.filter(v => v.aktiv !== false)\n    .map(v => ({ v, st: verbindStandHeute(v) }))\n    .sort((a,b) => b.st - a.st);\n  const anteilZeilen = heute.map(x => `<tr class=\"bz\" data-bgrp=\"${x.v.bezeichnung}\">\n    <td class=\"bn\">${x.v.bezeichnung}\n      <div class=\"bsub\">${GRUPPEN.find(g=>g.id===x.v.gruppe).name}<\u002Fdiv><\u002Ftd>\n    ${zz(x.st)}${zz(rate(x.v, S.jahr, S.monat),'minus')}\n    <td class=\"bzahl\">${[x.v.zinssatz ? x.v.zinssatz + ' %' : '',\n        x.v.gebuehr ? fmt(x.v.gebuehr) : ''].filter(Boolean).join(' + ') ||\n        '<span class=\"nix\">–<\u002Fspan>'}<\u002Ftd>\n    <td class=\"bn\">${tilgungsende(x.v) || '<span class=\"err\">nach Plan nicht<\u002Fspan>'}<\u002Ftd>${balken}<\u002Ftr>`).join('');\n\n  return berichtKopf('GÄPP · Verbindlichkeiten', 'Über alle Jahre',\n      'Stand am Stichtag ' + dmy(D.meta.stichtag) + ' und prognostizierte Entwicklung',\n      [['Am Stichtag', fmt(schuldenStichtag()), 'err'],\n       ['Heute', fmt(rd(D.verbindlichkeiten.reduce((s,v)=>s+verbindStandHeute(v),0))), 'err'],\n       ['Ende ' + jahre[nJ-1], fmt(summen[nJ-1]), summen[nJ-1] > 0.005 ? 'err' : 'ok']]) +\n    verlauf +\n    `<h2 class=\"bh\">Stand am 31. Dezember, Jahr für Jahr<\u002Fh2>\n     <table class=\"btab\">\n       <thead><tr><th class=\"bn\">Gläubiger<\u002Fth>${jahre.map(j=>`<th class=\"bzahl\">${j}<\u002Fth>`).join('')}\n         <th class=\"bn\">Getilgt<\u002Fth><\u002Ftr><\u002Fthead>\n       <tbody>${rows}<\u002Ftbody>\n       <tfoot><tr><td class=\"bn\">Summe<\u002Ftd>${jahre.map((_,i)=>fz(String(i+1))).join('')}\n         <td class=\"bn\"><\u002Ftd><\u002Ftr><\u002Ftfoot><\u002Ftable>\n\n     <h2 class=\"bh\">Anteil am heutigen Schuldenberg<\u002Fh2>\n     <table class=\"btab\" data-anteil=\"1\">\n       <thead><tr><th class=\"bn\">Gläubiger<\u002Fth><th class=\"bzahl\">Stand heute<\u002Fth>\n         <th class=\"bzahl\">Rate<\u002Fth><th class=\"bzahl\">Zins und Gebühr<\u002Fth><th class=\"bn\">Getilgt<\u002Fth>\n         <th class=\"banteil\">Anteil<\u002Fth><\u002Ftr><\u002Fthead>\n       <tbody>${anteilZeilen}<\u002Ftbody>\n       <tfoot><tr><td class=\"bn\">Summe<\u002Ftd>${fz('1')}${fz('2','minus')}<td class=\"bzahl\"><\u002Ftd>\n         <td class=\"bn\"><\u002Ftd><td class=\"banteil\"><\u002Ftd><\u002Ftr><\u002Ftfoot><\u002Ftable>` +\n    berichtFuss('Jahreswerte sind Stände am 31.12., gerechnet mit Zins und Gebühr');\n}\n\nfunction tilgungsende(v) {\n  const a = ymOf(v.anfangsdatum);\n  let j = a.j, m = a.m, s = v.anfangsstand;\n  if (a.t >= tageImMonat(a.j, a.m)) { m++; if (m===12) { m=0; j++; } }\n  const h = ymOf(heuteISO());\n  for (let i = 0; i < 160 && s > 0.005; i++) {\n    (v.erhoehungen||[]).forEach(e => { const d = ymOf(e.datum);\n      if (d.j===j && d.m===m) s += (e.art==='minderung'?-e.betrag:e.betrag); });\n    const gebucht = rd(D.buchungen.reduce((x,b) => { const d = ymOf(b.datum);\n      return (b.verbId === v.id && d.j === j && d.m === m) ? x + b.betrag : x; }, 0));\n    /* U-29: derselbe Schnitt wie in verbindLauf — der Tilgungsplan rechnet\n       jeden Monat mit der Rate, gebuchte Zahlungen haben Vorrang. */\n    s = rd(s * (1 + (v.zinssatz||0)/100) + (v.gebuehr||0) - (gebucht || rate(v, j, m)));\n    if (s <= 0.005) return MON_LANG[m] + ' ' + j;\n    m++; if (m===12) { m=0; j++; }\n  }\n  return null;\n}\n\n/* ---- Einen Bericht als eigenstaendige HTML-Datei sichern -------------\n   Die Datei kann, was die Vorschau kann: Zeilen anklicken, ausblenden,\n   Summen und Balken ziehen mit. Der Rechencode wird woertlich aus der App\n   uebernommen — so gibt es keine zweite Fassung, die auseinanderlaufen\n   koennte. Eingaben sind nicht bloss gesperrt, es gibt keine. */\nfunction berichtAlsHtml() {\n  const inhalt = $('#berichtVorschau').innerHTML;\n  const stil = Array.from(document.styleSheets).map(bl => {\n    try { return Array.from(bl.cssRules).map(r => r.cssText).join('\\n'); } catch (e) { return ''; }\n  }).join('\\n');\n  const tag = 'scr' + 'ipt';\n  const titel = ($('#berichtVorschau h1') || { textContent:'Bericht' }).textContent;\n  const skript = '<' + tag + '>\\n' +\n    fmt.toString() + '\\n' + berichtRechnen.toString() + '\\n' +\n    'document.addEventListener(\"click\", function (ev) {\\n' +\n    '  var tr = ev.target.closest ? ev.target.closest(\"tr.bz\") : null;\\n' +\n    '  if (!tr) return;\\n' +\n    '  tr.classList.toggle(\"aus\");\\n' +\n    '  berichtRechnen(tr.closest(\".bericht\"));\\n' +\n    '});\\n' +\n    'berichtRechnen(document.querySelector(\".bericht\"));\\n' +\n    '<\u002F' + tag + '>';\n  const html = `<!DOCTYPE html><html lang=\"de-CH\"><head><meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n<title>GÄPP — ${titel}<\u002Ftitle>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link href=\"https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap\" rel=\"stylesheet\">\n<style>\n${stil}\n/* --- Die Hoehe ueberschreiben: hier ist kein Fenster, sondern ein Blatt. --- */\nhtml,body{height:auto}\nbody{display:block;overflow:visible;background:var(--bg)}\n\n/* ===================================================================\n   U-32 — FARBWELT UND BUDGETTAFEL, ZWEITE FASSUNG\n   -------------------------------------------------------------------\n   Steht am Ende, damit sie ohne Eingriff in die Regeln darueber gilt.\n   Anthrazit-Blau statt Nacht-Braun, Minze statt Orange; die Farben der\n   Betraege bleiben, wie sie sind: Minze fuer Plus, Rose fuer Minus.\n   =================================================================== */\n:root{\n  --bg:#0c0f13; --card:#12161c; --sheet:#151b23; --soft:#1b2531;\n  --line:#1d232b; --rule:#2a3542; --ink:#f2f5f8; --muted:#8b95a2;\n  --accent:#8ee6c8; --onaccent:#0c0f13;\n  --ok:#8ee6c8; --err:#f0a08d; --open:#e3c98d;\n  --hairline:#151b23;\n}\nbody{font-family:'Space Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif}\n.marke{letter-spacing:.02em}\n.knopf.primaer:hover{filter:brightness(1.08)}\ntr:hover td.bearbeitbar input::placeholder,\ntd.bearbeitbar input:focus::placeholder{color:#3d4753}\n\n/* ---- Budgettafel: eine fixierte Spalte statt drei ------------------ */\n.t-budget{--w1:268px}\n.t-budget tbody td:nth-child(2),.t-budget tbody td:nth-child(3){position:static;left:auto;border-right:none}\n.t-budget thead th:nth-child(2),.t-budget thead th:nth-child(3),\n.t-budget thead td:nth-child(2),.t-budget thead td:nth-child(3){left:auto;border-right:none}\n.t-budget th:nth-child(1),.t-budget td:nth-child(1){border-right:1px solid var(--rule)}\n.t-budget th.n:nth-child(n+2),.t-budget td.n:nth-child(n+2),\n.t-budget td.bearbeitbar:nth-child(n+2){min-width:var(--wz,96px);max-width:var(--wz,96px)}\n.t-budget th:last-child,.t-budget td:last-child{min-width:var(--wl);max-width:var(--wl)}\n/* Die alte Regel hob die dritte Spalte (Soll) hervor — dort steht jetzt ein Monat. */\n.t-budget tr.zeile-daten td:nth-child(3){color:var(--muted)}\n.t-budget tr.zeile-daten:hover td:nth-child(3){color:var(--ink)}\n\n/* ---- Der gewonnene Platz geht in die Lesbarkeit ------------------- */\n.t-budget .n{font-size:12.5px;padding:0 9px}\n.t-budget td.bearbeitbar input{font-size:12.5px;padding:0 9px}\n.t-budget tr.zeile-daten > td{height:32px}\n\n/* ---- Laufender Monat als durchgehendes Band ----------------------- */\n.t-budget td.jetzt{background:rgba(142,230,200,.05)}\n.t-budget thead th.jetzt,.t-budget thead td.jetzt{background:#17232b}\n.t-budget thead th.jetzt{color:var(--accent)}\n\n/* ---- Aktive Zelle: eine, deutlich ---------------------------------- */\ntd.bearbeitbar:focus-within{background:var(--bg);box-shadow:inset 0 0 0 2px var(--accent)}\ntd.bearbeitbar input:focus{outline:none;color:#fff;font-weight:500}\n\n/* ---- Zahlungsweg: nur beim Ueberfahren der Zeile ------------------- */\n.t-budget .namenszelle .weg{opacity:0;transition:opacity .12s}\n.t-budget tr:hover .namenszelle .weg,\n.t-budget tr:focus-within .namenszelle .weg{opacity:1}\n.katkonto{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--muted);margin-left:8px}\n\n/* ---- Fähnchen an der aktiven Zelle -------------------------------- */\n.zellfahne{\n  position:fixed;z-index:140;display:flex;align-items:center;gap:11px;white-space:nowrap;\n  background:#1d2a2f;border:1px solid #2f4a4a;border-radius:7px;padding:6px 11px;\n  box-shadow:0 10px 24px -14px rgba(0,0,0,.95);pointer-events:none;\n}\n.zellfahne b{font-size:11.5px;font-weight:500;color:#fff}\n.zellfahne .mo{font-size:11.5px;color:var(--muted)}\n.zellfahne .num{font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--muted)}\n.zellfahne .taste{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--accent)}\n\n/* ---- Zeilenfarben: an die ZEILE, nicht an die Zellen ----------------\n   Die alte Regel deckte die ersten DREI Zellen mit der Tafelfarbe, weil drei\n   Spalten fixiert waren. In der Budgettafel ist nur noch eine fixiert — Jan\n   und Feb bekamen die Deckfarbe der Namensspalte und die Kategoriezeile\n   wurde zweifarbig. Also: die Zeile traegt die Farbe, die Zellen sind\n   durchsichtig, und die fixierte erste Spalte erbt sie (sie muss deckend\n   bleiben, weil sie beim Rollen ueber die anderen gleitet). */\n.t-budget tbody tr{background:var(--card)}\n.t-budget tbody tr.zeile-kat{background:var(--soft)}\n.t-budget tbody tr.zeile-leerfalt{background:#141a21}\n.t-budget tbody tr.zeile-daten:hover{background:var(--soft)}\ntable.gross.t-budget tbody td:nth-child(n+2){background:transparent}\ntable.gross.t-budget tbody td:nth-child(1){background:inherit}\ntable.gross.t-budget tbody td.jetzt:nth-child(n+2){background:rgba(142,230,200,.05)}\ntable.gross.t-budget tbody tr.zeile-kat td.jetzt:nth-child(n+2){background:rgba(142,230,200,.1)}\ntable.gross.t-budget tbody tr.zeile-daten:hover td.jetzt:nth-child(n+2){background:rgba(142,230,200,.11)}\n\n/* ---- Kennzahlenband: die wichtigste Zahl ist nicht die kleinste ---- */\n.kennzahlen .v{font-size:19px !important}\n.kennzahlen .k{font-size:10.5px;letter-spacing:.12em}\n<\u002Fstyle><\u002Fhead><body>\n<template id=\"__bundler_thumbnail\" data-bg-color=\"#0c0f13\">\n  <svg viewBox=\"0 0 1200 800\" xmlns=\"http://www.w3.org/2000/svg\">\n    <rect width=\"1200\" height=\"800\" fill=\"#0c0f13\"/>\n    <rect x=\"120\" y=\"150\" width=\"200\" height=\"500\" rx=\"10\" fill=\"#12161c\"/>\n    <rect x=\"360\" y=\"150\" width=\"720\" height=\"60\" rx=\"8\" fill=\"#151b23\"/>\n    <rect x=\"360\" y=\"238\" width=\"720\" height=\"40\" rx=\"6\" fill=\"#12161c\"/>\n    <rect x=\"360\" y=\"298\" width=\"720\" height=\"40\" rx=\"6\" fill=\"#12161c\"/>\n    <rect x=\"360\" y=\"358\" width=\"720\" height=\"40\" rx=\"6\" fill=\"#12161c\"/>\n    <rect x=\"360\" y=\"418\" width=\"720\" height=\"40\" rx=\"6\" fill=\"#12161c\"/>\n    <rect x=\"360\" y=\"478\" width=\"720\" height=\"40\" rx=\"6\" fill=\"#12161c\"/>\n    <rect x=\"360\" y=\"538\" width=\"720\" height=\"40\" rx=\"6\" fill=\"#12161c\"/>\n    <rect x=\"908\" y=\"238\" width=\"172\" height=\"340\" rx=\"6\" fill=\"#8ee6c8\" opacity=\".07\"/>\n    <rect x=\"908\" y=\"358\" width=\"172\" height=\"40\" rx=\"6\" fill=\"none\" stroke=\"#8ee6c8\" stroke-width=\"4\"/>\n    <rect x=\"120\" y=\"150\" width=\"200\" height=\"60\" rx=\"10\" fill=\"#8ee6c8\" opacity=\".16\"/>\n    <rect x=\"152\" y=\"620\" width=\"136\" height=\"8\" rx=\"4\" fill=\"#8ee6c8\"/>\n  <\u002Fsvg>\n<\u002Ftemplate>\n<div class=\"efrahmen\">\n  <div class=\"ehinweis\">\n    <b>EINGEFRORENER STAND<\u002Fb>\n    <span>Ausgabe vom ${dmy(heuteISO())} · Zeilen lassen sich anklicken und ausblenden,\n      Summen und Balken ziehen mit · keine Eingaben möglich<\u002Fspan>\n    <span class=\"meldung\" data-ausgeblendet><\u002Fspan>\n    <button onclick=\"window.print()\">Drucken oder als PDF<\u002Fbutton>\n  <\u002Fdiv>\n  <div class=\"ekarte\">${inhalt}<\u002Fdiv>\n<\u002Fdiv>\n${skript}\n<\u002Fbody><\u002Fhtml>`;\n  const b = new Blob([html], { type:'text/html' });\n  const a = document.createElement('a');\n  a.href = URL.createObjectURL(b);\n  a.download = 'GAEPP-Bericht-' + heuteISO() + '.html';\n  a.click();\n}\n\n/* ---- Eingefrorener HTML-Export des ganzen Tools (A-65, A-66) --------\n   Oeffnet ohne Netz auf einem fremden Rechner. Reiter, Klappkoepfe und\n   Filter arbeiten, aendern laesst sich nichts. */\nfunction exportHtml() {\n  const doc = document.documentElement.cloneNode(true);\n  doc.querySelectorAll('script').forEach(s => s.remove());\n  doc.querySelectorAll('link[rel=\"stylesheet\"],link[rel=\"preconnect\"]').forEach(l => l.remove());\n  doc.querySelector('#inhalt').innerHTML = '';\n  doc.querySelector('#blattHg').hidden = true;\n  doc.querySelectorA
