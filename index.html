ll('#zurueck').forEach(l => l.remove());   /* U-20: nichts zum Zurueckgehen im eingefrorenen Stand */\n  /* U-25: Der eingefrorene Stand traegt kein S.vollbild — die Klasse aus\n     dem geklonten DOM stuende also ohne den Zustand da, der sie erklaert,\n     und die Seitenleiste fehlte bis zum ersten zeichne(). */\n  doc.querySelector('#rahmen').classList.remove('vollbild');\n  const tag = 'scr' + 'ipt';\n  const daten = JSON.stringify(D).replace(/<\u002Fg, '\\\\u003c');\n  const skript =\n    '<' + tag + '>window.GAEPP_FROZEN=' + daten + ';window.GAEPP_STAND=' +\n    JSON.stringify(JSON.stringify({ jahr:S.jahr, monat:S.monat, zeitraum:S.zeitraum, modus:S.modus, reiter:S.reiter })) +\n    ';<\u002F' + tag + '>' +\n    '<' + tag + '>' + APP_QUELLTEXT + '<\u002F' + tag + '>';\n  /* Ersetzung als Funktion, nicht als Zeichenkette: sonst deutet replace jedes\n     $$ im eingefuegten Quelltext als Sonderzeichen und verkuerzt es zu $. */\n  const html = '<!DOCTYPE html><html lang=\"de-CH\">' +\n    doc.innerHTML.replace('<\u002Fbody>', () => skript + '<\u002Fbody>') + '<\u002Fhtml>';\n  const b = new Blob([html], { type:'text/html' });\n  const a = document.createElement('a');\n  a.href = URL.createObjectURL(b); a.download = 'GAEPP-Stand-' + heuteISO() + '.html';\n  a.click();\n}\n\n/* ===================================================================\n   Benutzerhandbuch (A-90) — die acht Regeln, die man nicht erraet.\n   Von Hand gepflegt, an einer Stelle.\n   =================================================================== */\nfunction blattHandbuch() {\n  return { weit:true, titel:'Wie GÄPP tickt', koerper:`<div class=\"hb\">\n    <p>Acht Regeln stecken in GÄPP, die man nicht errät — sie stammen aus Entscheidungen,\n       nicht aus Gewohnheit. Der Rest bedient sich von selbst.<\u002Fp>\n\n    <div class=\"regel\"><h3>1. Eine offene Rechnung mindert den Kontostand nicht<\u002Fh3>\n    <p>Der Kontostand bildet ab, was die Bank sagt. Solange du eine Rechnung nicht bezahlt hast,\n       ist das Geld noch da — die Bank weiss nichts von ihr. Was sie sehr wohl mindert, ist\n       <b>«Frei per Monatsende»<\u002Fb> — <b>aber nur, wenn sie auch von einem freien Konto bezahlt\n       wird<\u002Fb>. Läuft sie über Kreditoren, Rückstellungen oder Fixkosten, liegt das Geld dort\n       schon bereit und war nie Teil deines freien Betrags.<\u002Fp><\u002Fdiv>\n\n    <div class=\"regel\"><h3>2. Mit Häkchen «Rückstellung» mindert sie gar nichts<\u002Fh3>\n    <p>Für manche Rechnungen legst du jeden Monat etwas zurück — Zahnarzt, Franchise,\n       Radio- und Fernsehabgabe.\n       Setzt du beim Erfassen das Häkchen <b>Rückstellung<\u002Fb>, zählt die Rechnung weder gegen\n       dein freies Geld noch in die Budgetzeile «Rechnungen». Sonst stünde sie zweimal da.\n       <b>Du entscheidest das je Rechnung<\u002Fb>, nicht die Position.<\u002Fp><\u002Fdiv>\n\n    <div class=\"regel\"><h3>3. Liquiditätskarte und «Frei per Monatsende» sind dieselbe Zahl<\u002Fh3>\n    <p>Die Karte oben und die Zeile im Budgetkopf rechnen nach derselben Regel: Bestand auf\n       HHK minus die offenen, ungedeckten Rechnungen dieses Monats, die von dort bezahlt werden.\n       Die Karte bricht den Wert zusätzlich auf die Tage bis zum nächsten Lohn herunter.\n       <b>Nur der laufende Monat trägt einen Wert<\u002Fb> — vergangene und künftige zeigen «–».<\u002Fp><\u002Fdiv>\n\n    <div class=\"regel\"><h3>4. Die Kachel öffnet ihr Blatt, das ist kein Ansichtswechsel<\u002Fh3>\n    <p>Ein Klick auf eine Kachel legt ein Blatt darüber. Die Kachelansicht bleibt darunter stehen,\n       Escape bringt dich zurück, und du landest an derselben Stelle wie vorher.\n       Gearbeitet wird im Blatt, gezeigt wird auf der Kachel.<\u002Fp><\u002Fdiv>\n\n    <div class=\"regel\"><h3>5. Du tippst nie ein Minuszeichen<\u002Fh3>\n    <p>Die Richtung kommt aus der Kategorie: Was unter Fixkosten steht, ist eine Ausgabe.\n       In der Maske steht der Betrag, in den Summen erscheint er mit dem richtigen Vorzeichen.\n       Einzige Ausnahme ist <b>Lohnabzug | Darlehen<\u002Fb> — die Zeile steht beim Einkommen,\n       läuft aber dagegen.<\u002Fp><\u002Fdiv>\n\n    <div class=\"regel\"><h3>6. Strg-Klick markiert, Doppelklick überträgt<\u002Fh3>\n    <p>In der Budgettabelle setzt ein einfacher Klick den Schreibcursor.\n       <b>Strg-Klick<\u002Fb> markiert eine Zelle und hebt die Markierung wieder auf.\n       <b>Doppelklick<\u002Fb> überträgt den Wert auf die folgenden Monate, auf Wunsch auch\n       auf die Folgejahre.<\u002Fp><\u002Fdiv>\n\n    <div class=\"regel\"><h3>7. Der Punkt neben dem Zahnrad sagt, ob gesichert ist<\u002Fh3>\n    <p>Ocker heisst: es gibt eine Änderung, die noch nicht oben ist. GÄPP sichert von selbst,\n       zweieinhalb Sekunden nachdem du aufgehört hast — zehn Handgriffe hintereinander\n       ergeben <b>einen<\u002Fb> Sicherungsvorgang, nicht zehn. Grün mit Uhrzeit heisst: alles oben.\n       Rot heisst: es ging etwas schief, der Text daneben sagt was.<\u002Fp><\u002Fdiv>\n\n    <div class=\"regel\"><h3>8. Eine gelöschte Buchung ist endgültig weg<\u002Fh3>\n    <p>Stammdaten — Konten, Kategorien, Positionen — werden nie gelöscht, nur ausgeblendet;\n       du holst sie in der Verwaltung zurück. <b>Buchungen, Rechnungen und Erhöhungen dagegen\n       werden wirklich gelöscht<\u002Fb>, nach einer Rückfrage. Das Netz darunter ist zweifach:\n       jede Sicherung ist ein Punkt in der Git-Historie deines Datenrepos, und beim ersten\n       Öffnen am Tag legt GÄPP eine Kopie in <b>02 -&nbsp; DB Backup<\u002Fb>.<\u002Fp><\u002Fdiv>\n\n    <h3>Berichte<\u002Fh3>\n    <p>In jedem Bericht lässt sich <b>jede Zeile anklicken<\u002Fb>. Sie fällt zurück, und alles\n       zieht mit: die Summen unten, die Anteilsbalken und die Kennzahlen im Kopf. So beantwortest\n       du «was bliebe ohne diesen Posten» ohne zu rechnen. Ein zweiter Klick holt die Zeile\n       zurück. Die gesicherte HTML-Datei kann dasselbe — auch auf einem fremden Rechner\n       und ohne Netz.<\u002Fp>\n\n    <h3>Belege<\u002Fh3>\n    <p>Ein Beleg geht nie verloren. Ist der GÄPP-Ordner freigegeben, landet er sofort in\n       <b>03 - Dokumente<\u002Fb>, benannt nach Datum, Steller und Betrag. Ist er es nicht, wartet\n       der Beleg im Browser und wird abgelegt, sobald du den Ordner freigibst — die Rechnung\n       zeigt so lange <b>«liegt bereit, noch nicht abgelegt»<\u002Fb>.<\u002Fp>\n\n    <h3>Was die Farben bedeuten<\u002Fh3>\n    <p><b>Orange<\u002Fb> heisst «hier ist etwas aktiv oder auslösbar». <b>Rot<\u002Fb> trägt das negative\n       Vorzeichen und die zwei Fälle, in denen etwas nicht ging. <b>Grün<\u002Fb> trägt das positive\n       Vorzeichen — aber nie ein Guthaben für sich allein, sonst wäre der halbe Bildschirm grün.\n       <b>Ocker<\u002Fb> heisst «offen»: eine ungesicherte Änderung, eine offene Rechnung,\n       ein Serienvorschlag, ein Beleg, der noch nicht abgelegt werden konnte.<\u002Fp>\n  <\u002Fdiv>` };\n}\n\n/* ===================================================================\n   GAEPP — Ereignisse und Start.\n   =================================================================== */\n\nfunction frage(text) { return window.confirm(text); }\n\n/* ---- Werte in der Budgettabelle ------------------------------------- */\nfunction budgetSetzen(zId, m, wert) {\n  const j = String(S.jahr);\n  if (!D.budget[j]) D.budget[j] = {};\n  if (!D.budget[j][zId]) D.budget[j][zId] = { soll: 0, m: Array(12).fill(0) };\n  D.budget[j][zId].m[m] = rd(wert);\n  persist();\n}\nfunction sollSetzen(zId, wert) {\n  const j = String(S.jahr);\n  if (!D.budget[j]) D.budget[j] = {};\n  if (!D.budget[j][zId]) D.budget[j][zId] = { soll: 0, m: Array(12).fill(0) };\n  D.budget[j][zId].soll = rd(wert);\n  persist();\n}\nfunction rateSetzen(vId, m, wert) {\n  const v = verbind(vId), j = String(S.jahr);\n  /* Wie budgetSetzen es vormacht: erst den Behaelter sichern, dann das Jahr.\n     Ein Glaeubiger ohne raten-Objekt liess sich sonst keine Rate eintragen —\n     der Zugriff warf, bevor er das Jahr anlegen konnte. */\n  if (!v.raten) v.raten = {};\n  if (!v.raten[j]) v.raten[j] = { soll: 0, m: Array(12).fill(0) };\n  v.raten[j].m[m] = rd(wert);\n  persist();\n}\n/* Doppelklick uebertraegt (A-33) */\n/* ===================================================================\n   U-17 — Wert uebertragen\n   -------------------------------------------------------------------\n   Zwei prompt()-Fenster hintereinander waren die schnellste Loesung, aber\n   die schlechteste: keine Monatsnamen, keine Vorschau, kein Zurueck. Der\n   Dialog zeigt jetzt beides — von wo bis wo — in der Formensprache der App.\n   Er kann auch Raten, nicht nur Budgetzeilen.\n\n   U-22: Aus dem einen Dialog sind drei Fragen geworden — uebertragen,\n   loeschen, ein Jahr leeren. Das Geruest bleibt eines. Ein zweites waere\n   ein zweiter Ort, an dem Escape, Abbrechen und der Fokus stimmen\n   muessen, und der zweite Ort ist der, an dem es dann nicht stimmt.\n   Was der rechte Knopf tut, steht in _dlgTun; ist es null, ist der Knopf\n   nicht da (gesperrte Loeschung).\n   =================================================================== */\nlet _ueber = null, _dlgTun = null;\nfunction dialogAuf(titel, koerper, knopf, tun, gefahr) {\n  _dlgTun = tun || null;\n  $('#dialogTitel').textContent = titel;\n  $('#dialogKoerper').innerHTML = koerper;\n  const k = $('#btnUeberTun');\n  k.textContent = knopf || '';\n  k.className = 'knopf primaer' + (gefahr ? ' gefahr' : '');\n  /* Gesperrt heisst: der Knopf ist nicht grau, sondern gar nicht da. Ein\n     Knopf, der beim Klick erklaert, warum er nichts tut, laedt zum zweiten\n     Klick ein — und irgendwann glaubt man, es habe doch geklappt. */\n  k.hidden = !tun;\n  $('#dialogHg').hidden = false;\n}\n/* Ein Weg hinaus, gleich ob Abbrechen, Escape oder erledigt. Alle drei\n   Merker fallen zusammen weg — ein liegengebliebenes _loesch waere die\n   Aufstellung von vorhin auf einem Datenstand von jetzt. */\nfunction dialogZu() {\n  _ueber = null; _loesch = null; _jahrLeer = null; _dlgTun = null;\n  $('#dialogHg').hidden = true;\n}\nfunction uebertragen(art, id, m) {\n  const rate0 = art === 'rate';\n  const obj = rate0 ? verbind(id) : zeile(id);\n  if (!obj) return;\n  const wert = rate0 ? rate(obj, S.jahr, m) : zeilenwert(obj, S.jahr, m);\n  const folge = rate0\n    ? Object.keys(obj.raten || {}).map(Number).sort().filter(x => x > S.jahr)\n    : Object.keys(D.budget).map(Number).sort().filter(x => x > S.jahr);\n  _ueber = { art, id, m, wert, folge };\n  const opt = (bis, gewaehlt) => MON_LANG.map((n,i) =>\n    i >= (bis ? m : 0) ? `<option value=\"${i}\"${i===gewaehlt?' selected':''}>${n}<\u002Foption>` : '').join('');\n  dialogAuf('Wert übertragen', `\n    <p class=\"dlg-lead\"><b class=\"num\">${fmt(wert)}<\u002Fb> für «${htmlText(obj.bezeichnung)}»<\u002Fp>\n    <div class=\"dlg-zeile\">\n      <span class=\"jahr num\">${S.jahr}<\u002Fspan>\n      <label>von <select id=\"ueberVon\">${MON_LANG.map((n,i)=>`<option value=\"${i}\"${i===m?' selected':''}>${n}<\u002Foption>`).join('')}<\u002Fselect><\u002Flabel>\n      <label>bis <select id=\"ueberBis\">${opt(true, 11)}<\u002Fselect><\u002Flabel>\n    <\u002Fdiv>\n    ${folge.length ? `<label class=\"dlg-haken\"><input type=\"checkbox\" id=\"ueberFolge\">\n      Auch auf die Folgejahre ${folge[0]}${folge.length>1 ? '–' + folge[folge.length-1] : ''} übertragen<\u002Flabel>` : ''}\n    <p class=\"meldung\" id=\"ueberVorschau\"><\u002Fp>`, 'Übertragen', uebertragenTun);\n  ueberVorschau();\n  $('#ueberVon').focus();\n}\n/* Der Dialog sagt vorher, was er tun wird — eine Uebertragung ueberschreibt\n   in einem Zug bis zu zwoelf Monate. Die Leiste danach (U-20) faengt den\n   Fehlgriff auf, nimmt aber die Ansage nicht ueberfluessig. */\nfunction ueberVorschau() {\n  if (!_ueber) return;\n  const von = +$('#ueberVon').value, bis = +$('#ueberBis').value;\n  const n = Math.max(0, bis - von + 1);\n  const f = $('#ueberFolge') && $('#ueberFolge').checked ? _ueber.folge.length : 0;\n  $('#ueberVorschau').textContent = n === 0\n    ? 'Der bis-Monat liegt vor dem von-Monat — es wird nichts übertragen.'\n    : `Überschreibt ${n} ${n===1?'Monat':'Monate'} in ${S.jahr}` +\n      (f ? ` und alle zwölf Monate in ${f} ${f===1?'Folgejahr':'Folgejahren'}.` : '.');\n}\nfunction uebertragenTun() {\n  if (!_ueber) return;\n  const { art, id, wert, folge } = _ueber;\n  const von = +$('#ueberVon').value, bis = +$('#ueberBis').value;\n  const auchFolge = $('#ueberFolge') && $('#ueberFolge').checked;\n  /* Vor der ersten Mutation, nicht danach: setzen() ruft je Monat persist(),\n     und schon nach dem ersten haelt _sig einen halb geaenderten Stand. */\n  const anz = Math.max(0, bis - von + 1);\n  merkeStand('Wert auf ' + anz + (anz === 1 ? ' Monat' : ' Monate') + ' übertragen');\n  const setzen = art === 'rate' ? rateSetzen : budgetSetzen;\n  for (let i = von; i <= bis; i++) setzen(id, i, wert);\n  if (auchFolge) {\n    folge.forEach(j => {\n      if (art === 'rate') {\n        const v = verbind(id);\n        if (!v.raten) v.raten = {};        /* Behaelter zuerst, sonst wirft der Zugriff */\n        if (!v.raten[String(j)]) v.raten[String(j)] = { soll: wert, m: Array(12).fill(0) };\n        for (let i = 0; i < 12; i++) v.raten[String(j)].m[i] = wert;\n      } else {\n        if (!D.budget[String(j)]) D.budget[String(j)] = {};\n        if (!D.budget[String(j)][id]) D.budget[String(j)][id] = { soll: wert, m: Array(12).fill(0) };\n        for (let i = 0; i < 12; i++) D.budget[String(j)][id].m[i] = wert;\n      }\n    });\n    persist();\n  }\n  dialogZu();\n  zeichne();\n}\n\n/* ===================================================================\n   U-22 — Löschen mit Kaskade\n   -------------------------------------------------------------------\n   Bis heute konnte GAEPP an Stammdaten nichts loeschen, nur ausblenden\n   (`aktiv`, seit U-21 `ausAb`). Das sah nach Vorsicht aus und war eine\n   Luecke: eine Kategorie, die einmal versehentlich entstanden ist,\n   stand fuer immer da und musste in der JSON von Hand weg.\n\n   Drei Wege gab es. Verweigern, solange etwas daran haengt — dann ist\n   in einer gewachsenen Datei nichts mehr loeschbar, denn an allem\n   haengt etwas. Die Verweise leeren — dann bleibt eine Buchung ohne\n   Konto zurueck, und das ist kein Datensatz mehr, sondern ein Betrag\n   ohne Ort; kontosaldo() zaehlt ihn nirgends, und in keinem Bericht\n   faellt auf, dass er fehlt. Oder alles mitnehmen. Albrecht hat das\n   dritte gewaehlt, und es ist das einzige, das keine halben Daten\n   hinterlaesst.\n\n   Anbieten darf man eine Kaskade nur, weil es Rueckgaengig gibt (U-20).\n   Deshalb ruft loeschenTun() merkeStand() als erste Anweisung nach der\n   Bestaetigung und VOR der ersten Mutation. Ohne die Leiste waere ein\n   Klick, der neun Tabellen anfasst, unverantwortlich.\n\n   Und deshalb steht die Aufstellung VOR dem Loeschen, nicht danach als\n   Meldung: «3 Buchungen, 1 Rechnung, Budgetwerte in 4 Jahren» ist eine\n   Entscheidungsgrundlage; dieselbe Zeile hinterher waere ein Protokoll.\n   =================================================================== */\n\n/* ---- Was im Code steht und nicht in den Daten ------------------------\n   Diese IDs sind an Stellen fest verdrahtet, die eine Datei nicht kennt:\n   in Nachschlagetabellen, in Vorgaben von Masken, in einer Kachel. Waeren\n   sie weg, liefe die App weiter und taete leise etwas Falsches — eine\n   Rechnung ohne Position, eine Kachel ohne Konto, ein Ratenplan, der im\n   Budget nicht mehr auftaucht. Gesucht wurde nach jeder ID des Bestands\n   im Quelltext; `kred` stand nicht auf der Liste, die dieses Vorhaben\n   begonnen hat, und gehoert dazu.\n\n   Vererbt wird die Sperre nach unten: wer die Kategorie loeschen will,\n   an der `rech_betrag` haengt, loescht `rech_betrag` mit — die Sperre\n   muss also die ganze Kaskade pruefen, nicht nur ihren Kopf. */\nconst LOESCH_GESPERRT = {\n  konten: {\n    hhk:    'Das Haushaltkonto ist die Vorgabe des Monatsberichts und das Konto, ' +\n            'unter dem eine neu angelegte Kategorie landet.',\n    schuld: 'Auf dieses Konto wird jede neue Verbindlichkeit angelegt und jede ' +\n            'Zahlung an einen Gläubiger vorgeschlagen.',\n    kred:   'Dieses Konto führt die offenen Rechnungen: die Rechnungsmaske legt ' +\n            'darauf an, und seine Kachel trägt den Knopf «Rechnung» statt «Buchen».'\n  },\n  zeilen: {\n    verb_steuer: 'Diese Position spiegelt die Ratenpläne einer Gläubigergruppe. ' +\n                 'Ohne sie stünde die Gruppe im Budget mit null da, während die Schuld weiterläuft.',\n    verb_privat: 'Diese Position spiegelt die Ratenpläne einer Gläubigergruppe. ' +\n                 'Ohne sie stünde die Gruppe im Budget mit null da, während die Schuld weiterläuft.',\n    verb_firmen: 'Diese Position spiegelt die Ratenpläne einer Gläubigergruppe. ' +\n                 'Ohne sie stünde die Gruppe im Budget mit null da, während die Schuld weiterläuft.',\n    rech_betrag: 'Auf diese Position legt die Rechnungsmaske jede neue Rechnung.'\n  },\n  steller: {\n    st_sonstige: 'Auf diesen Rechnungssteller fällt die Belegerkennung zurück, ' +\n                 'wenn sie keinen anderen zuordnen kann.'\n  }\n};\n/* Welche Liste zu welcher Art gehoert — eine Stelle, damit abhaengige()\n   und loeschenTun() nicht auseinanderlaufen koennen. */\nconst LOESCH_LISTE = {\n  konto:'konten', kategorie:'kategorien', zeile:'zeilen', buchung:'buchungen',\n  rechnung:'rechnungen', serie:'serien', verbindlichkeit:'verbindlichkeiten',\n  sparziel:'sparziele', steller:'steller'\n};\n/* Reihenfolge und Beugung der Aufstellung. Vom Grossen zum Kleinen, damit\n   der erste Eintrag der ist, der wehtut. */\nconst LOESCH_WORT = [\n  ['konten',            'Konto',            'Konten'],\n  ['kategorien',        'Kategorie',        'Kategorien'],\n  ['zeilen',            'Position',         'Positionen'],\n  ['verbindlichkeiten', 'Verbindlichkeit',  'Verbindlichkeiten'],\n  ['sparziele',         'Sparziel',         'Sparziele'],\n  ['steller',           'Rechnungssteller', 'Rechnungssteller'],\n  ['serien',            'Serie',            'Serien'],\n  ['rechnungen',        'Rechnung',         'Rechnungen'],\n  ['buchungen',         'Buchung',          'Buchungen']\n];\nconst LOESCH_KOPF = { konto:'Konto', kategorie:'Kategorie', zeile:'Position',\n                      steller:'Rechnungssteller', sparziel:'Sparziel',\n                      verbindlichkeit:'Verbindlichkeit' };\n\n/* ---- Was mitginge ---------------------------------------------------\n   Die transitive Huelle ueber die Fremdschluessel, als Arbeitsvorrat\n   statt als Rekursion: ein Konto traegt Kategorien traegt Positionen\n   traegt Rechnungen traegt Buchungen, und eine Rechnung kann ueber ihre\n   Verbindlichkeit an einem Konto haengen, das schon drin ist. Ein Zyklus\n   ist damit kein Sonderfall, sondern ein Treffer, der schon markiert ist.\n\n   Rueckgabe ist bewusst schlicht (IDs, Zahlen, Zeichenketten) — der\n   Pruefstand liest sie ueber die Fenstergrenze, und dort ueberlebt kein\n   Set und kein Objekt aus D. */\nfunction abhaengige(art, id) {\n  const kopf = LOESCH_LISTE[art];\n  if (!kopf || !D) return null;\n  const treffer = {};\n  Object.keys(LOESCH_LISTE).forEach(a => { treffer[LOESCH_LISTE[a]] = []; });\n  const stapel = [[kopf, id]];\n  while (stapel.length) {\n    const [liste, i] = stapel.pop();\n    if (treffer[liste].indexOf(i) >= 0) continue;\n    treffer[liste].push(i);\n    const zu = (l, passt) => (D[l] || []).forEach(o => { if (passt(o)) stapel.push([l, o.id]); });\n    if (liste === 'konten') {\n      zu('kategorien',        o => o.kontoId === i);\n      zu('buchungen',         o => o.kontoId === i || o.gegenkontoId === i);\n      zu('rechnungen',        o => o.kontoId === i);\n      zu('serien',            o => o.vorlage && (o.vorlage.kontoId === i || o.vorlage.gegenkontoId === i));\n      zu('verbindlichkeiten', o => o.kontoId === i);\n      zu('sparziele',         o => o.kontoId === i);\n    } else if (liste === 'kategorien') {\n      zu('zeilen',            o => o.kategorieId === i);\n    } else if (liste === 'zeilen') {\n      zu('buchungen',         o => o.zeileId === i);\n      zu('rechnungen',        o => o.zeileId === i);\n      zu('serien',            o => o.vorlage && o.vorlage.zeileId === i);\n    } else if (liste === 'rechnungen') {\n      zu('buchungen',         o => o.rechnungId === i);\n    } else if (liste === 'serien') {\n      zu('buchungen',         o => o.serieId === i);\n    } else if (liste === 'verbindlichkeiten') {\n      zu('buchungen',         o => o.verbId === i);\n      zu('rechnungen',        o => o.verbId === i);\n    } else if (liste === 'sparziele') {\n      zu('buchungen',         o => o.sparzielId === i);\n    } else if (liste === 'steller') {\n      zu('rechnungen',        o => o.stellerId === i);\n    }\n    /* Buchungen tragen keine Kinder — sie sind das Ende jeder Kette. */\n  }\n  /* Die Schluesselkarten: budget[jahr][zeileId] haengt an keiner Liste und\n     wuerde sonst als Karteileiche stehenbleiben — unsichtbar, aber in jedem\n     Export und in jedem Vergleich zweier Staende drin. */\n  const budgetJahre = Object.keys(D.budget || {})\n    .filter(j => treffer.zeilen.some(z => D.budget[j] && D.budget[j][z])).sort();\n  /* Ratenplaene gehen mit ihrer Verbindlichkeit als Ganzes weg — sie stehen\n     IN ihr, nicht daneben. Gezaehlt werden sie trotzdem, weil «1 Verbindlichkeit»\n     nicht erkennen laesst, dass sieben Jahrgaenge Raten daranhaengen. */\n  const ratenJahre = treffer.verbindlichkeiten.reduce((s, vid) => {\n    const v = verbind(vid);\n    return s + (v && v.raten ? Object.keys(v.raten).length : 0);\n  }, 0);\n\n  /* Fremde Konten: eine Umbuchung beruehrt zwei Konten. Wird sie geloescht,\n     weil ihr eines Konto verschwindet, aendert sich der Saldo des anderen —\n     und das ist die Wirkung, die am wenigsten erwartet wird. */\n  const fremdeKonten = [];\n  treffer.buchungen.forEach(bid => {\n    const b = D.buchungen.find(x => x.id === bid);\n    if (!b) return;\n    [b.kontoId, b.gegenkontoId].forEach(k => {\n      if (k && treffer.konten.indexOf(k) < 0 && fremdeKonten.indexOf(k) < 0) fremdeKonten.push(k);\n    });\n  });\n\n  /* Gesperrt ist auch, wer etwas Gesperrtes mitrisse. */\n  let gesperrt = null;\n  Object.keys(LOESCH_GESPERRT).forEach(liste => {\n    treffer[liste].forEach(i => {\n      if (gesperrt || !LOESCH_GESPERRT[liste][i]) return;\n      gesperrt = { liste, id: i, name: loeschName(liste, i), grund: LOESCH_GESPERRT[liste][i],\n                   selbst: liste === kopf && i === id };\n    });\n  });\n\n  const zaehlung = [];\n  let anzahl = 0;\n  LOESCH_WORT.forEach(([liste, ein, viel]) => {\n    /* Das Objekt selbst ist nicht von sich selbst abhaengig. */\n    const n = treffer[liste].length - (liste === kopf ? 1 : 0);\n    if (n <= 0) return;\n    anzahl += n;\n    zaehlung.push(n + ' ' + (n === 1 ? ein : viel));\n  });\n  if (budgetJahre.length) {\n    anzahl += budgetJahre.length;\n    zaehlung.push('Budgetwerte in ' + budgetJahre.length + (budgetJahre.length === 1 ? ' Jahr' : ' Jahren'));\n  }\n  if (ratenJahre) zaehlung.push('Ratenpläne aus ' + ratenJahre + (ratenJahre === 1 ? ' Jahr' : ' Jahren'));\n\n  return { art, id, liste: kopf, name: loeschName(kopf, id), treffer,\n           budgetJahre, ratenJahre, fremdeKonten, zaehlung, anzahl, gesperrt,\n           /* A-88 trifft U-20: im Schreibschutz ist merkeStand() still, und\n              eine Kaskade ohne Rueckgaengig ist genau das, was hier nicht\n              angeboten werden darf. Ein eigenes Feld und keine Sperre unter\n              den anderen — der Grund ist ein anderer, und der Satz auch. */\n           schreibschutz: _ro };\n}\nfunction loeschName(liste, id) {\n  const o = (D[liste] || []).find(x => x.id === id);\n  if (!o) return id;\n  return o.bezeichnung || o.name || id;\n}\n\n/* ---- Der Dialog vor der Kaskade ------------------------------------- */\nlet _loesch = null;\nfunction loeschenFragen(art, id) {\n  const a = abhaengige(art, id);\n  if (!a) return;\n  _loesch = a;\n  const kopf = LOESCH_KOPF[art] || art;\n  /* Der schwerste Fall zuerst benennen: bei einem Konto verschiebt sich der\n     Saldo ANDERER Konten mit, weil jede Umbuchung zwei Konten beruehrt. */\n  const fremd = (art === 'konto' && a.fremdeKonten.length)\n    ? `<p class=\"dlg-warnung\">Darunter sind Umbuchungen und Zahlungen, die\n        <b>${a.fremdeKonten.map(k => htmlText((konto(k) || {}).name || k)).join(', ')}<\u002Fb>\n        mit berühren. Der Saldo dieser Konten ändert sich mit — sie verschwinden nicht,\n        aber sie stimmen danach nicht mehr mit dem überein, was du vorher gesehen hast.<\u002Fp>`\n    : '';\n  const koerper = `\n    <p class=\"dlg-lead\">${kopf} <b>«${htmlText(a.name)}»<\u002Fb><\u002Fp>\n    ${a.zaehlung.length\n      ? `<p class=\"meldung\">Mit gelöscht wird, was daran hängt:<\u002Fp>\n         <ul class=\"dlg-liste\">${a.zaehlung.map(t => `<li>${t}<\u002Fli>`).join('')}<\u002Ful>`\n      : '<p class=\"meldung\">Daran hängt nichts. Es geht nur dieser eine Eintrag weg.<\u002Fp>'}\n    ${a.gesperrt || a.schreibschutz ? '' : fremd}\n    ${a.schreibschutz\n      ? `<p class=\"dlg-warnung\"><b>GÄPP ist schreibgeschützt.<\u002Fb><br>\n         Die geladene Datendatei ist neuer als diese App — GÄPP kennt nicht einmal\n         alle Felder, die es hier wegwerfen würde, und Rückgängig ist im Schreibschutz\n         abgeschaltet. Lade die neue Fassung der App, dann geht es wieder.<\u002Fp>`\n      : a.gesperrt\n      ? `<p class=\"dlg-warnung\"><b>${a.gesperrt.selbst ? 'Das lässt sich nicht löschen.'\n            : 'Das lässt sich nicht löschen, weil «' + htmlText(a.gesperrt.name) + '» mitginge.'}<\u002Fb><br>\n         ${a.gesperrt.grund} Diese Kennung steht im Quelltext, nicht in deinen Daten —\n         GÄPP fände sie nach dem Löschen nicht mehr und arbeitete still falsch weiter.<\u002Fp>`\n      : `<p class=\"meldung\">Rückgängig hält den Stand zwölf Sekunden — danach hilft nur die Git-Historie.<\u002Fp>`}`;\n  dialogAuf('Löschen', koerper, 'Löschen', (a.gesperrt || a.schreibschutz) ? null : loeschenTun, true);\n}\nfunction loeschenTun() {\n  /* Zweiter Riegel neben dem fehlenden Knopf: diese Funktion ist von aussen\n     aufrufbar, und eine Kaskade darf an keinem Weg vorbei laufen. */\n  if (_ro || !_loesch || _loesch.gesperrt) return;\n  const a = _loesch;\n  /* Erste Anweisung nach der Bestaetigung, vor jeder Mutation (U-20). */\n  merkeStand('«' + a.name + '» mit ' + a.anzahl +\n             (a.anzahl === 1 ? ' abhängigen Eintrag' : ' abhängigen Einträgen') + ' gelöscht');\n  Object.keys(a.treffer).forEach(liste => {\n    if (!a.treffer[liste].length || !Array.isArray(D[liste])) return;\n    D[liste] = D[liste].filter(o => a.treffer[liste].indexOf(o.id) < 0);\n  });\n  a.budgetJahre.forEach(j => {\n    if (!D.budget[j]) return;\n    a.treffer.zeilen.forEach(z => { delete D.budget[j][z]; });\n  });\n  /* Ein offenes Blatt kann auf etwas zeigen, das es nicht mehr gibt — dann\n     wirft blattZeichnen() beim naechsten Zeichnen. Zu damit, ohne Umweg\n     ueber blattZu(): das wuerde den Stapel abarbeiten statt zu raeumen. */\n  /* U-30: kontomaske gehoert dazu — sie zeigt auf ein Konto wie das Kontoblatt.\n     Der Loeschknopf steht seit U-30 IN ihr; ohne diesen Eintrag bliebe die\n     Maske eines geloeschten Kontos offen stehen und wuerfe beim naechsten\n     Zeichnen. */\n  const blattListe = { konto:'konten', kontomaske:'konten', zeile:'zeilen', sparziel:'sparziele',\n                       schuld:'verbindlichkeiten', glaeubiger:'verbindlichkeiten',\n                       rechnungzeigen:'rechnungen', rechnung:'rechnungen' };\n  if (_blatt && (a.treffer[blattListe[_blatt.art]] || []).indexOf(_blatt.id) >= 0) {\n    _stapel = []; _blatt = null; S.blatt = null; $('#blattHg').hidden = true;\n  }\n  persist();\n  dialogZu();\n  zeichne();\n}\n\n/* ===================================================================\n   U-22 — Ein Budgetjahr leeren\n   -------------------------------------------------------------------\n   Das ging bisher nur als Nebenwirkung: jahrAnlegen() auf ein\n   bestehendes Jahr, zweimal bestaetigen, beim zweiten Mal «Abbrechen»\n   fuer «leeres Jahr». Wer das nicht wusste, hatte keinen Weg; wer es\n   wusste, klickte in einer Maske «Abbrechen», um etwas zu tun.\n\n   Geleert heisst auf null gesetzt, nicht entfernt: die Behaelter\n   bleiben stehen. Ein Jahr ohne Behaelter waere fuer die Tabelle ein\n   Jahr ohne Zeilen, und der Unterschied zwischen «hier steht nichts»\n   und «hier steht null» ist genau der, den ein Budget zeigen muss.\n   =================================================================== */\nlet _jahrLeer = null;\nfunction jahrLeeren(j) {\n  const k = String(j);\n  if (!D.budget[k]) return;\n  const hatWert = o => !!o && ((o.soll || 0) !== 0 || (o.m || []).some(x => (x || 0) !== 0));\n  const zeilen = Object.keys(D.budget[k]).filter(z => hatWert(D.budget[k][z]));\n  const raten  = D.verbindlichkeiten.filter(v => v.raten && hatWert(v.raten[k]));\n  _jahrLeer = { jahr: k };\n  const teile = [];\n  if (zeilen.length) teile.push(zeilen.length + (zeilen.length === 1 ? ' Zeile' : ' Zeilen'));\n  if (raten.length)  teile.push(raten.length + (raten.length === 1 ? ' Ratenplan' : ' Ratenpläne'));\n  dialogAuf('Budgetjahr leeren', `\n    <p class=\"dlg-lead\">Budgetjahr <b class=\"num\">${k}<\u002Fb><\u002Fp>\n    ${teile.length\n      ? `<p class=\"meldung\">Setzt auf null:<\u002Fp>\n         <ul class=\"dlg-liste\">${teile.map(t => `<li>${t}<\u002Fli>`).join('')}<\u002Ful>`\n      : '<p class=\"meldung\">In diesem Jahr steht bereits überall null.<\u002Fp>'}\n    ${_ro ? `<p class=\"dlg-warnung\"><b>GÄPP ist schreibgeschützt.<\u002Fb><br>\n      Die Datendatei ist neuer als diese App, und Rückgängig ist damit\n      abgeschaltet. Lade die neue Fassung der App.<\u002Fp>`\n      : `<p class=\"meldung\">Das Jahr bleibt bestehen — nur seine Zahlen gehen weg.\n      Andere Jahrgänge rührt das nicht an.<\u002Fp>`}`, 'Leeren', _ro ? null : jahrLeerenTun, true);\n}\nfunction jahrLeerenTun() {\n  if (_ro || !_jahrLeer) return;\n  const k = _jahrLeer.jahr;\n  merkeStand('Budgetjahr ' + k + ' geleert');\n  Object.keys(D.budget[k] || {}).forEach(z => {\n    D.budget[k][z] = { soll: 0, m: Array(12).fill(0) };\n  });\n  /* Nur bestehende Ratenplaene werden genullt. Einen anzulegen, wo keiner\n     war, waere Anlegen und nicht Leeren — und stuende danach als\n     ausdruecklich gepflegte Null da, die niemand eingetragen hat. */\n  D.verbindlichkeiten.forEach(v => {\n    if (v.raten && v.raten[k]) v.raten[k] = { soll: 0, m: Array(12).fill(0) };\n  });\n  persist();\n  dialogZu();\n  zeichne();\n}\n\n/* ===================================================================\n   U-30 — Einen Budgetjahrgang ganz entfernen\n   -------------------------------------------------------------------\n   «Leeren» setzt auf null, der Jahrgang bleibt stehen. Das ist der\n   haeufigere Wunsch und deshalb der Knopf, der zuerst kam (U-22). Der\n   andere fehlte ganz: einen Jahrgang wieder LOSWERDEN. Wer sich beim\n   Anlegen um eine Stelle vertippt — 2072 statt 2027 —, hatte bis heute\n   keinen Weg zurueck. Der Jahrgang stand danach in jeder Jahresliste,\n   im Kalender, in der Ansicht «Alle Jahre» als eigene Spalte und in\n   jedem Export. Zurueckgenommen werden konnte er nur in der JSON.\n\n   ENTFERNT UND NICHT GELEERT heisst hier: der Behaelter geht weg, nicht\n   sein Inhalt. Der Unterschied ist derselbe wie bei jahrLeeren, nur\n   andersherum gelesen — «hier steht nichts» gegen «diesen Jahrgang gibt\n   es nicht». Die Ratenplaene dieses Jahrgangs gehen mit, aus demselben\n   Grund wie beim Leeren: ein Budgetjahr, das es nicht gibt, und darunter\n   weiterlaufende Raten waeren zwei Wahrheiten ueber dasselbe Jahr.\n\n   DER LETZTE JAHRGANG BLEIBT. Ohne ihn haette D.budget keinen Schluessel\n   mehr, und die Ansicht «Alle Jahre» keine einzige Spalte. Man koennte\n   das abfangen (spaltenKoepfe tut es seit U-30 auch), aber anbieten sollte\n   man es nicht: eine App ohne Budgetjahr ist keine, und der Weg zurueck\n   hiesse «Jahr anlegen» — mit allen Werten weg.\n\n   Die eigene Kaskade steht hier und nicht in abhaengige(): ein Jahrgang\n   ist kein Datensatz mit einer id, sondern ein Schluessel in zwei\n   Schluesselkarten (D.budget und v.raten). LOESCH_LISTE haette ihn nicht\n   aufnehmen koennen, ohne dass jede Zeile darin eine Ausnahme braucht.\n   Was er mit abhaengige() teilt, ist das Wichtigere: die Aufstellung\n   steht VOR dem Loeschen, und merkeStand() ist die erste Anweisung nach\n   der Bestaetigung.\n   =================================================================== */\nlet _jahrWeg = null;\nfunction jahrLoeschen(j) {\n  const k = String(j);\n  if (!D.budget[k]) return;\n  const hatWert = o => !!o && ((o.soll || 0) !== 0 || (o.m || []).some(x => (x || 0) !== 0));\n  const zeilen = Object.keys(D.budget[k]).filter(z => hatWert(D.budget[k][z]));\n  const behaelter = Object.keys(D.budget[k]).length;\n  const raten = D.verbindlichkeiten.filter(v => v.raten && v.raten[k]);\n  const ratenWert = raten.filter(v => hatWert(v.raten[k]));\n  const letzter = budgetJahre().length <= 1;\n  _jahrWeg = { jahr: k };\n  const teile = [];\n  teile.push(behaelter + (behaelter === 1 ? ' Budgetzeile' : ' Budgetzeilen')\n             + (zeilen.length ? ', davon ' + zeilen.length + ' mit Werten' : ', alle auf null'));\n  if (raten.length)\n    teile.push(raten.length + (raten.length === 1 ? ' Ratenplan' : ' Ratenpläne')\n               + (ratenWert.length ? ', davon ' + ratenWert.length + ' mit Werten' : ', alle auf null'));\n  dialogAuf('Budgetjahr löschen', `\n    <p class=\"dlg-lead\">Budgetjahr <b class=\"num\">${k}<\u002Fb><\u002Fp>\n    <p class=\"meldung\">Weg ist danach:<\u002Fp>\n    <ul class=\"dlg-liste\">${teile.map(t => `<li>${t}<\u002Fli>`).join('')}<\u002Ful>\n    ${letzter\n      ? `<p class=\"dlg-warnung\"><b>${k} ist der einzige Budgetjahrgang.<\u002Fb><br>\n         Ohne Jahrgang hätte die Ansicht «Alle Jahre» keine Spalte und die Budgettabelle\n         keinen Ort, an dem etwas steht. Leg zuerst einen anderen Jahrgang an —\n         oder nimm «Leeren», wenn nur die Zahlen weg sollen.<\u002Fp>`\n      : _ro\n      ? `<p class=\"dlg-warnung\"><b>GÄPP ist schreibgeschützt.<\u002Fb><br>\n         Die Datendatei ist neuer als diese App, und Rückgängig ist damit\n         abgeschaltet. Lade die neue Fassung der App.<\u002Fp>`\n      : `<p class=\"meldung\">Buchungen, Rechnungen und Gläubigerstände bleiben unberührt —\n         sie hängen an ihrem Datum, nicht am Budgetjahrgang. Weg ist nur, was für ${k}\n         <b>geplant<\u002Fb> war. Rückgängig hält den Stand zwölf Sekunden.<\u002Fp>`}`,\n    'Löschen', (letzter || _ro) ? null : jahrLoeschenTun, true);\n}\nfunction jahrLoeschenTun() {\n  /* Zweiter Riegel neben dem fehlenden Knopf — dieselbe Regel wie bei\n     loeschenTun(): die Funktion ist von aussen aufrufbar. */\n  if (_ro || !_jahrWeg || budgetJahre().length <= 1) return;\n  const k = _jahrWeg.jahr;\n  merkeStand('Budgetjahr ' + k + ' gelöscht');\n  delete D.budget[k];\n  D.verbindlichkeiten.forEach(v => { if (v.raten) delete v.raten[k]; });\n  /* Der Zeiger stand womoeglich genau auf diesem Jahrgang. Bliebe er stehen,\n     zeigte die Budgettabelle lauter Nullen — und die erste eingetippte Zahl\n     legte den geloeschten Jahrgang ueber budgetSetzen wieder an. */\n  jahrFangen();\n  persist();\n  dialogZu();\n  zeichne();\n}\n\n/* ===================================================================\n   U-23 — Suche\n   -------------------------------------------------------------------\n   Sechs Arten in einem Feld: Konto, Kategorie, Position, Glaeubiger,\n   Rechnungssteller, Rechnung. GAEPP hat rund hundert benan /* liegt jetzt unter «Bezahlt» */ }\n}\nfunction vwUmbenennen(arg) {\n  const [art, id] = arg.split(':');\n  const o = { konto:konto, kategorie:kategorie, zeile:zeile, steller:steller,\n              sparziel:i=>D.sparziele.find(x=>x.id===i) }[art](id);\n  const feld = art === 'zeile' ? 'bezeichnung' : 'name';\n  const neu = prompt('Neue Bezeichnung:', o[feld]);\n  if (!neu) return;\n  o[feld] = neu.trim(); persist(); blattZeichnen();\n}\n/* ---- U-21: Sperre fuer gespiegelte Zeilen ---------------------------\n   Die Budgettabelle und der Verwaltungsbaum bieten bei einer gespiegelten\n   Zeile schon lange keinen Ausblendknopf an — vwAusblenden kannte die\n   Regel nicht. Bekaeme verb_steuer, verb_privat, verb_firmen oder die\n   Rechnungszeile ein ausAb, zeigte das Budget die Raten nicht mehr,\n   waehrend die Schuld in verbindLauf unveraendert weiterliefe: das Budget\n   waere um genau den groessten Posten zu optimistisch. Wer eine solche\n   Zeile loswerden will, blendet den Glaeubiger aus, nicht die Spiegelung. */\nfunction ausblendenGesperrt(z) {\n  if (!gespiegelt(z)) return false;\n  alert('«' + z.bezeichnung + '» spiegelt nur, was anderswo gepflegt wird — die Ratenpläne '\n      + 'der Gläubiger oder die erfassten Rechnungen. Ausgeblendet verschwände die Zahlung '\n      + 'aus dem Budget, während die Schuld weiterläuft. Blende stattdessen den Gläubiger aus.');\n  return true;\n}\n/* ---- U-21: drei Faelle statt eines Umschalters ----------------------\n   «ab S.jahr», «ganz» und «wieder ein» sind drei Zustaende; ein Umschalter\n   kann nur zwei. Welcher gemeint ist, steht im dritten Teil des Arguments\n   (zeile:z12:ab). Konten, Steller und Sparziele tragen weiterhin ein\n   einzelnes `aktiv` — dort bleibt es beim Umschalter, weil ein Konto ein\n   Saldo ist und kein Anzeigeobjekt (siehe U-21 oben bei jahrSicht). */\nfunction vwAusblenden(arg) {\n  const [art, id, wie] = arg.split(':');\n  const o = { konto:konto, kategorie:kategorie, zeile:zeile, steller:steller,\n              sparziel:i=>D.sparziele.find(x=>x.id===i) }[art](id);\n  if (art === 'zeile' || art === 'kategorie') {\n    if (art === 'zeile' && ausblendenGesperrt(o)) return;\n    const name = o.bezeichnung || o.name;\n    if (wie === 'ein') {\n      merkeStand('«' + name + '» wieder eingeblendet');\n      o.ausAb = null;\n    } else if (wie === 'ganz') {\n      if (!frage('«' + name + '» ganz ausblenden? Dann verschwindet die Zeile auch aus den '\n               + 'vergangenen Jahren. Willst du nur die Zukunft ändern, nimm «ab ' + S.jahr + ' aus».')) return;\n      merkeStand('«' + name + '» ganz ausgeblendet');\n      o.ausAb = 0;\n    } else {\n      if (!frage('«' + name + '» ab ' + S.jahr + ' ausblenden? In ' + (S.jahr - 1) +\n                 ' und früher bleibt es stehen. Zurückholen geht hier in der Verwaltung.')) return;\n      merkeStand('«' + name + '» ab ' + S.jahr + ' ausgeblendet');\n      o.ausAb = S.jahr;\n    }\n    persist(); blattZeichnen(); return;\n  }\n  /* Vor der Umkehr merken — danach stuende im Text die neue Richtung. */\n  merkeStand('«' + (o.bezeichnung || o.name) + '» ' + (o.aktiv === false ? 'eingeblendet' : 'ausgeblendet'));\n  o.aktiv = o.aktiv === false;\n  persist(); blattZeichnen();\n}\nfunction vwNeu(art) {\n  /* U-30: Das Konto biegt vor dem prompt() ab — es bekommt ein Blatt, weil es\n     acht Felder hat und eines davon («frei») einen erklaerenden Satz braucht.\n     Die Abzweigung steht HIER und nicht im Klickverteiler, damit «anlegen»\n     ein einziger Einstieg bleibt: wer einen zweiten Knopf ergaenzt, findet\n     den Weg an derselben Stelle. */\n  if (art === 'konto') return blattAuf('kontomaske', 'neu');\n  const name = prompt('Bezeichnung:');\n  if (!name) return;\n  if (art === 'kategorie') {\n    /* U-30: Zwei Fehler, die beide erst mit einer leeren Datei zünden — und\n       genau deshalb bis hierher niemandem aufgefallen sind.\n       ERSTENS die Vorgabe «hhk». Sie war die Kennung eines Kontos, das es in\n       einer gewachsenen Datei immer gab. In einer neuen gibt es sie nicht:\n       die Kategorie bekäme einen Verweis ins Leere, verschwände damit aus dem\n       Verwaltungsbaum (der nach Konten gruppiert) und stünde nur noch in der\n       Budgettabelle — sichtbar, aber ohne Ort. Gefangen wird jetzt auf das\n       erste Konto, und wo es gar keines gibt, entsteht keine Kategorie.\n       ZWEITENS Math.max(...[]) — das ist −Infinity, nicht 0. Die allererste\n       Kategorie einer leeren Datei bekam damit rang −Infinity; JSON.stringify\n       schreibt daraus `null`, und nach dem nächsten Laden sortiert die\n       Verwaltung nach einem Rang, den es nicht gibt. Derselbe Ausdruck steht\n       eine Zeile über der Kontomaske mit der 0 als Untergrenze. */\n    if (!D.konten.length) {\n      alert('Es gibt noch kein Konto. Eine Kategorie hängt immer an einem Konto — '\n          + 'leg zuerst eines an, mit «Konto anlegen» hier auf derselben Seite.');\n      return;\n    }\n    const kId = prompt('Welches Konto führt diese Kategorie? (Nummer, z.B. ' + D.konten[0].nr + ')',\n                       D.konten[0].nr);\n    if (kId === null) return;\n    const k = D.konten.find(x => x.nr === String(kId).padStart(2,'0')) || D.konten[0];\n    merkeStand('Kategorie «' + name.trim() + '» angelegt');\n    D.kategorien.push({ id:neueId('k'), name:name.trim(), kontoId:k.id, richtung:'aus',\n      rang: Math.max(0, ...D.kategorien.map(x => x.rang || 0)) + 1, ausAb:null });\n  }\n  if (art === 'steller') {\n    /* Dieselbe Sorte Annahme wie oben: stellerGruppen[0] gibt es nicht\n       zwangsläufig. Ohne Gruppe ist ein Rechnungssteller kein halber\n       Datensatz, sondern einer, der in keiner Liste auftaucht. */\n    if (!D.stellerGruppen.length) {\n      alert('Es gibt noch keine Rechnungssteller-Gruppe. Ohne sie liesse sich der '\n          + 'Steller nirgends einordnen.');\n      return;\n    }\n    merkeStand('Rechnungssteller «' + name.trim() + '» angelegt');\n    D.steller.push({ id:neueId('st'), name:name.trim(), gruppeId:D.stellerGruppen[0].id, aktiv:true });\n  }\n  if (art === 'sparziel') {\n    const ziel = zahl(prompt('Zielbetrag:', '0'));\n    merkeStand('Sparziel «' + name.trim() + '» angelegt');\n    D.sparziele.push({ id:neueId('sp'), name:name.trim(), zielbetrag:rd(ziel), kontoId:null, aktiv:true });\n  }\n  persist(); blattZeichnen();\n}\n\n/* Was in der Berichtsmaske steht, in den Zustand uebernehmen. */\nfunction berEinlesen() {\n  if (!_ber) _ber = berStandard();\n  const w = $('input[name=\"ber\"]:checked');\n  if (w) _ber.art = w.value;\n  /* U-21: ueber berZeitraumSetzen, damit ein von Hand getipptes Datum die\n     Kategorien desselben Jahres mitbringt — wie die drei Zeitraumknoepfe. */\n  berZeitraumSetzen($('#berVon') ? ($('#berVon').value || _ber.von) : _ber.von,\n                    $('#berBis') ? ($('#berBis').value || _ber.bis) : _ber.bis);\n  if ($('#berVerlauf')) _ber.verlauf = $('#berVerlauf').checked;\n  if ($('#berKonto')) {\n    const v = $('#berKonto').value;\n    if (v.startsWith('k:')) { _ber.kontoId = v.slice(2); _ber.verbId = null; }\n    else { _ber.verbId = v.slice(2); }\n  }\n}\n\n/* ---- Budgetjahr anlegen (A-86) — und dabei die Ratenplaene mitschreiben.\n   Sonst stehen nach dem Jahreswechsel zehn Schulden ohne Raten da. ------ */\nfunction jahrAnlegen() {\n  const jahre = Object.keys(D.budget).map(Number).sort();\n  const vorschlag = jahre[jahre.length-1] + 1;\n  const eingabe = prompt('Welches Jahr anlegen?', String(vorschlag));\n  if (!eingabe) return;\n  const j = parseInt(eingabe, 10);\n  if (!j || j < 2000 || j > 2100) return;\n  /* U-22: Die Rueckfrage sagte nur das halbe Wort. Sie sprach vom Budgetjahr\n     und verschwieg, dass unten auch v.raten[j] neu geschrieben wird — bei\n     zehn Glaeubigern und sieben Jahrgaengen ist das der groessere Teil des\n     Schadens. Eine Rueckfrage, die weniger sagt, als die Aktion tut, ist\n     schlimmer als keine: sie holt eine Zustimmung zu etwas anderem. */\n  if (D.budget[String(j)] && !frage('Das Jahr ' + j + ' gibt es schon.\\n\\n'\n      + 'Überschreiben setzt das Budgetjahr ' + j + ' neu UND schreibt die Ratenpläne '\n      + 'aller Verbindlichkeiten für ' + j + ' neu. Beides ist danach weg.')) return;\n  const fort = frage('Das Vorjahr fortschreiben?\\n\\nOK  = Werte des Vorjahrs übernehmen — Budget und Ratenpläne\\n'\n      + 'Abbrechen = leeres Jahr, Budget und Ratenpläne auf null');\n  /* Nach beiden Rueckfragen, vor der ersten Zuweisung an D.budget. */\n  merkeStand('Budgetjahr ' + j + ' angelegt');\n  const vor = String(j - 1);\n  D.budget[String(j)] = {};\n  D.zeilen.forEach(z => {\n    if (gespiegelt(z)) return;\n    /* U-21: Eine Zeile, die im neuen Jahr ausgeblendet ist, bekommt dort\n       keinen Behaelter. Sonst schriebe das Fortschreiben ihre alten Werte in\n       ein Jahr, in dem sie gar nicht mehr steht — unsichtbar, aber gespeichert,\n       und beim Wiedereinblenden staende sie ploetzlich mit Zahlen da, die\n       niemand eingetragen hat. budgetSetzen legt den Behaelter spaeter selbst\n       an, wenn die Zeile zurueckkommt. */\n    if (!zeileSicht(z, j)) return;\n    const q = fort && D.budget[vor] ? D.budget[vor][z.id] : null;\n    D.budget[String(j)][z.id] = q ? { soll:q.soll, m:q.m.slice() } : { soll:0, m:Array(12).fill(0) };\n  });\n  /* Die Ratenplaene gehoeren dazu — ohne sie zeigen die gespiegelten Budgetzeilen null\n     und die Tilgungsprognose endet am Jahreswechsel. */\n  D.verbindlichkeiten.forEach(v => {\n    if (!v.raten) v.raten = {};          /* Behaelter zuerst, sonst wirft schon das Lesen des Vorjahrs */\n    const q = fort ? v.raten[vor] : null;\n    v.raten[String(j)] = q ? { soll:q.soll, m:q.m.slice() } : { soll:0, m:Array(12).fill(0) };\n  });\n  persist();\n  S.jahr = j;\n  blattZeichnen();\n}\n\n/* ===================================================================\n   Start\n   =================================================================== */\nasync function start() {\n  suchTasteSetzen();\n  try { const g = JSON.parse(localStorage.getItem(SCHLUESSEL_GH) || 'null'); if (g) GH = g; } catch (err) {}\n  try {\n    const roh = JSON.parse(localStorage.getItem(SCHLUESSEL_DATEN) || 'null');\n    if (roh && roh.d) { uebernehmen(roh.d); if (roh.s) S = Object.assign(S, roh.s); }\n  } catch (err) {}\n  /* Eingefrorener Export: Daten stecken in der Datei, nichts laesst sich aendern (A-65) */\n  if (window.GAEPP_FROZEN) {\n    D = window.GAEPP_FROZEN; _ro = true;\n    document.body.classList.add('readonly');\n    try { S = Object.assign(S, JSON.parse(window.GAEPP_STAND || '{}')); } catch (err) {}\n    GH = { repo:'', branch:'main', token:'' };\n    setSync('off', 'Eingefrorener Stand');\n    zeichne();\n    document.addEventListener('change', e => { e.preventDefault(); e.stopPropagation(); }, true);\n    return;\n  }\n  _ordner = await ordnerHolen();\n  zeichne();\n  if (GH.repo && GH.token && !window.GAEPP_FROZEN) { await ghPull(); }\n  else setSync('lokal', D ? 'Lokal — kein Repo verbunden' : 'Noch keine Daten');\n  if (D) { _sig = JSON.stringify(D); tagessicherung({ ohneGeste:true }); }\n  /* Ein Blatt, das beim Neuladen offen war, geht nicht wieder auf — die Ansicht\n     soll beim Start ruhig sein. Der Zeitraum und die Klappzustaende bleiben. */\n  S.blatt = null;\n}\n/* Der eingefrorene Export traegt denselben Quelltext wie die App. Er wird aus\n   dem eigenen Script-Element gelesen — so steht er genau einmal in der Datei. */\nfunction appQuelltext() { const s = document.getElementById('gaeppApp'); return s ? s.textContent : ''; }\nObject.defineProperty(window, 'APP_QUELLTEXT', { get: appQuelltext });\n/* Wird die Datei so geladen, dass der Quelltext beim Ausfuehren schon fertig\n   geparst ist — etwa als eingebettete Einzeldatei —, ist DOMContentLoaded\n   bereits vorbei und die App startete nie. Deshalb beide Faelle. */\nif (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start);\nelse start();\n\n\n/* ---- F-07: Glaeubiger speichern -------------------------------------\n   Angelegt wird mit Anfangssaldo und Datum; der Stand rechnet sich von da\n   an aus gebuchten Zahlungen und Erhoehungen (E-14). Die Raten traegt\n   Albrecht danach in der Tabelle ein, Monat fuer Monat.\n   Ohne dieses Bauteil landete eine neue Schuld frueher als unsichtbarer\n   Zuschlag auf einer fremden Zeile. */\nfunction glaeubigerSpeichern() {\n  const name = ($('#gName').value || '').trim();\n  if (!name) { $('#gHint').textContent = 'Ohne Bezeichnung geht es nicht.'; return; }\n  const stand = zahl($('#gStand').value);\n  const zins  = $('#gZins').value.trim()    === '' ? null : zahl($('#gZins').value);\n  const geb   = $('#gGebuehr').value.trim() === '' ? null : rd(zahl($('#gGebuehr').value));\n  const alt   = $('#gId') ? verbind($('#gId').value) : null;\n  /* U-22: Die Dokumentliste wird VOR der ersten Zuweisung gelesen und geprueft.\n     Eine abgelehnte Adresse darf nicht die Haelfte der Maske gespeichert\n     zuruecklassen — sonst stuende der neue Zinssatz drin und der Grund fuer\n     den Abbruch daneben. */\n  const doks = [];\n  let boese = null;\n  $$('#gDoks .dok').forEach(r => {\n    const n = ($('.dokName', r).value || '').trim();\n    const u = ($('.dokUrl',  r).value || '').trim();\n    if (!n && !u) return;                    /* leere Zeile ist keine Absicht */\n    if (!dokUrlOk(u)) { if (!boese) boese = u || n; return; }\n    doks.push({ name: n || u, url: u });\n  });\n  if (boese) {\n    $('#gHint').textContent = 'Die Adresse muss mit http:// oder https:// beginnen — «'\n      + boese.slice(0, 40) + '» tut das nicht.';\n    return;\n  }\n  const v = alt || { id: neueId('v'), raten: {}, erhoehungen: [], aktiv: true,\n                     auszugswert: null, auszugsdatum: null, vertreter: '', nominal: null,\n                     dokumente: [] };\n  v.bezeichnung  = name;\n  /* U-31: Die Gruppe entscheidet ueber den Block, in dem der Rang gilt.\n     Wechselt sie, waere der alte Rang die Stelle in einer fremden Liste —\n     der Glaeubiger landete irgendwo mitten in der neuen Gruppe. Ein\n     Wechsel haengt ihn deshalb hinten an; von dort laesst er sich mit\n     einem Zug dahin bringen, wo er hingehoert.\n     Dasselbe gilt fuer den ganz neuen: er kommt ans Ende seiner Gruppe. */\n  const gAlt = v.gruppe;\n  v.gruppe       = $('#gGruppe').value;\n  if (!alt || gAlt !== v.gruppe)\n    v.rang = Math.max(0, ...D.verbindlichkeiten\n      .filter(x => x !== v && x.gruppe === v.gruppe).map(x => x.rang || 0)) + RANG_SCHRITT;\n  v.kontoId      = $('#gKonto').value;\n  v.anfangsstand = rd(stand);\n  v.anfangsdatum = $('#gDatum').value || heuteISO();\n  v.zinssatz     = zins;\n  v.gebuehr      = geb;\n  v.vereinbarungBis = $('#gBis').value || null;\n  v.hinweis      = ($('#gHinweis').value || '').trim();\n  v.dokumente    = doks;\n  /* Eine von Hand angelegte Zeile ist genau so belegt, wie ihr Hinweis sagt. */\n  v.herkunft     = v.hinweis ? 'belegt' : 'geschaetzt';\n  if (!alt) D.verbindlichkeiten.push(v);\n  persist(); blattZu(); zeichne();\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
