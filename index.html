}
/* Lesbar gekuerzt, vollstaendig im title. Ein Freigabelink von OneDrive ist
   zweihundert Zeichen lang und sagt auf den ersten sechzig alles, was man
   zum Wiedererkennen braucht; der Rest gehoert in den Tooltip, nicht in
   die Zeile. */
function dokKurz(u) {
  const s = String(u || '').replace(/^https?:\/\//i, '').replace(/\/+$/, '');
  if (s.length <= 62) return s;
  const wirt = s.slice(0, s.indexOf('/') < 0 ? s.length : s.indexOf('/'));
  let letzt = s.slice(s.lastIndexOf('/') + 1);
  if (letzt.length > 38) letzt = letzt.slice(0, 37) + '…';
  return wirt + '/…/' + letzt;
}
/* ---- U-27: der Reiter selbst ---------------------------------------
   Beleg und Verweis stehen nebeneinander und sind trotzdem zwei Dinge —
   deshalb zwei Kaesten mit zwei Ueberschriften und nicht eine Liste:

   Der BELEG ist eine Datei, die GAEPP selbst in den OneDrive-Ordner
   geschrieben, nach eigenem Muster benannt und beim Bezahlen nach
   «Bezahlt» weitergezogen hat. GAEPP kennt ihren Namen, ihren Ort und
   ihren Zustand; «Entfernen» hiesse hier, eine Datei zu loeschen.

   Ein VERWEIS ist eine Adresse, die Albrecht eingetippt hat. GAEPP legt
   nichts ab, prueft nichts nach und weiss nicht, ob dahinter noch etwas
   liegt (U-22). «Entfernen» nimmt die Adresse weg, nicht das Dokument.

   Wuerde man beide in eine Liste werfen, stuende neben dem Beleg ein
   Entfernen-Knopf, der etwas anderes tut als der daneben. Das ist die
   gefaehrlichste Art von Aehnlichkeit. */
function dokReiterHtml(art, id) {
  const o = dokTraeger(art, id);
  if (!o) return '<p class="meldung">Dazu gibt es nichts mehr.</p>';
  const schl = art + ':' + o.id;
  const dok = dokListe(o);
  const roh = (o.dokumente || []);
  /* Verworfene Eintraege werden gezaehlt, nicht verschwiegen: wer einen
     Verweis hinterlegt hat und ihn nicht sieht, sucht sonst im Falschen. */
  const verworfen = roh.length - dok.length;
  const eintraege = dok.map((d, i) => `<div class="dokeintrag">
      <span class="dokna"><b><a class="doklink" href="${htmlAttr(d.url)}" target="_blank"
          rel="noopener">${htmlText(d.name || d.url)}</a></b>
        <span class="dokadr" title="${htmlAttr(d.url)}">${htmlText(dokKurz(d.url))}</span></span>
      ${_ro ? '' : `<span class="dokwerk">
        <button class="knopf klein" type="button" data-dokumb="${schl}:${i}">Umbenennen</button>
        <button class="knopf klein" type="button" data-dokloesch="${schl}:${i}">Entfernen</button>
      </span>`}</div>`).join('');
  return (art === 'rechnung' ? `<p class="dokgruppe">Abgelegter Beleg</p>
    ${o.belegDatei || o.belegOffen ? `<div class="dokbeleg" id="rechBeleg">
        <span class="dokna"><b>${htmlText(o.belegDatei || 'Beleg')}</b>
          <span class="dokadr">${o.belegDatei
            ? 'liegt im GÄPP-Ordner — von GÄPP abgelegt, benannt und beim Bezahlen mitgezogen'
            : 'liegt im Zwischenspeicher und wird abgelegt, sobald der Ordner freigegeben ist'}</span></span>
        <span class="dokwerk"><button class="knopf klein" data-beleg="${o.id}">Öffnen</button></span>
      </div>` : `<p class="meldung" id="rechBelegLeer">Kein Beleg hinterlegt. Der Beleg kommt
        beim Erfassen der Rechnung dazu — GÄPP legt ihn selbst im Ordner ab.</p>`}
    <p class="dokgruppe">Verweise</p>` : '')
  + `<div class="dokliste" id="dokListe">${eintraege}</div>
    ${dok.length ? '' : '<p class="meldung">Noch kein Verweis hinterlegt.</p>'}
    ${verworfen ? `<p class="meldung fehler">${verworfen} Eintrag${verworfen > 1 ? 'e' : ''} in der
      Datei wird nicht gezeigt: die Adresse beginnt nicht mit http:// oder https://.</p>` : ''}
    ${_ro ? '<p class="meldung">Schreibgeschützt — hier lässt sich nichts hinterlegen.</p>' : `
    <div class="dokneu">
      <div class="feldchen breit"><label for="dokNeuName">Bezeichnung</label>
        <input class="dokfeld" type="text" id="dokNeuName"
               placeholder="${DOK_BEISPIEL[art] || 'Bezeichnung'}"></div>
      <div class="feldchen breit"><label for="dokNeuUrl">Adresse</label>
        <input class="dokfeld" type="text" id="dokNeuUrl" placeholder="https://…"></div>
      <div class="feldchen"><button class="knopf primaer" type="button"
        data-dokneu="${schl}">Hinterlegen</button></div>
    </div>
    <p class="meldung" id="dokNeuHint">GÄPP legt nichts ab und prüft nichts nach — es merkt sich
      nur den Verweis, und zwar sofort. Bei OneDrive ist das der Freigabelink, nicht der Pfad
      im Explorer.</p>
    ${art === 'konto' ? `<p class="meldung" id="dokKeinZugang">Kontoauszüge, Bankvertrag,
      Korrespondenz — <b>keine Zugangsdaten</b>. Diese Datei liegt in einem Git-Repository
      und wird bei jeder Änderung ganz neu geschrieben; was einmal darin stand, steht in der
      Historie weiter.</p>` : ''}`}`;
}
/* ---- U-27: der Wegweiser im Zahlungsreiter --------------------------
   Er zeigt, was hinterlegt ist, und fuehrt zum Reiter — mehr nicht.
   Erfassen und Entfernen standen bis U-26 hier; sie sind weggefallen,
   weil dieselbe Sache an zwei Stellen gepflegt zwei Wahrheiten sind,
   sobald eine der beiden Stellen einmal nicht mitgezogen wird. */
function dokWegweiser(art, id) {
  const o = dokTraeger(art, id);
  if (!o) return '';
  const dok = dokListe(o);
  const links = dok.map(d =>
    `<span class="dokchip"><a href="${htmlAttr(d.url)}" target="_blank" rel="noopener"
       >${htmlText(d.name || d.url)}</a></span>`).join('');
  /* Bei einer Rechnung stand der Beleg bis U-27 in der Uebersichtstafel. Er
     steht jetzt im Reiter — hier bleibt nur die Nachricht, dass es ihn gibt.
     Sie sieht bewusst NICHT aus wie eine Verweismarke: der Beleg ist kein
     Verweis, und wer hier auf einen Klick hofft, bekaeme sonst keinen. */
  const beleg = art === 'rechnung'
    ? `<span class="dokbelegmarke">${o.belegDatei ? 'Beleg abgelegt'
        : o.belegOffen ? 'Beleg liegt bereit' : 'kein Beleg'}</span>` : '';
  return `<div class="dokzeile" id="${art === 'rechnung' ? 'rechDok' : 'schuldDok'}">
    <span class="dokmarke">Dokumente</span>
    ${links || '<span class="meldung">noch keine hinterlegt</span>'}
    ${beleg}
    <button class="knopf klein" type="button" data-blattreiter="dokumente"
      >Im Reiter «Dokumente»${_ro ? ' ansehen' : ' pflegen'}</button>
  </div>`;
}
/* Speichern heisst hier: jetzt. merkeStand() steht vor der ersten
   Mutation, persist() danach, blattZeichnen() zeichnet den Reiter mit dem
   neuen Eintrag und dem wieder leeren Formular. Wer danach das Blatt
   schliesst, verliert nichts — das ist der ganze Punkt. */
function dokAnlegen(schluessel) {
  const { art, id } = dokSchl(schluessel);
  const o = dokTraeger(art, id); if (!o || _ro) return;
  const n = ($('#dokNeuName').value || '').trim(), u = ($('#dokNeuUrl').value || '').trim();
  if (!dokUrlOk(u)) {
    const h = $('#dokNeuHint');
    if (h) { h.textContent = 'Die Adresse muss mit http:// oder https:// beginnen.';
             h.classList.add('fehler'); }
    const f = $('#dokNeuUrl'); if (f) f.focus();
    return;
  }

  if (!Array.isArray(o.dokumente)) o.dokumente = [];
  o.dokumente.push({ name: n || u, url: u });

  /* Der Fokus geht zurueck ins erste Feld: wer einen Verweis hinterlegt,

  setTimeout(() => { const f = $('#dokNeuName'); if (f) f.focus(); }, 0);

function dokUmbenennen(schluessel) {
  const { art, id, i } = dokSchlI(schluessel);
  const o = dokTraeger(art, id); if (!o || _ro) return;
  const d = (o.dokumente || [])[i]; if (!d) return;
  const neu = prompt('Wie soll der Verweis heissen? Die Adresse bleibt, wie sie ist.', d.name || '');
  if (neu === null) return;
  const t = neu.trim(); if (!t || t === d.name) return;
  merkeStand('Verweis umbenannt');
  d.name = t;
  persist(); blattZeichnen();
}
function dokLoeschen(schluessel) {
  const { art, id, i } = dokSchlI(schluessel);
  const o = dokTraeger(art, id); if (!o || _ro) return;
  const d = (o.dokumente || [])[i]; if (!d) return;
  if (!frage('Verweis «' + (d.name || d.url) + '» entfernen? Das Dokument selbst bleibt, wo es liegt.')) return;

/* Zwei Felder und ein Knopf sind ein Formular, auch ohne <form>. Enter

function maskeZahlung(v) {

      <span class="wert"><span class="k">Stand</span><span class="v">${fmt(st)}</span></span>
      <span class="wert"><span class="k">Rate ${MON[S.monat]}</span><span class="v">${fmt(r)}</span></span>
      <span class="wert"><span class="k">Getilgt</span><span class="v">${Math.round(getilgtAnteil(v)*100)} %</span></span>

        <span class="v" style="font-size:15px">${v.vereinbarungBis.slice(8,10)}.${v.vereinbarungBis.slice(5,7)}.${v.vereinbarungBis.slice(0,4)}</span></span>` : ''}

    ${dokWegweiser('verbind', v.id)}

    <div class="maske" style="margin-top:14px">
      <div class="feld"><label>Datum</label><input type="date" id="zDatum" value="${heuteISO()}"></div>
      <div class="feld"><label>Betrag</label>
        <input class="num" id="zBetrag" type="text" inputmode="decimal" value="${r ? fmt(r) : ''}"></div>
      <div class="feld voll"><label>Ab Konto</label>
        <select id="zKonto">${kontoOptionen(v.kontoId || 'schuld')}</select></div>
      <div class="feld voll"><label>Notiz</label><input type="text" id="zText" placeholder="frei"></div>
      <div class="aktion"><button class="knopf primaer" id="btnZahlung">Zahlung buchen</button>
        <span class="hint" id="zHint"></span></div>
    </div>

    ${erh.length ? `<table class="journal"><tbody>${erh.map(e =>
      `<tr><td class="tag">${kurzdatum(e.datum)} ${e.datum.slice(0,4)}</td><td>${e.text||''}</td>

/* ---- U-47: Die Vortraege gehoeren dorthin, wo die Erhoehungen stehen ---

function vortragBlock(v) {

/* Der Dialog dazu. Er schlaegt den durchgerechneten Wert vor — wer nichts
   aendert, bekommt genau das, was ohne Vortrag herauskaeme, und der Vortrag
   ist dann ein Festhalten und keine Verschiebung. */
let _vt = null;
function vortragMaske(vId, j) {
  const v = verbind(vId); if (!v) return;
  const jahre = Object.keys(D.budget).map(Number).filter(x => !isNaN(x)).sort((a,b) => a-b);
  const ziel = j || (jahre.length ? jahre[jahre.length-1] : new Date().getFullYear());
  _vt = { vId, jahr: ziel };
  const wert = vortrag(v, ziel);
  dialogAuf('Anfangssaldo setzen', `
    <p class="dlg-lead"><b>${htmlText(v.bezeichnung)}</b></p>
    <div class="dlg-zeile">
      <label>Gilt ab 1.1.
        <select id="vtJahr">${(jahre.length ? jahre : [ziel]).map(x =>
          `<option value="${x}"${x === ziel ? ' selected' : ''}>${x}</option>`).join('')}</select></label>
      <label>Betrag
        <input class="num" id="vtBetrag" type="text" inputmode="decimal"
               value="${wert !== null ? fmt(wert) : ''}" placeholder="${fmt(vortragGerechnet(v, ziel))}"></label>
    </div>
    <p class="meldung">Leer lassen und speichern entfernt den Vortrag — die Schuld rechnet dann
      wieder über die Jahresgrenze durch. Der Platzhalter ist der durchgerechnete Wert.</p>`,
    'Speichern', _ro ? null : vortragSpeichern, false);
}
function vortragSpeichern() {
  if (_ro || !_vt) return;
  const v = verbind(_vt.vId); if (!v) return;
  const j = String(parseInt($('#vtJahr').value, 10));
  const roh = ($('#vtBetrag').value || '').trim();
  merkeStand('Anfangssaldo ' + j + ' gesetzt');
  if (!v.staende) v.staende = {};
  if (roh === '') delete v.staende[j]; else v.staende[j] = rd(zahl(roh));
  persist(); dialogZu(); blattZeichnen(); zeichne();
}
/* ---- Verlauf einer Schuld ------------------------------------------
   Bis heute der wirkliche Stand, danach die Prognose — die Trennlinie
   sagt, wo das Gerechnete aufhoert und das Geplante anfaengt. */
function schuldVerlauf(v) {
  const jahre = Object.keys(D.budget).map(Number).sort();
  const a = ymOf(v.anfangsdatum), h = ymOf(heuteISO());
  const punkte = [], beschr = [];
  for (const j of jahre) {
    for (let m = 0; m < 12; m++) {
      if (j < a.j || (j === a.j && m < a.m)) continue;
      punkte.push({ j, m, wert: verbindPrognose(v, j, m), kuenftig: (j > h.j) || (j === h.j && m > h.m) });
    }
  }
  if (!punkte.length) return '<p class="meldung">Kein Verlauf.</p>';
  const w = punkte.map(p => p.wert);
  const max = Math.max(...w, 1), min = Math.min(...w, 0);
  const B = 640, H = 260, lr = 52, or_ = 14, ur = 26;
  const x = i => lr + i * (B - lr - 14) / Math.max(1, punkte.length - 1);
  const y = val => or_ + (H - or_ - ur) * (1 - (val - min) / ((max - min) || 1));
  const heuteI = punkte.findIndex(p => p.kuenftig);
  const pfad = a2 => a2.map((p,i) => (i ? 'L' : 'M') + x(p.i).toFixed(1) + ' ' + y(p.wert).toFixed(1)).join(' ');
  const mitI = punkte.map((p,i) => ({ ...p, i }));
  const bisHeute = mitI.filter(p => !p.kuenftig);
  const abHeute  = mitI.filter((p,i) => p.kuenftig || i === bisHeute.length - 1);
  const getilgt = tilgungsende(v);
  return `<div class="kennzahlen">
      <span class="wert"><span class="k">Stand heute</span><span class="v">${fmt(verbindStandHeute(v))}</span></span>
      <span class="wert"><span class="k">Anfangsstand</span><span class="v">${fmt(v.anfangsstand)}</span></span>
      <span class="wert"><span class="k">Getilgt</span><span class="v">${Math.round(getilgtAnteil(v)*100)} %</span></span>
      <span class="wert"><span class="k">Frei ab</span>
        <span class="v" style="font-size:15px">${getilgt || 'nach Plan nicht'}</span></span>
    </div>
    <svg class="verlauf" viewBox="0 0 ${B} ${H}" preserveAspectRatio="none">
      <line x1="${lr}" y1="${y(0).toFixed(1)}" x2="${B-14}" y2="${y(0).toFixed(1)}" stroke="#2a3542"/>
      <text x="4" y="${(y(max)+4).toFixed(1)}" font-size="10" fill="#8b95a2">${fmt(max,0)}</text>
      <text x="4" y="${(y(min)+4).toFixed(1)}" font-size="10" fill="#8b95a2">${fmt(min,0)}</text>
      <path d="${pfad(bisHeute)}" fill="none" stroke="#8ee6c8" stroke-width="2.2"/>
      <path d="${pfad(abHeute)}" fill="none" stroke="#8ee6c8" stroke-width="1.6" stroke-dasharray="4 3" opacity=".75"/>
      ${heuteI > 0 ? `<line x1="${x(heuteI).toFixed(1)}" y1="${or_}" x2="${x(heuteI).toFixed(1)}" y2="${H-ur}"
        stroke="#8b95a2" stroke-dasharray="2 3"/>
        <text x="${x(heuteI).toFixed(1)}" y="${or_+9}" font-size="10" fill="#8b95a2" text-anchor="middle">heute</text>` : ''}
      ${punkte.map((p,i) => (p.m === 0 || i === 0)
        ? `<text x="${x(i).toFixed(1)}" y="${H-8}" font-size="10" fill="#8b95a2" text-anchor="middle">${p.j}</text>` : '').join('')}
    </svg>
    <p class="meldung" style="margin-top:8px">Durchgezogen bis heute — das ist der gerechnete Stand aus
      Anfangsstand, gebuchten Zahlungen, Zins und Gebühr. Gestrichelt danach: die Prognose nach dem
      Ratenplan.${v.zinssatz ? ' Gerechnet mit ' + v.zinssatz + ' % Monatszins' + (v.gebuehr ? ' und ' + fmt(v.gebuehr) + ' Gebühr.' : '.') : ''}</p>`;
}

/* ---- Tilgungsprognose (E-15). Sie muss auch zeigen koennen,
   dass eine Schuld NICHT getilgt wird. -------------------------------- */
function tilgung(v) {
  const a = ymOf(v.anfangsdatum);
  let j = a.j, m = a.m, s = v.anfangsstand;
  if (a.t >= tageImMonat(a.j, a.m)) { m++; if (m===12) { m=0; j++; } }
  const z = v.zinssatz || 0, g = v.gebuehr || 0;
  const rows = [];
  let getilgtIm = null, jahresBeginn = s, letztesJahr = j;
  for (let i = 0; i < 84 && s > 0.005; i++) {
    /* U-47: derselbe Eingriff wie in verbindLauf — der Vortrag setzt den
       Stand am 1. Januar neu. `vor` wird danach gelesen, damit die Spalte
       «Stand» der Tilgungstabelle den Wert zeigt, mit dem gerechnet wird,
       und nicht den, der ueberschrieben wurde. */
    { const x = m === 0 ? vortrag(v, j) : null; if (x !== null) s = x; }
    const vor = s;
    (v.erhoehungen||[]).forEach(e => { const d = ymOf(e.datum);
      if (d.j===j && d.m===m) s += (e.art==='minderung' ? -e.betrag : e.betrag); });
    const zins = rd(s * z/100), r = rate(v, j, m);
    s = rd(s + zins + g - r);
    rows.push({ j, m, vor, zins, geb:g, rate:r, nach:s });
    if (s <= 0.005 && !getilgtIm) getilgtIm = MON_LANG[m] + ' ' + j;
    m++; if (m === 12) { m = 0; j++; }
  }
  const waechst = rows.length > 12 && rows[rows.length-1].nach > rows[0].vor;
  const kopf = getilgtIm
    ? `<p class="notiz"><b>Getilgt im ${getilgtIm}.</b> Gerechnet mit ${z ? z + ' % Monatszins' : 'ohne Zins'}${g ? ' und ' + fmt(g) + ' Gebühr' : ''}.</p>`
    : `<p class="notiz meldung fehler"><b>Diese Schuld wird nach dem vorliegenden Plan nicht getilgt.</b>
       ${waechst ? 'Sie wächst: Zins und Gebühr sind grösser als die Raten.' : 'Der Ratenplan endet, bevor der Stand null erreicht.'}
       Stand nach ${rows.length} Monaten: ${fmt(rows.length ? rows[rows.length-1].nach : v.anfangsstand)}.</p>`;
  return kopf + `<table class="tilg"><thead><tr><th>Monat</th><th>Stand</th><th>Zins</th><th>Gebühr</th>
      <th>Zahlung</th><th>danach</th></tr></thead><tbody>${
    rows.map(r => `<tr class="${r.m===11?'jahr':''}"><td>${MON[r.m]} ${r.j}</td><td>${fmt(r.vor)}</td>
      <td>${r.zins?fmt(r.zins):''}</td><td>${r.geb?fmt(r.geb):''}</td>
      <td class="zahl">${r.rate?fmt(r.rate):''}</td><td>${fmt(r.nach)}</td></tr>`).join('')
    }</tbody></table>`;
}

/* ---- Sparziel -------------------------------------------------------- */
function blattSparziel(id) {
  const s = D.sparziele.find(x => x.id === id);
  const st = sparstand(id, S.jahr, S.monat);
  return { kennung:'Sparziel', titel:s.name, koerper:`<div class="kennzahlen">
      <span class="wert"><span class="k">Stand</span><span class="v">${fmt(st)}</span></span>
      <span class="wert"><span class="k">Ziel</span><span class="v">${fmt(s.zielbetrag)}</span></span></div>
    <div class="maske"><div class="feld"><label>Betrag</label>
        <input class="num" id="spBetrag" type="text" inputmode="decimal"></div>
      <div class="feld"><label>Ab Konto</label><select id="spKonto">${kontoOptionen('hhk')}</select></div>
      <div class="aktion"><button class="knopf primaer" id="btnSparen">Einzahlen</button></div></div>` };
}

/* ===================================================================
   U-22 — Das Zeilenblatt
   -------------------------------------------------------------------
   Eine Budgetposition war bisher das einzige Stammdatum ohne eigenen
   Ort: umbenennen ging in der Verwaltung, ausblenden in der Tabelle,
   und der Zahlungsweg — «25. Dauerauftrag», die Angabe, die in der
   Tabelle in jeder Zeile steht — war UEBERHAUPT NICHT bearbeitbar. Die
   einzige schreibende Stelle im ganzen Quelltext setzte ihn beim
   Anlegen auf `{tag:null, art:''}`; danach half nur noch die JSON von
   Hand. Eine Angabe, die die App zeigt und nicht aendern laesst, ist
   eine Behauptung, keine Zahl.

   Gebaut nach dem Vorbild von blattSchuld: drei Reiter, das Blatt legt
   sich ueber die Tabelle, Escape fuehrt zurueck.

   Gespiegelte Zeilen bekommen KEINE Stammdaten. Was dort stuende, waere
   an dieser Stelle nicht zu pflegen — die Zahlen kommen aus den
   Ratenplaenen der Glaeubiger oder aus den erfassten Rechnungen. Das
   Blatt zeigt stattdessen den Weg dorthin. Zwei Pflegestellen fuer
   dieselbe Zahl waeren zwei Wahrheiten, und die zweite veraltet still.
   =================================================================== */

/* Die Zahlungswege, die im Bestand vorkommen (gelesen aus gaepp-daten.json,
   Stand 18.08.2026). Die Liste ist ein Vorschlag und keine Schranke: das
   Feld nimmt auch Freitext, weil eine Bank morgen einen Weg erfindet, den
   niemand hier eingetragen hat, und deswegen keine App angefasst werden soll. */
const ZAHLUNGSWEGE = ['Gutschrift', 'Abzug', 'Dauerauftrag', 'eBill', 'Überweisung',
                      'Bezug', 'Karte', 'LSV', 'Rückstellung'];

/* ---- Periodizität ----------------------------------------------------
   ACHTUNG, das ist eine ausdrueckliche Entscheidung und kein Versehen:
   `periodizitaet` ist BESCHREIBEND. Sie rechnet nicht. Keine Summe, keine
   Prognose, keine Faelligkeit, kein Vorschlag haengt daran — sie wird
   angezeigt und sonst nichts.

   Wer sie spaeter rechnen laesst, baut eine zweite Wahrheit neben die
   zwoelf Monatszellen: eine Zeile mit `jaehrlich` und Werten in vier
   Monaten waere dann widerspruechlich, und GAEPP muesste entscheiden,
   welche der beiden Angaben gilt. Das Budget ist die Zellenmatrix. Die
   Periodizität sagt einem Menschen, warum die Zellen so aussehen, wie
   sie aussehen. Mehr darf sie nicht. */
const PERIODIZITAETEN = [
  ['',                 '— nicht gesetzt —'],
  ['monatlich',        'monatlich'],
  ['vierteljaehrlich', 'vierteljährlich'],
  ['halbjaehrlich',    'halbjährlich'],
  ['jaehrlich',        'jährlich'],
  ['unregelmaessig',   'unregelmässig']
];
function periodizitaetText(z) {
  const p = (PERIODIZITAETEN.find(x => x[0] === (z.periodizitaet || '')) || PERIODIZITAETEN[0]);
  return z.periodizitaet ? p[1] : '';
}

function blattZeile(id) {
  const z = zeile(id);
  if (!z) return { titel: 'Position', koerper: '<p class="meldung">Diese Position gibt es nicht mehr.</p>' };
  const k = kategorie(z.kategorieId);
  const gesp = gespiegelt(z);
  /* Ohne Stammdaten faengt das Blatt beim Verlauf an — ein Reiter, der auf
     eine Absage fuehrt, waere der schlechteste erste Eindruck. */
  const reiter = _blatt.reiter && (!gesp || _blatt.reiter !== 'stamm')
    ? _blatt.reiter : (gesp ? 'verlauf' : 'stamm');
  _blatt.reiter = reiter;
  const koerper = reiter === 'stamm'  ? (gesp ? zeileQuelle(z) : zeileStamm(z))
                : reiter === 'verlauf' ? zeileVerlauf(z)
                :                        zeileJahre(z);
  const reiterliste = gesp
    ? [['verlauf','Verlauf'],['jahre','Jahre']]
    : [['stamm','Stammdaten'],['verlauf','Verlauf'],['jahre','Jahre']];
  return {
    weit: true,
    kennung: (k ? k.name : 'Position') + ' · ' + zeitTitel(),
    titel: z.bezeichnung,
    reiter: reiterliste,
    koerper: (gesp && reiter !== 'stamm' ? zeileQuelle(z) : '') + koerper,
    fuss: `<button class="knopf" data-zu>Schliessen</button>`
  };
}
/* Der Verweis auf die Quelle — er steht bei einer gespiegelten Zeile ueber
   jedem Reiter, nicht nur auf einem. Wer den Verlauf ansieht und sich fragt,
   wo die Zahlen herkommen, soll die Antwort dort finden, wo er steht. */
function zeileQuelle(z) {
  const rate0 = !!zeileGruppe[z.id];
  return `<p class="notiz" id="zQuelle" data-zquelle="${rate0 ? 'verbind' : 'rechnung'}"
      style="border-left:2px solid var(--accent);padding-left:11px;margin-bottom:14px">
    <b>Diese Position wird hier nicht gepflegt.</b> Ihre Zahlen kommen aus
    ${rate0 ? 'den Ratenplänen der Gläubiger dieser Gruppe'
            : 'den erfassten Rechnungen'} und ändern sich dort.
    <span style="display:inline-block;margin-top:7px">
      <button class="knopf klein" data-spring="${z.id}">Zur Quelle</button></span></p>`;
}

/* ---- Reiter 1: Stammdaten ------------------------------------------- */
function zeileStamm(z) {
  const w = z.zahlungsweg || {};
  const jahre = Object.keys(D.budget).map(Number).sort();
  /* Ein ausAb, das auf kein Budgetjahr zeigt, darf nicht aus der Liste
     fallen — sonst setzte ein Speichern es stillschweigend zurueck. */
  const ausJahre = jahre.slice();
  if (z.ausAb != null && z.ausAb !== 0 && ausJahre.indexOf(z.ausAb) < 0) ausJahre.push(z.ausAb);
  return `<div class="maske" id="maskeZeile">
    <div class="feld voll"><label>Bezeichnung</label>
      <input type="text" id="zsName" value="${htmlAttr(z.bezeichnung)}"></div>
    <div class="feld"><label>Kategorie</label>
      <select id="zsKat">${D.kategorien.slice().sort((a,b)=>a.rang-b.rang).map(c =>
        `<option value="${c.id}"${c.id===z.kategorieId?' selected':''}>${htmlText(c.name)}${
          c.kontoId && konto(c.kontoId) ? ' — ' + htmlText(konto(c.kontoId).name) : ''}</option>`).join('')}</select></div>
    <div class="feld"><label>Ausblenden</label>
      <select id="zsAusAb">
        <option value=""${z.ausAb == null ? ' selected' : ''}>immer sichtbar</option>
        <option value="0"${z.ausAb === 0 ? ' selected' : ''}>ganz aus</option>
        ${ausJahre.sort((a,b)=>a-b).map(j =>
          `<option value="${j}"${z.ausAb === j ? ' selected' : ''}>ab ${j} aus</option>`).join('')}
      </select></div>
    <div class="feld"><label>Zahlungsweg</label>
      <input type="text" id="zsArt" list="zsArten" value="${htmlAttr(w.art || '')}"
             placeholder="z.B. Dauerauftrag — frei wählbar">
      <datalist id="zsArten">${ZAHLUNGSWEGE.map(a => `<option value="${htmlAttr(a)}"></option>`).join('')}</datalist></div>
    <div class="feld"><label>Tag im Monat</label>
      <input class="num" id="zsTag" type="text" inputmode="numeric"
             value="${w.tag ? w.tag : ''}" placeholder="leer = kein fester Tag"></div>
    <div class="feld"><label>Periodizität</label>
      <select id="zsPer">${PERIODIZITAETEN.map(([v,n]) =>
        `<option value="${v}"${(z.periodizitaet||'')===v?' selected':''}>${n}</option>`).join('')}</select></div>
    <div class="feld haken voll"><input type="checkbox" id="zsGegen" ${z.gegenrichtung?'checked':''}>
      <label for="zsGegen">Gegenläufig — mindert die Summe ihrer Kategorie, statt sie zu erhöhen</label></div>
    <div class="feld voll"><span class="meldung">Die Periodizität ist eine Beschreibung und
      rechnet nicht: sie sagt, warum die zwölf Monatszellen so aussehen, wie sie aussehen.
      Was gerechnet wird, steht in den Zellen — nirgends sonst.</span></div>
    <div class="aktion"><button class="knopf primaer" id="btnZeileSpeichern">Speichern</button>
      <span class="hint" id="zsHint"></span></div>
  </div>`;
}
function zeileSpeichern() {
  const z = zeile(_blatt.id);
  if (!z) return;
  /* Im Schreibschutz aendert GAEPP nichts — auch nicht das, was harmlos
     aussieht: ein umgehaengtes ausAb verschiebt Summen über die ganze Tabelle,
     und zuruecknehmen liesse es sich dort nicht (A-88). */
  if (_ro) { $('#zsHint').textContent = 'GÄPP ist schreibgeschützt und ändert nichts.'; return; }
  const name = ($('#zsName').value || '').trim();
  if (!name) { $('#zsHint').textContent = 'Ohne Bezeichnung geht es nicht.'; return; }
  const tagRoh = ($('#zsTag').value || '').trim();
  const tag = parseInt(tagRoh, 10);
  if (tagRoh && (!(tag >= 1) || tag > 31)) {
    $('#zsHint').textContent = 'Der Tag muss zwischen 1 und 31 liegen.'; return; }
  const ausRoh = $('#zsAusAb').value;
  /* Auch das ist eine Aenderung, die man zurueckhaben will: wer die Kategorie
     umhaengt oder ein ausAb setzt, verschiebt Summen ueber die ganze Tabelle.
     Vor der ersten Zuweisung, wie ueberall (U-20). */
  merkeStand('«' + name + '» geändert');
  z.bezeichnung   = name;
  z.kategorieId   = $('#zsKat').value;
  z.ausAb         = ausRoh === '' ? null : parseInt(ausRoh, 10);
  z.periodizitaet = $('#zsPer').value || '';
  z.gegenrichtung = $('#zsGegen').checked;
  z.zahlungsweg   = { tag: tagRoh ? tag : null, art: ($('#zsArt').value || '').trim() };
  persist();
  blattZeichnen();
  $('#zsHint').textContent = 'Gespeichert.';
}

/* ---- Reiter 2: Verlauf ----------------------------------------------
   verlaufSvg() kommt aus den Berichten und nimmt zwei gleich lange
   Arrays, sonst nichts — genau deshalb laesst sie sich hier
   wiederverwenden, ohne dass ein Bericht davon weiss. */
function zeileVerlauf(z) {
  const art = _blatt.verlaufArt === 'jahre' ? 'jahre' : 'monate';
  const jahre = Object.keys(D.budget).map(Number).sort();
  const punkte = art === 'jahre'
    ? jahre.map(j => zeilenJahr(z, j))
    : [...Array(12).keys()].map(m => zeilenwert(z, S.jahr, m));
  const beschr = art === 'jahre' ? jahre.map(String) : MON.slice();
  const summe = rd(punkte.reduce((a,b) => a + b, 0));
  const gezeigt = punkte.filter(p => Math.abs(p) >= 0.005).length;
  return `<div class="kennzahlen">
      <span class="wert"><span class="k">${art === 'jahre' ? 'Alle Jahrgänge' : S.jahr}</span>
        <span class="v">${fmt(summe)}</span></span>
      <span class="wert"><span class="k">${art === 'jahre' ? 'Jahre mit Wert' : 'Monate mit Wert'}</span>
        <span class="v">${gezeigt} von ${punkte.length}</span></span>
      ${periodizitaetText(z) ? `<span class="wert"><span class="k">Periodizität</span>
        <span class="v" style="font-size:15px">${periodizitaetText(z)}</span></span>` : ''}
    </div>
    <div class="feld voll" style="margin:14px 0 10px">
      <span class="schalter" role="group">
        <button data-zvl="monate" aria-pressed="${art==='monate'}">Monate ${S.jahr}</button>
        <button data-zvl="jahre"  aria-pressed="${art==='jahre'}">Jahreswerte</button></span></div>
    ${verlaufSvg(punkte, beschr, 190)}
    <p class="meldung">${art === 'jahre'
      ? 'Ein Punkt je Budgetjahr — die Summe der zwölf Monate.'
      : 'Ein Punkt je Monat des Jahres ' + S.jahr + '.'}
      Gezeigt wird das Budgetierte, nicht das Gebuchte.</p>`;
}

/* ---- Reiter 3: Jahre ------------------------------------------------- */
function zeileJahre(z) {
  const jahre = Object.keys(D.budget).map(Number).sort();
  const gesp = gespiegelt(z);
  const kat = kategorie(z.kategorieId);
  return `<p class="notiz">${ausAbText(z)
      ? (z.ausAb === 0 ? '<b>Diese Position ist ganz ausgeblendet</b> — sie steht in keinem Jahrgang.'
                       : '<b>Ausgeblendet ab ' + z.ausAb + '.</b> Die Jahre davor zeigen sie weiter, '
                         + 'und ihre Werte bleiben erhalten.')
      : 'Diese Position ist in allen Jahrgängen sichtbar.'}
    ${kat && kat.ausAb != null
      ? ' Ihre Kategorie «' + htmlText(kat.name) + '» ist ' + ausAbText(kat)
        + ' — das nimmt die Position in denselben Jahren mit weg.' : ''}</p>
    <table class="journal" style="margin-top:12px"><thead><tr>
        <th>Jahrgang</th><th class="r">Soll</th><th class="r">Jahressumme</th><th>Sichtbar</th>
      </tr></thead><tbody>${jahre.map(j => {
        const sicht = zeileSicht(z, j);
        const soll = zeilenSoll(z, j);
        return `<tr><td class="tag">${j}</td>
          <td class="r num">${gesp && soll === null ? '—' : fmt0(soll)}</td>
          <td class="r num">${fmt0(zeilenJahr(z, j))}</td>
          <td>${sicht ? '' : '<span class="meldung">ausgeblendet</span>'}</td></tr>`;
      }).join('')}</tbody></table>`;
}

/* ===================================================================
   GAEPP — Belege lesen (A-55).

   Aus einem abgelegten PDF holt GAEPP heraus, was drinsteht: Betrag,
   Faelligkeit, Rechnungssteller, Rechnungsnummer und Referenz. Ohne
   Bibliothek und ohne Netz — die Textstroeme eines PDF liegen entweder
   im Klartext oder mit Deflate gepackt vor, und Deflate kann der Browser
   selbst (DecompressionStream).

   Zwei Regeln, die diesen Teil tragen:
   - **Erkanntes wird als erkannt gekennzeichnet, Nichterkanntes bleibt leer.**
     Eine geratene Zahl auf einer Rechnung ist schlimmer als ein leeres Feld.
   - **Nichts wird still uebernommen.** Was GAEPP gefunden hat, steht sichtbar
     ueber der Maske, und jedes Feld laesst sich ueberschreiben.
   =================================================================== */

/* Deflate direkt ueber Writer und Reader — der Umweg ueber Blob und Response
   scheitert, wenn die Datei aus dem Dateisystem geoeffnet wurde (file://). */
async function entpacken(bytes, art) {
  const stuecke = [];
  let n = 0;
  try {
    const ds = new DecompressionStream(art);
    const schreiber = ds.writable.getWriter();
    schreiber.write(bytes).catch(() => {});
    schreiber.close().catch(() => {});
    const leser = ds.readable.getReader();
    while (true) {
      const { value, done } = await leser.read();
      if (done) break;
      stuecke.push(value); n += value.length;
      if (n > 12e6) break;                    /* Notbremse bei riesigen Stroemen */
    }
  } catch (err) {
    /* «Junk found after end of compressed data» heisst: der Strom war gueltig und
       danach stand noch das Trennzeichen vor endstream. Was gelesen wurde, gilt.
       Bei einem echten Fehler ist die Liste leer und wir geben null zurueck. */
  }
  if (!n) return null;
  const alles = new Uint8Array(n);
  let k = 0;
  for (const st of stuecke) { alles.set(st, k); k += st.length; }
  return new TextDecoder('latin1').decode(alles);
}

/* ---- Textstroeme aus einem PDF ------------------------------------- */
async function pdfText(datei) {
  const roh = new Uint8Array(await datei.arrayBuffer());
  const kopf = new TextDecoder('latin1').decode(roh.subarray(0, 8));
  if (!kopf.startsWith('%PDF')) return '';
  const ganz = new TextDecoder('latin1').decode(roh);
  const teile = [];
  let i = 0;
  while (true) {
    const a = ganz.indexOf('stream', i);
    if (a < 0) break;
    /* «endstream» enthaelt «stream» — ohne diese Pruefung verschiebt sich alles. */
    if (ganz.slice(a - 3, a) === 'end') { i = a + 6; continue; }
    let b = a + 6;
    if (ganz[b] === '\r') b++;
    if (ganz[b] === '\n') b++;
    const e = ganz.indexOf('endstream', b);
    if (e < 0) break;
    i = e + 9;
    const roh2 = roh.subarray(b, e);
    let text = null;
    /* Erst ungepackt versuchen, dann mit Deflate und mit rohem Deflate. */
    const probe = new TextDecoder('latin1').decode(roh2.subarray(0, 400));
    if (/BT|Tj|TJ/.test(probe) && !/[\x00-\x08\x0e-\x1f]{4}/.test(probe.slice(0,40))) {
      text = new TextDecoder('latin1').decode(roh2);
    } else {
      for (const art of ['deflate', 'deflate-raw']) {
        const t = await entpacken(roh2, art);
        if (t && /BT|Tj|TJ/.test(t)) { text = t; break; }
      }
    }
    if (text) teile.push(text);
  }
  /* Aus den Textoperatoren die Zeichenketten holen. */
  let out = '';
  for (const t of teile) {
    const klammern = t.match(/\((?:\\.|[^()\\])*\)/g) || [];
    out += klammern.map(s => s.slice(1, -1)
      .replace(/\\([nrt])/g, ' ')
      .replace(/\\([()\\])/g, '$1')
      .replace(/\\([0-7]{1,3})/g, (m, o) => String.fromCharCode(parseInt(o, 8)))).join(' ') + ' ';
    const hex = t.match(/<([0-9A-Fa-f\s]{4,})>/g) || [];
    for (const h of hex) {
      const z = h.replace(/[<>\s]/g, '');
      if (z.length % 2) continue;
      let s = '';
      for (let k = 0; k < z.length; k += 2) {
        const c = parseInt(z.substr(k, 2), 16);
        if (c >= 32 && c < 255) s += String.fromCharCode(c);
      }
      if (s.length > 3) out += s + ' ';
    }
  }
  return out.replace(/\s+/g, ' ').trim();
}

/* ---- Aus dem Text die Angaben herausfischen ------------------------- */
/* Zwei Stufen: «weich» behaelt Punkt, Komma und Apostroph — sonst zerfaellt
   ein Betrag in zwei Zahlen und ist nicht mehr zu finden. «hart» wirft alles
   weg und dient nur dem Namensabgleich.
   Hier stand frueher ein Betrag aus Albrechts Rechnungen als Beispiel; er ist
   am 17.08.2026 entfernt worden (A-78 gilt auch fuer Kommentare). */
function weich(s) {
  return String(s).toLowerCase()
    .replace(/ä/g,'a').replace(/ö/g,'o').replace(/ü/g,'u').replace(/é|è|ê/g,'e').replace(/ß/g,'ss')
    .replace(/[^a-z0-9 .,'\/-]/g,' ').replace(/\s+/g,' ').trim();
}
function ohneAkzent(s) {
  return weich(s).replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
}
function belegLesen(text, dateiname) {
  const f = { betrag:null, faelligkeit:null, stellerId:null, stellerName:null,
              nummer:null, referenz:null, iban:null, gefunden:[], text };
  const T = text || '';
  const flach = weich(T);          /* fuer Betraege und Daten */
  const hart  = ohneAkzent(T);     /* fuer den Namensabgleich */

  /* --- Betrag: erst dort, wo die Rechnung ihn selbst benennt --- */
  const geld = '([0-9]{1,3}(?:[\' ][0-9]{3})*(?:[.,][0-9]{2}))';
  const betragMuster = [
    new RegExp('betrag von chf ' + geld, 'i'),
    new RegExp('rechnungsbetrag[^0-9]{0,20}' + geld, 'i'),
    new RegExp('zu zahlen[^0-9]{0,20}' + geld, 'i'),
    new RegExp('total[^0-9]{0,20}chf ?' + geld, 'i'),
    new RegExp('chf ' + geld + '[^0-9]{0,12}bis', 'i'),
    new RegExp('offener? (?:betrag|saldo)[^0-9]{0,20}' + geld, 'i')
  ];
  const zuZahl = x => rd(parseFloat(String(x).replace(/[' ]/g,'').replace(',','.')));
  for (const m of betragMuster) {
    const t = flach.match(m);
    if (t) { f.betrag = zuZahl(t[1]); f.gefunden.push('Betrag'); break; }
  }
  /* Rueckfall: steht genau ein Betrag hinter «CHF», ist er es fast immer. */
  if (f.betrag === null) {
    const alle = [...flach.matchAll(new RegExp('chf ?' + geld, 'gi'))].map(t => zuZahl(t[1]));
    const einzig = [...new Set(alle)];
    if (einzig.length === 1) { f.betrag = einzig[0]; f.gefunden.push('Betrag'); }
  }

  /* --- Faelligkeit: «zahlbar bis», «bis TT.MM.JJJJ», «faellig am» --- */
  const dat = '([0-3]?[0-9])[.\\/ ]([01]?[0-9])[.\\/ ](20[0-9]{2})';
  const datumMuster = [
    new RegExp('zahlbar bis(?: zum)?[^0-9]{0,10}' + dat, 'i'),
    new RegExp('bis(?: zum)?[^0-9]{0,10}' + dat, 'i'),
    new RegExp('fallig(?: am)?[^0-9]{0,10}' + dat, 'i'),
    new RegExp('zahlungsziel[^0-9]{0,10}' + dat, 'i')
  ];
  for (const m of datumMuster) {
    const t = flach.match(m);
    if (t) {
      const j = +t[3], mo = +t[2], tg = +t[1];
      if (mo >= 1 && mo <= 12 && tg >= 1 && tg <= 31) {
        f.faelligkeit = iso(j, mo - 1, tg); f.gefunden.push('Fälligkeit'); break;
      }
    }
  }

  /* --- Rechnungssteller: Abgleich gegen die gepflegte Liste --- */
  let best = null;
  D.steller.filter(s => s.aktiv !== false && s.id !== 'st_sonstige').forEach(s => {
    /* Auch Teilnamen: Bei einem zusammengesetzten Firmennamen genuegt ein
       Wort daraus, sofern es mindestens vier Zeichen hat. Das laengste
       gefundene Wort gewinnt. (Das Beispiel an dieser Stelle nannte einen
       echten Rechnungssteller und ist am 17.08.2026 entfernt worden.) */
    ohneAkzent(s.name).split(' ').filter(w => w.length >= 4).forEach(wort => {
      if (hart.includes(wort) && (!best || wort.length > best.laenge))
        best = { s, laenge: wort.length };
    });
  });
  if (best) { f.stellerId = best.s.id; f.stellerName = best.s.name; f.gefunden.push('Rechnungssteller'); }

  /* --- Rechnungsnummer, QR-Referenz, IBAN --- */
  const nr = T.match(/(?:Rechnung(?:s)?(?:\s*Nr\.?|nummer)?|Monatsrechnung|Beleg(?:nr)?)[^0-9]{0,12}((?:\d[\d\s]{5,})\d)/i);
  if (nr) { f.nummer = nr[1].replace(/\s+/g,' ').trim(); f.gefunden.push('Rechnungsnummer'); }
  const ref = T.replace(/\s/g,'').match(/\b(\d{27})\b/);
  if (ref) { f.referenz = ref[1]; f.gefunden.push('Referenz'); }
  const iban = T.replace(/\s/g,'').match(/\b(CH\d{2}[0-9A-Z]{15,17})\b/);
  if (iban) { f.iban = iban[1]; f.gefunden.push('IBAN'); }

  /* --- Notfalls das Datum aus dem Dateinamen --- */
  if (!f.faelligkeit && dateiname) {
    const d = String(dateiname).match(/(20[0-9]{2})[-_ ]?([01][0-9])[-_ ]?([0-3][0-9])/);
    if (d) { f.faelligkeit = d[1] + '-' + d[2] + '-' + d[3]; f.gefunden.push('Datum aus dem Dateinamen'); }
  }
  return f;
}

/* Wird nach dem Ablegen einer Datei aufgerufen; das Ergebnis landet in _gelesen. */
let _gelesen = null;
async function belegAuswerten(datei) {
  _gelesen = { laeuft:true, name:datei.name };
  try {
    const t = /\.pdf$/i.test(datei.name) ? await pdfText(datei) : '';
    _gelesen = belegLesen(t, datei.name);
    _gelesen.name = datei.name;
    _gelesen.keinText = !t;
  } catch (err) {
    _gelesen = { name:datei.name, gefunden:[], fehler:String(err.message || err) };
  }
  return _gelesen;
}

/* ===================================================================

   -------------------------------------------------------------------
   Neun gleichrangige Karten in einem Modal waren eine Wand. Als Seite
   sind sie in drei Abschnitte gegliedert: was man pflegt, was still-
   gelegt ist, was eingestellt wird. Gleiche Bauteile, andere Ordnung.

/* vwKarten() lieferte die neun Karten der alten Verwaltung im Modal. Seit dem
   Umbau zur Seite (U-18/U-19) baut vwInhalt(seite) den Inhalt, und vwKarten

   Verwaltung heissen, dass eine Aenderung an der falschen landen kann.
   vwListe() bleibt, sie traegt die Listen der neuen Seite. */

/* ===================================================================
   U-19 — Verwaltung: Register links, Inhalt rechts, Struktur als Baum
   -------------------------------------------------------------------
   Neun Karten nebeneinander waren unruhig, weil sie Ungleiches gleich
   behandelten: eine Liste mit 37 Zeilen neben einem einzelnen Eingabe-
   feld. Jetzt liegt links ein Register und rechts genau eine Sache.

   Und der wichtigste Teil, die Struktur, ist kein Nebeneinander mehr,
   sondern das, was er in Wahrheit ist: Konto traegt Kategorie traegt
   Position. Das steht sonst nirgends — die Positionsliste musste die
   Kategorie bisher in jeden Namen hineinschreiben.
   =================================================================== */
const VW_SEITEN = [
  /* U-35: «Konten» steht VOR «Struktur» und nicht darin. Zwei Gruende:
     Das Konto ist die Wurzel — der Baum liest sich von oben nach unten,
     das Register folgt ihm. Und die Arbeit am Konto selbst (anlegen,
     aendern, anordnen, loeschen) ist eine andere als die an der
     Gliederung darunter; im Baum stand sie in derselben Zeile wie
     «2 Kategorien · 7 Positionen» und war damit dort zu finden, wo
     niemand sie sucht. Der Baum behaelt seine Kontoknoepfe: dieselben
     Kennzeichen, dieselben Handler, eine Wahrheit (G-4). */
  ['konten',   'Konten',            'anlegen, ändern, anordnen'],
  ['struktur', 'Struktur',          'Konten, Kategorien und Positionen'],
  /* U-37: «Gläubiger» steht als eigenes Register neben den Konten. Der Knopf
     in der Gruppenzeile der Verbindlichkeitentabelle bleibt, wo er ist — er
     ist der kurze Weg im Arbeitsfluss. Aber er ist an drei Bedingungen
     gebunden, die der Benutzer nicht im Kopf hat: die Gruppe muss gezeichnet
     sein, die Sicht darf nicht «Alle Jahre» sein, und die Datei darf nicht
     schreibgeschützt geladen haben. Zweimal ist genau daran das Anlegen
     gescheitert (F-17, und danach an der Jahressicht). Ein Register in der
     Verwaltung hat keine dieser Bedingungen: Stammdaten stehen dort, wo
     Stammdaten stehen, und sie stehen immer da.
     KEINE ZWEITE WAHRHEIT: Der Knopf hier trägt dasselbe Kennzeichen
     (`data-vadd`), ruft denselben Handler und öffnet dieselbe Maske wie der
     in der Tabelle. Genau das Muster, das U-35 für die Konten festgelegt hat
     — Knopf im Baum UND eigenes Register, dieselben Handler, eine Wahrheit
     (G-4). */
  ['glaeubiger','Gläubiger',        'anlegen, ändern, ausblenden, löschen'],
  ['steller',  'Rechnungssteller',  'wer dir Rechnungen schickt'],
  ['sparziele','Sparziele',         'worauf du hinsparst'],
  ['aus',      'Ausgeblendet',      'stillgelegte Zeilen und Kategorien'],
  ['-',        '',                  ''],
  ['lohntag',  'Lohntag',           'Bezugspunkt der Tageszahl'],

];

  /* U-21: gezaehlt wird, was ein ausAb TRAEGT — nicht, was heute unsichtbar
     ist. Eine Zeile, die erst 2029 wegfaellt, ist bereits eine Entscheidung,
     die man hier wiederfinden koennen muss. */
  if (id === 'aus')       return D.zeilen.filter(z => z.ausAb != null).length
                               + D.kategorien.filter(k => k.ausAb != null).length;

              <span class="zahl num">${gesp ? '—' : fmt0(soll) || ''}</span>
              <span class="zw">${gesp ? '<span class="meldung">kommt von anderswo</span>'
                : `<button class="knopf klein" data-vwum="zeile:${z.id}">Umbenennen</button>
                   ${nurKat ? `<span class="meldung">über die Kategorie ${c.ausAb === 0 ? 'ganz' : 'ab ' + c.ausAb} aus</span>`
                            : ausKnoepfe('zeile', z)}
                   <button class="knopf klein gefahr" data-vwloesch="zeile:${z.id}">Löschen</button>`}</span>
            </div>`;
          }).join('') : '<div class="knoten n3 leer"><span class="meldung">Keine Position in dieser Kategorie.</span></div>')}
        </div>`;
      }).join('')}
    </div>`;
  }).join('')}</div>`;
}
/* ===================================================================
   U-35 — Das Register «Konten»
   -------------------------------------------------------------------
   Was hier NICHT passiert: Es wird kein zweiter Weg zum Anlegen,
   Aendern, Ausblenden oder Loeschen gebaut. Die vier Knoepfe tragen
   dieselben Kennzeichen wie im Baum und im Kontoblatt — `data-vwneu`,
   `data-kaend`, `data-vwaus`, `data-vwloesch` — und laufen in dieselben
   Funktionen. Neu ist allein der Ort, an dem sie stehen, und der Griff
   davor (G-4).

   ZWEI BLOECKE, WEIL ES ZWEI BEREICHE GIBT
   «Konten» und «Reserve» stehen getrennt, weil ein Zug nur innerhalb
   eines Bereichs gilt. Ein einziger Fluss haette eine Ziellinie
   angeboten, die beim Loslassen nichts tut — und nichts ist schlimmer
   als ein Griff, der zu greifen scheint.
   Der Bereich «Reserve» steht auch dann da, wenn er leer ist: er ist
   Teil der Gliederung und nicht eine Folge davon, ob gerade etwas
   drinliegt.
   =================================================================== */
function vwKontenBlock(sek, titel, leer) {
  const e = zeitEnde();
  const liste = D.konten.filter(k => (k.sektion || 'konten') === sek)
    .sort((a, b) => (a.rang || 0) - (b.rang || 0));
  const summe = rd(liste.filter(k => k.aktiv !== false)
    .reduce((a, k) => a + kontosaldo(k.id, e.j, e.m), 0));
  return `<div class="vw-kontenblock" data-ksekkopf="${sek}">
    <h3 class="vw-blockkopf">${titel}
      <span class="meldung">${liste.length} ${liste.length === 1 ? 'Konto' : 'Konten'}${
        liste.length ? ' · zusammen ' + fmt(summe) : ''}</span></h3>
    ${liste.length ? `<div class="vw-liste vw-kontenliste">${liste.map(k => `
      <div class="z ${k.aktiv === false ? 'aus' : ''}"
           data-kkonto="${k.id}" data-ksek="${sek}" data-oart="konto">
        ${ordGriff('konto', k)}
        <span class="nr num">${htmlText(k.nr)}</span>
        <span class="n">${htmlText(k.name)}</span>
        <span class="rolle">${htmlText(k.rolle || '')}${
          k.frei ? (k.rolle ? ' · ' : '') + 'frei verfügbar' : ''}${
          k.aktiv === false ? ' · ausgeblendet' : ''}</span>
        <span class="zahl num">${fmt(kontosaldo(k.id, e.j, e.m))}</span>
        <span class="zw">
          <button class="knopf klein" data-kaend="${k.id}">Ändern</button>
          <button class="knopf klein" data-vwaus="konto:${k.id}">${
            k.aktiv === false ? 'Einblenden' : 'Ausblenden'}</button>
          <button class="knopf klein gefahr" data-vwloesch="konto:${k.id}">Löschen</button>
        </span></div>`).join('')}</div>`
      : `<p class="meldung">${leer}</p>`}
    <div class="vw-blockfuss"></div></div>`;
}
/* U-37 — ein Block je Gläubigergruppe, gebaut wie vwKontenBlock.
   Das Anordnen bleibt bewusst in der Verbindlichkeitentabelle: der Zug
   arbeitet mit Kopf- und Fusszeile der Gruppe (`tr.zeile-sub`,
   `tr.zeile-summe`), die es hier nicht gibt. Ein zweiter Ziehweg mit
   eigenen Selektoren waere genau die zweite Wahrheit, die G-4 verbietet. */
function vwGlaeubigerBlock(g) {
  const liste = ordListe('verb', g.id);
  const summe = rd(liste.filter(v => v.aktiv !== false)
    .reduce((a, v) => a + verbindStandHeute(v), 0));
  return `<div class="vw-kontenblock" data-gsekkopf="${g.id}">
    <h3 class="vw-blockkopf">${g.name}
      <span class="meldung">${liste.length} ${liste.length === 1 ? 'Gläubiger' : 'Gläubiger'}${
        liste.length ? ' · zusammen ' + fmt(summe) : ''}</span>
      ${_ro ? '' : `<button class="knopf klein" type="button" data-vadd="${g.id}">Gläubiger anlegen</button>`}
    </h3>
    ${liste.length ? `<div class="vw-liste vw-kontenliste">${liste.map(v => {
      const r = ((v.raten && v.raten[String(S.jahr)]) || {}).soll;
      return `<div class="z ${v.aktiv === false ? 'aus' : ''}" data-gverb="${v.id}">
        <span class="n">${htmlText(v.bezeichnung)}</span>
        <span class="rolle">${htmlText(kontoName(v.kontoId))}${
          v.zinssatz ? ' · ' + v.zinssatz + ' % Monatszins' : ''}${
          v.gebuehr ? ' · Gebühr ' + fmt(v.gebuehr) : ''}${
          r ? ' · Rate ' + S.jahr + ' ' + fmt(r) : ''}${
          v.aktiv === false ? ' · ausgeblendet' : ''}</span>
        <span class="zahl num">${fmt(verbindStandHeute(v))}</span>
        <span class="zw">
          <button class="knopf klein" data-gaend="${v.id}">Ändern</button>
          <button class="knopf klein" data-gaus="${v.id}">${
            v.aktiv === false ? 'Einblenden' : 'Ausblenden'}</button>
          <button class="knopf klein gefahr" data-vwloesch="verbindlichkeit:${v.id}">Löschen</button>
        </span></div>`;
    }).join('')}</div>`
      : `<p class="meldung">Noch kein Gläubiger in dieser Gruppe. «Gläubiger anlegen» rechts macht den ersten.</p>`}
    <div class="vw-blockfuss"></div></div>`;
}
/* Der Name des Zahlungskontos, ohne zu werfen, wenn keines gesetzt ist —

        <!-- U-30: «Konto anlegen» steht VOR «Kategorie anlegen» — der Baum

  if (seite === 'steller') return `

  if (seite === 'aus') {

    const eintrag = (art, o, name) => `

        const hatWert = o => !!o && ((o.soll || 0) !== 0 || (o.m || []).some(x => (x || 0) !== 0));
        const nZ = Object.keys(D.budget[j]).filter(z => hatWert(D.budget[j][z])).length;

/* ---- Das Blatt einer Rechnung: alles, was dazugehoert, an einer Stelle ---
   U-27: Das Blatt hatte bis hierher KEINE Reiter — alles stand in einer
   Tafel untereinander, der Beleg als vorletzte Zeile darin. Damit wohnten
   Beleg und Zusatzunterlagen an zwei Orten, sobald es Zusatzunterlagen
   gab. Es bekommt jetzt zwei Reiter nach dem Vorbild von blattSchuld:
   was die Rechnung IST (Übersicht) und was zu ihr GEHOERT (Dokumente).
   Die Belegzeile ist aus der Tafel verschwunden und steht nur noch im
   zweiten Reiter — eine Angabe an zwei Stellen ist eine zu viel. */
function blattRechnungZeigen(id) {
  const r = D.rechnungen.find(x => x.id === id);
  if (!r) return { titel:'Rechnung', koerper:'<p class="meldung">Diese Rechnung gibt es nicht mehr.</p>' };
  const st = steller(r.stellerId), z = zeile(r.zeileId), k = konto(r.kontoId);
  const gr = st && st.gruppeId ? D.stellerGruppen.find(g => g.id === st.gruppeId) : null;
  const buch = D.buchungen.filter(b => b.rechnungId === r.id);
  const feld = (k2, v2) => `<span class="wert"><span class="k">${k2}</span><span class="v" style="font-size:15px">${v2}</span></span>`;
  const reiter = _blatt.reiter === 'dokumente' ? 'dokumente' : 'uebersicht';
  _blatt.reiter = reiter;
  const uebersicht = `<div class="kennzahlen">
        ${feld('Betrag', fmt(r.betrag))}
        ${feld('Fällig', r.faelligkeit.split('-').reverse().join('.'))}
        ${feld('Status', r.status === 'offen' ? '<span class="off">offen</span>' : 'bezahlt')}
        ${feld('Konto', k ? k.nr + ' ' + k.name : '—')}
      </div>
      <table class="journal"><tbody>
        ${r.verbId ? `<tr><td>Gläubiger</td><td class="r">${
          (verbind(r.verbId) || {}).bezeichnung || '—'} — die Rate steht schon im Budget,
          deshalb zählt diese Rechnung dort nicht noch einmal. Beim Abhaken sinkt der
          Schuldenstand.</td></tr>` : ''}
        <tr><td>Position</td><td class="r">${r.verbId
          ? '— nicht nötig, die Rechnung hängt am Gläubiger'
          : (z ? kategorie(z.kategorieId).name + ' | ' + z.bezeichnung : '—')}</td></tr>
        <tr><td>Rückstellung</td><td class="r">${r.gedeckt
          ? 'ja — wird aus dem Rückstellungstopf bezahlt und mindert weder das freie Geld noch die Budgetzeile'
          : 'nein'}</td></tr>
        <tr><td>Mindert «Frei per Monatsende»</td><td class="r">${
          mindertFreies(r, ymOf(r.faelligkeit).j, ymOf(r.faelligkeit).m)
            ? 'ja' : 'nein — ' + (r.verbId ? 'Rate eines Gläubigers, steht schon im Budget'
                                : r.gedeckt ? 'Rückstellung' : 'wird nicht von einem freien Konto bezahlt')}</td></tr>
        ${r.notiz ? `<tr><td>Notiz</td><td class="r">${r.notiz}</td></tr>` : ''}
        ${buch.length ? buch.map(b => `<tr><td>Zahlung</td><td class="r">${
          b.datum.split('-').reverse().join('.')} · ${fmt(b.betrag)} ab ${konto(b.kontoId).name}</td></tr>`).join('') : ''}
      </tbody></table>
      ${dokWegweiser('rechnung', r.id)}`;
  return {
    kennung: 'Rechnung · ' + (gr ? gr.name : 'ohne Gruppe'),
    titel: (st ? st.name : '?') + ' · ' + fmt(r.betrag),
    reiter: [['uebersicht','Übersicht'], ['dokumente', dokReiterName('rechnung', r)]],
    koerper: reiter === 'dokumente' ? dokReiterHtml('rechnung', r.id) : uebersicht,
    fuss: `<span class="schalter" role="group" style="margin-right:auto">
        <button data-rst="${r.id}:offen"   aria-pressed="${r.status==='offen'}">offen</button>
        <button data-rst="${r.id}:bezahlt" aria-pressed="${r.status==='bezahlt'}">bezahlt</button></span>
      <button class="knopf klein" data-rweg="${r.id}">Löschen</button>
      <button class="knopf klein" data-rechauf="${r.id}">Ändern</button>
      <button class="knopf" data-zu>Schliessen</button>` };
}

/* ---- Rechnung erfassen (A-55 bis A-60, A-83) ------------------------- */
function blattRechnung(id) {
  const r = id ? D.rechnungen.find(x => x.id === id) : null;
  const g = (!r && _gelesen && !_gelesen.laeuft) ? _gelesen : null;

        «Rechnungen», die Position wird nicht gebraucht, das Zahlungskonto setzt GÄPP selbst —

        «Frei per Monatsende» noch die Budgetzeile «Rechnungen» — sonst stünde sie zweimal im Budget.</span></div>
      <div class="feld voll"><label>Notiz</label>

/* F-01: Zu welcher Verbindlichkeit gehoert die Rechnung? Leer heisst: zu
   keiner — dann verhaelt sie sich wie jede andere Rechnung.
   Bis zum 17.08.2026 gab es dieses Feld nicht. Die Monatsrechnung eines
   Kartenkontos war damit nicht sauber erfassbar: Sie fand keine passende
   Position, stand mit ihrem Betrag ein zweites Mal im Budget neben der
   Rate desselben Glaeubigers, und beim Abhaken blieb der Schuldenstand
   stehen, weil die erzeugte Buchung keine Verbindlichkeit kannte.
   Ein Feld schliesst alle drei Luecken. */
function verbindOptionen(sel) {
  const liste = D.verbindlichkeiten.filter(v => v.aktiv !== false);
  const nach = {};
  GRUPPEN.forEach(g => { nach[g.id] = liste.filter(v => v.gruppe === g.id); });
  return `<option value="">— keiner, das ist eine gewöhnliche Rechnung —</option>` +
    GRUPPEN.filter(g => nach[g.id].length).map(g =>
      `<optgroup label="${g.name}">` + nach[g.id].map(v =>
        `<option value="${v.id}" ${sel === v.id ? 'selected' : ''}>${v.bezeichnung}</option>`
      ).join('') + `</optgroup>`).join('');
}
function positionRechnung(sel, j) {
  return zeilenWahl(j, sel).filter(x => !zeileGruppe[x.z.id])
    .map(x => `<option value="${x.z.id}" ${sel===x.z.id?'selected':''}>${x.k.name} | ${x.z.bezeichnung}</option>`)
    .join('');
}

/* Rechnungssteller alphabetisch — eine Liste, die nach Anlegereihenfolge sortiert
   ist, sucht man dreimal durch. Ganz unten der Weg, einen neuen anzulegen, ohne
   die Maske zu verlassen. */
function stellerOptionen(sel) {
  const liste = D.steller.filter(s => s.aktiv !== false)
    .sort((a,b) => a.name.localeCompare(b.name, 'de-CH'));
  return `<option value="">— wählen —</option>` +
    liste.map(s => `<option value="${s.id}" ${sel===s.id?'selected':''}>${s.name}</option>`).join('') +
    `<option value="__neu">＋ Neuer Rechnungssteller …</option>`;
}
