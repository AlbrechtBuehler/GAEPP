        e.target.tagName, String(e.target.src || e.target.href || ''));

    let template = JSON.parse(templateEl.textContent);

    // document's manifest; frame srcs carry an about:blank#<uuid> marker

    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page

    // opaque origins (where a blob minted by one document cannot be

    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https

    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its

    // deny-by-default: one request form, one reply form, no error

    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document

      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.

        (e.origin === 'null' &&

            window.location.protocol === 'file:')) ||

    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down

      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;

      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }

    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {

      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.

        if (ownFrameWindows().indexOf(e.source) < 0) return;

        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'

        // ('__proto__', 'constructor') — an unshaped key would reach

        // Text is accepted only from the direct parent — the document
        // that minted this one.

    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {

    }

    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Space Grotesk';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"b83f900d-fc43-4b66-8bc7-3f33c5e9bad4\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Space Grotesk';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"e0bc2f62-06ef-4820-8827-6c8659702278\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\n\n/* ===================================================================\n   1. FARBWELT — Nacht 2 akzentuiert. Kein Umschalter. (A-69)\n   =================================================================== */\n:root{\n  --bg:#1b1b1b; --card:#282828; --sheet:#282828; --soft:#333;\n  --line:#3a3a3a; --rule:#484848; --ink:#ededed; --muted:#9b9b9b;\n  --accent:#EE7F00; --onaccent:#1b1b1b;\n  --ok:#8fbfa4; --err:#e0a08d; --open:#d3b587;\n  --radius:16px; --radius-sm:11px;\n  --gap:14px; --pad:16px; --edge:20px; --row:30px;\n  --shadow:0 1px 0 rgba(255,255,255,.03) inset,0 12px 30px -22px rgba(0,0,0,.95);\n  --hairline:#2f2f2f;   /* halbe Tinte: fuehrt das Auge, baut kein Gitter */\n  /* Breiten der drei fixierten Spalten */\n  --w1:250px; --w2:126px; --w3:78px; --wl:100px;\n}\n*{box-sizing:border-box;margin:0;padding:0}\n[hidden]{display:none !important}\nhtml,body{height:100%}\nbody{\n  background:var(--bg); color:var(--ink);\n  font-family:'Space Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif;\n  font-size:14px; line-height:1.5; display:flex; flex-direction:column; overflow:hidden;\n}\n.num{font-family:'IBM Plex Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums;font-size:13px}\n.ser{font-weight:600;letter-spacing:-.015em}\n.neg{color:var(--err)} .pos{color:var(--ok)} .off{color:var(--open)} .muted{color:var(--muted)}\n\n/* ===================================================================\n   FORM 1 — REITER. Wechselt die Ansicht. Sonst nichts.\n   =================================================================== */\n.reiter{display:flex;gap:20px;align-items:flex-end}\n.reiter button{\n  background:none;border:none;padding:6px 0 7px;cursor:pointer;\n  font-family:inherit;font-size:13px;font-weight:500;color:var(--muted);\n  border-bottom:2px solid transparent;letter-spacing:-.01em;\n}\n.reiter button:hover{color:var(--ink)}\n.reiter button[aria-selected=\"true\"]{font-size:15px;font-weight:700;color:var(--ink);border-bottom-color:var(--accent)}\n/* U-27: Eine Zahl am Reiter. Sie beantwortet die Frage, die man sonst nur\n   durch Anklicken beantworten koennte — «liegt hier etwas?». Deshalb steht\n   sie nur da, wenn wirklich etwas da ist: eine dauerhafte «0» waere ein\n   Fleck, den das Auge nach drei Tagen nicht mehr liest. Die Ziffer traegt\n   NICHT die Reiterfarbe, sonst konkurriert sie mit der Beschriftung. */\n.reiterzahl{display:inline-block;min-width:16px;padding:0 5px;margin-left:1px;\n  border-radius:999px;background:var(--soft);color:var(--muted);\n  font-size:10.5px;font-weight:600;line-height:16px;text-align:center;vertical-align:1.5px}\n.reiter button[aria-selected=\"true\"] .reiterzahl{background:var(--accent);color:var(--onaccent)}\n\n/* ===================================================================\n   FORM 2 — SCHALTER. Zwei oder drei Zustaende derselben Sache.\n   =================================================================== */\n.schalter{display:inline-flex;border:1px solid var(--line);border-radius:var(--radius-sm);overflow:hidden;background:var(--bg)}\n.schalter button{\n  background:none;border:none;border-right:1px solid var(--line);\n  padding:6px 13px;cursor:pointer;font-family:inherit;font-size:12.5px;font-weight:500;color:var(--muted);\n}\n.schalter button:last-child{border-right:none}\n.schalter button:hover{color:var(--ink)}\n.schalter button[aria-pressed=\"true\"]{background:var(--sheet);color:var(--accent);font-weight:600}\n\n/* ===================================================================\n   FORM 3 — FILTER. Blendet Zeilen aus. Nur in einer Filterzeile.\n   =================================================================== */\n.filterzeile{display:flex;gap:7px;flex-wrap:wrap;align-items:center}\n.filterzeile .lab{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-right:4px}\n.filter{\n  background:none;border:1px solid var(--rule);border-radius:999px;\n  padding:3px 11px 3px 8px;cursor:pointer;font-family:inherit;font-size:12px;color:var(--muted);\n  display:inline-flex;align-items:center;gap:5px;\n}\n.filter::before{content:'';width:9px;display:inline-block;text-align:center;font-size:10px}\n.filter[aria-pressed=\"true\"]{background:var(--soft);color:var(--ink)}\n.filter[aria-pressed=\"true\"]::before{content:'✓';color:var(--accent)}\n.filter:hover{color:var(--ink)}\n\n/* ===================================================================\n   FORM 4 — KNOPF. Loest etwas aus. Immer mit Wort.\n   =================================================================== */\n.knopf{\n  background:none;border:1px solid var(--rule);border-radius:var(--radius-sm);\n  padding:6px 13px;cursor:pointer;font-family:inherit;font-size:12.5px;font-weight:500;color:var(--ink);\n  display:inline-flex;align-items:center;gap:6px;white-space:nowrap;\n}\n.knopf:hover{border-color:var(--muted);background:var(--soft)}\n.knopf.primaer{background:var(--accent);border-color:var(--accent);color:var(--onaccent);font-weight:600}\n.knopf.primaer:hover{filter:brightness(1.1);background:var(--accent)}\n.knopf.klein{padding:4px 10px;font-size:11.5px}\n/* U-22: Ein Knopf, der etwas wegnimmt, sieht anders aus als einer, der etwas\n   tut — aber nicht schreiend. Die Randfarbe genuegt; eine rote Flaeche waere\n   ein Alarm, und ein Alarm, der bei jedem Loeschknopf steht, ist keiner mehr. */\n.knopf.gefahr{border-color:var(--err);color:var(--err)}\n.knopf.gefahr:hover{border-color:var(--err);background:rgba(224,160,141,.12)}\n.knopf.primaer.gefahr{background:var(--err);border-color:var(--err);color:var(--onaccent)}\n\n/* ===================================================================\n   FORM 5 — WERT. Zeigt. Tut nichts.\n   =================================================================== */\n.wert{display:block}\n.wert .k,.wert .v,.wert .z{display:block}\n.wert .k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}\n.wert .v{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;font-size:19px;font-weight:500;line-height:1.25}\n.wert .v.gross{font-size:26px}\n.wert .z{font-size:11.5px;color:var(--muted)}\n.kennzahlen{display:flex;gap:18px;flex-wrap:wrap;margin-bottom:11px}\n.kennzahlen .v{font-size:15px !important}\n.balken{height:5px;background:var(--soft);border-radius:3px;margin-top:12px;overflow:hidden}\n.balken > div{height:100%;background:var(--accent)}\n\n/* ===================================================================\n   FORM 6 — KLAPPKOPF. Die Flaeche klappt auf und zu.\n   =================================================================== */\n.klappkopf{\n  display:inline-flex;align-items:center;gap:8px;\n  background:none;border:none;border-left:3px solid var(--accent);\n  padding:0 10px 0 9px;margin-left:-9px;height:calc(var(--row) - 2px);\n  cursor:pointer;font-family:inherit;color:var(--ink);text-align:left;font-size:13px;\n  max-width:172px;\n}\n.klappkopf:hover .t{color:var(--accent)}\n.klappkopf .chev{font-size:10px;color:var(--accent);transition:transform .15s;flex:0 0 auto}\n.klappkopf[aria-expanded=\"false\"] .chev{transform:rotate(-90deg)}\n.klappkopf .t{font-weight:600;letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}\n.zeile-sub .klappkopf{border-left-color:var(--rule);margin-left:4px}\n\n/* ===================================================================\n   KARTE\n   =================================================================== */\n.karte{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}\n.karte-kopf{display:flex;align-items:center;gap:10px;padding:13px var(--pad) 0}\n.karte-kopf .titel{font-weight:600;letter-spacing:-.015em;font-size:15px;flex:1;display:flex;align-items:baseline;gap:8px}\n.karte-kopf .nr{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--muted)}\n.karte-koerper{padding:var(--pad)}\n.karte .reiter{padding:8px var(--pad) 0;border-bottom:1px solid var(--line);gap:16px}\n\n/* ===================================================================\n   GERUEST\n   =================================================================== */\n.kopfzeile{display:flex;align-items:center;gap:16px;row-gap:9px;flex-wrap:wrap;\n  padding:11px var(--edge);border-bottom:1px solid var(--line);background:var(--card);flex:0 0 auto}\n.marke{font-weight:700;font-size:19px;letter-spacing:.02em;color:var(--accent)}\n.zeitwahl{display:flex;align-items:center;gap:3px;position:relative}\n.zeitwahl .pfeil{\n  background:none;border:1px solid transparent;color:var(--muted);cursor:pointer;\n  font-family:inherit;font-size:12.5px;padding:5px 10px;border-radius:var(--radius-sm);min-width:74px;\n}\n.zeitwahl .pfeil:hover{background:var(--soft);color:var(--ink);border-color:var(--rule)}\n.zeitwahl .jetzt{\n  background:none;border:1px solid transparent;color:var(--ink);cursor:pointer;\n  font-family:inherit;font-weight:600;font-size:14.5px;letter-spacing:-.01em;padding:4px 12px;border-radius:var(--radius-sm);min-width:140px;\n}\n.zeitwahl .jetzt:hover{border-color:var(--rule);background:var(--soft)}\n.spacer{flex:1}\n\n.kalender{\n  position:absolute;top:40px;left:50%;transform:translateX(-50%);\n  background:var(--sheet);border:1px solid var(--rule);border-radius:var(--radius);\n  box-shadow:0 18px 44px -14px rgba(0,0,0,.85);padding:14px;z-index:60;width:296px;\n}\n.kalender .jahre{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:11px;padding-bottom:11px;border-bottom:1px solid var(--line)}\n.kalender .monate{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}\n.kalender button{background:none;border:1px solid var(--line);border-radius:var(--radius-sm);color:var(--muted);padding:5px 0;cursor:pointer;font-family:inherit;font-size:12px}\n.kalender button:hover{color:var(--ink);border-color:var(--rule)}\n.kalender button[aria-pressed=\"true\"]{background:var(--accent);border-color:var(--accent);color:var(--onaccent);font-weight:600}\n.kalender .jahre button{padding:5px 9px}\n.kalender .fuss{margin-top:11px;padding-top:11px;border-top:1px solid var(--line);display:flex}\n.kalender .fuss .knopf{width:100%;justify-content:center}\n\n/* ---- Seitenleiste (U-1) -------------------------------------------\n   Die Bereiche stehen links und bleiben stehen. Die Kopfzeile traegt\n   nur noch, was sich mit der Zeit aendert: Zeitraum und Kennzahlen.\n   Gewonnen: die Reiterzeile im Inhalt faellt ganz weg.                */\n.rahmen{display:flex;flex:1 1 auto;min-height:0}\n.haupt{display:flex;flex-direction:column;flex:1 1 auto;min-width:0;min-height:0}\n.seitenleiste{\n  flex:0 0 auto;width:212px;background:var(--card);border-right:1px solid var(--line);\n  display:flex;flex-direction:column;padding:11px 10px;gap:4px;transition:width .14s;\n}\n.seiten-kopf{display:flex;align-items:center;gap:8px;padding:2px 6px 12px}\n.seiten-kopf .marke{flex:1;overflow:hidden;white-space:nowrap}\n.falten{background:none;border:1px solid transparent;border-radius:8px;color:var(--muted);\n  cursor:pointer;font-family:inherit;font-size:13px;padding:3px 7px;flex:0 0 auto}\n.falten:hover{background:var(--soft);color:var(--ink);border-color:var(--rule)}\n.bereiche{display:flex;flex-direction:column;gap:2px}\n\n/* ---- Suche (U-23) ---------------------------------------------------\n   Ein Feld, das aussieht wie ein Feld — nicht wie ein Knopf mit Lupe.\n   Die Trefferliste haengt daran und tritt aus der Leiste heraus, weil\n   ein Weg («Fixkosten · Miete») in 212 Pixel nicht lesbar wird. Sie\n   liegt ueber der Sprungliste und unter dem Blatt: die Suche fuehrt zu\n   einem Blatt hin, sie liegt nie darueber.                            */\n.suchblock{position:relative;display:flex;align-items:center;gap:7px;margin:0 0 9px;\n  background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:0 8px}\n.suchblock:focus-within{border-color:var(--accent)}\n/* Offen liegt die Suche ueber allem — auch ueber einem Blatt (z-index 100)\n   und einem Dialog (120). Sonst waere Strg-K bei geoeffnetem Kontoblatt ein\n   Tippen ins Unsichtbare: der Fokus sitzt im Feld, die Trefferliste aber\n   unter der Abdunklung. Escape schliesst nur die Suche, das Blatt darunter\n   bleibt unberuehrt stehen. */\n.suchblock.offen{z-index:130;background:var(--sheet);border-color:var(--accent)}\n.suchblock > .ic{flex:0 0 14px;text-align:center;color:var(--muted);font-size:14px;cursor:pointer}\n.suchblock input{flex:1;min-width:0;background:none;border:none;outline:none;color:var(--ink);\n  font-family:inherit;font-size:12.5px;padding:7px 0}\n.suchblock .taste{flex:0 0 auto;font-size:9.5px;color:var(--rule);white-space:nowrap;letter-spacing:.02em}\n.rahmen.schmal .suchblock{justify-content:center;padding:7px 0;cursor:pointer}\n.rahmen.schmal .suchblock input{display:none}\n.suchliste{position:absolute;top:calc(100% + 6px);left:0;width:344px;z-index:90;\n  background:var(--sheet);border:1px solid var(--rule);border-radius:var(--radius);\n  box-shadow:0 18px 44px -14px rgba(0,0,0,.85);padding:5px;\n  max-height:min(62vh,460px);overflow-y:auto}\n.rahmen.schmal .suchliste{left:calc(100% + 8px);top:0}\n.suchliste .treffer{display:grid;grid-template-columns:1fr auto;gap:1px 10px;width:100%;\n  background:none;border:none;border-radius:8px;padding:6px 9px;cursor:pointer;\n  font-family:inherit;text-align:left;color:var(--ink)}\n.suchliste .treffer .n{font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}\n.suchliste .treffer .a{font-size:9.5px;color:var(--muted);text-transform:uppercase;\n  letter-spacing:.08em;align-self:center}\n.suchliste .treffer .w{grid-column:1/-1;font-size:11px;color:var(--muted);\n  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}\n.suchliste .treffer:hover{background:var(--soft)}\n.suchliste .treffer[aria-selected=\"true\"]{background:var(--soft);box-shadow:inset 2px 0 0 var(--accent)}\n.suchliste .treffer[aria-selected=\"true\"] .a{color:var(--accent)}\n.suchliste .leer{padding:11px 9px;font-size:12px;color:var(--muted)}\n.seiten-fuss{margin-top:auto;display:flex;flex-direction:column;gap:2px;\n  border-top:1px solid var(--line);padding-top:9px}\n/* U-15: Diese Regel galt fuer JEDEN Knopf in der Leiste — seit der Kalender\n   dort wohnt, also auch fuer seine Jahres- und Monatsknoepfe. Die wurden\n   dadurch 100 % breit, der Kalender viel zu hoch und oben abgeschnitten.\n   Sie gilt jetzt nur noch fuer die beiden Knopflisten, fuer die sie gedacht war. */\n.bereiche > button,.seiten-fuss > button{\n  display:flex;align-items:center;gap:10px;width:100%;\n  background:none;border:none;border-radius:9px;padding:8px 10px;cursor:pointer;\n  font-family:inherit;font-size:13px;font-weight:500;color:var(--muted);text-align:left;\n  border-left:3px solid transparent;\n}\n.bereiche > button:hover,.seiten-fuss > button:hover{background:var(--soft);color:var(--ink)}\n.bereiche > button .ic,.seiten-fuss > button .ic{flex:0 0 16px;text-align:center;font-size:13px;color:var(--muted)}\n.bereiche > button .tx,.seiten-fuss > button .tx{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}\n.bereiche > button[aria-current=\"true\"],.seiten-fuss > button[aria-current=\"true\"]{\n  background:var(--soft);color:var(--ink);font-weight:700;border-left-color:var(--accent)}\n.bereiche > button[aria-current=\"true\"] .ic,.seiten-fuss > button[aria-current=\"true\"] .ic{color:var(--accent)}\n.seitenleiste .syncknopf .punkt{flex:0 0 8px}\n.seitenleiste .syncknopf .tx{font-size:11.5px}\n.seitenleiste .motto{font-size:10px;padding:8px 10px 1px;color:var(--accent);opacity:.7;letter-spacing:0;white-space:nowrap;overflow:hidden}\n\n/* ---- Zeitraum als Zoomstufen (U-9) ---------------------------------\n   Drei Zeitraeume statt drei Woerter. Die Einrueckung zeigt, dass der\n   Monat im Jahr und das Jahr in der Spanne liegt; die senkrechte Linie\n   haelt sie zusammen. Der aktive Zeitraum traegt die Pfeile — gesprungen\n   wird immer auf der Stufe, auf der man steht.                        */\n.zeitblock{margin-top:16px;padding-top:12px;border-top:1px solid var(--line);position:relative}\n.leisten-titel{display:block;font-size:9.5px;text-transform:uppercase;letter-spacing:.14em;\n  color:var(--muted);padding:0 10px 7px}\n.stufen{display:flex;flex-direction:column;gap:1px;position:relative}\n.stufen::before{content:'';position:absolute;left:17px;top:11px;bottom:13px;width:1px;background:var(--line)}\n.seitenleiste .stufe{\n  display:flex;align-items:center;gap:9px;width:100%;position:relative;\n  background:none;border:none;border-radius:8px;cursor:pointer;\n  font-family:inherit;font-size:12px;color:var(--muted);text-align:left;padding:5px 6px;\n}\n.seitenleiste .stufe[data-tief=\"1\"]{padding-left:18px}\n.seitenleiste .stufe[data-tief=\"2\"]{padding-left:24px}\n.seitenleiste .stufe .ic{flex:0 0 12px;text-align:center;font-size:9px;color:var(--rule);\n  background:var(--card);position:relative;z-index:1}\n.seitenleiste .stufe .tx{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}\n.seitenleiste .stufe:hover{background:var(--soft);color:var(--ink)}\n.seitenleiste .stufe[aria-pressed=\"true\"]{color:var(--ink);font-weight:600;background:var(--soft)}\n.seitenleiste .stufe[aria-pressed=\"true\"] .ic{color:var(--accent)}\n.stufe .schritt{display:none;gap:1px;flex:0 0 auto;margin:-4px -4px -4px 0}\n.stufe[aria-pressed=\"true\"] .schritt{display:flex}\n.stufe .schritt i{font-style:normal;color:var(--muted);font-size:13px;line-height:1;\n  padding:3px 3px;border-radius:5px}\n.stufe .schritt i:hover{background:var(--rule);color:var(--accent)}\n.zeitblock .kalender{top:auto;bottom:0;left:calc(100% + 8px);transform:none;width:288px;\n  max-height:calc(100vh - 28px);overflow-y:auto}\n/* Eingeklappt bleibt nur die Zeitachse als drei Punkte stehen. */\n.rahmen.schmal .zeitblock .leisten-titel{display:none}\n.rahmen.schmal .stufen::before{left:50%}\n.rahmen.schmal .seitenleiste .stufe{justify-content:center;padding:5px 0}\n.rahmen.schmal .stufe .schritt{display:none}\n.rahmen.schmal .zeitblock .kalender{left:calc(100% + 8px)}\n\n.kopftitel{font-size:12.5px;color:var(--muted);letter-spacing:-.01em}\n\n/* ---- Verwaltungsseite (U-19) ---------------------------------------\n   Links das Register, rechts genau eine Sache. Das Register sieht\n   bewusst anders aus als die Hauptnavigation — es fuehrt innerhalb\n   einer Seite, nicht zwischen Bereichen.                              */\n.vw-seite{display:grid;grid-template-columns:236px 1fr;gap:26px;align-items:start}\n.vw-register{display:flex;flex-direction:column;gap:2px;position:sticky;top:0}\n.vw-register .leisten-titel{padding:0 0 9px}\n.vw-register button{\n  display:grid;grid-template-columns:1fr auto;gap:2px 10px;text-align:left;\n  background:none;border:none;border-left:2px solid transparent;border-radius:0 8px 8px 0;\n  padding:8px 12px;cursor:pointer;font-family:inherit;color:var(--muted);\n}\n.vw-register button .t{font-size:13px;font-weight:500}\n.vw-register button .z{font-size:11px;color:var(--muted);align-self:center}\n.vw-register button .e{grid-column:1/-1;font-size:11px;color:var(--muted);opacity:.75;line-height:1.35}\n.vw-register button:hover{background:var(--soft);color:var(--ink)}\n.vw-register button[aria-current=\"true\"]{background:var(--soft);border-left-color:var(--accent);color:var(--ink)}\n.vw-register button[aria-current=\"true\"] .t{font-weight:700}\n.vw-register button[aria-current=\"true\"] .z{color:var(--accent);font-weight:600}\n.vw-trenner{height:1px;background:var(--line);margin:10px 12px}\n\n.vw-kopf{display:flex;flex-wrap:wrap;align-items:baseline;gap:10px;margin-bottom:16px}\n.vw-kopf h2{font-size:19px;font-weight:600;letter-spacing:-.02em;width:100%}\n.vw-kopf .meldung{flex:1;min-width:220px}\n.vw-werkzeug{display:flex;gap:7px;margin-left:auto}\n.vw-karte.schmal{max-width:520px}\n/* .jahrliste und .jahrchip trugen die Budgetjahre als Marken. Mit U-22 hat\n   jeder Jahrgang einen Knopf, und eine Marke kann nichts ausloesen — die\n   Klassen werden von nirgends mehr gerufen (Quelltext und Pruefstaende\n   nachgesehen) und sind am 18.08.2026 entfernt. Ersatz: .jahrzeile weiter\n   unten. Zwei Bauplaene fuer dieselbe Liste heissen, dass eine Aenderung\n   an der falschen landen kann. */\n\n/* ---- Der Baum: Konto traegt Kategorie traegt Position ---------------\n   Alle drei Ebenen teilen dasselbe Spaltenraster — die Einrueckung\n   entsteht im Namensfeld, nicht durch verschobenes Polster. Sonst\n   stehen Soll-Betrag und Positionszahl nicht untereinander.         */\n.baum{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}\n.knoten{display:grid;align-items:center;gap:12px;padding:0 var(--pad);position:relative;\n  grid-template-columns:24px 30px 1fr 160px 170px 210px;min-height:34px}\n.knoten .auf{background:none;border:none;color:var(--accent);cursor:pointer;font-size:10px;padding:4px;\n  grid-column:1;justify-self:start}\n.knoten .auf[aria-expanded=\"false\"] .chev{display:inline-block;transform:rotate(-90deg)}\n.knoten .nr{grid-column:2;font-size:11px;color:var(--muted)}\n.knoten .name{grid-column:3;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}\n.knoten .rolle{grid-column:4;font-size:11.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}\n.knoten .zahl{grid-column:5;font-size:11.5px;color:var(--muted);text-align:right}\n/* U-22: Die Werkzeuge liegen jetzt UEBER der Zeile statt in einer Spalte.\n   Vier Knoepfe (umbenennen, ab-Jahr, ganz, loeschen) passen in keine\n   Spaltenbreite, die den Namen noch lesbar liesse — und schon die drei\n   davor schoben sich in die Positionszahl hinein, weil ein Rasterfeld\n   seinen Inhalt nicht zurechtstutzt. Der eigene Hintergrund deckt ab, was\n   darunter liegt; sichtbar ist der Streifen ohnehin nur auf der Zeile, auf\n   der der Zeiger oder der Fokus steht.\n   :focus-within stand hier bisher nicht — wer mit der Tastatur durch den\n   Baum ging, landete auf Knoepfen, die er nicht sehen konnte.\n   Die sechste Rasterspalte bleibt als Platzhalter stehen: sie haelt die\n   Positionszahl dort, wo sie ohne Zeiger auch steht — ohne sie wanderten\n   Zahlungsweg und Zahl an den rechten Rand und der Name zoege sich in die\n   Breite. */\n.knoten .zw{display:flex;gap:6px;justify-content:flex-end;align-items:center;opacity:0;\n  position:absolute;right:var(--pad);top:1px;bottom:1px;padding-left:18px;background:var(--soft)}\n.knoten:hover .zw,.knoten:focus-within .zw{opacity:1}\n.knoten:hover,.knoten:focus-within{background:var(--soft)}\n\n.knoten.n1{background:var(--soft);min-height:40px;border-top:1px solid var(--rule)}\n.knoten.n1 .name{font-weight:700;font-size:13.5px}\n.ast.konto:first-child .knoten.n1{border-top:none}\n\n/* Ebene 2: der Klappknopf rutscht eine Spalte nach rechts, der Name bekommt Einzug. */\n.knoten.n2{border-top:1px solid var(--hairline)}\n.knoten.n2 .auf{grid-column:2}\n.knoten.n2 .name{font-weight:600;color:var(--ink);padding-left:14px}\n\n/* Ebene 3: kein Knopf, nur Einzug — und eine Linie, die zeigt, wo sie haengt. */\n.knoten.n3{border-top:1px solid var(--hairline)}\n.knoten.n3 .name{padding-left:30px}\n.knoten.n3::before{content:'';position:absolute;left:calc(var(--pad) + 60px);top:0;bottom:0;\n  width:1px;background:var(--line)}\n.knoten.n3.leer{min-height:30px}\n.knoten.n3.leer .meldung{grid-column:3;padding-left:30px}\n.knoten.aus .name,.ast.aus > .knoten .name{color:var(--muted);text-decoration:line-through}\n\n/* Eingeklappt: nur die Zeichen, der Rest weicht. */\n.rahmen.schmal .seitenleiste{width:56px}\n.rahmen.schmal .seitenleiste .tx,.rahmen.schmal .seiten-kopf .marke{display:none}\n.rahmen.schmal .seiten-kopf{justify-content:center;padding:2px 0 12px}\n.rahmen.schmal .falten{transform:rotate(180deg)}\n.rahmen.schmal .bereiche > button,.rahmen.schmal .seiten-fuss > button{justify-content:center;padding:8px 0;gap:0}\n\n/* Kennzahlen wandern in die Kopfzeile — die eigene Karte im Inhalt\n   entfaellt damit in der Tabellenansicht (93 px gewonnen).            */\n/* ---- Dashboard (U-5) -----------------------------------------------\n   Oben zwei Karten nebeneinander: die eine sagt, was heute geht, die\n   andere, warum. Darunter Kacheln im gleichen Raster wie ueberall. */\n/* Beide Karten gleich breit — die Kante zwischen ihnen fluchtet mit der\n   Mitte der Kachelreihe darunter. Ungleiche Breiten sahen aus, als haette\n   die eine mehr zu sagen als die andere; sie sagen aber dasselbe, nur von\n   zwei Seiten (U-14). */\n.dash-oben{display:grid;grid-template-columns:1fr 1fr;gap:var(--gap);margin-bottom:26px;align-items:stretch}\n.dash-oben > .karte{min-width:0}\n.karte.hero{padding:16px var(--pad) 14px;display:flex;flex-direction:column;gap:12px;cursor:pointer}\n.karte.hero:hover{border-color:var(--accent)}\n.hero-zahl{display:flex;align-items:flex-end;gap:16px}\n.hero-zahl .riesig{font-family:'IBM Plex Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums;\n  font-size:58px;line-height:.95;font-weight:500;letter-spacing:-.02em}\n.hero-zu{font-size:12.5px;color:var(--muted);line-height:1.45;padding-bottom:5px}\n.hero-zu b{color:var(--ink);font-weight:600}\n.zyklus{height:4px;background:var(--soft);border-radius:3px;overflow:hidden}\n.zyklus > div{height:100%;background:var(--accent);opacity:.65}\n.hero-fuss{display:flex;gap:34px;border-top:1px solid var(--line);padding-top:11px}\n.hero-fuss .k{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}\n.hero-fuss .gross2{font-size:17px;display:block;margin-top:1px}\n.karte.rechenweg{padding:16px var(--pad) 14px;display:flex;flex-direction:column;gap:10px}\n.karte.rechenweg .kennung{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}\n.rechnung{display:flex;flex-direction:column;justify-content:center;flex:1}\n.rechnung .zeile{display:flex;justify-content:space-between;gap:16px;font-size:12.5px;padding:3px 0;color:var(--muted)}\n.rechnung .zeile.ergebnis{color:var(--ink);border-top:1px solid var(--line);margin-top:5px;padding-top:7px;font-weight:600}\n.rechnung .zeile.teiler{color:var(--accent);border-top:1px dashed var(--rule);margin-top:5px;padding-top:7px;font-weight:600}\n.kachel.kpi .spark{display:block;width:100%;height:34px;margin-top:9px;overflow:visible}\n.kachel.kpi .spark polyline{fill:none;stroke:var(--accent);stroke-width:1.6;stroke-linejoin:round;vector-effect:non-scaling-stroke}\n.kachel.kpi .spark circle{fill:var(--accent)}\n.kachel.kpi.warnung{border-color:#5a4433}\n.kachel.kpi.warnung .spark polyline{stroke:var(--open)}\n.kachel.kpi.warnung .spark circle{fill:var(--open)}\n.kachel.kpi.frist.nah .kennung{color:var(--open)}\n.kachel.kpi.frist.nah{border-color:#54452f}\n.kachel.kpi.frist.nah .fuss .meta{color:var(--open)}\n@media (max-width:1000px){ .dash-oben{grid-template-columns:1fr} }\n\n.kachel.kpi{cursor:pointer;gap:9px}\n.kachel.kpi .kennung{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.18em;\n  text-transform:uppercase;color:var(--muted);display:block;margin-bottom:2px}\n.kachel.kpi .name{background:none;border:none;color:var(--ink);font-family:inherit;font-size:14px;\n  font-weight:600;letter-spacing:-.015em;padding:0;text-align:left;cursor:pointer}\n.kachel.kpi .fuss{display:flex;align-items:center;gap:8px}\n.kachel.kpi .fuss .meta{flex:1;font-size:11.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}\n.kachel.kpi .fuss .pfeil{color:var(--muted);font-size:15px}\n.kachel.kpi:hover{border-color:var(--accent)}\n.kachel.kpi:hover .fuss .pfeil{color:var(--accent)}\n.herleitung-flaeche{border-top:1px solid var(--line);padding-top:11px}\n.herleitung-flaeche .zeile{display:flex;justify-content:space-between;gap:20px;font-size:12.5px;padding:1.5px 0;color:var(--muted)}\n.herleitung-flaeche .zeile.ergebnis{color:var(--ink);border-top:1px solid var(--line);margin-top:4px;padding-top:5px;font-weight:600}\ntable.klein.liste{width:100%;border-collapse:separate;border-spacing:0;font-size:12.5px}\ntable.klein.liste td{padding:7px 10px;border-bottom:1px solid var(--hairline)}\ntable.klein.liste td.n{text-align:right;font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums}\ntable.klein.liste tr{cursor:pointer}\ntable.klein.liste tr:hover td{background:var(--soft)}\n.liq .wert .v.gross{font-size:26px}\n.liq.dash{grid-template-columns:repeat(4,1fr);gap:20px}\n.liq.dash .wert .z{margin-top:4px}\n\n.kopfband{display:flex;gap:22px;align-items:center}\n.kopfband .wert{display:flex;align-items:baseline;gap:7px}\n.kopfband .wert .k{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}\n.kopfband .wert .v{font-size:15px}\n.kopfband .wert .z{font-size:11px;color:var(--muted)}\n@media (max-width:1100px){ .kopfband .wert.leise{display:none} }\n\n.inhalt{flex:1 1 auto;min-height:0;display:flex;flex-direction:column}\n/* Kacheln: die Seite rollt. Tabellen: die Seite steht, nur die Tabelle rollt. (A-15) */\n.inhalt[data-modus=\"kacheln\"]{overflow-y:auto;overflow-x:hidden;padding:var(--edge)}\n.inhalt[data-modus=\"tabellen\"]{overflow:hidden;padding:var(--edge) var(--edge) 0}\n\n.fusszeile{flex:0 0 auto;padding:9px var(--edge);border-top:1px solid var(--line);background:var(--card);display:flex;align-items:center;gap:14px}\n.motto{color:var(--accent);font-weight:600;letter-spacing:.03em;font-size:12.5px}\n.fusszeile .hinweis{color:var(--muted);font-size:11.5px;margin-left:auto}\n\n/* ===================================================================\n   KACHELN\n   =================================================================== */\n.liq-karte{margin-bottom:var(--gap)}\n.sektion{margin-bottom:26px}\n.sektion > h2{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin:0 0 10px;display:flex;align-items:center;gap:10px}\n.sektion > h2::after{content:'';flex:1;height:1px;background:var(--line);order:9}\n.sektion > h2 .h2-wert{color:var(--ink);letter-spacing:0;font-size:14px;font-weight:600}\n.sektion > h2 .h2-zu{color:var(--muted);letter-spacing:0;font-size:11.5px;text-transform:none;font-weight:400}\n.untertitel{font-size:12px;font-weight:500;color:var(--muted);margin:0 0 8px;display:flex;gap:10px;align-items:baseline}\n.untertitel .num{color:var(--err)}\n.raster{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:var(--gap)}\n\n/* ===================================================================\n   KACHEL — der geschlossene Zustand. Zeigt vier Dinge und sonst nichts.\n   Gearbeitet wird im Blatt, das aus der Kachel aufgeht.\n   Gleiche Anatomie fuer Konto, Schuld, Sparziel und Reserve. (G-1)\n   =================================================================== */\n.kachel{\n  padding:14px var(--pad) 12px;\n  display:flex;flex-direction:column;gap:11px;\n  cursor:pointer;transition:border-color .12s;\n}\n.kachel:hover{border-color:var(--rule)}\n.kachel .kennung{\n  font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.16em;\n  text-transform:uppercase;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;\n}\n.kachel .name{\n  display:block;background:none;border:none;padding:0;margin-top:2px;text-align:left;\n  font-family:inherit;font-weight:600;letter-spacing:-.015em;font-size:18px;line-height:1.25;\n  color:var(--ink);cursor:pointer;\n}\n.kachel .name:hover{color:var(--accent)}\n.kachel .name:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:4px}\n.kachel .rolle{font-size:12.5px;color:var(--muted);margin-top:1px;\n  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}\n.kachel .mitte{flex:1 1 auto}\n.kachel .mitte .balken{margin-top:10px}\n.kachel .fuss{\n  display:flex;align-items:center;justify-content:space-between;gap:10px;\n  border-top:1px solid var(--line);padding-top:10px;\n}\n.kachel .fuss .meta{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}\n\n.liq{display:grid;grid-template-columns:repeat(3,auto) 1fr;gap:34px;align-items:start}\n.liq .herleitung{border-left:1px solid var(--line);padding-left:18px}\n.liq .herleitung .zeile{display:flex;justify-content:space-between;gap:20px;font-size:12.5px;padding:1.5px 0;color:var(--muted)}\n.liq .herleitung .zeile.ergebnis{color:var(--ink);border-top:1px solid var(--line);margin-top:4px;padding-top:5px;font-weight:600}\n.liq-schmal{display:flex;gap:30px;align-items:center;padding:11px var(--pad);flex:0 0 auto;margin-bottom:var(--gap)}\n.liq-schmal .wert .v{font-size:17px}\n\n/* Masken */\n.maske{display:grid;grid-template-columns:1fr 1fr;gap:9px}\n.maske .voll{grid-column:1/-1}\n.feld{display:flex;flex-direction:column;gap:3px}\n.feld label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}\n.feld input,.feld select,.feld textarea{\n  background:var(--bg);border:1px solid var(--line);border-radius:var(--radius-sm);color:var(--ink);\n  padding:7px 9px;font-family:inherit;font-size:13px;width:100%;\n}\n.feld input.num{font-family:'IBM Plex Mono',monospace;text-align:right}\n.feld input:focus,.feld select:focus{outline:none;border-color:var(--accent)}\n.feld > .schalter{align-self:flex-start}\n.feld.haken{flex-direction:row;align-items:center;gap:8px}\n.feld.haken input{width:auto;accent-color:var(--accent)}\n.feld.haken label{text-transform:none;letter-spacing:0;font-size:12.5px;color:var(--ink)}\n.wk-block{border-left:2px solid var(--line);padding-left:12px;margin-top:2px}\n.maske .aktion{grid-column:1/-1;display:flex;gap:8px;align-items:center;margin-top:3px}\n.maske .hint{font-size:11.5px;color:var(--muted);margin-left:auto;text-align:right}\n\n/* Journal */\n.journal{width:100%;border-collapse:collapse;font-size:12.5px}\n.journal th{text-align:left;font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:500;padding:0 6px 6px;border-bottom:1px solid var(--line)}\n.journal th.r,.journal td.r{text-align:right}\n.journal td{padding:5px 6px;border-bottom:1px solid var(--line)}\n.journal tr:last-child td{border-bottom:none}\n.journal tbody tr[data-jz]{cursor:pointer}\n.journal tbody tr:hover{background:var(--soft)}\n.journal .tag{font-family:'IBM Plex Mono',monospace;color:var(--muted);font-size:12px}\n.journal .marke-um{font-size:11px;color:var(--muted);margin-left:6px}\n.journal .jz-in{background:var(--bg);border:1px solid var(--accent);border-radius:5px;color:var(--ink);font-family:inherit;font-size:12.5px;padding:2px 5px;width:100%}\n.verlauf{height:150px;width:100%}\n\n/* ===================================================================\n   TABELLEN\n   =================================================================== */\n.tabellenkopf{display:flex;align-items:flex-end;gap:20px;flex:0 0 auto;margin-bottom:var(--gap)}\n.tafel{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;position:relative}\n.tafel-kopf{display:flex;align-items:center;gap:10px;padding:13px var(--pad) 0;flex:0 0 auto}\n.tafel-kopf .titel{font-size:15px;font-weight:600;letter-spacing:-.015em;margin-right:auto}\n.tafel > .filterzeile{padding:11px var(--pad) 10px;flex:0 0 auto}\n.rollflaeche{flex:1 1 auto;min-height:0;overflow:auto;border-radius:0 0 var(--radius) var(--radius)}\n\ntable.gross{border-collapse:separate;border-spacing:0;width:max-content;min-width:100%;font-size:12.5px}\n/* U-4: die Streckung uebernimmt jetzt spaltenbreiten() */\ntable.gross th,table.gross td{padding:0 8px;height:var(--row);white-space:nowrap}\ntable.gross .n{text-align:right;font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;font-size:12px}\ntable.gross .t{text-align:left}\ntable.gross th.n,table.gross td.n,table.gross td.bearbeitbar{min-width:78px;max-width:78px}\ntable.gross th:last-child,table.gross td:last-child{min-width:94px;max-width:94px}\n\n/* Kopfzeilen gestapelt und fixiert — bis und mit «Saldo kumuliert» (A-36) */\ntable.gross thead th,table.gross thead td{position:sticky;background:var(--sheet);z-index:20}\ntable.gross thead tr.zeile-titel th{top:0;height:38px;font-weight:600;text-align:left;letter-spacing:-.01em;border-bottom:1px solid var(--rule)}\ntable.gross thead tr.zeile-titel th.n{text-align:right;font-weight:500;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.05em}\ntable.gross thead tr.zeile-titel th.t{font-weight:500;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.05em}\ntable.gross thead tr.zeile-saldo td{top:38px;color:var(--muted);font-size:11.5px}\ntable.gross thead tr.zeile-auswahl td{top:90px}\ntable.gross thead tr.zeile-kum td{top:64px;color:var(--muted);font-size:11.5px;font-weight:600}\n/* Die Antwort auf «wie viel habe ich dann» — die lauteste Zeile im Kopf. */\ntable.gross thead tr.zeile-frei td{top:98px;color:var(--ink);font-size:12.5px;font-weight:700;\n  box-shadow:inset 0 -2px 0 var(--rule)}\ntable.gross thead tr.zeile-frei td:first-child{letter-spacing:-.01em}\n\n/* Fixierte Spalten: Bezeichnung, Zahlung, Soll bleiben beim Rollen nach rechts stehen (A-36).\n   Frueher waren es fuenf — Fällig und Zahlungsart sind zu einer Spalte verschmolzen,\n   das Konto steht nur noch einmal im Kategoriekopf. */\ntable.fixiert th:nth-child(-n+3),table.fixiert td:nth-child(-n+3){position:sticky;background:var(--card);z-index:15}\ntable.fixiert thead th:nth-child(-n+3),table.fixiert thead td:nth-child(-n+3){background:var(--sheet);z-index:30}\ntable.fixiert th:nth-child(1),table.fixiert td:nth-child(1){left:0;                          min-width:var(--w1);max-width:var(--w1)}\ntable.fixiert th:nth-child(2),table.fixiert td:nth-child(2){left:var(--w1);                  min-width:var(--w2);max-width:var(--w2)}\ntable.fixiert th:nth-child(3),table.fixiert td:nth-child(3){left:calc(var(--w1) + var(--w2));min-width:var(--w3);max-width:var(--w3);\n  border-right:1px solid var(--rule)}\ntable.fixiert tbody td:nth-child(-n+2){overflow:hidden;text-overflow:ellipsis}\n.t-verbind{--w2:96px;--w3:78px}\n/* Rechnungen passen ohne Rollen — hier fixiert nichts, sonst reisst die Tabelle auseinander. */\n.t-rechnung th.n,.t-rechnung td.n{min-width:98px;max-width:98px}\n.t-rechnung th:last-child,.t-rechnung td:last-child{min-width:130px;max-width:130px}\n\n/* ---- Zeilentypen und ihr Rang ----------------------------------------\n   Die Masse ist leise, die drei Merkpunkte sind laut:\n   der Name (Anker), das Soll (Referenz), die Jahresspalte (Ergebnis).\n   Dazwischen darf das Auge ausruhen.                                     */\ntr.zeile-daten > td{border-bottom:1px solid var(--hairline)}\ntable.gross tr.zeile-daten:hover > td{background:var(--soft)}\ntr.zeile-daten td.n,tr.zeile-daten td.bearbeitbar input{color:var(--muted)}\ntr.zeile-daten td:nth-child(3),tr.zeile-daten td:nth-child(3) input,\ntr.zeile-daten td:last-child{color:var(--ink)}\ntr.zeile-daten:hover td.n,tr.zeile-daten:hover td.bearbeitbar input{color:var(--ink)}\ntd.bearbeitbar input:focus{color:var(--ink)}\ntd.zahlung{font-size:11.5px;color:var(--muted)}\n\ntr.zeile-kat > td{background:var(--soft);font-weight:600;letter-spacing:-.01em;\n  border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}\ntr.zeile-sub > td{background:#1b2531;font-weight:600;font-size:12px;\n  border-top:1px solid var(--rule);border-bottom:1px solid var(--hairline)}\ntr.zeile-sub td.n{color:var(--muted)}\ntr.zeile-summe > td{border-top:1px solid var(--rule);font-weight:600;font-size:12px}\ntr.zeile-summe > td:first-child{padding-left:24px;color:var(--muted)}\ntr.zeile-gesamt > td{border-top:2px solid var(--accent);font-weight:700;height:36px}\ntr.zeile-daten td:first-child{padding-left:24px}\ntr.zeile-daten.tief td:first-child{padding-left:38px}\n/* Luft vor jeder Gruppe — sonst kleben Kategorie, Zeilen und Summe aneinander */\ntr.zeile-luft > td{height:13px;padding:0}\ntr.zugeklappt{display:none}\ntd.klappzelle{position:relative;padding-left:12px}\ntd.namenszelle{position:relative}\ntd.namenszelle .nz{display:block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}\n\n/* Die Spalte des laufenden Monats — angedeutet, nicht angestrichen.\n   Ueber sechzig Zeilen wird aus einem kraeftigen Block sonst ein Balken. */\ntable.gross th.jetzt,table.gross td.jetzt{background:#16212a}\ntr.zeile-kat > td.jetzt{background:#1e2e33}\ntr.zeile-sub > td.jetzt{background:#1c2a30}\ntable.gross tr.zeile-daten:hover > td.jetzt{background:#22323a}\ntable.gross thead th.jetzt,table.gross thead td.jetzt{background:#17232b;color:var(--accent)}\n\n/* Zeilenwerkzeuge: da, wo sie wirken — sichtbar, sobald der Zeiger\n   oder der Fokus die Zeile erreicht. Gleiche Regel fuer beide. */\n.kat-add,.zeile-weg{\n  position:absolute;right:9px;top:50%;transform:translateY(-50%);\n  background:var(--card);border:1px solid var(--line);border-radius:5px;color:var(--muted);\n  cursor:pointer;font-family:inherit;font-size:10.5px;padding:2px 8px;opacity:0;\n}\n.kat-add:hover,.zeile-weg:hover{color:var(--accent);border-color:var(--accent)}\ntr.zeile-daten:hover .zeile-weg,.zeile-weg:focus,\ntr.zeile-kat:hover .kat-add,tr.zeile-sub:hover .kat-add,.kat-add:focus{opacity:1}\n\n/* ---- U-28: der Griff zum Umordnen -----------------------------------\n   Dieselbe Regel wie beim Ausblenden-Knopf daneben: unsichtbar, bis der\n   Zeiger oder der Fokus die Zeile erreicht. Er sitzt links im Polster\n   der Namensspalte — dort ist Platz, den nichts anderes braucht, und er\n   ist der Ort, an dem eine Greifleiste erwartet wird.\n   Gezeichnet wird er aus einem Verlauf statt aus einem Schriftzeichen:\n   ein Braille- oder Punktezeichen haengt an der Schrift, und in dieser\n   App ist die Schrift eine geladene. Drei Striche sind drei Striche. */\n.zeilengriff{\n  position:absolute;left:5px;top:50%;transform:translateY(-50%);\n  width:15px;height:17px;border:1px solid transparent;border-radius:4px;\n  cursor:grab;opacity:0;display:block;\n}\n.zeilengriff::before{\n  content:'';position:absolute;left:3px;right:3px;top:4px;height:7px;\n  background:repeating-linear-gradient(to bottom,var(--muted) 0 1px,transparent 1px 3px);\n}\n.zeilengriff:hover{border-color:var(--accent)}\n.zeilengriff:hover::before{background:repeating-linear-gradient(to bottom,var(--accent) 0 1px,transparent 1px 3px)}\n.zeilengriff:focus{opacity:1;outline:1px solid var(--accent);outline-offset:1px}\ntr.zeile-daten:hover .zeilengriff{opacity:1}\n/* Im Baum gibt es keine Polsterspalte — der Griff steht rechts der\n   Fuehrungslinie, im Einzug des Namens, und damit an derselben Stelle\n   relativ zur Position wie in der Tabelle. */\n.zeilengriff.imbaum{left:calc(var(--pad) + 66px);width:14px;height:16px}\n.knoten.n3:hover .zeilengriff{opacity:1}\n\n/* Beim Ziehen: die genommene Zeile tritt zurueck, die Ziellinie sagt, wo\n   sie landet. Die Linie ist ein Innenschatten und KEIN Rahmen — ein\n   Rahmen wuerde die Zeile um zwei Pixel hoeher machen, und die Tabelle\n   zappelte bei jedem Wechsel des Ziels. */\nbody.zieht-zeile,body.zieht-zeile *{cursor:grabbing !important;user-select:none}\ntr.zeile-daten.zieht-mich > td,.knoten.n3.zieht-mich{opacity:.45}\ntr.zeile-daten.zieh-vor > td{box-shadow:inset 0 2px 0 0 var(--accent)}\ntr.zeile-daten.zieh-nach > td{box-shadow:inset 0 -2px 0 0 var(--accent)}\n.knoten.n3.zieh-vor{box-shadow:inset 0 2px 0 0 var(--accent)}\n.knoten.n3.zieh-nach{box-shadow:inset 0 -2px 0 0 var(--accent)}\n\n/* Zellen */\ntd.bearbeitbar{padding:0;position:relative}\ntd.bearbeitbar input{\n  width:100%;height:100%;background:none;border:none;color:inherit;\n  font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;font-size:12px;\n  text-align:right;padding:0 8px;\n}\ntd.bearbeitbar input:focus{outline:1px solid var(--accent);outline-offset:-1px;background:var(--bg)}\n/* U-11: Der Platzhalter «0.00» stand frueher in jeder leeren Zelle und war\n   Rauschen. Ganz weg war er aber auch falsch — dann sieht man einem leeren\n   Feld nicht mehr an, dass es eines ist. Jetzt erscheint er, sobald Zeiger\n   oder Fokus die Zeile erreichen: ruhig im Ueberblick, sichtbar beim Arbeiten. */\ntd.bearbeitbar input::placeholder{color:transparent}\ntr:hover td.bearbeitbar input::placeholder,\ntd.bearbeitbar input:focus::placeholder{color:#4a4a4a}\ntr:hover td.bearbeitbar{box-shadow:inset 0 0 0 1px var(--rule)}\ntr:hover td.bearbeitbar:hover{box-shadow:inset 0 0 0 1px var(--muted)}\n/* Ein gespiegeltes Soll sieht anders aus als ein gepflegtes — sonst\n   sucht man die Eingabestelle dort, wo es keine gibt (U-8). */\ntd.n.gespiegelt-wert{font-style:italic;color:var(--muted);cursor:help}\n.klappkopf{max-width:calc(var(--w1) - 46px)}\ntd.markiert{box-shadow:inset 0 0 0 1px var(--accent)}\n\n/* ---- Gefaltete Spalten (U-2) ---------------------------------------\n   Kein Loch, sondern eine schmale Klappe: sie zeigt, dass dort etwas\n   liegt, und macht mit einem Klick wieder auf.                        */\nth.faltkopf{cursor:pointer;background:var(--soft) !important;border-left:1px solid var(--rule);border-right:1px solid var(--rule)}\nth.faltkopf span{\n  display:block;writing-mode:vertical-rl;transform:rotate(180deg);\n  font-size:8.5px;letter-spacing:0;color:var(--muted);text-transform:uppercase;\n  margin:0 auto;line-height:28px;height:38px;overflow:hidden;\n}\nth.faltkopf:hover span{color:var(--accent)}\ntd.faltzelle{background:rgba(255,255,255,.014)}\n\n/* ---- Gefaltete Zeilen (U-23) ----------------------------------------\n   Waagrecht dasselbe Bild wie die Faltspalte senkrecht: eine schmale,\n   leise Klappe, die zeigt, dass dort etwas liegt. Sie steht bewusst\n   niedriger als eine Datenzeile — was sie verbirgt, ist nichts.       */\ntr.zeile-leerfalt > td{height:24px;background:rgba(255,255,255,.014);\n  border-bottom:1px solid var(--hairline)}\ntr.zeile-leerfalt > td:first-child{padding-left:24px}\n.leerfalt{background:none;border:none;border-radius:5px;color:var(--muted);cursor:pointer;\n  font-family:inherit;font-size:11px;padding:2px 7px;max-width:100%;overflow:hidden;\n  text-overflow:ellipsis;white-space:nowrap;text-align:left}\n.leerfalt::before{content:'▸ ';color:var(--rule)}\n.leerfalt:hover{color:var(--accent);background:var(--soft)}\ntr.zeile-kat > td.faltzelle,tr.zeile-sub > td.faltzelle{background:rgba(255,255,255,.03)}\n\n/* ---- Lesehilfe ueber viele Spalten (U-3) ---------------------------\n   Bei dreizehn Zahlenspalten verliert das Auge die Zeile. Ein sehr\n   leiser Streifen alle zwei Zeilen fuehrt es zurueck, ohne ein Gitter\n   zu bauen. Die Kopfzeilen bleiben schmaler als die Datenzeilen.      */\ntr.zeile-daten.gerade > td{background:rgba(255,255,255,.026)}\ntable.gross tr.zeile-daten.gerade:hover > td{background:var(--soft)}\ntr.zeile-daten.gerade > td.jetzt{background:#2f2b25}\ntable.gross thead tr.zeile-saldo td,table.gross thead tr.zeile-kum td{height:26px}\ntable.gross thead tr.zeile-kum td{box-shadow:inset 0 -2px 0 var(--rule)}\n/* U-12: Ist eine Auswahl aktiv, steht ihre Summe direkt unter den Salden.\n   Wer einen Wert tippt, sieht beide sofort mitgehen — das ist der Zweck\n   des Filters, nicht das Ausblenden. */\ntable.gross thead tr.zeile-auswahl td{height:28px;color:var(--accent);font-weight:700;font-size:12px;\n  box-shadow:inset 0 -2px 0 var(--accent)}\ntable.gross thead tr.zeile-auswahl td:first-child{letter-spacing:-.01em}\ntable.gross thead tr.zeile-auswahl td .muted{font-weight:400;font-size:10.5px;margin-left:7px;color:var(--muted)}\n/* Der Zahlungsweg steht ab hier nur noch klein unter der Bezeichnung,\n   sobald die eigene Spalte zu teuer wird. */\ntd.namenszelle .weg{display:none;font-size:10.5px;color:var(--muted);margin-left:7px}\n\n.kopfwerkzeug{display:inline-flex;position:relative}\n/* Die Kategorien liegen als Klappe ueber der Tafel, statt eine eigene\n   Zeile zu belegen (45 px gewonnen). */\n.tafel > .filterzeile{position:absolute;top:44px;left:var(--pad);right:var(--pad);z-index:40;\n  background:var(--sheet);border:1px solid var(--rule);border-radius:var(--radius-sm);\n  box-shadow:0 18px 44px -14px rgba(0,0,0,.85);padding:10px 12px}\n.sprung{\n  position:absolute;top:calc(100% + 5px);right:0;width:236px;max-height:330px;overflow-y:auto;\n  background:var(--sheet);border:1px solid var(--rule);border-radius:var(--radius-sm);\n  box-shadow:0 18px 44px -14px rgba(0,0,0,.85);z-index:70;padding:5px;\n}\n.sprung button{display:block;width:100%;text-align:left;background:none;border:none;color:var(--muted);padding:6px 9px;cursor:pointer;font-family:inherit;font-size:12px;border-radius:6px}\n.sprung button:hover{background:var(--soft);color:var(--ink)}\n.sprung button.unter{padding-left:22px;font-size:11.5px}\n\n/* ===================================================================\n   BLATT\n   =================================================================== */\n/* U-17 */\n.dialog-hg{position:fixed;inset:0;background:rgba(0,0,0,.62);z-index:120;display:flex;\n  align-items:center;justify-content:center;padding:24px}\n.dialog{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--radius);\n  width:100%;max-width:430px;box-shadow:0 30px 70px -20px #000}\n.dialog-kopf{padding:15px var(--pad) 0}\n.dialog-kopf h2{font-size:16px;font-weight:600;letter-spacing:-.015em}\n.dialog-koerper{padding:12px var(--pad) var(--pad);display:flex;flex-direction:column;gap:12px}\n.dialog-fuss{display:flex;gap:8px;justify-content:flex-end;padding:13px var(--pad);border-top:1px solid var(--line)}\n/* U-26: Die Dokumentzeile im Schuldblatt. Verweise sind Marken, kein\n   Fliesstext — sonst liest man ueber sie hinweg, und genau dort sucht\n   man sie, wenn man eine Zahlung erfasst.\n   U-27: Sie ist zum Wegweiser geworden. Gepflegt wird im Reiter, hier\n   steht nur noch, was da ist. */\n.dokzeile{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:9px;\n  padding-top:9px;border-top:1px solid var(--hairline)}\n.dokmarke{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}\n.dokchip{display:inline-flex;align-items:center;gap:2px;border:1px solid var(--rule);\n  border-radius:999px;padding:2px 4px 2px 11px;font-size:12px}\n.dokchip:hover{border-color:var(--accent)}\n.dokchip a{color:var(--ink);text-decoration:none}\n.dokchip a:hover{color:var(--accent)}\n.dokchip a::before{content:'↗';font-size:10px;color:var(--muted);margin-right:5px}\n.dokweg{background:none;border:none;color:var(--muted);cursor:pointer;font-size:13px;\n  line-height:1;padding:2px 5px;border-radius:999px}\n.dokweg:hover{color:var(--err);background:var(--soft)}\n.dokbelegmarke{font-size:11.5px;color:var(--muted);padding-left:9px;\n  border-left:2px solid var(--rule)}\n/* U-27 — der Reiter «Dokumente». Eine Liste, kein Marken-Gedraenge: hier ist\n   Platz, und wer hier steht, will die ganze Adresse sehen, nicht drei\n   abgeschnittene Chips nebeneinander. */\n.dokliste{display:flex;flex-direction:column;gap:0;margin:2px 0 0}\n.dokeintrag{display:flex;align-items:baseline;gap:10px;padding:9px 2px;\n  border-bottom:1px solid var(--hairline)}\n.dokeintrag:first-child{border-top:1px solid var(--hairline)}\n.dokeintrag .dokna{flex:1 1 auto;min-width:0}\n.dokeintrag .dokna b{font-size:13.5px;font-weight:600;display:block}\n.dokeintrag .dokadr{display:block;font-size:11.5px;color:var(--muted);\n  font-family:'IBM Plex Mono',monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}\n.dokeintrag .dokwerk{flex:0 0 auto;display:flex;gap:6px;align-items:center}\n/* Der abgelegte Beleg ist KEIN Verweis (siehe Kommentar bei dokReiterHtml).\n   Der Unterschied muss man sehen, nicht lesen: eigener Kasten, eigene\n   Marke, keine Zeile in der Verweisliste. */\n.dokbeleg{display:flex;align-items:baseline;gap:10px;margin:2px 0 16px;padding:11px 13px;\n  border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--soft)}\n.dokbeleg .dokna{flex:1 1 auto;min-width:0}\n.dokbeleg .dokna b{font-size:13.5px;font-weight:600;display:block}\n.dokbeleg .dokadr{display:block;font-size:11.5px;color:var(--muted)}\n.dokbeleg .dokwerk{flex:0 0 auto}\n.dokgruppe{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);\n  margin:18px 0 6px}\n.dokgruppe:first-child{margin-top:2px}\n/* Die Erfassung steht UNTER der Liste und ist immer offen — kein Knopf,\n   der erst ein Formular aufklappt. Zwei Felder rechtfertigen keinen Klick\n   davor, und ein aufgeklapptes Feld erinnert daran, dass man etwas\n   hinterlegen kann. */\n.dokneu{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap;margin-top:14px;\n  padding-top:13px;border-top:1px solid var(--line)}\n.dokneu .feldchen{display:flex;flex-direction:column;gap:4px}\n.dokneu .feldchen.breit{flex:1 1 260px;min-width:0}\n.dokneu label{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}\n.dokneu input{background:var(--bg);border:1px solid var(--rule);border-radius:var(--radius-sm);\n  color:var(--ink);font-family:inherit;font-size:12.5px;padding:7px 9px;width:100%}\n.dokneu input:focus{outline:none;border-color:var(--accent)}\n.dlg-lead{font-size:13px;color:var(--muted)}\n.dlg-lead b{color:var(--ink);font-size:15px}\n.dlg-zeile{display:flex;align-items:center;gap:12px;flex-wrap:wrap}\n.dlg-zeile .jahr{color:var(--muted);font-size:13px}\n.dlg-zeile label{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted)}\n.dlg-zeile select{background:var(--bg);border:1px solid var(--rule);border-radius:var(--radius-sm);\n  color:var(--ink);font-family:inherit;font-size:13px;padding:6px 9px;cursor:pointer}\n.dlg-zeile select:focus{outline:1px solid var(--accent);outline-offset:-1px}\n.dlg-haken{display:flex;align-items:flex-start;gap:9px;font-size:12.5px;color:var(--ink);\n  border-top:1px solid var(--line);padding-top:12px;cursor:pointer}\n.dlg-haken input{accent-color:var(--accent);margin-top:1px}\n/* U-22: die Aufstellung vor einer Kaskade. Sie steht als Liste da, nicht als\n   Satz — «3 Buchungen, 1 Rechnung, Budgetwerte in 4 Jahren» ueberliest man,\n   untereinander zaehlt man es. */\n.dlg-liste{list-style:none;display:flex;flex-direction:column;gap:3px;\n  border-left:2px solid var(--accent);padding-left:11px}\n.dlg-liste li{font-size:13px;color:var(--ink)}\n.dlg-warnung{font-size:12px;line-height:1.5;color:var(--err);\n  border-top:1px solid var(--line);padding-top:11px}\n.dlg-warnung b{font-weight:600}\n.blatt-hg{position:fixed;inset:0;background:rgba(0,0,0,.62);z-index:100;display:flex;align-items:center;justify-content:center;padding:30px}\n.blatt{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--radius);width:100%;max-width:780px;max-height:100%;display:flex;flex-direction:column;box-shadow:0 30px 70px -20px #000}\n.blatt.weit{max-width:940px}\n.blatt:focus{outline:none}\n.blatt .reiter button:focus-visible,.kachel .knopf:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:5px}\n.blatt-kopf{padding:15px var(--pad);border-bottom:1px solid var(--line)}\n.blatt-kopf.mitreiter{border-bottom:none;padding-bottom:9px}\n.blatt-kopf .kennung{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:3px}\n.blatt-kopf h2{font-size:16px;font-weight:600;letter-spacing:-.015em}\n.blatt-kopf.mitreiter h2{font-size:22px}\n.blatt > .reiter{padding:0 var(--pad);border-bottom:1px solid var(--line);gap:18px;flex:0 0 auto}\n.blatt-koerper{padding:var(--pad);overflow-y:auto}\n.blatt.weit .blatt-koerper{min-height:352px}\n.blatt .verlauf{height:300px}\n/* U-22: Das Zeilenblatt nimmt verlaufSvg() aus den Berichten, und die setzt\n   die Klasse `ber-verlauf` — die Regel darueber greift also NICHT. Gut so:\n   `ber-verlauf` traegt width:100%;height:auto und behaelt damit das\n   Seitenverhaeltnis des viewBox (720 : hoehe). Ohne Deckel waere die Kurve im\n   weiten Blatt hoeher als im schmalen, obwohl sie dieselben Zahlen zeigt;\n   bei 720px ist sie genau so hoch, wie der Aufruf es sagt. */\n.blatt .ber-verlauf{max-width:720px;margin-inline:auto}\n.blatt-fuss{display:flex;gap:8px;justify-content:flex-end;padding:13px var(--pad);border-top:1px solid var(--line)}\n\n.wahlliste{display:grid;gap:8px}\n.wahlliste label{display:flex;gap:11px;align-items:flex-start;padding:11px 13px;border:1px solid var(--line);border-radius:var(--radius-sm);cursor:pointer}\n.wahlliste label:hover{border-color:var(--rule);background:var(--soft)}\n.wahlliste input{margin-top:3px;accent-color:var(--accent)}\n.wahlliste .bez{font-weight:600;font-size:13.5px;display:block}\n.wahlliste .erl{font-size:12px;color:var(--muted);display:block}\n.ablegeflaeche{border:1px dashed var(--rule);border-radius:var(--radius);padding:26px;text-align:center;color:var(--muted);font-size:13px}\n.notiz{font-size:12px;color:var(--muted);line-height:1.55}\n.notiz b{color:var(--ink);font-weight:600}\n\n/* Auf schmalen Bildschirmen bleibt nur die Bezeichnung stehen — sonst sieht man keine Zahl (A-81) */\n@media (max-width:900px){\n  table.gross th:nth-child(n+2),table.gross td:nth-child(n+2){position:static;left:auto}\n  table.gross th:nth-child(1),table.gross td:nth-child(1){min-width:170px;max-width:170px;border-right:1px solid var(--rule)}\n  table.gross th:nth-child(3),table.gross td:nth-child(3){border-right:none}\n  /* Die beschreibende Spalte weicht — sonst steht am Anfang keine Zahl im Bild */\n  .t-budget th:nth-child(2),.t-budget td:nth-child(2),\n  .t-verbind th:nth-child(2),.t-verbind td:nth-child(2){display:none}\n  /* Auf dem Telefon wird gelesen, nicht umgebaut */\n  .kat-add,.zeile-weg,.zeilengriff{display:none}\n  .klappkopf{max-width:150px}\n}\n.journal tbody tr[data-jz]:focus{outline:1px solid var(--accent);outline-offset:-2px}\n.zeitwahl .pfeil:disabled{cursor:default}\n.zeitwahl .pfeil:disabled:hover{background:none;border-color:transparent;color:var(--muted)}\n\n@media (max-width:760px){\n  .liq{grid-template-columns:1fr 1fr;gap:16px}\n  .liq .herleitung{grid-column:1/-1;border-left:none;border-top:1px solid var(--line);padding:12px 0 0}\n  .raster{grid-template-columns:1fr}\n  .kopfzeile{flex-wrap:wrap;gap:10px}\n  .maske{grid-template-columns:1fr}\n  .blatt-hg{padding:12px}\n  .blatt.weit .blatt-koerper{min-height:0}\n  .blatt-kopf.mitreiter h2{font-size:19px}\n}\n\n/* ===================================================================\n   GAEPP — Ergaenzungen zum Mockup-CSS.\n   Alles hier folgt einer Festlegung der Formensprache, die im Mockup\n   noch nicht gebaut ist. Keine neuen Formen, nur neue Anwendungen.\n   =================================================================== */\n\n/* --- Sync-Element in der Bedienleiste (A-09, A-95, Formensprache E) ---\n   Statuspunkt + Zahnrad. Der Punkt ist Zustandsanzeige, kein Bedienelement. */\n.sync{display:inline-flex;align-items:center;gap:9px;margin-left:2px}\n.sync .punkt{width:9px;height:9px;border-radius:50%;background:var(--muted);flex:0 0 auto}\n.sync .punkt[data-st=\"off\"]{background:var(--rule)}\n/* Lokal ist ein gueltiger Betriebszustand, kein Fehler — deshalb ein ruhiger Punkt. */\n.sync .punkt[data-st=\"lokal\"]{background:var(--muted)}\n.sync .punkt[data-st=\"busy\"]{background:var(--open)}\n.sync .punkt[data-st=\"ok\"]{background:var(--ok)}\n.sync .punkt[data-st=\"err\"]{background:var(--err)}\n.sync .txt{font-size:11.5px;color:var(--muted);white-space:nowrap}\n.sync .zahnrad{background:none;border:1px solid var(--rule);border-radius:var(--radius-sm);\n  color:var(--muted);cursor:pointer;font-size:14px;line-height:1;padding:5px 9px}\n.sync .zahnrad:hover{color:var(--ink);background:var(--soft)}\n\n/* --- Etikett «ueberzogen» (Formensprache C) — Zustandsanzeige, kein Knopf --- */\n.etikett{display:inline-block;margin-left:9px;padding:1px 7px;border-radius:5px;\n  background:var(--soft);color:var(--err);font-size:11px;font-weight:500;vertical-align:middle}\n\n/* --- Meldungen und Hinweise sind Werte (Form 5), kein eigenes Bauteil --- */\n.meldung{font-size:12px;color:var(--muted);line-height:1.5}\n.meldung.fehler{color:var(--err)}\n.meldung.offen{color:var(--open)}\n.kopfmeldung{padding:7px var(--edge);background:var(--soft);border-bottom:1px solid var(--line);\n  color:var(--err);font-size:12.5px;flex:0 0 auto}\n\n/* --- Vorschlagszeile aus einer Serie (E-8, Formensprache B) ---\n   Unterscheidet sich von einer echten Buchung allein durch die Farbe. */\n.journal tr.vorschlag td,.journal tr.vorschlag td .tag{color:var(--open)}\n.journal .zwerk{opacity:0;display:inline-flex;gap:5px}\n.journal tr:hover .zwerk,.journal tr:focus-within .zwerk{opacity:1}\n\n/* --- Gespiegelte Tabellenzeile (E-9, Formensprache B/H) ---\n   Faellt um einen Rang: durchgehend --muted, kein Aufhellen bei Hover,\n   dafuer die Bezeichnung in Akzent — «das hier fuehrt woandershin». */\ntr.zeile-daten.gespiegelt td,\ntr.zeile-daten.gespiegelt td:nth-child(3),\ntr.zeile-daten.gespiegelt td:last-child{color:var(--muted)}\ntable.gross tr.zeile-daten.gespiegelt:hover td.n{color:var(--muted)}\n/* U-22: Seit dem Zeilenblatt fuehrt JEDER Name irgendwohin, nicht nur der\n   einer gespiegelten Zeile — der Zeiger sagt das jetzt auch dort. */\ntd.namenszelle .nz{cursor:pointer}\ntr.zeile-daten:hover .nz{color:var(--accent)}\n\n/* --- Bankabgleich in der Fusszeile des Blatts (A-87, Formensprache D) --- */\n.abgleich{display:flex;align-items:flex-end;gap:12px;margin-right:auto}\n.blatt-fuss{align-items:center}\n.abgleich .feld{width:132px}\n.abgleich .diff{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;\n  font-size:13px;padding-bottom:8px;color:var(--ink)}\n.abgleich .diff.ab{color:var(--err)}\n.abgleich .lab{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;\n  padding-bottom:9px}\n\n/* --- Verwaltung: Karten, keine Formularlisten (A-10) --- */\n.vw-raster{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:var(--gap);align-items:start}\n.vw-karte{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:var(--pad)}\n.vw-karte h3{font-size:13px;font-weight:600;letter-spacing:-.01em;margin-bottom:10px;\n  display:flex;align-items:center;gap:8px}\n.vw-karte h3 .knopf{margin-left:auto}\n/* U-18: Als Modal brauchten die Listen ein eigenes Rollfenster. Auf einer\n   Seite, die selbst rollt, ist das eine Falle — man uebersieht, dass die\n   Liste weitergeht. Sie stehen jetzt ganz da. */\n.vw-liste{display:flex;flex-direction:column;gap:1px}\n.vw-liste .z{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--hairline);\n  font-size:12.5px}\n.vw-liste .z:last-child{border-bottom:none}\n.vw-liste .z .n{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}\n.vw-liste .z .zw{opacity:0;display:inline-flex;gap:5px}\n.vw-liste .z:hover .zw,.vw-liste .z:focus-within .zw{opacity:1}\n.vw-liste .z.aus .n{color:var(--muted)}\n/* U-22: Ein Budgetjahr ist keine Marke mehr, sondern eine Zeile mit einem\n   Knopf — ein Chip kann nichts ausloesen. */\n.jahrzeile{display:flex;align-items:center;gap:10px;padding:6px 0;\n  border-bottom:1px solid var(--hairline);font-size:12.5px}\n.jahrzeile:last-child{border-bottom:none}\n.jahrzeile .j{font-family:'IBM Plex Mono',monospace;font-size:13px;width:52px}\n.jahrzeile.jetzt .j{color:var(--accent);font-weight:600}\n.jahrzeile .e{flex:1;color:var(--muted);font-size:12px}\n.jahrzeile .zw{opacity:0}\n.jahrzeile:hover .zw,.jahrzeile:focus-within .zw{opacity:1}\n\n/* U-22: Dokumentlinks eines Glaeubigers — Bezeichnung, Adresse, weg damit. */\n.doks{display:flex;flex-direction:column;gap:5px}\n.doks .dok{display:flex;gap:6px;align-items:center}\n.doks .dok .dokName{flex:0 0 34%}\n.doks .dok .dokUrl{flex:1;min-width:0}\n.doks .dok input{background:var(--bg);border:1px solid var(--rule);border-radius:var(--radius-sm);\n  color:var(--ink);font-family:inherit;font-size:12.5px;padding:6px 9px;width:100%}\n.doks .dok input:focus{outline:none;border-color:var(--accent)}\n.doklink{color:var(--accent);text-decoration:none;border-bottom:1px solid transparent}\n.doklink:hover{border-bottom-color:var(--accent)}\n\n/* --- Tilgungstabelle im Schuldblatt --- */\n.tilg{width:100%;border-collapse:collapse;font-size:12.5px}\n.tilg th{text-align:right;font-size:10.5px;color:var(--muted);text-transform:uppercase;\n  letter-spacing:.06em;font-weight:500;padding:0 6px 6px;border-bottom:1px solid var(--line)}\n.tilg th:first-child{text-align:left}\n.tilg td{padding:4px 6px;border-bottom:1px solid var(--hairline);text-align:right;\n  font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;font-size:12px}\n.tilg td:first-child{text-align:left;font-family:inherit;font-size:12.5px}\n.tilg tr.jahr td{border-top:1px solid var(--rule);font-weight:600;color:var(--ink)}\n.tilg td.zahl{color:var(--ok)}\n\n/* ===================================================================\n   BERICHT — dieselbe Farbwelt wie die App, dieselben Schriften.\n   Ein Bericht, den man am Bildschirm liest, soll aussehen wie das\n   Werkzeug, aus dem er kommt. Papier wird erst beim Drucken daraus:\n   dann kippen die Tokens auf weiss, und keine einzige Regel darunter\n   muss ein zweites Mal geschrieben werden.\n   =================================================================== */\n.bericht{background:var(--card);color:var(--ink);font-size:13px;line-height:1.5}\n\n/* Kopf: Etikett, Titel, Untertitel, rechts das Ausgabedatum. */\n.bkopf{display:flex;align-items:flex-start;gap:20px;padding-bottom:14px;\n  border-bottom:1px solid var(--ink);margin-bottom:18px}\n.bkopf .cap,.bstand .cap{font-family:'IBM Plex Mono',monospace;font-size:10px;\n  letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}\n.bkopf .cap.s,.bstand .cap.s{font-size:9px}\n.bkopf h1{font-size:24px;font-weight:600;letter-spacing:-.015em;margin:4px 0 2px;color:var(--ink)}\n.bkopf .bsub{font-size:12.5px;color:var(--muted)}\n.bstand{margin-left:auto;text-align:right;flex:0 0 auto}\n.bstand .num{font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--muted);margin-top:2px}\n\n/* Kennzahlenband — dieselbe Anatomie wie die Kennzahlen im Blatt. */\n.bkennz{display:flex;flex-wrap:wrap;background:var(--soft);border-radius:var(--radius-sm);\n  padding:13px 4px;margin-bottom:20px}\n.bkennz > div{flex:1 1 auto;min-width:max-content;padding:0 20px}\n.bkennz > div + div{border-left:1px solid var(--line)}\n.bkennz .cap{font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.16em;\n  text-transform:uppercase;color:var(--muted)}\n.bkennz b{display:block;font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;\n  font-size:18px;font-weight:600;margin-top:3px;color:var(--ink)}\n.bkennz b.ok{color:var(--ok)} .bkennz b.err{color:var(--err)}\n\n/* Zwischenueberschrift im Bericht — Kleinschrift-Etikett, kein zweiter Titel. */\n.bericht .bh{font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.16em;\n  text-transform:uppercase;color:var(--muted);font-weight:400;margin:24px 0 7px}\n\n/* Berichtstabelle */\n.btab{width:100%;border-collapse:collapse;font-size:12.5px}\n.btab th{text-align:left;font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.14em;\n  text-transform:uppercase;color:var(--muted);font-weight:400;padding:5px 8px 6px;\n  border-bottom:1px solid var(--ink);white-space:nowrap}\n.btab td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}\n.btab tfoot td{border-bottom:none;border-top:1px solid var(--ink);font-weight:600;padding-top:10px}\n.btab .bn{min-width:130px;overflow-wrap:anywhere}\n.btab th.bzahl,.btab td.bzahl{text-align:right;font-family:'IBM Plex Mono',monospace;\n  font-variant-numeric:tabular-nums;white-space:nowrap}\n.btab td.ok{color:var(--ok)} .btab td.err{color:var(--err)}\n.btab th.banteil,.btab td.banteil{width:158px;min-width:158px;white-space:nowrap}\n.bspur{display:inline-block;width:100px;height:7px;border-radius:999px;\n  background:var(--line);vertical-align:middle;overflow:hidden}\n.bbar{display:block;height:7px;border-radius:999px;background:var(--accent);width:0;opacity:.9}\n.bpct{display:inline-block;width:40px;text-align:right;font-family:'IBM Plex Mono',monospace;\n  font-size:11px;color:var(--muted);margin-left:8px;vertical-align:middle}\n.btab .bsub{font-size:11px;color:var(--muted);margin-top:1px;font-weight:400}\n.btab .nix{color:var(--rule)}\n.btab tr.grp td{background:var(--soft);font-weight:600;border-bottom:1px solid var(--rule)}\n.btab tbody tr.bz{cursor:pointer}\n.btab tbody tr.bz:hover td{background:var(--soft)}\n.btab tbody tr.aus{opacity:.34}\n.bfuss{margin-top:20px;padding-top:11px;border-top:1px solid var(--line);\n  font-size:11.5px;color:var(--muted)}\n[data-ausgeblendet]:empty{display:none}\n.bfuss [data-ausgeblendet]::before{content:' · '}\n.ber-notiz{margin-top:10px;font-size:11.5px;color:var(--muted);line-height:1.55}\n.ber-verlauf{width:100%;height:auto;display:block;margin:0 0 16px}\n#berichtVorschau .bericht{background:transparent}\n\n/* Rahmen der gesicherten Datei
