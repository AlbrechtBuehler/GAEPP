<!DOCTYPE html>
<html lang="de-CH" data-theme="hell">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GÄPP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ---------------------------------------------------------------------------
   Zwei Farbwelten. «hell» ist die Vorgabe und bildet Albrechts Excel nach:
   helle Datenzeilen mit weissen Gitterlinien, dunkle Balken fuer Kopf-, Gruppen-
   und Summenzeilen mit weisser Schrift. «dunkel» bleibt als Nachtfassung.
   --zeile      Grund der Datenzeilen
   --balken     Grund der Kopf-, Summen- und Saldozeilen
   --balken2    Grund der Gruppenkoepfe
   --aufbalken  Schrift auf einem Balken
--------------------------------------------------------------------------- */
:root{--bg:#ffffff;--card:#f3f3f3;--soft:#ebebeb;--line:#c9c9c9;--rule:#808080;--ink:#1a1a1a;
 --muted:#4f4f4f;--chrome:#404040;--accent:#404040;--onaccent:#ffffff;--gruen:#0e6b3d;
 --gitter:#ffffff;--zebra:#d0d0d0;--zeile:#d9d9d9;
 --balken:#404040;--balken2:#5a5a5a;--aufbalken:#ffffff;--gruenbalken:#a8e5c4;--rotbalken:#ffcfc0;--feldrand:#6b6b6b;
 /* EE7F00 steht so im Auftrag — dieselbe Farbe in beiden Schemata. */
 --merk:#c96a00;--claim:#ee7f00;--pgruen:#1c6b46;--porange:#ee7f00;--pgrau:#6f767e;--prot:#8f2c14;
 /* Eine Hoehe fuer alle Kopf-, Gruppen-, Summen- und Saldozeilen. Sie steht hier
    einmal, damit keine Zeile sie sich aus ihrem Inhalt selbst ausrechnet. */
 --kopfzeile:43px}
[data-theme="dunkel"]{--bg:#1c1f23;--card:#23272c;--soft:#2b3036;--line:#2e3338;--rule:#3d444b;--ink:#edf0f2;
 --muted:#98a0a8;--chrome:#9aa2aa;--accent:#e6eaee;--onaccent:#1c1f23;--gruen:#8ec9a8;
 --gitter:#4f5760;--zebra:#16191d;--zeile:#1c1f23;
 --balken:#23272c;--balken2:#2b3036;--aufbalken:#edf0f2;--gruenbalken:#8ec9a8;--rotbalken:#e8ab97;--feldrand:#6b747d;
 --merk:#ee7f00;--claim:#ee7f00;--pgruen:#4caf7d;--porange:#ee7f00;--pgrau:#7c848c;--prot:#d4705a}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg)}
body{font-family:'Space Grotesk',system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;
 height:100vh;overflow:hidden;display:flex;flex-direction:column}
input,select,button{font-family:inherit}

/* ---------- Leiste ---------- */
.leiste{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:14px 22px;
 border-bottom:1px solid var(--line);background:var(--card)}
.wort{font:700 18px/1 'Space Grotesk',sans-serif;letter-spacing:.02em;color:var(--ink)}
.gruppe{display:flex;align-items:center;gap:2px;background:var(--soft);border:1px solid var(--rule);
 border-radius:10px;padding:3px}
.gruppe button{background:none;border:none;border-radius:8px;padding:7px 15px;cursor:pointer;
 font:500 12.5px/1 'Space Grotesk',sans-serif;color:var(--muted)}
.gruppe button.mono{font-family:'IBM Plex Mono',monospace}
.gruppe button.an{background:var(--accent);color:var(--onaccent);font-weight:600}
.gruppe .trenn{width:1px;height:18px;background:var(--rule);margin:0 3px}
.rechts{margin-left:auto;display:flex;align-items:center;gap:7px;flex-wrap:wrap;min-width:0}
.knopf{background:none;border:1px solid var(--rule);border-radius:9px;padding:7px 12px;cursor:pointer;
 font:500 11.5px/1 'Space Grotesk',sans-serif;color:var(--muted)}
.knopf:hover{color:var(--ink)}
.knopf.hell{color:var(--ink)}
.knopf.hell:hover{background:var(--soft)}
/* Drei Farben: gruen geschrieben, orange schreibt, grau nicht verbunden.
   Rot bleibt als vierte — ein Fehler, der wie «nicht verbunden» aussieht, wird uebersehen. */
/* Ein Ring gibt dem Punkt eine Form. Ohne ihn steht Orange auf hellem Grund
   bei 2.5:1 und ist als Flaeche kaum auszumachen. */
.punkt{width:9px;height:9px;border-radius:50%;background:var(--pgrau);flex:none;
 box-shadow:0 0 0 1px var(--chrome)}
.punkt[data-s="lokal"]{background:var(--pgrau)}
.punkt[data-s="sichert"]{background:var(--porange)}
.punkt[data-s="gesichert"]{background:var(--pgruen)}
.punkt[data-s="fehler"]{background:var(--prot)}

/* ---------- Kennzahlenband ---------- */
.band{display:flex;gap:1px;background:var(--line);border-bottom:1px solid var(--line)}
.band>span{flex:1;background:var(--card);padding:13px 22px;display:flex;flex-direction:column;gap:6px}
.band .k{font:500 9.5px/1 'IBM Plex Mono',monospace;letter-spacing:.13em;text-transform:uppercase;color:var(--muted)}
.band .v{font:500 21px/1 'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums}
.band .m{font:400 11.5px/1.4 'Space Grotesk',sans-serif;color:var(--chrome)}

/* ---------- Tabelle ---------- */
.blatt{flex:1;min-height:0;overflow:auto;padding:0 0 34px}
table{border-collapse:separate;border-spacing:0;font-variant-numeric:tabular-nums;
 width:100%;table-layout:fixed}
th{position:sticky;top:0;z-index:4;background:var(--balken);border-bottom:1px solid var(--rule);
 padding:11px 8px;text-align:right;font:600 10px/1 'IBM Plex Mono',monospace;letter-spacing:.08em;
 text-transform:uppercase;color:var(--aufbalken);white-space:nowrap}
th.ecke{left:0;z-index:5;text-align:left;border-right:1px solid var(--balken2);padding:11px 14px;letter-spacing:.11em}
th.jahr{border-left:1px solid var(--balken2);padding:11px 14px;color:var(--aufbalken);letter-spacing:.11em}
/* Jede Zelle traegt den Zeilengrund — die Namensspalte klebt und darf nicht durchscheinen. */
td{padding:6px 8px;text-align:right;font:400 12px/1.25 'IBM Plex Mono',monospace;color:var(--ink);
 background:var(--zeile);white-space:nowrap;
 border-top:1px solid var(--gitter);border-right:1px solid var(--gitter)}
tr td:last-child{border-right:none}
td.name{position:sticky;left:0;z-index:1;border-right:1px solid var(--rule);text-align:left;
 padding-right:12px;font-family:'Space Grotesk',sans-serif;overflow:hidden}
td.jahr{border-left:1px solid var(--rule);padding-right:14px}
/* Balkenzeilen: Kategorie, Summe, Saldo dunkel; die Gruppen eine Stufe heller. */
tr.kopf td,tr.summe td,tr.stark td{background:var(--balken);color:var(--aufbalken);font-weight:600}
tr.gkopf td{background:var(--balken2);color:var(--aufbalken)}
tr.kopf td.gruen,tr.gkopf td.gruen,tr.summe td.gruen{color:var(--gruenbalken)}
/* Zebra zaehlt innerhalb der Sektion, nicht ueber die ganze Tabelle. */
tr.pos.zebra td{background:var(--zebra)}
.gruen{color:var(--gruen)}
tr.pos td.abgehakt{background:var(--soft);font-weight:600}
/* .zelle setzt color:inherit und steht weiter unten — bei gleicher Staerke gewinnt
   die spaetere Regel. Ohne diese Zeile bleibt ein abgehaktes Eingabefeld grau. */
.zelle.gruen,.namensfeld.gruen,.datumsfeld.gruen{color:var(--gruen)}
/* Ein Saldo unter null geht nicht auf. Er wird gezeigt, nicht gekappt — aber er
   wird gekennzeichnet, damit er nicht wie eine gewoehnliche Zahl dasteht. */
td.unstimmig{color:var(--prot);font-weight:600}
tr.kopf td.unstimmig,tr.gkopf td.unstimmig,tr.summe td.unstimmig,
tr.saldo td.unstimmig{color:var(--rotbalken)}

/* Die beiden Saldozeilen tragen das Ergebnis — sie duerfen groesser sein.
   Und seit dem 22.08.2026 tragen Kategorie-, Gruppen- und Summenzeilen dieselbe
   Hoehe: die Masse stehen hier an einer Stelle statt fuenfmal als Inline-Stil. */
tr.saldo td,tr.kopf td,tr.gkopf td,tr.summe td{
 font-size:13px;height:var(--kopfzeile);padding-top:0;padding-bottom:0}
tr.saldo td.name,tr.kopf td.name,tr.gkopf td.name,tr.summe td.name{
 font:600 14.5px/1.2 'Space Grotesk',sans-serif;letter-spacing:.01em}
/* «hoch» ist nur die Hoehe, ohne Balken: fuer Zeilen, die in der Jahresansicht
   in derselben Reihe stehen wie die Balken, aber keine Summe sind. */
tr.hoch td{font-size:13px;height:var(--kopfzeile);padding-top:0;padding-bottom:0}
tr.hoch td.name{font-family:'Space Grotesk',sans-serif;font-size:13.5px}
tr.saldo.stark td.name,tr.kopf.stark td.name{font-weight:700}
tr.saldo.stark td,tr.kopf.stark td{font-size:14px}
tr.kopf .klapper{font:inherit;font-weight:700}
tr.gkopf .klapper{font:inherit;font-weight:600}
tr.kopf td.name .namensfeld,tr.gkopf td.name .namensfeld{font:inherit;color:inherit}
/* Ein kleiner Punkt neben dem Glaeubiger: hier ist von Hand korrigiert worden. */
.mkorr{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--merk);
 margin-left:7px;flex:none;box-shadow:0 0 0 1px var(--chrome)}
thead tr.saldo td{position:sticky;z-index:4;background:var(--balken);color:var(--aufbalken)}
thead tr.saldo td.name{left:0;z-index:5}
tbody tr:first-child td{border-top:none}
tr.saldoende td{box-shadow:inset 0 -2px 0 var(--rule)}
tr.luft td{height:22px;background:var(--bg);border:none;padding:0}
/* inline-flex, nicht flex: als Block waere der Knopf eine eigene Zeile, und der
   Zaehler daneben braeche um — die Kopfzeile waere dann anderthalb Zeilen hoch. */
.klapper{display:inline-flex;align-items:center;vertical-align:middle;gap:9px;background:none;
 border:none;padding:0;cursor:pointer;text-align:left;color:inherit;font:inherit}
.chev{width:10px;font-size:9px;opacity:.75;flex:none}
.anzahl{font:400 11px/1 'Space Grotesk',sans-serif;color:inherit;opacity:.7;margin-left:8px}
.marke{font:400 9.5px/1 'IBM Plex Mono',monospace;letter-spacing:.09em;text-transform:uppercase;
 color:inherit;opacity:.7;margin-left:8px}
.zelle{width:100%;background:none;border:1px solid transparent;border-radius:5px;text-align:right;
 padding:3px 4px;font:inherit;color:inherit;font-variant-numeric:tabular-nums}
.zelle:hover{border-color:var(--feldrand)}
.zelle:focus{outline:none;border-color:var(--accent);background:var(--soft)}
.namensfeld{background:none;border:1px solid transparent;border-radius:5px;padding:3px 5px;
 font:400 13px/1.3 'Space Grotesk',sans-serif;color:var(--ink);flex:1 1 auto;min-width:0;width:100%}
.namensfeld:hover{border-color:var(--feldrand)}
.namensfeld:focus{outline:none;border-color:var(--accent);background:var(--soft);color:var(--ink)}
.werkzeug{opacity:0;display:inline-flex;gap:5px;margin-left:6px}
tr:hover .werkzeug,tr:focus-within .werkzeug{opacity:1}
.griff{cursor:grab;color:inherit;opacity:.7;font-size:11px;background:none;border:none;padding:0 2px}
.weg{cursor:pointer;color:inherit;opacity:.7;font-size:12px;background:none;border:none;padding:0 2px;line-height:1}
.weg:hover{opacity:1}
.plus{background:none;border:1px solid currentColor;border-radius:7px;width:20px;height:20px;
 cursor:pointer;color:inherit;opacity:.7;font-size:12px;line-height:1;padding:0}
.plus:hover{opacity:1}
.dialog .weg{color:var(--chrome);opacity:1}
.dialog .weg:hover{color:var(--ink)}
/* Das Ablegeziel muss man sehen: Flaeche allein ist zu leise. */
tr.ziel td{background:var(--soft);box-shadow:inset 0 2px 0 var(--accent)}
.leer{padding:60px 24px;font:400 14px/1.7 'Space Grotesk',sans-serif;color:var(--muted);max-width:640px}
/* Fusszeile: der Anspruch links, die Version daneben. Kein Hilfetext mehr —
   der steht seit dem 22.08.2026 im Handbuch hinter dem Fragezeichen oben. */
.fusszeile{display:flex;align-items:baseline;gap:14px;padding:9px 22px;flex:none;
 border-top:1px solid var(--line);background:var(--card)}
.fusszeile .claim{font:600 11.5px/1 'Space Grotesk',sans-serif;letter-spacing:.05em;color:var(--claim)}
.fusszeile .ver{font:400 11px/1 'IBM Plex Mono',monospace;letter-spacing:.06em;color:var(--muted)}

/* ---------- Dialoge ---------- */
.schleier{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:40;display:flex;
 align-items:center;justify-content:center}
.dialog{background:var(--card);border:1px solid var(--rule);border-radius:14px;padding:22px;
 min-width:400px;max-width:560px;display:flex;flex-direction:column;gap:14px}
.dialog h2{margin:0;font:600 15px/1.3 'Space Grotesk',sans-serif;color:var(--ink)}
.dialog p{margin:0;font:400 12.5px/1.6 'Space Grotesk',sans-serif;color:var(--chrome)}
.dialog label{font:500 10px/1 'IBM Plex Mono',monospace;letter-spacing:.11em;text-transform:uppercase;
 color:var(--muted);display:block;margin-bottom:6px}
.feld{background:var(--soft);border:1px solid var(--rule);border-radius:9px;padding:8px 10px;
 font:400 13px/1.2 'Space Grotesk',sans-serif;color:var(--ink);width:100%}
.feld:focus{outline:none;border-color:var(--accent)}
select.feld{font-family:'Space Grotesk',sans-serif}
.reihe{display:flex;gap:12px;align-items:flex-end}
.reihe>div{flex:1}
.haken{display:flex;align-items:center;gap:9px;background:none;border:none;padding:0;cursor:pointer;
 font:400 12.5px/1.4 'Space Grotesk',sans-serif;color:var(--ink);text-align:left}
.kasten{width:17px;height:17px;border:1px solid var(--rule);border-radius:5px;display:flex;
 align-items:center;justify-content:center;font-size:11px;color:var(--onaccent);flex:none}
.kasten.an{background:var(--accent);border-color:var(--accent)}
.dialog .tasten{display:flex;gap:9px;justify-content:flex-end;margin-top:4px}
.tat{background:var(--accent);color:var(--onaccent);border:none;border-radius:9px;padding:9px 16px;
 cursor:pointer;font:600 12.5px/1 'Space Grotesk',sans-serif}
.ab{background:none;border:1px solid var(--rule);color:var(--muted);border-radius:9px;padding:9px 16px;
 cursor:pointer;font:500 12.5px/1 'Space Grotesk',sans-serif}
.stand{background:none;border:1px solid transparent;border-radius:5px;padding:2px 4px;
 font:400 11px/1.2 'Space Grotesk',sans-serif;color:var(--ink);cursor:pointer;width:100%;
 text-align:right;-webkit-appearance:none;appearance:none;text-align-last:right}
.stand:hover{border-color:var(--feldrand)}
.stand:focus{outline:none;border-color:var(--accent)}
.datumsfeld{background:none;border:1px solid transparent;border-radius:5px;padding:3px 2px;
 font:400 11px/1.2 'IBM Plex Mono',monospace;color:var(--muted);width:100%;text-align:right}
.datumsfeld:hover{border-color:var(--feldrand)}
.datumsfeld:focus{outline:none;border-color:var(--accent);background:var(--soft);color:var(--ink)}
.neusteller{background:none;border:1px dashed var(--rule);border-radius:9px;padding:7px 14px;
 cursor:pointer;font:500 12px/1 'Space Grotesk',sans-serif;color:var(--muted);margin:12px 0 0 22px}
.neusteller:hover{color:var(--ink)}

/* ---------- Handbuch und Korrekturen ---------- */
.dialog.gross{min-width:min(720px,92vw);max-width:min(720px,92vw)}
.handbuch{max-height:62vh;overflow:auto;padding-right:8px;
 font:400 12.5px/1.65 'Space Grotesk',sans-serif;color:var(--chrome)}
.handbuch h3{margin:18px 0 6px;font:600 12.5px/1.3 'Space Grotesk',sans-serif;color:var(--ink);
 letter-spacing:.01em}
.handbuch h3:first-child{margin-top:0}
.handbuch p{margin:0 0 9px}
.handbuch b{color:var(--ink);font-weight:600}
.handbuch ul{margin:0 0 10px;padding-left:19px}
.handbuch li{margin:0 0 5px}
.wahl{display:flex;gap:2px;background:var(--soft);border:1px solid var(--rule);border-radius:9px;padding:3px}
.wahl button{background:none;border:none;border-radius:7px;padding:8px 14px;cursor:pointer;
 font:500 12px/1 'Space Grotesk',sans-serif;color:var(--muted)}
.wahl button.an{background:var(--accent);color:var(--onaccent);font-weight:600}
.vorschau{font:400 12px/1.6 'IBM Plex Mono',monospace;color:var(--chrome)}
.vorschau b{color:var(--ink);font-weight:600}
.korrliste{display:flex;flex-direction:column;gap:7px;max-height:32vh;overflow:auto}
.korrzeile{display:flex;align-items:center;gap:8px}
.korrzeile .feld{padding:6px 8px;font-size:12px}
.korrzeile .betrag{width:104px;flex:none;text-align:right;
 font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums}
.korrweg{width:82px;flex:none;text-align:center;font:500 11px/1 'IBM Plex Mono',monospace;
 letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.leerzeile{font:400 12px/1.5 'Space Grotesk',sans-serif;color:var(--muted)}

@page{size:landscape;margin:10mm}
/* Druck: schwarz auf weiss, keine Graustufen. Abgehaktes steht fett,
   weil Gruen und Flaeche auf dem Papier nicht mehr da sind. */
@media print{
 :root,[data-theme="hell"],[data-theme="dunkel"]{
  --bg:#fff;--card:#fff;--soft:#fff;--line:#000;--rule:#000;--ink:#000;--muted:#000;--chrome:#000;
  --accent:#000;--onaccent:#fff;--gruen:#000;--gitter:#000;--zebra:#fff;--zeile:#fff;
  --balken:#fff;--balken2:#fff;--aufbalken:#000;--gruenbalken:#000;--rotbalken:#000;--feldrand:#000;
  --merk:#000;--claim:#000;--pgruen:#000;--porange:#000;--pgrau:#000;--prot:#000}
 .leiste,.fusszeile,.schleier,.neusteller,.werkzeug,.plus,.mkorr{display:none !important}
 .blatt{overflow:visible;padding:0}
 body{background:#fff;height:auto;overflow:visible}
 *{color:#000 !important;background:#fff !important;background-color:#fff !important;
  box-shadow:none !important;text-shadow:none !important;-webkit-print-color-adjust:exact}
 th,tr.saldo td{position:static}
 td.abgehakt,td.abgehakt .zelle,.gruen{font-weight:700 !important}
 /* Ohne Flaechen muessen Linie und Fettdruck die Gliederung tragen. */
 tr.kopf td,tr.gkopf td,tr.summe td,tr.saldo td{font-weight:700 !important;
  border-top:1px solid #000;border-bottom:1px solid #000}
 tr.saldoende td{border-bottom:2px solid #000}
 .zelle,.namensfeld,.datumsfeld,.stand{border-color:transparent !important}
}
</style>
</head>
<body>
<div class="leiste" id="leiste"></div>
<div id="band"></div>
<div class="blatt" id="blatt"></div>
<div class="fusszeile" id="fusszeile"></div>
<div id="dialoge"></div>
<script>
"use strict";
/* ==========================================================================
   GÄPP — Tabellenwerkzeug
   Zwei Tabellen je Jahr (Budget, Rechnungen) und eine Jahresübersicht.
   Alles gerechnet, nichts abgeschrieben. Keine Kommastellen.
   Die Daten stehen NICHT in dieser Datei — sie kommen aus gaepp-daten.json,
   aus dem Browserspeicher oder aus dem privaten Repo.
   ========================================================================== */

/* Die Version steht genau hier. Fusszeile, Handbuch, HTML-Export und CSV lesen sie —
   abgeschrieben wird sie nirgends. */
const VERSION = '2.0.0';
const RUNDE = 10;   /* Verteilen rundet auf volle Zehner, immer aufwaerts. */

const MK = ['Jan','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'];
const ML = ['Januar','Februar','März','April','Mai','Juni','Juli','August',
            'September','Oktober','November','Dezember'];
const STAENDE = ['Offen','Bank','Bezahlt','Nicht eingetroffen'];
const N12 = () => new Array(12).fill(0);

let ZAEHLER = 0;
const neueId = () => 'p' + (++ZAEHLER);
const slug = s => String(s).toLowerCase().replace(/[^a-z0-9]+/g, '');
const esc = s => String(s == null ? '' : s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

/* ---------------------------------------------------------------- Zustand */
const S = {
  theme: 'hell', jahr: null, ansicht: 'budget', alleWas: 'budget', nullen: false,
  auf: [], haken: {}, jahre: [], daten: {}, rechnungen: {},
  neu: null, ueb: null, exp: null, wegJahr: null, zieht: null, ziel: null,
  korr: null, korrWarn: null, basis: null, hb: false,
  stichmonat: '2026-08', sync: 'nicht verbunden', syncText: '',
  geladen: false
};

/* Anzeigezustand (auf, nullen, theme, jahr, ansicht) geht nie in die Datendatei. */
function nutzdaten() {
  return {
    schemaVersion: 1,
    meta: { waehrung:'CHF', stichmonat:S.stichmonat, geaendert:new Date().toISOString() },
    jahre: S.jahre.slice().sort((a,b) => a-b),
    daten: S.daten, rechnungen: S.rechnungen, haken: S.haken
  };
}
/* Eine Datei aus fremder Hand darf die Anzeige nicht zum Absturz bringen. Alles,
   was gerechnet oder gezeichnet wird, kommt hier in eine brauchbare Form: zwoelf
   Monatswerte, Ganzzahlen, Zeichenketten. Was nicht zu retten ist, wird zu null. */
const zw12 = r => { const a = Array.isArray(r) ? r.slice(0,12) : [];
  while (a.length < 12) a.push(0);
  return a.map(x => { const n = Number(x); return isFinite(n) ? Math.round(n) : 0; }); };
const zGanz = x => { const n = Number(x); return isFinite(n) ? Math.round(n) : 0; };
const zText = x => (x == null ? '' : String(x));

function uebernimm(d) {
  if (!d || typeof d !== 'object') throw new Error('Keine gültige Datei.');
  if (!d.daten || !d.jahre) throw new Error('Der Datei fehlen «jahre» oder «daten».');
  S.jahre = (Array.isArray(d.jahre) ? d.jahre : []).map(Number)
    .filter(x => isFinite(x)).sort((a,b) => a-b);
  if (!S.jahre.length) throw new Error('Die Datei führt keinen einzigen Jahrgang.');
  S.daten = d.daten;
  S.rechnungen = d.rechnungen || {};
  S.haken = d.haken || {};
  let ersatz = 0;
  const heilePos = p => { p.reihe = zw12(p.reihe); p.basis = zGanz(p.basis);
    p.name = zText(p.name); p.key = zText(p.key) || ('ohne' + (++ersatz)); };
  S.jahre.forEach(j => {
    if (!Array.isArray(S.daten[j])) S.daten[j] = [];
    S.daten[j].forEach(b => {
      b.name = zText(b.name); b.key = zText(b.key);
      if (b.art === 'schulden') { if (!Array.isArray(b.gruppen)) b.gruppen = [];
        b.gruppen.forEach(g => { g.name = zText(g.name); g.key = zText(g.key);
          if (!Array.isArray(g.pos)) g.pos = []; g.pos.forEach(heilePos); }); }
      else { if (!Array.isArray(b.pos)) b.pos = []; b.pos.forEach(heilePos); }
    });
    if (!Array.isArray(S.rechnungen[j])) S.rechnungen[j] = [];
    S.rechnungen[j].forEach(g => { g.name = zText(g.name);
      if (!Array.isArray(g.rechnungen)) g.rechnungen = [];
      g.rechnungen.forEach(r => { r.reihe = zw12(r.reihe); r.betrag = zGanz(r.betrag);
        r.zweck = zText(r.zweck); r.datum = zText(r.datum);
        if (STAENDE.indexOf(r.stand) < 0) r.stand = STAENDE[0]; }); });
  });
  if (d.meta && d.meta.stichmonat) S.stichmonat = d.meta.stichmonat;
  /* Zähler über alle vergebenen Ids heben, damit neue Ids nie kollidieren. */
  let hoch = 0;
  const merke = id => { const m = /^p(\d+)$/.exec(String(id||'')); if (m) hoch = Math.max(hoch, +m[1]); };
  S.jahre.forEach(j => (S.daten[j]||[]).forEach(b => { merke(b.id);
    if (b.art === 'schulden') (b.gruppen||[]).forEach(g => { merke(g.id); (g.pos||[]).forEach(p => merke(p.id)); });
    else (b.pos||[]).forEach(p => merke(p.id)); }));
  S.jahre.forEach(j => (S.rechnungen[j]||[]).forEach(g => { merke(g.id);
    (g.rechnungen||[]).forEach(r => merke(r.id)); }));
  ZAEHLER = Math.max(ZAEHLER, hoch);
  if (!S.jahr || S.jahre.indexOf(S.jahr) < 0) {
    const hj = parseInt(S.stichmonat.slice(0,4), 10);
    S.jahr = S.jahre.indexOf(hj) >= 0 ? hj : (S.jahre[S.jahre.length - 1] || null);
  }
  S.geladen = true;
}

/* ------------------------------------------------------------- Formatieren */
/* Symmetrisch runden: minus zwei Komma fuenf wird minus drei, nicht minus zwei.
   Math.round rundet bei einer halben Einheit zur Null hin und behandelt Plus und
   Minus dadurch verschieden. */
const runde = n => (n < 0 ? -1 : 1) * Math.round(Math.abs(n));
function fmt(n, immer) {
  const r = runde(n || 0);
  if (r === 0 && !S.nullen && !immer) return '';
  return (r < 0 ? '−' : '') + String(Math.abs(r)).replace(/\B(?=(\d{3})+(?!\d))/g, "'");
}
function zahl(v) {
  let s = String(v == null ? '' : v).replace(/[\s'’]/g,'').replace(/−/g,'-');
  s = s.replace(/[^0-9.,-]/g,'');
  /* Steht ein Komma da, ist es der Dezimaltrenner und der Punkt trennt Tausender:
     «1.234,50» ist eintausendzweihundertvierunddreissig Franken fuenfzig. */
  if (s.indexOf(',') >= 0) s = s.replace(/\./g,'').replace(',','.');
  /* Mehr als ein Punkt kann nur eine Tausendertrennung sein: «1.234.567». */
  else if ((s.match(/\./g) || []).length > 1) s = s.replace(/\./g,'');
  const n = parseFloat(s);
  return isNaN(n) ? 0 : runde(n);
}
const su = r => (r || []).reduce((s,x) => s + (x||0), 0);
/* Raten koennen eine Schuld auf null tilgen, aber nicht ins Minus. Eine Basis,
   die schon im Minus steht, bleibt dort — sie ist ein Befund, und eine Rate darf
   einen Befund nicht wegrechnen. */
const nachRaten = (basis, raten) => {
  if (raten < 0) return basis - raten;            /* negative Rate: die Schuld waechst */
  return basis <= 0 ? basis : Math.max(0, basis - raten);
};
const jahre = () => S.jahre.slice().sort((a,b) => a-b);
const vorjahr = j => { const k = S.jahre.filter(x => x < j); return k.length ? Math.max.apply(null,k) : null; };
const offen = id => S.auf.indexOf(id) >= 0;
const hakenAn = (pid,m) => !!S.haken[pid + ':' + m];
/* Rechnungen tragen ihre Monatshaken im selben Vorrat wie das Budget. Eine ganz
   als «Bezahlt» gemeldete Rechnung gilt in jedem ihrer Monate als abgehakt. */
const monatBezahlt = (r,m) => r.stand === 'Bezahlt' || hakenAn(r.id, m);
const stellerGruen = (g,m) => {
  const mit = (g.rechnungen||[]).filter(r => ((r.reihe||[])[m]||0) !== 0);
  return mit.length > 0 && mit.every(r => monatBezahlt(r,m));
};
/* Alle Monate mit einem Wert abgehakt? Dann ist die Rechnung bezahlt. */
const rechnungRund = r => {
  const mit = (r.reihe||[]).map((v,m) => ({v,m})).filter(x => x.v !== 0);
  return mit.length > 0 && mit.every(x => hakenAn(r.id, x.m));
};
const schuldBlock = j => (S.daten[j] || []).find(b => b.art === 'schulden');
/* Rueckstellungen werden verteilt, alle anderen Kategorien uebertragen — der
   Vorschlag im Basis-Fenster haengt daran, nicht die Wahl selbst. */
const istRueckstellung = b => /r(ue|ü|u)ckstell/i.test(String(b && b.key || '') + ' ' + String(b && b.name || ''));
/* Verteilen: Betrag durch zwoelf, auf volle Zehner AUFgerundet. Nie abrunden. */
const proMonat = betrag => Math.ceil(Math.abs(betrag) / 12 / RUNDE) * RUNDE * (betrag < 0 ? -1 : 1);
/* Rechnungssteller stehen immer alphabetisch — Ansicht, Druck und Export gleich. */
const steller = j => (S.rechnungen[j] || []).slice().sort((a,b) =>
  String(a.name||'').localeCompare(String(b.name||''), 'de-CH', { sensitivity:'base', numeric:true }));

/* ---- Manuelle Korrekturen an Schuldsalden ---------------------------------
   p.korr = { basis: [{id,betrag,notiz}], rest: [{id,betrag,notiz}] }
   betrag positiv = Saldo erhoehen, negativ = Saldo reduzieren.

     basis(J) = (geerbt ? rest(J-1) : eigener Anfangsstand) + Summe korr.basis(J)
     rest(J)  = max(0, basis(J) - Summe Raten(J))          + Summe korr.rest(J)

   Damit ist die Fortschreibung ins Folgejahr keine Aktion, sondern die Rechnung
   selbst — wie eine Verknuepfung im Excel. Nichts wird von Hand ausgeloest. */
const korrListe = (p, art) => ((p && p.korr && p.korr[art]) || []);
const korrSum = (p, art) => korrListe(p, art).reduce((s,x) => s + (x.betrag||0), 0);
const hatKorr = p => korrListe(p,'basis').length > 0 || korrListe(p,'rest').length > 0;

function posVon(j, gKey, pKey) {
  const blk = schuldBlock(j); if (!blk) return null;
  const g = (blk.gruppen||[]).find(x => x.key === gKey); if (!g) return null;
  return (g.pos||[]).find(x => x.key === pKey) || null;
}

/* Anfangsstand = Rest des Vorjahrs. Ändert sich eine Rate 2026, wandert der
   neue Rest von selbst in 2027 und weiter. Rekursiv bis zum ersten Jahrgang. */
function basisVon(j, gKey, pKey, eigen) {
  const kb = korrSum(posVon(j, gKey, pKey), 'basis');
  /* Die Raten klemmen bei null — mehr als die Schuld kann keine Rate tilgen.
     Eine Korrektur klemmt NICHT: Wer mehr wegnimmt, als da ist, soll das sehen.
     Ein Plan, der nicht aufgeht, ist ein Befund und keine Aufgabe fuer den
     Taschenrechner — und sonst zeigten Rest und Basis des Folgejahrs zwei
     verschiedene Zahlen fuer dieselbe Sache. */
  const selbst = () => (eigen || 0) + kb;
  const v = vorjahr(j);
  if (v === null) return selbst();
  const vp = posVon(v, gKey, pKey);
  if (!vp) return selbst();
  const vorBasis = basisVon(v, gKey, pKey, vp.basis);
  /* Ein Jahrgang, der die Schuld nur dem Namen nach fuehrt — kein Anfangsstand,
     keine Rate, keine Korrektur — traegt nichts bei und ist durchlaessig. Sonst
     wuerde ein leeres Geruest den Anfangsstand des Folgejahrs auf null ziehen. */
  if (vorBasis === 0 && su(vp.reihe) === 0 && korrSum(vp,'rest') === 0) return selbst();
  return nachRaten(vorBasis, su(vp.reihe)) + korrSum(vp,'rest') + kb;
}

/* Der Rest am 31.12. — dieselbe Zahl, die im Folgejahr die Basis ist.
   Derselbe Rechenweg wie oben, damit die beiden nie auseinanderlaufen. */
function restVon(j, gKey, pKey) {
  const p = posVon(j, gKey, pKey); if (!p) return 0;
  return nachRaten(basisVon(j, gKey, pKey, p.basis), su(p.reihe)) + korrSum(p,'rest');
}

/* Traegt das direkte Vorjahr dieselbe Schuld? Dann ist die Basis geerbt und
   nicht tippbar — der Anfangsstand ist der Rest des Vorjahrs, keine Wahl. */
function basisGeerbt(j, gKey, pKey) {
  const v = vorjahr(j); if (v === null) return false;
  const vp = posVon(v, gKey, pKey); if (!vp) return false;
  return basisVon(v, gKey, pKey, vp.basis) !== 0 || su(vp.reihe) !== 0 || korrSum(vp,'rest') !== 0;
}

/* Spaetere Jahrgaenge, die fuer dieselbe Schuld eine eigene Korrektur am
   Anfangssaldo tragen — der Grund fuer die Warnung beim Fortschreiben. */
function folgeKorrekturen(j, gKey, pKey) {
  return jahre().filter(x => x > j).map(x => {
    const p = posVon(x, gKey, pKey);
    if (!p || !korrListe(p,'basis').length) return null;
    return { jahr:x, betrag:korrSum(p,'basis'),
      notizen: korrListe(p,'basis').map(k => k.notiz).filter(Boolean) };
  }).filter(Boolean);
}

/* ------------------------------------------------- Zeilen eines Jahrgangs */
function bau(jahr, alles) {
  const bl = S.daten[jahr] || [], out = [];
  const plus = (a,b) => a.map((x,i) => x + b[i]);
  let einnahmen = N12(), ausgaben = N12();

  /* Gegenposten Tilgung: Einnahmenseite der Jahre, die nur Schulden führen. */
  const tilgung = N12();
  bl.forEach(b => { if (b.art !== 'schulden') return;
    (b.gruppen||[]).forEach(g => (g.pos||[]).forEach(p =>
      (p.reihe||[]).forEach((v,m) => { tilgung[m] += v; }))); });

  bl.forEach(b => {
    const bAuf = alles || offen(b.id);
    let bsum = N12(), bBasis = 0, bRest = 0;
    const kinder = [];

    if (b.art === 'schulden') {
      (b.gruppen||[]).forEach(g => {
        const gAuf = alles || offen(g.id);
        let gsum = N12(), gBasis = 0, gRest = 0;
        const enkel = [];
        (g.pos||[]).forEach(p => {
          const basis = basisVon(jahr, g.key, p.key, p.basis);
          const rest = nachRaten(basis, su(p.reihe)) + korrSum(p,'rest');
          gsum = plus(gsum, p.reihe); gBasis += basis; gRest += rest;
          enkel.push({ typ:'pos', id:p.id, eltern:g.id, name:p.name, bs:basis,
            reihe:p.reihe, jw:rest, tief:3, geerbt: basisGeerbt(jahr, g.key, p.key),
            schuld:true, korr:hatKorr(p) });
        });
        kinder.push({ typ:'gkopf', id:g.id, eltern:b.id, name:g.name, reihe:gsum, auf:gAuf,
          bs:gBasis, jw:gRest, anzahl:(g.pos||[]).length });
        if (gAuf) enkel.forEach(x => kinder.push(x));
        bsum = plus(bsum, gsum); bBasis += gBasis; bRest += gRest;
      });
    } else {
      (b.pos||[]).forEach(p => {
        const r = p.spiegel === 'tilgung' ? tilgung : p.reihe;
        bsum = plus(bsum, r);
        kinder.push({ typ:'pos', id:p.id, eltern:b.id, name:p.name, bs:p.basis, reihe:r,
          jw:su(r), tief:2, fix: !!p.fix, verteilen: istRueckstellung(b),
          marke: p.spiegel === 'tilgung' ? 'gegenposten zur tilgung' : '' });
      });
      bRest = su(bsum);
    }

    out.push({ typ:'kopf', id:b.id, name:b.name, reihe:bsum, auf:bAuf,
      bs: b.art === 'schulden' ? bBasis : 0, jw:bRest, schulden: b.art === 'schulden',
      anzahl: b.art === 'schulden' ? (b.gruppen||[]).length : (b.pos||[]).length });
    if (bAuf) kinder.forEach(x => out.push(x));
    if (b.vz === 1) einnahmen = plus(einnahmen, bsum); else ausgaben = plus(ausgaben, bsum);
  });

  const rech = N12();
  (S.rechnungen[jahr] || []).forEach(g => (g.rechnungen||[]).forEach(r =>
    (r.reihe||[]).forEach((v,m) => { rech[m] += v; })));
  out.push({ typ:'summe', id:'rech', name:'Rechnungen', reihe:rech, jw:su(rech),
    klein:true, marke:'aus dem Blatt Rechnungen' });
  ausgaben = ausgaben.map((x,i) => x + rech[i]);
  out.push({ typ:'summe', id:'aus', name:'Ausgaben zusammen', reihe:ausgaben,
    jw:su(ausgaben), stark:true });

  const saldo = einnahmen.map((e,i) => e - ausgaben[i]);
  let lauf = 0;
  const kum = saldo.map(s => (lauf += s));
  return { zeilen:out, saldo, kum, einnahmen, ausgaben, rech };
}

/* Kopfzelle grün, wenn jeder Posten darunter in diesem Monat abgehakt ist. */
function kopfGruen(jahr, blockId, m) {
  const b = (S.daten[jahr]||[]).find(x => x.id === blockId); if (!b) return false;
  const alle = b.art === 'schulden'
    ? (b.gruppen||[]).reduce((a,g) => a.concat(g.pos||[]), []) : (b.pos||[]);
  const mit = alle.filter(p => (p.reihe||[])[m] !== 0);
  return mit.length > 0 && mit.every(p => hakenAn(p.id, m));
}
function gruppeGruen(jahr, gid, m) {
  const b = schuldBlock(jahr); if (!b) return false;
  const g = (b.gruppen||[]).find(x => x.id === gid); if (!g) return false;
  const mit = (g.pos||[]).filter(p => (p.reihe||[])[m] !== 0);
  return mit.length > 0 && mit.every(p => hakenAn(p.id, m));
}

/* ------------------------------------------------------------ Kennzahlen */
function kennzahlen() {
  const js = jahre();
  if (!js.length) return null;
  const hj0 = parseInt(S.stichmonat.slice(0,4), 10);
  const hm = parseInt(S.stichmonat.slice(5,7), 10) - 1;
  const hj = js.indexOf(hj0) >= 0 ? hj0 : js[js.length-1];

  const blk = schuldBlock(hj);
  /* Stand einer einzelnen Schuld am Stichmonat. Eine Korrektur am Jahresende ist
     am 31.12. gebucht — sie zaehlt hier nur, wenn der Stichmonat der Dezember
     ist. Sonst zeigten zwei Anzeigen derselben Zahl sie verschieden. */
  const standHeute = (g, p) =>
    nachRaten(basisVon(hj, g.key, p.key, p.basis), su((p.reihe||[]).slice(0, hm+1)))
    + (hm === 11 ? korrSum(p,'rest') : 0);

  let rest = 0;
  if (blk) (blk.gruppen||[]).forEach(g => (g.pos||[]).forEach(p => { rest += standHeute(g, p); }));

  /* Anfangsstand: jede Schuld mit dem Stand ihres EIGENEN ersten Jahres — nicht
     alle aus einem Jahrgang. Gemessen wird an den Zahlen, nicht an der Laenge der
     Liste: ein Geruest fuehrt seine Glaeubiger dem Namen nach und traegt nichts. */
  let anfang = 0, erstJahr = null;
  const anfangVon = (gKey, pKey) => {
    for (const j of js) {
      if (j > hj) break;                          /* was spaeter beginnt, laeuft noch nicht */
      const p = posVon(j, gKey, pKey);
      if (!p || basisGeerbt(j, gKey, pKey)) continue;
      const a = basisVon(j, gKey, pKey, p.basis);
      if (a === 0) continue;
      return { a, j };
    }
    return null;
  };
  /* Gezaehlt werden genau die Schulden, die auch in «Restschuld heute» stecken.
     Sonst stuende in «Getilgt bisher» eine Schuld, die noch gar nicht laeuft. */
  if (blk) (blk.gruppen||[]).forEach(g => (g.pos||[]).forEach(p => {
    const t = anfangVon(g.key, p.key);
    if (!t) return;
    anfang += t.a;
    if (erstJahr === null || t.j < erstJahr) erstJahr = t.j;
  }));

  /* Getilgt ist, was vom Anfangsstand verschwunden ist. Roh aufsummierte Raten
     gehen nicht auf — eine Rate, die groesser ist als die Restschuld, tilgt nur
     bis null. «Anfang minus Getilgt» muss die Restschuld ergeben, sonst steht
     im Band eine Quote, die niemand nachrechnen kann. */
  const getilgt = anfang - rest;

  /* Schuldenfrei: jede Schuld laeuft fuer sich. Wer alle Raten in einen Topf
     wirft, rechnet die Rate einer getilgten Schuld auf die uebrigen an und wird
     zu frueh fertig. Nach dem letzten erfassten Jahr wiederholt sich dessen Rate. */
  const letzte = js[js.length-1];
  const rateVon = (j, gKey, pKey, m) => {
    const p = posVon(j >= letzte ? letzte : j, gKey, pKey);
    return p ? ((p.reihe||[])[m] || 0) : 0; };
  const korrVon = (j, gKey, pKey, art) => {
    const p = posVon(j, gKey, pKey); return p ? korrSum(p, art) : 0; };

  let frei = null, haengt = false, unstimmig = false;
  if (blk) (blk.gruppen||[]).forEach(g => (g.pos||[]).forEach(p => {
    let stand = standHeute(g, p);
    if (stand <= 0) return;                       /* diese Schuld ist durch */
    let jL = hj, mL = hm, schritte = 0, ueberspringe = (hm === 11), fertig = null;
    while (schritte < 480) {
      mL++;
      if (mL > 11) { if (ueberspringe) ueberspringe = false;
        else stand += korrVon(jL, g.key, p.key, 'rest');
        mL = 0; jL++; stand += korrVon(jL, g.key, p.key, 'basis'); }
      const rate = rateVon(jL, g.key, p.key, mL);
      if (rate <= 0 && stand > 0 && schritte > 240) break;
      stand -= rate; schritte++;
      if (stand <= 0) { fertig = { j:jL, m:mL }; break; }
    }
    if (!fertig) { haengt = true; return; }
    if (!frei || fertig.j > frei.j || (fertig.j === frei.j && fertig.m > frei.m)) frei = fertig;
  }));
  if (haengt) frei = null;
  else if (!frei) frei = { j:hj, m:hm };          /* keine offene Schuld mehr */

  /* Ein Befund ist ein Befund, egal in welchem Monat man draufschaut. Deshalb
     wird jeder Jahrgang gefragt und nicht nur der Stichmonat. */
  js.forEach(j => { const b = schuldBlock(j); if (!b) return;
    (b.gruppen||[]).forEach(g => (g.pos||[]).forEach(p => {
      if (basisVon(j, g.key, p.key, p.basis) < 0 || restVon(j, g.key, p.key) < 0) unstimmig = true;
    })); });

  let off = 0;
  (S.daten[hj]||[]).forEach(b => {
    if (b.vz === 1) return;
    const liste = b.art === 'schulden'
      ? (b.gruppen||[]).reduce((a,g) => a.concat(g.pos||[]), []) : (b.pos||[]);
    liste.forEach(p => { const v = (p.reihe||[])[hm];
      if (v !== 0 && !hakenAn(p.id, hm)) off += v; });
  });
  /* Wie im Budget: was in diesem Monat weder abgehakt noch als bezahlt gemeldet ist. */
  (S.rechnungen[hj]||[]).forEach(g => (g.rechnungen||[]).forEach(r => {
    if (r.stand !== 'Bezahlt' && !hakenAn(r.id, hm)) off += (r.reihe||[])[hm] || 0; }));

  return { jahr:hj, monat:hm, rest, getilgt, anfang, offen:off, erstJahr,
    quote: anfang ? Math.round(getilgt/anfang*100) : 0, frei,
    /* Ein Saldo unter null heisst: eine Korrektur nimmt mehr weg, als da ist.
       Das ist ein Befund, keine Zahl, mit der weitergerechnet wird. */
    unstimmig: unstimmig || rest < 0 };
}

/* ==================================================================== Bild */
const F = n => fmt(n);
const B = {  /* Spaltenbreiten — zwölf Monate ohne Querscrollen */
  budget: { name:252, basis:74, monat:74, jahr:92 },
  rech:   { name:206, datum:96, betrag:74, monat:64, saldo:66, stand:128 }
};

/* Die Kennzeichen, ueber die ein Feld nach dem Neuzeichnen wiedergefunden wird.
   Links der Name im dataset, rechts der im Auszeichnungstext. */
const MERKFELD = [['z','z'],['rm','rm'],['r','r'],['f','f'],['p','p'],['s','s'],['m','m'],['b','b'],
                  ['korrB','korr-b'],['korrN','korr-n']];

/* Ein Neuzeichnen kann waehrend des Neuzeichnens ausgeloest werden: das Ersetzen
   des Blatts nimmt dem getippten Feld den Fokus, das loest «change» aus, und
   «change» zeichnet neu. Die aeussere Zuweisung von innerHTML brach dann mit
   NotFoundError ab. Deshalb ein Riegel und hoechstens zwei Nachzuege. */
let zeichnet = false, nachzug = 0;
/* Wer eine Zeile anlegt, will sie benennen. Das Feld gibt es erst nach dem
   Neuzeichnen — deshalb der Wunsch, der danach eingeloest wird. */
let fokusWunsch = null;
function zeichne() {
  if (zeichnet) { nachzug++; return; }
  zeichnet = true;
  try {
    let runden = 0;
    do { nachzug = 0; zeichneJetzt(); runden++; } while (nachzug && runden < 3);
  } catch (e) {
    /* Ein Datenstand, der die Anzeige zum Absturz bringt, darf die App nicht
       unbedienbar zuruecklassen. Es muss immer einen Weg zurueck geben. */
    notausgang(e);
  } finally { zeichnet = false; }
}
function notausgang(e) {
  try {
    document.getElementById('leiste').innerHTML = '<span class="wort">GÄPP</span>';
    document.getElementById('band').innerHTML = '';
    document.getElementById('dialoge').innerHTML = '';
    document.getElementById('fusszeile').innerHTML = fusszeile();
    document.getElementById('blatt').innerHTML = '<div class="leer">'
      + '<p style="margin:0 0 14px">Dieser Datenstand lässt sich nicht anzeigen.</p>'
      + '<p style="margin:0 0 18px;color:var(--chrome)">' + esc(String((e && e.message) || e)) + '</p>'
      + '<button class="tat" data-laden="1">Andere Datei laden</button> '
      + '<button class="ab" data-vergiss="1">Browserspeicher leeren und neu starten</button></div>';
  } catch (x) {}
}

/* Ein Klick von einer Zelle in die naechste loest auf der alten Zelle «change»
   aus. Wuerde GAEPP sofort neu zeichnen, waere die angeklickte Zelle weg, bevor
   der Klick dort ankommt — der Fokus landete wieder in der zuvor bearbeiteten
   Zelle. Deshalb wird nach einer Aenderung erst im naechsten Durchgang gezeichnet,
   wenn der Klick angekommen ist. */
let baldZeichnen = null;
function zeichneBald() {
  if (baldZeichnen) return;
  baldZeichnen = setTimeout(() => { baldZeichnen = null; zeichne(); }, 0);
}
function zeichneJetztFalls() {
  if (!baldZeichnen) return;
  clearTimeout(baldZeichnen); baldZeichnen = null; zeichne();
}
/* Nur der Rahmen. Eine Meldung aus dem Sichern geht das Blatt nichts an — wer
   dort gerade tippt, soll seinen halben Satz behalten. */
function zeichneRahmen() {
  const l = document.getElementById('leiste');
  if (l) l.innerHTML = leiste();
}

function zeichneJetzt() {
  const akt = document.activeElement;
  const merk = akt && akt.dataset ? { k:akt.className,
    pos:(akt.selectionStart != null ? akt.selectionStart : null),
    bis:(akt.selectionEnd != null ? akt.selectionEnd : null) } : null;
  if (merk) MERKFELD.forEach(f => { merk[f[0]] = akt.dataset[f[0]]; });

  document.documentElement.setAttribute('data-theme', S.theme);
  document.getElementById('leiste').innerHTML = leiste();
  document.getElementById('band').innerHTML = band();
  document.getElementById('blatt').innerHTML = blatt();
  document.getElementById('fusszeile').innerHTML = fusszeile();
  document.getElementById('dialoge').innerHTML = dialoge();

  klebEinstellen();

  if (merk) {
    const teile = [];
    MERKFELD.forEach(f => { if (merk[f[0]] != null) teile.push('[data-'+f[1]+'="'+merk[f[0]]+'"]'); });
    if (teile.length) {
      const kand = document.querySelectorAll(teile.join(''));
      /* Verglichen wird nur der erste Klassenteil. Eine Zelle, die durch die
         eigene Eingabe von «zelle» auf «zelle gruen» wechselt, waere sonst nach
         dem Neuzeichnen nicht mehr wiederzufinden — der Fokus fiele ins Leere. */
      const erste = c => String(c || '').trim().split(/\s+/)[0];
      for (const el of kand) {
        if (erste(el.className) === erste(merk.k)) {
          el.focus();
          if (merk.pos != null && el.setSelectionRange) {
            try { el.setSelectionRange(merk.pos, merk.bis != null ? merk.bis : merk.pos); } catch(e){} }
          break; }
      }
    }
  }

  if (fokusWunsch) {
    const ziel = document.querySelector(fokusWunsch);
    fokusWunsch = null;
    if (ziel) { ziel.focus(); if (ziel.select) { try { ziel.select(); } catch(e){} } }
  }
}

/* Saldo budgetiert und Saldo kumuliert bleiben unter dem Tabellenkopf stehen,
   damit beim Tippen weiter unten sichtbar ist, wie der Saldo reagiert. */
function klebEinstellen() {
  const kopf = document.querySelector('thead th');
  if (!kopf) return;
  let oben = Math.round(kopf.getBoundingClientRect().height);
  document.querySelectorAll('tr.saldo').forEach(tr => {
    tr.querySelectorAll('td').forEach(td => { td.style.top = oben + 'px'; });
    oben += Math.round(tr.getBoundingClientRect().height);
  });
}

/* ------------------------------------------------------------ Kopfleiste */
function leiste() {
  const js = jahre();
  const jk = js.map(j => '<button class="mono' + (S.ansicht !== 'alle' && S.jahr === j ? ' an' : '')
    + '" data-geh-jahr="' + j + '">' + j + '</button>').join('');
  const an = S.ansicht === 'alle';
  /* Die Umschaltung bleibt auch in «Alle» stehen — Rechnungen fuehren dort
     seit dem 22.08.2026 eine eigene Jahresansicht, analog zum Budget. */
  const was = an ? S.alleWas : S.ansicht;
  const ans = '<span class="gruppe">'
    + '<button' + (was==='budget'?' class="an"':'') + ' data-geh-ansicht="budget">Budget</button>'
    + '<button' + (was==='rechnung'?' class="an"':'') + ' data-geh-ansicht="rechnung">Rechnungen</button>'
    + '</span>';
  return '<span class="wort">GÄPP</span>'
    + '<span class="gruppe">' + jk
    + '<button' + (an?' class="an"':'') + ' data-geh-alle="1">Alle</button>'
    + '<span class="trenn"></span>'
    + '<button data-neu-jahr="1" title="Neues Jahr anlegen">+</button>'
    + (js.length > 1 && S.ansicht !== 'alle'
        ? '<button data-weg-jahr="1" title="Jahr ' + S.jahr + ' löschen">−</button>' : '')
    + '</span>'
    + ans
    + '<span class="rechts">'
    + '<button class="knopf" data-hb="1" title="Handbuch" '
    + 'style="font-weight:700;padding:7px 12px;font-size:13px">?</button>'
    + '<button class="knopf" data-alle-um="1">' + (S.auf.length ? 'Alles zuklappen' : 'Alles aufklappen') + '</button>'
    + '<button class="knopf" data-nullen="1">' + (S.nullen ? 'Nullen ausblenden' : 'Nullen zeigen') + '</button>'
    + '<button class="knopf hell" data-exp="1">HTML sichern</button>'
    + '<button class="knopf" data-drucken="1">Drucken</button>'
    + '<button class="knopf" data-theme-um="1">' + (S.theme === 'hell' ? 'Hell' : 'Dunkel') + '</button>'
    + '<button class="knopf" data-sync-auf="1" title="' + esc(S.syncText || S.sync) + '" '
    + 'style="display:flex;align-items:center;gap:7px">'
    + '<span class="punkt" data-s="' + esc(S.sync) + '"></span>Daten</button>'
    + '</span>';
}

/* ------------------------------------------------------ Kennzahlenband */
function band() {
  const was = S.ansicht === 'alle' ? S.alleWas : S.ansicht;
  if (was !== 'budget' || !S.geladen) return '';
  const k = kennzahlen(); if (!k) return '';
  const js = jahre();
  const frei = k.frei ? ML[k.frei.m] + ' ' + k.frei.j : null;
  const monate = k.frei ? (k.frei.j - k.jahr) * 12 + (k.frei.m - k.monat) : null;
  const kach = [
    ['Restschuld heute', fmt(k.rest, true), k.rest < 0 ? 'color:var(--prot)' : '',
      k.rest < 0 ? 'unter null — eine Korrektur nimmt mehr weg, als da ist'
                 : ML[k.monat] + ' ' + k.jahr],
    ['Schuldenfrei',
      k.unstimmig ? 'der Plan geht nicht auf' : (frei || 'nicht nach diesem Plan'),
      (k.unstimmig || !frei) ? 'color:var(--muted)' : '',
      k.unstimmig ? 'erst die Korrekturen richtigstellen'
        : (frei ? (monate > 0
                     ? 'in ' + monate + (monate === 1 ? ' Monat' : ' Monaten')
                       + ', wenn die Raten so laufen'
                     : 'keine offene Schuld mehr')
                : 'die Raten der letzten Jahre reichen nicht')],
    /* Eine Quote ausserhalb von null bis hundert ist ein Befund, keine Meldung. */
    ['Getilgt bisher', fmt(k.getilgt, true),
      (k.anfang > 0 && (k.quote < 0 || k.quote > 100)) ? 'color:var(--prot)' : '',
      k.anfang <= 0 ? 'keine Schuld mit Anfangsstand erfasst'
        : (k.quote < 0 || k.quote > 100)
          ? 'die Zahlen gehen nicht auf — ' + k.quote + ' % von ' + fmt(k.anfang, true)
          : k.quote + ' % von ' + fmt(k.anfang, true) + ' seit ' + (k.erstJahr || js[0])],
    ['Offen in ' + ML[k.monat], fmt(k.offen, true),
      k.offen > 0 ? '' : 'color:var(--gruen)',
      k.offen > 0 ? 'noch nicht erledigt — Rechtsklick hakt ab' : 'alles erledigt']
  ];
  return '<div class="band">' + kach.map(x =>
    '<span><span class="k">' + esc(x[0]) + '</span>'
    + '<span class="v" style="' + x[2] + '">' + esc(x[1]) + '</span>'
    + '<span class="m">' + esc(x[3]) + '</span></span>').join('') + '</div>';
}

/* ------------------------------------------------------------ Das Blatt */
function blatt() {
  if (!S.geladen) return leerText();
  if (S.ansicht === 'alle') return S.alleWas === 'rechnung' ? alleJahreRechnungen() : alleJahre();
  if (S.ansicht === 'rechnung') return rechnungsblatt();
  return budgetblatt();
}
/* Kein Hilfetext mehr unter der Tabelle — der steht im Handbuch hinter dem
   Fragezeichen. Hier unten stehen Anspruch und Version. */
function fusszeile() {
  return '<span class="claim">Passend | Präzise | Praktisch</span>'
    + '<span class="ver">GÄPP V ' + VERSION + '</span>';
}
function leerText() {
  return '<div class="leer"><p style="margin:0 0 14px">Noch keine Daten geladen.</p>'
    + '<p style="margin:0 0 18px;color:var(--chrome)">GÄPP hält seine Zahlen in einer JSON-Datei — '
    + 'nicht in dieser Datei hier. Lade sie vom Rechner, oder verbinde das private Repo über den Punkt oben rechts.</p>'
    + '<button class="tat" data-laden="1">Datei laden</button> '
    + '<button class="ab" data-sync-auf="1">Repo verbinden</button></div>';
}

/* Die Spalten teilen sich die Fensterbreite im Verhaeltnis ihrer Grundmasse.
   Die Summe der Grundmasse ist zugleich die Mindestbreite: darunter wird quer
   gescrollt, darueber wachsen alle Spalten mit. */
function spalten(art) {
  const b = B[art];
  return anteile(art === 'budget'
    ? [b.name, b.basis].concat(new Array(12).fill(b.monat)).concat([b.jahr])
    : [b.name, b.datum, b.betrag].concat(new Array(12).fill(b.monat)).concat([b.saldo, b.stand]));
}
function anteile(masse) {
  const ganz = masse.reduce((s,x) => s + x, 0);
  return { min: ganz, tags: '<colgroup>' + masse.map(m =>
    '<col style="width:' + (Math.round(m / ganz * 1e6) / 1e4) + '%">').join('') + '</colgroup>' };
}
function tabelle(sp, inhalt) {
  return '<table style="min-width:' + sp.min + 'px">' + sp.tags + inhalt + '</table>';
}

/* ------------------------------------------------------------ Budget */
function budgetblatt() {
  const jahr = S.jahr, b = bau(jahr);
  const kennzahl = (name, reihe, jw, stark, ende) =>
    '<tr class="kopf saldo' + (stark ? ' stark' : '') + (ende ? ' saldoende' : '') + '">'
    + '<td class="name" style="padding-left:14px">' + esc(name) + '</td>'
    + '<td></td>'
    + reihe.map(v => '<td style="font-weight:' + (stark ? 700 : 600) + '">' + F(v) + '</td>').join('')
    /* Ein Jahressaldo unter null ist ein Befund und steht nicht da wie jede
       andere Zahl — auch wenn einzelne Monate im Minus voellig normal sind. */
    + '<td class="jahr' + (jw < 0 ? ' unstimmig' : '') + '" style="font-weight:700"'
    + (jw < 0 ? ' title="Der Plan dieses Jahres geht nicht auf."' : '') + '>'
    + F(jw) + '</td></tr>';

  const kopf = '<thead><tr><th class="ecke">Budget ' + jahr + '</th><th>Basis</th>'
    + MK.map(m => '<th>' + m + '</th>').join('')
    + '<th class="jahr">Jahr / Rest</th></tr>'
    + kennzahl('Saldo budgetiert', b.saldo, su(b.saldo), true, false)
    + kennzahl('Saldo kumuliert', b.kum, b.kum[11], false, true)
    + '</thead>';

  const zeilen = ['<tr class="luft"><td colspan="15"></td></tr>'];
  const zebra = {};

  b.zeilen.forEach(z => {
    if (z.typ === 'kopf' || z.typ === 'gkopf') {
      const haupt = z.typ === 'kopf';
      zeilen.push('<tr class="' + (haupt ? 'kopf' : 'gkopf') + '" data-k="' + z.id + '"'
        + ' data-p="' + esc(z.eltern || '') + '" data-id="' + z.id + '">'
        /* Kein eigener Grund fuer die Gruppenzeile: den setzt «tr.gkopf td». Ein
           Inline-Grund gewinnt gegen die Regel und liess den Namen im hellen
           Schema weiss auf weiss stehen. */
        + '<td class="name" style="padding-left:' + (haupt ? 14 : 30) + 'px'
        + ';border-top:1px solid var(--rule)">'
        + '<button class="klapper" data-klapp="' + z.id + '" title="' + esc(z.name) + '">'
        + '<span class="chev">' + (z.auf ? '▾' : '▸') + '</span>' + esc(z.name) + '</button>'
        + (z.auf ? '' : '<span class="anzahl" title="'
            + (z.schulden ? 'Gruppen in dieser Sektion' : 'Zeilen in dieser Sektion')
            + '">' + esc(z.anzahl) + '</span>')
        + '<span class="werkzeug"><button class="plus" data-neu-pos="' + z.id + '" title="Zeile einfügen">+</button></span>'
        + '</td>'
        + '<td class="' + (z.bs < 0 ? 'unstimmig' : '') + '" style="border-top:1px solid var(--rule);font-weight:'
        + (haupt?600:500) + '">' + (z.bs ? F(z.bs) : '') + '</td>'
        + z.reihe.map((v,m) => { const gr = haupt ? kopfGruen(jahr, z.id, m) : gruppeGruen(jahr, z.id, m);
            return '<td class="' + (gr && v !== 0 ? 'gruen' : '') + '" style="border-top:1px solid var(--rule);font-weight:'
              + (haupt?600:500) + '">' + F(v) + '</td>'; }).join('')
        + '<td class="jahr' + (z.schulden !== false && z.jw < 0 ? ' unstimmig' : '')
        + '" style="border-top:1px solid var(--rule);font-weight:700">' + F(z.jw) + '</td></tr>');
      return;
    }
    if (z.typ === 'pos' && z.fix) {
      const lauf = (zebra[z.eltern] = (zebra[z.eltern] || 0) + 1);
      zeilen.push('<tr class="pos' + (lauf % 2 === 0 ? ' zebra' : '') + '" data-p="'
        + esc(z.eltern||'') + '">'
        + '<td class="name" style="padding-left:32px;color:var(--muted)">' + esc(z.name)
        + (z.marke ? '<span class="marke">' + esc(z.marke) + '</span>' : '') + '</td><td></td>'
        + z.reihe.map(v => '<td style="color:var(--muted)">' + F(v) + '</td>').join('')
        + '<td class="jahr" style="font-weight:500">' + F(z.jw) + '</td></tr>');
      return;
    }
    if (z.typ === 'pos') {
      const lauf = (zebra[z.eltern] = (zebra[z.eltern] || 0) + 1);
      zeilen.push('<tr class="pos' + (lauf % 2 === 0 ? ' zebra' : '')
        /* Gezogen wird am Griff, nicht an der Zeile: eine ziehbare Zeile laesst
           sich mit der Maus nicht mehr markieren, und dann ist ein Tippfehler
           mitten in einem Namen nicht mehr einzukreisen. */
        + (S.ziel === z.id ? ' ziel' : '') + '" data-p="' + esc(z.eltern) + '"'
        + ' data-id="' + z.id + '">'
        + '<td class="name" style="padding-left:' + (z.tief === 3 ? 52 : 32) + 'px">'
        + '<span style="display:flex;align-items:center">'
        + '<input class="namensfeld" data-p="' + z.id + '" value="' + esc(z.name) + '">'
        + (z.korr ? '<span class="mkorr" title="Manuell angepasst — Doppelklick auf Basis oder Rest zeigt die Korrekturen"></span>' : '')
        + '<span class="werkzeug"><button class="griff" draggable="true" data-griff="' + z.id + '" '
        + 'title="Verschieben — ziehen, oder mit Pfeil rauf und runter">⠿</button>'
        + '<button class="weg" data-weg="' + z.id + '" title="Zeile löschen">×</button></span></span></td>'
        + (z.schuld
            ? (z.geerbt
                ? '<td data-kb="' + z.id + '" class="' + (z.bs < 0 ? 'unstimmig' : '') + '"'
                  + (z.bs < 0 ? '' : ' style="color:var(--muted)"')
                  + ' title="Saldovortrag: Rest des Vorjahrs plus die Korrekturen dieses Jahres — gerechnet. Doppelklick korrigiert ihn.">' + F(z.bs) + '</td>'
                : '<td data-kb="' + z.id + '" class="' + (z.bs < 0 ? 'unstimmig' : '')
                  + '" title="Anfangsstand. Doppelklick korrigiert ihn.">'
                  + '<input class="zelle" data-b="' + z.id + '" value="' + F(z.bs) + '"></td>')
            : '<td data-bs="' + z.id + '" title="Doppelklick überträgt oder verteilt diesen Betrag auf die Monate">'
              + '<input class="zelle" data-b="' + z.id + '" value="' + F(z.bs) + '"></td>')
        + z.reihe.map((v,m) => { const an = hakenAn(z.id, m);
            return '<td' + (an && v !== 0 ? ' class="abgehakt"' : '') + '>'
              + '<input class="zelle' + (an && v !== 0 ? ' gruen' : '') + '" data-z="' + z.id
              + '" data-m="' + m + '" value="' + F(v) + '"></td>'; }).join('')
        + '<td class="jahr' + (z.schuld && z.jw < 0 ? ' unstimmig' : '') + '"'
        + (z.schuld ? ' data-kr="' + z.id + '" title="Rest am 31.12. — Doppelklick korrigiert ihn"' : '')
        + ' style="font-weight:500">' + F(z.jw) + '</td></tr>');
      return;
    }
    zeilen.push('<tr class="summe' + (z.stark ? ' stark kopf' : '') + '">'
      + '<td class="name" style="padding-left:' + (z.klein ? 24 : 14) + 'px;'
      + 'border-top:1px solid var(--rule);font-weight:' + (z.stark?700:600) + '">'
      + esc(z.name) + (z.marke ? '<span class="marke">' + esc(z.marke) + '</span>' : '') + '</td>'
      + '<td style="border-top:1px solid var(--rule)"></td>'
      + z.reihe.map(v => '<td style="border-top:1px solid var(--rule);font-weight:' + (z.stark?600:500)
          + '">' + F(v) + '</td>').join('')
      + '<td class="jahr" style="border-top:1px solid var(--rule);font-weight:700">' + F(z.jw) + '</td></tr>');
  });

  return tabelle(spalten('budget'), kopf + '<tbody>' + zeilen.join('') + '</tbody>');
}

/* -------------------------------------------------------- Rechnungen */
function rechnungsblatt() {
  const jahr = S.jahr, gruppen = steller(jahr);
  const kopf = '<thead><tr><th class="ecke">Rechnungssteller</th><th>Datum</th><th>Betrag</th>'
    + MK.map(m => '<th>' + m + '</th>').join('')
    + '<th>Saldo</th><th class="jahr">Stand</th></tr></thead>';

  const rMon = N12(), oMon = N12(), bMon = N12();
  let rBetrag = 0, rSaldo = 0, oBetrag = 0, bBetrag = 0;
  gruppen.forEach(g => (g.rechnungen||[]).forEach(r => {
    rBetrag += r.betrag; rSaldo += r.betrag - su(r.reihe);
    const ziel = r.stand === 'Bezahlt' ? bMon : oMon;
    if (r.stand === 'Bezahlt') bBetrag += r.betrag; else oBetrag += r.betrag;
    (r.reihe||[]).forEach((v,m) => { rMon[m] += v; ziel[m] += v; });
  }));

  const zeilen = [];
  gruppen.forEach(g => {
    const liste = g.rechnungen || [], auf = offen(g.id), mon = N12();
    let bet = 0, sal = 0, offene = 0;
    liste.forEach(r => { bet += r.betrag; sal += r.betrag - su(r.reihe);
      if (r.stand !== 'Bezahlt') offene++;
      (r.reihe||[]).forEach((v,m) => { mon[m] += v; }); });
    zeilen.push('<tr class="kopf" data-k="' + g.id + '" data-p="">'
      + '<td class="name" style="padding-left:12px;border-top:1px solid var(--rule)">'
      + '<span style="display:flex;align-items:center">'
      + '<button class="klapper" data-klapp="' + g.id + '">'
      + '<span class="chev">' + (auf ? '▾' : '▸') + '</span></button>'
      + '<input class="namensfeld" style="font-weight:700;max-width:160px" data-s="' + g.id + '" value="' + esc(g.name) + '">'
      + (auf ? '' : '<span class="anzahl" title="Rechnungen dieses Stellers">' + liste.length + '</span>')
      + '<span class="werkzeug"><button class="plus" data-neu-rech="' + g.id + '" title="Rechnung einfügen">+</button>'
      + '<button class="weg" data-weg-steller="' + g.id + '" title="Steller löschen">×</button></span>'
      + '</span></td>'
      + '<td style="border-top:1px solid var(--rule)"></td>'
      /* Auf dem Balken gilt das helle Gruen — das dunkle waere dort nicht zu lesen. */
      + '<td style="border-top:1px solid var(--rule);font-weight:600' + (offene ? '' : ';color:var(--gruenbalken)') + '">'
      + fmt(bet, true) + '</td>'
      + mon.map((v,m) => { const gr = stellerGruen(g,m);
          return '<td style="border-top:1px solid var(--rule);font-weight:600'
            + (gr && v !== 0 ? ';color:var(--gruenbalken)' : '') + '">' + F(v) + '</td>'; }).join('')
      + '<td style="border-top:1px solid var(--rule);font-weight:700">'
      + (Math.abs(sal) < 0.5 ? '—' : fmt(sal, true)) + '</td>'
      + '<td class="jahr" style="border-top:1px solid var(--rule);font-weight:600'
      + (offene ? '' : ';color:var(--gruenbalken)') + '">'
      + (offene ? offene + ' offen' : 'bezahlt') + '</td></tr>');
    if (!auf) return;
    let lauf = 0;
    liste.forEach(r => {
      const sa = r.betrag - su(r.reihe), bez = r.stand === 'Bezahlt';
      const gf = bez ? ' gruen' : '';
      lauf++;
      zeilen.push('<tr class="pos' + (lauf % 2 === 0 ? ' zebra' : '') + '" data-p="' + g.id + '">'
        + '<td class="name" style="padding-left:30px">'
        + '<span style="display:flex;align-items:center">'
        + '<input class="namensfeld" data-r="' + r.id + '" data-f="zweck" value="' + esc(r.zweck) + '">'
        + '<span class="werkzeug"><button class="weg" data-weg-rech="' + r.id + '" title="Rechnung löschen">×</button></span>'
        + '</span></td>'
        + '<td><input class="datumsfeld" data-r="' + r.id + '" data-f="datum" value="' + esc(r.datum) + '"></td>'
        + '<td><input class="zelle' + gf + '" data-r="' + r.id + '" data-f="betrag" data-bez="' + r.id + '" value="'
        + fmt(r.betrag, true) + '"></td>'
        + (r.reihe||N12()).map((v,m) => { const an = monatBezahlt(r,m);
            return '<td' + (an && v !== 0 ? ' class="abgehakt"' : '') + '>'
              + '<input class="zelle' + (an && v !== 0 ? ' gruen' : '') + '" data-rm="' + r.id
              + '" data-m="' + m + '" value="' + F(v) + '"></td>'; }).join('')
        + '<td style="font-weight:' + (Math.abs(sa) < 0.5 ? '400' : '600') + ';color:'
        + (Math.abs(sa) < 0.5 ? 'var(--muted)' : 'var(--ink)') + '">'
        + (Math.abs(sa) < 0.5 ? '—' : fmt(sa, true)) + '</td>'
        + '<td class="jahr"><select class="stand" data-r="' + r.id + '" data-f="stand" style="color:'
        + (bez ? 'var(--gruen)' : (r.stand === 'Nicht eingetroffen' ? 'var(--chrome)' : 'var(--ink)')) + '">'
        + STAENDE.map(s => '<option' + (s === r.stand ? ' selected' : '') + '>' + s + '</option>').join('')
        + '</select></td></tr>');
    });
  });

  const summe = (name, betrag, mon, saldo, gruen, stark) =>
    '<tr class="' + (stark ? 'summe stark kopf' : 'hoch') + '">'
    + '<td class="name" style="padding-left:12px;border-top:1px solid var(--'
    + (stark ? 'rule' : 'line') + ');font-weight:' + (stark ? 700 : 600) + ';color:var(--'
    + (stark ? 'aufbalken' : 'muted') + ')">' + esc(name) + '</td>'
    + '<td style="border-top:1px solid var(--' + (stark?'rule':'line') + ')"></td>'
    + '<td style="border-top:1px solid var(--' + (stark?'rule':'line') + ');font-weight:'
    + (stark?600:500) + (gruen ? ';color:var(--gruen)' : '') + '">' + fmt(betrag, true) + '</td>'
    + mon.map(v => '<td style="border-top:1px solid var(--' + (stark?'rule':'line') + ');font-weight:'
        + (stark?600:500) + (gruen ? ';color:var(--gruen)' : '') + '">' + fmt(v, true) + '</td>').join('')
    + '<td style="border-top:1px solid var(--' + (stark?'rule':'line') + ');font-weight:700">'
    + (saldo === null ? '' : fmt(saldo, true)) + '</td>'
    + '<td class="jahr" style="border-top:1px solid var(--' + (stark?'rule':'line') + ')"></td></tr>';
  zeilen.push(summe('Total', rBetrag, rMon, rSaldo, false, true));
  zeilen.push(summe('davon offen', oBetrag, oMon, null, false, false));
  zeilen.push(summe('davon bezahlt', bBetrag, bMon, null, true, false));

  return tabelle(spalten('rech'), kopf + '<tbody>' + zeilen.join('') + '</tbody>')
    + '<button class="neusteller" data-neu-steller="1">+ Neuer Rechnungssteller</button>';
}

/* -------------------------------------------------------- Alle Jahre */
function alleJahre() {
  const js = jahre(), bauten = js.map(j => bau(j, true));
  const kopfW = (b,n) => { const z = b.zeilen.find(x => x.typ === 'kopf' && x.name === n); return z ? su(z.reihe) : 0; };
  const restW = (b,n) => { const z = b.zeilen.find(x => x.typ === 'kopf' && x.name === n); return z ? z.jw : 0; };
  const grW   = (b,n) => { const z = b.zeilen.find(x => x.typ === 'gkopf' && x.name === n); return z ? su(z.reihe) : 0; };
  /* Die Aufgliederung wird aus den Daten gelesen, nicht aufgezaehlt. Eine feste
     Liste laesst eine neue Kategorie aus der Aufgliederung fallen und trotzdem
     in der Summe stehen — dann sind Zahlen da, die nirgends erscheinen. */
  const ausgabeNamen = [], gruppenNamen = [];
  let schuldName = 'Verbindlichkeiten';
  js.forEach(j => (S.daten[j]||[]).forEach(b => {
    if (b.art === 'schulden') { schuldName = b.name;
      (b.gruppen||[]).forEach(g => { if (gruppenNamen.indexOf(g.name) < 0) gruppenNamen.push(g.name); }); }
    else if (b.vz !== 1 && ausgabeNamen.indexOf(b.name) < 0) ausgabeNamen.push(b.name);
  }));
  const def = [['Einnahmen', b => su(b.einnahmen), {stark:1}]]
    .concat(ausgabeNamen.map(n => [n, b => kopfW(b,n), {tief:1}]))
    .concat(gruppenNamen.map(n => [n, b => grW(b,n), {tief:1}]))
    .concat([
      ['Raten zusammen',       b => kopfW(b, schuldName),   {}],
      ['Rechnungen',           b => su(b.rech),             {tief:1}],
      ['Ausgaben',             b => su(b.ausgaben),         {stark:1}],
      ['Saldo',                b => su(b.saldo),            {stark:1}],
      ['Restschuld am 31.12.', b => restW(b, schuldName),   {stark:1, letzte:1}]
    ]);
  const kopf = '<thead><tr><th class="ecke">Alle Jahre</th>'
    + js.map(j => '<th>' + j + '</th>').join('')
    + '<th class="jahr">Total</th></tr></thead>';
  const zeilen = def.map(([name, fn, o]) => {
    const w = bauten.map(fn);
    const total = o.letzte ? w[w.length-1] : w.reduce((s,x) => s+x, 0);
    return '<tr class="' + (o.stark ? 'kopf stark' : 'hoch') + '">'
      + '<td class="name" style="padding-left:' + (o.tief ? 32 : 14) + 'px;'
      + 'border-top:1px solid var(--' + (o.stark ? 'rule' : 'line') + ');font-weight:'
      + (o.stark ? 700 : (o.tief ? 400 : 600)) + ';color:var(--'
      + (o.stark ? 'aufbalken' : (o.tief ? 'muted' : 'ink')) + ')">'
      + esc(name) + '</td>'
      + w.map(v => '<td style="border-top:1px solid var(--' + (o.stark?'rule':'line') + ');font-weight:'
          + (o.stark?600:500) + '">' + F(v) + '</td>').join('')
      + '<td class="jahr" style="border-top:1px solid var(--' + (o.stark?'rule':'line')
      + ');font-weight:700">' + F(total) + '</td></tr>';
  }).join('');
  const bre = Math.max(110, Math.min(210, Math.floor(1010 / Math.max(1, js.length))));
  const sp = anteile([B.budget.name].concat(js.map(() => bre)).concat([B.budget.jahr]));
  return tabelle(sp, kopf + '<tbody>' + zeilen + '</tbody>');
}

/* -------------------------------------- Alle Jahre, Rechnungen -----------
   Analog zum Budget: ein Jahr ist eine Spalte, eine Zeile ist ein Steller.
   Gezeigt wird der Rechnungsbetrag — die fuehrende Zahl der Rechnungstafel. */
function alleJahreRechnungen() {
  const js = jahre();
  const namen = [];
  js.forEach(j => steller(j).forEach(g => {
    if (namen.indexOf(g.name) < 0) namen.push(g.name); }));
  namen.sort((a,b) => String(a).localeCompare(String(b), 'de-CH', { sensitivity:'base', numeric:true }));

  const betragVon = (j, name, filter) => steller(j)
    .filter(g => g.name === name)
    .reduce((s,g) => s + (g.rechnungen||[])
      .filter(r => !filter || filter(r))
      .reduce((t,r) => t + (r.betrag||0), 0), 0);

  const kopf = '<thead><tr><th class="ecke">Alle Jahre · Rechnungen</th>'
    + js.map(j => '<th>' + j + '</th>').join('')
    + '<th class="jahr">Total</th></tr></thead>';

  const zeile = (name, werte, o) =>
    '<tr class="' + (o.stark ? 'kopf stark' : 'hoch') + '">'
    + '<td class="name" style="padding-left:' + (o.tief ? 32 : 14) + 'px;'
    + 'border-top:1px solid var(--' + (o.stark ? 'rule' : 'line') + ');font-weight:'
    + (o.stark ? 700 : (o.tief ? 400 : 600)) + ';color:var(--'
    + (o.stark ? 'aufbalken' : (o.tief ? 'muted' : 'ink')) + ')">'
    + esc(name) + '</td>'
    + werte.map(v => '<td style="border-top:1px solid var(--' + (o.stark?'rule':'line')
        + ');font-weight:' + (o.stark?600:500) + (o.gruen ? ';color:var(--gruen)' : '') + '">'
        + F(v) + '</td>').join('')
    + '<td class="jahr" style="border-top:1px solid var(--' + (o.stark?'rule':'line')
    + ');font-weight:700' + (o.gruen ? ';color:var(--gruen)' : '') + '">'
    + F(werte.reduce((s,x) => s+x, 0)) + '</td></tr>';

  /* Was im Budget als Zeile «Rechnungen» steht, ist die auf Monate verteilte
     Summe — nicht die Summe der Rechnungsbetraege. Beide stehen hier mit Namen
     nebeneinander, damit ein Klick weiter nicht zwei Zahlen fuer dasselbe zeigt. */
  const verteiltIn = j => (S.rechnungen[j]||[]).reduce((s,g) =>
    s + (g.rechnungen||[]).reduce((t,r) => t + su(r.reihe), 0), 0);

  const leer = !namen.length;
  const zeilen = namen.map(n => zeile(n, js.map(j => betragVon(j, n)), { tief:1 })).join('')
    + zeile('Rechnungsbeträge zusammen',
        js.map(j => namen.reduce((s,n) => s + betragVon(j, n), 0)), { stark:1 })
    + zeile('davon offen',
        js.map(j => namen.reduce((s,n) => s + betragVon(j, n, r => r.stand !== 'Bezahlt'), 0)), {})
    + zeile('davon bezahlt',
        js.map(j => namen.reduce((s,n) => s + betragVon(j, n, r => r.stand === 'Bezahlt'), 0)),
        { gruen:1 })
    + zeile('auf Monate verteilt', js.map(verteiltIn), { stark:1 });

  const bre = Math.max(110, Math.min(210, Math.floor(1010 / Math.max(1, js.length))));
  const sp = anteile([B.budget.name].concat(js.map(() => bre)).concat([B.budget.jahr]));
  if (leer) return tabelle(sp, kopf + '<tbody></tbody>')
    + '<div class="leer">In keinem Jahrgang steht eine Rechnung.</div>';
  return tabelle(sp, kopf + '<tbody>' + zeilen + '</tbody>');
}

      + '<button class="ab" data-frisch="1" title="Browserspeicher verwerfen und gaepp-daten.json neu holen">Startdatei holen</button>'

  if (S.basis) h += basisDialog();
  if (S.korr)  h += korrDialog();
  if (S.korrWarn) h += korrWarnDialog();
  if (S.hb)    h += handbuchDialog();
  return h;
}

/* ---- Saldokorrektur bei Schulden ---------------------------------------- */
function korrDialog() {
  const k = S.korr, p = posVon(k.jahr, k.gKey, k.pKey);
  if (!p) return '';
  const liste = korrListe(p, k.art);
  const summe = korrSum(p, k.art);
  const jetzt = k.art === 'basis'
    ? basisVon(k.jahr, k.gKey, k.pKey, p.basis)
    : restVon(k.jahr, k.gKey, k.pKey);
  const titel = k.art === 'basis'
    ? 'Saldo Vortrag ' + k.jahr : 'Rest am 31.12.' + k.jahr;
  const vz = n => (n > 0 ? '+' : n < 0 ? '−' : '') + fmt(Math.abs(n), true);

  const zeilen = liste.length ? liste.map(x =>
      '<div class="korrzeile">'
      + '<input class="feld betrag" data-korr-b="' + esc(x.id) + '" value="' + vz(x.betrag) + '">'
      + '<input class="feld" data-korr-n="' + esc(x.id) + '" value="' + esc(x.notiz || '')
      + '" placeholder="Notiz">'
      + '<button class="weg" data-korr-weg="' + esc(x.id) + '" title="Korrektur entfernen">×</button>'
      + '</div>').join('')
    : '<div class="leerzeile">Noch keine Korrektur an dieser Zahl.</div>';

  return '<div class="schleier" data-schleier="korr"><div class="dialog">'
    + '<h2>«' + esc(k.name) + '» — ' + titel + '</h2>'
    + '<div class="vorschau">Gerechnet <b>' + fmt(jetzt - summe, true) + '</b>'
    + ' &nbsp;·&nbsp; Korrektur <b>' + vz(summe) + '</b>'
    + ' &nbsp;·&nbsp; Ergebnis <b>' + fmt(jetzt, true) + '</b></div>'
    + '<p>' + (k.art === 'basis'
        ? 'Die Korrektur wirkt auf den Anfangssaldo dieses Jahres und wandert von dort '
          + 'in alle Folgejahre.'
        : 'Die Korrektur wirkt auf den Stand am 31.12. und ist im Folgejahr automatisch '
          + 'der Anfangssaldo — ohne dass du etwas auslösen musst.') + '</p>'
    + '<div class="reihe">'
    + '<div style="flex:none"><label>Richtung</label><span class="wahl">'
    + '<button' + (k.richtung !== 'minus' ? ' class="an"' : '') + ' data-korr-richt="plus">Erhöhen</button>'
    + '<button' + (k.richtung === 'minus' ? ' class="an"' : '') + ' data-korr-richt="minus">Reduzieren</button>'
    + '</span></div>'
    + '<div><label>Betrag in Franken</label>'
    + '<input class="feld" data-korr-betrag="1" value="' + esc(k.betrag) + '"></div>'
    + '</div>'
    + '<div><label>Notiz</label><input class="feld" data-korr-notiz="1" value="' + esc(k.notiz)
    + '" placeholder="Warum wird korrigiert?"></div>'
    + '<div class="tasten"><button class="tat" data-korr-add="1">Korrektur eintragen</button></div>'
    + '<div><label>Bisherige Korrekturen</label><div class="korrliste">' + zeilen + '</div></div>'
    + '<div class="tasten"><button class="ab" data-zu="korr">Schliessen</button></div>'
    + '</div></div>';
}

/* ---- Handbuch ------------------------------------------------------------
   Es steht hinter dem Fragezeichen oben und nicht mehr unter der Tabelle.
   Wo es eine Zahl oder einen Namen nennt, die der Code fuehrt, liest es sie
   aus dem Code — abgeschriebenes veraltet, gelesenes nicht. */
function handbuchDialog() {
  return '<div class="schleier" data-schleier="hb"><div class="dialog gross">'
    + '<h2>Handbuch — GÄPP V ' + VERSION + '</h2>'
    + '<div class="handbuch">'

    + '<h3>Was GÄPP ist</h3>'
