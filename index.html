}
function istGruppe(gruppe, j, m) {
  const ids = verbAlle(j).filter(v => v.gruppe === gruppe).map(v => v.id);   /* U-49 */
  return rd(D.buchungen.reduce((s,b) => {
    if (!b.verbId || !ids.includes(b.verbId)) return s;
    const d = ymOf(b.datum);
    return (d.j === j && d.m === m) ? s + Math.abs(b.betrag) : s;
  }, 0));
}
function istVerb(v, j, m) {
  return rd(D.buchungen.reduce((s,b) => {
    if (b.verbId !== v.id) return s;
    const d = ymOf(b.datum);
    return (d.j === j && d.m === m) ? s + Math.abs(b.betrag) : s;
  }, 0));
}
/* Eine bezahlte Rechnung ist keine offene mehr — mehr braucht es hier nicht.
   Gefiltert wird mit rechnungImBudget(), demselben Praedikat wie in
   gespiegelteRechnung(): sonst zaehlte das Ist eine Rechnung mit, die das
   Soll gar nie enthielt. */
function istRechnungen(j, m) {
  return rd(D.rechnungen.reduce((s,r) => {
    const f = ymOf(r.faelligkeit);
    return (r.status !== 'offen' && rechnungImBudget(r) && f.j === j && f.m === m) ? s + r.betrag : s;
  }, 0));
}
function istKat(k, j, m) {
  return rd(zeilenVon(k.id, j).reduce((s,z) => s + istZeile(z, j, m), 0));
}

/* ===================================================================
   U-40 — Das Band: budgetiert und nicht gebucht
   -------------------------------------------------------------------
   Die einzige Handlungsliste, die GAEPP aus vorhandenen Zahlen erzeugen
   kann, ohne eine neue zu erfinden: Soll minus Ist, Position fuer
   Position. Damit wird das Budget vom Nachweis zur Arbeitsflaeche.

   Eine gespiegelte Zeile wird in ihre Glaeubiger aufgeloest — «Rate
   Staatssteuer 2021» ist eine Sache, «Verbindlichkeiten 1'200» keine.

   ZWEI AUSSCHLUESSE, und beide sind Absicht:
   — Einkommen (k.richtung === 'ein'). Einen Lohn bucht man, wenn er
     kommt; er ist keine offene Handlung.
   — Zeilen mit `gegenrichtung`. Sie stehen in einer Ausgabenkategorie
     und mindern sie — eine Rueckerstattung, kein zu zahlender Posten.
     Der Bauplan kennt `gegenrichtung` nicht; ohne diesen Ausschluss
     stuende ein erwarteter Zufluss unter «noch offen» und die Summe
     des Bands zaehlte ihn wie eine Schuld mit.
   =================================================================== */
function offenPosten(j, m) {
  const out = [];
  D.kategorien.filter(k => katSicht(k, j)).forEach(k => {
    if (k.richtung === 'ein') return;
    zeilenVon(k.id, j).forEach(z => {
      if (z.gegenrichtung) return;
      /* Die Schuldenzeile: ihr Ist haengt an verbId, nicht an zeileId —
         deshalb je Glaeubiger gefragt und je Glaeubiger gezeigt. */
      if (zeileGruppe[z.id]) {
        verbAlle(j).filter(v => v.gruppe === zeileGruppe[z.id])       /* U-49 */
          .forEach(v => {
            const rest = rd(rate(v, j, m) - istVerb(v, j, m));
            if (rest > 0.005) out.push({ name:'Rate ' + v.bezeichnung, betrag:rest,
              kat:k.name, weg:'', kontoId:v.kontoId, verbId:v.id });
          });
        return;
      }
      if (z.gespiegeltAus === 'rechnungen') {
        D.rechnungen.forEach(r => {
          const f = ymOf(r.faelligkeit);
          if (r.status === 'offen' && rechnungImBudget(r) && f.j === j && f.m === m)
            out.push({ name: (steller(r.stellerId) || {}).name || 'Rechnung',
              betrag:r.betrag, kat:k.name, weg:'fällig ' + kurzdatum(r.faelligkeit),
              kontoId:r.kontoId, rechId:r.id });
        });
        return;
      }
      const rest = rd(zeilenwert(z, j, m) - istZeile(z, j, m));
      if (rest > 0.005) out.push({ name:z.bezeichnung, betrag:rest, kat:k.name,
        weg:zahlungsweg(z), kontoId:k.kontoId, zeileId:z.id });
    });
  });
  return out.sort((a,b) => b.betrag - a.betrag);
}
/* ---- U-45: Die offenen Posten als Blatt -----------------------------
   Die Zahl steht in der Kopfzeile, die Liste kommt auf Klick. Das Band ueber
   den Karten war bei drei Posten eine Handlungsliste und bei dreiundzwanzig
   eine Wand; ein Blatt rollt und verstellt nichts.
   Gebucht wird von hier aus mit denselben drei Griffen wie ueberall —
   Glaeubigerblatt, rechnungBezahlen(), vorbelegte Buchungsmaske. Sie gehen
   UEBER dieses Blatt auf (blattAuf(..., ueber)), damit man nach dem Buchen
   wieder in der Liste steht und den naechsten Posten nehmen kann. */
function blattOffen() {
  const j = S.jahr, m = S.monat;
  const p = offenPosten(j, m);
  const sum = rd(p.reduce((s,x) => s + x.betrag, 0));
  const griff = x => {
    if (x.verbId) return `data-schuld="${x.verbId}"`;
    if (x.rechId) return `data-tat="rstatus:${x.rechId}"`;
    return konto(x.kontoId) ? `data-buchen="${x.zeileId}:${x.kontoId}:${fmt(x.betrag)}"` : '';
  };
  const koerper = !p.length
    ? '<p class="meldung">Diesen Monat ist alles gebucht, was budgetiert war.</p>'
    : `<table class="journal"><tbody>${p.map(x => {
        const g = griff(x);
        return `<tr><td>${x.name}<span class="weg" style="margin-left:9px">${
            [x.kat, x.weg].filter(Boolean).join(' · ')}</span></td>
          <td class="r num">${fmtG(x.betrag)}</td>
          <td class="r"><span class="zwerk">${g
            ? `<button class="knopf klein primaer" type="button" ${g}>Buchen</button>`
            : '<span class="weg">kein Konto</span>'}</span></td></tr>`;
      }).join('')}</tbody></table>`;
  return {
    weit: true, kennung: 'Budget · ' + MON_LANG[m] + ' ' + j,
    titel: 'Noch offen: ' + fmtG(sum),
    koerper: `<p class="notiz">Budgetiert und nicht gebucht. <b>Nach dem Buchen bleibt
      der Saldo, wie er ist</b> — die Zahl war schon drin, sie war nur noch nicht belegt.</p>
      ${koerper}`,
    fuss: `<span class="hint">${p.length} ${p.length === 1 ? 'Position' : 'Positionen'}</span>
      <button class="knopf" data-zu>Schliessen</button>`
  };
}

/* ---- U-48: Das Blatt der monatlichen Umbuchungen --------------------
   Merker fuer das, was DIESE Maske gebucht hat. Nur damit laesst sich eine
   Fehlbuchung aendern statt verdoppeln. Er lebt in der Sitzung, nicht in den
   Daten: Nach dem Neuladen ist der Monat teilweise bedient, der Vorschlag
   zeigt den Rest, und «Buchen» legt richtigerweise eine zweite Buchung an. */
let _umbB = {};        /* kontoId -> buchungId */
let _umbF = {};        /* kontoId -> was im Feld steht, ueber das Neuzeichnen hinweg */

/* Eine gemerkte Buchung, die es nicht mehr gibt — geloescht, oder von
   Rueckgaengig weggenommen —, darf nicht weiter als «gebucht» gelten. */
function umbMerkerPutzen() {
  Object.keys(_umbB).forEach(kId => {
    if (!D.buchungen.some(b => b.id === _umbB[kId])) delete _umbB[kId];
  });
}
function umbGebucht(kId) {
  const b = D.buchungen.find(x => x.id === _umbB[kId]);
  return b ? b.betrag : 0;
}
/* Die Felder vor jedem Neuzeichnen sichern — sonst verliert das Buchen einer
   Zeile die halb getippten Betraege der anderen. Dasselbe wie entwurfSichern(). */
function umbFelderSichern() {
  $$('#blattKoerper input[data-umbf]').forEach(el => {
    _umbF[el.dataset.umbf] = el.value.trim() === '' ? 0 : zahl(el.value);
  });
}

function blattUmbuch() {
  umbMerkerPutzen();
  const j = S.jahr, m = S.zeitraum === 'monat' ? S.monat : ymOf(heuteISO()).m;
  const q = umbZeilen(j, m), quelle = umbQuelle();
  const qSaldo = quelle ? kontosaldo(quelle.id, j, m) : 0;

  const zeilen = q.map(z => {
    const geb  = umbGebucht(z.k.id);
    const wert = _umbF[z.k.id] !== undefined ? _umbF[z.k.id] : (geb || z.offen || 0);
    const aend = geb > 0 && Math.abs(wert - geb) < 0.005;
    /* Kein Knopf statt eines grauen: steht nichts zu tun an, ist er nicht da. */
    const knopf = (!wert && !geb) ? ''
      : `<button class="knopf klein" type="button" data-umb="${z.k.id}">${aend ? 'Ändern' : 'Buchen'}</button>`;
    return `<tr${geb > 0 ? ' class="umb-bewegt"' : ''}>
      <td>${z.k.nr} ${z.k.name}</td>
      <td class="r num">${fmt(kontosaldo(z.k.id, j, m))}</td>
      <td class="r num">${z.soll === null ? '–' : fmt(z.soll)}</td>
      <td class="r num umb-schon">${z.schon ? fmt(z.schon) : '–'}</td>
      <td class="r"><input class="num" type="text" inputmode="decimal" data-umbf="${z.k.id}"
            value="${wert ? fmt(wert) : ''}" placeholder="0.00" aria-label="Betrag ${z.k.name}"></td>
      <td class="r"><span class="zwerk">${z.soll === null ? '<span class="weg">kein Soll</span>' : ''}${knopf}</span></td>
    </tr>`;
  }).join('');

  const summe = rd(q.reduce((s, z) => {
    const geb = umbGebucht(z.k.id);
    const w = _umbF[z.k.id] !== undefined ? _umbF[z.k.id] : (geb || z.offen || 0);
    return s + Math.max(0, rd(w - geb));
  }, 0));
  const rest = rd(qSaldo - summe);

  const koerper = !quelle
    ? '<p class="meldung">Es gibt noch kein Konto. Du legst eines in der Verwaltung unter «Struktur» an.</p>'
    : `<div class="kennzahlen">
        <span class="wert"><span class="k">Quellkonto</span><span class="v">${quelle.nr} ${quelle.name}</span></span>
        <span class="wert"><span class="k">Saldo</span><span class="v">${fmt(qSaldo)}</span></span>
      </div>
      <table class="journal umb-tab"><thead><tr><th>Zielkonto</th><th class="r">Saldo</th>
        <th class="r">Soll Monat</th><th class="r">schon</th><th class="r">Betrag</th><th class="r"></th></tr></thead>
        <tbody>${zeilen || '<tr><td colspan="6"><span class="meldung">Kein weiteres Konto.</span></td></tr>'}</tbody></table>`;

  return {
    weit: true,
    kennung: 'Umbuchung · ' + MON_LANG[m] + ' ' + j,
    titel: 'Monatliche Umbuchungen',
    koerper,
    fuss: `<div class="kennzahlen" style="margin:0 auto 0 0">
        <span class="wert"><span class="k">Summe</span><span class="v">${fmt(summe)}</span></span>
        <span class="wert"><span class="k">Rest auf ${quelle ? quelle.name : '—'}</span>
          <span class="v${rest < 0 ? ' neg' : ''}">${fmt(rest)}</span></span>
      </div>
      ${rest < 0 ? `<span class="hint" style="color:var(--err)">übersteigt den Saldo um ${fmt(-rest)}</span>` : ''}
      <button class="knopf" data-zu>Schliessen</button>
      ${summe ? '<button class="knopf primaer" data-umball>Alle buchen</button>' : ''}`
  };
}

/* Buchen, Aendern und Zuruecknehmen in einem Weg. Bei 0 wird die gemerkte
   Buchung geloescht — dieselbe Handlung, die sie erzeugt hat, nimmt sie
   zurueck. */
function umbBuchen(kId, betrag, ohneMerker) {
  const q = umbQuelle();
  if (!q || q.id === kId) return;
  const alt = D.buchungen.find(b => b.id === _umbB[kId]);
  const neu = rd(betrag);
  if (alt && Math.abs(alt.betrag - neu) < 0.005) return;
  if (!alt && !neu) return;

  const zk = konto(kId);
  /* Bei «Alle buchen» merkt der Aufrufer EINMAL vorher — sonst ueberschriebe
     jede Zeile den Merker der vorigen, und Rueckgaengig naehme nur die letzte
     der sieben zurueck. Dieselbe Falle wie bei uebertragenTun(). */
  if (!ohneMerker) merkeStand(!neu ? 'Umbuchung auf ' + zk.name + ' zurückgenommen'
           : alt  ? 'Umbuchung auf ' + zk.name + ' geändert auf ' + fmt(neu)
                  : 'Umgebucht auf ' + zk.name + ': ' + fmt(neu));

  if (alt && !neu) {
    D.buchungen = D.buchungen.filter(b => b.id !== alt.id);
    delete _umbB[kId];
  } else if (alt) {
    alt.betrag = neu;
  } else {
    const j = S.jahr, m = S.zeitraum === 'monat' ? S.monat : ymOf(heuteISO()).m;
    const h = ymOf(heuteISO());
    /* Im laufenden Monat der heutige Tag, sonst der Monatsletzte — eine
       Umbuchung fuer September darf nicht auf den 19. August fallen. */
    const datum = (h.j === j && h.m === m) ? heuteISO() : iso(j, m, tageImMonat(j, m));
    const b = {
      id: neueId('b'), datum, ganzerMonat: false, kontoId: q.id, art: 'umbuchung',
      betrag: neu, gegenkontoId: kId, zeileId: null,
      text: 'Monatliche Umbuchung', serieId: null, rechnungId: null,
      verbId: null, sparzielId: null, belegDatei: null, belegOffen: false
    };
    D.buchungen.push(b);
    _umbB[kId] = b.id;
  }
  _umbF[kId] = neu;
  persist();
  blattZeichnen();
}

/* U-45: Hier stand offenStreifen(), das Band ueber den Kategorie-Karten.
   Es ist raus. Der Gedanke war richtig und die Form falsch: bei drei offenen
   Posten war es eine Handlungsliste, bei dreiundzwanzig eine Wand aus Kacheln,
   die den Blick auf die Kategorien verstellte — und die Kategorie-Karte sagt
   mit ihrer Spalte «Rest» ohnehin schon, wo etwas offen ist.
   offenPosten() BLEIBT: die Kopfzeile rechnet damit «Noch offen im Monat»,
   und eine Liste dazu laesst sich jederzeit wieder anhaengen. */

/* ===================================================================
   U-40 — CSV
   -------------------------------------------------------------------
   Ein Export, der etwas anderes zeigt als der Bildschirm, ist eine
   zweite Wahrheit. Deshalb dieselben Praedikate wie die Tabelle:
   Zeitraum, Kategorienfilter, Spaltenfaltung — und zwar woertlich
   dieselben Ausdruecke wie in budgetTabelle() und verbindTabelle(),
   nicht sinngemaess nachgebaute. Ein Praedikat, das «fast dasselbe»
   tut, faltet eines Tages eine andere Spalte weg.

   ZEILENFALTUNG FOLGT NICHT, und das ist eine Entscheidung: sie
   versteckt Zeilen, die im ganzen Zeitraum null tragen. Am Bildschirm
   ist das Platzersparnis, in einer Datei kostet eine Nullzeile nichts —
   und ihr Fehlen waere schwerer zu erklaeren als ihr Dasein. Die
   SPALTEN dagegen folgen, denn sie sind Zeitraeume: ein Export mit
   anderen Monaten als der Bildschirm waere wirklich eine zweite
   Wahrheit.

   Gebaut wird aus dem Modell, nicht aus dem DOM: in der Tabelle stehen
   Eingabefelder, aus denen ein Abzug halb getippte Werte laese, und in
   der Kartenansicht gibt es gar kein DOM dafuer.

   Format: UTF-8 mit BOM, `sep=;` als erste Zeile, Dezimalkomma — damit
   Excel die Datei ohne Importdialog richtig oeffnet.
   =================================================================== */
function csvExport(bereich) {
  const alle = S.zeitraum === 'alle', spAlle = spaltenKoepfe();
  const zahlT = x => (x === null || x === undefined || x === '') ? ''
    : String(rd(x)).replace('.', ',');
  const zell = x => {
    const s = String(x === null || x === undefined ? '' : x);
    return /[;"\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  };
  let kopf = [], reihen = [];

  if (bereich === 'verbind') {
    /* U-49: der Export zeigt, was die Ansicht zeigt — sonst stuende im CSV
       ein Glaeubiger, den der Bildschirm daneben nicht fuehrt. */
    const aktiv = alle
      ? D.verbindlichkeiten.filter(v => spAlle.some(x => verbSicht(v, x.key)))
      : verbAlle(S.jahr);
    const ratenSp = (v,s) => alle
      ? rd([...Array(12).keys()].reduce((a,m)=>a+rate(v,s.key,m),0)) : rate(v, S.jahr, s.key);
    /* Dasselbe Praedikat wie verbindTabelle — inklusive der beiden
       Kopfzahlen. Wer nur die Raten fragt, faltet eine Spalte weg, deren
       Saldo im Jahrestotal weiterzaehlt. */
    const sp = spaltenSicht(spAlle, () => true).filter(s => !s.falt);   /* U-43 */
    kopf = ['Gruppe','Gläubiger','Stand heute','Rate ' + MON[S.monat],'Getilgt %','Vereinbarung bis',
      ...sp.map(s => s.label), 'Übertrag'];
    const zeile = (gname, v) => reihen.push([gname, v.bezeichnung,
      zahlT(verbindStandHeute(v)), zahlT(rate(v, S.jahr, S.monat)),
      Math.round(getilgtAnteil(v)*100), v.vereinbarungBis || '',
      ...sp.map(s => zahlT(ratenSp(v, s))),
      zahlT(spAlle.length ? (alle ? verbindPrognose(v, spAlle[spAlle.length-1].key, 11)
                                  : verbindPrognose(v, S.jahr, spAlle[spAlle.length-1].key)) : 0)]);
    GRUPPEN.forEach(g => ordListe('verb', g.id).filter(v => aktiv.includes(v))   /* U-49 */
      .forEach(v => zeile(g.name, v)));
    /* Auch die ohne gueltige Gruppe — sie zaehlen in der Summenzeile der
       Tabelle mit und fehlten sonst in der Datei, die diese Summe erklaeren
       soll. Genau der Grund, aus dem die Karten sie zeigen. */
    aktiv.filter(v => !GRUPPEN.some(g => g.id === v.gruppe))
      .forEach(v => zeile('Ohne Gruppe', v));
  } else {
    const kats = D.kategorien.filter(k => alle ? spAlle.some(s => katSicht(k, s.key))
      : katSicht(k, S.jahr)).sort((a,b) => a.rang - b.rang);
    const gewaehlt = (S.filterNur || []).filter(id => kats.some(k => k.id === id));
    const sicht = gewaehlt.length ? kats.filter(k => gewaehlt.includes(k.id)) : kats;
    const spJahr = s => alle ? s.key : S.jahr;
    const wert = (z,s) => alle ? zeilenJahr(z, s.key) : zeilenwert(z, S.jahr, s.key);
    const katW = (k,s) => alle
      ? rd(zeilenVon(k.id, s.key).reduce((a,z)=>a+zeilenJahr(z,s.key)*(z.gegenrichtung?-1:1),0))
      : katSumme(k, S.jahr, s.key);
    /* Wieder woertlich das Praedikat der Tabelle (hatWert in budgetTabelle). */
    const sp = spaltenSicht(spAlle, () => true).filter(s => !s.falt);   /* U-43 */
    kopf = ['Kategorie','Position','Zahlung','Soll', ...sp.map(s => s.label), 'Jahr'];
    sicht.forEach(k => {
      zeilenVon(k.id, S.jahr).forEach(z => {
        reihen.push([k.name, z.bezeichnung, zahlungsweg(z), zahlT(zeilenSoll(z, S.jahr)),
          ...sp.map(s => zahlT(wert(z,s))), zahlT(zeilenJahr(z, S.jahr))]);
      });
      reihen.push(['', 'Summe ' + k.name, '', '',
        ...sp.map(s => zahlT(katW(k,s))),
        zahlT(rd(spAlle.reduce((a,s)=>a+katW(k,s),0)))]);
    });
    reihen.push([]);
    reihen.push(['', 'Saldo budgetiert', '', '',
      ...sp.map(s => zahlT(saldoRoh(s, alle))), zahlT(rd(spAlle.reduce((a,s)=>a+saldoRoh(s,alle),0)))]);
    reihen.push(['', 'Saldo kumuliert', '', '',
      ...sp.map(s => zahlT(kumRoh(s, alle))), '']);
  }

  const stand = alle ? 'alle-Jahre'
    : S.zeitraum === 'jahr' ? String(S.jahr)
    : S.jahr + '-' + String(S.monat+1).padStart(2,'0');
  const txt = '﻿sep=;\n' + [kopf, ...reihen]
    .map(r => r.map(zell).join(';')).join('\r\n') + '\r\n';
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([txt], { type:'text/csv;charset=utf-8' }));
  a.download = 'GAEPP_' + (bereich === 'verbind' ? 'Verbindlichkeiten' : 'Budget')
    + '_' + stand + '.csv';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}

/* ===================================================================
   U-40 — Budget als Kategorie-Karten
   -------------------------------------------------------------------
   Eine Karte je KATEGORIE, nicht je Position. Bei vierzig Positionen mal
   zwoelf Monaten IST das Raster der Wert; eine Karte je Position
   zerschnitte genau den Vergleich, den man sucht. Das Raster bleibt
   deshalb dort, wo es gebraucht wird: im aufgeklappten Zustand, mit den
   Positionen dieser einen Kategorie.
   =================================================================== */
function katKarten() {
  const j = S.jahr, m = S.monat, h = ymOf(heuteISO());
  /* U-44: EINE Zeitachse fuer alle drei Zeitraeume. spaltenKoepfe() liefert
     zwoelf Monate oder ein Jahr je Spalte — die Karte fragt nur noch, wie
     viele es sind und was in einer Spalte steht. */
  const alle = S.zeitraum === 'alle', sp = spaltenKoepfe();
  const laufend = S.zeitraum === 'monat' && istLaufenderMonat(j, m);
  const kats = D.kategorien.filter(k => katSicht(k, j)).sort((a,b) => a.rang - b.rang);
  const gewaehlt = (S.filterNur || []).filter(id => kats.some(k => k.id === id));
  const sicht = gewaehlt.length ? kats.filter(k => gewaehlt.includes(k.id)) : kats;
  /* Wert einer Kategorie in EINER Spalte: im Jahr ein Monat, in «Alle Jahre»
     ein ganzer Jahrgang. Dieselbe Unterscheidung wie katW() in der Tabelle. */
  const spW = (k, x) => alle
    ? rd(zeilenVon(k.id, x.key).reduce((a,z) => a + zeilenJahr(z, x.key) * (z.gegenrichtung?-1:1), 0))
    : katSumme(k, j, x.key);
  const totalW = k => rd(sp.reduce((a,x) => a + spW(k, x), 0));
  const monatW = k => alle ? totalW(k)
    : S.zeitraum === 'jahr' ? totalW(k) : katSumme(k, j, m);

  /* WOHIN eine gespiegelte Kategorie fuehrt. Der Bauplan schrieb hier
     `data-bereich="verbind"` fest — das trifft die Schuldenzeilen, aber
     die Kategorie mit der Rechnungszeile schickte es an den falschen Ort.
     Dieselbe Unterscheidung steht schon im Klickverteiler bei data-spring;
     hier ist sie nur noch einmal gestellt, nicht neu beantwortet.
     Der Verweistext heisst «öffnen ›» und nicht «Karten ›» wie im Bauplan:
     der Zielname steht schon links als Kategoriename, und «Rechnungen ›»
     lief in der 360-Pixel-Spalte aus dem Raster — abgeschnitten stand dort
     «Rechnunge». Ein Wort, das in die Spalte passt, ist mehr wert als
     eines, das die Ansicht doppelt benennt. */
  const gespZiel = k => {
    const zs = zeilenVon(k.id, j);
    if (!zs.length || !zs.every(gespiegelt)) return null;
    if (zs.some(z => zeileGruppe[z.id])) return 'verbind';
    if (zs.some(z => z.gespiegeltAus === 'rechnungen')) return 'rechnung';
    return null;
  };

  const karte = k => {
    const offen = S.kOffen.includes(k.id);
    const ziel = gespZiel(k);
    const soll = monatW(k), ist = laufend ? istKat(k, j, m) : 0;
    const rest = rd(Math.max(0, soll - ist));
    const anteil = soll > 0.005 ? Math.min(1, ist / soll) : 0;
    const zeilen = zeilenVon(k.id, j);
    /* Der Jahresverlauf als zwoelf Balken. Math.abs nur fuer die HOEHE —
       eine Kategorie mit Gegenrichtungszeilen kann in einem Monat negativ
       summieren, und ein Balken hat keine Richtung. */
    const werte = sp.map(x => Math.abs(spW(k, x)));
    const max = Math.max(...werte, 1);
    return `<article class="streifen ${offen?'offen':''}">
      <div class="reihe" ${ziel ? `data-bereich="${ziel}"` : `data-kklapp="${k.id}"`}>
        <div class="nam"><span class="chev">${ziel ? '›' : (offen?'▾':'▸')}</span>
          <span class="t">${k.name}</span>
          ${ziel ? '<span class="z">gespiegelt</span>' : ''}</div>
        <div class="n gross ${ziel?'gespiegelt-wert':''}"${
          ziel ? ' title="kommt aus ' + (ziel === 'verbind' ? 'den Ratenplänen' : 'den erfassten Rechnungen') + '"' : ''
          }>${fmtG(soll)}</div>
        <div class="n ${laufend?'':'leer'}">${laufend ? fmtG(ist) : '–'}</div>
        <div class="n ${laufend ? (rest > 0.005 ? 'err' : 'leer') : 'leer'}">${
          laufend ? (rest > 0.005 ? fmtG(rest) : '—') : '–'}</div>
        <div class="kbalken"><div class="bar"><div style="width:${Math.round(anteil*100)}%"></div></div>
          <span class="p">${laufend ? Math.round(anteil*100) + ' %' : '–'}</span></div>
        <div class="n">${alle ? fmtG(rd(totalW(k) / Math.max(1, sp.length)))
                                : fmtG(totalW(k))}</div>
        <div class="kjahr">${werte.map((w,i) => `<i class="${
          alle ? (sp[i].key === h.j ? 'jetzt' : (sp[i].key > h.j ? 'kuenftig' : ''))
               : (i === h.m && j === h.j ? 'jetzt' : (j > h.j || (j === h.j && i > h.m) ? 'kuenftig' : ''))
          }" style="height:${Math.max(2, Math.round(w / max * 100))}%"></i>`).join('')}</div>
        <div class="pfeil">${ziel ? '' : `<span class="anz">${zeilen.length}</span>`}›</div>
      </div>
      ${offen && !ziel ? katKarteAuf(k) : ''}</article>`;
  };

  const saldo = alle ? rd(sp.reduce((a,x) => a + saldoRoh(x, true), 0))
    : S.zeitraum === 'jahr' ? rd([...Array(12).keys()].reduce((s,i) => s + saldoBudgetiert(j, i), 0))
    : saldoBudgetiert(j, m);

  const kopf = `<div class="tafel-kopf">
      <span class="titel">Budget ${zeitTitel()}</span>${tafelKennzahlen()}
      <span class="kopfwerkzeug"><button class="knopf klein ${gewaehlt.length?'primaer':''}" id="btnKat"
        aria-expanded="false">${gewaehlt.length ? gewaehlt.length + ' von ' + kats.length
          + ' Kategorien' : 'Kategorien'} ▾</button></span>
      ${tafelWerkzeug('budget')}
      ${vollbildKnopf()}
    </div>
    <div class="filterzeile" id="filterzeile" hidden><span class="lab">${
      gewaehlt.length ? 'Ausgewählt' : 'Alle sichtbar — wähle aus'}</span>
      ${kats.map(k => `<button class="filter" data-filter="${k.id}"
        aria-pressed="${gewaehlt.includes(k.id)}">${k.name}</button>`).join('')}
      ${gewaehlt.length ? '<button class="knopf klein" id="btnFilterAlle">Auswahl aufheben</button>' : ''}</div>`;

  /* Derselbe Grund wie bei den Verbindlichkeiten: ohne Kategorie steht hier
     sonst eine Spaltenkopfzeile ueber nichts, und der Knopf «Zeile
     hinzufügen» haengt an der Kategoriezeile der Tabelle. */
  if (!sicht.length) return kopf + `<div class="kflaeche k-budget">
    <p class="meldung">${kats.length
      ? 'Keine der gewählten Kategorien gilt in ' + j + '.'
      : 'Noch keine Kategorie angelegt. Du legst eine in der Verwaltung unter «Struktur» an — '
        + 'Konto trägt Kategorie trägt Position, in dieser Reihenfolge.'}</p></div>`;

  return kopf + `
    <div class="kflaeche k-budget">
      <div class="kkopf"><div style="padding-left:14px">Kategorie</div>
        <div style="text-align:right">${alle ? 'Total' : 'Soll ' + (S.zeitraum === 'jahr' ? j : MON[m].slice(0,3))}</div>
        <div style="text-align:right">Ist</div><div style="text-align:right">Rest</div>
        <div style="padding-left:22px">Verbraucht</div>
        <div style="text-align:right">${alle ? 'Ø je Jahr' : 'Jahr ' + j}</div>
        <div style="padding-left:26px">${alle ? 'Verlauf ' + sp[0].label + '–' + sp[sp.length-1].label
                                              : 'Monatsverlauf ' + j}</div><div></div></div>
      ${sicht.map(karte).join('')}
      <div class="kgruppe" style="border-top:1px solid var(--rule);margin-top:10px;padding-top:14px">
        <span class="t">Saldo budgetiert</span>
        <span class="num" style="font-size:17px;color:${saldo<0?'var(--err)':'var(--accent)'}">${
          (saldo>0?'+':'') + fmtG(saldo)}</span>
        <span class="z">${alle ? sp.length + ' Jahrgänge'
          : 'kumuliert ' + fmtG(saldoKumuliert(j, m)) + ' · Jahr '
            + fmtG(rd([...Array(12).keys()].reduce((s,i)=>s+saldoBudgetiert(j,i),0)))}</span></div>
    </div>`;
}

/* Das Raster einer Kategorie: ihre Positionen mal zwoelf Monate. Dieselben
   Zellen wie die Tabelle, nur auf eine Kategorie beschraenkt — hier steht
   deshalb kein Eingabefeld: eintragen ist die andere Ansicht.
   Die Zellen zeigen den ROHEN Wert, die Summenzeile rechnet mit
   katSumme(). Das sieht bei einer Gegenrichtungszeile aus, als ginge die
   Summe nicht auf — genau so steht es aber auch in der Tabelle (zelle()
   zeigt zeilenwert, katW rechnet mit Vorzeichen). Die Karte bildet die
   Tabelle ab und erfindet die Darstellung nicht neu. */
function katKarteAuf(k) {
  const j = S.jahr, h = ymOf(heuteISO());
  const alle = S.zeitraum === 'alle', sp = spaltenKoepfe();
  const zeilen = zeilenVon(k.id, j);
  /* U-44: dieselbe Zeitachse wie die Karte darueber. In «Alle Jahre» steht in
     einer Spalte ein Jahrgang, und dort wird NICHTS eingetragen: ein
     Jahreswert ist die Summe von zwoelf Monaten und keine Zahl, die irgendwo
     steht. Genau so hielt es die Tabelle vorher auch. */
  const wert = (z, x) => alle ? zeilenJahr(z, x.key) : zeilenwert(z, j, x.key);
  const katW = x => alle
    ? rd(zeilenVon(k.id, x.key).reduce((a,z) => a + zeilenJahr(z, x.key) * (z.gegenrichtung?-1:1), 0))
    : katSumme(k, j, x.key);
  const jetztSp = x => alle ? x.key === h.j : (x.key === h.m && j === h.j);
  const kopf = `<div class="r kopf" data-rkat="${k.id}"><div class="p">Position</div>
    ${alle ? '' : '<div class="c">Soll</div>'}${
    sp.map(x => `<div class="c" ${jetztSp(x)?'style="color:var(--accent)"':''
      }>${alle ? x.label : x.label.slice(0,3)}</div>`).join('')}<div class="j">${alle?'Total':'Jahr'}</div></div>`;
  const reihen = zeilen.map(z => {
    const gesp = gespiegelt(z), fest = gesp || _ro || alle;
    const soll = zeilenSoll(z, j);
    const sollZ = alle ? '' : (fest
      ? `<div class="c ${gesp?'gespiegelt-wert':''}">${fmtG0(soll)}</div>`
      : `<div class="c bearbeitbar" data-soll="${z.id}"><input type="text" inputmode="decimal"
           value="${soll ? fmtG(soll) : ''}" placeholder="0"></div>`);
    const zellen = sp.map(x => {
      const w = wert(z, x), jetzt = jetztSp(x);
      /* In «Alle Jahre» kann eine Zeile in einem Jahrgang gar nicht gelten —
         dann bleibt die Zelle leer und nicht null (U-21). */
      if (alle && !zeileSicht(z, x.key)) return '<div class="c"></div>';
      const offenHier = jetzt && !gesp && !alle && rd(w - istZeile(z, j, x.key)) > 0.005;
      const kl = `c ${jetzt?'jetzt':''} ${offenHier?'hatoffen':''}`;
      if (fest) return `<div class="${kl}">${fmtG0(w)}</div>`;
      const mark = S.markiert.includes(z.id + ':' + x.key) ? ' markiert' : '';
      return `<div class="${kl} bearbeitbar${mark}" data-z="${z.id}" data-m="${x.key}"><input
        type="text" inputmode="decimal" value="${w ? fmtG(w) : ''}" placeholder="0"></div>`;
    }).join('');
    return `<div class="r" data-oart="zeile" data-zeile="${z.id}" data-zkat="${k.id}">
      <div class="p">${alle ? '' : ordGriff('zeile', z)}<span class="t" data-zblatt="${z.id}"
          title="Stammdaten, Verlauf und Jahre">${z.bezeichnung}</span>
        ${gesp || _ro || alle ? '' : `<span class="zwerk"><button type="button" data-weg="${z.id}"
          title="Diese Position ab ${j} nicht mehr zeigen">ab ${j} aus</button></span>`}</div>
      ${sollZ}${zellen}
      <div class="j">${fmtG0(rd(sp.reduce((a,x)=>a+wert(z,x),0)))}</div></div>`;
  }).join('');
  const summe = `<div class="r summe" data-rkat="${k.id}">
    <div class="p" style="color:var(--muted)">Summe ${k.name}</div>
    ${alle ? '' : `<div class="c">${fmtG0(rd(zeilen.reduce((a,z)=>a+(zeilenSoll(z,j)||0)*(z.gegenrichtung?-1:1),0)))}</div>`}${
    sp.map(x => `<div class="c ${jetztSp(x)?'jetzt':''}">${fmtG0(katW(x))}</div>`).join('')}
    <div class="j" style="color:#fff">${fmtG0(rd(sp.reduce((a,x)=>a+katW(x),0)))}</div></div>`;
  const rest = !alle && istLaufenderMonat(j, S.monat)
    ? rd(Math.max(0, katSumme(k, j, S.monat) - istKat(k, j, S.monat))) : 0;
  /* Die Spaltenzahl wechselt mit dem Zeitraum — das Raster erfaehrt sie als
     Variable, damit Kopf, Zeilen und Summe dieselbe Kante halten. */
  const pgrid = alle
    ? `250px repeat(${sp.length},minmax(0,1fr)) 88px`
    : `250px 84px repeat(${sp.length},minmax(0,1fr)) 88px`;
  return `<div class="kauf"><div class="praster" style="--pgrid:${pgrid}"
    >${kopf}${reihen}${summe}
    <div class="fuss"><span>${alle
      ? 'Ein Jahrgang je Spalte · eingetragen wird im einzelnen Jahr'
      : 'Der laufende Monat steht hell' + (rest > 0.005
        ? ' · rot hinterlegt heisst budgetiert und noch nicht gebucht — offen ' + fmtG(rest) : '')}</span>
      <span style="flex:1"></span>
      ${_ro || alle ? '' : `<button class="knopf klein" type="button" data-add="${k.id}">Zeile hinzufügen</button>`}
      </div></div></div>`;
}

/* ---- Verbindlichkeiten (A-40, A-41) --------------------------------- */
function verbindTabelle() {
  const spAlle = spaltenKoepfe(), alle = S.zeitraum === 'alle';
  /* U-49: dieselbe Auswahl wie in verbindKarten. Zwei Ansichten derselben
     Sache duerfen nicht zwei verschiedene Glaeubigerlisten zeigen. */
  const sichtbar = v => alle ? spAlle.some(x => verbSicht(v, x.key)) : verbSicht(v, S.jahr);
  const stand = (v, s) => alle ? verbindPrognose(v, s.key, 11) : verbindPrognose(v, S.jahr, s.key);
  const zahl  = (v, s) => alle ? rd([...Array(12).keys()].reduce((a,m)=>a+rate(v,s.key,m),0)) : rate(v, S.jahr, s.key);
  const aktiv = D.verbindlichkeiten.filter(sichtbar);               /* U-49 */
  /* Das Praedikat muss alles pruefen, was in der Spalte steht — nicht nur die
     Raten. Der thead traegt hier dieselben zwei Kopfzahlen wie das Budget
     (U-7). Wer nur die Raten fragt, faltet eine Spalte weg, deren Saldo im
     Jahrestotal weiterzaehlt: die sichtbaren Zellen addieren sich dann nicht
     mehr auf das angezeigte Total. Gleiche Bedingung wie in budgetTabelle. */
  const sp = spaltenSicht(spAlle, () => true);   /* U-43: siehe budgetTabelle */
  /* Die Uebertragsspalte rechnet den Stand per letzter Spalte. Ohne ein einziges
     Budgetjahr gibt spaltenKoepfe() in der Sicht «Alle Jahre» ein leeres Array
     zurueck: spAlle[-1] ist undefined, und stand(v, undefined) stuerzt am Zugriff
     auf .key. Das ist der Startzustand der neuen leeren Huelle — dort gibt es
     keinen Uebertrag zu rechnen, dort steht ein Strich. */
  const letzte = spAlle[spAlle.length-1];
  const uebertrag = fn => letzte === undefined ? '–' : fn(letzte);
  let rows = '';
  GRUPPEN.forEach(g => {
    /* U-31: in Rangfolge statt in Dateireihenfolge. Der Filter ist derselbe
       geblieben — was hier dasteht, ist weiter nur das Aktive; geordnet wird
       aber auf der vollen Liste der Gruppe (ordListe), damit ein aus-
       geblendeter Glaeubiger seinen Platz zwischen den sichtbaren behaelt. */
    const liste = ordListe('verb', g.id).filter(sichtbar);          /* U-49 */
    /* U-36: Eine leere Gruppe fiel mitsamt ihrer Kopfzeile weg — und mit der
       Kopfzeile der einzige Knopf, ueber den in der ganzen App ein Glaeubiger
       entsteht. Bei leerer Datendatei war damit KEINE Verbindlichkeit
       anlegbar: der Knopf haengt an der Gruppe, die Gruppe haengt an einem
       Glaeubiger, und der erste Glaeubiger entsteht nur ueber den Knopf.
       Die Verwaltung hilft nicht, sie fuehrt kein Register dafuer.
       Jetzt bleibt die Kopfzeile stehen, solange die Tabelle bedienbar ist.
       In «Alle Jahre» und im Lesemodus faellt sie weiter weg — dort gibt es
       den Knopf ohnehin nicht, dort waere sie eine leere Zeile ohne Zweck. */
    if (!liste.length && (alle || _ro)) return;
    const zu = S.zu.includes('g_' + g.id);
    rows += `<tr class="zeile-luft"><td colspan="${sp.length+4}"></td></tr>`;
    rows += `<tr class="zeile-sub" data-gruppe="${g.id}"><td class="klappzelle namenszelle">
        <button class="klappkopf" aria-expanded="${!zu}" data-klapp="g_${g.id}">
          <span class="chev">▾</span><span class="t">${g.name}</span></button>
        ${alle || _ro ? '' : `<button class="kat-add" type="button" data-vadd="${g.id}">Gläubiger hinzufügen</button>`}</td>
      <td class="n">${fmt0(rd(liste.reduce((a,v)=>a+standSpalte(v),0)))}</td><td class="n"></td>
      ${reihe(sp, s => `<td class="n ${s.jetzt?'jetzt':''}">${zu ? fmt0(rd(liste.reduce((a,v)=>a+zahl(v,s),0))) : ''}</td>`)}
      <td class="n"></td></tr>`;
    liste.forEach(v => {
      rows += `<tr class="zeile-daten ${zu?'zugeklappt':''}" data-verb="${v.id}"
        data-vgrp="${g.id}" data-oart="verb">
        <td class="namenszelle">${ordGriff('verb', v)}<span class="nz" data-schuld="${v.id}">${v.bezeichnung}</span></td>
        <td class="n">${fmt(standSpalte(v))}${alle ? '' : vortragMarke(v, S.jahr)}</td>
        <td class="n">${fmt0(((v.raten && v.raten[String(S.jahr)])||{}).soll)}</td>
        ${reihe(sp, s => alle || _ro
          ? `<td class="n ${s.jetzt?'jetzt':''}">${fmt0(zahl(v,s))}</td>`
          : `<td class="bearbeitbar n ${s.jetzt?'jetzt':''}" data-vr="${v.id}" data-m="${s.key}">
               <input type="text" value="${rate(v,S.jahr,s.key)?fmt(rate(v,S.jahr,s.key)):''}" placeholder="0.00" inputmode="decimal"></td>`)}
        <td class="n">${uebertrag(s => fmt0(stand(v, s)))}</td></tr>`;
    });
    /* U-36: Eine Gruppe ohne Glaeubiger braucht keine Summenzeile — sie
       stuende als zweite Null direkt unter der ersten und sagte nichts,
       was die Kopfzeile nicht schon sagt. */
    if (liste.length) rows += `<tr class="zeile-summe ${zu?'zugeklappt':''}" data-gsumme="${g.id}"><td>Summe ${g.name}</td>
      <td class="n">${fmt0(rd(liste.reduce((a,v)=>a+standSpalte(v),0)))}</td><td class="n"></td>
      ${reihe(sp, s => `<td class="n ${s.jetzt?'jetzt':''}">${fmt0(rd(liste.reduce((a,v)=>a+zahl(v,s),0)))}</td>`)}
      <td class="n">${uebertrag(s => fmt0(rd(liste.reduce((a,v)=>a+stand(v,s),0))))}</td></tr>`;
  });
  const ges = aktiv;
  rows += `<tr class="zeile-gesamt"><td>Summe Verbindlichkeiten</td>
    <td class="n">${fmt(rd(ges.reduce((a,v)=>a+standSpalte(v),0)))}</td><td class="n"></td>
    ${reihe(sp, s => `<td class="n ${s.jetzt?'jetzt':''}">${fmt0(rd(ges.reduce((a,v)=>a+zahl(v,s),0)))}</td>`)}
    <td class="n">${uebertrag(s => fmt(rd(ges.reduce((a,v)=>a+stand(v,s),0))))}</td></tr>`;

  const weg = gefaltet(sp);
  const zeit1 = sp.findIndex(x => !x.falt);        /* U-25, wie im Budget */
  return `<div class="tafel-kopf"><span class="titel">Verbindlichkeiten ${zeitTitel()}</span>${tafelKennzahlen()}
      <span class="nr">Konto 08 Schulden</span>
      ${tafelWerkzeug('verbind')}
      ${vollbildKnopf()}</div>
    <div class="rollflaeche"><table class="gross fixiert t-verbind">
      <thead><tr class="zeile-titel"><th class="t">Bezeichnung${greifer('w1', true)}</th
        ><th class="n">${standSpalteKopf()}${greifer('w2', true)}</th><th class="n">Rate${greifer('w3', true)}</th>
        ${sp.map((s,i) => s.falt ? faltKopf(s)
          : `<th class="n ${s.jetzt?'jetzt':''}">${s.label}${greifer('wz', i === zeit1)}</th>`).join('')}
        <th class="n">Übertrag</th></tr>
        <!-- Derselbe Kopf wie im Budget (U-7). Er rechnet nichts Eigenes: es sind
             dieselben zwei Funktionen. Er steht hier, damit sichtbar wird, was eine
             geaenderte Rate mit dem Saldo macht — ohne den Bereich zu wechseln. -->
        <tr class="zeile-saldo"><td>Saldo budgetiert</td><td class="n"></td><td class="n"></td>
          ${reihe(sp, s => `<td class="n ${s.jetzt?'jetzt':''}">${fmt(saldoRoh(s, alle))}</td>`)}
          <td class="n">${fmt(spAlle.reduce((a,s)=>a+saldoRoh(s, alle),0))}</td></tr>
        <tr class="zeile-kum"><td>Saldo kumuliert</td><td class="n"></td><td class="n"></td>
          ${reihe(sp, s => `<td class="n ${s.jetzt?'jetzt':''}">${fmt(kumRoh(s, alle))}</td>`)}
          <td class="n"></td></tr>
      </thead><tbody>${rows}</tbody></table></div>`;
}


/* ===================================================================
   U-40 — Verbindlichkeiten als Streifenkarten
   -------------------------------------------------------------------
   Dieselben Zahlen wie verbindTabelle(), andere Anzeige. Steht hier
   etwas anderes als dort, ist der Fehler HIER — die Rechenregeln sind
   unberuehrt geblieben, diese Datei ruft sie nur ein zweites Mal.

   Warum Streifen und nicht Kacheln: bei acht Glaeubigern hoert ein
   Kachelteppich auf, ein Vergleich zu sein. Die Spaltenkante haelt die
   Lesbarkeit der Tabelle, die Karte bringt Balken und Verlauf dazu.

   Die Reihenfolge kommt aus ordListe('verb', …) und nicht aus einem
   eigenen filter ueber D.verbindlichkeiten: die Tabelle ordnet seit U-31
   nach `rang`. Zwei Ansichten derselben Sache in zwei Reihenfolgen waeren
   genau die zweite Wahrheit, gegen die dieser Umbau gebaut ist.
   =================================================================== */
function verbindKarten() {
  const e = zeitEnde(), h = ymOf(heuteISO());
  const alle = S.zeitraum === 'alle', sp = spaltenKoepfe();
  /* U-49: In «Alle Jahre» steht ein Glaeubiger, sobald er in IRGENDEINER
     gezeigten Spalte gilt — dieselbe Regel wie bei den Budgetzeilen. Sonst
     verschwaende ein 2027 ausgeblendeter aus einer Ansicht, die 2022 bis
     2032 zeigt, und mit ihm seine Jahre 2022 bis 2026. */
  const aktiv = alle
    ? D.verbindlichkeiten.filter(v => sp.some(x => verbSicht(v, x.key)))
    : verbAlle(S.jahr);
  const jahre = Object.keys(D.budget).map(Number).sort();
  const letztes = jahre.length ? jahre[jahre.length - 1] : S.jahr;
  const kuenftig = e.j > h.j || (e.j === h.j && e.m > h.m);
  const st = v => kuenftig ? verbindPrognose(v, e.j, e.m) : standPer(v, e.j, e.m);
  const spRate = (v, x) => alle
    ? rd([...Array(12).keys()].reduce((a,m2) => a + rate(v, x.key, m2), 0)) : rate(v, S.jahr, x.key);
  const rateJetzt = v => alle
    ? rd(sp.reduce((a,x) => a + spRate(v, x), 0)) : rate(v, S.jahr, S.monat);
  /* Stand einer Gruppe am Ende einer Spalte — fuer den Verlauf. In «Alle
     Jahre» das Jahresende, sonst das Monatsende. */
  const spStand = (liste, x) => rd(liste.reduce((a,v) =>
    a + Math.max(0, alle ? verbindPrognose(v, x.key, 11) : verbindPrognose(v, S.jahr, x.key)), 0));

  /* ---- Eine Karte je GRUPPE (U-46) --------------------------------------
     Dieselbe Anatomie wie im Budget: die Karte ist der Block, das Aufgeklappte
     ist sein Raster. Bis U-46 war die Karte der einzelne Glaeubiger und die
     Gruppe eine Textzeile dazwischen — zwei Bauarten fuer dieselbe Sache.
     Was die Glaeubigerkarte trug (Balken, Verlauf, Ratenplan, die Knoepfe
     Tilgung und Belege), steht vollstaendig in seinem Blatt; ein Klick auf
     den Namen im Raster fuehrt dorthin. */
  const karte = (gid, name, liste, zusatz) => {
    if (!liste.length) return '';
    const offen = S.kOffen.includes('g_' + gid);
    const stand = rd(liste.reduce((a,v) => a + st(v), 0));
    const rate1 = rd(liste.reduce((a,v) => a + rateJetzt(v), 0));
    const anf = rd(liste.reduce((a,v) => a + (v.anfangsstand || 0), 0));
    const anteil = anf > 0.005 ? Math.max(0, Math.min(1, 1 - stand / anf)) : 0;
    /* Wann ist die GANZE Gruppe getilgt: der spaeteste ihrer Glaeubiger.
       Traegt einer kein Ende, hat die Gruppe keines. */
    const enden = liste.map(tilgungsende);
    const ende = enden.some(x => !x) ? null
      : enden.reduce((a,b2) => (b2 && (!a || _endeSpaeter(b2, a))) ? b2 : a, null);
    const werte = sp.map(x => spStand(liste, x));
    const max = Math.max(anf, ...werte, 1);
    return `<article class="streifen ${offen?'offen':''}">
      <div class="reihe" data-kklapp="g_${gid}">
        <div class="nam"><span class="chev">${offen?'▾':'▸'}</span>
          <span class="t">${name}</span>${zusatz ? `<span class="z">${zusatz}</span>` : ''}</div>
        <div class="n gross">${fmt(stand)}</div>
        <div class="n ${rate1 ? '' : 'leer'}">${rate1 ? fmt(rate1) : '–'}</div>
        <div class="kbalken"><div class="bar"><div style="width:${Math.round(anteil*100)}%"></div></div>
          <span class="p">${Math.round(anteil*100)} %</span></div>
        <div class="n ${ende ? '' : 'leer'}">${ende || '–'}</div>
        <div class="kjahr">${werte.map((w,i2) => `<i class="${
          alle ? (sp[i2].key === h.j ? 'jetzt' : (sp[i2].key > h.j ? 'kuenftig' : ''))
               : (i2 === h.m && S.jahr === h.j ? 'jetzt' : (S.jahr > h.j || (S.jahr === h.j && i2 > h.m) ? 'kuenftig' : ''))
          }" style="height:${Math.max(2, Math.round(w / max * 100))}%"></i>`).join('')}</div>
        <div class="pfeil"><span class="anz">${liste.length}</span>›</div>
      </div>
      ${offen ? verbindKarteAuf(gid, liste) : ''}</article>`;
  };

  const gruppen = GRUPPEN.map(g =>
    karte(g.id, g.name, ordListe('verb', g.id).filter(v => aktiv.includes(v)))).join('');  /* U-49 */
  /* Ein Glaeubiger mit einer Gruppe, die es nicht gibt, gehoert gezeigt —
     er zaehlt in der Gesamtsumme mit und verschwand frueher lautlos. */
  const fremd = aktiv.filter(v => !GRUPPEN.some(g => g.id === v.gruppe))
                     .sort((a,b2) => (a.rang || 0) - (b2.rang || 0));
  const fremdBlock = karte('', 'Ohne Gruppe', fremd, 'Gruppe unbekannt');

  const total  = rd(aktiv.reduce((s2,v) => s2 + st(v), 0));
  const ratenM = rd(aktiv.reduce((s2,v) => s2 + rateJetzt(v), 0));
  const sf = schuldenfreiGecacht();
  const sfText = sf.monate !== null
    ? 'schuldenfrei ' + MON_LANG[sf.monat] + ' ' + sf.jahr
    : 'nicht getilgt bis Ende ' + sf.bis + ' · Rest ' + fmt(sf.rest);

  const kopf = `<div class="tafel-kopf">
      <span class="titel">Verbindlichkeiten ${zeitTitel()}</span>${tafelKennzahlen()}
      ${_ro ? '' : `<span class="kopfwerkzeug"><button class="knopf klein" type="button"
        data-vadd="${GRUPPEN[0].id}">Gläubiger erfassen</button></span>`}
      ${tafelWerkzeug('verbind')}
      ${vollbildKnopf()}
    </div>`;
  if (!aktiv.length) return kopf + `<div class="kflaeche k-verbind">
    <p class="meldung">${D.verbindlichkeiten.length
      ? 'Alle ' + D.verbindlichkeiten.length + ' erfassten Gläubiger sind ausgeblendet.'
      : 'Noch kein Gläubiger erfasst. «Gläubiger erfassen» oben legt den ersten an.'}</p></div>`;

  return kopf + `
    <div class="kflaeche k-verbind">
      <div class="kkopf"><div style="padding-left:14px">Gruppe</div>
        <div style="text-align:right">${standKopfGruppe()}</div>
        <div style="text-align:right">${alle ? 'Raten total' : 'Rate'}</div>
        <div style="padding-left:22px">Getilgt</div>
        <div style="text-align:right">Letzte Rate</div>
        <div style="padding-left:26px">Verlauf</div><div></div></div>
      ${gruppen}${fremdBlock}
      <div class="kgruppe" style="border-top:1px solid var(--rule);margin-top:10px;padding-top:14px">
        <span class="t">Schulden ${alle ? 'alle Jahre' : zeitTitel()}</span>
        <span class="num" style="font-size:17px">${fmt(total)}</span>
        <span class="z">${alle ? 'Raten total' : 'Raten diesen Monat'} ${fmt(ratenM)} · ${sfText}</span></div>
    </div>`;
}
/* «August 2029» gegen «Mai 2028» vergleichen, ohne ein zweites Datumsformat
   einzufuehren: tilgungsende() gibt «Monat Jahr» in Klartext zurueck. */
function _endeSpaeter(a, b2) {
  const zer = t => { const p2 = String(t).split(' '); return [+p2[1] || 0, MON_LANG.indexOf(p2[0])]; };
  const x = zer(a), y = zer(b2);
  return x[0] !== y[0] ? x[0] > y[0] : x[1] > y[1];
}

/* Das Raster einer Gruppe: ihre Glaeubiger mal die Zeitachse. Dieselben
   Bauteile wie das Positionsraster im Budget — deshalb dieselbe Klasse.
   Eingetragen werden hier die Raten; der Stand ist gerechnet und steht fest. */
function verbindKarteAuf(gid, liste) {
  const h = ymOf(heuteISO()), alle = S.zeitraum === 'alle', sp = spaltenKoepfe();
  const wert = (v, x) => alle
    ? rd([...Array(12).keys()].reduce((a,m2) => a + rate(v, x.key, m2), 0)) : rate(v, S.jahr, x.key);
  const jetztSp = x => alle ? x.key === h.j : (x.key === h.m && S.jahr === h.j);
  /* U-47: Dieselbe Spalte wie in verbindTabelle und mit derselben Regel —
     im laufenden Jahr der Stand von heute, sonst der Stand per 1.1. des
     gewaehlten Jahrgangs. Zwei Ansichten derselben Sache duerfen nicht zwei
     verschiedene Zahlen zeigen; deshalb rufen beide standSpalte(). */
  /* U-50: die Jahre, ueber die dieses Raster laeuft. In «Alle Jahre» ist
     das die ganze Spaltenreihe, sonst genau der gewaehlte Jahrgang. */
  const jahre = alle ? sp.map(x => x.key) : [S.jahr];
  const hj = ymOf(heuteISO()).j;
  const zeigtHeute = hj >= jahre[0] && hj <= jahre[jahre.length - 1];
  /* Die Saldozeile gibt es nur im einzelnen Jahrgang (siehe saldoReihe). */
  const zeigtSaldoZeile = !alle;
  const hm = ymOf(heuteISO()).m;
  /* Kuenftig heisst: nach dem laufenden Monat. Ein vergangener Monat ohne
     Buchung ist NICHT kuenftig — er ist vergangen und trotzdem nur geplant;
     das sagt die gruene Markierung in der Zeile darueber, nicht diese. */
  const kuenftigSp = x => alle ? x.key > hj
    : (S.jahr > hj || (S.jahr === hj && x.key > hm));
  const kopf = `<div class="r kopf"><div class="p">Gläubiger</div>
    <div class="c">Anfang<br><span class="kl">${alle ? '1.1.' + jahre[0] : '1.1.' + S.jahr}</span></div>
    <div class="c">Heute</div>${
    sp.map(x => `<div class="c" ${jetztSp(x)?'style="color:var(--accent)"':''
      }>${alle ? x.label : x.label.slice(0,3)}</div>`).join('')}<div class="c">Zahlungen</div>
    <div class="j">Ende<br><span class="kl">31.12.${jahre[jahre.length-1]}</span></div></div>`;
  /* verbindPrognose laeuft je Aufruf ueber alle Monate seit dem
     Anfangsdatum. Bei zehn Glaeubigern mal drei Saldi mal Reihe und Summe
     waeren das sechzig Laeufe fuer dieselben sechs Zahlen — deshalb einmal
     rechnen und merken. */
  const _drei = {};
  const dreiVon = v => (_drei[v.id] || (_drei[v.id] = verbDreiSaldi(v, jahre)));
  /* ---- U-50: die zweite Zeile ----------------------------------------
     Sie traegt den Stand NACH jedem Monat und macht die Zeile darueber
     lesbar: Anfang, zwoelf Abgaenge, Ende. Bewusst ohne data-vr, ohne
     Ordnungsattribut und ohne bearbeitbare Zelle — damit ist sie fuer den
     Tastaturweg (nachbarZelle sucht die naechste Reihe MIT bearbeitbarer
     Zelle), fuer das Ziehen und fuer die Markierung unsichtbar. Kein
     einziger dieser drei Mechanismen musste angefasst werden.

     In «Alle Jahre» faellt sie weg: Dort ist jede Spalte ein Jahr, und der
     Stand am Jahresende steht bereits in der Zeile darueber — sie waere
     dieselbe Zahlenreihe ein zweites Mal.

     Bis heute ist der Saldo Ist, danach Prognose. Beides gleich aussehen zu
     lassen waere in einer Zeile, die wie ein Kontoauszug gelesen wird, die
     teuerste Verwechslung von allen. */
  const saldoReihe = v => {
    if (alle || !zeigtSaldoZeile) return '';
    const st = verbMonatsSaldi(v, S.jahr);
    return `<div class="r saldo-r">
      <div class="p"><span class="st">Saldo</span></div>
      <div class="c"></div><div class="c"></div>
      ${sp.map((x,i) => `<div class="c ${jetztSp(x)?'jetzt':''}${
        kuenftigSp(x) ? ' plan' : ''}">${fmtG(st[x.key])}</div>`).join('')}
      <div class="c"></div><div class="j"></div></div>`;
  };
  const reihen = liste.map(v => {
    const zellen = sp.map(x => {
      const w = wert(v, x), jetzt = jetztSp(x);
      /* U-50: Gruen heisst «dafuer gibt es eine Buchung». In dieser Tabelle
         steht kein einziger positiver Betrag, deshalb begegnet sich die
         Farbe hier nie ihrer sonstigen Bedeutung (Plus). Die Ausnahme ist
         mit Albrecht am 19.08.2026 ausdruecklich so entschieden und steht
         im Handbuch — sie ist keine Unachtsamkeit.
         Weicht die Buchung vom Plan ab, sagt es der Titel: die Zelle zeigt
         weiter den Plan, denn in sie wird der Plan getippt. */
      const ist = alle ? 0 : istVerb(v, S.jahr, x.key);
      const gb = ist > 0.005 ? ' gebucht' : '';
      const tit = gb ? ` title="Gebucht: ${fmt(ist)}${
        Math.abs(ist - w) > 0.005 ? ' — geplant war ' + fmt(w) : ''}"` : '';
      if (_ro || alle) return `<div class="c ${jetzt?'jetzt':''}${gb}"${tit}>${fmtG0(w)}</div>`;
      const mark = S.markiert.includes(v.id + ':' + x.key) ? ' markiert' : '';
      return `<div class="c ${jetzt?'jetzt':''} bearbeitbar${mark}${gb}"${tit} data-vr="${v.id}" data-m="${x.key}"><input
        type="text" inputmode="decimal" value="${w ? fmtG(w) : ''}" placeholder="0"></div>`;
    }).join('');
    const tage = v.vereinbarungBis
      ? Math.round((Date.parse(v.vereinbarungBis + 'T00:00:00')
                  - Date.parse(heuteISO() + 'T00:00:00')) / 86400000) : null;
    return `<div class="r" data-oart="verb" data-verb="${v.id}" data-vgrp="${gid}">
      <div class="p">${alle ? '' : ordGriff('verb', v)}<span class="t" data-schuld="${v.id}"
          title="Zahlung, Tilgung, Verlauf und Belege">${v.bezeichnung}</span>
        ${tage !== null && tage <= 120
          ? `<span class="weg" style="color:var(--err)">bis ${v.vereinbarungBis.slice(8,10)}.${
              v.vereinbarungBis.slice(5,7)}.</span>` : ''}</div>
      <div class="c">${fmtG(dreiVon(v).anfang)}${alle ? '' : vortragMarke(v, S.jahr)}</div>
      <div class="c${zeigtHeute ? '' : ' leer'}">${zeigtHeute ? fmtG(dreiVon(v).heute) : '–'}</div>${zellen}
      <div class="c">${fmtG0(rd(sp.reduce((a,x)=>a+wert(v,x),0)))}</div>
      <div class="j">${fmtG(dreiVon(v).ende)}</div></div>` + saldoReihe(v);
  }).join('');
  const summe = `<div class="r summe"><div class="p" style="color:var(--muted)">Summe</div>
    <div class="c">${fmtG(rd(liste.reduce((a,v)=>a+dreiVon(v).anfang,0)))}</div>
    <div class="c${zeigtHeute ? '' : ' leer'}">${zeigtHeute
      ? fmtG(rd(liste.reduce((a,v)=>a+dreiVon(v).heute,0))) : '–'}</div>${
    sp.map(x => `<div class="c ${jetztSp(x)?'jetzt':''}">${
      fmtG0(rd(liste.reduce((a,v)=>a+wert(v,x),0)))}</div>`).join('')}
    <div class="c">${fmtG0(rd(liste.reduce((a,v)=>
      a + sp.reduce((b2,x)=>b2+wert(v,x),0), 0)))}</div>
    <div class="j" style="color:#fff">${fmtG(rd(liste.reduce((a,v)=>a+dreiVon(v).ende,0)))}</div></div>`;
  /* Zwei Spalten mehr links, eine mehr rechts. Die Namensspalte gibt den
     Platz her — sie war mit 250 px die breiteste und braucht ihn nicht. */
  const pgrid = `196px 78px 78px repeat(${sp.length},minmax(0,1fr)) 82px 88px`;
  return `<div class="kauf"><div class="praster" style="--pgrid:${pgrid}">${kopf}${reihen}${summe}
    <div class="fuss"><span>${alle
      ? 'Ein Jahrgang je Spalte · eingetragen wird im einzelnen Jahr'
      : 'Der Name führt zu Zahlung, Tilgung, Verlauf und Belegen'}</span>
      <span style="flex:1"></span>
      ${_ro || alle || !gid ? '' : `<button class="knopf klein" type="button"
        data-vadd="${gid}">Gläubiger hinzufügen</button>`}
      </div></div></div>`;
}

/* ---- Rechnungen ------------------------------------------------------ */
/* Die Rechnungen stehen als Kacheln, gruppiert — dieselbe Anatomie wie Konto
   und Schuld, dieselbe Zwischenueberschrift wie bei den Schulden. Ein Klick
   oeffnet das Blatt mit allem, was dazugehoert.

   U-52 — Die Tafel folgt der Zeitwahl.
   -------------------------------------------------------------------
   Bis zum 19.08.2026 zeigte sie `D.rechnungen` ganz, in jeder Zoomstufe. Sie
   war damit der einzige Bereich, der den Zeitblock der Seitenleiste nicht
   las: im August standen die Rechnungen aller Monate da. Gefiltert wird nach
   FAELLIGKEIT — dasselbe Datum, nach dem schon gruppiert wurde und mit dem
   die Sammelzeile im Budget rechnet (gespiegelteRechnung(), istRechnungen()).
   Zwei Bereiche, die dasselbe Wort «August» verschieden meinten, waeren
   schlimmer als eine lange Liste.

   U-53 — «Ueberfaellig» bleibt stehen.
   -------------------------------------------------------------------
   Der Preis des Filterns: Eine offene Rechnung aus dem Juli faellt im August
   aus dem Bild. Ein Haushaltsbuch, das eine ueberfaellige Rechnung
   wegfiltert, ist gefaehrlicher als eines, das zu viel zeigt. Sie steht
   deshalb in einer eigenen Gruppe zuoberst, in Rot: offen, faellig vor heute,
   und nicht ohnehin im gewaehlten Zeitraum. In «Alle Jahre» gibt es die
   Gruppe nicht — dort ist jede Rechnung ohnehin da. Gemessen wird gegen
   HEUTE und nicht gegen den gewaehlten Monat: «ueberfaellig» ist eine
   Tatsache und keine Frage der Ansicht.

   U-54 — Bezahltes steht unten, hinter einer Klappe.
   -------------------------------------------------------------------
   Klappkopf (Formensprache A, Form 6) und ausdruecklich KEINE zweite,
   kleinere Kachelart: eine zweite Kachelgestalt fuer dieselbe Sache waere
   eine zweite Form fuer eine Bedeutung und damit gegen G-2. Zu ist der
   Normalfall; die Zahl im Kopf sagt, was dahinterliegt. Die Kacheln darin
   tragen `erledigt` und fallen um einen Rang in `--muted` — dieselbe Regel
   wie bei der gespiegelten Zeile (Formensprache H).

   U-55 — Gruppieren nach Monat oder nach Rechnungssteller.
   -------------------------------------------------------------------
   Schalter (Form 2) im Tafelkopf, aber nur dort, wo er etwas zu sagen hat:
   in einem einzelnen Monat waere die Monatsgruppe eine einzige Gruppe, und
   ein Schalter, der nichts umsortiert, ist Laerm. Vorgabe ist Monat. Nach
   Steller wird nach Summe absteigend sortiert — die Frage dahinter lautet
   «wer kostet mich am meisten», nicht «wo steht das M». */

function rechnungImZeitraum(r) {
  if (S.zeitraum === 'alle') return true;
  const f = ymOf(r.faelligkeit);
  return S.zeitraum === 'jahr' ? f.j === S.jahr : (f.j === S.jahr && f.m === S.monat);
}
/* U-53: offen, faellig vor heute — und nicht schon im Bild. */
function rechnungUeberfaellig(r) {
  return r.status === 'offen' && r.faelligkeit < heuteISO() && !rechnungImZeitraum(r);
}
function rechnungTag(d) { return d.slice(8,10) + '.' + d.slice(5,7) + '.'; }

function rechnungKachel(r, erledigt) {
  const st = steller(r.stellerId), z = zeile(r.zeileId), k = konto(r.kontoId);
  const beleg = r.belegDatei ? 'Beleg abgelegt'
              : (r.belegOffen ? 'Beleg liegt bereit' : 'kein Beleg');
  const spaet = r.status === 'offen' && r.faelligkeit < heuteISO();
  return kachelHtml({
    art:'rechnung', id:r.id,
    klasse: erledigt ? 'erledigt' : (spaet ? 'spaet' : ''),
    kennung: (k ? k.nr + ' ' + k.name : 'ohne Konto') + (r.gedeckt ? ' · Rückstellung' : ''),
    name: st ? st.name : '?',
    rolle: (z ? z.bezeichnung : '') + (r.notiz ? ' · ' + r.notiz : ''),
    label: r.status !== 'offen' ? 'Bezahlt'
         : (spaet ? 'Überfällig seit ' + rechnungTag(r.faelligkeit)
                  : 'Offen, fällig ' + rechnungTag(r.faelligkeit)),
    wert: r.betrag,
    knopf: r.status === 'offen' ? 'Bezahlt' : 'Öffnen',
    tat: r.status === 'offen' ? 'rstatus:' + r.id : 'rechnung:' + r.id,
    meta: beleg });
}
/* U-55: Ein Gruppierer fuer beide Faelle. Zwei Schleifen, die sich nur im
   Schluessel unterscheiden, waeren zwei Orte fuer dieselbe Sache (G-4). */
function rechnungGruppen(liste, nachSteller) {
  const g = [];
  liste.forEach(r => {
    const schl = nachSteller ? (r.stellerId || '_ohne') : r.faelligkeit.slice(0,7);
    let x = g.find(y => y.schl === schl);
    if (!x) g.push(x = { schl, titel:'', summe:0, liste:[] });
    x.liste.push(r);
  });
  g.forEach(x => {
    x.summe = rd(x.liste.reduce((s,r) => s + r.betrag, 0));
    x.liste.sort((a,b) => a.faelligkeit < b.faelligkeit ? -1 : 1);
    if (nachSteller) { const st = steller(x.schl); x.titel = st ? st.name : 'Ohne Rechnungssteller'; }
    else { const y = ymOf(x.liste[0].faelligkeit); x.titel = MON_LANG[y.m] + ' ' + y.j; }
  });
  return nachSteller ? g.sort((a,b) => b.summe - a.summe)
                     : g.sort((a,b) => a.schl < b.schl ? -1 : 1);
}
/* Kein «· X offen» mehr im Gruppenkopf: seit Offenes und Bezahltes getrennt
   stehen, ist diese Zahl im offenen Teil IMMER die Summe daneben und im
   bezahlten immer null. Eine Zahl, die nie etwas anderes sagen kann als die
   danebenstehende, ist keine Auskunft (G-8). */
function rechnungBlock(gruppen, erledigt) {
  /* Im bezahlten Teil ist der Klappkopf selbst der Gruppenkopf, solange es
     nur eine Gruppe gibt — im Monat ist das der Normalfall. Zwei Koepfe
     uebereinander, die dieselbe Summe und dieselbe Zahl tragen, sind einer
     zu viel. */
  const ohneKopf = erledigt && gruppen.length === 1;
  return gruppen.map(g => {
    const kopf = ohneKopf ? '' : `<h3 class="untertitel rkopf">${g.titel}
        <span class="num">${fmt(g.summe)}</span>
        <span>${g.liste.length} ${g.liste.length===1?'Rechnung':'Rechnungen'}</span></h3>`;
    return kopf + `<div class="raster">${g.liste.map(r => rechnungKachel(r, erledigt)).join('')}</div>`;
  }).join('');
}

function rechnungTabelle() {
  const alle = D.rechnungen.slice().sort((a,b) => a.faelligkeit < b.faelligkeit ? -1 : 1);
  const nachSteller = S.zeitraum !== 'monat' && S.rGrp === 'steller';
  const summe = l => rd(l.reduce((s,r) => s + r.betrag, 0));

  const imZeit  = alle.filter(rechnungImZeitraum);
  const spaet   = alle.filter(rechnungUeberfaellig);
  const offen   = imZeit.filter(r => r.status === 'offen');
  const bezahlt = imZeit.filter(r => r.status !== 'offen');

  /* U-53: nicht gruppiert — die Gruppe IST die Aussage, und ein zweiter
     Monatskopf darin waere ein Kopf ueber einem Kopf. */
  const gSpaet = spaet.length ? `<h3 class="untertitel rkopf spaetkopf">Überfällig
        <span class="num">${fmt(summe(spaet))}</span>
        <span>${spaet.length} ${spaet.length===1?'Rechnung':'Rechnungen'} aus einem anderen Zeitraum, noch offen</span></h3>
      <div class="raster">${spaet.map(r => rechnungKachel(r, false)).join('')}</div>` : '';

  const gOffen = offen.length ? rechnungBlock(rechnungGruppen(offen, nachSteller), false) : '';

  const auf = !!S.rBezAuf;
  const gBez = bezahlt.length ? `<button class="untertitel klapp" type="button" data-rbez
        aria-expanded="${auf}"><span class="chev">${auf ? '▾' : '▸'}</span>Bezahlt
        <span class="num">${fmt(summe(bezahlt))}</span>
        <span>${bezahlt.length} ${bezahlt.length===1?'Rechnung':'Rechnungen'}</span></button>
      ${auf ? rechnungBlock(rechnungGruppen(bezahlt, nachSteller), true) : ''}` : '';

  /* U-55: Der Schalter steht nur, wo er etwas umsortiert. */
  const schalter = S.zeitraum === 'monat' ? '' : `<span class="kansicht">
      <span class="schalter" role="group" aria-label="Gruppierung">
      <button type="button" data-rgrp="monat" aria-pressed="${!nachSteller}">Nach Monat</button>
      <button type="button" data-rgrp="steller" aria-pressed="${nachSteller}">Nach Rechnungssteller</button>
      </span></span>`;

  const leer = !alle.length
    ? `<p class="meldung" style="padding:14px 0">Noch keine Rechnung erfasst.
        Zieh einen Beleg auf das Fenster oder nimm den Knopf oben.</p>`
    : `<p class="meldung" style="padding:14px 0">${
        S.zeitraum === 'alle' ? 'Keine Rechnung erfasst.'
                              : 'In ' + zeitTitel() + ' steht keine Rechnung.'}
        Der Zeitraum steht in der Leiste links.</p>`;

  return `<div class="tafel-kopf"><span class="titel">Rechnungen</span>${tafelKennzahlen()}
      <span class="nr">${imZeit.length} ${imZeit.length===1?'Rechnung':'Rechnungen'} · ${
        fmt(summe(offen))} offen${spaet.length ? ' · ' + fmt(summe(spaet)) + ' überfällig' : ''}</span>
      ${schalter}
      <button class="knopf klein" id="btnRechNeu">Rechnung erfassen</button>
      ${vollbildKnopf()}</div>
    <div class="rollflaeche" style="padding:0 var(--pad) var(--pad)">
      ${gSpaet}${gOffen}${gBez}${(gSpaet || gOffen || gBez) ? '' : leer}</div>`;
}

/* ---- Der Zeichner --------------------------------------------------- */
function zeichne() {
  if (!D) { zeichneLeerstart(); return; }
  /* U-30: vor allem anderen — der Zeiger muss auf einem Jahrgang stehen, den
     es gibt. Hier und nicht in den einzelnen Zeichenfunktionen, weil sonst die
     eine, die es vergisst, still auf einem toten Jahrgang rechnet. Der
     Normalfall kostet einen Object.keys und einen indexOf. */
  jahrFangen();
  zeichneKopf();
  $('#inhalt').dataset.modus = S.modus === 'tabellen' ? 'tabellen' : 'kacheln';
  /* Nur im Dashboard weicht die Kopfzeile — dort stehen die Zahlen gross (U-13). */
  $('.kopfzeile').hidden = S.modus === 'dashboard' || S.modus === 'verwaltung';
  if (S.modus === 'dashboard')       zeichneDashboard();
  else if (S.modus === 'verwaltung') zeichneVerwaltung();
  else if (S.modus === 'kacheln')    zeichneKacheln();

/* ===================================================================

let _blatt = null;          /* {art, id, reiter} */

function blattAuf(art, id, reiter, ueber) {

/* Was in der Maske steht, bevor neu gezeichnet wird — sonst verliert ein

function entwurfSichern() {

  const setz = (feld, wert) => { if (wert !== undefined) _entwurf[feld] = wert; };

function blattZeichnen() {

     die Seite neu zeichnen — statt sie einzeln umzuschreiben, faengt es

  if (!_blatt) { if (S.modus === 'verwaltung') zeichne(); return; }

    kontomaske: blattKontoMaske,
    sync: blattSync, bericht: blattBericht,
    handbuch: blattHandbuch, rechnung: blattRechnung, serie: blattSerie,
    rechnungzeigen: blattRechnungZeigen, glaeubiger: blattGlaeubiger,
    offen: blattOffen,                                 /* U-45 */
    umbuch: blattUmbuch                                /* U-48 */
  }[_blatt.art];
  if (!f) { console.warn('Kein Blatt für', _blatt.art); return; }
  const b = f(_blatt.id);

  $('#blattTitel').textContent = b.titel;

  rt.innerHTML = (b.reiter || []).map(([id,n]) =>
    `<button role="tab" data-blattreiter="${id}" aria-selected="${_blatt.reiter===id}">${n}</button>`).join('');
  $('#blattKoerper').innerHTML = b.koerper;
  /* A-90: Das Handbuch muss mitten in einer Erfassung aufgehen — der Knopf in der Fusszeile

     erfasst wird, und nur dort. Im Berichtsgenerator, in der Verwaltung und im Sync-Blatt

  const erfassung = ['konto','schuld','sparziel','rechnung','serie','rechnungzeigen'].includes(_blatt.art);

function blattKonto(id) {

           Rolle, IBAN, Anfangssaldo, Bereich und vor allem der Haken «frei»

      <button class="knopf klein" data-kaend="${k.id}">Ändern</button>

function kontoOptionen(sel, ausser) {

    .sort((a,b)=>a.rang-b.rang)
    .map(k => `<option value="${k.id}" ${sel===k.id?'selected':''}>${k.nr} ${k.name}</option>`).join('');

/* ===================================================================
   U-21 — Die Positionen, die in einem Jahr zur Wahl stehen
   -------------------------------------------------------------------
   Jede Auswahlliste hat ihr eigenes Jahr: die Buchungsmaske das des
   Buchungsdatums, die Rechnungsmaske das der Faelligkeit, die Serie
   und die Sprungliste S.jahr. Wer stattdessen ueberall S.jahr naehme,
   boete beim Nachtragen einer Buchung von 2026 die Positionen von 2029
   an — oder liesse die von 2026 weg.

   Die aktuell gewaehlte Zeile bleibt IMMER in der Liste, auch wenn sie
   im Zieljahr ausgeblendet ist. Sonst verloere das Bearbeiten einer
   alten Buchung stillschweigend ihre Position: der Browser waehlt beim
   Fehlen der Option die erste aus, und beim naechsten Speichern stuende
   dort eine andere — ein Datenverlust ohne Meldung.

   Die Kategorien werden hier NICHT eigens gefiltert: zeileSicht fragt
   die Kategorie ohnehin mit ab, und eine Kategorie ohne uebrige Zeile
   erscheint dann von selbst nicht mehr.
   =================================================================== */
function jahrVon(datum) {
  /* Ein leeres oder halb getipptes Datum ergaebe NaN, und `NaN < 2029` ist
     falsch — die Liste waere schlagartig leer. Dann lieber S.jahr. */
  const j = +String(datum || '').slice(0, 4);
  return j || S.jahr;
}
function zeilenWahl(j, sel) {
  const raus = [];
  D.kategorien.slice().sort((a,b) => a.rang - b.rang).forEach(k => {
    D.zeilen.filter(z => z.kategorieId === k.id && (zeileSicht(z, j) || z.id === sel))
      .sort((a,b) => (a.rang||0) - (b.rang||0))
      .forEach(z => raus.push({ z, k }));
  });
  return raus;
}
/* A-48: die Positionen des gewaehlten Kontos zuoberst, waehlbar sind alle.
   Ohne das liesse sich auf Konto 08 keine Rate und auf 05 gar nichts buchen. */
function positionOptionen(sel, kontoId, j) {
  const eigen = [], fremd = [];
  zeilenWahl(j, sel).forEach(x => {
    /* Die drei Verbindlichkeitszeilen sind gesperrt — dort wird nichts gebucht,
       die Rate laeuft ueber das Feld «Zahlung an eine Verbindlichkeit».
       Die Sammelzeile «Rechnungen» ist dagegen waehlbar: sie ist die Position,
       unter der eine Rechnungszahlung im Budget steht. */
    if (zeileGruppe[x.z.id]) return;
    (x.k.kontoId === kontoId ? eigen : fremd).push(x);
  });
  const opt = x => `<option value="${x.z.id}" ${sel===x.z.id?'selected':''}>${x.k.name} | ${x.z.bezeichnung}</option>`;
  return `<option value="">— ohne Position —</option>` +
    (eigen.length ? `<optgroup label="Zu diesem Konto">${eigen.map(opt).join('')}</optgroup>` : '') +
    (fremd.length ? `<optgroup label="Alle übrigen">${fremd.map(opt).join('')}</optgroup>` : '');
}

function zahl(s) {
  if (s === null || s === undefined) return 0;
  const t = String(s).replace(/[’'\s]/g, '').replace(',', '.').replace('−','-');
  const n = parseFloat(t);
  return isFinite(n) ? Math.abs(n) : 0;

/* ---- Journal (A-19, A-54, A-94) -------------------------------------- */
function journal(k) {
  const von = S.zeitraum === 'monat' ? { j:S.jahr, m:S.monat } : { j:S.jahr, m:0 };
  const bis = S.zeitraum === 'monat' ? { j:S.jahr, m:S.monat } : { j:S.jahr, m:11 };
  const drin = b => { const d = ymOf(b.datum);
    return (d.j > von.j || (d.j === von.j && d.m >= von.m)) && (d.j < bis.j || (d.j === bis.j && d.m <= bis.m)); };
  const eigene = D.buchungen.filter(b => (b.kontoId === k.id || b.gegenkontoId === k.id) && drin(b))
                            .sort((a,b) => a.datum < b.datum ? -1 : 1);
  let vs = [];
  if (S.zeitraum === 'monat') vs = vorschlaege(k.id, S.jahr, S.monat);
  else for (let m = 0; m <= 11; m++) vs = vs.concat(vorschlaege(k.id, S.jahr, m));

  const anfang = kontosaldo(k.id, von.j, von.m === 0 ? -1 : von.m - 1);
  let lauf = S.zeitraum === 'monat'
    ? kontosaldo(k.id, S.monat === 0 ? S.jahr-1 : S.jahr, S.monat === 0 ? 11 : S.monat-1)
    : kontosaldo(k.id, S.jahr-1, 11);
  /* Hier stand eine Summe «ein», die nie jemand las — und die falsch rechnete:
     `s + wirkung(b,k.id) > 0` bindet als `(s + wirkung(…)) > 0`, gefragt war
     `wirkung(…) > 0`. Der Kopf zeigt Anfang, Anzahl und Saldo, keine Einnahmen-
     summe. Entfernt am 18.08.2026, statt einen ungenutzten Fehler zu pflegen. */
  const zeilen = eigene.map(b => {
    const w = wirkung(b, k.id); lauf = rd(lauf + w);
    const z = b.zeileId ? zeile(b.zeileId) : null;
    return `<tr data-jz="${b.id}">
      <td class="tag">${b.ganzerMonat ? MON[ymOf(b.datum).m] : kurzdatum(b.datum)}</td>
      <td>${z ? z.bezeichnung : (b.text || artName(b.art))}${
        b.art === 'umbuchung' ? `<span class="marke-um">${b.kontoId===k.id?'→ '+konto(b.gegenkontoId).name:'← '+konto(b.kontoId).name}</span>` : ''}</td>
      <td class="r num ${w<0?'neg':''}">${fmt(w)}</td>
      <td class="r num">${fmt(lauf)}</td>
      <td class="r"><span class="zwerk"><button class="knopf klein" data-jedit="${b.id}">Ändern</button>
        <button class="knopf klein" data-jdel="${b.id}">Löschen</button></span></td></tr>`;
  }).join('');
  const vzeilen = vs.map(v => {
    const vo = v.serie.vorlage;
    return `<tr class="vorschlag">
      <td class="tag">${kurzdatum(v.datum)}</td>
      <td>${vo.text || (vo.zeileId ? zeile(vo.zeileId).bezeichnung : artName(vo.art))} · Vorschlag</td>
      <td class="r num">${fmt(vo.art === 'einnahme' ? vo.betrag : -vo.betrag)}</td>
      <td class="r num">–</td>
      <td class="r"><span class="zwerk"><button class="knopf klein" data-vbuch="${v.serie.id}:${v.datum}">Buchen</button>
        <button class="knopf klein" data-vskip="${v.serie.id}:${v.datum}">Überspringen</button></span></td></tr>`;
  }).join('');
  return `<div class="kennzahlen">
      <span class="wert"><span class="k">Anfang</span><span class="v">${fmt(anfang)}</span></span>
      <span class="wert"><span class="k">Buchungen</span><span class="v">${eigene.length}</span></span>
      <span class="wert"><span class="k">Saldo</span><span class="v">${fmt(kontosaldo(k.id, bis.j, bis.m))}</span></span>
      ${vs.length ? `<span class="wert"><span class="k">Vorschläge</span><span class="v off">${vs.length}</span>
        <span class="z">zählen nirgends mit</span></span>` : ''}
    </div>
    <table class="journal"><thead><tr><th>Tag</th><th>Position</th><th class="r">Betrag</th>
      <th class="r">Saldo</th><th></th></tr></thead>
    <tbody>${zeilen}${vzeilen}${(!zeilen && !vzeilen) ? `<tr><td colspan="5"><span class="meldung">In diesem Zeitraum ist nichts gebucht.</span></td></tr>` : ''}</tbody></table>
    <div style="margin-top:12px"><button class="knopf klein" id="btnSerieNeu">Serie anlegen</button></div>`;
}
function wirkung(b, kId) {
  if (b.kontoId === kId) {
    if (b.art === 'einnahme') return b.betrag;
    if (b.art === 'korrektur') return b.betrag * (b.richtung === 'minus' ? -1 : 1);
    return -b.betrag;

  return b.betrag;                       /* Empfaengerseite einer Umbuchung */
}
function artName(a) { return { ausgabe:'Ausgabe', einnahme:'Einnahme', umbuchung:'Umbuchung', korrektur:'Korrektur' }[a] || a; }

/* ---- Verlauf --------------------------------------------------------- */
function verlauf(k) {
  const pts = [];
  for (let m = 0; m <= 11; m++) pts.push(kontosaldo(k.id, S.jahr, m));
  const min = Math.min(0, ...pts), max = Math.max(1, ...pts);
  const x = i => 20 + i * (560 / 11), y = v => 280 - ((v - min) / (max - min || 1)) * 250;
  const d = pts.map((v,i) => (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(v).toFixed(1)).join(' ');
  return `<svg class="verlauf" viewBox="0 0 600 300" preserveAspectRatio="none">
      <line x1="20" y1="${y(0).toFixed(1)}" x2="580" y2="${y(0).toFixed(1)}" stroke="#2a3542"/>
      <path d="${d}" fill="none" stroke="#8ee6c8" stroke-width="2"/>
      ${pts.map((v,i)=>`<circle cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="2.5" fill="#8ee6c8"/>`).join('')}
    </svg>
    <div class="kennzahlen" style="margin-top:10px">
      ${MON.map((n,i)=>`<span class="wert"><span class="k">${n}</span><span class="v">${fmt(pts[i])}</span></span>`).join('')}
    </div>`;
}

/* ===================================================================
   Schuldblatt — Zahlung und Tilgung
   =================================================================== */
function blattSchuld(id) {
  const v = verbind(id);
  const reiter = _blatt.reiter || 'zahlung';
  _blatt.reiter = reiter;
  const koerper = reiter === 'zahlung'   ? maskeZahlung(v)
                : reiter === 'tilgung'   ? tilgung(v)
                : reiter === 'dokumente' ? dokReiterHtml('verbind', v.id)
                :                          schuldVerlauf(v);
  const st = verbindStandHeute(v);
  const diff = v.auszugswert !== null && v.auszugswert !== undefined ? rd(v.auszugswert - st) : null;
  return {

       Blatt hier platzen — `.name` auf undefined, und zwar bevor irgendetwas

       zeigte; die Karten zeigen ihn jetzt unter «Ohne Gruppe», also fuehrt
       auch ein Klick hierher. */
    weit: true, kennung: ((GRUPPEN.find(g=>g.id===v.gruppe) || {}).name || 'Ohne Gruppe')
      + ' · ' + zeitTitel(),
    titel: v.bezeichnung,
    /* U-27: Dokumente stehen hinten, nicht vorn. Der Reiter, auf dem das

       damit man von dort aus sieht, ob es sich lohnt hinzugehen. */
    reiter: [['zahlung','Zahlung'],['tilgung','Tilgung'],['verlauf','Verlauf'],

    koerper,
    fuss: `<div class="abgleich" style="margin-left:14px">
        <div class="feld"><label>Gläubigerauszug</label>
          <input class="num" id="auszugswert" type="text" inputmode="decimal"

        <span class="lab">Differenz</span>

        ${diff ? `<button class="knopf klein" id="btnUebertrag">Übertragen</button>` : ''}
      </div>

           dieser Gläubiger stimmt so nicht. Bis U-30 endete der Griff bei

           längst, nur bot sie niemand an. -->
      <button class="knopf klein gefahr" data-vwloesch="verbindlichkeit:${v.id}">Löschen</button>
      <button class="knopf klein" data-bericht="schuld:${v.id}">Bericht</button>
      <button class="knopf" data-zu>Schliessen</button>`
  };
}
/* ===================================================================
   U-22 — Dokumentlinks bei einem Gläubiger
   -------------------------------------------------------------------
   REINE VERWEISE. GAEPP legt nichts ab und prueft nichts nach: kein
   Kopieren in den Belegordner, kein Abrufen der Adresse, keine Meldung,
   wenn sie tot ist. Das ist Absicht und keine Sparmassnahme.

   Eine Zahlungsvereinbarung liegt einmal irgendwo — im Mailanhang, im
   Dossier, im Behoerdenportal. Wuerde GAEPP eine Kopie ziehen, gaebe es
   sie zweimal; die Kopie wuerde nicht nachgefuehrt, und beim naechsten
   Nachtrag stuende die alte Fassung im Werkzeug, das Albrecht fuer die
   Wahrheit haelt. Ein toter Link sagt «hier war einmal etwas, sieh
   nach». Eine veraltete Kopie sagt nichts und behauptet alles.

   Geprueft wird genau eine Sache, und die beim Speichern: dass die
   Adresse mit http:// oder https:// anfaengt. Ein `javascript:`-Link in
   einer Datei, die ueber GitHub zurueckkommt, waere fremder Code im
   eigenen Fenster.
   =================================================================== */
function dokUrlOk(u) { return /^https?:\/\//i.test(String(u || '').trim()); }
/* U-26: Die Dokumente wurden bis hierher nur im Blatt «Gläubiger ändern»
   gepflegt — und dort erst beim Klick auf «Ändern» gespeichert. Wer den
   Link eintippte und danach «Schliessen» drueckte, verlor ihn ohne
   Meldung. Genau so ist es Albrecht ergangen.

   U-27: Aus der einen Zeile im Zahlungsreiter ist ein eigener Reiter
   geworden. Der Grund ist derselbe Fehler in kleinerer Form: eine Zeile
   im Kopfblock einer Erfassungsmaske uebersieht man. Was einen eigenen
   Ort verdient, bekommt einen eigenen Ort — und die Zahl am Reiter sagt
   von aussen, ob dort etwas liegt, ohne dass man hineinsehen muss.

   Erfasst wird IM REITER, nicht in einem Dialog und nicht im Formular
   darueber. Der Knopf schreibt sofort nach D und ruft davor merkeStand().
   Das ist die Lehre aus U-26 und sie gilt hier doppelt: ein Reiter, den
   man verlaesst, ohne etwas abzuschicken, ist noch leichter zu verlassen
   als eine Maske.

   Zwei Traeger, ein Bauteil: eine Verbindlichkeit und eine Rechnung
   haben dasselbe Feld `dokumente` und verdienen deshalb nicht zwei
   Ansichten, die auseinanderlaufen. `art` sagt nur, wo nachgeschlagen
   wird — alles andere ist gleich.

   soll sie nicht suchen muessen. Beide schreiben in dasselbe Feld. */
function dokTraeger(art, id) {
  return art === 'rechnung' ? (D.rechnungen.find(x => x.id === id) || null)
       : art === 'verbind'  ? (verbind(id) || null)
       : art === 'konto'    ? (konto(id) || null) : null;
}
/* ---- U-28: was die Erfassung als Beispiel vorschlaegt ----------------
   Der Platzhalter ist kein Schmuck, er ist eine Anleitung: er sagt, was
   fuer eine Art Sache hier hineingehoert. Bei einer Schuld ist das eine
   Zahlungsvereinbarung, bei einem Konto ein Kontoauszug — und ausdruecklich
   NICHT ein Zugang. Ein Platzhalter «Zugangsdaten» waere eine Einladung,
   und die Datei geht ueber GitHub. Der Hinweis darunter sagt es noch
   einmal in Worten, weil ein Platzhalter verschwindet, sobald man tippt. */
const DOK_BEISPIEL = { verbind:'Zahlungsvereinbarung 2026', rechnung:'Mahnung vom 12.08.2026',
                       konto:'Kontoauszug Dezember 2026' };
/* «verbind:v1» und «verbind:v1:3» — art steht vorn, der Index hinten, die
   Kennung dazwischen. Zerlegt wird von aussen nach innen, damit eine
   Kennung mit Doppelpunkt darin nichts zerreisst. */
function dokSchl(s) {
  const t = String(s || ''), a = t.indexOf(':');
  return { art: t.slice(0, a), id: t.slice(a + 1) };
}
function dokSchlI(s) {
  const t = String(s || ''), a = t.indexOf(':'), z = t.lastIndexOf(':');
  return { art: t.slice(0, a), id: t.slice(a + 1, z), i: +t.slice(z + 1) };
}
/* Gefiltert wird bei JEDEM Zeichnen, nicht nur beim Speichern: eine Datei,
   die ueber GitHub zurueckkommt, kann einen `javascript:`-Eintrag tragen,
   den diese App nie gesehen hat. */
function dokListe(o) { return ((o && o.dokumente) || []).filter(d => d && dokUrlOk(d.url)); }
/* Hat die Rechnung einen Beleg? Zwei Zustaende zaehlen gleich: abgelegt und
   im Zwischenspeicher wartend — in beiden Faellen liegt etwas da. */
function dokHatBeleg(art, o) { return art === 'rechnung' && !!(o.belegDatei || o.belegOffen); }
/* Die Zahl am Reiter zaehlt, was der Reiter zeigt — bei einer Rechnung also
   die Verweise UND den abgelegten Beleg. Sie beantwortet nicht die Frage
   «wie viele Verweise», sondern «liegt hier etwas». Eine Rechnung, deren
   einziger Inhalt der Beleg ist, muesste sonst ohne Zahl dastehen, und
   genau dann waere der Reiter wieder das, was er nicht sein soll: eine
   Stelle, in die man erst hineinsehen muss. */
function dokAnzahl(art, o) { return dokListe(o).length + (dokHatBeleg(art, o) ? 1 : 0); }
function dokReiterName(art, o) {
  const n = dokAnzahl(art, o);
