')[0]}\" cy=\"${pkt[pkt.length-1].split(',')[1]}\" r=\"2.5\"/><\u002Fsvg>`;\n}\n\n/* Was auslaeuft, steht als Karte da — mit der Restzeit, nicht nur dem Datum.\n   «in 4 Monaten» beantwortet die Frage, die ein Datum offen laesst. */\nfunction fristenHtml(verb) {\n  const heute = heuteISO();\n  const liste = verb.filter(v => v.vereinbarungBis)\n    .map(v => ({ bis: v.vereinbarungBis, name: v.bezeichnung, stand: verbindStandHeute(v), id: v.id }))\n    .sort((a,b) => a.bis < b.bis ? -1 : 1);\n  if (!liste.length) return '';\n  /* In Monaten zu rechnen war falsch: der 31.08. liegt im selben Monat wie\n     heute und stand deshalb als «ausgelaufen» da, obwohl noch 13 Tage bleiben.\n     Kurze Fristen gehoeren in Tagen gesagt, lange in Monaten. */\n  const tageBis = d => Math.round((Date.parse(d + 'T00:00:00') - Date.parse(heute + 'T00:00:00')) / 86400000);\n  const restText = d => {\n    const t = tageBis(d);\n    if (t < 0)  return 'ausgelaufen';\n    if (t === 0) return 'läuft heute aus';\n    if (t === 1) return 'läuft morgen aus';\n    if (t <= 60) return 'in ' + t + ' Tagen';\n    const a = ymOf(heute), b = ymOf(d);\n    const mb = (b.j - a.j) * 12 + (b.m - a.m);\n    return 'in ' + mb + ' Monaten';\n  };\n  return `<div class=\"sektion\"><h2>Was ausläuft\n      <span class=\"h2-wert\">${fmt(rd(liste.reduce((s,x)=>s+x.stand,0)))} betroffen<\u002Fspan><\u002Fh2>\n    <div class=\"raster\">\n      ${liste.map(x => {\n        const t = tageBis(x.bis), nah = t <= 120;\n        return `<article class=\"karte kachel kpi frist ${nah?'nah':''}\" data-bereich=\"verbind\">\n          <div><span class=\"kennung\">bis ${x.bis.slice(8,10)}.${x.bis.slice(5,7)}.${x.bis.slice(0,4)}<\u002Fspan>\n            <button class=\"name\" type=\"button\">${x.name}<\u002Fbutton><\u002Fdiv>\n          <div class=\"mitte\"><span class=\"wert\"><span class=\"v gross\">${fmt(x.stand)}<\u002Fspan><\u002Fspan><\u002Fdiv>\n          <div class=\"fuss\"><span class=\"meta\">${restText(x.bis)}<\u002Fspan>\n            <span class=\"pfeil\">›<\u002Fspan><\u002Fdiv><\u002Farticle>`;\n      }).join('')}\n    <\u002Fdiv><\u002Fdiv>`;\n}\n\nfunction zeichneKacheln() {\n  const e = zeitEnde();\n  /* Die Liquiditaetskarte ist mit U-5 ins Dashboard gewandert. Hier stand\n     sie doppelt (U-10). */\n\n  const konten = D.konten.filter(k => k.aktiv !== false && k.sektion === 'konten')\n    .sort((a,b) => a.rang - b.rang).map(k => {\n      const s = kontosaldo(k.id, e.j, e.m);\n      const n = D.buchungen.filter(b => b.kontoId === k.id || b.gegenkontoId === k.id).length;\n      const letzte = D.buchungen.filter(b => b.kontoId === k.id).map(b => b.datum).sort().pop();\n      /* Konto 05 fuehrt die offenen Rechnungen — von dort wird eine erfasst,\n         nicht gebucht. Die Kachel traegt deshalb ein anderes Wort. */\n      const offen = D.rechnungen.filter(r => r.status === 'offen' && r.kontoId === k.id);\n      const rech = k.id === 'kred';\n      return kachelHtml({ art:'konto', id:k.id, kennung:'Konto ' + k.nr, name:k.name, rolle:k.rolle,\n        label:'Saldo', wert:s, ueberzogen: s < 0,\n        knopf: rech ? 'Rechnung' : 'Buchen', tat: rech ? 'rechnungneu:' + k.id : null,\n        meta: rech\n          ? (offen.length ? offen.length + (offen.length===1?' offene Rechnung · ':' offene Rechnungen · ')\n              + fmt(rd(offen.reduce((s2,r)=>s2+r.betrag,0))) : 'keine offene Rechnung')\n          : n + (n === 1 ? ' Buchung' : ' Buchungen') + (letzte ? ' · zuletzt ' + kurzdatum(letzte) : '') });\n    }).join('');\n\n  /* Die Schulden stehen nach ihren drei Gruppen zusammen (A-41). Die Zwischen-\n     ueberschrift ist das vorhandene Bauteil «untertitel», keine neue Form; im\n     Sektionskopf steht bewusst kein Wert — Kontosaldo und Restschuld sind zwei\n     verschiedene Groessen und duerfen dort nicht durcheinandergehen. */\n  const schuldKachel = v => {\n    const st = S.zeitraum === 'alle' ? verbindPrognose(v, e.j, e.m) : standPer(v, e.j, e.m);\n    const r  = rate(v, S.jahr, S.monat);\n    return kachelHtml({ art:'schuld', id:v.id, kennung: GRUPPEN.find(g=>g.id===v.gruppe).name,\n      name:v.bezeichnung, rolle: v.vertreter || (v.herkunft === 'belegt' ? 'Stand belegt' : 'Stand gerechnet'),\n      label:'Stand', wert:st, anteil:getilgtAnteil(v), knopf:'Zahlung',\n      ueberzogen: st > v.anfangsstand,\n      meta:'Rate ' + fmt(r) + ' · getilgt ' + Math.round(getilgtAnteil(v)*100) + ' %' });\n  };\n  const schulden = GRUPPEN.map(g => {\n    const liste = D.verbindlichkeiten.filter(v => v.aktiv !== false && v.gruppe === g.id);\n    if (!liste.length) return '';\n    const summe = rd(liste.reduce((s,v) => s + (S.zeitraum === 'alle'\n      ? verbindPrognose(v, e.j, e.m) : standPer(v, e.j, e.m)), 0));\n    const raten = rd(liste.reduce((s,v) => s + rate(v, S.jahr, S.monat), 0));\n    return `<h3 class=\"untertitel\">${g.name}\n        <span class=\"num\">${fmt(summe)}<\u002Fspan>\n        <span>${liste.length} ${liste.length===1?'Position':'Positionen'} · Raten ${fmt(raten)}<\u002Fspan><\u002Fh3>\n      <div class=\"raster\">${liste.map(schuldKachel).join('')}<\u002Fdiv>`;\n  }).join('');\n\n  const sparziele = D.sparziele.filter(s => s.aktiv !== false).map(s => {\n    const st = sparstand(s.id, e.j, e.m);\n    return kachelHtml({ art:'sparziel', id:s.id, kennung:'Sparziel', name:s.name, rolle:'',\n      label:'Stand', wert:st, anteil: s.zielbetrag ? st/s.zielbetrag : 0, knopf:'Einzahlen',\n      meta: s.zielbetrag ? Math.round(st/s.zielbetrag*100) + ' % · es fehlen ' + fmt(s.zielbetrag - st) : '' });\n  }).join('');\n\n  const res = D.konten.find(k => k.sektion === 'reserve');\n  const reserve = res ? kachelHtml({ art:'konto', id:res.id, kennung:'Konto ' + res.nr, name:res.name,\n    rolle:res.rolle, label:'Stand', wert:kontosaldo(res.id, e.j, e.m), knopf:'Einzahlen', meta:'' }) : '';\n\n  const kListe = D.konten.filter(k => k.aktiv !== false && k.sektion === 'konten');\n  const kTotal = rd(kListe.reduce((s,k) => s + kontosaldo(k.id, e.j, e.m), 0));\n  const kFrei  = rd(kListe.filter(k => k.frei).reduce((s,k) => s + kontosaldo(k.id, e.j, e.m), 0));\n  const vAktiv = D.verbindlichkeiten.filter(v => v.aktiv !== false);\n  const sTotal = rd(vAktiv.reduce((s,v) => s + (S.zeitraum === 'alle'\n    ? verbindPrognose(v, e.j, e.m) : standPer(v, e.j, e.m)), 0));\n\n  $('#inhalt').innerHTML =\n    /* U-30: Der Leertext stand hier auf null — bei null Konten war der Bereich\n       einfach leer, und wer mit einer leeren Datei anfing, sah eine Seite ohne\n       Inhalt und ohne Hinweis, wo es weitergeht. Derselbe Satz wie bei den\n       Sparzielen darunter, weil es dieselbe Lage ist. */\n    sektion('Konten', konten, 'Noch kein Konto angelegt. Du legst eines in der Verwaltung '\n      + 'unter «Struktur» an — Konto trägt Kategorie trägt Position, in dieser Reihenfolge.',\n      false, kTotal,\n      kListe.length + ' Konten · davon frei verfügbar ' + fmt(kFrei)) +\n    sektion('Schulden', schulden, null, true, sTotal,\n      vAktiv.length + ' Gläubiger · Raten diesen Monat ' +\n      fmt(rd(vAktiv.reduce((a,v) => a + rate(v, S.jahr, S.monat), 0)))) +\n    sektion('Sparziele', sparziele, 'Noch kein Sparziel angelegt. Du legst eines in der Verwaltung an.') +\n    sektion('Reserve', reserve);\n}\nfunction sektion(titel, inhalt, leertext, eigenesRaster, wert, zusatz) {\n  /* Der Wert im Sektionskopf ist dasselbe Bauteil wie bei den Schulden —\n     nur eine Ebene hoeher (U-10). */\n  const kopf = `<h2>${titel}${wert === undefined || wert === null ? '' :\n    `<span class=\"h2-wert num\">${fmt(wert)}<\u002Fspan>`}${zusatz ? `<span class=\"h2-zu\">${zusatz}<\u002Fspan>` : ''}<\u002Fh2>`;\n  if (!inhalt) {\n    if (!leertext) return '';\n    return `<section class=\"sektion\">${kopf}<p class=\"meldung\">${leertext}<\u002Fp><\u002Fsection>`;\n  }\n  return `<section class=\"sektion\">${kopf}` +\n    (eigenesRaster ? inhalt : `<div class=\"raster\">${inhalt}<\u002Fdiv>`) + `<\u002Fsection>`;\n}\nfunction kurzdatum(d) { const x = ymOf(d); return x.t + '. ' + MON[x.m]; }\n/* Stand eines Sparziels per Stichtag. Beide Aufrufer geben Jahr und Monat mit\n   und erwarten den Stand zu diesem Zeitpunkt — die Funktion hat sie bisher\n   entgegengenommen und nicht angeschaut. Folge: beim Rueckwaertsblaettern stand\n   der Sparstand still, waehrend Konten und Schulden mitliefen. Die Zeitgrenze\n   ist dieselbe wie in kontosaldo, damit eine Kachel nicht anders rechnet als\n   die daneben. */\nfunction sparstand(sid, j, m) {\n  return rd(D.buchungen.reduce((s,b) => {\n    if (b.sparzielId !== sid) return s;\n    const d = ymOf(b.datum);\n    if (j !== undefined && (d.j > j || (d.j === j && m !== undefined && d.m > m))) return s;\n    return s + b.betrag;\n  }, 0));\n}\n/* ---- Liquiditaetskarte (A-11, A-12) --------------------------------- */\nfunction liqKarteHtml() {\n  const h = ymOf(heuteISO());\n  const frei = freiPerMonatsende(h.j, h.m), pt = proTag(), t = tageBisLohn();\n  /* «Frei per Jahresende» und «Frei per Monatsende» standen mit derselben Zahl\n     untereinander, weil freiPerJahresende nichts anderes tat als\n     freiPerMonatsende weiterzureichen. Zwei Beschriftungen, ein Wert — das\n     laesst den Leser nach dem Unterschied suchen, den es nicht gibt. Der\n     Jahreswert ist verfuegbarPer(j, 11); Dashboard und Kopfband rechnen ihn\n     schon so. */\n  const jahrW = verfuegbarPer(h.j, 11);\n  const hhk = D.konten.filter(k => k.frei);\n  const bestand = rd(hhk.reduce((s,k) => s + kontosaldo(k.id, h.j, h.m), 0));\n  const offen = offeneAufFreiem(h.j, h.m);\n  const woanders = rd(D.rechnungen.reduce((s,r) => {\n    const f = ymOf(r.faelligkeit);\n    return (r.status === 'offen' && f.j === h.j && f.m === h.m && !mindertFreies(r, h.j, h.m))\n      ? s + r.betrag : s; }, 0));\n  if (S.modus === 'tabellen') {\n    return `<div class=\"karte liq-schmal\">\n      <span class=\"wert\"><span class=\"k\">Jahr<\u002Fspan><span class=\"v\">${fmt(jahrW)}<\u002Fspan><\u002Fspan>\n      <span class=\"wert\"><span class=\"k\">Monat<\u002Fspan><span class=\"v\">${fmt(frei)}<\u002Fspan><\u002Fspan>\n      <span class=\"wert\"><span class=\"k\">Pro Tag<\u002Fspan><span class=\"v\">${fmt(pt)}<\u002Fspan>\n        <span class=\"z\">${t} Tage bis zum ${D.meta.lohntag}.<\u002Fspan><\u002Fspan><\u002Fdiv>`;\n  }\n  return `<div class=\"karte liq-karte\"><div class=\"karte-koerper liq\">\n    <span class=\"wert\"><span class=\"k\">Frei per Jahresende<\u002Fspan><span class=\"v\">${fmt(jahrW)}<\u002Fspan><\u002Fspan>\n    <span class=\"wert\"><span class=\"k\">Frei per Monatsende<\u002Fspan><span class=\"v\">${fmt(frei)}<\u002Fspan><\u002Fspan>\n    <span class=\"wert\"><span class=\"k\">Pro Tag<\u002Fspan><span class=\"v\">${fmt(pt)}<\u002Fspan>\n      <span class=\"z\">${t} Tage bis zum ${D.meta.lohntag}.<\u002Fspan><\u002Fspan>\n    <div class=\"herleitung\">\n      ${hhk.map(k => `<div class=\"zeile\"><span>${k.name}<\u002Fspan><span class=\"num\">${fmt(kontosaldo(k.id,h.j,h.m))}<\u002Fspan><\u002Fdiv>`).join('')}\n      <div class=\"zeile\"><span>offene Rechnungen ab ${hhk.map(k=>k.name).join(', ')}<\u002Fspan><span class=\"num\">${offen ? '−' + fmt(offen) : '0.00'}<\u002Fspan><\u002Fdiv>\n      ${woanders ? `<div class=\"zeile\"><span>offen, ab einem anderen Konto gedeckt<\u002Fspan><span class=\"num\">${fmt(woanders)}<\u002Fspan><\u002Fdiv>` : ''}\n      <div class=\"zeile ergebnis\"><span>verfügbar<\u002Fspan><span class=\"num\">${fmt(frei)}<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv><\u002Fdiv><\u002Fdiv>`;\n}\n/* UEBERHOLT (18.08.2026). Der Name verspricht einen Jahreswert, geliefert wird\n   der Monatswert — dieselbe Zahl unter anderer Beschriftung. Der einzige\n   Aufrufer (liqKarteHtml) nimmt jetzt verfuegbarPer(j, 11); weitere gibt es\n   nicht. Bleibt stehen, damit ein alter eingefrorener Export, der den\n   Quelltext mitfuehrt, nichts vermisst — fuer neue Aufrufe ist verfuegbarPer\n   die richtige Adresse. */\nfunction freiPerJahresende(j) {\n  const h = ymOf(heuteISO());\n  if (j !== h.j) return null;\n  return freiPerMonatsende(h.j, h.m);\n}\n\n/* ===================================================================\n   U-6 — Zwei Zahlen, die es bisher nicht gab.\n   -------------------------------------------------------------------\n   `freiPerMonatsende` gibt fuer jeden Monat ausser dem laufenden null\n   zurueck, und `freiPerJahresende` gab bisher denselben Wert noch\n   einmal aus. Deshalb standen im Kennzahlenband dreimal dieselbe Zahl.\n\n   ANNAHME, von Albrecht zu pruefen: Verfuegbar per Ende eines kuenftigen\n   Monats = heutiges freies Geld plus die budgetierten Saldi aller Monate\n   dazwischen. Das ist eine Planzahl, kein Kontostand — sie rechnet mit\n   dem Budget, nicht mit Buchungen, und weiss nichts von Rechnungen, die\n   erst noch kommen.\n   =================================================================== */\nfunction verfuegbarPer(j, m) {\n  const h = ymOf(heuteISO());\n  const start = freiPerMonatsende(h.j, h.m);\n  if (start === null) return null;\n  if (j < h.j || (j === h.j && m < h.m)) return null;\n  let s = start, jj = h.j, mm = h.m;\n  while (jj < j || (jj === j && mm < m)) {\n    mm++; if (mm > 11) { mm = 0; jj++; }\n    s += saldoBudgetiert(jj, mm);\n  }\n  return rd(s);\n}\n\n/* Wann ist die letzte Verbindlichkeit getilgt? Gerechnet wird mit den\n   erfassten Raten bis zum letzten Budgetjahr. Wird es nicht null, sagt\n   die Funktion das — eine geschoente Null waere hier das Schlimmste. */\nfunction schuldenfrei() {\n  const h = ymOf(heuteISO());\n  const jahre = Object.keys(D.budget).map(Number).sort();\n  const letztes = jahre[jahre.length - 1] || h.j;\n  const verb = D.verbindlichkeiten.filter(v => v.aktiv !== false);\n  const summeAm = (j, m) => rd(verb.reduce((a,v) => a + Math.max(0, verbindPrognose(v, j, m)), 0));\n  let jj = h.j, mm = h.m, n = 0;\n  while (jj < letztes || (jj === letztes && mm <= 11)) {\n    if (summeAm(jj, mm) < 0.005) return { monate: n, jahr: jj, monat: mm, rest: 0 };\n    mm++; if (mm > 11) { mm = 0; jj++; }\n    n++;\n    if (n > 240) break;\n  }\n  return { monate: null, rest: summeAm(letztes, 11), bis: letztes };\n}\n\n/* ===================================================================\n   U-25 — Vollbild fuer die Tafel\n   -------------------------------------------------------------------\n   Ein Schalter, zwei Vollbilder. Der App-Teil raeumt Seitenleiste und\n   Kopfzeile weg, der Browser-Teil nimmt zusaetzlich Tab- und\n   Adressleiste. Zusammen sind das rund 300 Pixel Breite und 130 Pixel\n   Hoehe — bei einer Tabelle mit zwoelf Monatsspalten sind das drei\n   Spalten und vier Zeilen mehr.\n\n   Die beiden sind absichtlich nicht aneinander gekettet, sondern laufen\n   nur ZUSAMMEN ZURUECK. Drei Wege hinaus, alle drei muessen dasselbe\n   erreichen:\n     1. der Schalter — schaltet beides,\n     2. Escape oder F11 im Browser-Vollbild — der Browser meldet das nur\n        ueber fullscreenchange, nie ueber einen Klick, also haengt der\n        App-Teil dort und nicht am Knopf,\n     3. der Bereichswechsel — siehe zeichneKopf().\n   Verweigert der Browser das Vollbild (fehlende Berechtigung, iOS, ein\n   Aufruf ohne Nutzergeste), lehnt das Promise ab. Der App-Teil bleibt\n   dann trotzdem stehen: er ist der, der die Zeilen bringt, und ein\n   halbes Vollbild ist besser als keines.\n   =================================================================== */\nfunction browserVollbildAn() {\n  const el = document.documentElement;\n  if (!el.requestFullscreen || document.fullscreenElement) return;\n  /* Aeltere Umgebungen geben undefined statt eines Promise zurueck —\n     erst fragen, dann fangen, sonst wirft ausgerechnet der Abfangweg. */\n  const p = el.requestFullscreen();\n  if (p && p.catch) p.catch(() => {});\n}\nfunction browserVollbildAus() {\n  if (!document.fullscreenElement || !document.exitFullscreen) return;\n  const p = document.exitFullscreen();\n  if (p && p.catch) p.catch(() => {});\n}\nfunction vollbildSetzen(an) {\n  S.vollbild = !!an;\n  if (S.vollbild) browserVollbildAn(); else browserVollbildAus();\n  /* zeichne() setzt die Klasse, misst die Spalten neu und sichert die\n     Ansicht — deshalb hier kein eigener Zweig fuer irgendetwas davon. */\n  zeichne();\n}\ndocument.addEventListener('fullscreenchange', () => {\n  if (!document.fullscreenElement && S.vollbild) { S.vollbild = false; zeichne(); }\n});\n/* Der Schalter ist im Vollbild der einzige Weg zurueck — der\n   Bereichswechsel ist ja weg. Deshalb steht er in allen drei Tafeln an\n   derselben Stelle, ganz rechts, und traegt seinen Zustand im Zeichen:\n   ⤢ geht hinein, ⤡ kommt heraus. */\nfunction vollbildKnopf() {\n  return `<button class=\"knopf klein\" id=\"btnVollbild\" aria-pressed=\"${!!S.vollbild}\"\n    title=\"${S.vollbild ? 'Vollbild verlassen (Escape)' : 'Vollbild — Leiste und Kopfzeile weichen'}\"\n    aria-label=\"${S.vollbild ? 'Vollbild verlassen' : 'Vollbild'}\">${S.vollbild ? '⤡' : '⤢'}<\u002Fbutton>`;\n}\n/* Die zwei Zahlen des Kopfbandes, die im Vollbild sonst ersatzlos\n   wegfielen. Sie kommen mit, die drei uebrigen nicht — und das ist eine\n   Entscheidung, keine Bequemlichkeit:\n   «verfügbar» und «pro Tag» stehen NIRGENDS in der Tabelle. Die Tafel\n   zeigt Saldo budgetiert und Saldo kumuliert, also das Budget; was auf\n   dem Konto liegt und was das je Tag bis zum Lohn heisst, kommt aus den\n   Buchungen. Wer eine Zahl eintraegt, prueft sie genau gegen diese zwei\n   — sie im Vollbild wegzunehmen hiesse, die Arbeit zu verschlechtern,\n   fuer die man das Vollbild geholt hat.\n   Die drei leisen Werte («bis Dez», «Saldo <Mon>», Schulden, offen)\n   bleiben weg: sie sind schon im Kopfband als zweite Reihe erklaert und\n   verschwinden dort unter 1100 px von selbst. Und der Tafelkopf traegt\n   bereits fuenf Schalter — er darf nicht zur zweiten Kopfzeile werden. */\nfunction tafelKennzahlen() {\n  if (!S.vollbild || !D) return '';\n  const h = ymOf(heuteISO());\n  const w = (k, v) => `<span class=\"wert\"><span class=\"k\">${k}<\u002Fspan><span class=\"v num\">${v}<\u002Fspan><\u002Fspan>`;\n  return `<span class=\"kopfband\">${w('verfügbar', fmt(freiPerMonatsende(h.j, h.m)))}${w('pro Tag', fmt(proTag()))}<\u002Fspan>`;\n}\n\n/* ===================================================================\n   Tabellenansicht — drei Reiter (Formensprache L)\n   =================================================================== */\nfunction zeichneTabellen() {\n  /* Die Reiterzeile ist mit U-1 in die Seitenleiste gewandert, die\n     Liquiditaetszahlen in die Kopfzeile. Der Inhalt traegt nur die Tafel. */\n  $('#inhalt').innerHTML = `<div class=\"karte tafel\" id=\"tafel\"><\u002Fdiv>`;\n  const t = $('#tafel');\n  if (S.reiter === 'budget')   t.innerHTML = budgetTabelle();\n  if (S.reiter === 'verbind')  t.innerHTML = verbindTabelle();\n  if (S.reiter === 'rechnung') t.innerHTML = rechnungTabelle();\n  spaltenbreiten();\n  zebra();\n}\n/* Verteilt die Restbreite gleichmaessig auf die Zeitspalten. Die drei\n   fixierten Spalten und die Faltspalte bleiben, was sie sind — nur die\n   Zahlen bekommen den gewonnenen Platz. Unter der Mindestbreite rollt\n   die Tabelle wieder seitlich, wie zuvor. */\nfunction spaltenbreiten() {\n  const tab = $('#tafel table.gross'), roll = $('#tafel .rollflaeche');\n  if (!tab || !roll) return;\n  tab.style.removeProperty('--wz');\n  /* U-25: Die gezogenen Namensbreiten gehen VOR der Messung an die Tabelle.\n     Sie sind fuer diese Rechnung Festwerte wie die Vorgaben aus dem\n     Stylesheet — nur eben andere. Wuerden sie erst danach gesetzt, rechnete\n     die Restbreite mit den Vorgaben und die Zeitspalten faenden sich um\n     genau den gezogenen Betrag daneben wieder. */\n  const g = gezogeneBreiten(tab);\n  ['w1','w2','w3'].forEach(v => {\n    if (g[v]) tab.style.setProperty('--' + v, g[v] + 'px');\n    else tab.style.removeProperty('--' + v);\n  });\n  const cs = getComputedStyle(tab);\n  const px = n => parseFloat(cs.getPropertyValue(n)) || 0;\n  const koepfe = tab.querySelectorAll('thead tr.zeile-titel th');\n  const falt = tab.querySelectorAll('thead tr.zeile-titel th.faltzelle').length;\n  /* U-32: Die Budgettafel hat seit dem Wegfall von Zahlungsweg und Soll nur\n     noch eine fixierte Spalte. Die Rechnung muss das wissen, sonst rechnet\n     sie mit zwei Breiten, die es nicht mehr gibt. */\n  const fixN = tab.classList.contains('t-budget') ? 1 : 3;\n  const zeit = koepfe.length - fixN - 1 - falt;\n  if (zeit < 1) return;\n  /* U-25: Ist die Zeitbreite von Hand gezogen, gilt sie. Die Rechnung\n     darunter fuellt das Fenster aus — sie ist eine Vorgabe, keine Regel,\n     und wer selbst gezogen hat, hat sich gegen sie entschieden. Dass die\n     Tabelle danach seitlich rollt, ist dann seine Wahl; der Doppelklick\n     auf den Greifer holt die Rechnung zurueck. */\n  if (g.wz) { tab.style.setProperty('--wz', g.wz + 'px'); return; }\n  const rest = roll.clientWidth - px('--w1') - (fixN > 1 ? px('--w2') + px('--w3') : 0) - falt * 28 - px('--wl') - 2;\n  /* Nach oben gedeckelt (U-23). Bleibt in einem leeren Jahrgang nur eine\n     einzige offene Spalte stehen, bekaeme sie sonst die ganze Restbreite —\n     eine 670 Pixel breite Zelle fuer eine zweistellige Zahl. Der Deckel\n     liegt beim Anderthalbfachen der Grundbreite: breit genug, dass zwei,\n     drei Spalten den gewonnenen Platz noch spueren, schmal genug, dass eine\n     einzelne nicht laecherlich wird. */\n  let je = Math.min(126, Math.max(80, Math.floor(rest / zeit)));\n  tab.style.setProperty('--wz', je + 'px');\n  /* Raender und Trennlinien kosten ein paar Pixel, die sich nicht sauber\n     vorausrechnen lassen. Einmal nachmessen und nachziehen genuegt. */\n  const ueber = tab.getBoundingClientRect().width - roll.clientWidth;\n  if (ueber > 0 && je > 80) tab.style.setProperty('--wz', Math.max(80, je - Math.ceil(ueber / zeit)) + 'px');\n}\n/* ===================================================================\n   U-25 — Spaltenbreiten ziehen\n   -------------------------------------------------------------------\n   Die drei Namensspalten gehen EINZELN, die Zeitspalten GEMEINSAM.\n   Das ist keine Sparmassnahme, sondern folgt aus spaltenbreiten()\n   darueber: die Zeitspalten teilen sich eine berechnete Breite (--wz),\n   damit die Tabelle genau ins Fenster passt. Waere jede einzeln\n   ziehbar, gaebe es diese eine Breite nicht mehr, und mit ihr fiele die\n   Rechnung weg, die die Tabelle ins Fenster legt. Der Bedarf sitzt\n   ohnehin bei den Namen: «Krankenkasse Zusatzversicherung» und «Miete»\n   sind verschieden lang, «Januar» und «Februar» nicht.\n\n   Nicht ziehbar sind die Faltspalte (28 px Luecke, keine Spalte) und\n   die Jahresspalte ganz rechts — sie ist der Anker, gegen den gelesen\n   wird, und haette als einzige Spalte am Rollrand keinen sichtbaren\n   Greifer, wenn seitlich gerollt wird.\n\n   Gemerkt wird in S.breiten, je Tabelle getrennt und nur die\n   Abweichung. Nichts davon fasst D an: eine Spaltenbreite ist keine\n   Zahl ueber Geld.\n   =================================================================== */\nconst BREIT_MIN  = 60;    /* darunter trifft der Zeiger den Greifer nicht mehr */\nconst BREIT_REST = 160;   /* so viel Rollflaeche bleibt in jedem Fall fuer den Rest */\n\nfunction tafelName(tab) {\n  return tab.classList.contains('t-budget')  ? 'budget'\n       : tab.classList.contains('t-verbind') ? 'verbind' : null;\n}\n/* Die Rechnungstafel hat keine fixierten Spalten und keine Greifer — sie\n   liefert null und bekommt damit ein leeres Objekt, nicht die Breiten des\n   Budgets. */\nfunction gezogeneBreiten(tab) {\n  const n = tafelName(tab);\n  return (n && S.breiten && S.breiten[n]) || {};\n}\nfunction breiteMerken(name, v, px) {\n  if (!name) return;\n  if (!S.breiten) S.breiten = {};\n  if (!S.breiten[name]) S.breiten[name] = {};\n  if (px === null) delete S.breiten[name][v]; else S.breiten[name][v] = px;\n  persistAnsicht();\n}\n/* Fokussierbar sind vier Greifer, nicht zwanzig: die drei Namensspalten\n   und der ERSTE Zeitgreifer. Alle Zeitgreifer schreiben denselben Wert —\n   ein zweiter Tabstopp dafuer waere einer ohne eigene Funktion. Und die\n   Kopfzeile liegt vor den Eingabezellen: jeder ueberfluessige Halt dort\n   kostet die eigentliche Tabellenarbeit einen Tastendruck. */\nfunction greifer(v, tastatur) {\n  return `<span class=\"greifer\" data-greif=\"${v}\" role=\"separator\" aria-orientation=\"vertical\"${\n    tastatur ? ' tabindex=\"0\"' : ''} aria-label=\"Spaltenbreite ändern\"\n    title=\"Ziehen ändert die Breite · Doppelklick setzt zurück\"><\u002Fspan>`;\n}\n\nlet _zieh = null;\nfunction greiferZiel(gr) {\n  const tab = gr.closest('table.gross'), roll = $('#tafel .rollflaeche');\n  if (!tab || !roll) return null;\n  const name = tafelName(tab);\n  return name ? { tab, roll, name, v: gr.dataset.greif } : null;\n}\n/* Untergrenze und Deckel an einer Stelle — Ziehen und Pfeiltaste sollen\n   nicht zwei verschiedene Vorstellungen davon haben, was erlaubt ist. */\nfunction breiteZeigen(z, px) {\n  const deckel = Math.max(BREIT_MIN, z.roll.clientWidth - BREIT_REST);\n  z.px = Math.round(Math.min(deckel, Math.max(BREIT_MIN, px)));\n  z.tab.style.setProperty('--' + z.v, z.px + 'px');\n}\ndocument.addEventListener('mousedown', ev => {\n  const gr = ev.target.closest && ev.target.closest('.greifer');\n  if (!gr || ev.button !== 0) return;\n  const z = greiferZiel(gr);\n  if (!z) return;\n  /* mousedown und nicht pointerdown: ein abgebrochenes pointerdown\n     unterdrueckt in Chrome die daraus folgenden Mausereignisse — und\n     damit ausgerechnet den Doppelklick, der zuruecksetzt. Das\n     preventDefault hier verhindert nur, dass der Zug den Kopftext\n     markiert. */\n  ev.preventDefault();\n  z.x0 = ev.clientX;\n  z.b0 = parseFloat(getComputedStyle(z.tab).getPropertyValue('--' + z.v)) || 0;\n  z.px = z.b0;\n  _zieh = z;\n  document.body.classList.add('zieht');\n});\ndocument.addEventListener('mousemove', ev => {\n  if (!_zieh) return;\n  /* Wer ausserhalb des Fensters loslaesst, sendet kein mouseup hierher —\n     der Zug haenge sonst fest, samt gesperrter Textauswahl. ev.buttons\n     sagt, was der Nutzer tatsaechlich haelt; steht es auf null, ist der\n     Zug vorbei, egal ob wir das Loslassen gesehen haben. */\n  if (!ev.buttons) return zugBeenden();\n  /* Beim Ziehen wird NICHT gezeichnet — eine einzige CSS-Variable je\n     Bewegung, den Rest rechnet der Browser. Die left-Werte der fixierten\n     Spalten haengen an denselben Variablen (left: var(--w1) bzw.\n     calc(var(--w1) + var(--w2))) und ziehen deshalb von selbst mit.\n     Ein zeichne() je Mausereignis baute stattdessen sechzig Zeilen neu\n     auf und verloere unterwegs den Zeiger. */\n  breiteZeigen(_zieh, _zieh.b0 + (ev.clientX - _zieh.x0));\n});\nfunction zugBeenden() {\n  if (!_zieh) return;\n  const z = _zieh; _zieh = null;\n  document.body.classList.remove('zieht');\n  breiteMerken(z.name, z.v, z.px);\n  /* Erst beim Loslassen nachrechnen: die Zeitspalten teilen sich die\n     Restbreite, und die hat sich mit der Namensspalte geaendert. */\n  spaltenbreiten();\n}\ndocument.addEventListener('mouseup', zugBeenden);\n/* Doppelklick auf den Greifer nimmt die Abweichung heraus — danach gilt\n   wieder die Vorgabe aus dem Stylesheet und, bei den Zeitspalten, die\n   Rechnung in spaltenbreiten(). */\ndocument.addEventListener('dblclick', ev => {\n  const gr = ev.target.closest && ev.target.closest('.greifer');\n  if (!gr) return;\n  const z = greiferZiel(gr);\n  if (!z) return;\n  ev.preventDefault();\n  z.tab.style.removeProperty('--' + z.v);\n  breiteMerken(z.name, z.v, null);\n  spaltenbreiten();\n});\n/* Sechzehn Pixel je Tastendruck: eine Zahlenstelle ist rund acht Pixel\n   breit, ein Schritt bringt also sichtbar eine Stelle mehr oder weniger.\n   Ein Pixel je Druck waere Beschaeftigung, hundert waere keine Feinarbeit. */\ndocument.addEventListener('keydown', ev => {\n  const gr = ev.target;\n  if (!gr || !gr.classList || !gr.classList.contains('greifer')) return;\n  const d = ev.key === 'ArrowRight' ? 16 : ev.key === 'ArrowLeft' ? -16 : 0;\n  if (!d) return;\n  ev.preventDefault();\n  const z = greiferZiel(gr);\n  if (!z) return;\n  breiteZeigen(z, (parseFloat(getComputedStyle(z.tab).getPropertyValue('--' + z.v)) || 0) + d);\n  breiteMerken(z.name, z.v, z.px);\n  spaltenbreiten();\n});\n\n/* ===================================================================\n   U-28 — Zeilen innerhalb einer Kategorie ordnen\n   -------------------------------------------------------------------\n   Albrechts Satz war: «ich moechte gerne innerhalb einer Kategorie die\n   Zeilen manuell anordnen koennen.» Die Daten konnten es laengst —\n   `zeilen` tragen ein `rang`, und zeilenVon() sortiert danach. Gefehlt\n   hat nur der Weg, dieses Feld zu aendern.\n\n   ZWEI WEGE, WEIL SIE VERSCHIEDENE FRAGEN BEANTWORTEN\n   In der Budgettabelle steht die Zeile neben ihren Zahlen: dort faellt\n   auf, dass zwei zusammengehoerende Posten auseinanderstehen, und dort\n   soll man es auch beheben koennen, ohne die Arbeit zu verlassen. Im\n   Verwaltungsbaum steht die Struktur ohne Zahlen und ohne Eingabefelder:\n   dort raeumt man auf. Beide schreiben dasselbe Feld ueber dieselbe\n   Funktion — zwei Oberflaechen, eine Wahrheit.\n\n   RANGVERGABE: NACH JEDEM ZUG DIE GANZE KATEGORIE NEU, IN ZEHNERSCHRITTEN\n   Die Raenge im Bestand sind gewachsen: 1..29 quer ueber fuenf\n   Kategorien, daneben eine Kategorie mit 100..102 und zwei, die wieder\n   bei 1 anfangen. Gelesen wird `rang` NUR innerhalb einer Kategorie\n   (zeilenVon, vwBaum, zeilenWahl, die Liste der Ausgeblendeten, die\n   Berichte) — nachgesehen an jeder einzelnen Stelle. Eine Neuvergabe je\n   Kategorie kann deshalb nichts anderswo umstellen.\n   Zehnerschritte statt 1,2,3: sie kosten in der Datei nichts und lassen\n   eine spaetere Einfuegung zwischen zwei Zeilen zu, OHNE die ganze\n   Kategorie neu zu schreiben. Bei einer Datei, in der jede Aenderung ein\n   Git-Commit ist, ist der Unterschied zwischen «ein Feld geaendert» und\n   «acht Felder geaendert» im Verlauf lesbar.\n   `data-add` (Zeile hinzufuegen) setzt weiterhin max+Schritt und haengt\n   damit hinten an — das war schon so und bleibt richtig.\n\n   EIN ZUG, EIN SCHREIBVORGANG\n   Waehrend des Ziehens wird NICHTS geschrieben: die Bewegung setzt eine\n   CSS-Klasse, mehr nicht. Erst das Loslassen ruft zeileEinordnen(), und\n   das ruft merkeStand() einmal, vergibt alle Raenge und ruft persist()\n   einmal. Ein persist() je Zwischenschritt waere ein Push je Mausbewegung.\n   Aendert der Zug die Reihenfolge nicht (losgelassen, wo sie herkam),\n   wird gar nichts geschrieben — auch kein Rueckgaengig angeboten.\n\n   WAS NICHT PASSIERT\n   Keine Zeile wechselt die Kategorie. Der Zug gilt nur im Block der\n   eigenen Kategorie; ausserhalb gibt es kein Ziel, und das Loslassen tut\n   nichts. `kategorieId` wird von hier aus nie geschrieben — eine Zeile\n   umzuhaengen zoege Budgetwerte, Buchungen und Rechnungen mit und ist\n   eine andere Entscheidung als eine Reihenfolge.\n   Und die Summen aendern sich nicht: katSumme und saldoBudgetiert\n   addieren, und Addition kennt keine Reihenfolge.\n   =================================================================== */\nconst RANG_SCHRITT = 10;\n\n/* ===================================================================\n   U-31 — dasselbe fuer die Glaeubiger\n   -------------------------------------------------------------------\n   Albrechts Satz: «Koennten wir die Glaeubiger in der Kategrie auch frei\n   anordenbar machen.» Das ist dieselbe Frage wie bei den Zeilen, und\n   deshalb ist die Antwort dieselbe Maschine — keine zweite daneben.\n\n   ZWEI UNTERSCHIEDE, DIE DER UMBAU AUSGLEICHT\n   Erstens: `zeilen` tragen `rang` seit je, `verbindlichkeiten` nicht. Das\n   holt verbRangFuellen() in normalisieren() nach, indem es die\n   Dateireihenfolge festschrei .filter(z => z.kategorieId === k),\n    block:  o  => o.kategorieId,\n    name:   o  => o.bezeichnung,\n    /* Eine gespiegelte Zeile hat keinen Platz zu vergeben: ihre Zahlen\n       kommen aus den Ratenplaenen oder den Rechnungen, und ihre Stellung\n       ist eine Folge, keine Entscheidung. Sie behaelt ihren Platz in der\n       Liste und wird bei der Neuvergabe mitgezaehlt — nur anfassen laesst\n       sie sich nicht. */\n    fest:   o  => gespiegelt(o),\n    wo:     'innerhalb ihrer Kategorie',\n    oid:    el => el.dataset.zeile,\n    oblock: el => el.dataset.zkat,\n    reihe:  k  => '[data-zkat=\"' + k + '\"]',\n    kopf:   k  => 'tr.zeile-kat[data-kat=\"' + k + '\"], .ast.kategorie[data-kat=\"' + k + '\"]',\n    fuss:   k  => 'tr.zeile-summe[data-katsumme=\"' + k + '\"]',\n  },\n  verb: {\n    wort:   'Gläubiger',\n    holen:  id => verbind(id),\n    liste:  g  => D.verbindlichkeiten.filter(v => v.gruppe === g),\n    block:  o  => o.gruppe,\n    name:   o  => o.bezeichnung,\n    fest:   () => false,\n    wo:     'innerhalb seiner Gruppe',\n    oid:    el => el.dataset.verb,\n    oblock: el => el.dataset.vgrp,\n    reihe:  g  => '[data-vgrp=\"' + g + '\"]',\n    kopf:   g  => 'tr.zeile-sub[data-gruppe=\"' + g + '\"]',\n    fuss:   g  => 'tr.zeile-summe[data-gsumme=\"' + g + '\"]',\n  },\n};\n\n/* Alle Eintraege eines Blocks in der Reihenfolge, in der sie gelten —\n   auch die, die in diesem Jahr nicht sichtbar sind oder gerade\n   weggefaltet wurden. Umgeordnet wird auf DIESER Liste, nicht auf der\n   gezeigten: sonst verlieren die versteckten Eintraege beim naechsten Zug\n   ihren Platz zwischen den sichtbaren. */\nfunction ordListe(art, key) {\n  return ORDNUNG[art].liste(key).sort((a, b) => (a.rang || 0) - (b.rang || 0));\n}\n/* Die eine Stelle, an der `rang` geschrieben wird — fuer beide Arten.\n   `vorId` sagt, VOR welchen Eintrag der genommene rueckt; null heisst ans\n   Ende. Die Antwort ist wahr, wenn sich etwas geaendert hat — nur dann\n   ist gespei was zu suchen hat. Ohne das zaehlte die Jahressumme rechts\n     Jahre mit, in denen die Zeile gar nicht mehr steht. */\n  const wertSicht = (z, s) => zeileSicht(z, spJahr(s)) ? wert(z, s) : 0;\n  /* U-21: die Zeilenmenge wird je Spaltenjahr neu gebildet. Wer sie einmal\n     fuer S.jahr bildete und ueber alle Spalten wiederverwendete, zeigte in\n     der Spalte 2026 eine Zeile, die es dort noch gar nicht ausgeblendet gab\n     — oder liesse sie weg, obwohl sie 2026 zaehlte. */\n  const katW = (k, s) => alle ? rd(zeilenVon(k.id, s.key).reduce((a,z)=>a+zeilenJahr(z,s.key)*(z.gegenrichtung?-1:1),0))\n                              : katSumme(k, S.jahr, s.key);\n\n  /* Eine Spalte gilt als leer, wenn weder eine sichtbare Zeile noch eine\n     der drei Kopfzahlen darin etwas stehen hat. Die Zeilenmenge haengt am\n     Spaltenjahr — deshalb steht sie im Praedikat, nicht davor. */\n  const sichtZeilen = s => sicht.flatMap(k => zeilenVon(k.id, spJahr(s)));\n  const hatWert = s =>\n       sichtZeilen(s).some(z => Math.abs(wert(z, s)) >= 0.005)\n    || Math.abs(saldoRoh(s, alle)) >= 0.005\n    || Math.abs(kumRoh(s, alle))   >= 0.005;\n  const sp = spaltenSicht(spAlle, hatWert);\n\n  /* U-21: Welche Zeilen ueberhaupt eine Reihe bekommen. Eine Tabelle hat\n     eine Zeilenmenge, aber «Alle Jahre» zeigt viele Jahre nebeneinander:\n     dort steht eine Zeile, sobald sie in IRGENDEINER gezeigten Spalte\n     sichtbar ist — sonst waere der Wert, den sie 2026 noch trug, gar nicht\n     mehr zu sehen. In den Spalten danach bleibt ihre Zelle leer (zelle()).\n     In den uebrigen Ansichten zeigt die Tabelle genau ein Jahr: S.jahr. */\n  const zeilenReihen = katId => alle\n    ? D.zeilen.filter(z => z.kategorieId === katId && spAlle.some(s => zeileSicht(z, s.key)))\n              .sort((a,b) => (a.rang||0) - (b.rang||0))\n    : zeilenVon(katId, S.jahr);\n\n  /* ===================================================================\n     U-23 — Leere Zeilen falten, das senkrechte Gegenstueck zu U-2\n     -------------------------------------------------------------------\n     Dieselbe Beobachtung, um neunzig Grad gedreht: eine Zeile, die im\n     ganzen angezeigten Zeitraum keinen einzigen Wert traegt, kostet eine\n     Zeilenhoehe und sagt nichts. Bei siebenunddreissig Positionen ist das\n     der groessere Teil der Tabelle.\n     Leer heisst: kein Soll UND in keiner der gezeigten Spalten ein Wert.\n     Gefragt wird mit wertSicht, nicht mit wert — dieselbe Funktion, aus\n     der auch die Jahresspalte rechts entsteht. Sonst koennte eine Zeile\n     als leer gelten, deren Jahrestotal sichtbar von null abweicht.\n\n     WAS HIER NICHT PASSIERT: die Zeilenmenge der Summen wird nicht\n     angefasst. katW, katSumme, saldoBudgetiert und sichtZeilen laufen\n     weiter ueber zeilenVon() — also ueber ALLE Zeilen. Gefaltet wird\n     ausschliesslich, was gezeichnet wird. Waere es anders, aenderte ein\n     Klick auf den Schalter die Summen, und das ist bei Geld der\n     schlimmste Fehler, den eine Ansichtsoption machen kann. */\n  const sollHier = z => zeileSicht(z, S.jahr) ? (zeilenSoll(z, S.jahr) || 0) : 0;\n  const zeileLeer = z => Math.abs(sollHier(z)) < 0.005\n                      && !spAlle.some(s => Math.abs(wertSicht(z, s)) >= 0.005);\n  /* Erst planen, dann zeichnen: die zweite Sicherung unten braucht den Blick\n     auf die ganze Tabelle und nicht nur auf eine Kategorie. */\n  const geplant = sicht.map(k => {\n    const liste = zeilenReihen(k.id);\n    const leer = S.zeilenAlle ? [] : liste.filter(zeileLeer);\n    /* Eine einzelne Zeile zu falten spart eine Zeilenhoehe und kostet eine\n       Klappzeile — dieselbe Rechnung wie beim Block aus einer Spalte. */\n    return leer.length < 2 ? { k, zeigen: liste, leer: [] }\n                           : { k, zeigen: liste.filter(z => !zeileLeer(z)), leer };\n  });\n  /* U-23, zweite Sicherung — dieselbe Ueberlegung wie bei der letzten offenen\n     Spalte, nur senkrecht: bliebe nach dem Falten keine Zeile mehr stehen, in\n     die sich etwas eintragen liesse, faellt die Faltung ganz aus. Das ist\n     genau der Fall der leeren Huelle: dort ist JEDE Zeile leer, und eine\n     Tabelle aus lauter Klappzeilen bietet keine Stelle, an der man anfangen\n     koennte. Der Schalter im Tafelkopf fuehrt zwar zurueck, aber er ist ein\n     Ausweg und kein Einstieg.\n     Gefragt wird nach einer NICHT gespiegelten Zeile: eine gespiegelte holt\n     ihre Zahlen aus den Ratenplaenen oder den Rechnungen und traegt kein\n     Eingabefeld — sie steht zwar da, ist aber kein Anfang.\n     Der Sprung, sobald die erste Zahl steht — dann falten sich die uebrigen\n     Zeilen —, ist bewusst in Kauf genommen: er passiert genau einmal, und\n     der Schalter haelt sie offen, solange man eintraegt. */\n  if (!geplant.some(g => g.zeigen.some(z => !gespiegelt(z))))\n    geplant.forEach(g => { g.zeigen = zeilenReihen(g.k.id); g.leer = []; });\n  const leerZeilen = geplant.reduce((a, g) => a + g.leer.length, 0);\n\n  let rows = '';\n  geplant.forEach(({ k, zeigen: zeilen, leer }) => {\n    const zu = S.zu.includes(k.id);\n    const kt = konto(k.kontoId);\n    rows += `<tr class=\"zeile-luft\"><td colspan=\"${sp.length+2}\"><\u002Ftd><\u002Ftr>`;\n    rows += `<tr class=\"zeile-kat\" data-kat=\"${k.id}\">\n      <td class=\"klappzelle namenszelle\">\n        <button class=\"klappkopf\" aria-expanded=\"${!zu}\" data-klapp=\"${k.id}\">\n          <span class=\"chev\">▾<\u002Fspan><span class=\"t\">${k.name}<\u002Fspan><\u002Fbutton>\n        <span class=\"katkonto\">${kt ? kt.nr + ' ' + kt.name : ''}<\u002Fspan>\n        <button class=\"kat-add\" type=\"button\" data-add=\"${k.id}\">Zeile hinzufügen<\u002Fbutton><\u002Ftd>\n      ${reihe(sp, s => `<td class=\"n ${s.jetzt?'jetzt':''}\">${zu ? fmt0(katW(k,s)) : ''}<\u002Ftd>`)}\n      <td class=\"n\">${zu ? fmt0(spAlle.reduce((a,s)=>a+katW(k,s),0)) : ''}<\u002Ftd><\u002Ftr>`;\n\n    zeilen.forEach(z => {\n      const gesp = gespiegelt(z);\n      /* U-21: in «Alle Jahre» kann eine Zeile stehen, die in S.jahr schon\n         aus ist — dann traegt sie weder Soll noch Jahressumme, sondern nur\n         die Spalten der Jahre, in denen sie noch galt. */\n      const hier = zeileSicht(z, S.jahr);\n      const soll = hier ? zeilenSoll(z, S.jahr) : null;\n      /* U-28: data-zkat statt data-kat. Der Name data-kat ist an der\n         Kategoriezeile vergeben, und die Sprungliste sucht mit\n         $('[data-kat=\"…\"]') das ERSTE Vorkommen — mit demselben Namen an\n         siebenunddreissig Datenzeilen waere das eine Falle, die erst beim\n         naechsten Umbau zuschnappt. */\n      rows += `<tr class=\"zeile-daten ${zu?'zugeklappt':''} ${gesp?'gespiegelt':''}\"\n        data-zeile=\"${z.id}\" data-zkat=\"${k.id}\" data-oart=\"zeile\">\n        <td class=\"namenszelle\">${zeilenGriff(z)}<span class=\"nz\" data-zblatt=\"${z.id}\"\n          title=\"${gesp ? 'Zeigt, woher diese Zahlen kommen' : 'Stammdaten, Verlauf und Jahre'}\">${z.bezeichnung}<\u002Fspan>\n          <span class=\"weg\">${zahlungsweg(z)}<\u002Fspan>\n          ${gesp || !hier ? '' : `<button class=\"zeile-weg\" type=\"button\" data-weg=\"${z.id}\">ab ${S.jahr} ausblenden<\u002Fbutton>`}<\u002Ftd>\n        ${reihe(sp, s => zelle(z, s, alle, gesp))}\n        <td class=\"n\">${fmt0(spAlle.reduce((a,s)=>a+wertSicht(z,s),0))}<\u002Ftd><\u002Ftr>`;\n    });\n\n    /* Die Klappzeile steht am Fuss ihrer Kategorie, direkt vor der Summe:\n       dort stoert sie die Reihenfolge der gepflegten Zeilen nicht und\n       liegt trotzdem in der Gruppe, zu der sie gehoert. Kein colspan —\n       die drei fixierten Spalten muessen ihre Breite behalten, sonst\n       verrutscht beim Seitwaertsrollen die ganze Tabelle (U-4). */\n    if (leer.length) rows += `<tr class=\"zeile-leerfalt ${zu?'zugeklappt':''}\" data-kat-leer=\"${k.id}\">\n      <td class=\"namenszelle\"><button class=\"leerfalt\" type=\"button\" data-zeilenauf=\"1\"\n        title=\"${leer.map(z => z.bezeichnung).join(' · ')}\">${leer.length} leere Zeilen<\u002Fbutton><\u002Ftd>\n      ${reihe(sp, s => `<td class=\"n ${s.jetzt?'jetzt':''}\"><\u002Ftd>`)}\n      <td class=\"n\"><\u002Ftd><\u002Ftr>`;\n\n    /* U-28: Die Summenzeile traegt ihre Kategorie, damit der Zug weiss, wo\n       der Block aufhoert — bis dorthin gilt «ans Ende», danach nichts mehr. */\n    rows += `<tr class=\"zeile-summe ${zu?'zugeklappt':''}\" data-katsumme=\"${k.id}\">\n      <td>Summe ${k.name}<\u002Ftd>\n      ${reihe(sp, s => `<td class=\"n ${s.jetzt?'jetzt':''}\">${fmt0(katW(k,s))}<\u002Ftd>`)}\n      <td class=\"n\">${fmt0(spAlle.reduce((a,s)=>a+katW(k,s),0))}<\u002Ftd><\u002Ftr>`;\n  });\n\n  const saldo = s => saldoRoh(s, alle);\n  const kum   = s => kumRoh(s, alle);\n  const weg   = gefaltet(sp);\n  /* U-25: der erste offene Zeitkopf traegt den einzigen Tastaturgriff\n     der gemeinsamen Zeitbreite. */\n  const zeit1 = sp.findIndex(x => !x.falt);\n\n  return `<div class=\"tafel-kopf\">\n      <span class=\"titel\">Budget ${zeitTitel()}<\u002Fspan>${tafelKennzahlen()}\n      <span class=\"kopfwerkzeug\"><button class=\"knopf klein ${gewaehlt.length?'primaer':''}\" id=\"btnKat\"\n        aria-expanded=\"false\">${gewaehlt.length ? gewaehlt.length + ' von ' + kats.length + ' Kategorien' : 'Kategorien'} ▾<\u002Fbutton><\u002Fspan>\n      <span class=\"kopfwerkzeug\"><button class=\"knopf klein\" id=\"btnSprung\">Springe zu<\u002Fbutton><\u002Fspan>\n      <button class=\"knopf klein\" id=\"btnKlappAlle\">${S.zu.length ? 'Alle aufklappen' : 'Alle zuklappen'}<\u002Fbutton>\n      ${weg || S.monateAlle ? `<button class=\"knopf klein\" data-faltauf=\"${S.monateAlle?'0':'1'}\"\n        >${S.monateAlle ? 'Leere Monate falten' : weg + ' leere Monate gefaltet'}<\u002Fbutton>` : ''}\n      ${leerZeilen || S.zeilenAlle ? `<button class=\"knopf klein\" data-zeilenauf=\"${S.zeilenAlle?'0':'1'}\"\n        >${S.zeilenAlle ? 'Leere Zeilen falten' : leerZeilen + ' leere Zeilen gefaltet'}<\u002Fbutton>` : ''}\n      ${vollbildKnopf()}\n    <\u002Fdiv>\n    <div class=\"filterzeile\" id=\"filterzeile\" hidden><span class=\"lab\">${gewaehlt.length ? 'Ausgewählt' : 'Alle sichtbar — wähle aus'}<\u002Fspan>\n      ${kats.map(k => `<button class=\"filter\" data-filter=\"${k.id}\" aria-pressed=\"${gewaehlt.includes(k.id)}\">${k.name}<\u002Fbutton>`).join('')}\n      ${gewaehlt.length ? '<button class=\"knopf klein\" id=\"btnFilterAlle\">Auswahl aufheben<\u002Fbutton>' : ''}<\u002Fdiv>\n    <div class=\"rollflaeche\"><table class=\"gross fixiert t-budget\">\n      <thead>\n        <tr class=\"zeile-titel\"><th class=\"t\">Bezeichnung${greifer('w1', true)}<\u002Fth>\n          ${sp.map((s,i) => s.falt ? faltKopf(s)\n            : `<th class=\"n ${s.jetzt?'jetzt':''}\">${s.label}${greifer('wz', i === zeit1)}<\u002Fth>`).join('')}\n          <th class=\"n\">${alle?'Total':'Jahr'}<\u002Fth><\u002Ftr>\n        <tr class=\"zeile-saldo\"><td>Saldo budgetiert<\u002Ftd>\n          ${reihe(sp, s => `<td class=\"n ${s.jetzt?'jetzt':''} ${saldo(s)<0?'neg':'pos'}\">${fmt(saldo(s))}<\u002Ftd>`)}\n          <td class=\"n ${spAlle.reduce((a,s)=>a+saldo(s),0)<0?'neg':'pos'}\">${fmt(spAlle.reduce((a,s)=>a+saldo(s),0))}<\u002Ftd><\u002Ftr>\n        <tr class=\"zeile-kum\"><td>Saldo kumuliert<\u002Ftd>\n          ${reihe(sp, s => `<td class=\"n ${s.jetzt?'jetzt':''}\">${fmt(kum(s))}<\u002Ftd>`)}\n          <td class=\"n\"><\u002Ftd><\u002Ftr>\n        ${gewaehlt.length ? `<tr class=\"zeile-auswahl\"><td>Summe Auswahl\n            <span class=\"muted\">${sicht.map(k => k.name).join(' + ')}<\u002Fspan><\u002Ftd>\n          ${reihe(sp, s => `<td class=\"n ${s.jetzt?'jetzt':''}\">${fmt(sicht.reduce((a,k)=>a+katW(k,s),0))}<\u002Ftd>`)}\n          <td class=\"n\">${fmt(spAlle.reduce((a,s)=>a+sicht.reduce((b,k)=>b+katW(k,s),0),0))}<\u002Ftd><\u002Ftr>` : ''}\n      <\u002Fthead><tbody>${rows}<\u002Ftbody><\u002Ftable><\u002Fdiv>`;\n}\n/* Das Soll ist eine gepflegte Zahl wie jede andere — ausser dort, wo es\n   gespiegelt ist (U-8). Bei den drei Schuldenzeilen kommt es aus den\n   Ratenplaenen der Verbindlichkeiten, bei der Rechnungszeile aus den\n   erfassten Rechnungen. Dort waere ein Eingabefeld eine Luege: was man\n   hineinschriebe, waere beim naechsten Zeichnen wieder weg. */\nfunction sollZelle(z, soll, gesp) {\n  if (gesp || _ro || S.zeitraum === 'alle')\n    return `<td class=\"n${gesp ? ' gespiegelt-wert' : ''}\"${gesp ? ' title=\"kommt aus ' +\n      (zeileGruppe[z.id] ? 'den Ratenplänen' : 'den erfassten Rechnungen') + '\"' : ''}>${fmt0(soll)}<\u002Ftd>`;\n  return `<td class=\"bearbeitbar n soll\" data-soll=\"${z.id}\">\n    <input type=\"text\" value=\"${soll ? fmt(soll) : ''}\" placeholder=\"0.00\" inputmode=\"decimal\"><\u002Ftd>`;\n}\nfunction zahlungsweg(z) {\n  const w = z.zahlungsweg || {};\n  return [w.tag ? w.tag + '.' : '', w.art || ''].filter(Boolean).join(' ');\n}\nfunction zelle(z, s, alle, gesp) {\n  const kl = 'n ' + (s.jetzt ? 'jetzt ' : '');\n  /* U-21: In einem Jahr, in dem die Zeile ausgeblendet ist, bleibt die Zelle\n     LEER und nicht bearbeitbar — weder «0.00» noch «–». Beides waere eine\n     Aussage ueber einen Betrag, und es gibt in diesem Jahr keinen. */\n  if (!zeileSicht(z, alle ? s.key : S.jahr)) return `<td class=\"${kl}\"><\u002Ftd>`;\n  const w = alle ? zeilenJahr(z, s.key) : zeilenwert(z, S.jahr, s.key);\n  /* Nicht bearbeitbar, wo der Wert anderswo gepflegt wird (Formensprache B) */\n  if (alle || gesp || _ro) return `<td class=\"${kl}\">${fmtG0(w)}<\u002Ftd>`;\n  const mark = S.markiert.includes(z.id + ':' + s.key) ? ' markiert' : '';\n  return `<td class=\"bearbeitbar ${kl}${mark}\" data-z=\"${z.id}\" data-m=\"${s.key}\">\n    <input type=\"text\" value=\"${w ? fmtG(w) : ''}\" placeholder=\"0\" inputmode=\"decimal\"><\u002Ftd>`;\n}\n\n/* ---- Verbindlichkeiten (A-40, A-41) --------------------------------- */\nfunction verbindTabelle() {\n  const spAlle = spaltenKoepfe(), alle = S.zeitraum === 'alle';\n  const stand = (v, s) => alle ? verbindPrognose(v, s.key, 11) : verbindPrognose(v, S.jahr, s.key);\n  const zahl  = (v, s) => alle ? rd([...Array(12).keys()].reduce((a,m)=>a+rate(v,s.key,m),0)) : rate(v, S.jahr, s.key);\n  const aktiv = D.verbindlichkeiten.filter(v => v.aktiv !== false);\n  /* Das Praedikat muss alles pruefen, was in der Spalte steht — nicht nur die\n     Raten. Der thead traegt hier dieselben zwei Kopfzahlen wie das Budget\n     (U-7). Wer nur die Raten fragt, faltet eine Spalte weg, deren Saldo im\n     Jahrestotal weiterzaehlt: die sichtbaren Zellen addieren sich dann nicht\n     mehr auf das angezeigte Total. Gleiche Bedingung wie in budgetTabelle. */\n  const sp = spaltenSicht(spAlle, s => aktiv.some(v => Math.abs(zahl(v, s)) >= 0.005)\n    || Math.abs(saldoRoh(s, alle)) >= 0.005\n    || Math.abs(kumRoh(s, alle))   >= 0.005);\n  /* Die Uebertragsspalte rechnet den Stand per letzter Spalte. Ohne ein einziges\n     Budgetjahr gibt spaltenKoepfe() in der Sicht «Alle Jahre» ein leeres Array\n     zurueck: spAlle[-1] ist undefined, und stand(v, undefined) stuerzt am Zugriff\n     auf .key. Das ist der Startzustand der neuen leeren Huelle — dort gibt es\n     keinen Uebertrag zu rechnen, dort steht ein Strich. */\n  const letzte = spAlle[spAlle.length-1];\n  const uebertrag = fn => letzte === undefined ? '–' : fn(letzte);\n  let rows = '';\n  GRUPPEN.forEach(g => {\n    /* U-31: in Rangfolge statt in Dateireihenfolge. Der Filter ist derselbe\n       geblieben — was hier dasteht, ist weiter nur das Aktive; geordnet wird\n       aber auf der vollen Liste der Gruppe (ordListe), damit ein aus-\n       geblendeter Glaeubiger seinen Platz zwischen den sichtbaren behaelt. */\n    const liste = ordListe('verb', g.id).filter(v => v.aktiv !== false);\n    if (!liste.length) return;\n    const zu = S.zu.includes('g_' + g.id);\n    rows += `<tr class=\"zeile-luft\"><td colspan=\"${sp.length+4}\"><\u002Ftd><\u002Ftr>`;\n    rows += `<tr class=\"zeile-sub\" data-gruppe=\"${g.id}\"><td class=\"klappzelle namenszelle\">\n        <button class=\"klappkopf\" aria-expanded=\"${!zu}\" data-klapp=\"g_${g.id}\">\n          <span class=\"chev\">▾<\u002Fspan><span class=\"t\">${g.name}<\u002Fspan><\u002Fbutton>\n        ${alle || _ro ? '' : `<button class=\"kat-add\" type=\"button\" data-vadd=\"${g.id}\">Gläubiger hinzufügen<\u002Fbutton>`}<\u002Ftd>\n      <td class=\"n\">${fmt0(rd(liste.reduce((a,v)=>a+verbindStandHeute(v),0)))}<\u002Ftd><td class=\"n\"><\u002Ftd>\n      ${reihe(sp, s => `<td class=\"n ${s.jetzt?'jetzt':''}\">${zu ? fmt0(rd(liste.reduce((a,v)=>a+zahl(v,s),0))) : ''}<\u002Ftd>`)}\n      <td class=\"n\"><\u002Ftd><\u002Ftr>`;\n    liste.forEach(v => {\n      rows += `<tr class=\"zeile-daten ${zu?'zugeklappt':''}\" data-verb=\"${v.id}\"\n        data-vgrp=\"${g.id}\" data-oart=\"verb\">\n        <td class=\"namenszelle\">${ordGriff('verb', v)}<span class=\"nz\" data-schuld=\"${v.id}\">${v.bezeichnung}<\u002Fspan><\u002Ftd>\n        <td class=\"n\">${fmt(verbindStandHeute(v))}<\u002Ftd>\n        <td class=\"n\">${fmt0(((v.raten && v.raten[String(S.jahr)])||{}).soll)}<\u002Ftd>\n        ${reihe(sp, s => alle || _ro\n          ? `<td class=\"n ${s.jetzt?'jetzt':''}\">${fmt0(zahl(v,s))}<\u002Ftd>`\n          : `<td class=\"bearbeitbar n ${s.jetzt?'jetzt':''}\" data-vr=\"${v.id}\" data-m=\"${s.key}\">\n               <input type=\"text\" value=\"${rate(v,S.jahr,s.key)?fmt(rate(v,S.jahr,s.key)):''}\" placeholder=\"0.00\" inputmode=\"decimal\"><\u002Ftd>`)}\n        <td class=\"n\">${uebertrag(s => fmt0(stand(v, s)))}<\u002Ftd><\u002Ftr>`;\n    });\n    rows += `<tr class=\"zeile-summe ${zu?'zugeklappt':''}\" data-gsumme=\"${g.id}\"><td>Summe ${g.name}<\u002Ftd>\n      <td class=\"n\">${fmt0(rd(liste.reduce((a,v)=>a+verbindStandHeute(v),0)))}<\u002Ftd><td class=\"n\"><\u002Ftd>\n      ${reihe(sp, s => `<td class=\"n ${s.jetzt?'jetzt':''}\">${fmt0(rd(liste.reduce((a,v)=>a+zahl(v,s),0)))}<\u002Ftd>`)}\n      <td class=\"n\">${uebertrag(s => fmt0(rd(liste.reduce((a,v)=>a+stand(v,s),0))))}<\u002Ftd><\u002Ftr>`;\n  });\n  const ges = aktiv;\n  rows += `<tr class=\"zeile-gesamt\"><td>Summe Verbindlichkeiten<\u002Ftd>\n    <td class=\"n\">${fmt(rd(ges.reduce((a,v)=>a+verbindStandHeute(v),0)))}<\u002Ftd><td class=\"n\"><\u002Ftd>\n    ${reihe(sp, s => `<td class=\"n ${s.jetzt?'jetzt':''}\">${fmt0(rd(ges.reduce((a,v)=>a+zahl(v,s),0)))}<\u002Ftd>`)}\n    <td class=\"n\">${uebertrag(s => fmt(rd(ges.reduce((a,v)=>a+stand(v,s),0))))}<\u002Ftd><\u002Ftr>`;\n\n  const weg = gefaltet(sp);\n  const zeit1 = sp.findIndex(x => !x.falt);        /* U-25, wie im Budget */\n  return `<div class=\"tafel-kopf\"><span class=\"titel\">Verbindlichkeiten ${zeitTitel()}<\u002Fspan>${tafelKennzahlen()}\n      <span class=\"nr\">Konto 08 Schulden<\u002Fspan>\n      ${weg || S.monateAlle ? `<button class=\"knopf klein\" data-faltauf=\"${S.monateAlle?'0':'1'}\"\n        >${S.monateAlle ? 'Leere Monate falten' : weg + ' leere Monate gefaltet'}<\u002Fbutton>` : ''}\n      ${vollbildKnopf()}<\u002Fdiv>\n    <div class=\"rollflaeche\"><table class=\"gross fixiert t-verbind\">\n      <thead><tr class=\"zeile-titel\"><th class=\"t\">Bezeichnung${greifer('w1', true)}<\u002Fth\n        ><th class=\"n\">Stand${greifer('w2', true)}<\u002Fth><th class=\"n\">Rate${greifer('w3', true)}<\u002Fth>\n        ${sp.map((s,i) => s.falt ? faltKopf(s)\n          : `<th class=\"n ${s.jetzt?'jetzt':''}\">${s.label}${greifer('wz', i === zeit1)}<\u002Fth>`).join('')}\n        <th class=\"n\">Übertrag<\u002Fth><\u002Ftr>\n        <!-- Derselbe Kopf wie im Budget (U-7). Er rechnet nichts Eigenes: es sind\n             dieselben zwei Funktionen. Er steht hier, damit sichtbar wird, was eine\n             geaenderte Rate mit dem Saldo macht — ohne den Bereich zu wechseln. -->\n        <tr class=\"zeile-saldo\"><td>Saldo budgetiert<\u002Ftd><td class=\"n\"><\u002Ftd><td class=\"n\"><\u002Ftd>\n          ${reihe(sp, s => `<td class=\"n ${s.jetzt?'jetzt':''}\">${fmt(saldoRoh(s, alle))}<\u002Ftd>`)}\n          <td class=\"n\">${fmt(spAlle.reduce((a,s)=>a+saldoRoh(s, alle),0))}<\u002Ftd><\u002Ftr>\n        <tr class=\"zeile-kum\"><td>Saldo kumuliert<\u002Ftd><td class=\"n\"><\u002Ftd><td class=\"n\"><\u002Ftd>\n          ${reihe(sp, s => `<td class=\"n ${s.jetzt?'jetzt':''}\">${fmt(kumRoh(s, alle))}<\u002Ftd>`)}\n          <td class=\"n\"><\u002Ftd><\u002Ftr>\n      <\u002Fthead><tbody>${rows}<\u002Ftbody><\u002Ftable><\u002Fdiv>`;\n}\n\n/* ---- Rechnungen ------------------------------------------------------ */\n/* Die Rechnungen stehen als Kacheln, nach Faelligkeitsmonat gruppiert —\n   dieselbe Anatomie wie Konto und Schuld, dieselbe Zwischenueberschrift wie\n   bei den Schulden. Ein Klick oeffnet das Blatt mit allem, was dazugehoert. */\nfunction rechnungTabelle() {\n  const liste = D.rechnungen.slice().sort((a,b) => a.faelligkeit < b.faelligkeit ? -1 : 1);\n  const monate = [];\n  liste.forEach(r => {\n    const s = r.faelligkeit.slice(0,7);\n    let g = monate.find(x => x.schl === s);\n    if (!g) monate.push(g = { schl:s, liste:[] });\n    g.liste.push(r);\n  });\n  const gruppen = monate.map(g => {\n    const y = ymOf(g.liste[0].faelligkeit);\n    const summe = rd(g.liste.reduce((s,r) => s + r.betrag, 0));\n    const offen = g.liste.filter(r => r.status === 'offen');\n    const kacheln = g.liste.map(r => {\n      const st = steller(r.stellerId), z = zeile(r.zeileId), k = konto(r.kontoId);\n      const beleg = r.belegDatei ? 'Beleg abgelegt'\n                  : (r.belegOffen ? 'Beleg liegt bereit' : 'kein Beleg');\n      return kachelHtml({\n        art:'rechnung', id:r.id,\n        kennung: (k ? k.nr + ' ' + k.name : 'ohne Konto') + (r.gedeckt ? ' · Rückstellung' : ''),\n        name: st ? st.name : '?',\n        rolle: (z ? z.bezeichnung : '') + (r.notiz ? ' · ' + r.notiz : ''),\n        label: r.status === 'offen' ? 'Offen, fällig am ' + r.faelligkeit.slice(8,10) + '.'\n                                    : 'Bezahlt',\n        wert: r.betrag,\n        knopf: r.status === 'offen' ? 'Bezahlt' : 'Öffnen',\n        tat: r.status === 'offen' ? 'rstatus:' + r.id : 'rechnung:' + r.id,\n        meta: beleg });\n    }).join('');\n    return `<h3 class=\"untertitel\">${MON_LANG[y.m]} ${y.j}\n        <span class=\"num\">${fmt(summe)}<\u002Fspan>\n        <span>${g.liste.length} ${g.liste.length===1?'Rechnung':'Rechnungen'}${\n          offen.length ? ' · ' + fmt(rd(offen.reduce((s,r)=>s+r.betrag,0))) + ' offen' : ' · alle bezahlt'}<\u002Fspan><\u002Fh3>\n      <div class=\"raster\">${kacheln}<\u002Fdiv>`;\n  }).join('');\n  return `<div class=\"tafel-kopf\"><span class=\"titel\">Rechnungen<\u002Fspan>${tafelKennzahlen()}\n      <span class=\"nr\">${liste.length} ${liste.length===1?'Rechnung':'Rechnungen'} · ${\n        fmt(rd(liste.filter(r=>r.status==='offen').reduce((s,r)=>s+r.betrag,0)))} offen<\u002Fspan>\n      <button class=\"knopf klein\" id=\"btnRechNeu\">Rechnung erfassen<\u002Fbutton>\n      ${vollbildKnopf()}<\u002Fdiv>\n    <div class=\"rollflaeche\" style=\"padding:0 var(--pad) var(--pad)\">\n      ${gruppen || `<p class=\"meldung\" style=\"padding:14px 0\">Noch keine Rechnung erfasst.\n        Zieh einen Beleg auf das Fenster oder nimm den Knopf oben.<\u002Fp>`}<\u002Fdiv>`;\n}\n\n/* ---- Der Zeichner --------------------------------------------------- */\nfunction zeichne() {\n  if (!D) { zeichneLeerstart(); return; }\n  /* U-30: vor allem anderen — der Zeiger muss auf einem Jahrgang stehen, den\n     es gibt. Hier und nicht in den einzelnen Zeichenfunktionen, weil sonst die\n     eine, die es vergisst, still auf einem toten Jahrgang rechnet. Der\n     Normalfall kostet einen Object.keys und einen indexOf. */\n  jahrFangen();\n  zeichneKopf();\n  $('#inhalt').dataset.modus = S.modus === 'tabellen' ? 'tabellen' : 'kacheln';\n  /* Nur im Dashboard weicht die Kopfzeile — dort stehen die Zahlen gross (U-13). */\n  $('.kopfzeile').hidden = S.modus === 'dashboard' || S.modus === 'verwaltung';\n  if (S.modus === 'dashboard')       zeichneDashboard();\n  else if (S.modus === 'verwaltung') zeichneVerwaltung();\n  else if (S.modus === 'kacheln')    zeichneKacheln();\n  else zeichneTabellen();\n  persistAnsicht();\n}\nfunction zeichneLeerstart() {\n  $('#inhalt').innerHTML = `<div class=\"leerstart\">\n    <h2>GÄPP hat noch keine Daten<\u002Fh2>\n    <p>Die App ist die leere Hülle — deine Zahlen liegen im privaten Repo.\n       Trag im Blatt «Daten und Sync» das Datenrepository und deinen Zugriffs-Token ein,\n       dann lädt GÄPP sie.<\u002Fp>\n    <button class=\"knopf primaer\" id=\"btnErstStart\">Daten und Sync öffnen<\u002Fbutton><\u002Fdiv>`;\n}\n\n/* ===================================================================\n   GAEPP — Blaetter: Kontoblatt, Schuldblatt, Masken, Journal.\n   Ein Blatt, eine Bauart. Das Blatt ist kein Ansichtswechsel:\n   die Kachelansicht bleibt darunter stehen, Escape fuehrt zurueck.\n   =================================================================== */\n\nlet _blatt = null;          /* {art, id, reiter} */\nlet _entwurf = null;        /* offene Erfassung — ueberlebt das Handbuch (A-90) */\nlet _stapel = [];           /* darunterliegende Blaetter */\n\nfunction blattAuf(art, id, reiter, ueber) {\n  if (ueber && _blatt) _stapel.push(_blatt);\n  _blatt = { art, id, reiter: reiter || null };\n  S.blatt = _blatt;\n  blattZeichnen();\n  $('#blattHg').hidden = false;\n  $('#blattRahmen').focus();\n}\nfunction blattZu() {\n  if (_stapel.length) { _blatt = _stapel.pop(); S.blatt = _blatt; blattZeichnen(); return; }\n  _blatt = null; S.blatt = null; $('#blattHg').hidden = true; zeichne();\n}\n/* Was in der Maske steht, bevor neu gezeichnet wird — sonst verliert ein\n   Wechsel der Buchungsart den halb getippten Betrag. */\nfunction entwurfSichern() {\n  if (!_entwurf) return;\n  const g = id => { const e = $('#' + id); return e ? (e.type === 'checkbox' ? e.checked : e.value) : undefined; };\n  const setz = (feld, wert) => { if (wert !== undefined) _entwurf[feld] = wert; };\n  setz('betrag', g('bBetrag')); setz('datum', g('bDatum')); setz('text', g('bText'));\n  setz('ganzerMonat', g('bMonat')); setz('zeileId', g('bZeile'));\n  setz('gegenkontoId', g('bGegen')); setz('verbId', g('bVerb'));\n}\nfunction blattZeichnen() {\n  /* U-18: Die Verwaltung ist keine Blatt mehr, sondern eine Seite. Alle\n     Stellen, die nach einer Aenderung «blattZeichnen()» rufen, sollen dort\n     die Seite neu zeichnen — statt sie einzeln umzuschreiben, faengt es\n     diese Zeile ab. */\n  if (!_blatt) { if (S.modus === 'verwaltung') zeichne(); return; }\n  /* «verwaltung» stand hier bis U-19 mit drin. Als die Verwaltung eine Seite\n     wurde, fiel blattVerwaltung weg — der Name blieb aber stehen und liess\n     dieses Objekt beim Bauen mit einem ReferenceError platzen. Damit ging\n     KEIN Blatt mehr auf: kein Konto, keine Schuld, keine Rechnung, kein\n     Bericht. Albrecht hat es am Klick auf einen Glaeubigernamen gemerkt. */\n  const f = {\n    konto: blattKonto, schuld: blattSchuld, sparziel: blattSparziel,\n    zeile: blattZeile,\n    /* U-30: Die Kontomaske ist eine eigene Blattart und nicht ein fuenfter\n       Reiter im Kontoblatt. Das Kontoblatt braucht ein bestehendes Konto —\n       es rechnet Saldo, Journal und Bankabgleich. Beim Anlegen gibt es das\n       Konto noch nicht, und ein Reiter, der einmal ohne sein Objekt aufgeht,\n       ist eine Sonderbehandlung an vier Stellen statt einer Blattart. */\n    kontomaske: blattKontoMaske,\n    sync: blattSync, bericht: blattBericht,\n    handbuch: blattHandbuch, rechnung: blattRechnung, serie: blattSerie,\n    rechnungzeigen: blattRechnungZeigen, glaeubiger: blattGlaeubiger\n  }[_blatt.art];\n  if (!f) { console.warn('Kein Blatt für', _blatt.art); return; }\n  const b = f(_blatt.id);\n  $('#blattRahmen').className = 'blatt' + (b.weit ? ' weit' : '');\n  $('#blattKopf').className = 'blatt-kopf' + (b.reiter ? ' mitreiter' : '');\n  $('#blattKennung').hidden = !b.kennung;\n  $('#blattKennung').textContent = b.kennung || '';\n  $('#blattTitel').textContent = b.titel;\n  const rt = $('#blattReiter');\n  rt.hidden = !b.reiter;\n  rt.innerHTML = (b.reiter || []).map(([id,n]) =>\n    `<button role=\"tab\" data-blattreiter=\"${id}\" aria-selected=\"${_blatt.reiter===id}\">${n}<\u002Fbutton>`).join('');\n  $('#blattKoerper').innerHTML = b.koerper;\n  /* A-90: Das Handbuch muss mitten in einer Erfassung aufgehen — der Knopf in der Fusszeile\n     der App liegt dann unter dem Blatt. Er steht deshalb in den Blaettern, in denen etwas\n     erfasst wird, und nur dort. Im Berichtsgenerator, in der Verwaltung und im Sync-Blatt\n     hat er nichts zu suchen. */\n  const erfassung = ['konto','schuld','sparziel','rechnung','serie','rechnungzeigen'].includes(_blatt.art);\n  const hb = erfassung\n    ? '<button class=\"knopf klein\" data-hb style=\"margin-right:auto\">Wie GÄPP tickt<\u002Fbutton>' : '';\n  $('#blattFuss').innerHTML = hb + (b.fuss || '<button class=\"knopf\" data-zu>Schliessen<\u002Fbutton>');\n  if (b.danach) b.danach();\n}\n\n/* ===================================================================\n   Kontoblatt — Buchen, Journal, Verlauf (A-18, A-19, A-23)\n   =================================================================== */\nfunction blattKonto(id) {\n  const k = konto(id);\n  const reiter = _blatt.reiter || 'buchen';\n  _blatt.reiter = reiter;\n  /* U-28: «dokumente» kommt HINTEN dazu und schiebt nichts. Buchen steht\n     zuerst, weil dort gearbeitet wird; Journal und Verlauf sind die beiden\n     Rueckblicke. Die Unterlagen sind der seltenste Griff von vieren und\n     stehen deshalb zuletzt — die eingespielte Reihenfolge der drei\n     bestehenden Reiter bleibt Zeichen fuer Zeichen, wie sie war.\n     KEIN Wegweiser wie bei Schuld und Rechnung: dort ist er noetig, weil\n     der Reiter neben einer Erfassungsmaske liegt, in der man ihn uebersieht\n     (das war der Befund aus U-26). Hier steht die Zahl am Reiter selbst im\n     Blick, und der einzige Ort, an dem ein Wegweiser Platz haette, waere\n     die Buchungsmaske — die Stelle, an der Albrecht taeglich tippt und in\n     der jede Zeile mehr eine Zeile zu viel ist. */\n  const koerper = reiter === 'buchen'    ? maskeBuchung(k)\n                : reiter === 'journal'   ? journal(k)\n                : reiter === 'dokumente' ? dokReiterHtml('konto', k.id)\n                :                          verlauf(k);\n  const bw = letzterBankwert(k);\n  const saldo = kontosaldo(k.id, S.jahr, S.monat);\n  const diff = bw ? rd(bw.wert - saldo) : null;\n  return {\n    weit: true, kennung: 'Konten · ' + k.nr + ' · ' + zeitTitel(), titel: k.name,\n    reiter: [['buchen','Buchen'],['journal','Journal'],['verlauf','Verlauf'],\n             ['dokumente', dokReiterName('konto', k)]],\n    koerper,\n    fuss: `<div class=\"abgleich\" style=\"margin-left:14px\">\n        <div class=\"feld\"><label>Bankauszug<\u002Flabel>\n          <input class=\"num\" id=\"bankwert\" type=\"text\" inputmode=\"decimal\"\n                 value=\"${bw ? fmt(bw.wert) : ''}\" placeholder=\"${fmt(saldo)}\"><\u002Fdiv>\n        <span class=\"lab\">Differenz<\u002Fspan>\n        <span class=\"diff ${diff ? 'ab' : ''}\" id=\"bankdiff\">${diff === null ? '–' : fmt(diff)}<\u002Fspan>\n        ${diff ? `<button class=\"knopf klein\" id=\"btnAusbuchen\">Ausbuchen<\u002Fbutton>` : ''}\n      <\u002Fdiv>\n      <!-- U-30: Bis hierher hatte das Kontoblatt kein «Ändern». Nummer,\n           Rolle, IBAN, Anfangssaldo, Bereich und vor allem der Haken «frei»\n           waren nur in der JSON zu erreichen — an dem Ort, an dem man das\n           Konto täglich vor sich hat, an keinem einzigen. -->\n      <button class=\"knopf klein\" data-kaend=\"${k.id}\">Ändern<\u002Fbutton>\n      <button class=\"knopf klein\" data-bericht=\"konto:${k.id}\">Bericht<\u002Fbutton>\n      <button class=\"knopf klein\" id=\"btnNaechstes\">Nächstes Konto<\u002Fbutton>\n      <button class=\"knopf\" data-zu>Schliessen<\u002Fbutton>`\n  };\n}\n/* ---- Buchungsmaske (A-43 bis A-45, A-52, E-7) ----------------------- */\nfunction maskeBuchung(k, vorgabe) {\n  const e = _entwurf && _entwurf.kontoId === k.id ? _entwurf\n          : (_entwurf = Object.assign({ kontoId:k.id, art:'ausgabe', datum:heuteISO(),\n              ganzerMonat:false, betrag:'', zeileId:'', gegenkontoId:'', text:'',\n              verbId:'', sparzielId:'' }, vorgabe || {}));\n  const arten = [['ausgabe','Ausgabe'],['einnahme','Einnahme'],['umbuchung','Umbuchung'],['korrektur','Korrektur']];\n  return `<div class=\"maske\" id=\"maskeBuchung\">\n    <div class=\"feld voll\"><label>Art<\u002Flabel>\n      <span class=\"schalter\" role=\"group\">${arten.map(([a,n]) =>\n        `<button data-art=\"${a}\" aria-pressed=\"${e.art===a}\">${n}<\u002Fbutton>`).join('')}<\u002Fspan><\u002Fdiv>\n    <div class=\"feld\"><label>Datum<\u002Flabel>\n      <input type=\"date\" id=\"bDatum\" value=\"${e.datum}\"><\u002Fdiv>\n    <div class=\"feld\"><label>Betrag<\u002Flabel>\n      <input class=\"num\" id=\"bBetrag\" type=\"text\" inputmode=\"decimal\" value=\"${e.betrag}\" placeholder=\"0.00\"><\u002Fdiv>\n    <div class=\"feld haken voll\"><input type=\"checkbox\" id=\"bMonat\" ${e.ganzerMonat?'checked':''}>\n      <label for=\"bMonat\">Auf den ganzen Monat buchen, nicht auf einen Tag<\u002Flabel><\u002Fdiv>\n    ${e.art === 'umbuchung' ? `<div class=\"feld voll\"><label>Gegenkonto<\u002Flabel>\n      <select id=\"bGegen\">${kontoOptionen(e.gegenkontoId, k.id)}<\u002Fselect><\u002Fdiv>` : ''}\n    ${e.art === 'korrektur' ? `<div class=\"feld voll\"><label>Richtung<\u002Flabel>\n      <span class=\"schalter\" role=\"group\">\n        <button data-krich=\"plus\"  aria-pressed=\"${e.richtung!=='minus'}\">Saldo erhöhen<\u002Fbutton>\n        <button data-krich=\"minus\" aria-pressed=\"${e.richtung==='minus'}\">Saldo senken<\u002Fbutton><\u002Fspan><\u002Fdiv>` : ''}\n    ${e.art !== 'korrektur' && e.art !== 'umbuchung' ? `<div class=\"feld voll\"><label>Position<\u002Flabel>\n      <select id=\"bZeile\">${positionOptionen(e.zeileId, k.id, jahrVon(e.datum))}<\u002Fselect><\u002Fdiv>` : ''}\n    ${e.art === 'ausgabe' ? `<div class=\"feld voll\"><label>Zahlung an eine Verbindlichkeit<\u002Flabel>\n      <select id=\"bVerb\"><option value=\"\">— keine —<\u002Foption>${\n        D.verbindlichkeiten.filter(v=>v.aktiv!==false).map(v =>\n        `<option value=\"${v.id}\" ${e.verbId===v.id?'selected':''}>${v.bezeichnung} · Stand ${fmt(verbindStandHeute(v))}<\u002Foption>`).join('')\n      }<\u002Fselect><\u002Fdiv>` : ''}\n    <div class=\"feld voll\"><label>Notiz${e.art==='korrektur'?' — Pflicht bei einer Korrektur':''}<\u002Flabel>\n      <input type=\"text\" id=\"bText\" value=\"${(e.text||'').replace(/\"/g,'&quot;')}\"\n             placeholder=\"${e.art==='korrektur'?'Warum wird korrigiert?':'frei'}\"><\u002Fdiv>\n    <div class=\"aktion\">\n      <button class=\"knopf primaer\" id=\"btnBuchen\">Buchen<\u002Fbutton>\n      <span class=\"hint\" id=\"bHint\"><\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>`;\n}\nfunction kontoOptionen(sel, ausser) {\n  return D.konten.filter(k => k.aktiv !== false && k.id !== ausser)\n    .sort((a,b)=>a.rang-b.rang)\n    .map(k => `<option value=\"${k.id}\" ${sel===k.id?'selected':''}>${k.nr} ${k.name}<\u002Foption>`).join('');\n}\n/* ===================================================================\n   U-21 — Die Positionen, die in einem Jahr zur Wahl stehen\n   -------------------------------------------------------------------\n   Jede Auswahlliste hat ihr eigenes Jahr: die Buchungsmaske das des\n   Buchungsdatums, die Rechnungsmaske das der Faelligkeit, die Serie\n   und die Sprungliste S.jahr. Wer stattdessen ueberall S.jahr naehme,\n   boete beim Nachtragen einer Buchung von 2026 die Positionen von 2029\n   an — oder liesse die von 2026 weg.\n\n   Die aktuell gewaehlte Zeile bleibt IMMER in der Liste, auch wenn sie\n   im Zieljahr ausgeblendet ist. Sonst verloere das Bearbeiten einer\n   alten Buchung stillschweigend ihre Position: der Browser waehlt beim\n   Fehlen der Option die erste aus, und beim naechsten Speichern stuende\n   dort eine andere — ein Datenverlust ohne Meldung.\n\n   Die Kategorien werden hier NICHT eigens gefiltert: zeileSicht fragt\n   die Kategorie ohnehin mit ab, und eine Kategorie ohne uebrige Zeile\n   erscheint dann von selbst nicht mehr.\n   =================================================================== */\nfunction jahrVon(datum) {\n  /* Ein leeres oder halb getipptes Datum ergaebe NaN, und `NaN < 2029` ist\n     falsch — die Liste waere schlagartig leer. Dann lieber S.jahr. */\n  const j = +String(datum || '').slice(0, 4);\n  return j || S.jahr;\n}\nfunction zeilenWahl(j, sel) {\n  const raus = [];\n  D.kategorien.slice().sort((a,b) => a.rang - b.rang).forEach(k => {\n    D.zeilen.filter(z => z.kategorieId === k.id && (zeileSicht(z, j) || z.id === sel))\n      .sort((a,b) => (a.rang||0) - (b.rang||0))\n      .forEach(z => raus.push({ z, k }));\n  });\n  return raus;\n}\n/* A-48: die Positionen des gewaehlten Kontos zuoberst, waehlbar sind alle.\n   Ohne das liesse sich auf Konto 08 keine Rate und auf 05 gar nichts buchen. */\nfunction positionOptionen(sel, kontoId, j) {\n  const eigen = [], fremd = [];\n  zeilenWahl(j, sel).forEach(x => {\n    /* Die drei Verbindlichkeitszeilen sind gesperrt — dort wird nichts gebucht,\n       die Rate laeuft ueber das Feld «Zahlung an eine Verbindlichkeit».\n       Die Sammelzeile «Rechnungen» ist dagegen waehlbar: sie ist die Position,\n       unter der eine Rechnungszahlung im Budget steht. */\n    if (zeileGruppe[x.z.id]) return;\n    (x.k.kontoId === kontoId ? eigen : fremd).push(x);\n  });\n  const opt = x => `<option value=\"${x.z.id}\" ${sel===x.z.id?'selected':''}>${x.k.name} | ${x.z.bezeichnung}<\u002Foption>`;\n  return `<option value=\"\">— ohne Position —<\u002Foption>` +\n    (eigen.length ? `<optgroup label=\"Zu diesem Konto\">${eigen.map(opt).join('')}<\u002Foptgroup>` : '') +\n    (fremd.length ? `<optgroup label=\"Alle übrigen\">${fremd.map(opt).join('')}<\u002Foptgroup>` : '');\n}\nfunction buchungSpeichern() {\n  const e = _entwurf;\n  const hint = $('#bHint');\n  const betrag = zahl($('#bBetrag').value);\n  if (!betrag) { hint.textContent = 'Ohne Betrag geht es nicht.'; return; }\n  e.datum = $('#bDatum').value || heuteISO();\n  e.ganzerMonat = $('#bMonat').checked;\n  e.text = $('#bText').value.trim();\n  if (e.art === 'korrektur' && !e.text) {\n    hint.textContent = 'Eine Korrektur ohne Notiz lässt sich nicht speichern.'; return; }\n  if (e.art === 'umbuchung') {\n    e.gegenkontoId = $('#bGegen').value;\n    if (!e.gegenkontoId) { hint.textContent = 'Eine Umbuchung braucht ein Gegenkonto.'; return; }\n  }\n  if ($('#bZeile')) e.zeileId = $('#bZeile').value;\n  if ($('#bVerb'))  e.verbId  = $('#bVerb').value;\n  if (e.ganzerMonat) { const d = ymOf(e.datum); e.datum = iso(d.j, d.m, tageImMonat(d.j, d.m)); }\n  const b = {\n    id: neueId('b'), datum: e.datum, ganzerMonat: e.ganzerMonat, kontoId: e.kontoId,\n    art: e.art, betrag: rd(betrag), gegenkontoId: e.gegenkontoId || null,\n    zeileId: e.zeileId || null, text: e.text, serieId: e.serieId || null,\n    rechnungId: e.rechnungId || null, verbId: e.verbId || null,\n    sparzielId: e.sparzielId || null, belegDatei: null, belegOffen: false\n  };\n  if (e.art === 'korrektur') b.richtung = e.richtung || 'plus';\n  D.buchungen.push(b);\n  _entwurf = null;\n  persist();\n  _blatt.reiter = 'journal';\n  blattZeichnen();\n}\nfunction zahl(s) {\n  if (s === null || s === undefined) return 0;\n  const t = String(s).replace(/[’'\\s]/g, '').replace(',', '.').replace('−','-');\n  const n = parseFloat(t);\n  return isFinite(n) ? Math.abs(n) : 0;\n}\n\n/* ---- Journal (A-19, A-54, A-94) -------------------------------------- */\nfunction journal(k) {\n  const von = S.zeitraum === 'monat' ? { j:S.jahr, m:S.monat } : { j:S.jahr, m:0 };\n  const bis = S.zeitraum === 'monat' ? { j:S.jahr, m:S.monat } : { j:S.jahr, m:11 };\n  const drin = b => { const d = ymOf(b.datum);\n    return (d.j > von.j || (d.j === von.j && d.m >= von.m)) && (d.j < bis.j || (d.j === bis.j && d.m <= bis.m)); };\n  const eigene = D.buchungen.filter(b => (b.kontoId === k.id || b.gegenkontoId === k.id) && drin(b))\n                            .sort((a,b) => a.datum < b.datum ? -1 : 1);\n  let vs = [];\n  if (S.zeitraum === 'monat') vs = vorschlaege(k.id, S.jahr, S.monat);\n  else for (let m = 0; m <= 11; m++) vs = vs.concat(vorschlaege(k.id, S.jahr, m));\n\n  const anfang = kontosaldo(k.id, von.j, von.m === 0 ? -1 : von.m - 1);\n  let lauf = S.zeitraum === 'monat'\n    ? kontosaldo(k.id, S.monat === 0 ? S.jahr-1 : S.jahr, S.monat === 0 ? 11 : S.monat-1)\n    : kontosaldo(k.id, S.jahr-1, 11);\n  /* Hier stand eine Summe «ein», die nie jemand las — und die falsch rechnete:\n     `s + wirkung(b,k.id) > 0` bindet als `(s + wirkung(…)) > 0`, gefragt war\n     `wirkung(…) > 0`. Der Kopf zeigt Anfang, Anzahl und Saldo, keine Einnahmen-\n     summe. Entfernt am 18.08.2026, statt einen ungenutzten Fehler zu pflegen. */\n  const zeilen = eigene.map(b => {\n    const w = wirkung(b, k.id); lauf = rd(lauf + w);\n    const z = b.zeileId ? zeile(b.zeileId) : null;\n    return `<tr data-jz=\"${b.id}\">\n      <td class=\"tag\">${b.ganzerMonat ? MON[ymOf(b.datum).m] : kurzdatum(b.datum)}<\u002Ftd>\n      <td>${z ? z.bezeichnung : (b.text || artName(b.art))}${\n        b.art === 'umbuchung' ? `<span class=\"marke-um\">${b.kontoId===k.id?'→ '+konto(b.gegenkontoId).name:'← '+konto(b.kontoId).name}<\u002Fspan>` : ''}<\u002Ftd>\n      <td class=\"r num ${w<0?'neg':''}\">${fmt(w)}<\u002Ftd>\n      <td class=\"r num\">${fmt(lauf)}<\u002Ftd>\n      <td class=\"r\"><span class=\"zwerk\"><button class=\"knopf klein\" data-jedit=\"${b.id}\">Ändern<\u002Fbutton>\n        <button class=\"knopf klein\" data-jdel=\"${b.id}\">Löschen<\u002Fbutton><\u002Fspan><\u002Ftd><\u002Ftr>`;\n  }).join('');\n  const vzeilen = vs.map(v => {\n    const vo = v.serie.vorlage;\n    return `<tr class=\"vorschlag\">\n      <td class=\"tag\">${kurzdatum(v.datum)}<\u002Ftd>\n      <td>${vo.text || (vo.zeileId ? zeile(vo.zeileId).bezeichnung : artName(vo.art))} · Vorschlag<\u002Ftd>\n      <td class=\"r num\">${fmt(vo.art === 'einnahme' ? vo.betrag : -vo.betrag)}<\u002Ftd>\n      <td class=\"r num\">–<\u002Ftd>\n      <td class=\"r\"><span class=\"zwerk\"><button class=\"knopf klein\" data-vbuch=\"${v.serie.id}:${v.datum}\">Buchen<\u002Fbutton>\n        <button class=\"knopf klein\" data-vskip=\"${v.serie.id}:${v.datum}\">Überspringen<\u002Fbutton><\u002Fspan><\u002Ftd><\u002Ftr>`;\n  }).join('');\n  return `<div class=\"kennzahlen\">\n      <span class=\"wert\"><span class=\"k\">Anfang<\u002Fspan><span class=\"v\">${fmt(anfang)}<\u002Fspan><\u002Fspan>\n      <span class=\"wert\"><span class=\"k\">Buchungen<\u002Fspan><span class=\"v\">${eigene.length}<\u002Fspan><\u002Fspan>\n      <span class=\"wert\"><span class=\"k\">Saldo<\u002Fspan><span class=\"v\">${fmt(kontosaldo(k.id, bis.j, bis.m))}<\u002Fspan><\u002Fspan>\n      ${vs.length ? `<span class=\"wert\"><span class=\"k\">Vorschläge<\u002Fspan><span class=\"v off\">${vs.length}<\u002Fspan>\n        <span class=\"z\">zählen nirgends mit<\u002Fspan><\u002Fspan>` : ''}\n    <\u002Fdiv>\n    <table class=\"journal\"><thead><tr><th>Tag<\u002Fth><th>Position<\u002Fth><th class=\"r\">Betrag<\u002Fth>\n      <th class=\"r\">Saldo<\u002Fth><th><\u002Fth><\u002Ftr><\u002Fthead>\n    <tbody>${zeilen}${vzeilen}${(!zeilen && !vzeilen) ? `<tr><td colspan=\"5\"><span class=\"meldung\">In diesem Zeitraum ist nichts gebucht.<\u002Fspan><\u002Ftd><\u002Ftr>` : ''}<\u002Ftbody><\u002Ftable>\n    <div style=\"margin-top:12px\"><button class=\"knopf klein\" id=\"btnSerieNeu\">Serie anlegen<\u002Fbutton><\u002Fdiv>`;\n}\nfunction wirkung(b, kId) {\n  if (b.kontoId === kId) {\n    if (b.art === 'einnahme') return b.betrag;\n    if (b.art === 'korrektur') return b.betrag * (b.richtung === 'minus' ? -1 : 1);\n    return -b.betrag;\n  }\n  return b.betrag;                       /* Empfaengerseite einer Umbuchung */\n}\nfunction artName(a) { return { ausgabe:'Ausgabe', einnahme:'Einnahme', umbuchung:'Umbuchung', korrektur:'Korrektur' }[a] || a; }\n\n/* ---- Verlauf --------------------------------------------------------- */\nfunction verlauf(k) {\n  const pts = [];\n  for (let m = 0; m <= 11; m++) pts.push(kontosaldo(k.id, S.jahr, m));\n  const min = Math.min(0, ...pts), max = Math.max(1, ...pts);\n  const x = i => 20 + i * (560 / 11), y = v => 280 - ((v - min) / (max - min || 1)) * 250;\n  const d = pts.map((v,i) => (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(v).toFixed(1)).join(' ');\n  return `<svg class=\"verlauf\" viewBox=\"0 0 600 300\" preserveAspectRatio=\"none\">\n      <line x1=\"20\" y1=\"${y(0).toFixed(1)}\" x2=\"580\" y2=\"${y(0).toFixed(1)}\" stroke=\"#2a3542\"/>\n      <path d=\"${d}\" fill=\"none\" stroke=\"#8ee6c8\" stroke-width=\"2\"/>\n      ${pts.map((v,i)=>`<circle cx=\"${x(i).toFixed(1)}\" cy=\"${y(v).toFixed(1)}\" r=\"2.5\" fill=\"#8ee6c8\"/>`).join('')}\n    <\u002Fsvg>\n    <div class=\"kennzahlen\" style=\"margin-top:10px\">\n      ${MON.map((n,i)=>`<span class=\"wert\"><span class=\"k\">${n}<\u002Fspan><span class=\"v\">${fmt(pts[i])}<\u002Fspan><\u002Fspan>`).join('')}\n    <\u002Fdiv>`;\n}\n\n/* ===================================================================\n   Schuldblatt — Zahlung und Tilgung\n   =================================================================== */\nfunction blattSchuld(id) {\n  const v = verbind(id);\n  const reiter = _blatt.reiter || 'zahlung';\n  _blatt.reiter = reiter;\n  const koerper = reiter === 'zahlung'   ? maskeZahlung(v)\n                : reiter === 'tilgung'   ? tilgung(v)\n                : reiter === 'dokumente' ? dokReiterHtml('verbind', v.id)\n                :                          s
