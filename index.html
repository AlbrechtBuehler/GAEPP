    liste.forEach(v => {
      rows += `<tr class="zeile-daten ${zu?'zugeklappt':''}" data-verb="${v.id}">
        <td class="namenszelle"><span class="nz" data-schuld="${v.id}">${v.bezeichnung}</span></td>
        <td class="n">${fmt(verbindStandHeute(v))}</td>
        <td class="n">${fmt0((v.raten[String(S.jahr)]||{}).soll)}</td>
        ${sp.map(s => alle || _ro
          ? `<td class="n ${s.jetzt?'jetzt':''}">${fmt0(zahl(v,s))}</td>`
          : `<td class="bearbeitbar n ${s.jetzt?'jetzt':''}" data-vr="${v.id}" data-m="${s.key}">
               <input type="text" value="${rate(v,S.jahr,s.key)?fmt(rate(v,S.jahr,s.key)):''}" placeholder="0.00" inputmode="decimal"></td>`).join('')}
        <td class="n">${fmt0(stand(v, sp[sp.length-1]))}</td></tr>`;
    });
    rows += `<tr class="zeile-summe ${zu?'zugeklappt':''}"><td>Summe ${g.name}</td>
      <td class="n">${fmt0(rd(liste.reduce((a,v)=>a+verbindStandHeute(v),0)))}</td><td class="n"></td>
      ${sp.map(s => `<td class="n ${s.jetzt?'jetzt':''}">${fmt0(rd(liste.reduce((a,v)=>a+zahl(v,s),0)))}</td>`).join('')}
      <td class="n">${fmt0(rd(liste.reduce((a,v)=>a+stand(v,sp[sp.length-1]),0)))}</td></tr>`;
  });
  const ges = D.verbindlichkeiten.filter(v => v.aktiv !== false);
  rows += `<tr class="zeile-gesamt"><td>Summe Verbindlichkeiten</td>
    <td class="n">${fmt(rd(ges.reduce((a,v)=>a+verbindStandHeute(v),0)))}</td><td class="n"></td>
    ${sp.map(s => `<td class="n ${s.jetzt?'jetzt':''}">${fmt0(rd(ges.reduce((a,v)=>a+zahl(v,s),0)))}</td>`).join('')}
    <td class="n">${fmt(rd(ges.reduce((a,v)=>a+stand(v,sp[sp.length-1]),0)))}</td></tr>`;

  return `<div class="tafel-kopf"><span class="titel">Verbindlichkeiten ${zeitTitel()}</span>
      <span class="nr">Konto 08 Schulden</span></div>
    <div class="rollflaeche"><table class="gross fixiert t-verbind">
      <thead><tr class="zeile-titel"><th class="t">Bezeichnung</th><th class="n">Stand</th><th class="n">Rate</th>
        ${sp.map(s => `<th class="n ${s.jetzt?'jetzt':''}">${s.label}</th>`).join('')}
        <th class="n">Übertrag</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}

/* ---- Rechnungen ------------------------------------------------------ */
/* Die Rechnungen stehen als Kacheln, nach Faelligkeitsmonat gruppiert —
   dieselbe Anatomie wie Konto und Schuld, dieselbe Zwischenueberschrift wie
   bei den Schulden. Ein Klick oeffnet das Blatt mit allem, was dazugehoert. */
function rechnungTabelle() {
  const liste = D.rechnungen.slice().sort((a,b) => a.faelligkeit < b.faelligkeit ? -1 : 1);
  const monate = [];
  liste.forEach(r => {
    const s = r.faelligkeit.slice(0,7);
    let g = monate.find(x => x.schl === s);
    if (!g) monate.push(g = { schl:s, liste:[] });
    g.liste.push(r);
  });
  const gruppen = monate.map(g => {
    const y = ymOf(g.liste[0].faelligkeit);
    const summe = rd(g.liste.reduce((s,r) => s + r.betrag, 0));
    const offen = g.liste.filter(r => r.status === 'offen');
    const kacheln = g.liste.map(r => {
      const st = steller(r.stellerId), z = zeile(r.zeileId), k = konto(r.kontoId);
      const beleg = r.belegDatei ? 'Beleg abgelegt'
                  : (r.belegOffen ? 'Beleg liegt bereit' : 'kein Beleg');
      return kachelHtml({
        art:'rechnung', id:r.id,
        kennung: (k ? k.nr + ' ' + k.name : 'ohne Konto') + (r.gedeckt ? ' · Rückstellung' : ''),
        name: st ? st.name : '?',
        rolle: (z ? z.bezeichnung : '') + (r.notiz ? ' · ' + r.notiz : ''),
        label: r.status === 'offen' ? 'Offen, fällig am ' + r.faelligkeit.slice(8,10) + '.'
                                    : 'Bezahlt',
        wert: r.betrag,
        knopf: r.status === 'offen' ? 'Bezahlt' : 'Öffnen',
        tat: r.status === 'offen' ? 'rstatus:' + r.id : 'rechnung:' + r.id,
        meta: beleg });
    }).join('');
    return `<h3 class="untertitel">${MON_LANG[y.m]} ${y.j}
        <span class="num">${fmt(summe)}</span>
        <span>${g.liste.length} ${g.liste.length===1?'Rechnung':'Rechnungen'}${
          offen.length ? ' · ' + fmt(rd(offen.reduce((s,r)=>s+r.betrag,0))) + ' offen' : ' · alle bezahlt'}</span></h3>
      <div class="raster">${kacheln}</div>`;
  }).join('');
  return `<div class="tafel-kopf"><span class="titel">Rechnungen</span>
      <span class="nr">${liste.length} ${liste.length===1?'Rechnung':'Rechnungen'} · ${
        fmt(rd(liste.filter(r=>r.status==='offen').reduce((s,r)=>s+r.betrag,0)))} offen</span>
      <button class="knopf klein" id="btnRechNeu">Rechnung erfassen</button></div>
    <div class="rollflaeche" style="padding:0 var(--pad) var(--pad)">
      ${gruppen || `<p class="meldung" style="padding:14px 0">Noch keine Rechnung erfasst.
        Zieh einen Beleg auf das Fenster oder nimm den Knopf oben.</p>`}</div>`;
}

/* ---- Der Zeichner --------------------------------------------------- */
function zeichne() {
  if (!D) { zeichneLeerstart(); return; }
  zeichneKopf();
  $('#inhalt').dataset.modus = S.modus;
  if (S.modus === 'kacheln') zeichneKacheln(); else zeichneTabellen();
  persistAnsicht();
}
function zeichneLeerstart() {
  $('#inhalt').innerHTML = `<div class="leerstart">
    <h2>GÄPP hat noch keine Daten</h2>
    <p>Die App ist die leere Hülle — deine Zahlen liegen im privaten Repo.
       Trag im Blatt «Daten und Sync» das Datenrepository und deinen Zugriffs-Token ein,
       dann lädt GÄPP sie.</p>
    <button class="knopf primaer" id="btnErstStart">Daten und Sync öffnen</button></div>`;
}

/* ===================================================================
   GAEPP — Blaetter: Kontoblatt, Schuldblatt, Masken, Journal.
   Ein Blatt, eine Bauart. Das Blatt ist kein Ansichtswechsel:
   die Kachelansicht bleibt darunter stehen, Escape fuehrt zurueck.
   =================================================================== */

let _blatt = null;          /* {art, id, reiter} */
let _entwurf = null;        /* offene Erfassung — ueberlebt das Handbuch (A-90) */
let _stapel = [];           /* darunterliegende Blaetter */

function blattAuf(art, id, reiter, ueber) {
  if (ueber && _blatt) _stapel.push(_blatt);
  _blatt = { art, id, reiter: reiter || null };
  S.blatt = _blatt;
  blattZeichnen();
  $('#blattHg').hidden = false;
  $('#blattRahmen').focus();
}
function blattZu() {
  if (_stapel.length) { _blatt = _stapel.pop(); S.blatt = _blatt; blattZeichnen(); return; }
  _blatt = null; S.blatt = null; $('#blattHg').hidden = true; zeichne();
}
/* Was in der Maske steht, bevor neu gezeichnet wird — sonst verliert ein
   Wechsel der Buchungsart den halb getippten Betrag. */
function entwurfSichern() {
  if (!_entwurf) return;
  const g = id => { const e = $('#' + id); return e ? (e.type === 'checkbox' ? e.checked : e.value) : undefined; };
  const setz = (feld, wert) => { if (wert !== undefined) _entwurf[feld] = wert; };
  setz('betrag', g('bBetrag')); setz('datum', g('bDatum')); setz('text', g('bText'));
  setz('ganzerMonat', g('bMonat')); setz('zeileId', g('bZeile'));
  setz('gegenkontoId', g('bGegen')); setz('verbId', g('bVerb'));
}
function blattZeichnen() {
  if (!_blatt) return;
  const f = {
    konto: blattKonto, schuld: blattSchuld, sparziel: blattSparziel,
    sync: blattSync, verwaltung: blattVerwaltung, bericht: blattBericht,
    handbuch: blattHandbuch, rechnung: blattRechnung, serie: blattSerie,
    rechnungzeigen: blattRechnungZeigen
  }[_blatt.art];
  if (!f) { console.warn('Kein Blatt für', _blatt.art); return; }
  const b = f(_blatt.id);
  $('#blattRahmen').className = 'blatt' + (b.weit ? ' weit' : '');
  $('#blattKopf').className = 'blatt-kopf' + (b.reiter ? ' mitreiter' : '');
  $('#blattKennung').hidden = !b.kennung;
  $('#blattKennung').textContent = b.kennung || '';
  $('#blattTitel').textContent = b.titel;
  const rt = $('#blattReiter');
  rt.hidden = !b.reiter;
  rt.innerHTML = (b.reiter || []).map(([id,n]) =>
    `<button role="tab" data-blattreiter="${id}" aria-selected="${_blatt.reiter===id}">${n}</button>`).join('');
  $('#blattKoerper').innerHTML = b.koerper;
  /* A-90: Das Handbuch muss mitten in einer Erfassung aufgehen — der Knopf in der Fusszeile
     der App liegt dann unter dem Blatt. Er steht deshalb in den Blaettern, in denen etwas
     erfasst wird, und nur dort. Im Berichtsgenerator, in der Verwaltung und im Sync-Blatt
     hat er nichts zu suchen. */
  const erfassung = ['konto','schuld','sparziel','rechnung','serie','rechnungzeigen'].includes(_blatt.art);
  const hb = erfassung
    ? '<button class="knopf klein" data-hb style="margin-right:auto">Wie GÄPP tickt</button>' : '';
  $('#blattFuss').innerHTML = hb + (b.fuss || '<button class="knopf" data-zu>Schliessen</button>');
  if (b.danach) b.danach();
}

/* ===================================================================
   Kontoblatt — Buchen, Journal, Verlauf (A-18, A-19, A-23)
   =================================================================== */
function blattKonto(id) {
  const k = konto(id);
  const reiter = _blatt.reiter || 'buchen';
  _blatt.reiter = reiter;
  const koerper = reiter === 'buchen'  ? maskeBuchung(k)
                : reiter === 'journal' ? journal(k)
                :                        verlauf(k);
  const bw = letzterBankwert(k);
  const saldo = kontosaldo(k.id, S.jahr, S.monat);
  const diff = bw ? rd(bw.wert - saldo) : null;
  return {
    weit: true, kennung: 'Konten · ' + k.nr + ' · ' + zeitTitel(), titel: k.name,
    reiter: [['buchen','Buchen'],['journal','Journal'],['verlauf','Verlauf']],
    koerper,
    fuss: `<div class="abgleich" style="margin-left:14px">
        <div class="feld"><label>Bankauszug</label>
          <input class="num" id="bankwert" type="text" inputmode="decimal"
                 value="${bw ? fmt(bw.wert) : ''}" placeholder="${fmt(saldo)}"></div>
        <span class="lab">Differenz</span>
        <span class="diff ${diff ? 'ab' : ''}" id="bankdiff">${diff === null ? '–' : fmt(diff)}</span>
        ${diff ? `<button class="knopf klein" id="btnAusbuchen">Ausbuchen</button>` : ''}
      </div>
      <button class="knopf klein" data-bericht="konto:${k.id}">Bericht</button>
      <button class="knopf klein" id="btnNaechstes">Nächstes Konto</button>
      <button class="knopf" data-zu>Schliessen</button>`
  };
}
/* ---- Buchungsmaske (A-43 bis A-45, A-52, E-7) ----------------------- */
function maskeBuchung(k, vorgabe) {
  const e = _entwurf && _entwurf.kontoId === k.id ? _entwurf
          : (_entwurf = Object.assign({ kontoId:k.id, art:'ausgabe', datum:heuteISO(),
              ganzerMonat:false, betrag:'', zeileId:'', gegenkontoId:'', text:'',
              verbId:'', sparzielId:'' }, vorgabe || {}));
  const arten = [['ausgabe','Ausgabe'],['einnahme','Einnahme'],['umbuchung','Umbuchung'],['korrektur','Korrektur']];
  return `<div class="maske" id="maskeBuchung">
    <div class="feld voll"><label>Art</label>
      <span class="schalter" role="group">${arten.map(([a,n]) =>
        `<button data-art="${a}" aria-pressed="${e.art===a}">${n}</button>`).join('')}</span></div>
    <div class="feld"><label>Datum</label>
      <input type="date" id="bDatum" value="${e.datum}"></div>
    <div class="feld"><label>Betrag</label>
      <input class="num" id="bBetrag" type="text" inputmode="decimal" value="${e.betrag}" placeholder="0.00"></div>
    <div class="feld haken voll"><input type="checkbox" id="bMonat" ${e.ganzerMonat?'checked':''}>
      <label for="bMonat">Auf den ganzen Monat buchen, nicht auf einen Tag</label></div>
    ${e.art === 'umbuchung' ? `<div class="feld voll"><label>Gegenkonto</label>
      <select id="bGegen">${kontoOptionen(e.gegenkontoId, k.id)}</select></div>` : ''}
    ${e.art === 'korrektur' ? `<div class="feld voll"><label>Richtung</label>
      <span class="schalter" role="group">
        <button data-krich="plus"  aria-pressed="${e.richtung!=='minus'}">Saldo erhöhen</button>
        <button data-krich="minus" aria-pressed="${e.richtung==='minus'}">Saldo senken</button></span></div>` : ''}
    ${e.art !== 'korrektur' && e.art !== 'umbuchung' ? `<div class="feld voll"><label>Position</label>
      <select id="bZeile">${positionOptionen(e.zeileId, k.id)}</select></div>` : ''}
    ${e.art === 'ausgabe' ? `<div class="feld voll"><label>Zahlung an eine Verbindlichkeit</label>
      <select id="bVerb"><option value="">— keine —</option>${
        D.verbindlichkeiten.filter(v=>v.aktiv!==false).map(v =>
        `<option value="${v.id}" ${e.verbId===v.id?'selected':''}>${v.bezeichnung} · Stand ${fmt(verbindStandHeute(v))}</option>`).join('')
      }</select></div>` : ''}
    <div class="feld voll"><label>Notiz${e.art==='korrektur'?' — Pflicht bei einer Korrektur':''}</label>
      <input type="text" id="bText" value="${(e.text||'').replace(/"/g,'&quot;')}"
             placeholder="${e.art==='korrektur'?'Warum wird korrigiert?':'frei'}"></div>
    <div class="aktion">
      <button class="knopf primaer" id="btnBuchen">Buchen</button>
      <span class="hint" id="bHint"></span></div>
  </div>`;
}
function kontoOptionen(sel, ausser) {
  return D.konten.filter(k => k.aktiv !== false && k.id !== ausser)
    .sort((a,b)=>a.rang-b.rang)
    .map(k => `<option value="${k.id}" ${sel===k.id?'selected':''}>${k.nr} ${k.name}</option>`).join('');
}
/* A-48: die Positionen des gewaehlten Kontos zuoberst, waehlbar sind alle.
   Ohne das liesse sich auf Konto 08 keine Rate und auf 05 gar nichts buchen. */
function positionOptionen(sel, kontoId) {
  const eigen = [], fremd = [];
  D.kategorien.filter(k => k.aktiv !== false).sort((a,b)=>a.rang-b.rang).forEach(k => {
    zeilenVon(k.id).forEach(z => {
      /* Die drei Verbindlichkeitszeilen sind gesperrt — dort wird nichts gebucht,
         die Rate laeuft ueber das Feld «Zahlung an eine Verbindlichkeit».
         Die Sammelzeile «Rechnungen» ist dagegen waehlbar: sie ist die Position,
         unter der eine Rechnungszahlung im Budget steht. */
      if (zeileGruppe[z.id]) return;
      (k.kontoId === kontoId ? eigen : fremd).push({ z, k });
    });
  });
  const opt = x => `<option value="${x.z.id}" ${sel===x.z.id?'selected':''}>${x.k.name} | ${x.z.bezeichnung}</option>`;
  return `<option value="">— ohne Position —</option>` +
    (eigen.length ? `<optgroup label="Zu diesem Konto">${eigen.map(opt).join('')}</optgroup>` : '') +
    (fremd.length ? `<optgroup label="Alle übrigen">${fremd.map(opt).join('')}</optgroup>` : '');
}
function buchungSpeichern() {
  const e = _entwurf;
  const hint = $('#bHint');
  const betrag = zahl($('#bBetrag').value);
  if (!betrag) { hint.textContent = 'Ohne Betrag geht es nicht.'; return; }
  e.datum = $('#bDatum').value || heuteISO();
  e.ganzerMonat = $('#bMonat').checked;
  e.text = $('#bText').value.trim();
  if (e.art === 'korrektur' && !e.text) {
    hint.textContent = 'Eine Korrektur ohne Notiz lässt sich nicht speichern.'; return; }
  if (e.art === 'umbuchung') {
    e.gegenkontoId = $('#bGegen').value;
    if (!e.gegenkontoId) { hint.textContent = 'Eine Umbuchung braucht ein Gegenkonto.'; return; }
  }
  if ($('#bZeile')) e.zeileId = $('#bZeile').value;
  if ($('#bVerb'))  e.verbId  = $('#bVerb').value;
  if (e.ganzerMonat) { const d = ymOf(e.datum); e.datum = iso(d.j, d.m, tageImMonat(d.j, d.m)); }
  const b = {
    id: neueId('b'), datum: e.datum, ganzerMonat: e.ganzerMonat, kontoId: e.kontoId,
    art: e.art, betrag: rd(betrag), gegenkontoId: e.gegenkontoId || null,
    zeileId: e.zeileId || null, text: e.text, serieId: e.serieId || null,
    rechnungId: e.rechnungId || null, verbId: e.verbId || null,
    sparzielId: e.sparzielId || null, belegDatei: null, belegOffen: false
  };
  if (e.art === 'korrektur') b.richtung = e.richtung || 'plus';
  D.buchungen.push(b);
  _entwurf = null;
  persist();
  _blatt.reiter = 'journal';
  blattZeichnen();
}
function zahl(s) {
  if (s === null || s === undefined) return 0;
  const t = String(s).replace(/[’'\s]/g, '').replace(',', '.').replace('−','-');
  const n = parseFloat(t);
  return isFinite(n) ? Math.abs(n) : 0;
}

/* ---- Journal (A-19, A-54, A-94) -------------------------------------- */
function journal(k) {
  const von = S.zeitraum === 'monat' ? { j:S.jahr, m:S.monat } : { j:S.jahr, m:0 };
  const bis = S.zeitraum === 'monat' ? { j:S.jahr, m:S.monat } : { j:S.jahr, m:11 };
  const drin = b => { const d = ymOf(b.datum);
    return (d.j > von.j || (d.j === von.j && d.m >= von.m)) && (d.j < bis.j || (d.j === bis.j && d.m <= bis.m)); };
  const eigene = D.buchungen.filter(b => (b.kontoId === k.id || b.gegenkontoId === k.id) && drin(b))
                            .sort((a,b) => a.datum < b.datum ? -1 : 1);
  let vs = [];
  if (S.zeitraum === 'monat') vs = vorschlaege(k.id, S.jahr, S.monat);
  else for (let m = 0; m <= 11; m++) vs = vs.concat(vorschlaege(k.id, S.jahr, m));

  const anfang = kontosaldo(k.id, von.j, von.m === 0 ? -1 : von.m - 1);
  let lauf = S.zeitraum === 'monat'
    ? kontosaldo(k.id, S.monat === 0 ? S.jahr-1 : S.jahr, S.monat === 0 ? 11 : S.monat-1)
    : kontosaldo(k.id, S.jahr-1, 11);
  const ein = rd(eigene.reduce((s,b) => s + wirkung(b,k.id) > 0 ? s + Math.max(0,wirkung(b,k.id)) : s, 0));
  const zeilen = eigene.map(b => {
    const w = wirkung(b, k.id); lauf = rd(lauf + w);
    const z = b.zeileId ? zeile(b.zeileId) : null;
    return `<tr data-jz="${b.id}">
      <td class="tag">${b.ganzerMonat ? MON[ymOf(b.datum).m] : kurzdatum(b.datum)}</td>
      <td>${z ? z.bezeichnung : (b.text || artName(b.art))}${
        b.art === 'umbuchung' ? `<span class="marke-um">${b.kontoId===k.id?'→ '+konto(b.gegenkontoId).name:'← '+konto(b.kontoId).name}</span>` : ''}</td>
      <td class="r num ${w<0?'neg':''}">${fmt(w)}</td>
      <td class="r num">${fmt(lauf)}</td>
      <td class="r"><span class="zwerk"><button class="knopf klein" data-jedit="${b.id}">Ändern</button>
        <button class="knopf klein" data-jdel="${b.id}">Löschen</button></span></td></tr>`;
  }).join('');
  const vzeilen = vs.map(v => {
    const vo = v.serie.vorlage;
    return `<tr class="vorschlag">
      <td class="tag">${kurzdatum(v.datum)}</td>
      <td>${vo.text || (vo.zeileId ? zeile(vo.zeileId).bezeichnung : artName(vo.art))} · Vorschlag</td>
      <td class="r num">${fmt(vo.art === 'einnahme' ? vo.betrag : -vo.betrag)}</td>
      <td class="r num">–</td>
      <td class="r"><span class="zwerk"><button class="knopf klein" data-vbuch="${v.serie.id}:${v.datum}">Buchen</button>
        <button class="knopf klein" data-vskip="${v.serie.id}:${v.datum}">Überspringen</button></span></td></tr>`;
  }).join('');
  return `<div class="kennzahlen">
      <span class="wert"><span class="k">Anfang</span><span class="v">${fmt(anfang)}</span></span>
      <span class="wert"><span class="k">Buchungen</span><span class="v">${eigene.length}</span></span>
      <span class="wert"><span class="k">Saldo</span><span class="v">${fmt(kontosaldo(k.id, bis.j, bis.m))}</span></span>
      ${vs.length ? `<span class="wert"><span class="k">Vorschläge</span><span class="v off">${vs.length}</span>
        <span class="z">zählen nirgends mit</span></span>` : ''}
    </div>
    <table class="journal"><thead><tr><th>Tag</th><th>Position</th><th class="r">Betrag</th>
      <th class="r">Saldo</th><th></th></tr></thead>
    <tbody>${zeilen}${vzeilen}${(!zeilen && !vzeilen) ? `<tr><td colspan="5"><span class="meldung">In diesem Zeitraum ist nichts gebucht.</span></td></tr>` : ''}</tbody></table>
    <div style="margin-top:12px"><button class="knopf klein" id="btnSerieNeu">Serie anlegen</button></div>`;
}
function wirkung(b, kId) {
  if (b.kontoId === kId) {
    if (b.art === 'einnahme') return b.betrag;
    if (b.art === 'korrektur') return b.betrag * (b.richtung === 'minus' ? -1 : 1);
    return -b.betrag;
  }
  return b.betrag;                       /* Empfaengerseite einer Umbuchung */
}
function artName(a) { return { ausgabe:'Ausgabe', einnahme:'Einnahme', umbuchung:'Umbuchung', korrektur:'Korrektur' }[a] || a; }

/* ---- Verlauf --------------------------------------------------------- */
function verlauf(k) {
  const pts = [];
  for (let m = 0; m <= 11; m++) pts.push(kontosaldo(k.id, S.jahr, m));
  const min = Math.min(0, ...pts), max = Math.max(1, ...pts);
  const x = i => 20 + i * (560 / 11), y = v => 280 - ((v - min) / (max - min || 1)) * 250;
  const d = pts.map((v,i) => (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(v).toFixed(1)).join(' ');
  return `<svg class="verlauf" viewBox="0 0 600 300" preserveAspectRatio="none">
      <line x1="20" y1="${y(0).toFixed(1)}" x2="580" y2="${y(0).toFixed(1)}" stroke="#3a3a3a"/>
      <path d="${d}" fill="none" stroke="#EE7F00" stroke-width="2"/>
      ${pts.map((v,i)=>`<circle cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="2.5" fill="#EE7F00"/>`).join('')}
    </svg>
    <div class="kennzahlen" style="margin-top:10px">
      ${MON.map((n,i)=>`<span class="wert"><span class="k">${n}</span><span class="v">${fmt(pts[i])}</span></span>`).join('')}
    </div>`;
}

/* ===================================================================
   Schuldblatt — Zahlung und Tilgung
   =================================================================== */
function blattSchuld(id) {
  const v = verbind(id);
  const reiter = _blatt.reiter || 'zahlung';
  _blatt.reiter = reiter;
  const koerper = reiter === 'zahlung' ? maskeZahlung(v)
                : reiter === 'tilgung' ? tilgung(v)
                :                        schuldVerlauf(v);

/* ---- Verlauf einer Schuld ------------------------------------------
   Bis heute der wirkliche Stand, danach die Prognose — die Trennlinie
   sagt, wo das Gerechnete aufhoert und das Geplante anfaengt. */
function schuldVerlauf(v) {
  const jahre = Object.keys(D.budget).map(Number).sort();
  const a = ymOf(v.anfangsdatum), h = ymOf(heuteISO());
  const punkte = [], beschr = [];
  for (const j of jahre) {
    for (let m = 0; m < 12; m++) {
      if (j < a.j || (j === a.j && m < a.m)) continue;
      punkte.push({ j, m, wert: verbindPrognose(v, j, m), kuenftig: (j > h.j) || (j === h.j && m > h.m) });
    }
  }
  if (!punkte.length) return '<p class="meldung">Kein Verlauf.</p>';
  const w = punkte.map(p => p.wert);
  const max = Math.max(...w, 1), min = Math.min(...w, 0);
  const B = 640, H = 260, lr = 52, or_ = 14, ur = 26;
  const x = i => lr + i * (B - lr - 14) / Math.max(1, punkte.length - 1);
  const y = val => or_ + (H - or_ - ur) * (1 - (val - min) / ((max - min) || 1));
  const heuteI = punkte.findIndex(p => p.kuenftig);
  const pfad = a2 => a2.map((p,i) => (i ? 'L' : 'M') + x(p.i).toFixed(1) + ' ' + y(p.wert).toFixed(1)).join(' ');
  const mitI = punkte.map((p,i) => ({ ...p, i }));
  const bisHeute = mitI.filter(p => !p.kuenftig);
  const abHeute  = mitI.filter((p,i) => p.kuenftig || i === bisHeute.length - 1);
  const getilgt = tilgungsende(v);
  return `<div class="kennzahlen">
      <span class="wert"><span class="k">Stand heute</span><span class="v">${fmt(verbindStandHeute(v))}</span></span>
      <span class="wert"><span class="k">Anfangsstand</span><span class="v">${fmt(v.anfangsstand)}</span></span>
      <span class="wert"><span class="k">Getilgt</span><span class="v">${Math.round(getilgtAnteil(v)*100)} %</span></span>
      <span class="wert"><span class="k">Frei ab</span>
        <span class="v" style="font-size:15px">${getilgt || 'nach Plan nicht'}</span></span>
    </div>
    <svg class="verlauf" viewBox="0 0 ${B} ${H}" preserveAspectRatio="none">
      <line x1="${lr}" y1="${y(0).toFixed(1)}" x2="${B-14}" y2="${y(0).toFixed(1)}" stroke="#3a3a3a"/>
      <text x="4" y="${(y(max)+4).toFixed(1)}" font-size="10" fill="#9b9b9b">${fmt(max,0)}</text>
      <text x="4" y="${(y(min)+4).toFixed(1)}" font-size="10" fill="#9b9b9b">${fmt(min,0)}</text>
      <path d="${pfad(bisHeute)}" fill="none" stroke="#EE7F00" stroke-width="2.2"/>
      <path d="${pfad(abHeute)}" fill="none" stroke="#EE7F00" stroke-width="1.6" stroke-dasharray="4 3" opacity=".75"/>
      ${heuteI > 0 ? `<line x1="${x(heuteI).toFixed(1)}" y1="${or_}" x2="${x(heuteI).toFixed(1)}" y2="${H-ur}"
        stroke="#9b9b9b" stroke-dasharray="2 3"/>
        <text x="${x(heuteI).toFixed(1)}" y="${or_+9}" font-size="10" fill="#9b9b9b" text-anchor="middle">heute</text>` : ''}
      ${punkte.map((p,i) => (p.m === 0 || i === 0)
        ? `<text x="${x(i).toFixed(1)}" y="${H-8}" font-size="10" fill="#9b9b9b" text-anchor="middle">${p.j}</text>` : '').join('')}
    </svg>
    <p class="meldung" style="margin-top:8px">Durchgezogen bis heute — das ist der gerechnete Stand aus
      Anfangsstand, gebuchten Zahlungen, Zins und Gebühr. Gestrichelt danach: die Prognose nach dem
      Ratenplan.${v.zinssatz ? ' Gerechnet mit ' + v.zinssatz + ' % Monatszins' + (v.gebuehr ? ' und ' + fmt(v.gebuehr) + ' Gebühr.' : '.') : ''}</p>`;
}

/* ---- Tilgungsprognose (E-15). Sie muss auch zeigen koennen,
   dass eine Schuld NICHT getilgt wird. -------------------------------- */
function tilgung(v) {
  const a = ymOf(v.anfangsdatum);
  let j = a.j, m = a.m, s = v.anfangsstand;
  if (a.t >= tageImMonat(a.j, a.m)) { m++; if (m===12) { m=0; j++; } }
  const z = v.zinssatz || 0, g = v.gebuehr || 0;
  const rows = [];
  let getilgtIm = null, jahresBeginn = s, letztesJahr = j;
  for (let i = 0; i < 84 && s > 0.005; i++) {
    const vor = s;
    (v.erhoehungen||[]).forEach(e => { const d = ymOf(e.datum);
      if (d.j===j && d.m===m) s += (e.art==='minderung' ? -e.betrag : e.betrag); });
    const zins = rd(s * z/100), r = rate(v, j, m);
    s = rd(s + zins + g - r);
    rows.push({ j, m, vor, zins, geb:g, rate:r, nach:s });
    if (s <= 0.005 && !getilgtIm) getilgtIm = MON_LANG[m] + ' ' + j;
    m++; if (m === 12) { m = 0; j++; }
  }
  const waechst = rows.length > 12 && rows[rows.length-1].nach > rows[0].vor;
  const kopf = getilgtIm
    ? `<p class="notiz"><b>Getilgt im ${getilgtIm}.</b> Gerechnet mit ${z ? z + ' % Monatszins' : 'ohne Zins'}${g ? ' und ' + fmt(g) + ' Gebühr' : ''}.</p>`
    : `<p class="notiz meldung fehler"><b>Diese Schuld wird nach dem vorliegenden Plan nicht getilgt.</b>
       ${waechst ? 'Sie wächst: Zins und Gebühr sind grösser als die Raten.' : 'Der Ratenplan endet, bevor der Stand null erreicht.'}
       Stand nach ${rows.length} Monaten: ${fmt(rows.length ? rows[rows.length-1].nach : v.anfangsstand)}.</p>`;
  return kopf + `<table class="tilg"><thead><tr><th>Monat</th><th>Stand</th><th>Zins</th><th>Gebühr</th>
      <th>Zahlung</th><th>danach</th></tr></thead><tbody>${
    rows.map(r => `<tr class="${r.m===11?'jahr':''}"><td>${MON[r.m]} ${r.j}</td><td>${fmt(r.vor)}</td>
      <td>${r.zins?fmt(r.zins):''}</td><td>${r.geb?fmt(r.geb):''}</td>
      <td class="zahl">${r.rate?fmt(r.rate):''}</td><td>${fmt(r.nach)}</td></tr>`).join('')
    }</tbody></table>`;
}

/* ===================================================================
   GAEPP — Belege lesen (A-55).

   Aus einem abgelegten PDF holt GAEPP heraus, was drinsteht: Betrag,
   Faelligkeit, Rechnungssteller, Rechnungsnummer und Referenz. Ohne
   Bibliothek und ohne Netz — die Textstroeme eines PDF liegen entweder
   im Klartext oder mit Deflate gepackt vor, und Deflate kann der Browser
   selbst (DecompressionStream).

   Zwei Regeln, die diesen Teil tragen:
   - **Erkanntes wird als erkannt gekennzeichnet, Nichterkanntes bleibt leer.**
     Eine geratene Zahl auf einer Rechnung ist schlimmer als ein leeres Feld.
   - **Nichts wird still uebernommen.** Was GAEPP gefunden hat, steht sichtbar
     ueber der Maske, und jedes Feld laesst sich ueberschreiben.
   =================================================================== */

/* Deflate direkt ueber Writer und Reader — der Umweg ueber Blob und Response
   scheitert, wenn die Datei aus dem Dateisystem geoeffnet wurde (file://). */
async function entpacken(bytes, art) {
  const stuecke = [];
  let n = 0;
  try {
    const ds = new DecompressionStream(art);
    const schreiber = ds.writable.getWriter();
    schreiber.write(bytes).catch(() => {});
    schreiber.close().catch(() => {});
    const leser = ds.readable.getReader();
    while (true) {
      const { value, done } = await leser.read();
      if (done) break;
      stuecke.push(value); n += value.length;
      if (n > 12e6) break;                    /* Notbremse bei riesigen Stroemen */
    }
  } catch (err) {
    /* «Junk found after end of compressed data» heisst: der Strom war gueltig und
       danach stand noch das Trennzeichen vor endstream. Was gelesen wurde, gilt.
       Bei einem echten Fehler ist die Liste leer und wir geben null zurueck. */
  }
  if (!n) return null;
  const alles = new Uint8Array(n);
  let k = 0;
  for (const st of stuecke) { alles.set(st, k); k += st.length; }
  return new TextDecoder('latin1').decode(alles);
}

/* ---- Textstroeme aus einem PDF ------------------------------------- */
async function pdfText(datei) {
  const roh = new Uint8Array(await datei.arrayBuffer());
  const kopf = new TextDecoder('latin1').decode(roh.subarray(0, 8));
  if (!kopf.startsWith('%PDF')) return '';
  const ganz = new TextDecoder('latin1').decode(roh);
  const teile = [];
  let i = 0;
  while (true) {
    const a = ganz.indexOf('stream', i);
    if (a < 0) break;
    /* «endstream» enthaelt «stream» — ohne diese Pruefung verschiebt sich alles. */
    if (ganz.slice(a - 3, a) === 'end') { i = a + 6; continue; }
    let b = a + 6;
    if (ganz[b] === '\r') b++;
    if (ganz[b] === '\n') b++;
    const e = ganz.indexOf('endstream', b);
    if (e < 0) break;
    i = e + 9;
    const roh2 = roh.subarray(b, e);
    let text = null;
    /* Erst ungepackt versuchen, dann mit Deflate und mit rohem Deflate. */
    const probe = new TextDecoder('latin1').decode(roh2.subarray(0, 400));
    if (/BT|Tj|TJ/.test(probe) && !/[\x00-\x08\x0e-\x1f]{4}/.test(probe.slice(0,40))) {
      text = new TextDecoder('latin1').decode(roh2);
    } else {
      for (const art of ['deflate', 'deflate-raw']) {
        const t = await entpacken(roh2, art);
        if (t && /BT|Tj|TJ/.test(t)) { text = t; break; }
      }
    }
    if (text) teile.push(text);
  }
  /* Aus den Textoperatoren die Zeichenketten holen. */
  let out = '';
  for (const t of teile) {
    const klammern = t.match(/\((?:\\.|[^()\\])*\)/g) || [];
    out += klammern.map(s => s.slice(1, -1)
      .replace(/\\([nrt])/g, ' ')
      .replace(/\\([()\\])/g, '$1')
      .replace(/\\([0-7]{1,3})/g, (m, o) => String.fromCharCode(parseInt(o, 8)))).join(' ') + ' ';
    const hex = t.match(/<([0-9A-Fa-f\s]{4,})>/g) || [];
    for (const h of hex) {
      const z = h.replace(/[<>\s]/g, '');
      if (z.length % 2) continue;
      let s = '';
      for (let k = 0; k < z.length; k += 2) {
        const c = parseInt(z.substr(k, 2), 16);
        if (c >= 32 && c < 255) s += String.fromCharCode(c);
      }
      if (s.length > 3) out += s + ' ';
    }
  }
  return out.replace(/\s+/g, ' ').trim();
}

/* ---- Aus dem Text die Angaben herausfischen ------------------------- */
/* Zwei Stufen: «weich» behaelt Punkt, Komma und Apostroph — sonst wird aus
   121.90 die Zahl 121 90 und der Betrag ist nicht mehr zu finden. «hart»
   wirft alles weg und dient nur dem Namensabgleich. */
function weich(s) {
  return String(s).toLowerCase()
    .replace(/ä/g,'a').replace(/ö/g,'o').replace(/ü/g,'u').replace(/é|è|ê/g,'e').replace(/ß/g,'ss')
    .replace(/[^a-z0-9 .,'\/-]/g,' ').replace(/\s+/g,' ').trim();
}
function ohneAkzent(s) {
  return weich(s).replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
}
function belegLesen(text, dateiname) {
  const f = { betrag:null, faelligkeit:null, stellerId:null, stellerName:null,
              nummer:null, referenz:null, iban:null, gefunden:[], text };
  const T = text || '';
  const flach = weich(T);          /* fuer Betraege und Daten */
  const hart  = ohneAkzent(T);     /* fuer den Namensabgleich */

  /* --- Betrag: erst dort, wo die Rechnung ihn selbst benennt --- */
  const geld = '([0-9]{1,3}(?:[\' ][0-9]{3})*(?:[.,][0-9]{2}))';
  const betragMuster = [
    new RegExp('betrag von chf ' + geld, 'i'),
    new RegExp('rechnungsbetrag[^0-9]{0,20}' + geld, 'i'),
    new RegExp('zu zahlen[^0-9]{0,20}' + geld, 'i'),
    new RegExp('total[^0-9]{0,20}chf ?' + geld, 'i'),
    new RegExp('chf ' + geld + '[^0-9]{0,12}bis', 'i'),
    new RegExp('offener? (?:betrag|saldo)[^0-9]{0,20}' + geld, 'i')
  ];
  const zuZahl = x => rd(parseFloat(String(x).replace(/[' ]/g,'').replace(',','.')));
  for (const m of betragMuster) {
    const t = flach.match(m);
    if (t) { f.betrag = zuZahl(t[1]); f.gefunden.push('Betrag'); break; }
  }
  /* Rueckfall: steht genau ein Betrag hinter «CHF», ist er es fast immer. */
  if (f.betrag === null) {
    const alle = [...flach.matchAll(new RegExp('chf ?' + geld, 'gi'))].map(t => zuZahl(t[1]));
    const einzig = [...new Set(alle)];
    if (einzig.length === 1) { f.betrag = einzig[0]; f.gefunden.push('Betrag'); }
  }

  /* --- Faelligkeit: «zahlbar bis», «bis TT.MM.JJJJ», «faellig am» --- */
  const dat = '([0-3]?[0-9])[.\\/ ]([01]?[0-9])[.\\/ ](20[0-9]{2})';
  const datumMuster = [
    new RegExp('zahlbar bis(?: zum)?[^0-9]{0,10}' + dat, 'i'),
    new RegExp('bis(?: zum)?[^0-9]{0,10}' + dat, 'i'),
    new RegExp('fallig(?: am)?[^0-9]{0,10}' + dat, 'i'),
    new RegExp('zahlungsziel[^0-9]{0,10}' + dat, 'i')
  ];
  for (const m of datumMuster) {
    const t = flach.match(m);
    if (t) {
      const j = +t[3], mo = +t[2], tg = +t[1];
      if (mo >= 1 && mo <= 12 && tg >= 1 && tg <= 31) {
        f.faelligkeit = iso(j, mo - 1, tg); f.gefunden.push('Fälligkeit'); break;
      }
    }
  }

  /* --- Rechnungssteller: Abgleich gegen die gepflegte Liste --- */
  let best = null;
  D.steller.filter(s => s.aktiv !== false && s.id !== 'st_sonstige').forEach(s => {
    /* Auch Teilnamen: «Cembra - Yoursmoke» findet «cembra». */
    ohneAkzent(s.name).split(' ').filter(w => w.length >= 4).forEach(wort => {
      if (hart.includes(wort) && (!best || wort.length > best.laenge))
        best = { s, laenge: wort.length };
    });
  });
  if (best) { f.stellerId = best.s.id; f.stellerName = best.s.name; f.gefunden.push('Rechnungssteller'); }

  /* --- Rechnungsnummer, QR-Referenz, IBAN --- */
  const nr = T.match(/(?:Rechnung(?:s)?(?:\s*Nr\.?|nummer)?|Monatsrechnung|Beleg(?:nr)?)[^0-9]{0,12}((?:\d[\d\s]{5,})\d)/i);
  if (nr) { f.nummer = nr[1].replace(/\s+/g,' ').trim(); f.gefunden.push('Rechnungsnummer'); }
  const ref = T.replace(/\s/g,'').match(/\b(\d{27})\b/);
  if (ref) { f.referenz = ref[1]; f.gefunden.push('Referenz'); }
  const iban = T.replace(/\s/g,'').match(/\b(CH\d{2}[0-9A-Z]{15,17})\b/);
  if (iban) { f.iban = iban[1]; f.gefunden.push('IBAN'); }

  /* --- Notfalls das Datum aus dem Dateinamen --- */
  if (!f.faelligkeit && dateiname) {
    const d = String(dateiname).match(/(20[0-9]{2})[-_ ]?([01][0-9])[-_ ]?([0-3][0-9])/);
    if (d) { f.faelligkeit = d[1] + '-' + d[2] + '-' + d[3]; f.gefunden.push('Datum aus dem Dateinamen'); }
  }
  return f;
}

/* Wird nach dem Ablegen einer Datei aufgerufen; das Ergebnis landet in _gelesen. */
let _gelesen = null;
async function belegAuswerten(datei) {
  _gelesen = { laeuft:true, name:datei.name };
  try {
    const t = /\.pdf$/i.test(datei.name) ? await pdfText(datei) : '';
    _gelesen = belegLesen(t, datei.name);
    _gelesen.name = datei.name;
    _gelesen.keinText = !t;
  } catch (err) {
    _gelesen = { name:datei.name, gefunden:[], fehler:String(err.message || err) };
  }
  return _gelesen;
}
