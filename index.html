  /* «Frei per Jahresende» und «Frei per Monatsende» standen mit derselben Zahl
     untereinander, weil freiPerJahresende nichts anderes tat als
     freiPerMonatsende weiterzureichen. Zwei Beschriftungen, ein Wert — das
     laesst den Leser nach dem Unterschied suchen, den es nicht gibt. Der
     Jahreswert ist verfuegbarPer(j, 11); Dashboard und Kopfband rechnen ihn
     schon so. */
  const jahrW = verfuegbarPer(h.j, 11);
  const hhk = D.konten.filter(k => k.frei);
  const bestand = rd(hhk.reduce((s,k) => s + kontosaldo(k.id, h.j, h.m), 0));
  const offen = offeneAufFreiem(h.j, h.m);
  const woanders = rd(D.rechnungen.reduce((s,r) => {
    const f = ymOf(r.faelligkeit);
    return (r.status === 'offen' && f.j === h.j && f.m === h.m && !mindertFreies(r, h.j, h.m))
      ? s + r.betrag : s; }, 0));
  if (S.modus === 'tabellen') {
    return `<div class="karte liq-schmal">
      <span class="wert"><span class="k">Jahr</span><span class="v">${fmt(jahrW)}</span></span>
      <span class="wert"><span class="k">Monat</span><span class="v">${fmt(frei)}</span></span>
      <span class="wert"><span class="k">Pro Tag</span><span class="v">${fmt(pt)}</span>
        <span class="z">${t} Tage bis zum ${D.meta.lohntag}.</span></span></div>`;
  }
  return `<div class="karte liq-karte"><div class="karte-koerper liq">
    <span class="wert"><span class="k">Frei per Jahresende</span><span class="v">${fmt(jahrW)}</span></span>
    <span class="wert"><span class="k">Frei per Monatsende</span><span class="v">${fmt(frei)}</span></span>
    <span class="wert"><span class="k">Pro Tag</span><span class="v">${fmt(pt)}</span>
      <span class="z">${t} Tage bis zum ${D.meta.lohntag}.</span></span>
    <div class="herleitung">
      ${hhk.map(k => `<div class="zeile"><span>${k.name}</span><span class="num">${fmt(kontosaldo(k.id,h.j,h.m))}</span></div>`).join('')}
      <div class="zeile"><span>offene Rechnungen ab ${hhk.map(k=>k.name).join(', ')}</span><span class="num">${offen ? '−' + fmt(offen) : '0.00'}</span></div>
      ${woanders ? `<div class="zeile"><span>offen, ab einem anderen Konto gedeckt</span><span class="num">${fmt(woanders)}</span></div>` : ''}
      <div class="zeile ergebnis"><span>verfügbar</span><span class="num">${fmt(frei)}</span></div>
    </div></div></div>`;
}
/* UEBERHOLT (18.08.2026). Der Name verspricht einen Jahreswert, geliefert wird
   der Monatswert — dieselbe Zahl unter anderer Beschriftung. Der einzige
   Aufrufer (liqKarteHtml) nimmt jetzt verfuegbarPer(j, 11); weitere gibt es
   nicht. Bleibt stehen, damit ein alter eingefrorener Export, der den
   Quelltext mitfuehrt, nichts vermisst — fuer neue Aufrufe ist verfuegbarPer
   die richtige Adresse. */
function freiPerJahresende(j) {
  const h = ymOf(heuteISO());
  if (j !== h.j) return null;
  return freiPerMonatsende(h.j, h.m);
}

/* ===================================================================
   U-6 — Zwei Zahlen, die es bisher nicht gab.
   -------------------------------------------------------------------
   `freiPerMonatsende` gibt fuer jeden Monat ausser dem laufenden null
   zurueck, und `freiPerJahresende` gab bisher denselben Wert noch
   einmal aus. Deshalb standen im Kennzahlenband dreimal dieselbe Zahl.

   ANNAHME, von Albrecht zu pruefen: Verfuegbar per Ende eines kuenftigen
   Monats = heutiges freies Geld plus die budgetierten Saldi aller Monate
   dazwischen. Das ist eine Planzahl, kein Kontostand — sie rechnet mit
   dem Budget, nicht mit Buchungen, und weiss nichts von Rechnungen, die
   erst noch kommen.
   =================================================================== */
function verfuegbarPer(j, m) {
  const h = ymOf(heuteISO());
  const start = freiPerMonatsende(h.j, h.m);
  if (start === null) return null;
  if (j < h.j || (j === h.j && m < h.m)) return null;
  let s = start, jj = h.j, mm = h.m;
  while (jj < j || (jj === j && mm < m)) {
    mm++; if (mm > 11) { mm = 0; jj++; }
    s += saldoBudgetiert(jj, mm);
  }
  return rd(s);
}

/* Wann ist die letzte Verbindlichkeit getilgt? Gerechnet wird mit den
   erfassten Raten bis zum letzten Budgetjahr. Wird es nicht null, sagt
   die Funktion das — eine geschoente Null waere hier das Schlimmste. */
function schuldenfrei() {
  const h = ymOf(heuteISO());
  const jahre = Object.keys(D.budget).map(Number).sort();
  const letztes = jahre[jahre.length - 1] || h.j;
  /* U-49: die Liste wird je Jahr neu gebildet, nicht einmal vorab. Sonst
     traege ein Glaeubiger, der ab 2029 ausgeblendet ist, noch 2031 bei —
     und «schuldenfrei ab» stimmte nie. */
  const summeAm = (j, m) => rd(verbAlle(j).reduce((a,v) => a + Math.max(0, verbindPrognose(v, j, m)), 0));
  let jj = h.j, mm = h.m, n = 0;
  while (jj < letztes || (jj === letztes && mm <= 11)) {
    if (summeAm(jj, mm) < 0.005) return { monate: n, jahr: jj, monat: mm, rest: 0 };
    mm++; if (mm > 11) { mm = 0; jj++; }
    n++;
    if (n > 240) break;
  }
  return { monate: null, rest: summeAm(letztes, 11), bis: letztes };
}

/* ===================================================================
   U-25 — Vollbild fuer die Tafel
   -------------------------------------------------------------------
   Ein Schalter, zwei Vollbilder. Der App-Teil raeumt Seitenleiste und
   Kopfzeile weg, der Browser-Teil nimmt zusaetzlich Tab- und
   Adressleiste. Zusammen sind das rund 300 Pixel Breite und 130 Pixel
   Hoehe — bei einer Tabelle mit zwoelf Monatsspalten sind das drei
   Spalten und vier Zeilen mehr.

   Die beiden sind absichtlich nicht aneinander gekettet, sondern laufen
   nur ZUSAMMEN ZURUECK. Drei Wege hinaus, alle drei muessen dasselbe
   erreichen:
     1. der Schalter — schaltet beides,
     2. Escape oder F11 im Browser-Vollbild — der Browser meldet das nur
        ueber fullscreenchange, nie ueber einen Klick, also haengt der
        App-Teil dort und nicht am Knopf,
     3. der Bereichswechsel — siehe zeichneKopf().
   Verweigert der Browser das Vollbild (fehlende Berechtigung, iOS, ein
   Aufruf ohne Nutzergeste), lehnt das Promise ab. Der App-Teil bleibt
   dann trotzdem stehen: er ist der, der die Zeilen bringt, und ein
   halbes Vollbild ist besser als keines.
   =================================================================== */
function browserVollbildAn() {
  const el = document.documentElement;
  if (!el.requestFullscreen || document.fullscreenElement) return;
  /* Aeltere Umgebungen geben undefined statt eines Promise zurueck —
     erst fragen, dann fangen, sonst wirft ausgerechnet der Abfangweg. */
  const p = el.requestFullscreen();
  if (p && p.catch) p.catch(() => {});
}
function browserVollbildAus() {
  if (!document.fullscreenElement || !document.exitFullscreen) return;
  const p = document.exitFullscreen();
  if (p && p.catch) p.catch(() => {});
}
function vollbildSetzen(an) {
  S.vollbild = !!an;
  if (S.vollbild) browserVollbildAn(); else browserVollbildAus();
  /* zeichne() setzt die Klasse, misst die Spalten neu und sichert die
     Ansicht — deshalb hier kein eigener Zweig fuer irgendetwas davon. */
  zeichne();
}
document.addEventListener('fullscreenchange', () => {
  if (!document.fullscreenElement && S.vollbild) { S.vollbild = false; zeichne(); }
});
/* Der Schalter ist im Vollbild der einzige Weg zurueck — der
   Bereichswechsel ist ja weg. Deshalb steht er in allen drei Tafeln an
   derselben Stelle, ganz rechts, und traegt seinen Zustand im Zeichen:
   ⤢ geht hinein, ⤡ kommt heraus. */
function vollbildKnopf() {
  return `<button class="knopf klein" id="btnVollbild" aria-pressed="${!!S.vollbild}"
    title="${S.vollbild ? 'Vollbild verlassen (Escape)' : 'Vollbild — Leiste und Kopfzeile weichen'}"
    aria-label="${S.vollbild ? 'Vollbild verlassen' : 'Vollbild'}">${S.vollbild ? '⤡' : '⤢'}</button>`;
}
/* Die zwei Zahlen des Kopfbandes, die im Vollbild sonst ersatzlos
   wegfielen. Sie kommen mit, die drei uebrigen nicht — und das ist eine
   Entscheidung, keine Bequemlichkeit:
   «verfügbar» und «pro Tag» stehen NIRGENDS in der Tabelle. Die Tafel
   zeigt Saldo budgetiert und Saldo kumuliert, also das Budget; was auf
   dem Konto liegt und was das je Tag bis zum Lohn heisst, kommt aus den
   Buchungen. Wer eine Zahl eintraegt, prueft sie genau gegen diese zwei
   — sie im Vollbild wegzunehmen hiesse, die Arbeit zu verschlechtern,
   fuer die man das Vollbild geholt hat.
   Die drei leisen Werte («bis Dez», «Saldo <Mon>», Schulden, offen)
   bleiben weg: sie sind schon im Kopfband als zweite Reihe erklaert und
   verschwinden dort unter 1100 px von selbst. Und der Tafelkopf traegt
   bereits fuenf Schalter — er darf nicht zur zweiten Kopfzeile werden. */
function tafelKennzahlen() {
  if (!S.vollbild || !D) return '';
  const h = ymOf(heuteISO());
  const w = (k, v) => `<span class="wert"><span class="k">${k}</span><span class="v num">${v}</span></span>`;
  return `<span class="kopfband">${w('verfügbar', fmt(freiPerMonatsende(h.j, h.m)))}${w('pro Tag', fmt(proTag()))}</span>`;
}

/* ===================================================================
   Tabellenansicht — drei Reiter (Formensprache L)
   =================================================================== */
/* ===================================================================
   U-40 — Lesen und Eintragen
   -------------------------------------------------------------------
   «Alle Jahre» kennt kein Ist eines Monats. Die Karten haetten dort eine
   leere Spalte genau da, wo ihre Aussage sitzt — deshalb geht die Ansicht
   dort hart auf Tabelle, und der Schalter steht still statt zu luegen.
   =================================================================== */
/* Welche Bereiche eine Kartenansicht HABEN, steht an genau einer Stelle.
   Schalter, Verzweigung und Rueckfall fragen alle hier — waere die Antwort an
   drei Orten verteilt, gaebe ein halb gebauter Schritt einen Schalter ohne
   Ansicht oder eine Verzweigung auf eine Funktion, die es noch nicht gibt.
   Schritt 4 traegt `budget: katKarten` nach, und mehr ist dort nicht zu tun. */
const KARTENBAU = { budget: () => katKarten(), verbind: () => verbindKarten() };
/* U-41/U-44: Karten, wo es sie gibt — jetzt auch in «Alle Jahre». Dort ist
   jede Spalte ein Jahr statt ein Monat; sonst ist es dieselbe Ansicht mit
   denselben Bauteilen. Eingetragen wird dort nichts, weil ein Jahreswert die
   Summe von zwoelf Monaten ist und keine Zahl, die irgendwo steht — genau
   wie es die Tabelle vorher hielt. */
function ansichtVon(bereich) {
  return KARTENBAU[bereich] ? 'karten' : 'tabelle';
}
/* U-41: Hier stand der Umschalter «Lesen · Eintragen». Er ist weg, weil die
   Trennung weg ist: die Karte traegt ihre Eingabefelder selbst. Geblieben ist
   der CSV-Knopf, der an derselben Stelle im Tafelkopf sitzt. */
function tafelWerkzeug(bereich) {
  return `<span class="kansicht"><button class="knopf klein" type="button" data-csv="${bereich}"
    title="Exportiert, was dieser Bereich zeigt">CSV</button></span>`;
}
function zeichneTabellen() {
  /* Die Reiterzeile ist mit U-1 in die Seitenleiste gewandert, die
     Liquiditaetszahlen in die Kopfzeile. Der Inhalt traegt nur die Tafel. */
  const b = S.reiter;
  /* U-40: Die Karten zuerst und mit eigenem return — spaltenbreiten() und
     zebra() unten greifen beide auf `#tafel table`/`tbody` zu. Ohne den
     return liefen sie ins Leere; das faellt nicht auf, bis eine der beiden
     eines Tages nicht mehr so hoeflich ist. */
  if (ansichtVon(b) === 'karten') {
    $('#inhalt').innerHTML = `<div class="karte tafel" id="tafel">${KARTENBAU[b]()}</div>`;
    return;
  }
  $('#inhalt').innerHTML = `<div class="karte tafel" id="tafel"></div>`;
  const t = $('#tafel');
  if (b === 'budget')   t.innerHTML = budgetTabelle();
  if (b === 'verbind')  t.innerHTML = verbindTabelle();
  if (b === 'rechnung') t.innerHTML = rechnungTabelle();
  spaltenbreiten();
  zebra();
}
/* Verteilt die Restbreite gleichmaessig auf die Zeitspalten. Die drei
   fixierten Spalten und die Faltspalte bleiben, was sie sind — nur die
   Zahlen bekommen den gewonnenen Platz. Unter der Mindestbreite rollt
   die Tabelle wieder seitlich, wie zuvor. */
function spaltenbreiten() {
  const tab = $('#tafel table.gross'), roll = $('#tafel .rollflaeche');
  if (!tab || !roll) return;
  tab.style.removeProperty('--wz');
  /* U-25: Die gezogenen Namensbreiten gehen VOR der Messung an die Tabelle.
     Sie sind fuer diese Rechnung Festwerte wie die Vorgaben aus dem
     Stylesheet — nur eben andere. Wuerden sie erst danach gesetzt, rechnete
     die Restbreite mit den Vorgaben und die Zeitspalten faenden sich um
     genau den gezogenen Betrag daneben wieder. */
  const g = gezogeneBreiten(tab);
  ['w1','w2','w3'].forEach(v => {
    if (g[v]) tab.style.setProperty('--' + v, g[v] + 'px');
    else tab.style.removeProperty('--' + v);
  });
  const cs = getComputedStyle(tab);
  const px = n => parseFloat(cs.getPropertyValue(n)) || 0;
  const koepfe = tab.querySelectorAll('thead tr.zeile-titel th');
  const falt = tab.querySelectorAll('thead tr.zeile-titel th.faltzelle').length;
  /* U-32: Die Budgettafel hat seit dem Wegfall von Zahlungsweg und Soll nur
     noch eine fixierte Spalte. Die Rechnung muss das wissen, sonst rechnet
     sie mit zwei Breiten, die es nicht mehr gibt. */
  const fixN = tab.classList.contains('t-budget') ? 1 : 3;
  const zeit = koepfe.length - fixN - 1 - falt;
  if (zeit < 1) return;
  /* U-25: Ist die Zeitbreite von Hand gezogen, gilt sie. Die Rechnung
     darunter fuellt das Fenster aus — sie ist eine Vorgabe, keine Regel,
     und wer selbst gezogen hat, hat sich gegen sie entschieden. Dass die
     Tabelle danach seitlich rollt, ist dann seine Wahl; der Doppelklick
     auf den Greifer holt die Rechnung zurueck. */
  if (g.wz) { tab.style.setProperty('--wz', g.wz + 'px'); return; }
  const rest = roll.clientWidth - px('--w1') - (fixN > 1 ? px('--w2') + px('--w3') : 0) - falt * 28 - px('--wl') - 2;
  /* Nach oben gedeckelt (U-23). Bleibt in einem leeren Jahrgang nur eine
     einzige offene Spalte stehen, bekaeme sie sonst die ganze Restbreite —
     eine 670 Pixel breite Zelle fuer eine zweistellige Zahl. Der Deckel
     liegt beim Anderthalbfachen der Grundbreite: breit genug, dass zwei,
     drei Spalten den gewonnenen Platz noch spueren, schmal genug, dass eine
     einzelne nicht laecherlich wird. */
  /* U-43: Deckel von 126 auf 240. Seit die Faltung weg ist, stehen in «Alle
     Jahre» oft nur vier Spalten — mit dem alten Deckel blieb der Rest liegen,
     und weil die Namensspalte kein max-width trug, schluckte sie ihn. Jetzt
     bekommt die Zeit, was uebrig ist, und der Name bleibt, wie er gesetzt ist. */
  let je = Math.min(240, Math.max(80, Math.floor(rest / zeit)));
  tab.style.setProperty('--wz', je + 'px');
  /* Raender und Trennlinien kosten ein paar Pixel, die sich nicht sauber
     vorausrechnen lassen. Einmal nachmessen und nachziehen genuegt. */
  const ueber = tab.getBoundingClientRect().width - roll.clientWidth;
  if (ueber > 0 && je > 80) tab.style.setProperty('--wz', Math.max(80, je - Math.ceil(ueber / zeit)) + 'px');
}
/* ===================================================================
   U-25 — Spaltenbreiten ziehen
   -------------------------------------------------------------------
   Die drei Namensspalten gehen EINZELN, die Zeitspalten GEMEINSAM.
   Das ist keine Sparmassnahme, sondern folgt aus spaltenbreiten()
   darueber: die Zeitspalten teilen sich eine berechnete Breite (--wz),
   damit die Tabelle genau ins Fenster passt. Waere jede einzeln
   ziehbar, gaebe es diese eine Breite nicht mehr, und mit ihr fiele die
   Rechnung weg, die die Tabelle ins Fenster legt. Der Bedarf sitzt
   ohnehin bei den Namen: «Krankenkasse Zusatzversicherung» und «Miete»
   sind verschieden lang, «Januar» und «Februar» nicht.

   Nicht ziehbar sind die Faltspalte (28 px Luecke, keine Spalte) und
   die Jahresspalte ganz rechts — sie ist der Anker, gegen den gelesen
   wird, und haette als einzige Spalte am Rollrand keinen sichtbaren
   Greifer, wenn seitlich gerollt wird.

   Gemerkt wird in S.breiten, je Tabelle getrennt und nur die
   Abweichung. Nichts davon fasst D an: eine Spaltenbreite ist keine
   Zahl ueber Geld.
   =================================================================== */
const BREIT_MIN  = 60;    /* darunter trifft der Zeiger den Greifer nicht mehr */
const BREIT_REST = 160;   /* so viel Rollflaeche bleibt in jedem Fall fuer den Rest */

function tafelName(tab) {
  return tab.classList.contains('t-budget')  ? 'budget'
       : tab.classList.contains('t-verbind') ? 'verbind' : null;
}
/* Die Rechnungstafel hat keine fixierten Spalten und keine Greifer — sie
   liefert null und bekommt damit ein leeres Objekt, nicht die Breiten des
   Budgets. */
function gezogeneBreiten(tab) {
  const n = tafelName(tab);
  return (n && S.breiten && S.breiten[n]) || {};
}
function breiteMerken(name, v, px) {
  if (!name) return;
  if (!S.breiten) S.breiten = {};
  if (!S.breiten[name]) S.breiten[name] = {};
  if (px === null) delete S.breiten[name][v]; else S.breiten[name][v] = px;
  persistAnsicht();
}
/* Fokussierbar sind vier Greifer, nicht zwanzig: die drei Namensspalten
   und der ERSTE Zeitgreifer. Alle Zeitgreifer schreiben denselben Wert —
   ein zweiter Tabstopp dafuer waere einer ohne eigene Funktion. Und die
   Kopfzeile liegt vor den Eingabezellen: jeder ueberfluessige Halt dort
   kostet die eigentliche Tabellenarbeit einen Tastendruck. */
function greifer(v, tastatur) {
  return `<span class="greifer" data-greif="${v}" role="separator" aria-orientation="vertical"${
    tastatur ? ' tabindex="0"' : ''} aria-label="Spaltenbreite ändern"
    title="Ziehen ändert die Breite · Doppelklick setzt zurück"></span>`;
}

let _zieh = null;
function greiferZiel(gr) {
  const tab = gr.closest('table.gross'), roll = $('#tafel .rollflaeche');
  if (!tab || !roll) return null;
  const name = tafelName(tab);
  return name ? { tab, roll, name, v: gr.dataset.greif } : null;
}
/* Untergrenze und Deckel an einer Stelle — Ziehen und Pfeiltaste sollen
   nicht zwei verschiedene Vorstellungen davon haben, was erlaubt ist. */
function breiteZeigen(z, px) {
  const deckel = Math.max(BREIT_MIN, z.roll.clientWidth - BREIT_REST);
  z.px = Math.round(Math.min(deckel, Math.max(BREIT_MIN, px)));
  z.tab.style.setProperty('--' + z.v, z.px + 'px');
}
document.addEventListener('mousedown', ev => {
  const gr = ev.target.closest && ev.target.closest('.greifer');
  if (!gr || ev.button !== 0) return;
  const z = greiferZiel(gr);
  if (!z) return;
  /* mousedown und nicht pointerdown: ein abgebrochenes pointerdown
     unterdrueckt in Chrome die daraus folgenden Mausereignisse — und
     damit ausgerechnet den Doppelklick, der zuruecksetzt. Das
     preventDefault hier verhindert nur, dass der Zug den Kopftext
     markiert. */
  ev.preventDefault();
  z.x0 = ev.clientX;
  z.b0 = parseFloat(getComputedStyle(z.tab).getPropertyValue('--' + z.v)) || 0;
  z.px = z.b0;
  _zieh = z;
  document.body.classList.add('zieht');
});
document.addEventListener('mousemove', ev => {
  if (!_zieh) return;
  /* Wer ausserhalb des Fensters loslaesst, sendet kein mouseup hierher —
     der Zug haenge sonst fest, samt gesperrter Textauswahl. ev.buttons
     sagt, was der Nutzer tatsaechlich haelt; steht es auf null, ist der
     Zug vorbei, egal ob wir das Loslassen gesehen haben. */
  if (!ev.buttons) return zugBeenden();
  /* Beim Ziehen wird NICHT gezeichnet — eine einzige CSS-Variable je
     Bewegung, den Rest rechnet der Browser. Die left-Werte der fixierten
     Spalten haengen an denselben Variablen (left: var(--w1) bzw.
     calc(var(--w1) + var(--w2))) und ziehen deshalb von selbst mit.
     Ein zeichne() je Mausereignis baute stattdessen sechzig Zeilen neu
     auf und verloere unterwegs den Zeiger. */
  breiteZeigen(_zieh, _zieh.b0 + (ev.clientX - _zieh.x0));
});
function zugBeenden() {
  if (!_zieh) return;
  const z = _zieh; _zieh = null;
  document.body.classList.remove('zieht');
  breiteMerken(z.name, z.v, z.px);
  /* Erst beim Loslassen nachrechnen: die Zeitspalten teilen sich die
     Restbreite, und die hat sich mit der Namensspalte geaendert. */
  spaltenbreiten();
}
document.addEventListener('mouseup', zugBeenden);
/* Doppelklick auf den Greifer nimmt die Abweichung heraus — danach gilt
   wieder die Vorgabe aus dem Stylesheet und, bei den Zeitspalten, die
   Rechnung in spaltenbreiten(). */
document.addEventListener('dblclick', ev => {
  const gr = ev.target.closest && ev.target.closest('.greifer');
  if (!gr) return;
  const z = greiferZiel(gr);
  if (!z) return;
  ev.preventDefault();
  z.tab.style.removeProperty('--' + z.v);
  breiteMerken(z.name, z.v, null);
  spaltenbreiten();
});
/* Sechzehn Pixel je Tastendruck: eine Zahlenstelle ist rund acht Pixel
   breit, ein Schritt bringt also sichtbar eine Stelle mehr oder weniger.
   Ein Pixel je Druck waere Beschaeftigung, hundert waere keine Feinarbeit. */
document.addEventListener('keydown', ev => {
  const gr = ev.target;
  if (!gr || !gr.classList || !gr.classList.contains('greifer')) return;
  const d = ev.key === 'ArrowRight' ? 16 : ev.key === 'ArrowLeft' ? -16 : 0;
  if (!d) return;
  ev.preventDefault();
  const z = greiferZiel(gr);
  if (!z) return;
  breiteZeigen(z, (parseFloat(getComputedStyle(z.tab).getPropertyValue('--' + z.v)) || 0) + d);
  breiteMerken(z.name, z.v, z.px);
  spaltenbreiten();
});

/* ===================================================================
   U-28 — Zeilen innerhalb einer Kategorie ordnen
   -------------------------------------------------------------------
   Albrechts Satz war: «ich moechte gerne innerhalb einer Kategorie die
   Zeilen manuell anordnen koennen.» Die Daten konnten es laengst —
   `zeilen` tragen ein `rang`, und zeilenVon() sortiert danach. Gefehlt
   hat nur der Weg, dieses Feld zu aendern.

   ZWEI WEGE, WEIL SIE VERSCHIEDENE FRAGEN BEANTWORTEN
   In der Budgettabelle steht die Zeile neben ihren Zahlen: dort faellt
   auf, dass zwei zusammengehoerende Posten auseinanderstehen, und dort
   soll man es auch beheben koennen, ohne die Arbeit zu verlassen. Im
   Verwaltungsbaum steht die Struktur ohne Zahlen und ohne Eingabefelder:
   dort raeumt man auf. Beide schreiben dasselbe Feld ueber dieselbe
   Funktion — zwei Oberflaechen, eine Wahrheit.

   RANGVERGABE: NACH JEDEM ZUG DIE GANZE KATEGORIE NEU, IN ZEHNERSCHRITTEN
   Die Raenge im Bestand sind gewachsen: 1..29 quer ueber fuenf
   Kategorien, daneben eine Kategorie mit 100..102 und zwei, die wieder
   bei 1 anfangen. Gelesen wird `rang` NUR innerhalb einer Kategorie
   (zeilenVon, vwBaum, zeilenWahl, die Liste der Ausgeblendeten, die
   Berichte) — nachgesehen an jeder einzelnen Stelle. Eine Neuvergabe je
   Kategorie kann deshalb nichts anderswo umstellen.
   Zehnerschritte statt 1,2,3: sie kosten in der Datei nichts und lassen
   eine spaetere Einfuegung zwischen zwei Zeilen zu, OHNE die ganze
   Kategorie neu zu schreiben. Bei einer Datei, in der jede Aenderung ein
   Git-Commit ist, ist der Unterschied zwischen «ein Feld geaendert» und
   «acht Felder geaendert» im Verlauf lesbar.
   `data-add` (Zeile hinzufuegen) setzt weiterhin max+Schritt und haengt
   damit hinten an — das war schon so und bleibt richtig.

   EIN ZUG, EIN SCHREIBVORGANG
   Waehrend des Ziehens wird NICHTS geschrieben: die Bewegung setzt eine
   CSS-Klasse, mehr nicht. Erst das Loslassen ruft zeileEinordnen(), und
   das ruft merkeStand() einmal, vergibt alle Raenge und ruft persist()
   einmal. Ein persist() je Zwischenschritt waere ein Push je Mausbewegung.
   Aendert der Zug die Reihenfolge nicht (losgelassen, wo sie herkam),
   wird gar nichts geschrieben — auch kein Rueckgaengig angeboten.

   WAS NICHT PASSIERT
   Keine Zeile wechselt die Kategorie. Der Zug gilt nur im Block der
   eigenen Kategorie; ausserhalb gibt es kein Ziel, und das Loslassen tut
   nichts. `kategorieId` wird von hier aus nie geschrieben — eine Zeile
   umzuhaengen zoege Budgetwerte, Buchungen und Rechnungen mit und ist
   eine andere Entscheidung als eine Reihenfolge.
   Und die Summen aendern sich nicht: katSumme und saldoBudgetiert
   addieren, und Addition kennt keine Reihenfolge.
   =================================================================== */
const RANG_SCHRITT = 10;

/* ===================================================================
   U-31 — dasselbe fuer die Glaeubiger
   -------------------------------------------------------------------
   Albrechts Satz: «Koennten wir die Glaeubiger in der Kategrie auch frei
   anordenbar machen.» Das ist dieselbe Frage wie bei den Zeilen, und
   deshalb ist die Antwort dieselbe Maschine — keine zweite daneben.

   ZWEI UNTERSCHIEDE, DIE DER UMBAU AUSGLEICHT
   Erstens: `zeilen` tragen `rang` seit je, `verbindlichkeiten` nicht. Das
   holt verbRangFuellen() in normalisieren() nach, indem es die
   Dateireihenfolge festschreibt — beim ersten Laden aendert sich nichts.
   Zweitens: der Block heisst hier Gruppe statt Kategorie, und die drei
   Gruppen stehen fest im Code (GRUPPEN), waehrend Kategorien Daten sind.
   Fuers Ordnen ist das derselbe Fall: ein Schluessel, an dem ein Block
   haengt.

   EINE BESCHREIBUNG JE ART, EINE MASCHINE
   ORDNUNG unten beantwortet je Art vier Fragen: woher die volle Liste
   kommt, was den Block bezeichnet, wer nicht bewegt werden darf, und mit
   welchen Kennzeichen der Block im Bild zu finden ist. Alles andere —

function spaltenSicht(alleSp, hatWert) {

  const roh = []; let block = null;
  for (const s of alleSp) {
    if (!s.jetzt && vergangen(s) && !hatWert(s)) {
      if (!block) { block = { falt:true, keys:[], von:s.label, bis:s.label }; roh.push(block); }
      block.keys.push(s.key); block.bis = s.label;

     die sich etwas eintragen liesse — genau der Zustand der leeren Huelle in
     einem Jahrgang ohne Zahlen. Dass der Schalter im Tafelkopf zurueckfuehrt,
     genuegt nicht: die Tabelle selbst muss bedienbar bleiben, sonst sieht
     Albrecht beim ersten Oeffnen einen Strich und keine Eingabestelle.
     Offen bleibt die LETZTE Spalte — sie liegt am naechsten am Heute und ist
     die, in der man anfaengt. */
  if (roh.length && roh.every(x => x.falt)) {
    const letzter = roh[roh.length - 1];
    const key = letzter.keys.pop();
    if (!letzter.keys.length) roh.pop();
    else letzter.bis = (alleSp.find(a => a.key === letzter.keys[letzter.keys.length - 1]) || {}).label;

  const out = [];
  for (const x of roh) {
    if (x.falt && x.keys.length < 2) alleSp.filter(s => x.keys.includes(s.key)).forEach(s => out.push(Object.assign({}, s)));
    else out.push(x);

  out.forEach(x => { if (x.falt) { x.spanne = x.von === x.bis ? x.von : x.von + '–' + x.bis;

function gefaltet(sp) { return sp.filter(s => s.falt).reduce((a,s) => a + s.keys.length, 0); }

function budgetTabelle() {
  const spAlle = spaltenKoepfe(), alle = S.zeitraum === 'alle';
  /* U-32: In dieser Tafel wird in ganzen Franken gezeigt. Die beiden Namen
     ueberdecken fmt und fmt0 nur INNERHALB dieser Funktion — jede andere
     Tafel rechnet und zeigt weiter wie bisher. */
  const fmt = fmtG, fmt0 = fmtG0;
  /* U-21: In der Ansicht «Alle Jahre» ist jede Spalte ein anderes Jahr.
     Das Jahr einer Spalte steht in s.key, sonst gilt S.jahr — spJahr
     buendelt diese Fallunterscheidung, damit sie nicht an fuenf Stellen
     einzeln stimmen muss. */
  const spJahr = s => alle ? s.key : S.jahr;
  /* U-21: dieselbe Regel wie bei den Zeilen weiter unten. In «Alle Jahre»
     steht eine Kategorie, sobald sie in IRGENDEINER gezeigten Spalte gilt —
     sonst waeren ihre Werte der Vorjahre nirgends mehr zu sehen, obwohl die
     Saldozeile oben sie in genau diesen Spalten mitzaehlt. */
  const kats = D.kategorien.filter(k => alle ? spAlle.some(s => katSicht(k, s.key)) : katSicht(k, S.jahr))
    .sort((a,b)=>a.rang-b.rang);
  /* U-12: Der Filter waehlt aus, statt auszublenden. Nichts gewaehlt heisst
     alles sichtbar — das ist der Normalfall und braucht keinen Klick. */

  const sicht = gewaehlt.length ? kats.filter(k => gewaehlt.includes(k.id)) : kats;

  const wert = (z, s) => alle ? zeilenJahr(z, s.key) : zeilenwert(z, S.jahr, s.key);
  /* U-21: Die Wertfunktionen rechnen weiter (das muessen sie, sonst braeche
     uebertragen und jahrAnlegen) — hier wird nur ENTSCHIEDEN, ob der Wert in
     dieser Spalte etwas zu suchen hat. Ohne das zaehlte die Jahressumme rechts
     Jahre mit, in denen die Zeile gar nicht mehr steht. */
  const wertSicht = (z, s) => zeileSicht(z, spJahr(s)) ? wert(z, s) : 0;

     fuer S.jahr bildete und ueber alle Spalten wiederverwendete, zeigte in
     der Spalte 2026 eine Zeile, die es dort noch gar nicht ausgeblendet gab
     — oder liesse sie weg, obwohl sie 2026 zaehlte. */
  const katW = (k, s) => alle ? rd(zeilenVon(k.id, s.key).reduce((a,z)=>a+zeilenJahr(z,s.key)*(z.gegenrichtung?-1:1),0))

       sichtZeilen(s).some(z => Math.abs(wert(z, s)) >= 0.005)
    || Math.abs(saldoRoh(s, alle)) >= 0.005

  /* U-43: Nicht mehr gefaltet. Das Praedikat bleibt stehen — spaltenSicht()

  const zeilenReihen = katId => alle
    ? D.zeilen.filter(z => z.kategorieId === katId && spAlle.some(s => zeileSicht(z, s.key)))
              .sort((a,b) => (a.rang||0) - (b.rang||0))

     U-23 — Leere Zeilen falten, das senkrechte Gegenstueck zu U-2

/* Das Soll ist eine gepflegte Zahl wie jede andere — ausser dort, wo es

   Ratenplaenen der Verbindlichkeiten, bei der Rechnungszeile aus den
   erfassten Rechnungen. Dort waere ein Eingabefeld eine Luege: was man
   hineinschriebe, waere beim naechsten Zeichnen wieder weg. */
function sollZelle(z, soll, gesp) {
  if (gesp || _ro || S.zeitraum === 'alle')
    return `<td class="n${gesp ? ' gespiegelt-wert' : ''}"${gesp ? ' title="kommt aus ' +
      (zeileGruppe[z.id] ? 'den Ratenplänen' : 'den erfassten Rechnungen') + '"' : ''}>${fmt0(soll)}</td>`;
  return `<td class="bearbeitbar n soll" data-soll="${z.id}">
    <input type="text" value="${soll ? fmt(soll) : ''}" placeholder="0.00" inputmode="decimal"></td>`;

function zahlungsweg(z) {
  const w = z.zahlungsweg || {};
  return [w.tag ? w.tag + '.' : '', w.art || ''].filter(Boolean).join(' ');
}
function zelle(z, s, alle, gesp) {
  const kl = 'n ' + (s.jetzt ? 'jetzt ' : '');

     LEER und nicht bearbeitbar — weder «0.00» noch «–». Beides waere eine
     Aussage ueber einen Betrag, und es gibt in diesem Jahr keinen. */
  if (!zeileSicht(z, alle ? s.key : S.jahr)) return `<td class="${kl}"></td>`;
  const w = alle ? zeilenJahr(z, s.key) : zeilenwert(z, S.jahr, s.key);
  /* Nicht bearbeitbar, wo der Wert anderswo gepflegt wird (Formensprache B) */
  if (alle || gesp || _ro) return `<td class="${kl}">${fmtG0(w)}</td>`;
  const mark = S.markiert.includes(z.id + ':' + s.key) ? ' markiert' : '';
  return `<td class="bearbeitbar ${kl}${mark}" data-z="${z.id}" data-m="${s.key}">
    <input type="text" value="${w ? fmtG(w) : ''}" placeholder="0" inputmode="decimal"></td>`;
}


/* ===================================================================
   U-40 — Ist: was von einer budgetierten Zahl schon gebucht ist
   -------------------------------------------------------------------
   Neu, und das einzige Neuland in diesem Umbau. Die Karten zeigen sonst
   nur, was schon gerechnet wurde; das «Ist» gab es bis hierher nicht.

   Zwei Rechenwege, weil es zwei Arten von Buchung gibt. Eine gewoehnliche
   Ausgabe traegt zeileId und zeigt damit auf ihre Budgetposition. Eine
   Ratenzahlung traegt verbId und KEIN zeileId — ihre Budgetzeile ist
   gespiegelt und existiert nur als Summe ihrer Gruppe. Wer nur zeileId
   fragt, sieht bei den Schuldenzeilen ewig null.

   Der Betrag wird als Betrag genommen, nicht mit Vorzeichen: eine
   Budgetzeile hat eine Richtung, und die steht in ihrer Kategorie.
   Korrekturen zaehlen nicht mit — sie richten einen Kontostand und
   erfuellen keine Budgetposition.

function istZeile(z, j, m) {
  if (zeileGruppe[z.id]) return istGruppe(zeileGruppe[z.id], j, m);
  if (z.gespiegeltAus === 'rechnungen') return istRechnungen(j, m);
  return rd(D.buchungen.reduce((s,b) => {
    if (b.zeileId !== z.id || b.art === 'korrektur') return s;
    const d = ymOf(b.datum);
    return (d.j === j && d.m === m) ? s + Math.abs(b.betrag) : s;
