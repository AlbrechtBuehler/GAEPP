<!DOCTYPE html>
<html lang="de-CH"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GÄPP</title>
<!--
  GÄPP — Albrechts Haushaltsbuch.
  Diese Datei ist die leere Hülle: keine Beträge, keine Kontonummern, keine Belege (A-78).
  Die Zahlen liegen im privaten Repo und werden beim Start geladen (A-79, A-80).
  Passend | Präzise | Praktisch
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>

/* ===================================================================
   1. FARBWELT — Nacht 2 akzentuiert. Kein Umschalter. (A-69)
   =================================================================== */
:root{
  --bg:#1b1b1b; --card:#282828; --sheet:#282828; --soft:#333;
  --line:#3a3a3a; --rule:#484848; --ink:#ededed; --muted:#9b9b9b;
  --accent:#EE7F00; --onaccent:#1b1b1b;
  --ok:#8fbfa4; --err:#e0a08d; --open:#d3b587;
  --radius:16px; --radius-sm:11px;
  --gap:14px; --pad:16px; --edge:20px; --row:30px;
  --shadow:0 1px 0 rgba(255,255,255,.03) inset,0 12px 30px -22px rgba(0,0,0,.95);
  --hairline:#2f2f2f;   /* halbe Tinte: fuehrt das Auge, baut kein Gitter */
  /* Breiten der drei fixierten Spalten */
  --w1:250px; --w2:126px; --w3:78px; --wl:100px;
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none !important}
html,body{height:100%}
body{
  background:var(--bg); color:var(--ink);
  font-family:'Space Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif;
  font-size:14px; line-height:1.5; display:flex; flex-direction:column; overflow:hidden;
}
.num{font-family:'IBM Plex Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums;font-size:13px}
.ser{font-weight:600;letter-spacing:-.015em}
.neg{color:var(--err)} .pos{color:var(--ok)} .off{color:var(--open)} .muted{color:var(--muted)}

/* ===================================================================
   FORM 1 — REITER. Wechselt die Ansicht. Sonst nichts.
   =================================================================== */
.reiter{display:flex;gap:20px;align-items:flex-end}
.reiter button{
  background:none;border:none;padding:6px 0 7px;cursor:pointer;
  font-family:inherit;font-size:13px;font-weight:500;color:var(--muted);
  border-bottom:2px solid transparent;letter-spacing:-.01em;
}
.reiter button:hover{color:var(--ink)}
.reiter button[aria-selected="true"]{font-size:15px;font-weight:700;color:var(--ink);border-bottom-color:var(--accent)}
/* U-27: Eine Zahl am Reiter. Sie beantwortet die Frage, die man sonst nur
   durch Anklicken beantworten koennte — «liegt hier etwas?». Deshalb steht
   sie nur da, wenn wirklich etwas da ist: eine dauerhafte «0» waere ein
   Fleck, den das Auge nach drei Tagen nicht mehr liest. Die Ziffer traegt
   NICHT die Reiterfarbe, sonst konkurriert sie mit der Beschriftung. */
.reiterzahl{display:inline-block;min-width:16px;padding:0 5px;margin-left:1px;
  border-radius:999px;background:var(--soft);color:var(--muted);
  font-size:10.5px;font-weight:600;line-height:16px;text-align:center;vertical-align:1.5px}
.reiter button[aria-selected="true"] .reiterzahl{background:var(--accent);color:var(--onaccent)}

/* ===================================================================
   FORM 2 — SCHALTER. Zwei oder drei Zustaende derselben Sache.
   =================================================================== */
.schalter{display:inline-flex;border:1px solid var(--line);border-radius:var(--radius-sm);overflow:hidden;background:var(--bg)}
.schalter button{
  background:none;border:none;border-right:1px solid var(--line);
  padding:6px 13px;cursor:pointer;font-family:inherit;font-size:12.5px;font-weight:500;color:var(--muted);
}
.schalter button:last-child{border-right:none}
.schalter button:hover{color:var(--ink)}
.schalter button[aria-pressed="true"]{background:var(--sheet);color:var(--accent);font-weight:600}

/* ===================================================================
   FORM 3 — FILTER. Blendet Zeilen aus. Nur in einer Filterzeile.
   =================================================================== */
.filterzeile{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.filterzeile .lab{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-right:4px}
.filter{
  background:none;border:1px solid var(--rule);border-radius:999px;
  padding:3px 11px 3px 8px;cursor:pointer;font-family:inherit;font-size:12px;color:var(--muted);
  display:inline-flex;align-items:center;gap:5px;
}
.filter::before{content:'';width:9px;display:inline-block;text-align:center;font-size:10px}
.filter[aria-pressed="true"]{background:var(--soft);color:var(--ink)}
.filter[aria-pressed="true"]::before{content:'✓';color:var(--accent)}
.filter:hover{color:var(--ink)}

/* ===================================================================
   FORM 4 — KNOPF. Loest etwas aus. Immer mit Wort.
   =================================================================== */
.knopf{
  background:none;border:1px solid var(--rule);border-radius:var(--radius-sm);
  padding:6px 13px;cursor:pointer;font-family:inherit;font-size:12.5px;font-weight:500;color:var(--ink);
  display:inline-flex;align-items:center;gap:6px;white-space:nowrap;
}
.knopf:hover{border-color:var(--muted);background:var(--soft)}
.knopf.primaer{background:var(--accent);border-color:var(--accent);color:var(--onaccent);font-weight:600}
.knopf.primaer:hover{filter:brightness(1.1);background:var(--accent)}
.knopf.klein{padding:4px 10px;font-size:11.5px}
/* U-22: Ein Knopf, der etwas wegnimmt, sieht anders aus als einer, der etwas
   tut — aber nicht schreiend. Die Randfarbe genuegt; eine rote Flaeche waere
   ein Alarm, und ein Alarm, der bei jedem Loeschknopf steht, ist keiner mehr. */
.knopf.gefahr{border-color:var(--err);color:var(--err)}
.knopf.gefahr:hover{border-color:var(--err);background:rgba(224,160,141,.12)}
.knopf.primaer.gefahr{background:var(--err);border-color:var(--err);color:var(--onaccent)}

/* ===================================================================
   FORM 5 — WERT. Zeigt. Tut nichts.
   =================================================================== */
.wert{display:block}
.wert .k,.wert .v,.wert .z{display:block}
.wert .k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.wert .v{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;font-size:19px;font-weight:500;line-height:1.25}
.wert .v.gross{font-size:26px}
.wert .z{font-size:11.5px;color:var(--muted)}
.kennzahlen{display:flex;gap:18px;flex-wrap:wrap;margin-bottom:11px}
.kennzahlen .v{font-size:15px !important}
.balken{height:5px;background:var(--soft);border-radius:3px;margin-top:12px;overflow:hidden}
.balken > div{height:100%;background:var(--accent)}

/* ===================================================================
   FORM 6 — KLAPPKOPF. Die Flaeche klappt auf und zu.
   =================================================================== */
.klappkopf{
  display:inline-flex;align-items:center;gap:8px;
  background:none;border:none;border-left:3px solid var(--accent);
  padding:0 10px 0 9px;margin-left:-9px;height:calc(var(--row) - 2px);
  cursor:pointer;font-family:inherit;color:var(--ink);text-align:left;font-size:13px;
  max-width:172px;
}
.klappkopf:hover .t{color:var(--accent)}
.klappkopf .chev{font-size:10px;color:var(--accent);transition:transform .15s;flex:0 0 auto}
.klappkopf[aria-expanded="false"] .chev{transform:rotate(-90deg)}
.klappkopf .t{font-weight:600;letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.zeile-sub .klappkopf{border-left-color:var(--rule);margin-left:4px}

/* ===================================================================
   KARTE
   =================================================================== */
.karte{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.karte-kopf{display:flex;align-items:center;gap:10px;padding:13px var(--pad) 0}
.karte-kopf .titel{font-weight:600;letter-spacing:-.015em;font-size:15px;flex:1;display:flex;align-items:baseline;gap:8px}
.karte-kopf .nr{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--muted)}
.karte-koerper{padding:var(--pad)}
.karte .reiter{padding:8px var(--pad) 0;border-bottom:1px solid var(--line);gap:16px}

/* ===================================================================
   GERUEST
   =================================================================== */
.kopfzeile{display:flex;align-items:center;gap:16px;row-gap:9px;flex-wrap:wrap;
  padding:11px var(--edge);border-bottom:1px solid var(--line);background:var(--card);flex:0 0 auto}
.marke{font-weight:700;font-size:19px;letter-spacing:.02em;color:var(--accent)}
.zeitwahl{display:flex;align-items:center;gap:3px;position:relative}
.zeitwahl .pfeil{
  background:none;border:1px solid transparent;color:var(--muted);cursor:pointer;
  font-family:inherit;font-size:12.5px;padding:5px 10px;border-radius:var(--radius-sm);min-width:74px;
}
.zeitwahl .pfeil:hover{background:var(--soft);color:var(--ink);border-color:var(--rule)}
.zeitwahl .jetzt{
  background:none;border:1px solid transparent;color:var(--ink);cursor:pointer;
  font-family:inherit;font-weight:600;font-size:14.5px;letter-spacing:-.01em;padding:4px 12px;border-radius:var(--radius-sm);min-width:140px;
}
.zeitwahl .jetzt:hover{border-color:var(--rule);background:var(--soft)}
.spacer{flex:1}

.kalender{
  position:absolute;top:40px;left:50%;transform:translateX(-50%);
  background:var(--sheet);border:1px solid var(--rule);border-radius:var(--radius);
  box-shadow:0 18px 44px -14px rgba(0,0,0,.85);padding:14px;z-index:60;width:296px;
}
.kalender .jahre{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:11px;padding-bottom:11px;border-bottom:1px solid var(--line)}
.kalender .monate{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.kalender button{background:none;border:1px solid var(--line);border-radius:var(--radius-sm);color:var(--muted);padding:5px 0;cursor:pointer;font-family:inherit;font-size:12px}
.kalender button:hover{color:var(--ink);border-color:var(--rule)}
.kalender button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--onaccent);font-weight:600}
.kalender .jahre button{padding:5px 9px}
.kalender .fuss{margin-top:11px;padding-top:11px;border-top:1px solid var(--line);display:flex}
.kalender .fuss .knopf{width:100%;justify-content:center}

/* ---- Seitenleiste (U-1) -------------------------------------------
   Die Bereiche stehen links und bleiben stehen. Die Kopfzeile traegt
   nur noch, was sich mit der Zeit aendert: Zeitraum und Kennzahlen.
   Gewonnen: die Reiterzeile im Inhalt faellt ganz weg.                */
.rahmen{display:flex;flex:1 1 auto;min-height:0}
.haupt{display:flex;flex-direction:column;flex:1 1 auto;min-width:0;min-height:0}
.seitenleiste{
  flex:0 0 auto;width:212px;background:var(--card);border-right:1px solid var(--line);
  display:flex;flex-direction:column;padding:11px 10px;gap:4px;transition:width .14s;
}
.seiten-kopf{display:flex;align-items:center;gap:8px;padding:2px 6px 12px}
.seiten-kopf .marke{flex:1;overflow:hidden;white-space:nowrap}
.falten{background:none;border:1px solid transparent;border-radius:8px;color:var(--muted);
  cursor:pointer;font-family:inherit;font-size:13px;padding:3px 7px;flex:0 0 auto}
.falten:hover{background:var(--soft);color:var(--ink);border-color:var(--rule)}
.bereiche{display:flex;flex-direction:column;gap:2px}

/* ---- Suche (U-23) ---------------------------------------------------
   Ein Feld, das aussieht wie ein Feld — nicht wie ein Knopf mit Lupe.
   Die Trefferliste haengt daran und tritt aus der Leiste heraus, weil
   ein Weg («Fixkosten · Miete») in 212 Pixel nicht lesbar wird. Sie
   liegt ueber der Sprungliste und unter dem Blatt: die Suche fuehrt zu
   einem Blatt hin, sie liegt nie darueber.                            */
.suchblock{position:relative;display:flex;align-items:center;gap:7px;margin:0 0 9px;
  background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:0 8px}
.suchblock:focus-within{border-color:var(--accent)}
/* Offen liegt die Suche ueber allem — auch ueber einem Blatt (z-index 100)
   und einem Dialog (120). Sonst waere Strg-K bei geoeffnetem Kontoblatt ein
   Tippen ins Unsichtbare: der Fokus sitzt im Feld, die Trefferliste aber
   unter der Abdunklung. Escape schliesst nur die Suche, das Blatt darunter
   bleibt unberuehrt stehen. */
.suchblock.offen{z-index:130;background:var(--sheet);border-color:var(--accent)}
.suchblock > .ic{flex:0 0 14px;text-align:center;color:var(--muted);font-size:14px;cursor:pointer}
.suchblock input{flex:1;min-width:0;background:none;border:none;outline:none;color:var(--ink);
  font-family:inherit;font-size:12.5px;padding:7px 0}
.suchblock .taste{flex:0 0 auto;font-size:9.5px;color:var(--rule);white-space:nowrap;letter-spacing:.02em}
.rahmen.schmal .suchblock{justify-content:center;padding:7px 0;cursor:pointer}
.rahmen.schmal .suchblock input{display:none}
.suchliste{position:absolute;top:calc(100% + 6px);left:0;width:344px;z-index:90;
  background:var(--sheet);border:1px solid var(--rule);border-radius:var(--radius);
  box-shadow:0 18px 44px -14px rgba(0,0,0,.85);padding:5px;
  max-height:min(62vh,460px);overflow-y:auto}
.rahmen.schmal .suchliste{left:calc(100% + 8px);top:0}
.suchliste .treffer{display:grid;grid-template-columns:1fr auto;gap:1px 10px;width:100%;
  background:none;border:none;border-radius:8px;padding:6px 9px;cursor:pointer;
  font-family:inherit;text-align:left;color:var(--ink)}
.suchliste .treffer .n{font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.suchliste .treffer .a{font-size:9.5px;color:var(--muted);text-transform:uppercase;
  letter-spacing:.08em;align-self:center}
.suchliste .treffer .w{grid-column:1/-1;font-size:11px;color:var(--muted);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.suchliste .treffer:hover{background:var(--soft)}
.suchliste .treffer[aria-selected="true"]{background:var(--soft);box-shadow:inset 2px 0 0 var(--accent)}
.suchliste .treffer[aria-selected="true"] .a{color:var(--accent)}
.suchliste .leer{padding:11px 9px;font-size:12px;color:var(--muted)}
.seiten-fuss{margin-top:auto;display:flex;flex-direction:column;gap:2px;
  border-top:1px solid var(--line);padding-top:9px}
/* U-15: Diese Regel galt fuer JEDEN Knopf in der Leiste — seit der Kalender
   dort wohnt, also auch fuer seine Jahres- und Monatsknoepfe. Die wurden
   dadurch 100 % breit, der Kalender viel zu hoch und oben abgeschnitten.
   Sie gilt jetzt nur noch fuer die beiden Knopflisten, fuer die sie gedacht war. */
.bereiche > button,.seiten-fuss > button{
  display:flex;align-items:center;gap:10px;width:100%;
  background:none;border:none;border-radius:9px;padding:8px 10px;cursor:pointer;
  font-family:inherit;font-size:13px;font-weight:500;color:var(--muted);text-align:left;
  border-left:3px solid transparent;
}
.bereiche > button:hover,.seiten-fuss > button:hover{background:var(--soft);color:var(--ink)}
.bereiche > button .ic,.seiten-fuss > button .ic{flex:0 0 16px;text-align:center;font-size:13px;color:var(--muted)}
.bereiche > button .tx,.seiten-fuss > button .tx{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bereiche > button[aria-current="true"],.seiten-fuss > button[aria-current="true"]{
  background:var(--soft);color:var(--ink);font-weight:700;border-left-color:var(--accent)}
.bereiche > button[aria-current="true"] .ic,.seiten-fuss > button[aria-current="true"] .ic{color:var(--accent)}
.seitenleiste .syncknopf .punkt{flex:0 0 8px}
.seitenleiste .syncknopf .tx{font-size:11.5px}
.seitenleiste .motto{font-size:10px;padding:8px 10px 1px;color:var(--accent);opacity:.7;letter-spacing:0;white-space:nowrap;overflow:hidden}

/* ---- Zeitraum als Zoomstufen (U-9) ---------------------------------
   Drei Zeitraeume statt drei Woerter. Die Einrueckung zeigt, dass der
   Monat im Jahr und das Jahr in der Spanne liegt; die senkrechte Linie
   haelt sie zusammen. Der aktive Zeitraum traegt die Pfeile — gesprungen
   wird immer auf der Stufe, auf der man steht.                        */
.zeitblock{margin-top:16px;padding-top:12px;border-top:1px solid var(--line);position:relative}
.leisten-titel{display:block;font-size:9.5px;text-transform:uppercase;letter-spacing:.14em;
  color:var(--muted);padding:0 10px 7px}
.stufen{display:flex;flex-direction:column;gap:1px;position:relative}
.stufen::before{content:'';position:absolute;left:17px;top:11px;bottom:13px;width:1px;background:var(--line)}
.seitenleiste .stufe{
  display:flex;align-items:center;gap:9px;width:100%;position:relative;
  background:none;border:none;border-radius:8px;cursor:pointer;
  font-family:inherit;font-size:12px;color:var(--muted);text-align:left;padding:5px 6px;
}
.seitenleiste .stufe[data-tief="1"]{padding-left:18px}
.seitenleiste .stufe[data-tief="2"]{padding-left:24px}
.seitenleiste .stufe .ic{flex:0 0 12px;text-align:center;font-size:9px;color:var(--rule);
  background:var(--card);position:relative;z-index:1}
.seitenleiste .stufe .tx{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seitenleiste .stufe:hover{background:var(--soft);color:var(--ink)}
.seitenleiste .stufe[aria-pressed="true"]{color:var(--ink);font-weight:600;background:var(--soft)}
.seitenleiste .stufe[aria-pressed="true"] .ic{color:var(--accent)}
.stufe .schritt{display:none;gap:1px;flex:0 0 auto;margin:-4px -4px -4px 0}
.stufe[aria-pressed="true"] .schritt{display:flex}
.stufe .schritt i{font-style:normal;color:var(--muted);font-size:13px;line-height:1;
  padding:3px 3px;border-radius:5px}
.stufe .schritt i:hover{background:var(--rule);color:var(--accent)}
.zeitblock .kalender{top:auto;bottom:0;left:calc(100% + 8px);transform:none;width:288px;
  max-height:calc(100vh - 28px);overflow-y:auto}
/* Eingeklappt bleibt nur die Zeitachse als drei Punkte stehen. */
.rahmen.schmal .zeitblock .leisten-titel{display:none}
.rahmen.schmal .stufen::before{left:50%}
.rahmen.schmal .seitenleiste .stufe{justify-content:center;padding:5px 0}
.rahmen.schmal .stufe .schritt{display:none}
.rahmen.schmal .zeitblock .kalender{left:calc(100% + 8px)}

.kopftitel{font-size:12.5px;color:var(--muted);letter-spacing:-.01em}

/* ---- Verwaltungsseite (U-19) ---------------------------------------
   Links das Register, rechts genau eine Sache. Das Register sieht
   bewusst anders aus als die Hauptnavigation — es fuehrt innerhalb
   einer Seite, nicht zwischen Bereichen.                              */
.vw-seite{display:grid;grid-template-columns:236px 1fr;gap:26px;align-items:start}
.vw-register{display:flex;flex-direction:column;gap:2px;position:sticky;top:0}
.vw-register .leisten-titel{padding:0 0 9px}
.vw-register button{
  display:grid;grid-template-columns:1fr auto;gap:2px 10px;text-align:left;
  background:none;border:none;border-left:2px solid transparent;border-radius:0 8px 8px 0;
  padding:8px 12px;cursor:pointer;font-family:inherit;color:var(--muted);
}
.vw-register button .t{font-size:13px;font-weight:500}
.vw-register button .z{font-size:11px;color:var(--muted);align-self:center}
.vw-register button .e{grid-column:1/-1;font-size:11px;color:var(--muted);opacity:.75;line-height:1.35}
.vw-register button:hover{background:var(--soft);color:var(--ink)}
.vw-register button[aria-current="true"]{background:var(--soft);border-left-color:var(--accent);color:var(--ink)}
.vw-register button[aria-current="true"] .t{font-weight:700}
.vw-register button[aria-current="true"] .z{color:var(--accent);font-weight:600}
.vw-trenner{height:1px;background:var(--line);margin:10px 12px}

.vw-kopf{display:flex;flex-wrap:wrap;align-items:baseline;gap:10px;margin-bottom:16px}
.vw-kopf h2{font-size:19px;font-weight:600;letter-spacing:-.02em;width:100%}
.vw-kopf .meldung{flex:1;min-width:220px}
.vw-werkzeug{display:flex;gap:7px;margin-left:auto}
.vw-karte.schmal{max-width:520px}
/* .jahrliste und .jahrchip trugen die Budgetjahre als Marken. Mit U-22 hat
   jeder Jahrgang einen Knopf, und eine Marke kann nichts ausloesen — die
   Klassen werden von nirgends mehr gerufen (Quelltext und Pruefstaende
   nachgesehen) und sind am 18.08.2026 entfernt. Ersatz: .jahrzeile weiter
   unten. Zwei Bauplaene fuer dieselbe Liste heissen, dass eine Aenderung
   an der falschen landen kann. */

/* ---- Der Baum: Konto traegt Kategorie traegt Position ---------------
   Alle drei Ebenen teilen dasselbe Spaltenraster — die Einrueckung
   entsteht im Namensfeld, nicht durch verschobenes Polster. Sonst
   stehen Soll-Betrag und Positionszahl nicht untereinander.         */
.baum{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.knoten{display:grid;align-items:center;gap:12px;padding:0 var(--pad);position:relative;
  grid-template-columns:24px 30px 1fr 160px 170px 210px;min-height:34px}
.knoten .auf{background:none;border:none;color:var(--accent);cursor:pointer;font-size:10px;padding:4px;
  grid-column:1;justify-self:start}
.knoten .auf[aria-expanded="false"] .chev{display:inline-block;transform:rotate(-90deg)}
.knoten .nr{grid-column:2;font-size:11px;color:var(--muted)}
.knoten .name{grid-column:3;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.knoten .rolle{grid-column:4;font-size:11.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.knoten .zahl{grid-column:5;font-size:11.5px;color:var(--muted);text-align:right}
/* U-22: Die Werkzeuge liegen jetzt UEBER der Zeile statt in einer Spalte.
   Vier Knoepfe (umbenennen, ab-Jahr, ganz, loeschen) passen in keine
   Spaltenbreite, die den Namen noch lesbar liesse — und schon die drei
   davor schoben sich in die Positionszahl hinein, weil ein Rasterfeld
   seinen Inhalt nicht zurechtstutzt. Der eigene Hintergrund deckt ab, was
   darunter liegt; sichtbar ist der Streifen ohnehin nur auf der Zeile, auf
   der der Zeiger oder der Fokus steht.
   :focus-within stand hier bisher nicht — wer mit der Tastatur durch den
   Baum ging, landete auf Knoepfen, die er nicht sehen konnte.
   Die sechste Rasterspalte bleibt als Platzhalter stehen: sie haelt die
   Positionszahl dort, wo sie ohne Zeiger auch steht — ohne sie wanderten
   Zahlungsweg und Zahl an den rechten Rand und der Name zoege sich in die
   Breite. */
.knoten .zw{display:flex;gap:6px;justify-content:flex-end;align-items:center;opacity:0;
  position:absolute;right:var(--pad);top:1px;bottom:1px;padding-left:18px;background:var(--soft)}
.knoten:hover .zw,.knoten:focus-within .zw{opacity:1}
.knoten:hover,.knoten:focus-within{background:var(--soft)}

.knoten.n1{background:var(--soft);min-height:40px;border-top:1px solid var(--rule)}
.knoten.n1 .name{font-weight:700;font-size:13.5px}
.ast.konto:first-child .knoten.n1{border-top:none}

/* Ebene 2: der Klappknopf rutscht eine Spalte nach rechts, der Name bekommt Einzug. */
.knoten.n2{border-top:1px solid var(--hairline)}
.knoten.n2 .auf{grid-column:2}
.knoten.n2 .name{font-weight:600;color:var(--ink);padding-left:14px}

/* Ebene 3: kein Knopf, nur Einzug — und eine Linie, die zeigt, wo sie haengt. */
.knoten.n3{border-top:1px solid var(--hairline)}
.knoten.n3 .name{padding-left:30px}
.knoten.n3::before{content:'';position:absolute;left:calc(var(--pad) + 60px);top:0;bottom:0;
  width:1px;background:var(--line)}
.knoten.n3.leer{min-height:30px}
.knoten.n3.leer .meldung{grid-column:3;padding-left:30px}
.knoten.aus .name,.ast.aus > .knoten .name{color:var(--muted);text-decoration:line-through}

/* Eingeklappt: nur die Zeichen, der Rest weicht. */
.rahmen.schmal .seitenleiste{width:56px}
.rahmen.schmal .seitenleiste .tx,.rahmen.schmal .seiten-kopf .marke{display:none}
.rahmen.schmal .seiten-kopf{justify-content:center;padding:2px 0 12px}
.rahmen.schmal .falten{transform:rotate(180deg)}
.rahmen.schmal .bereiche > button,.rahmen.schmal .seiten-fuss > button{justify-content:center;padding:8px 0;gap:0}

/* Kennzahlen wandern in die Kopfzeile — die eigene Karte im Inhalt
   entfaellt damit in der Tabellenansicht (93 px gewonnen).            */
/* ---- Dashboard (U-5) -----------------------------------------------
   Oben zwei Karten nebeneinander: die eine sagt, was heute geht, die
   andere, warum. Darunter Kacheln im gleichen Raster wie ueberall. */
/* Beide Karten gleich breit — die Kante zwischen ihnen fluchtet mit der
   Mitte der Kachelreihe darunter. Ungleiche Breiten sahen aus, als haette
   die eine mehr zu sagen als die andere; sie sagen aber dasselbe, nur von
   zwei Seiten (U-14). */
.dash-oben{display:grid;grid-template-columns:1fr 1fr;gap:var(--gap);margin-bottom:26px;align-items:stretch}
.dash-oben > .karte{min-width:0}
.karte.hero{padding:16px var(--pad) 14px;display:flex;flex-direction:column;gap:12px;cursor:pointer}
.karte.hero:hover{border-color:var(--accent)}
.hero-zahl{display:flex;align-items:flex-end;gap:16px}
.hero-zahl .riesig{font-family:'IBM Plex Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums;
  font-size:58px;line-height:.95;font-weight:500;letter-spacing:-.02em}
.hero-zu{font-size:12.5px;color:var(--muted);line-height:1.45;padding-bottom:5px}
.hero-zu b{color:var(--ink);font-weight:600}
.zyklus{height:4px;background:var(--soft);border-radius:3px;overflow:hidden}
.zyklus > div{height:100%;background:var(--accent);opacity:.65}
.hero-fuss{display:flex;gap:34px;border-top:1px solid var(--line);padding-top:11px}
.hero-fuss .k{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.hero-fuss .gross2{font-size:17px;display:block;margin-top:1px}
.karte.rechenweg{padding:16px var(--pad) 14px;display:flex;flex-direction:column;gap:10px}
.karte.rechenweg .kennung{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.rechnung{display:flex;flex-direction:column;justify-content:center;flex:1}
.rechnung .zeile{display:flex;justify-content:space-between;gap:16px;font-size:12.5px;padding:3px 0;color:var(--muted)}
.rechnung .zeile.ergebnis{color:var(--ink);border-top:1px solid var(--line);margin-top:5px;padding-top:7px;font-weight:600}
.rechnung .zeile.teiler{color:var(--accent);border-top:1px dashed var(--rule);margin-top:5px;padding-top:7px;font-weight:600}
.kachel.kpi .spark{display:block;width:100%;height:34px;margin-top:9px;overflow:visible}
.kachel.kpi .spark polyline{fill:none;stroke:var(--accent);stroke-width:1.6;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.kachel.kpi .spark circle{fill:var(--accent)}
.kachel.kpi.warnung{border-color:#5a4433}
.kachel.kpi.warnung .spark polyline{stroke:var(--open)}
.kachel.kpi.warnung .spark circle{fill:var(--open)}
@media (max-width:1000px){ .dash-oben{grid-template-columns:1fr} }

.kachel.kpi{cursor:pointer;gap:9px}
.kachel.kpi .kennung{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.18em;
  text-transform:uppercase;color:var(--muted);display:block;margin-bottom:2px}
.kachel.kpi .name{background:none;border:none;color:var(--ink);font-family:inherit;font-size:14px;
  font-weight:600;letter-spacing:-.015em;padding:0;text-align:left;cursor:pointer}
.kachel.kpi .fuss{display:flex;align-items:center;gap:8px}
.kachel.kpi .fuss .meta{flex:1;font-size:11.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kachel.kpi .fuss .pfeil{color:var(--muted);font-size:15px}
.kachel.kpi:hover{border-color:var(--accent)}
.kachel.kpi:hover .fuss .pfeil{color:var(--accent)}
.herleitung-flaeche{border-top:1px solid var(--line);padding-top:11px}
.herleitung-flaeche .zeile{display:flex;justify-content:space-between;gap:20px;font-size:12.5px;padding:1.5px 0;color:var(--muted)}
.herleitung-flaeche .zeile.ergebnis{color:var(--ink);border-top:1px solid var(--line);margin-top:4px;padding-top:5px;font-weight:600}
table.klein.liste{width:100%;border-collapse:separate;border-spacing:0;font-size:12.5px}
table.klein.liste td{padding:7px 10px;border-bottom:1px solid var(--hairline)}
table.klein.liste td.n{text-align:right;font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums}
table.klein.liste tr{cursor:pointer}
table.klein.liste tr:hover td{background:var(--soft)}
.liq .wert .v.gross{font-size:26px}
.liq.dash{grid-template-columns:repeat(4,1fr);gap:20px}
.liq.dash .wert .z{margin-top:4px}

/* ===================================================================
   U-42 — Kopfzeile nach der Bildvorlage
   -------------------------------------------------------------------
   Die Zahlen standen bis hierher als gleichwertige Reihe nebeneinander:
   fuenf Werte, fuenf gleiche Schriftgroessen, und der wichtigste fiel
   nicht auf. Jetzt gibt es eine Hauptzahl und eine Reihe daneben — die
   Groessen und Farben sind aus «GÄPP Mockups.dc.html» uebernommen und
   nicht neu erfunden. Der senkrechte Strich trennt die Frage «was habe
   ich heute» von der Frage «wie steht der Monat».
   Die alten .wert-Regeln bleiben stehen: tafelKennzahlen() baut im
   Vollbild ein zweites, kleines Band mit denselben Bauteilen.
   =================================================================== */
.kopfband{display:flex;gap:26px;align-items:center}
.kopfband .lab{font:400 10.5px/1 'IBM Plex Mono',monospace;letter-spacing:.14em;
  text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.kopfband .kb-haupt .zahl{display:flex;align-items:baseline;gap:11px}
.kopfband .kb-haupt .gross{font:500 30px/1 'IBM Plex Mono',monospace;color:var(--ink);
  letter-spacing:-.02em}
.kopfband .kb-haupt .tag{font:400 13px/1 'IBM Plex Mono',monospace;color:var(--accent)}
.kopfband .kb-haupt .bis{font:400 12px/1 'Space Grotesk',sans-serif;color:var(--muted)}
.kopfband .kb-strich{width:1px;align-self:stretch;background:var(--line)}
.kopfband .kb-werte{display:flex;gap:28px}
.kopfband .kb-werte .lab{margin-bottom:7px}
.kopfband .kb-werte .v{font:500 18px/1 'IBM Plex Mono',monospace;color:#c3ccd6}
.kopfband .kb-werte .v .zu{font-size:10.5px;color:#757f8c;margin-left:7px}
.kopfband .kb-werte .v.ok{color:var(--accent)}
.kopfband .kb-werte .v.err{color:var(--err)}
.kopfband .kb-knopf{background:none;border:0;padding:0;cursor:pointer;color:inherit;
  font:inherit;border-bottom:1px dotted rgba(240,160,141,.5)}
.kopfband .kb-knopf:hover{color:#fff;border-bottom-color:#fff}
/* Eng wird zuerst die Reihe rechts beschnitten, nie die Hauptzahl. */
@media (max-width:1250px){ .kopfband .kb-werte .leise{display:none} }
@media (max-width:1000px){ .kopfband .kb-strich,.kopfband .kb-haupt .bis{display:none} }

.kopfband .wert{display:flex;align-items:baseline;gap:7px}
.kopfband .wert .k{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.kopfband .wert .v{font-size:15px}
.kopfband .wert .z{font-size:11px;color:var(--muted)}
@media (max-width:1100px){ .kopfband .wert.leise{display:none} }

.inhalt{flex:1 1 auto;min-height:0;display:flex;flex-direction:column}
/* Kacheln: die Seite rollt. Tabellen: die Seite steht, nur die Tabelle rollt. (A-15) */
.inhalt[data-modus="kacheln"]{overflow-y:auto;overflow-x:hidden;padding:var(--edge)}
.inhalt[data-modus="tabellen"]{overflow:hidden;padding:var(--edge) var(--edge) 0}

.fusszeile{flex:0 0 auto;padding:9px var(--edge);border-top:1px solid var(--line);background:var(--card);display:flex;align-items:center;gap:14px}
.motto{color:var(--accent);font-weight:600;letter-spacing:.03em;font-size:12.5px}
.fusszeile .hinweis{color:var(--muted);font-size:11.5px;margin-left:auto}

/* ===================================================================
   KACHELN
   =================================================================== */
.liq-karte{margin-bottom:var(--gap)}
.sektion{margin-bottom:26px}
.sektion > h2{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin:0 0 10px;display:flex;align-items:center;gap:10px}
.sektion > h2::after{content:'';flex:1;height:1px;background:var(--line);order:9}
.sektion > h2 .h2-wert{color:var(--ink);letter-spacing:0;font-size:14px;font-weight:600}
.sektion > h2 .h2-zu{color:var(--muted);letter-spacing:0;font-size:11.5px;text-transform:none;font-weight:400}
.untertitel{font-size:12px;font-weight:500;color:var(--muted);margin:0 0 8px;display:flex;gap:10px;align-items:baseline}
.untertitel .num{color:var(--err)}
/* U-54: Der Klappkopf «Bezahlt» — Form 6 in der Gestalt der Zwischen-
   ueberschrift. Kein neues Bauteil, ein Knopf um ein vorhandenes. */
.untertitel.klapp{background:none;border:0;font:inherit;font-size:12px;font-weight:500;
  color:var(--muted);cursor:pointer;padding:2px 0;width:100%;margin:16px 0 8px}
.untertitel.klapp:hover{color:var(--ink)}
.untertitel.klapp .chev{color:var(--accent);font-size:10px;flex:0 0 12px;text-align:left}
.untertitel.klapp .num{color:var(--muted)}
/* U-53: Die Gruppe der ueberfaelligen traegt Rot — sie ist die eine Stelle,
   an der die Tafel selbst etwas meldet. */
.untertitel.spaetkopf{color:var(--err)}
/* Ein Gruppenkopf braucht Luft nach oben, sonst klebt er an den Kacheln der
   Gruppe darueber und liest sich als deren Fusszeile. Der erste nicht — er
   steht schon unter dem Tafelkopf. */
.untertitel.rkopf{margin:18px 0 9px}
.rollflaeche > .untertitel.rkopf:first-child{margin-top:4px}
/* U-54: Bezahltes faellt um einen Rang (Formensprache H) und verschwindet
   nicht. Keine zweite Kachelgroesse — dieselbe Kachel, leiser. */
.kachel.erledigt .name,.kachel.erledigt .mitte .v,.kachel.erledigt .mitte .v.neg{color:var(--muted)}
/* U-53: Eine ueberfaellige Rechnung sagt es in ihrem Label, nicht in der Zahl —
   die Zahl traegt das Vorzeichen und sonst nichts (Formensprache F). */
.kachel.spaet .mitte .k{color:var(--err)}
.raster{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:var(--gap)}

/* ===================================================================
   KACHEL — der geschlossene Zustand. Zeigt vier Dinge und sonst nichts.
   Gearbeitet wird im Blatt, das aus der Kachel aufgeht.
   Gleiche Anatomie fuer Konto, Schuld, Sparziel und Reserve. (G-1)
   =================================================================== */
.kachel{
  padding:14px var(--pad) 12px;
  display:flex;flex-direction:column;gap:11px;
  cursor:pointer;transition:border-color .12s;
}
.kachel:hover{border-color:var(--rule)}
.kachel .kennung{
  font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.kachel .name{
  display:block;background:none;border:none;padding:0;margin-top:2px;text-align:left;
  font-family:inherit;font-weight:600;letter-spacing:-.015em;font-size:18px;line-height:1.25;
  color:var(--ink);cursor:pointer;
}
.kachel .name:hover{color:var(--accent)}
.kachel .name:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:4px}
.kachel .rolle{font-size:12.5px;color:var(--muted);margin-top:1px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kachel .mitte{flex:1 1 auto}
.kachel .mitte .balken{margin-top:10px}
.kachel .fuss{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  border-top:1px solid var(--line);padding-top:10px;
}
.kachel .fuss .meta{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.liq{display:grid;grid-template-columns:repeat(3,auto) 1fr;gap:34px;align-items:start}
.liq .herleitung{border-left:1px solid var(--line);padding-left:18px}
.liq .herleitung .zeile{display:flex;justify-content:space-between;gap:20px;font-size:12.5px;padding:1.5px 0;color:var(--muted)}
.liq .herleitung .zeile.ergebnis{color:var(--ink);border-top:1px solid var(--line);margin-top:4px;padding-top:5px;font-weight:600}
.liq-schmal{display:flex;gap:30px;align-items:center;padding:11px var(--pad);flex:0 0 auto;margin-bottom:var(--gap)}
.liq-schmal .wert .v{font-size:17px}

/* Masken */
.maske{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.maske .voll{grid-column:1/-1}
.feld{display:flex;flex-direction:column;gap:3px}
.feld label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.feld input,.feld select,.feld textarea{
  background:var(--bg);border:1px solid var(--line);border-radius:var(--radius-sm);color:var(--ink);
  padding:7px 9px;font-family:inherit;font-size:13px;width:100%;
}
.feld input.num{font-family:'IBM Plex Mono',monospace;text-align:right}
.feld input:focus,.feld select:focus{outline:none;border-color:var(--accent)}
.feld > .schalter{align-self:flex-start}
.feld.haken{flex-direction:row;align-items:center;gap:8px}
.feld.haken input{width:auto;accent-color:var(--accent)}
.feld.haken label{text-transform:none;letter-spacing:0;font-size:12.5px;color:var(--ink)}
.wk-block{border-left:2px solid var(--line);padding-left:12px;margin-top:2px}
.maske .aktion{grid-column:1/-1;display:flex;gap:8px;align-items:center;margin-top:3px}
.maske .hint{font-size:11.5px;color:var(--muted);margin-left:auto;text-align:right}

/* Journal */
.journal{width:100%;border-collapse:collapse;font-size:12.5px}
.journal th{text-align:left;font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:500;padding:0 6px 6px;border-bottom:1px solid var(--line)}
.journal th.r,.journal td.r{text-align:right}
.journal td{padding:5px 6px;border-bottom:1px solid var(--line)}
.journal tr:last-child td{border-bottom:none}
.journal tbody tr[data-jz]{cursor:pointer}
.journal tbody tr:hover{background:var(--soft)}
.journal .tag{font-family:'IBM Plex Mono',monospace;color:var(--muted);font-size:12px}
.journal .marke-um{font-size:11px;color:var(--muted);margin-left:6px}
.journal .jz-in{background:var(--bg);border:1px solid var(--accent);border-radius:5px;color:var(--ink);font-family:inherit;font-size:12.5px;padding:2px 5px;width:100%}
.verlauf{height:150px;width:100%}

/* ===================================================================
   TABELLEN
   =================================================================== */
.tabellenkopf{display:flex;align-items:flex-end;gap:20px;flex:0 0 auto;margin-bottom:var(--gap)}
.tafel{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;position:relative}
.tafel-kopf{display:flex;align-items:center;gap:10px;padding:13px var(--pad) 0;flex:0 0 auto}
.tafel-kopf .titel{font-size:15px;font-weight:600;letter-spacing:-.015em;margin-right:auto}
.tafel > .filterzeile{padding:11px var(--pad) 10px;flex:0 0 auto}
.rollflaeche{flex:1 1 auto;min-height:0;overflow:auto;border-radius:0 0 var(--radius) var(--radius)}

table.gross{border-collapse:separate;border-spacing:0;width:max-content;min-width:100%;font-size:12.5px}
/* U-4: die Streckung uebernimmt jetzt spaltenbreiten() */
table.gross th,table.gross td{padding:0 8px;height:var(--row);white-space:nowrap}
table.gross .n{text-align:right;font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;font-size:12px}
table.gross .t{text-align:left}
table.gross th.n,table.gross td.n,table.gross td.bearbeitbar{min-width:78px;max-width:78px}
/* U-43: Die Namensspalte hatte kein max-width. Bei wenigen Zeitspalten ist die
   Tabelle schmaler als das Fenster, min-width:100% streckt sie — und die
   einzige Zelle ohne Deckel nahm die ganze Differenz. Daher die 590 Pixel
   breite Bezeichnungsspalte. */
table.gross th:first-child,table.gross td:first-child:not([colspan]){
  min-width:var(--w1);max-width:var(--w1);width:var(--w1)}
table.gross.t-verbind th:first-child,table.gross.t-verbind td:first-child:not([colspan]){
  min-width:var(--w1);max-width:var(--w1)}
table.gross th:last-child,table.gross td:last-child{min-width:94px;max-width:94px}

/* Kopfzeilen gestapelt und fixiert — bis und mit «Saldo kumuliert» (A-36) */
table.gross thead th,table.gross thead td{position:sticky;background:var(--sheet);z-index:20}
table.gross thead tr.zeile-titel th{top:0;height:38px;font-weight:600;text-align:left;letter-spacing:-.01em;border-bottom:1px solid var(--rule)}
table.gross thead tr.zeile-titel th.n{text-align:right;font-weight:500;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.05em}
table.gross thead tr.zeile-titel th.t{font-weight:500;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.05em}
table.gross thead tr.zeile-saldo td{top:38px;color:var(--muted);font-size:11.5px}
table.gross thead tr.zeile-auswahl td{top:90px}
table.gross thead tr.zeile-kum td{top:64px;color:var(--muted);font-size:11.5px;font-weight:600}
/* Die Antwort auf «wie viel habe ich dann» — die lauteste Zeile im Kopf. */
table.gross thead tr.zeile-frei td{top:98px;color:var(--ink);font-size:12.5px;font-weight:700;
  box-shadow:inset 0 -2px 0 var(--rule)}
table.gross thead tr.zeile-frei td:first-child{letter-spacing:-.01em}

/* Fixierte Spalten: Bezeichnung, Zahlung, Soll bleiben beim Rollen nach rechts stehen (A-36).
   Frueher waren es fuenf — Fällig und Zahlungsart sind zu einer Spalte verschmolzen,
   das Konto steht nur noch einmal im Kategoriekopf. */
table.fixiert th:nth-child(-n+3),table.fixiert td:nth-child(-n+3){position:sticky;background:var(--card);z-index:15}
table.fixiert thead th:nth-child(-n+3),table.fixiert thead td:nth-child(-n+3){background:var(--sheet);z-index:30}
table.fixiert th:nth-child(1),table.fixiert td:nth-child(1){left:0;                          min-width:var(--w1);max-width:var(--w1)}
table.fixiert th:nth-child(2),table.fixiert td:nth-child(2){left:var(--w1);                  min-width:var(--w2);max-width:var(--w2)}
table.fixiert th:nth-child(3),table.fixiert td:nth-child(3){left:calc(var(--w1) + var(--w2));min-width:var(--w3);max-width:var(--w3);
  border-right:1px solid var(--rule)}
table.fixiert tbody td:nth-child(-n+2){overflow:hidden;text-overflow:ellipsis}
.t-verbind{--w2:96px;--w3:78px}
/* Rechnungen passen ohne Rollen — hier fixiert nichts, sonst reisst die Tabelle auseinander. */
.t-rechnung th.n,.t-rechnung td.n{min-width:98px;max-width:98px}
.t-rechnung th:last-child,.t-rechnung td:last-child{min-width:130px;max-width:130px}

/* ---- Zeilentypen und ihr Rang ----------------------------------------
   Die Masse ist leise, die drei Merkpunkte sind laut:
   der Name (Anker), das Soll (Referenz), die Jahresspalte (Ergebnis).
   Dazwischen darf das Auge ausruhen.                                     */
tr.zeile-daten > td{border-bottom:1px solid var(--hairline)}
table.gross tr.zeile-daten:hover > td{background:var(--soft)}
tr.zeile-daten td.n,tr.zeile-daten td.bearbeitbar input{color:var(--muted)}
tr.zeile-daten td:nth-child(3),tr.zeile-daten td:nth-child(3) input,
tr.zeile-daten td:last-child{color:var(--ink)}
tr.zeile-daten:hover td.n,tr.zeile-daten:hover td.bearbeitbar input{color:var(--ink)}
td.bearbeitbar input:focus{color:var(--ink)}
td.zahlung{font-size:11.5px;color:var(--muted)}

tr.zeile-kat > td{background:var(--soft);font-weight:600;letter-spacing:-.01em;
  border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
tr.zeile-sub > td{background:#1b2531;font-weight:600;font-size:12px;
  border-top:1px solid var(--rule);border-bottom:1px solid var(--hairline)}
tr.zeile-sub td.n{color:var(--muted)}
tr.zeile-summe > td{border-top:1px solid var(--rule);font-weight:600;font-size:12px}
tr.zeile-summe > td:first-child{padding-left:24px;color:var(--muted)}
tr.zeile-gesamt > td{border-top:2px solid var(--accent);font-weight:700;height:36px}
tr.zeile-daten td:first-child{padding-left:24px}
tr.zeile-daten.tief td:first-child{padding-left:38px}
/* Luft vor jeder Gruppe — sonst kleben Kategorie, Zeilen und Summe aneinander */
tr.zeile-luft > td{height:13px;padding:0}
tr.zugeklappt{display:none}
td.klappzelle{position:relative;padding-left:12px}
td.namenszelle{position:relative}
td.namenszelle .nz{display:block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Die Spalte des laufenden Monats — angedeutet, nicht angestrichen.
   Ueber sechzig Zeilen wird aus einem kraeftigen Block sonst ein Balken. */
table.gross th.jetzt,table.gross td.jetzt{background:#16212a}
tr.zeile-kat > td.jetzt{background:#1e2e33}
tr.zeile-sub > td.jetzt{background:#1c2a30}
table.gross tr.zeile-daten:hover > td.jetzt{background:#22323a}
table.gross thead th.jetzt,table.gross thead td.jetzt{background:#17232b;color:var(--accent)}

/* Zeilenwerkzeuge: da, wo sie wirken — sichtbar, sobald der Zeiger
   oder der Fokus die Zeile erreicht. Gleiche Regel fuer beide. */
.kat-add,.zeile-weg{
  position:absolute;right:9px;top:50%;transform:translateY(-50%);
  background:var(--card);border:1px solid var(--line);border-radius:5px;color:var(--muted);
  cursor:pointer;font-family:inherit;font-size:10.5px;padding:2px 8px;opacity:0;
}
.kat-add:hover,.zeile-weg:hover{color:var(--accent);border-color:var(--accent)}
tr.zeile-daten:hover .zeile-weg,.zeile-weg:focus,
tr.zeile-kat:hover .kat-add,tr.zeile-sub:hover .kat-add,.kat-add:focus{opacity:1}

/* ---- U-28: der Griff zum Umordnen -----------------------------------
   Dieselbe Regel wie beim Ausblenden-Knopf daneben: unsichtbar, bis der
   Zeiger oder der Fokus die Zeile erreicht. Er sitzt links im Polster
   der Namensspalte — dort ist Platz, den nichts anderes braucht, und er
   ist der Ort, an dem eine Greifleiste erwartet wird.
   Gezeichnet wird er aus einem Verlauf statt aus einem Schriftzeichen:
   ein Braille- oder Punktezeichen haengt an der Schrift, und in dieser
   App ist die Schrift eine geladene. Drei Striche sind drei Striche. */
.zeilengriff{
  position:absolute;left:5px;top:50%;transform:translateY(-50%);
  width:15px;height:17px;border:1px solid transparent;border-radius:4px;
  cursor:grab;opacity:0;display:block;
}
.zeilengriff::before{
  content:'';position:absolute;left:3px;right:3px;top:4px;height:7px;
  background:repeating-linear-gradient(to bottom,var(--muted) 0 1px,transparent 1px 3px);
}
.zeilengriff:hover{border-color:var(--accent)}
.zeilengriff:hover::before{background:repeating-linear-gradient(to bottom,var(--accent) 0 1px,transparent 1px 3px)}
.zeilengriff:focus{opacity:1;outline:1px solid var(--accent);outline-offset:1px}
tr.zeile-daten:hover .zeilengriff{opacity:1}
/* Im Baum gibt es keine Polsterspalte — der Griff steht rechts der
   Fuehrungslinie, im Einzug des Namens, und damit an derselben Stelle
   relativ zur Position wie in der Tabelle. */
.zeilengriff.imbaum{left:calc(var(--pad) + 66px);width:14px;height:16px}
.knoten.n3:hover .zeilengriff{opacity:1}

/* Beim Ziehen: die genommene Zeile tritt zurueck, die Ziellinie sagt, wo
   sie landet. Die Linie ist ein Innenschatten und KEIN Rahmen — ein
   Rahmen wuerde die Zeile um zwei Pixel hoeher machen, und die Tabelle
   zappelte bei jedem Wechsel des Ziels. */
body.zieht-zeile,body.zieht-zeile *{cursor:grabbing !important;user-select:none}
tr.zeile-daten.zieht-mich > td,.knoten.n3.zieht-mich{opacity:.45}
tr.zeile-daten.zieh-vor > td{box-shadow:inset 0 2px 0 0 var(--accent)}
tr.zeile-daten.zieh-nach > td{box-shadow:inset 0 -2px 0 0 var(--accent)}
.knoten.n3.zieh-vor{box-shadow:inset 0 2px 0 0 var(--accent)}
.knoten.n3.zieh-nach{box-shadow:inset 0 -2px 0 0 var(--accent)}

/* U-35: Die Kontenliste der Verwaltung. Kein eigenes Aussehen, sondern die
   vw-Liste mit einer Polsterspalte links fuer den Griff — dieselben
   Abstaende, dieselben Knoepfe, dieselbe Ziellinie wie in Tabelle und Baum
   (G-1). Der Block ist der Bereich: gezogen wird innerhalb von «Konten»
   oder innerhalb von «Reserve», nie darueber hinweg. */
.vw-kontenblock{margin-bottom:calc(var(--gap) + 4px)}
.vw-kontenblock:last-child{margin-bottom:0}
.vw-blockkopf{font-size:12.5px;font-weight:600;letter-spacing:-.01em;
  display:flex;align-items:baseline;gap:8px;margin-bottom:6px}
.vw-blockfuss{height:1px}
/* Zwei Klassen an derselben Stelle, damit diese Regel die allgemeine
   .vw-liste-Regel schlaegt — die steht weiter unten im Stylesheet und
   setzt padding auf «5px 0». Gleiche Spezifitaet verlaere hier. */
.vw-liste.vw-kontenliste .z{position:relative;padding-left:26px}
.vw-kontenliste .z .nr{color:var(--muted);min-width:24px}
.vw-kontenliste .z .n{flex:0 1 auto;max-width:260px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.vw-kontenliste .z .rolle{color:var(--muted);flex:1;min-width:0;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.vw-kontenliste .z .zahl{min-width:90px;text-align:right}
.vw-kontenliste .z .zeilengriff{left:3px}
.vw-kontenliste .z:hover .zeilengriff{opacity:1}
.vw-kontenliste .z.zieht-mich{opacity:.45}
.vw-kontenliste .z.zieh-vor{box-shadow:inset 0 2px 0 0 var(--accent)}
.vw-kontenliste .z.zieh-nach{box-shadow:inset 0 -2px 0 0 var(--accent)}

/* Zellen */
td.bearbeitbar{padding:0;position:relative}
td.bearbeitbar input{
  width:100%;height:100%;background:none;border:none;color:inherit;
  font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;font-size:12px;
  text-align:right;padding:0 8px;
}
td.bearbeitbar input:focus{outline:1px solid var(--accent);outline-offset:-1px;background:var(--bg)}
/* U-11: Der Platzhalter «0.00» stand frueher in jeder leeren Zelle und war
   Rauschen. Ganz weg war er aber auch falsch — dann sieht man einem leeren
   Feld nicht mehr an, dass es eines ist. Jetzt erscheint er, sobald Zeiger
   oder Fokus die Zeile erreichen: ruhig im Ueberblick, sichtbar beim Arbeiten. */
td.bearbeitbar input::placeholder{color:transparent}
tr:hover td.bearbeitbar input::placeholder,
td.bearbeitbar input:focus::placeholder{color:#4a4a4a}
tr:hover td.bearbeitbar{box-shadow:inset 0 0 0 1px var(--rule)}
tr:hover td.bearbeitbar:hover{box-shadow:inset 0 0 0 1px var(--muted)}
/* Ein gespiegeltes Soll sieht anders aus als ein gepflegtes — sonst
   sucht man die Eingabestelle dort, wo es keine gibt (U-8). */
td.n.gespiegelt-wert{font-style:italic;color:var(--muted);cursor:help}
.klappkopf{max-width:calc(var(--w1) - 46px)}
td.markiert{box-shadow:inset 0 0 0 1px var(--accent)}

/* ---- Gefaltete Spalten (U-2) ---------------------------------------
   Kein Loch, sondern eine schmale Klappe: sie zeigt, dass dort etwas
   liegt, und macht mit einem Klick wieder auf.                        */
th.faltkopf{cursor:pointer;background:var(--soft) !important;border-left:1px solid var(--rule);border-right:1px solid var(--rule)}
th.faltkopf span{
  display:block;writing-mode:vertical-rl;transform:rotate(180deg);
  font-size:8.5px;letter-spacing:0;color:var(--muted);text-transform:uppercase;
  margin:0 auto;line-height:28px;height:38px;overflow:hidden;
}
th.faltkopf:hover span{color:var(--accent)}
td.faltzelle{background:rgba(255,255,255,.014)}

/* ---- Gefaltete Zeilen (U-23) ----------------------------------------
   Waagrecht dasselbe Bild wie die Faltspalte senkrecht: eine schmale,
   leise Klappe, die zeigt, dass dort etwas liegt. Sie steht bewusst
   niedriger als eine Datenzeile — was sie verbirgt, ist nichts.       */
tr.zeile-leerfalt > td{height:24px;background:rgba(255,255,255,.014);
  border-bottom:1px solid var(--hairline)}
tr.zeile-leerfalt > td:first-child{padding-left:24px}
.leerfalt{background:none;border:none;border-radius:5px;color:var(--muted);cursor:pointer;
  font-family:inherit;font-size:11px;padding:2px 7px;max-width:100%;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap;text-align:left}
.leerfalt::before{content:'▸ ';color:var(--rule)}
.leerfalt:hover{color:var(--accent);background:var(--soft)}
tr.zeile-kat > td.faltzelle,tr.zeile-sub > td.faltzelle{background:rgba(255,255,255,.03)}

/* ---- Lesehilfe ueber viele Spalten (U-3) ---------------------------
   Bei dreizehn Zahlenspalten verliert das Auge die Zeile. Ein sehr
   leiser Streifen alle zwei Zeilen fuehrt es zurueck, ohne ein Gitter
   zu bauen. Die Kopfzeilen bleiben schmaler als die Datenzeilen.      */
tr.zeile-daten.gerade > td{background:rgba(255,255,255,.026)}
table.gross tr.zeile-daten.gerade:hover > td{background:var(--soft)}
tr.zeile-daten.gerade > td.jetzt{background:#2f2b25}
table.gross thead tr.zeile-saldo td,table.gross thead tr.zeile-kum td{height:26px}
table.gross thead tr.zeile-kum td{box-shadow:inset 0 -2px 0 var(--rule)}
/* U-12: Ist eine Auswahl aktiv, steht ihre Summe direkt unter den Salden.
   Wer einen Wert tippt, sieht beide sofort mitgehen — das ist der Zweck
   des Filters, nicht das Ausblenden. */
table.gross thead tr.zeile-auswahl td{height:28px;color:var(--accent);font-weight:700;font-size:12px;
  box-shadow:inset 0 -2px 0 var(--accent)}
table.gross thead tr.zeile-auswahl td:first-child{letter-spacing:-.01em}
table.gross thead tr.zeile-auswahl td .muted{font-weight:400;font-size:10.5px;margin-left:7px;color:var(--muted)}
/* Der Zahlungsweg steht ab hier nur noch klein unter der Bezeichnung,
   sobald die eigene Spalte zu teuer wird. */
td.namenszelle .weg{display:none;font-size:10.5px;color:var(--muted);margin-left:7px}

.kopfwerkzeug{display:inline-flex;position:relative}
/* Die Kategorien liegen als Klappe ueber der Tafel, statt eine eigene
   Zeile zu belegen (45 px gewonnen). */
.tafel > .filterzeile{position:absolute;top:44px;left:var(--pad);right:var(--pad);z-index:40;
  background:var(--sheet);border:1px solid var(--rule);border-radius:var(--radius-sm);
  box-shadow:0 18px 44px -14px rgba(0,0,0,.85);padding:10px 12px}
.sprung{
  position:absolute;top:calc(100% + 5px);right:0;width:236px;max-height:330px;overflow-y:auto;
  background:var(--sheet);border:1px solid var(--rule);border-radius:var(--radius-sm);
  box-shadow:0 18px 44px -14px rgba(0,0,0,.85);z-index:70;padding:5px;
}
.sprung button{display:block;width:100%;text-align:left;background:none;border:none;color:var(--muted);padding:6px 9px;cursor:pointer;font-family:inherit;font-size:12px;border-radius:6px}
.sprung button:hover{background:var(--soft);color:var(--ink)}
.sprung button.unter{padding-left:22px;font-size:11.5px}

/* ===================================================================
   BLATT
   =================================================================== */
/* U-17 */
.dialog-hg{position:fixed;inset:0;background:rgba(0,0,0,.62);z-index:120;display:flex;
  align-items:center;justify-content:center;padding:24px}
.dialog{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--radius);
  width:100%;max-width:430px;box-shadow:0 30px 70px -20px #000}
.dialog-kopf{padding:15px var(--pad) 0}
.dialog-kopf h2{font-size:16px;font-weight:600;letter-spacing:-.015em}
.dialog-koerper{padding:12px var(--pad) var(--pad);display:flex;flex-direction:column;gap:12px}
.dialog-fuss{display:flex;gap:8px;justify-content:flex-end;padding:13px var(--pad);border-top:1px solid var(--line)}
/* U-26: Die Dokumentzeile im Schuldblatt. Verweise sind Marken, kein
   Fliesstext — sonst liest man ueber sie hinweg, und genau dort sucht
   man sie, wenn man eine Zahlung erfasst.
   U-27: Sie ist zum Wegweiser geworden. Gepflegt wird im Reiter, hier
   steht nur noch, was da ist. */
.dokzeile{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:9px;
  padding-top:9px;border-top:1px solid var(--hairline)}
.dokmarke{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.dokchip{display:inline-flex;align-items:center;gap:2px;border:1px solid var(--rule);
  border-radius:999px;padding:2px 4px 2px 11px;font-size:12px}
.dokchip:hover{border-color:var(--accent)}
.dokchip a{color:var(--ink);text-decoration:none}
.dokchip a:hover{color:var(--accent)}
.dokchip a::before{content:'↗';font-size:10px;color:var(--muted);margin-right:5px}
.dokweg{background:none;border:none;color:var(--muted);cursor:pointer;font-size:13px;
  line-height:1;padding:2px 5px;border-radius:999px}
.dokweg:hover{color:var(--err);background:var(--soft)}
.dokbelegmarke{font-size:11.5px;color:var(--muted);padding-left:9px;
  border-left:2px solid var(--rule)}
/* U-27 — der Reiter «Dokumente». Eine Liste, kein Marken-Gedraenge: hier ist
   Platz, und wer hier steht, will die ganze Adresse sehen, nicht drei
   abgeschnittene Chips nebeneinander. */
.dokliste{display:flex;flex-direction:column;gap:0;margin:2px 0 0}
.dokeintrag{display:flex;align-items:baseline;gap:10px;padding:9px 2px;
  border-bottom:1px solid var(--hairline)}
.dokeintrag:first-child{border-top:1px solid var(--hairline)}
.dokeintrag .dokna{flex:1 1 auto;min-width:0}
.dokeintrag .dokna b{font-size:13.5px;font-weight:600;display:block}
.dokeintrag .dokadr{display:block;font-size:11.5px;color:var(--muted);
  font-family:'IBM Plex Mono',monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dokeintrag .dokwerk{flex:0 0 auto;display:flex;gap:6px;align-items:center}
/* Der abgelegte Beleg ist KEIN Verweis (siehe Kommentar bei dokReiterHtml).
   Der Unterschied muss man sehen, nicht lesen: eigener Kasten, eigene
   Marke, keine Zeile in der Verweisliste. */
.dokbeleg{display:flex;align-items:baseline;gap:10px;margin:2px 0 16px;padding:11px 13px;
  border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--soft)}
.dokbeleg .dokna{flex:1 1 auto;min-width:0}
.dokbeleg .dokna b{font-size:13.5px;font-weight:600;display:block}
.dokbeleg .dokadr{display:block;font-size:11.5px;color:var(--muted)}
.dokbeleg .dokwerk{flex:0 0 auto}
.dokgruppe{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);
  margin:18px 0 6px}
.dokgruppe:first-child{margin-top:2px}
/* Die Erfassung steht UNTER der Liste und ist immer offen — kein Knopf,
   der erst ein Formular aufklappt. Zwei Felder rechtfertigen keinen Klick
   davor, und ein aufgeklapptes Feld erinnert daran, dass man etwas
   hinterlegen kann. */
.dokneu{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap;margin-top:14px;
  padding-top:13px;border-top:1px solid var(--line)}
.dokneu .feldchen{display:flex;flex-direction:column;gap:4px}
.dokneu .feldchen.breit{flex:1 1 260px;min-width:0}
.dokneu label{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.dokneu input{background:var(--bg);border:1px solid var(--rule);border-radius:var(--radius-sm);
  color:var(--ink);font-family:inherit;font-size:12.5px;padding:7px 9px;width:100%}
.dokneu input:focus{outline:none;border-color:var(--accent)}
.dlg-lead{font-size:13px;color:var(--muted)}
.dlg-lead b{color:var(--ink);font-size:15px}
.dlg-zeile{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.dlg-zeile .jahr{color:var(--muted);font-size:13px}
.dlg-zeile label{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted)}
.dlg-zeile select{background:var(--bg);border:1px solid var(--rule);border-radius:var(--radius-sm);
  color:var(--ink);font-family:inherit;font-size:13px;padding:6px 9px;cursor:pointer}
.dlg-zeile select:focus{outline:1px solid var(--accent);outline-offset:-1px}
.dlg-haken{display:flex;align-items:flex-start;gap:9px;font-size:12.5px;color:var(--ink);
  border-top:1px solid var(--line);padding-top:12px;cursor:pointer}
.dlg-haken input{accent-color:var(--accent);margin-top:1px}
/* U-22: die Aufstellung vor einer Kaskade. Sie steht als Liste da, nicht als
   Satz — «3 Buchungen, 1 Rechnung, Budgetwerte in 4 Jahren» ueberliest man,
   untereinander zaehlt man es. */
.dlg-liste{list-style:none;display:flex;flex-direction:column;gap:3px;
  border-left:2px solid var(--accent);padding-left:11px}
.dlg-liste li{font-size:13px;color:var(--ink)}
.dlg-warnung{font-size:12px;line-height:1.5;color:var(--err);
  border-top:1px solid var(--line);padding-top:11px}
.dlg-warnung b{font-weight:600}
.blatt-hg{position:fixed;inset:0;background:rgba(0,0,0,.62);z-index:100;display:flex;align-items:center;justify-content:center;padding:30px}
.blatt{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--radius);width:100%;max-width:780px;max-height:100%;display:flex;flex-direction:column;box-shadow:0 30px 70px -20px #000}
.blatt.weit{max-width:940px}
.blatt:focus{outline:none}
.blatt .reiter button:focus-visible,.kachel .knopf:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:5px}
.blatt-kopf{padding:15px var(--pad);border-bottom:1px solid var(--line)}
.blatt-kopf.mitreiter{border-bottom:none;padding-bottom:9px}
.blatt-kopf .kennung{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:3px}
.blatt-kopf h2{font-size:16px;font-weight:600;letter-spacing:-.015em}
.blatt-kopf.mitreiter h2{font-size:22px}
.blatt > .reiter{padding:0 var(--pad);border-bottom:1px solid var(--line);gap:18px;flex:0 0 auto}
.blatt-koerper{padding:var(--pad);overflow-y:auto}
.blatt.weit .blatt-koerper{min-height:352px}
.blatt .verlauf{height:300px}
/* U-22: Das Zeilenblatt nimmt verlaufSvg() aus den Berichten, und die setzt
   die Klasse `ber-verlauf` — die Regel darueber greift also NICHT. Gut so:
   `ber-verlauf` traegt width:100%;height:auto und behaelt damit das
   Seitenverhaeltnis des viewBox (720 : hoehe). Ohne Deckel waere die Kurve im
   weiten Blatt hoeher als im schmalen, obwohl sie dieselben Zahlen zeigt;
   bei 720px ist sie genau so hoch, wie der Aufruf es sagt. */
.blatt .ber-verlauf{max-width:720px;margin-inline:auto}
.blatt-fuss{display:flex;gap:8px;justify-content:flex-end;padding:13px var(--pad);border-top:1px solid var(--line)}

.wahlliste{display:grid;gap:8px}
.wahlliste label{display:flex;gap:11px;align-items:flex-start;padding:11px 13px;border:1px solid var(--line);border-radius:var(--radius-sm);cursor:pointer}
.wahlliste label:hover{border-color:var(--rule);background:var(--soft)}
.wahlliste input{margin-top:3px;accent-color:var(--accent)}
.wahlliste .bez{font-weight:600;font-size:13.5px;display:block}
.wahlliste .erl{font-size:12px;color:var(--muted);display:block}
.ablegeflaeche{border:1px dashed var(--rule);border-radius:var(--radius);padding:26px;text-align:center;color:var(--muted);font-size:13px}
.notiz{font-size:12px;color:var(--muted);line-height:1.55}
.notiz b{color:var(--ink);font-weight:600}

/* Auf schmalen Bildschirmen bleibt nur die Bezeichnung stehen — sonst sieht man keine Zahl (A-81) */
@media (max-width:900px){
  table.gross th:nth-child(n+2),table.gross td:nth-child(n+2){position:static;left:auto}
  table.gross th:nth-child(1),table.gross td:nth-child(1){min-width:170px;max-width:170px;border-right:1px solid var(--rule)}
  table.gross th:nth-child(3),table.gross td:nth-child(3){border-right:none}
  /* Die beschreibende Spalte weicht — sonst steht am Anfang keine Zahl im Bild */
  .t-budget th:nth-child(2),.t-budget td:nth-child(2),
  .t-verbind th:nth-child(2),.t-verbind td:nth-child(2){display:none}
  /* Auf dem Telefon wird gelesen, nicht umgebaut */
  .kat-add,.zeile-weg,.zeilengriff{display:none}
  .klappkopf{max-width:150px}
}
.journal tbody tr[data-jz]:focus{outline:1px solid var(--accent);outline-offset:-2px}
.zeitwahl .pfeil:disabled{cursor:default}
.zeitwahl .pfeil:disabled:hover{background:none;border-color:transparent;color:var(--muted)}

@media (max-width:760px){
  .liq{grid-template-columns:1fr 1fr;gap:16px}
  .liq .herleitung{grid-column:1/-1;border-left:none;border-top:1px solid var(--line);padding:12px 0 0}
  .raster{grid-template-columns:1fr}
  .kopfzeile{flex-wrap:wrap;gap:10px}
  .maske{grid-template-columns:1fr}
  .blatt-hg{padding:12px}
  .blatt.weit .blatt-koerper{min-height:0}
  .blatt-kopf.mitreiter h2{font-size:19px}
}

/* ===================================================================
   GAEPP — Ergaenzungen zum Mockup-CSS.
   Alles hier folgt einer Festlegung der Formensprache, die im Mockup
   noch nicht gebaut ist. Keine neuen Formen, nur neue Anwendungen.
   =================================================================== */

/* --- Sync-Element in der Bedienleiste (A-09, A-95, Formensprache E) ---
   Statuspunkt + Zahnrad. Der Punkt ist Zustandsanzeige, kein Bedienelement. */
.sync{display:inline-flex;align-items:center;gap:9px;margin-left:2px}
.sync .punkt{width:9px;height:9px;border-radius:50%;background:var(--muted);flex:0 0 auto}
.sync .punkt[data-st="off"]{background:var(--rule)}
/* Lokal ist ein gueltiger Betriebszustand, kein Fehler — deshalb ein ruhiger Punkt. */
.sync .punkt[data-st="lokal"]{background:var(--muted)}
.sync .punkt[data-st="busy"]{background:var(--open)}
.sync .punkt[data-st="ok"]{background:var(--ok)}
.sync .punkt[data-st="err"]{background:var(--err)}
.sync .txt{font-size:11.5px;color:var(--muted);white-space:nowrap}
.sync .zahnrad{background:none;border:1px solid var(--rule);border-radius:var(--radius-sm);
  color:var(--muted);cursor:pointer;font-size:14px;line-height:1;padding:5px 9px}
.sync .zahnrad:hover{color:var(--ink);background:var(--soft)}

/* --- Etikett «ueberzogen» (Formensprache C) — Zustandsanzeige, kein Knopf --- */
.etikett{display:inline-block;margin-left:9px;padding:1px 7px;border-radius:5px;
  background:var(--soft);color:var(--err);font-size:11px;font-weight:500;vertical-align:middle}

/* --- Meldungen und Hinweise sind Werte (Form 5), kein eigenes Bauteil --- */
.meldung{font-size:12px;color:var(--muted);line-height:1.5}
.meldung.fehler{color:var(--err)}
.meldung.offen{color:var(--open)}
.kopfmeldung{padding:7px var(--edge);background:var(--soft);border-bottom:1px solid var(--line);
  color:var(--err);font-size:12.5px;flex:0 0 auto}

/* --- Vorschlagszeile aus einer Serie (E-8, Formensprache B) ---
   Unterscheidet sich von einer echten Buchung allein durch die Farbe. */
.journal tr.vorschlag td,.journal tr.vorschlag td .tag{color:var(--open)}
.journal .zwerk{opacity:0;display:inline-flex;gap:5px}
.journal tr:hover .zwerk,.journal tr:focus-within .zwerk{opacity:1}

/* --- Gespiegelte Tabellenzeile (E-9, Formensprache B/H) ---
   Faellt um einen Rang: durchgehend --muted, kein Aufhellen bei Hover,
   dafuer die Bezeichnung in Akzent — «das hier fuehrt woandershin». */
tr.zeile-daten.gespiegelt td,
tr.zeile-daten.gespiegelt td:nth-child(3),
tr.zeile-daten.gespiegelt td:last-child{color:var(--muted)}
table.gross tr.zeile-daten.gespiegelt:hover td.n{color:var(--muted)}
/* U-22: Seit dem Zeilenblatt fuehrt JEDER Name irgendwohin, nicht nur der
   einer gespiegelten Zeile — der Zeiger sagt das jetzt auch dort. */
td.namenszelle .nz{cursor:pointer}
tr.zeile-daten:hover .nz{color:var(--accent)}

/* --- Bankabgleich in der Fusszeile des Blatts (A-87, Formensprache D) --- */
.abgleich{display:flex;align-items:flex-end;gap:12px;margin-right:auto}
.blatt-fuss{align-items:center}
/* ===================================================================
   U-48 — die Tabelle der monatlichen Umbuchungen
   -------------------------------------------------------------------
   Zwei Regeln, beide aus vorhandenen Werten. Die zweite ist ein
   bewusster Bruch mit `.journal .zwerk` (opacity:0 bis Hover): In
   diesem Blatt ist «Buchen» die einzige Handlung der Zeile und kein
   Werkzeug daneben. Versteckt waere die Tabelle stumm — und auf einem
   Zeigergeraet ohne Hover unbedienbar.
   =================================================================== */
.umb-tab td{height:38px;vertical-align:middle}
.umb-tab input.num{width:108px;background:var(--bg);border:1px solid var(--line);
  border-radius:var(--radius-sm);color:var(--ink);font-family:'IBM Plex Mono',monospace;
  font-variant-numeric:tabular-nums;font-size:13px;text-align:right;padding:5px 9px}
.umb-tab input.num:focus{outline:none;border-color:var(--accent)}
.umb-tab .zwerk{opacity:1;display:inline-flex;gap:9px;align-items:center;justify-content:flex-end}
/* Ocker traegt «noch nicht abgeschlossen»: die Zeile ist in dieser Sitzung
   bewegt worden und laesst sich noch aendern. */
.umb-tab tr.umb-bewegt .umb-schon{color:var(--open)}
.abgleich .feld{width:132px}
.abgleich .diff{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;
  font-size:13px;padding-bottom:8px;color:var(--ink)}
.abgleich .diff.ab{color:var(--err)}
.abgleich .lab{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;
  padding-bottom:9px}

/* --- Verwaltung: Karten, keine Formularlisten (A-10) --- */
.vw-raster{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:var(--gap);align-items:start}
.vw-karte{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:var(--pad)}
.vw-karte h3{font-size:13px;font-weight:600;letter-spacing:-.01em;margin-bottom:10px;
  display:flex;align-items:center;gap:8px}
.vw-karte h3 .knopf{margin-left:auto}
/* U-18: Als Modal brauchten die Listen ein eigenes Rollfenster. Auf einer
   Seite, die selbst rollt, ist das eine Falle — man uebersieht, dass die
   Liste weitergeht. Sie stehen jetzt ganz da. */
.vw-liste{display:flex;flex-direction:column;gap:1px}
.vw-liste .z{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--hairline);
  font-size:12.5px}
.vw-liste .z:last-child{border-bottom:none}
.vw-liste .z .n{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vw-liste .z .zw{opacity:0;display:inline-flex;gap:5px}
.vw-liste .z:hover .zw,.vw-liste .z:focus-within .zw{opacity:1}
.vw-liste .z.aus .n{color:var(--muted)}
/* U-22: Ein Budgetjahr ist keine Marke mehr, sondern eine Zeile mit einem
   Knopf — ein Chip kann nichts ausloesen. */
.jahrzeile{display:flex;align-items:center;gap:10px;padding:6px 0;
  border-bottom:1px solid var(--hairline);font-size:12.5px}
.jahrzeile:last-child{border-bottom:none}
.jahrzeile .j{font-family:'IBM Plex Mono',monospace;font-size:13px;width:52px}
.jahrzeile.jetzt .j{color:var(--accent);font-weight:600}
.jahrzeile .e{flex:1;color:var(--muted);font-size:12px}
.jahrzeile .zw{opacity:0}
.jahrzeile:hover .zw,.jahrzeile:focus-within .zw{opacity:1}

/* U-22: Dokumentlinks eines Glaeubigers — Bezeichnung, Adresse, weg damit. */
.doks{display:flex;flex-direction:column;gap:5px}
.doks .dok{display:flex;gap:6px;align-items:center}
.doks .dok .dokName{flex:0 0 34%}
.doks .dok .dokUrl{flex:1;min-width:0}
.doks .dok input{background:var(--bg);border:1px solid var(--rule);border-radius:var(--radius-sm);
  color:var(--ink);font-family:inherit;font-size:12.5px;padding:6px 9px;width:100%}
.doks .dok input:focus{outline:none;border-color:var(--accent)}
.doklink{color:var(--accent);text-decoration:none;border-bottom:1px solid transparent}
.doklink:hover{border-bottom-color:var(--accent)}

/* --- Tilgungstabelle im Schuldblatt --- */
.tilg{width:100%;border-collapse:collapse;font-size:12.5px}
.tilg th{text-align:right;font-size:10.5px;color:var(--muted);text-transform:uppercase;
  letter-spacing:.06em;font-weight:500;padding:0 6px 6px;border-bottom:1px solid var(--line)}
.tilg th:first-child{text-align:left}
.tilg td{padding:4px 6px;border-bottom:1px solid var(--hairline);text-align:right;
  font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;font-size:12px}
.tilg td:first-child{text-align:left;font-family:inherit;font-size:12.5px}
.tilg tr.jahr td{border-top:1px solid var(--rule);font-weight:600;color:var(--ink)}
.tilg td.zahl{color:var(--ok)}

/* ===================================================================
   BERICHT — dieselbe Farbwelt wie die App, dieselben Schriften.
   Ein Bericht, den man am Bildschirm liest, soll aussehen wie das
   Werkzeug, aus dem er kommt. Papier wird erst beim Drucken daraus:
   dann kippen die Tokens auf weiss, und keine einzige Regel darunter
   muss ein zweites Mal geschrieben werden.
   =================================================================== */
.bericht{background:var(--card);color:var(--ink);font-size:13px;line-height:1.5}

/* Kopf: Etikett, Titel, Untertitel, rechts das Ausgabedatum. */
.bkopf{display:flex;align-items:flex-start;gap:20px;padding-bottom:14px;
  border-bottom:1px solid var(--ink);margin-bottom:18px}
.bkopf .cap,.bstand .cap{font-family:'IBM Plex Mono',monospace;font-size:10px;
  letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.bkopf .cap.s,.bstand .cap.s{font-size:9px}
.bkopf h1{font-size:24px;font-weight:600;letter-spacing:-.015em;margin:4px 0 2px;color:var(--ink)}
.bkopf .bsub{font-size:12.5px;color:var(--muted)}
.bstand{margin-left:auto;text-align:right;flex:0 0 auto}
.bstand .num{font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--muted);margin-top:2px}

/* Kennzahlenband — dieselbe Anatomie wie die Kennzahlen im Blatt. */
.bkennz{display:flex;flex-wrap:wrap;background:var(--soft);border-radius:var(--radius-sm);
  padding:13px 4px;margin-bottom:20px}
.bkennz > div{flex:1 1 auto;min-width:max-content;padding:0 20px}
.bkennz > div + div{border-left:1px solid var(--line)}
.bkennz .cap{font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--muted)}
.bkennz b{display:block;font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;
  font-size:18px;font-weight:600;margin-top:3px;color:var(--ink)}
.bkennz b.ok{color:var(--ok)} .bkennz b.err{color:var(--err)}

/* Zwischenueberschrift im Bericht — Kleinschrift-Etikett, kein zweiter Titel. */
.bericht .bh{font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--muted);font-weight:400;margin:24px 0 7px}

/* Berichtstabelle */
.btab{width:100%;border-collapse:collapse;font-size:12.5px}
.btab th{text-align:left;font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--muted);font-weight:400;padding:5px 8px 6px;
  border-bottom:1px solid var(--ink);white-space:nowrap}
.btab td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.btab tfoot td{border-bottom:none;border-top:1px solid var(--ink);font-weight:600;padding-top:10px}
.btab .bn{min-width:130px;overflow-wrap:anywhere}
.btab th.bzahl,.btab td.bzahl{text-align:right;font-family:'IBM Plex Mono',monospace;
  font-variant-numeric:tabular-nums;white-space:nowrap}
.btab td.ok{color:var(--ok)} .btab td.err{color:var(--err)}
.btab th.banteil,.btab td.banteil{width:158px;min-width:158px;white-space:nowrap}
.bspur{display:inline-block;width:100px;height:7px;border-radius:999px;
  background:var(--line);vertical-align:middle;overflow:hidden}
.bbar{display:block;height:7px;border-radius:999px;background:var(--accent);width:0;opacity:.9}
.bpct{display:inline-block;width:40px;text-align:right;font-family:'IBM Plex Mono',monospace;
  font-size:11px;color:var(--muted);margin-left:8px;vertical-align:middle}
.btab .bsub{font-size:11px;color:var(--muted);margin-top:1px;font-weight:400}
.btab .nix{color:var(--rule)}
.btab tr.grp td{background:var(--soft);font-weight:600;border-bottom:1px solid var(--rule)}
.btab tbody tr.bz{cursor:pointer}
.btab tbody tr.bz:hover td{background:var(--soft)}
.btab tbody tr.aus{opacity:.34}
.bfuss{margin-top:20px;padding-top:11px;border-top:1px solid var(--line);
  font-size:11.5px;color:var(--muted)}
[data-ausgeblendet]:empty{display:none}
.bfuss [data-ausgeblendet]::before{content:' · '}
.ber-notiz{margin-top:10px;font-size:11.5px;color:var(--muted);line-height:1.55}
.ber-verlauf{width:100%;height:auto;display:block;margin:0 0 16px}
#berichtVorschau .bericht{background:transparent}

/* Rahmen der gesicherten Datei — nur dort sichtbar, hier mitgefuehrt,
   damit die Datei ihr Aussehen aus derselben Quelle bekommt. */
.efrahmen{max-width:1080px;margin:0 auto;padding:26px 22px 60px}
.ehinweis{background:var(--soft);border-radius:var(--radius-sm);padding:11px 16px;
  font-size:12.5px;color:var(--muted);margin-bottom:20px;display:flex;gap:12px;
  flex-wrap:wrap;align-items:center}
.ehinweis b{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.16em;color:var(--ink)}
.ehinweis button{margin-left:auto;background:var(--accent);border:none;color:var(--onaccent);
  border-radius:var(--radius-sm);padding:7px 14px;font-family:inherit;font-size:12.5px;cursor:pointer}
.ekarte{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:28px 32px}

/* --- Druck: aus der Nacht wird Papier, ueber die Tokens ---------------
   Nicht Regel fuer Regel umschreiben, sondern die Farbwelt tauschen.
   Sonst vergisst man beim naechsten neuen Element genau eine Stelle. */
@media print{
  /* In der App bleibt nur #druck stehen. In der gesicherten Berichtsdatei
     gibt es kein #druck — dort ist .efrahmen der ganze Inhalt und muss
     die Ausnahme sein, sonst druckt sie ein leeres Blatt. */
  body > *:not(.efrahmen){display:none !important}
  #druck{display:block !important;position:static}
  #druck,.efrahmen{
    --bg:#fff; --card:#fff; --sheet:#fff; --soft:#f2f2f2; --line:#ddd; --rule:#bbb;
    --ink:#111; --muted:#555; --accent:#a85c00; --onaccent:#fff;
    --ok:#2f6b48; --err:#a33; --shadow:none}
  body{background:#fff}
  #druck .bericht,.efrahmen .bericht{background:#fff;color:#111}
  /* Das Kopfband der gesicherten Datei erklaert die Bedienung — auf Papier
     gibt es nichts zu bedienen. Was fehlt, sagt die Fusszeile. */
  .ehinweis{display:none}
  .efrahmen{max-width:none;padding:0}
  .ekarte{border:none;box-shadow:none;padding:0}
  /* Eine ausgeblendete Zeile gehoert nicht aufs Papier — blassgrau gedruckt
     sieht sie nach Druckfehler aus. Dass welche fehlen, sagt die Fusszeile. */
  .btab tbody tr.aus{display:none}
  .btab tr{page-break-inside:avoid}
  .bericht .bh{page-break-after:avoid}
  .bbar{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .bkennz{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
#druck{display:none}

/* --- Rueckgaengig-Leiste (U-20) --------------------------------------
   Hoehenlage 110: ueber dem Blatt (100) — «Rechnung bezahlt» passiert im
   Blatt, die Leiste muss darueber liegen — und unter dem modalen Dialog
   (120). Solange eine Frage offen steht, wird also kein Rueckgaengig
   angeboten; das ist die richtige Semantik und kostet keine Extralogik.
   Die Druckregel oben blendet sie mit body > *:not(.efrahmen) schon aus. */
.zurueckleiste{
  position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:110;
  display:flex;align-items:center;gap:12px;max-width:min(90vw,560px);
  background:var(--card);border:1px solid var(--rule);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:9px 11px 9px 16px}
.zurueckleiste .tx{font-size:12.5px;color:var(--ink);line-height:1.45}
.zurueckleiste .knopf{flex:0 0 auto}
.zurueckleiste #btnZurueckZu{color:var(--muted);padding:4px 9px;font-size:13px;line-height:1}

/* --- Handbuch --- */
.hb h3{font-size:13.5px;font-weight:600;margin:16px 0 5px;letter-spacing:-.01em}
.hb h3:first-child{margin-top:0}
.hb p{font-size:12.5px;color:var(--muted);line-height:1.6;margin-bottom:7px}
.hb p b{color:var(--ink);font-weight:600}
.hb .regel{border-left:2px solid var(--accent);padding-left:12px;margin-bottom:14px}

/* --- Erster Start: die App hat noch keine Daten --- */
.leerstart{max-width:520px;margin:60px auto;text-align:center}
.leerstart h2{font-size:19px;font-weight:600;letter-spacing:-.015em;margin-bottom:8px}
.leerstart p{color:var(--muted);font-size:13px;line-height:1.6;margin-bottom:16px}

/* --- Schreibgeschuetzt (A-88) --- */
body.readonly td.bearbeitbar input,body.readonly .feld input,body.readonly .feld select{
  pointer-events:none;opacity:.65}

/* --- Beträge dürfen nicht abgeschnitten werden -----------------------
   Die Monatsspalten waren 78 px breit (Formensprache L). Der groesste Wert
   im Budget ist fuenfstellig mit Rappen und Tausendertrennung — neun
   Zeichen. Bei 12 px Schrift und 8 px Polster passt das nicht; die Zahl
   wurde beschnitten. Statt die Spalte zu verbreitern (dann rollt die
   Tabelle bei 1600 px wieder seitlich) sitzen Schrift und Polster eine
   Spur enger.
   Der konkrete Betrag stand hier frueher im Klartext und ist am 17.08.2026
   entfernt worden: Diese Datei ist die oeffentliche Huelle, und A-78 gilt
