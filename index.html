chuldVerlauf(v);\n  const st = verbindStandHeute(v);\n  const diff = v.auszugswert !== null && v.auszugswert !== undefined ? rd(v.auszugswert - st) : null;\n  return {\n    weit: true, kennung: GRUPPEN.find(g=>g.id===v.gruppe).name + ' · ' + zeitTitel(),\n    titel: v.bezeichnung,\n    /* U-27: Dokumente stehen hinten, nicht vorn. Der Reiter, auf dem das\n       Blatt aufgeht, muss der sein, auf dem am haeufigsten gearbeitet\n       wird — das ist die Zahlung. Die Zahl am vierten Reiter genuegt,\n       damit man von dort aus sieht, ob es sich lohnt hinzugehen. */\n    reiter: [['zahlung','Zahlung'],['tilgung','Tilgung'],['verlauf','Verlauf'],\n             ['dokumente', dokReiterName('verbind', v)]],\n    koerper,\n    fuss: `<div class=\"abgleich\" style=\"margin-left:14px\">\n        <div class=\"feld\"><label>Gläubigerauszug<\u002Flabel>\n          <input class=\"num\" id=\"auszugswert\" type=\"text\" inputmode=\"decimal\"\n                 value=\"${v.auszugswert != null ? fmt(v.auszugswert) : ''}\" placeholder=\"${fmt(st)}\"><\u002Fdiv>\n        <span class=\"lab\">Differenz<\u002Fspan>\n        <span class=\"diff ${diff ? 'ab' : ''}\" id=\"schulddiff\">${diff === null ? '–' : fmt(diff)}<\u002Fspan>\n        ${diff ? `<button class=\"knopf klein\" id=\"btnUebertrag\">Übertragen<\u002Fbutton>` : ''}\n      <\u002Fdiv>\n      <button class=\"knopf klein\" data-gaend=\"${v.id}\">Ändern<\u002Fbutton>\n      <!-- U-30: «Löschen» steht neben «Ändern», weil beides derselbe Griff ist:\n           dieser Gläubiger stimmt so nicht. Bis U-30 endete der Griff bei\n           «Ausblenden» — die Kaskade aus U-22 konnte eine Verbindlichkeit\n           längst, nur bot sie niemand an. -->\n      <button class=\"knopf klein gefahr\" data-vwloesch=\"verbindlichkeit:${v.id}\">Löschen<\u002Fbutton>\n      <button class=\"knopf klein\" data-bericht=\"schuld:${v.id}\">Bericht<\u002Fbutton>\n      <button class=\"knopf\" data-zu>Schliessen<\u002Fbutton>`\n  };\n}\n/* ===================================================================\n   U-22 — Dokumentlinks bei einem Gläubiger\n   -------------------------------------------------------------------\n   REINE VERWEISE. GAEPP legt nichts ab und prueft nichts nach: kein\n   Kopieren in den Belegordner, kein Abrufen der Adresse, keine Meldung,\n   wenn sie tot ist. Das ist Absicht und keine Sparmassnahme.\n\n   Eine Zahlungsvereinbarung liegt einmal irgendwo — im Mailanhang, im\n   Dossier, im Behoerdenportal. Wuerde GAEPP eine Kopie ziehen, gaebe es\n   sie zweimal; die Kopie wuerde nicht nachgefuehrt, und beim naechsten\n   Nachtrag stuende die alte Fassung im Werkzeug, das Albrecht fuer die\n   Wahrheit haelt. Ein toter Link sagt «hier war einmal etwas, sieh\n   nach». Eine veraltete Kopie sagt nichts und behauptet alles.\n\n   Geprueft wird genau eine Sache, und die beim Speichern: dass die\n   Adresse mit http:// oder https:// anfaengt. Ein `javascript:`-Link in\n   einer Datei, die ueber GitHub zurueckkommt, waere fremder Code im\n   eigenen Fenster.\n   =================================================================== */\nfunction dokUrlOk(u) { return /^https?:\\/\\//i.test(String(u || '').trim()); }\n/* U-26: Die Dokumente wurden bis hierher nur im Blatt «Gläubiger ändern»\n   gepflegt — und dort erst beim Klick auf «Ändern» gespeichert. Wer den\n   Link eintippte und danach «Schliessen» drueckte, verlor ihn ohne\n   Meldung. Genau so ist es Albrecht ergangen.\n\n   U-27: Aus der einen Zeile im Zahlungsreiter ist ein eigener Reiter\n   geworden. Der Grund ist derselbe Fehler in kleinerer Form: eine Zeile\n   im Kopfblock einer Erfassungsmaske uebersieht man. Was einen eigenen\n   Ort verdient, bekommt einen eigenen Ort — und die Zahl am Reiter sagt\n   von aussen, ob dort etwas liegt, ohne dass man hineinsehen muss.\n\n   Erfasst wird IM REITER, nicht in einem Dialog und nicht im Formular\n   darueber. Der Knopf schreibt sofort nach D und ruft davor merkeStand().\n   Das ist die Lehre aus U-26 und sie gilt hier doppelt: ein Reiter, den\n   man verlaesst, ohne etwas abzuschicken, ist noch leichter zu verlassen\n   als eine Maske.\n\n   Zwei Traeger, ein Bauteil: eine Verbindlichkeit und eine Rechnung\n   haben dasselbe Feld `dokumente` und verdienen deshalb nicht zwei\n   Ansichten, die auseinanderlaufen. `art` sagt nur, wo nachgeschlagen\n   wird — alles andere ist gleich.\n\n   Das Blatt «Gläubiger ändern» behaelt seine eigene Liste; wer dort ist,\n   soll sie nicht suchen muessen. Beide schreiben in dasselbe Feld. */\nfunction dokTraeger(art, id) {\n  return art === 'rechnung' ? (D.rechnungen.find(x => x.id === id) || null)\n       : art === 'verbind'  ? (verbind(id) || null)\n       : art === 'konto'    ? (konto(id) || null) : null;\n}\n/* ---- U-28: was die Erfassung als Beispiel vorschlaegt ----------------\n   Der Platzhalter ist kein Schmuck, er ist eine Anleitung: er sagt, was\n   fuer eine Art Sache hier hineingehoert. Bei einer Schuld ist das eine\n   Zahlungsvereinbarung, bei einem Konto ein Kontoauszug — und ausdruecklich\n   NICHT ein Zugang. Ein Platzhalter «Zugangsdaten» waere eine Einladung,\n   und die Datei geht ueber GitHub. Der Hinweis darunter sagt es noch\n   einmal in Worten, weil ein Platzhalter verschwindet, sobald man tippt. */\nconst DOK_BEISPIEL = { verbind:'Zahlungsvereinbarung 2026', rechnung:'Mahnung vom 12.08.2026',\n                       konto:'Kontoauszug Dezember 2026' };\n/* «verbind:v1» und «verbind:v1:3» — art steht vorn, der Index hinten, die\n   Kennung dazwischen. Zerlegt wird von aussen nach innen, damit eine\n   Kennung mit Doppelpunkt darin nichts zerreisst. */\nfunction dokSchl(s) {\n  const t = String(s || ''), a = t.indexOf(':');\n  return { art: t.slice(0, a), id: t.slice(a + 1) };\n}\nfunction dokSchlI(s) {\n  const t = String(s || ''), a = t.indexOf(':'), z = t.lastIndexOf(':');\n  return { art: t.slice(0, a), id: t.slice(a + 1, z), i: +t.slice(z + 1) };\n}\n/* Gefiltert wird bei JEDEM Zeichnen, nicht nur beim Speichern: eine Datei,\n   die ueber GitHub zurueckkommt, kann einen `javascript:`-Eintrag tragen,\n   den diese App nie gesehen hat. */\nfunction dokListe(o) { return ((o && o.dokumente) || []).filter(d => d && dokUrlOk(d.url)); }\n/* Hat die Rechnung einen Beleg? Zwei Zustaende zaehlen gleich: abgelegt und\n   im Zwischenspeicher wartend — in beiden Faellen liegt etwas da. */\nfunction dokHatBeleg(art, o) { return art === 'rechnung' && !!(o.belegDatei || o.belegOffen); }\n/* Die Zahl am Reiter zaehlt, was der Reiter zeigt — bei einer Rechnung also\n   die Verweise UND den abgelegten Beleg. Sie beantwortet nicht die Frage\n   «wie viele Verweise», sondern «liegt hier etwas». Eine Rechnung, deren\n   einziger Inhalt der Beleg ist, muesste sonst ohne Zahl dastehen, und\n   genau dann waere der Reiter wieder das, was er nicht sein soll: eine\n   Stelle, in die man erst hineinsehen muss. */\nfunction dokAnzahl(art, o) { return dokListe(o).length + (dokHatBeleg(art, o) ? 1 : 0); }\nfunction dokReiterName(art, o) {\n  const n = dokAnzahl(art, o);\n  return 'Dokumente' + (n ? ` <span class=\"reiterzahl\">${n}<\u002Fspan>` : '');\n}\n/* Lesbar gekuerzt, vollstaendig im title. Ein Freigabelink von OneDrive ist\n   zweihundert Zeichen lang und sagt auf den ersten sechzig alles, was man\n   zum Wiedererkennen braucht; der Rest gehoert in den Tooltip, nicht in\n   die Zeile. */\nfunction dokKurz(u) {\n  const s = String(u || '').replace(/^https?:\\/\\//i, '').replace(/\\/+$/, '');\n  if (s.length <= 62) return s;\n  const wirt = s.slice(0, s.indexOf('/') < 0 ? s.length : s.indexOf('/'));\n  let letzt = s.slice(s.lastIndexOf('/') + 1);\n  if (letzt.length > 38) letzt = letzt.slice(0, 37) + '…';\n  return wirt + '/…/' + letzt;\n}\n/* ---- U-27: der Reiter selbst ---------------------------------------\n   Beleg und Verweis stehen nebeneinander und sind trotzdem zwei Dinge —\n   deshalb zwei Kaesten mit zwei Ueberschriften und nicht eine Liste:\n\n   Der BELEG ist eine Datei, die GAEPP selbst in den OneDrive-Ordner\n   geschrieben, nach eigenem Muster benannt und beim Bezahlen nach\n   «Bezahlt» weitergezogen hat. GAEPP kennt ihren Namen, ihren Ort und\n   ihren Zustand; «Entfernen» hiesse hier, eine Datei zu loeschen.\n\n   Ein VERWEIS ist eine Adresse, die Albrecht eingetippt hat. GAEPP legt\n   nichts ab, prueft nichts nach und weiss nicht, ob dahinter noch etwas\n   liegt (U-22). «Entfernen» nimmt die Adresse weg, nicht das Dokument.\n\n   Wuerde man beide in eine Liste werfen, stuende neben dem Beleg ein\n   Entfernen-Knopf, der etwas anderes tut als der daneben. Das ist die\n   gefaehrlichste Art von Aehnlichkeit. */\nfunction dokReiterHtml(art, id) {\n  const o = dokTraeger(art, id);\n  if (!o) return '<p class=\"meldung\">Dazu gibt es nichts mehr.<\u002Fp>';\n  const schl = art + ':' + o.id;\n  const dok = dokListe(o);\n  const roh = (o.dokumente || []);\n  /* Verworfene Eintraege werden gezaehlt, nicht verschwiegen: wer einen\n     Verweis hinterlegt hat und ihn nicht sieht, sucht sonst im Falschen. */\n  const verworfen = roh.length - dok.length;\n  const eintraege = dok.map((d, i) => `<div class=\"dokeintrag\">\n      <span class=\"dokna\"><b><a class=\"doklink\" href=\"${htmlAttr(d.url)}\" target=\"_blank\"\n          rel=\"noopener\">${htmlText(d.name || d.url)}<\u002Fa><\u002Fb>\n        <span class=\"dokadr\" title=\"${htmlAttr(d.url)}\">${htmlText(dokKurz(d.url))}<\u002Fspan><\u002Fspan>\n      ${_ro ? '' : `<span class=\"dokwerk\">\n        <button class=\"knopf klein\" type=\"button\" data-dokumb=\"${schl}:${i}\">Umbenennen<\u002Fbutton>\n        <button class=\"knopf klein\" type=\"button\" data-dokloesch=\"${schl}:${i}\">Entfernen<\u002Fbutton>\n      <\u002Fspan>`}<\u002Fdiv>`).join('');\n  return (art === 'rechnung' ? `<p class=\"dokgruppe\">Abgelegter Beleg<\u002Fp>\n    ${o.belegDatei || o.belegOffen ? `<div class=\"dokbeleg\" id=\"rechBeleg\">\n        <span class=\"dokna\"><b>${htmlText(o.belegDatei || 'Beleg')}<\u002Fb>\n          <span class=\"dokadr\">${o.belegDatei\n            ? 'liegt im GÄPP-Ordner — von GÄPP abgelegt, benannt und beim Bezahlen mitgezogen'\n            : 'liegt im Zwischenspeicher und wird abgelegt, sobald der Ordner freigegeben ist'}<\u002Fspan><\u002Fspan>\n        <span class=\"dokwerk\"><button class=\"knopf klein\" data-beleg=\"${o.id}\">Öffnen<\u002Fbutton><\u002Fspan>\n      <\u002Fdiv>` : `<p class=\"meldung\" id=\"rechBelegLeer\">Kein Beleg hinterlegt. Der Beleg kommt\n        beim Erfassen der Rechnung dazu — GÄPP legt ihn selbst im Ordner ab.<\u002Fp>`}\n    <p class=\"dokgruppe\">Verweise<\u002Fp>` : '')\n  + `<div class=\"dokliste\" id=\"dokListe\">${eintraege}<\u002Fdiv>\n    ${dok.length ? '' : '<p class=\"meldung\">Noch kein Verweis hinterlegt.<\u002Fp>'}\n    ${verworfen ? `<p class=\"meldung fehler\">${verworfen} Eintrag${verworfen > 1 ? 'e' : ''} in der\n      Datei wird nicht gezeigt: die Adresse beginnt nicht mit http:// oder https://.<\u002Fp>` : ''}\n    ${_ro ? '<p class=\"meldung\">Schreibgeschützt — hier lässt sich nichts hinterlegen.<\u002Fp>' : `\n    <div class=\"dokneu\">\n      <div class=\"feldchen breit\"><label for=\"dokNeuName\">Bezeichnung<\u002Flabel>\n        <input class=\"dokfeld\" type=\"text\" id=\"dokNeuName\"\n               placeholder=\"${DOK_BEISPIEL[art] || 'Bezeichnung'}\"><\u002Fdiv>\n      <div class=\"feldchen breit\"><label for=\"dokNeuUrl\">Adresse<\u002Flabel>\n        <input class=\"dokfeld\" type=\"text\" id=\"dokNeuUrl\" placeholder=\"https://…\"><\u002Fdiv>\n      <div class=\"feldchen\"><button class=\"knopf primaer\" type=\"button\"\n        data-dokneu=\"${schl}\">Hinterlegen<\u002Fbutton><\u002Fdiv>\n    <\u002Fdiv>\n    <p class=\"meldung\" id=\"dokNeuHint\">GÄPP legt nichts ab und prüft nichts nach — es merkt sich\n      nur den Verweis, und zwar sofort. Bei OneDrive ist das der Freigabelink, nicht der Pfad\n      im Explorer.<\u002Fp>\n    ${art === 'konto' ? `<p class=\"meldung\" id=\"dokKeinZugang\">Kontoauszüge, Bankvertrag,\n      Korrespondenz — <b>keine Zugangsdaten<\u002Fb>. Diese Datei liegt in einem Git-Repository\n      und wird bei jeder Änderung ganz neu geschrieben; was einmal darin stand, steht in der\n      Historie weiter.<\u002Fp>` : ''}`}`;\n}\n/* ---- U-27: der Wegweiser im Zahlungsreiter --------------------------\n   Er zeigt, was hinterlegt ist, und fuehrt zum Reiter — mehr nicht.\n   Erfassen und Entfernen standen bis U-26 hier; sie sind weggefallen,\n   weil dieselbe Sache an zwei Stellen gepflegt zwei Wahrheiten sind,\n   sobald eine der beiden Stellen einmal nicht mitgezogen wird. */\nfunction dokWegweiser(art, id) {\n  const o = dokTraeger(art, id);\n  if (!o) return '';\n  const dok = dokListe(o);\n  const links = dok.map(d =>\n    `<span class=\"dokchip\"><a href=\"${htmlAttr(d.url)}\" target=\"_blank\" rel=\"noopener\"\n       >${htmlText(d.name || d.url)}<\u002Fa><\u002Fspan>`).join('');\n  /* Bei einer Rechnung stand der Beleg bis U-27 in der Uebersichtstafel. Er\n     steht jetzt im Reiter — hier bleibt nur die Nachricht, dass es ihn gibt.\n     Sie sieht bewusst NICHT aus wie eine Verweismarke: der Beleg ist kein\n     Verweis, und wer hier auf einen Klick hofft, bekaeme sonst keinen. */\n  const beleg = art === 'rechnung'\n    ? `<span class=\"dokbelegmarke\">${o.belegDatei ? 'Beleg abgelegt'\n        : o.belegOffen ? 'Beleg liegt bereit' : 'kein Beleg'}<\u002Fspan>` : '';\n  return `<div class=\"dokzeile\" id=\"${art === 'rechnung' ? 'rechDok' : 'schuldDok'}\">\n    <span class=\"dokmarke\">Dokumente<\u002Fspan>\n    ${links || '<span class=\"meldung\">noch keine hinterlegt<\u002Fspan>'}\n    ${beleg}\n    <button class=\"knopf klein\" type=\"button\" data-blattreiter=\"dokumente\"\n      >Im Reiter «Dokumente»${_ro ? ' ansehen' : ' pflegen'}<\u002Fbutton>\n  <\u002Fdiv>`;\n}\n/* Speichern heisst hier: jetzt. merkeStand() steht vor der ersten\n   Mutation, persist() danach, blattZeichnen() zeichnet den Reiter mit dem\n   neuen Eintrag und dem wieder leeren Formular. Wer danach das Blatt\n   schliesst, verliert nichts — das ist der ganze Punkt. */\nfunction dokAnlegen(schluessel) {\n  const { art, id } = dokSchl(schluessel);\n  const o = dokTraeger(art, id); if (!o || _ro) return;\n  const n = ($('#dokNeuName').value || '').trim(), u = ($('#dokNeuUrl').value || '').trim();\n  if (!dokUrlOk(u)) {\n    const h = $('#dokNeuHint');\n    if (h) { h.textContent = 'Die Adresse muss mit http:// oder https:// beginnen.';\n             h.classList.add('fehler'); }\n    const f = $('#dokNeuUrl'); if (f) f.focus();\n    return;\n  }\n  merkeStand('Verweis hinterlegt');\n  if (!Array.isArray(o.dokumente)) o.dokumente = [];\n  o.dokumente.push({ name: n || u, url: u });\n  persist(); blattZeichnen();\n  /* Der Fokus geht zurueck ins erste Feld: wer einen Verweis hinterlegt,\n     hat meistens noch einen zweiten in der Zwischenablage. */\n  setTimeout(() => { const f = $('#dokNeuName'); if (f) f.focus(); }, 0);\n}\nfunction dokUmbenennen(schluessel) {\n  const { art, id, i } = dokSchlI(schluessel);\n  const o = dokTraeger(art, id); if (!o || _ro) return;\n  const d = (o.dokumente || [])[i]; if (!d) return;\n  const neu = prompt('Wie soll der Verweis heissen? Die Adresse bleibt, wie sie ist.', d.name || '');\n  if (neu === null) return;\n  const t = neu.trim(); if (!t || t === d.name) return;\n  merkeStand('Verweis umbenannt');\n  d.name = t;\n  persist(); blattZeichnen();\n}\nfunction dokLoeschen(schluessel) {\n  const { art, id, i } = dokSchlI(schluessel);\n  const o = dokTraeger(art, id); if (!o || _ro) return;\n  const d = (o.dokumente || [])[i]; if (!d) return;\n  if (!frage('Verweis «' + (d.name || d.url) + '» entfernen? Das Dokument selbst bleibt, wo es liegt.')) return;\n  merkeStand('Verweis entfernt');\n  o.dokumente.splice(i, 1);\n  persist(); blattZeichnen();\n}\n/* Zwei Felder und ein Knopf sind ein Formular, auch ohne <form>. Enter\n   muss dort tun, was der Knopf tut — sonst tippt man die Adresse, drueckt\n   Enter, und nichts geschieht. Der Zuhoerer haengt an der Klasse des\n   Feldes, nicht am Blatt: das Blatt wird bei jeder Aenderung neu\n   gezeichnet, ein Zuhoerer daran waere nach dem ersten Verweis weg. */\ndocument.addEventListener('keydown', ev => {\n  if (ev.key !== 'Enter') return;\n  const f = ev.target;\n  if (!f || !f.classList || !f.classList.contains('dokfeld')) return;\n  const k = $('[data-dokneu]'); if (!k) return;\n  ev.preventDefault();\n  dokAnlegen(k.dataset.dokneu);\n});\nfunction maskeZahlung(v) {\n  const st = verbindStandHeute(v);\n  const r = rate(v, S.jahr, S.monat);\n  const erh = (v.erhoehungen || []).slice().sort((a,b)=>a.datum<b.datum?-1:1);\n  return `<div class=\"kennzahlen\">\n      <span class=\"wert\"><span class=\"k\">Stand<\u002Fspan><span class=\"v\">${fmt(st)}<\u002Fspan><\u002Fspan>\n      <span class=\"wert\"><span class=\"k\">Rate ${MON[S.monat]}<\u002Fspan><span class=\"v\">${fmt(r)}<\u002Fspan><\u002Fspan>\n      <span class=\"wert\"><span class=\"k\">Getilgt<\u002Fspan><span class=\"v\">${Math.round(getilgtAnteil(v)*100)} %<\u002Fspan><\u002Fspan>\n      ${v.vereinbarungBis ? `<span class=\"wert\"><span class=\"k\">Vereinbarung bis<\u002Fspan>\n        <span class=\"v\" style=\"font-size:15px\">${v.vereinbarungBis.slice(8,10)}.${v.vereinbarungBis.slice(5,7)}.${v.vereinbarungBis.slice(0,4)}<\u002Fspan><\u002Fspan>` : ''}\n    <\u002Fdiv>\n    ${v.zahlung && v.zahlung.iban ? `<p class=\"notiz\"><b>Zahlung an<\u002Fb> ${v.zahlung.iban}${\n       v.zahlung.referenz ? ' · Referenz ' + v.zahlung.referenz : ''}<\u002Fp>` : ''}\n    ${dokWegweiser('verbind', v.id)}\n    ${v.hinweis ? `<p class=\"notiz\" style=\"margin-top:8px\">${v.hinweis}<\u002Fp>` : ''}\n    <div class=\"maske\" style=\"margin-top:14px\">\n      <div class=\"feld\"><label>Datum<\u002Flabel><input type=\"date\" id=\"zDatum\" value=\"${heuteISO()}\"><\u002Fdiv>\n      <div class=\"feld\"><label>Betrag<\u002Flabel>\n        <input class=\"num\" id=\"zBetrag\" type=\"text\" inputmode=\"decimal\" value=\"${r ? fmt(r) : ''}\"><\u002Fdiv>\n      <div class=\"feld voll\"><label>Ab Konto<\u002Flabel>\n        <select id=\"zKonto\">${kontoOptionen(v.kontoId || 'schuld')}<\u002Fselect><\u002Fdiv>\n      <div class=\"feld voll\"><label>Notiz<\u002Flabel><input type=\"text\" id=\"zText\" placeholder=\"frei\"><\u002Fdiv>\n      <div class=\"aktion\"><button class=\"knopf primaer\" id=\"btnZahlung\">Zahlung buchen<\u002Fbutton>\n        <span class=\"hint\" id=\"zHint\"><\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n    <h3 style=\"font-size:13px;margin:18px 0 6px\">Erhöhungen und Minderungen<\u002Fh3>\n    ${erh.length ? `<table class=\"journal\"><tbody>${erh.map(e =>\n      `<tr><td class=\"tag\">${kurzdatum(e.datum)} ${e.datum.slice(0,4)}<\u002Ftd><td>${e.text||''}<\u002Ftd>\n       <td class=\"r num ${e.art==='minderung'?'':'neg'}\">${e.art==='minderung'?'−':'+'}${fmt(e.betrag)}<\u002Ftd>\n       <td class=\"r\"><span class=\"zwerk\"><button class=\"knopf klein\" data-edel=\"${v.id}:${e.id}\">Löschen<\u002Fbutton><\u002Fspan><\u002Ftd><\u002Ftr>`).join('')}\n      <\u002Ftbody><\u002Ftable>` : `<p class=\"meldung\">Keine. Diese Schuld wächst nicht von selbst.<\u002Fp>`}\n    <div style=\"margin-top:10px\"><button class=\"knopf klein\" id=\"btnErhNeu\">Erhöhung erfassen<\u002Fbutton><\u002Fdiv>`;\n}\n/* ---- Verlauf einer Schuld ------------------------------------------\n   Bis heute der wirkliche Stand, danach die Prognose — die Trennlinie\n   sagt, wo das Gerechnete aufhoert und das Geplante anfaengt. */\nfunction schuldVerlauf(v) {\n  const jahre = Object.keys(D.budget).map(Number).sort();\n  const a = ymOf(v.anfangsdatum), h = ymOf(heuteISO());\n  const punkte = [], beschr = [];\n  for (const j of jahre) {\n    for (let m = 0; m < 12; m++) {\n      if (j < a.j || (j === a.j && m < a.m)) continue;\n      punkte.push({ j, m, wert: verbindPrognose(v, j, m), kuenftig: (j > h.j) || (j === h.j && m > h.m) });\n    }\n  }\n  if (!punkte.length) return '<p class=\"meldung\">Kein Verlauf.<\u002Fp>';\n  const w = punkte.map(p => p.wert);\n  const max = Math.max(...w, 1), min = Math.min(...w, 0);\n  const B = 640, H = 260, lr = 52, or_ = 14, ur = 26;\n  const x = i => lr + i * (B - lr - 14) / Math.max(1, punkte.length - 1);\n  const y = val => or_ + (H - or_ - ur) * (1 - (val - min) / ((max - min) || 1));\n  const heuteI = punkte.findIndex(p => p.kuenftig);\n  const pfad = a2 => a2.map((p,i) => (i ? 'L' : 'M') + x(p.i).toFixed(1) + ' ' + y(p.wert).toFixed(1)).join(' ');\n  const mitI = punkte.map((p,i) => ({ ...p, i }));\n  const bisHeute = mitI.filter(p => !p.kuenftig);\n  const abHeute  = mitI.filter((p,i) => p.kuenftig || i === bisHeute.length - 1);\n  const getilgt = tilgungsende(v);\n  return `<div class=\"kennzahlen\">\n      <span class=\"wert\"><span class=\"k\">Stand heute<\u002Fspan><span class=\"v\">${fmt(verbindStandHeute(v))}<\u002Fspan><\u002Fspan>\n      <span class=\"wert\"><span class=\"k\">Anfangsstand<\u002Fspan><span class=\"v\">${fmt(v.anfangsstand)}<\u002Fspan><\u002Fspan>\n      <span class=\"wert\"><span class=\"k\">Getilgt<\u002Fspan><span class=\"v\">${Math.round(getilgtAnteil(v)*100)} %<\u002Fspan><\u002Fspan>\n      <span class=\"wert\"><span class=\"k\">Frei ab<\u002Fspan>\n        <span class=\"v\" style=\"font-size:15px\">${getilgt || 'nach Plan nicht'}<\u002Fspan><\u002Fspan>\n    <\u002Fdiv>\n    <svg class=\"verlauf\" viewBox=\"0 0 ${B} ${H}\" preserveAspectRatio=\"none\">\n      <line x1=\"${lr}\" y1=\"${y(0).toFixed(1)}\" x2=\"${B-14}\" y2=\"${y(0).toFixed(1)}\" stroke=\"#2a3542\"/>\n      <text x=\"4\" y=\"${(y(max)+4).toFixed(1)}\" font-size=\"10\" fill=\"#8b95a2\">${fmt(max,0)}<\u002Ftext>\n      <text x=\"4\" y=\"${(y(min)+4).toFixed(1)}\" font-size=\"10\" fill=\"#8b95a2\">${fmt(min,0)}<\u002Ftext>\n      <path d=\"${pfad(bisHeute)}\" fill=\"none\" stroke=\"#8ee6c8\" stroke-width=\"2.2\"/>\n      <path d=\"${pfad(abHeute)}\" fill=\"none\" stroke=\"#8ee6c8\" stroke-width=\"1.6\" stroke-dasharray=\"4 3\" opacity=\".75\"/>\n      ${heuteI > 0 ? `<line x1=\"${x(heuteI).toFixed(1)}\" y1=\"${or_}\" x2=\"${x(heuteI).toFixed(1)}\" y2=\"${H-ur}\"\n        stroke=\"#8b95a2\" stroke-dasharray=\"2 3\"/>\n        <text x=\"${x(heuteI).toFixed(1)}\" y=\"${or_+9}\" font-size=\"10\" fill=\"#8b95a2\" text-anchor=\"middle\">heute<\u002Ftext>` : ''}\n      ${punkte.map((p,i) => (p.m === 0 || i === 0)\n        ? `<text x=\"${x(i).toFixed(1)}\" y=\"${H-8}\" font-size=\"10\" fill=\"#8b95a2\" text-anchor=\"middle\">${p.j}<\u002Ftext>` : '').join('')}\n    <\u002Fsvg>\n    <p class=\"meldung\" style=\"margin-top:8px\">Durchgezogen bis heute — das ist der gerechnete Stand aus\n      Anfangsstand, gebuchten Zahlungen, Zins und Gebühr. Gestrichelt danach: die Prognose nach dem\n      Ratenplan.${v.zinssatz ? ' Gerechnet mit ' + v.zinssatz + ' % Monatszins' + (v.gebuehr ? ' und ' + fmt(v.gebuehr) + ' Gebühr.' : '.') : ''}<\u002Fp>`;\n}\n\n/* ---- Tilgungsprognose (E-15). Sie muss auch zeigen koennen,\n   dass eine Schuld NICHT getilgt wird. -------------------------------- */\nfunction tilgung(v) {\n  const a = ymOf(v.anfangsdatum);\n  let j = a.j, m = a.m, s = v.anfangsstand;\n  if (a.t >= tageImMonat(a.j, a.m)) { m++; if (m===12) { m=0; j++; } }\n  const z = v.zinssatz || 0, g = v.gebuehr || 0;\n  const rows = [];\n  let getilgtIm = null, jahresBeginn = s, letztesJahr = j;\n  for (let i = 0; i < 84 && s > 0.005; i++) {\n    const vor = s;\n    (v.erhoehungen||[]).forEach(e => { const d = ymOf(e.datum);\n      if (d.j===j && d.m===m) s += (e.art==='minderung' ? -e.betrag : e.betrag); });\n    const zins = rd(s * z/100), r = rate(v, j, m);\n    s = rd(s + zins + g - r);\n    rows.push({ j, m, vor, zins, geb:g, rate:r, nach:s });\n    if (s <= 0.005 && !getilgtIm) getilgtIm = MON_LANG[m] + ' ' + j;\n    m++; if (m === 12) { m = 0; j++; }\n  }\n  const waechst = rows.length > 12 && rows[rows.length-1].nach > rows[0].vor;\n  const kopf = getilgtIm\n    ? `<p class=\"notiz\"><b>Getilgt im ${getilgtIm}.<\u002Fb> Gerechnet mit ${z ? z + ' % Monatszins' : 'ohne Zins'}${g ? ' und ' + fmt(g) + ' Gebühr' : ''}.<\u002Fp>`\n    : `<p class=\"notiz meldung fehler\"><b>Diese Schuld wird nach dem vorliegenden Plan nicht getilgt.<\u002Fb>\n       ${waechst ? 'Sie wächst: Zins und Gebühr sind grösser als die Raten.' : 'Der Ratenplan endet, bevor der Stand null erreicht.'}\n       Stand nach ${rows.length} Monaten: ${fmt(rows.length ? rows[rows.length-1].nach : v.anfangsstand)}.<\u002Fp>`;\n  return kopf + `<table class=\"tilg\"><thead><tr><th>Monat<\u002Fth><th>Stand<\u002Fth><th>Zins<\u002Fth><th>Gebühr<\u002Fth>\n      <th>Zahlung<\u002Fth><th>danach<\u002Fth><\u002Ftr><\u002Fthead><tbody>${\n    rows.map(r => `<tr class=\"${r.m===11?'jahr':''}\"><td>${MON[r.m]} ${r.j}<\u002Ftd><td>${fmt(r.vor)}<\u002Ftd>\n      <td>${r.zins?fmt(r.zins):''}<\u002Ftd><td>${r.geb?fmt(r.geb):''}<\u002Ftd>\n      <td class=\"zahl\">${r.rate?fmt(r.rate):''}<\u002Ftd><td>${fmt(r.nach)}<\u002Ftd><\u002Ftr>`).join('')\n    }<\u002Ftbody><\u002Ftable>`;\n}\n\n/* ---- Sparziel -------------------------------------------------------- */\nfunction blattSparziel(id) {\n  const s = D.sparziele.find(x => x.id === id);\n  const st = sparstand(id, S.jahr, S.monat);\n  return { kennung:'Sparziel', titel:s.name, koerper:`<div class=\"kennzahlen\">\n      <span class=\"wert\"><span class=\"k\">Stand<\u002Fspan><span class=\"v\">${fmt(st)}<\u002Fspan><\u002Fspan>\n      <span class=\"wert\"><span class=\"k\">Ziel<\u002Fspan><span class=\"v\">${fmt(s.zielbetrag)}<\u002Fspan><\u002Fspan><\u002Fdiv>\n    <div class=\"maske\"><div class=\"feld\"><label>Betrag<\u002Flabel>\n        <input class=\"num\" id=\"spBetrag\" type=\"text\" inputmode=\"decimal\"><\u002Fdiv>\n      <div class=\"feld\"><label>Ab Konto<\u002Flabel><select id=\"spKonto\">${kontoOptionen('hhk')}<\u002Fselect><\u002Fdiv>\n      <div class=\"aktion\"><button class=\"knopf primaer\" id=\"btnSparen\">Einzahlen<\u002Fbutton><\u002Fdiv><\u002Fdiv>` };\n}\n\n/* ===================================================================\n   U-22 — Das Zeilenblatt\n   -------------------------------------------------------------------\n   Eine Budgetposition war bisher das einzige Stammdatum ohne eigenen\n   Ort: umbenennen ging in der Verwaltung, ausblenden in der Tabelle,\n   und der Zahlungsweg — «25. Dauerauftrag», die Angabe, die in der\n   Tabelle in jeder Zeile steht — war UEBERHAUPT NICHT bearbeitbar. Die\n   einzige schreibende Stelle im ganzen Quelltext setzte ihn beim\n   Anlegen auf `{tag:null, art:''}`; danach half nur noch die JSON von\n   Hand. Eine Angabe, die die App zeigt und nicht aendern laesst, ist\n   eine Behauptung, keine Zahl.\n\n   Gebaut nach dem Vorbild von blattSchuld: drei Reiter, das Blatt legt\n   sich ueber die Tabelle, Escape fuehrt zurueck.\n\n   Gespiegelte Zeilen bekommen KEINE Stammdaten. Was dort stuende, waere\n   an dieser Stelle nicht zu pflegen — die Zahlen kommen aus den\n   Ratenplaenen der Glaeubiger oder aus den erfassten Rechnungen. Das\n   Blatt zeigt stattdessen den Weg dorthin. Zwei Pflegestellen fuer\n   dieselbe Zahl waeren zwei Wahrheiten, und die zweite veraltet still.\n   =================================================================== */\n\n/* Die Zahlungswege, die im Bestand vorkommen (gelesen aus gaepp-daten.json,\n   Stand 18.08.2026). Die Liste ist ein Vorschlag und keine Schranke: das\n   Feld nimmt auch Freitext, weil eine Bank morgen einen Weg erfindet, den\n   niemand hier eingetragen hat, und deswegen keine App angefasst werden soll. */\nconst ZAHLUNGSWEGE = ['Gutschrift', 'Abzug', 'Dauerauftrag', 'eBill', 'Überweisung',\n                      'Bezug', 'Karte', 'LSV', 'Rückstellung'];\n\n/* ---- Periodizität ----------------------------------------------------\n   ACHTUNG, das ist eine ausdrueckliche Entscheidung und kein Versehen:\n   `periodizitaet` ist BESCHREIBEND. Sie rechnet nicht. Keine Summe, keine\n   Prognose, keine Faelligkeit, kein Vorschlag haengt daran — sie wird\n   angezeigt und sonst nichts.\n\n   Wer sie spaeter rechnen laesst, baut eine zweite Wahrheit neben die\n   zwoelf Monatszellen: eine Zeile mit `jaehrlich` und Werten in vier\n   Monaten waere dann widerspruechlich, und GAEPP muesste entscheiden,\n   welche der beiden Angaben gilt. Das Budget ist die Zellenmatrix. Die\n   Periodizität sagt einem Menschen, warum die Zellen so aussehen, wie\n   sie aussehen. Mehr darf sie nicht. */\nconst PERIODIZITAETEN = [\n  ['',                 '— nicht gesetzt —'],\n  ['monatlich',        'monatlich'],\n  ['vierteljaehrlich', 'vierteljährlich'],\n  ['halbjaehrlich',    'halbjährlich'],\n  ['jaehrlich',        'jährlich'],\n  ['unregelmaessig',   'unregelmässig']\n];\nfunction periodizitaetText(z) {\n  const p = (PERIODIZITAETEN.find(x => x[0] === (z.periodizitaet || '')) || PERIODIZITAETEN[0]);\n  return z.periodizitaet ? p[1] : '';\n}\n\nfunction blattZeile(id) {\n  const z = zeile(id);\n  if (!z) return { titel: 'Position', koerper: '<p class=\"meldung\">Diese Position gibt es nicht mehr.<\u002Fp>' };\n  const k = kategorie(z.kategorieId);\n  const gesp = gespiegelt(z);\n  /* Ohne Stammdaten faengt das Blatt beim Verlauf an — ein Reiter, der auf\n     eine Absage fuehrt, waere der schlechteste erste Eindruck. */\n  const reiter = _blatt.reiter && (!gesp || _blatt.reiter !== 'stamm')\n    ? _blatt.reiter : (gesp ? 'verlauf' : 'stamm');\n  _blatt.reiter = reiter;\n  const koerper = reiter === 'stamm'  ? (gesp ? zeileQuelle(z) : zeileStamm(z))\n                : reiter === 'verlauf' ? zeileVerlauf(z)\n                :                        zeileJahre(z);\n  const reiterliste = gesp\n    ? [['verlauf','Verlauf'],['jahre','Jahre']]\n    : [['stamm','Stammdaten'],['verlauf','Verlauf'],['jahre','Jahre']];\n  return {\n    weit: true,\n    kennung: (k ? k.name : 'Position') + ' · ' + zeitTitel(),\n    titel: z.bezeichnung,\n    reiter: reiterliste,\n    koerper: (gesp && reiter !== 'stamm' ? zeileQuelle(z) : '') + koerper,\n    fuss: `<button class=\"knopf\" data-zu>Schliessen<\u002Fbutton>`\n  };\n}\n/* Der Verweis auf die Quelle — er steht bei einer gespiegelten Zeile ueber\n   jedem Reiter, nicht nur auf einem. Wer den Verlauf ansieht und sich fragt,\n   wo die Zahlen herkommen, soll die Antwort dort finden, wo er steht. */\nfunction zeileQuelle(z) {\n  const rate0 = !!zeileGruppe[z.id];\n  return `<p class=\"notiz\" id=\"zQuelle\" data-zquelle=\"${rate0 ? 'verbind' : 'rechnung'}\"\n      style=\"border-left:2px solid var(--accent);padding-left:11px;margin-bottom:14px\">\n    <b>Diese Position wird hier nicht gepflegt.<\u002Fb> Ihre Zahlen kommen aus\n    ${rate0 ? 'den Ratenplänen der Gläubiger dieser Gruppe'\n            : 'den erfassten Rechnungen'} und ändern sich dort.\n    <span style=\"display:inline-block;margin-top:7px\">\n      <button class=\"knopf klein\" data-spring=\"${z.id}\">Zur Quelle<\u002Fbutton><\u002Fspan><\u002Fp>`;\n}\n\n/* ---- Reiter 1: Stammdaten ------------------------------------------- */\nfunction zeileStamm(z) {\n  const w = z.zahlungsweg || {};\n  const jahre = Object.keys(D.budget).map(Number).sort();\n  /* Ein ausAb, das auf kein Budgetjahr zeigt, darf nicht aus der Liste\n     fallen — sonst setzte ein Speichern es stillschweigend zurueck. */\n  const ausJahre = jahre.slice();\n  if (z.ausAb != null && z.ausAb !== 0 && ausJahre.indexOf(z.ausAb) < 0) ausJahre.push(z.ausAb);\n  return `<div class=\"maske\" id=\"maskeZeile\">\n    <div class=\"feld voll\"><label>Bezeichnung<\u002Flabel>\n      <input type=\"text\" id=\"zsName\" value=\"${htmlAttr(z.bezeichnung)}\"><\u002Fdiv>\n    <div class=\"feld\"><label>Kategorie<\u002Flabel>\n      <select id=\"zsKat\">${D.kategorien.slice().sort((a,b)=>a.rang-b.rang).map(c =>\n        `<option value=\"${c.id}\"${c.id===z.kategorieId?' selected':''}>${htmlText(c.name)}${\n          c.kontoId && konto(c.kontoId) ? ' — ' + htmlText(konto(c.kontoId).name) : ''}<\u002Foption>`).join('')}<\u002Fselect><\u002Fdiv>\n    <div class=\"feld\"><label>Ausblenden<\u002Flabel>\n      <select id=\"zsAusAb\">\n        <option value=\"\"${z.ausAb == null ? ' selected' : ''}>immer sichtbar<\u002Foption>\n        <option value=\"0\"${z.ausAb === 0 ? ' selected' : ''}>ganz aus<\u002Foption>\n        ${ausJahre.sort((a,b)=>a-b).map(j =>\n          `<option value=\"${j}\"${z.ausAb === j ? ' selected' : ''}>ab ${j} aus<\u002Foption>`).join('')}\n      <\u002Fselect><\u002Fdiv>\n    <div class=\"feld\"><label>Zahlungsweg<\u002Flabel>\n      <input type=\"text\" id=\"zsArt\" list=\"zsArten\" value=\"${htmlAttr(w.art || '')}\"\n             placeholder=\"z.B. Dauerauftrag — frei wählbar\">\n      <datalist id=\"zsArten\">${ZAHLUNGSWEGE.map(a => `<option value=\"${htmlAttr(a)}\"><\u002Foption>`).join('')}<\u002Fdatalist><\u002Fdiv>\n    <div class=\"feld\"><label>Tag im Monat<\u002Flabel>\n      <input class=\"num\" id=\"zsTag\" type=\"text\" inputmode=\"numeric\"\n             value=\"${w.tag ? w.tag : ''}\" placeholder=\"leer = kein fester Tag\"><\u002Fdiv>\n    <div class=\"feld\"><label>Periodizität<\u002Flabel>\n      <select id=\"zsPer\">${PERIODIZITAETEN.map(([v,n]) =>\n        `<option value=\"${v}\"${(z.periodizitaet||'')===v?' selected':''}>${n}<\u002Foption>`).join('')}<\u002Fselect><\u002Fdiv>\n    <div class=\"feld haken voll\"><input type=\"checkbox\" id=\"zsGegen\" ${z.gegenrichtung?'checked':''}>\n      <label for=\"zsGegen\">Gegenläufig — mindert die Summe ihrer Kategorie, statt sie zu erhöhen<\u002Flabel><\u002Fdiv>\n    <div class=\"feld voll\"><span class=\"meldung\">Die Periodizität ist eine Beschreibung und\n      rechnet nicht: sie sagt, warum die zwölf Monatszellen so aussehen, wie sie aussehen.\n      Was gerechnet wird, steht in den Zellen — nirgends sonst.<\u002Fspan><\u002Fdiv>\n    <div class=\"aktion\"><button class=\"knopf primaer\" id=\"btnZeileSpeichern\">Speichern<\u002Fbutton>\n      <span class=\"hint\" id=\"zsHint\"><\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>`;\n}\nfunction zeileSpeichern() {\n  const z = zeile(_blatt.id);\n  if (!z) return;\n  /* Im Schreibschutz aendert GAEPP nichts — auch nicht das, was harmlos\n     aussieht: ein umgehaengtes ausAb verschiebt Summen über die ganze Tabelle,\n     und zuruecknehmen liesse es sich dort nicht (A-88). */\n  if (_ro) { $('#zsHint').textContent = 'GÄPP ist schreibgeschützt und ändert nichts.'; return; }\n  const name = ($('#zsName').value || '').trim();\n  if (!name) { $('#zsHint').textContent = 'Ohne Bezeichnung geht es nicht.'; return; }\n  const tagRoh = ($('#zsTag').value || '').trim();\n  const tag = parseInt(tagRoh, 10);\n  if (tagRoh && (!(tag >= 1) || tag > 31)) {\n    $('#zsHint').textContent = 'Der Tag muss zwischen 1 und 31 liegen.'; return; }\n  const ausRoh = $('#zsAusAb').value;\n  /* Auch das ist eine Aenderung, die man zurueckhaben will: wer die Kategorie\n     umhaengt oder ein ausAb setzt, verschiebt Summen ueber die ganze Tabelle.\n     Vor der ersten Zuweisung, wie ueberall (U-20). */\n  merkeStand('«' + name + '» geändert');\n  z.bezeichnung   = name;\n  z.kategorieId   = $('#zsKat').value;\n  z.ausAb         = ausRoh === '' ? null : parseInt(ausRoh, 10);\n  z.periodizitaet = $('#zsPer').value || '';\n  z.gegenrichtung = $('#zsGegen').checked;\n  z.zahlungsweg   = { tag: tagRoh ? tag : null, art: ($('#zsArt').value || '').trim() };\n  persist();\n  blattZeichnen();\n  $('#zsHint').textContent = 'Gespeichert.';\n}\n\n/* ---- Reiter 2: Verlauf ----------------------------------------------\n   verlaufSvg() kommt aus den Berichten und nimmt zwei gleich lange\n   Arrays, sonst nichts — genau deshalb laesst sie sich hier\n   wiederverwenden, ohne dass ein Bericht davon weiss. */\nfunction zeileVerlauf(z) {\n  const art = _blatt.verlaufArt === 'jahre' ? 'jahre' : 'monate';\n  const jahre = Object.keys(D.budget).map(Number).sort();\n  const punkte = art === 'jahre'\n    ? jahre.map(j => zeilenJahr(z, j))\n    : [...Array(12).keys()].map(m => zeilenwert(z, S.jahr, m));\n  const beschr = art === 'jahre' ? jahre.map(String) : MON.slice();\n  const summe = rd(punkte.reduce((a,b) => a + b, 0));\n  const gezeigt = punkte.filter(p => Math.abs(p) >= 0.005).length;\n  return `<div class=\"kennzahlen\">\n      <span class=\"wert\"><span class=\"k\">${art === 'jahre' ? 'Alle Jahrgänge' : S.jahr}<\u002Fspan>\n        <span class=\"v\">${fmt(summe)}<\u002Fspan><\u002Fspan>\n      <span class=\"wert\"><span class=\"k\">${art === 'jahre' ? 'Jahre mit Wert' : 'Monate mit Wert'}<\u002Fspan>\n        <span class=\"v\">${gezeigt} von ${punkte.length}<\u002Fspan><\u002Fspan>\n      ${periodizitaetText(z) ? `<span class=\"wert\"><span class=\"k\">Periodizität<\u002Fspan>\n        <span class=\"v\" style=\"font-size:15px\">${periodizitaetText(z)}<\u002Fspan><\u002Fspan>` : ''}\n    <\u002Fdiv>\n    <div class=\"feld voll\" style=\"margin:14px 0 10px\">\n      <span class=\"schalter\" role=\"group\">\n        <button data-zvl=\"monate\" aria-pressed=\"${art==='monate'}\">Monate ${S.jahr}<\u002Fbutton>\n        <button data-zvl=\"jahre\"  aria-pressed=\"${art==='jahre'}\">Jahreswerte<\u002Fbutton><\u002Fspan><\u002Fdiv>\n    ${verlaufSvg(punkte, beschr, 190)}\n    <p class=\"meldung\">${art === 'jahre'\n      ? 'Ein Punkt je Budgetjahr — die Summe der zwölf Monate.'\n      : 'Ein Punkt je Monat des Jahres ' + S.jahr + '.'}\n      Gezeigt wird das Budgetierte, nicht das Gebuchte.<\u002Fp>`;\n}\n\n/* ---- Reiter 3: Jahre ------------------------------------------------- */\nfunction zeileJahre(z) {\n  const jahre = Object.keys(D.budget).map(Number).sort();\n  const gesp = gespiegelt(z);\n  const kat = kategorie(z.kategorieId);\n  return `<p class=\"notiz\">${ausAbText(z)\n      ? (z.ausAb === 0 ? '<b>Diese Position ist ganz ausgeblendet<\u002Fb> — sie steht in keinem Jahrgang.'\n                       : '<b>Ausgeblendet ab ' + z.ausAb + '.<\u002Fb> Die Jahre davor zeigen sie weiter, '\n                         + 'und ihre Werte bleiben erhalten.')\n      : 'Diese Position ist in allen Jahrgängen sichtbar.'}\n    ${kat && kat.ausAb != null\n      ? ' Ihre Kategorie «' + htmlText(kat.name) + '» ist ' + ausAbText(kat)\n        + ' — das nimmt die Position in denselben Jahren mit weg.' : ''}<\u002Fp>\n    <table class=\"journal\" style=\"margin-top:12px\"><thead><tr>\n        <th>Jahrgang<\u002Fth><th class=\"r\">Soll<\u002Fth><th class=\"r\">Jahressumme<\u002Fth><th>Sichtbar<\u002Fth>\n      <\u002Ftr><\u002Fthead><tbody>${jahre.map(j => {\n        const sicht = zeileSicht(z, j);\n        const soll = zeilenSoll(z, j);\n        return `<tr><td class=\"tag\">${j}<\u002Ftd>\n          <td class=\"r num\">${gesp && soll === null ? '—' : fmt0(soll)}<\u002Ftd>\n          <td class=\"r num\">${fmt0(zeilenJahr(z, j))}<\u002Ftd>\n          <td>${sicht ? '' : '<span class=\"meldung\">ausgeblendet<\u002Fspan>'}<\u002Ftd><\u002Ftr>`;\n      }).join('')}<\u002Ftbody><\u002Ftable>`;\n}\n\n/* ===================================================================\n   GAEPP — Belege lesen (A-55).\n\n   Aus einem abgelegten PDF holt GAEPP heraus, was drinsteht: Betrag,\n   Faelligkeit, Rechnungssteller, Rechnungsnummer und Referenz. Ohne\n   Bibliothek und ohne Netz — die Textstroeme eines PDF liegen entweder\n   im Klartext oder mit Deflate gepackt vor, und Deflate kann der Browser\n   selbst (DecompressionStream).\n\n   Zwei Regeln, die diesen Teil tragen:\n   - **Erkanntes wird als erkannt gekennzeichnet, Nichterkanntes bleibt leer.**\n     Eine geratene Zahl auf einer Rechnung ist schlimmer als ein leeres Feld.\n   - **Nichts wird still uebernommen.** Was GAEPP gefunden hat, steht sichtbar\n     ueber der Maske, und jedes Feld laesst sich ueberschreiben.\n   =================================================================== */\n\n/* Deflate direkt ueber Writer und Reader — der Umweg ueber Blob und Response\n   scheitert, wenn die Datei aus dem Dateisystem geoeffnet wurde (file://). */\nasync function entpacken(bytes, art) {\n  const stuecke = [];\n  let n = 0;\n  try {\n    const ds = new DecompressionStream(art);\n    const schreiber = ds.writable.getWriter();\n    schreiber.write(bytes).catch(() => {});\n    schreiber.close().catch(() => {});\n    const leser = ds.readable.getReader();\n    while (true) {\n      const { value, done } = await leser.read();\n      if (done) break;\n      stuecke.push(value); n += value.length;\n      if (n > 12e6) break;                    /* Notbremse bei riesigen Stroemen */\n    }\n  } catch (err) {\n    /* «Junk found after end of compressed data» heisst: der Strom war gueltig und\n       danach stand noch das Trennzeichen vor endstream. Was gelesen wurde, gilt.\n       Bei einem echten Fehler ist die Liste leer und wir geben null zurueck. */\n  }\n  if (!n) return null;\n  const alles = new Uint8Array(n);\n  let k = 0;\n  for (const st of stuecke) { alles.set(st, k); k += st.length; }\n  return new TextDecoder('latin1').decode(alles);\n}\n\n/* ---- Textstroeme aus einem PDF ------------------------------------- */\nasync function pdfText(datei) {\n  const roh = new Uint8Array(await datei.arrayBuffer());\n  const kopf = new TextDecoder('latin1').decode(roh.subarray(0, 8));\n  if (!kopf.startsWith('%PDF')) return '';\n  const ganz = new TextDecoder('latin1').decode(roh);\n  const teile = [];\n  let i = 0;\n  while (true) {\n    const a = ganz.indexOf('stream', i);\n    if (a < 0) break;\n    /* «endstream» enthaelt «stream» — ohne diese Pruefung verschiebt sich alles. */\n    if (ganz.slice(a - 3, a) === 'end') { i = a + 6; continue; }\n    let b = a + 6;\n    if (ganz[b] === '\\r') b++;\n    if (ganz[b] === '\\n') b++;\n    const e = ganz.indexOf('endstream', b);\n    if (e < 0) break;\n    i = e + 9;\n    const roh2 = roh.subarray(b, e);\n    let text = null;\n    /* Erst ungepackt versuchen, dann mit Deflate und mit rohem Deflate. */\n    const probe = new TextDecoder('latin1').decode(roh2.subarray(0, 400));\n    if (/BT|Tj|TJ/.test(probe) && !/[\\x00-\\x08\\x0e-\\x1f]{4}/.test(probe.slice(0,40))) {\n      text = new TextDecoder('latin1').decode(roh2);\n    } else {\n      for (const art of ['deflate', 'deflate-raw']) {\n        const t = await entpacken(roh2, art);\n        if (t && /BT|Tj|TJ/.test(t)) { text = t; break; }\n      }\n    }\n    if (text) teile.push(text);\n  }\n  /* Aus den Textoperatoren die Zeichenketten holen. */\n  let out = '';\n  for (const t of teile) {\n    const klammern = t.match(/\\((?:\\\\.|[^()\\\\])*\\)/g) || [];\n    out += klammern.map(s => s.slice(1, -1)\n      .replace(/\\\\([nrt])/g, ' ')\n      .replace(/\\\\([()\\\\])/g, '$1')\n      .replace(/\\\\([0-7]{1,3})/g, (m, o) => String.fromCharCode(parseInt(o, 8)))).join(' ') + ' ';\n    const hex = t.match(/<([0-9A-Fa-f\\s]{4,})>/g) || [];\n    for (const h of hex) {\n      const z = h.replace(/[<>\\s]/g, '');\n      if (z.length % 2) continue;\n      let s = '';\n      for (let k = 0; k < z.length; k += 2) {\n        const c = parseInt(z.substr(k, 2), 16);\n        if (c >= 32 && c < 255) s += String.fromCharCode(c);\n      }\n      if (s.length > 3) out += s + ' ';\n    }\n  }\n  return out.replace(/\\s+/g, ' ').trim();\n}\n\n/* ---- Aus dem Text die Angaben herausfischen ------------------------- */\n/* Zwei Stufen: «weich» behaelt Punkt, Komma und Apostroph — sonst zerfaellt\n   ein Betrag in zwei Zahlen und ist nicht mehr zu finden. «hart» wirft alles\n   weg und dient nur dem Namensabgleich.\n   Hier stand frueher ein Betrag aus Albrechts Rechnungen als Beispiel; er ist\n   am 17.08.2026 entfernt worden (A-78 gilt auch fuer Kommentare). */\nfunction weich(s) {\n  return String(s).toLowerCase()\n    .replace(/ä/g,'a').replace(/ö/g,'o').replace(/ü/g,'u').replace(/é|è|ê/g,'e').replace(/ß/g,'ss')\n    .replace(/[^a-z0-9 .,'\\/-]/g,' ').replace(/\\s+/g,' ').trim();\n}\nfunction ohneAkzent(s) {\n  return weich(s).replace(/[^a-z0-9 ]/g,' ').replace(/\\s+/g,' ').trim();\n}\nfunction belegLesen(text, dateiname) {\n  const f = { betrag:null, faelligkeit:null, stellerId:null, stellerName:null,\n              nummer:null, referenz:null, iban:null, gefunden:[], text };\n  const T = text || '';\n  const flach = weich(T);          /* fuer Betraege und Daten */\n  const hart  = ohneAkzent(T);     /* fuer den Namensabgleich */\n\n  /* --- Betrag: erst dort, wo die Rechnung ihn selbst benennt --- */\n  const geld = '([0-9]{1,3}(?:[\\' ][0-9]{3})*(?:[.,][0-9]{2}))';\n  const betragMuster = [\n    new RegExp('betrag von chf ' + geld, 'i'),\n    new RegExp('rechnungsbetrag[^0-9]{0,20}' + geld, 'i'),\n    new RegExp('zu zahlen[^0-9]{0,20}' + geld, 'i'),\n    new RegExp('total[^0-9]{0,20}chf ?' + geld, 'i'),\n    new RegExp('chf ' + geld + '[^0-9]{0,12}bis', 'i'),\n    new RegExp('offener? (?:betrag|saldo)[^0-9]{0,20}' + geld, 'i')\n  ];\n  const zuZahl = x => rd(parseFloat(String(x).replace(/[' ]/g,'').replace(',','.')));\n  for (const m of betragMuster) {\n    const t = flach.match(m);\n    if (t) { f.betrag = zuZahl(t[1]); f.gefunden.push('Betrag'); break; }\n  }\n  /* Rueckfall: steht genau ein Betrag hinter «CHF», ist er es fast immer. */\n  if (f.betrag === null) {\n    const alle = [...flach.matchAll(new RegExp('chf ?' + geld, 'gi'))].map(t => zuZahl(t[1]));\n    const einzig = [...new Set(alle)];\n    if (einzig.length === 1) { f.betrag = einzig[0]; f.gefunden.push('Betrag'); }\n  }\n\n  /* --- Faelligkeit: «zahlbar bis», «bis TT.MM.JJJJ», «faellig am» --- */\n  const dat = '([0-3]?[0-9])[.\\\\/ ]([01]?[0-9])[.\\\\/ ](20[0-9]{2})';\n  const datumMuster = [\n    new RegExp('zahlbar bis(?: zum)?[^0-9]{0,10}' + dat, 'i'),\n    new RegExp('bis(?: zum)?[^0-9]{0,10}' + dat, 'i'),\n    new RegExp('fallig(?: am)?[^0-9]{0,10}' + dat, 'i'),\n    new RegExp('zahlungsziel[^0-9]{0,10}' + dat, 'i')\n  ];\n  for (const m of datumMuster) {\n    const t = flach.match(m);\n    if (t) {\n      const j = +t[3], mo = +t[2], tg = +t[1];\n      if (mo >= 1 && mo <= 12 && tg >= 1 && tg <= 31) {\n        f.faelligkeit = iso(j, mo - 1, tg); f.gefunden.push('Fälligkeit'); break;\n      }\n    }\n  }\n\n  /* --- Rechnungssteller: Abgleich gegen die gepflegte Liste --- */\n  let best = null;\n  D.steller.filter(s => s.aktiv !== false && s.id !== 'st_sonstige').forEach(s => {\n    /* Auch Teilnamen: Bei einem zusammengesetzten Firmennamen genuegt ein\n       Wort daraus, sofern es mindestens vier Zeichen hat. Das laengste\n       gefundene Wort gewinnt. (Das Beispiel an dieser Stelle nannte einen\n       echten Rechnungssteller und ist am 17.08.2026 entfernt worden.) */\n    ohneAkzent(s.name).split(' ').filter(w => w.length >= 4).forEach(wort => {\n      if (hart.includes(wort) && (!best || wort.length > best.laenge))\n        best = { s, laenge: wort.length };\n    });\n  });\n  if (best) { f.stellerId = best.s.id; f.stellerName = best.s.name; f.gefunden.push('Rechnungssteller'); }\n\n  /* --- Rechnungsnummer, QR-Referenz, IBAN --- */\n  const nr = T.match(/(?:Rechnung(?:s)?(?:\\s*Nr\\.?|nummer)?|Monatsrechnung|Beleg(?:nr)?)[^0-9]{0,12}((?:\\d[\\d\\s]{5,})\\d)/i);\n  if (nr) { f.nummer = nr[1].replace(/\\s+/g,' ').trim(); f.gefunden.push('Rechnungsnummer'); }\n  const ref = T.replace(/\\s/g,'').match(/\\b(\\d{27})\\b/);\n  if (ref) { f.referenz = ref[1]; f.gefunden.push('Referenz'); }\n  const iban = T.replace(/\\s/g,'').match(/\\b(CH\\d{2}[0-9A-Z]{15,17})\\b/);\n  if (iban) { f.iban = iban[1]; f.gefunden.push('IBAN'); }\n\n  /* --- Notfalls das Datum aus dem Dateinamen --- */\n  if (!f.faelligkeit && dateiname) {\n    const d = String(dateiname).match(/(20[0-9]{2})[-_ ]?([01][0-9])[-_ ]?([0-3][0-9])/);\n    if (d) { f.faelligkeit = d[1] + '-' + d[2] + '-' + d[3]; f.gefunden.push('Datum aus dem Dateinamen'); }\n  }\n  return f;\n}\n\n/* Wird nach dem Ablegen einer Datei aufgerufen; das Ergebnis landet in _gelesen. */\nlet _gelesen = null;\nasync function belegAuswerten(datei) {\n  _gelesen = { laeuft:true, name:datei.name };\n  try {\n    const t = /\\.pdf$/i.test(datei.name) ? await pdfText(datei) : '';\n    _gelesen = belegLesen(t, datei.name);\n    _gelesen.name = datei.name;\n    _gelesen.keinText = !t;\n  } catch (err) {\n    _gelesen = { name:datei.name, gefunden:[], fehler:String(err.message || err) };\n  }\n  return _gelesen;\n}\n\n/* ===================================================================\n   GAEPP — Verwaltung, Daten und Sync, Rechnungen, Serien, Belege.\n   Zwei getrennte Elemente in der Bedienleiste, beide sichtbar (A-08, A-09).\n   =================================================================== */\n\n/* ---- Blatt «Daten und Sync» (A-09, Formensprache D) ------------------ */\nfunction blattSync() {\n  return { titel: 'Daten und Sync', koerper: `<div class=\"maske\">\n      <div class=\"feld voll\"><label>Datenrepository<\u002Flabel>\n        <input type=\"text\" id=\"ghRepo\" value=\"${GH.repo}\" placeholder=\"AlbrechtBuehler/GAEPP_DATA\"><\u002Fdiv>\n      <div class=\"feld\"><label>Zweig<\u002Flabel>\n        <input type=\"text\" id=\"ghBranch\" value=\"${GH.branch || 'main'}\"><\u002Fdiv>\n      <div class=\"feld\"><label>Zugriffs-Token<\u002Flabel>\n        <input type=\"password\" id=\"ghToken\" value=\"${GH.token}\" placeholder=\"github_pat_…\"><\u002Fdiv>\n      <div class=\"feld voll\"><span class=\"meldung\">Bleibt nur in diesem Browser. Feinkorn-Token mit\n        <b>Contents: Read and write<\u002Fb> auf genau dieses eine Repo.<\u002Fspan><\u002Fdiv>\n      <div class=\"feld voll\"><label>Stand<\u002Flabel>\n        <span class=\"wert\"><span class=\"v\" style=\"font-size:14px\" id=\"syncStand\">${$('#syncText') ? $('#syncText').textContent : '—'}<\u002Fspan>\n        <span class=\"z\">Schema der Datei ${D ? D.meta.schemaVersion : '—'} · Schema dieser App ${SCHEMA_APP}<\u002Fspan><\u002Fspan><\u002Fdiv>\n      <div class=\"aktion\">\n        <button class=\"knopf\" id=\"btnPull\">Jetzt laden<\u002Fbutton>\n        <button class=\"knopf\" id=\"btnPush\">Jetzt sichern<\u002Fbutton>\n        <span style=\"flex:1\"><\u002Fspan>\n        <button class=\"knopf\" id=\"btnJsonAb\">Daten sichern (JSON)<\u002Fbutton>\n        <button class=\"knopf\" id=\"btnJsonAuf\">Daten laden (JSON)<\u002Fbutton>\n      <\u002Fdiv>\n      <div class=\"feld voll\"><span class=\"meldung\">Die Sicherung enthält <b>nur die Zahlen<\u002Fb>.\n        Die Belege liegen daneben in <b>03 - Dokumente<\u002Fb> und kommen nicht mit.<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>`,\n    fuss: `<button class=\"knopf\" data-zu>Schliessen<\u002Fbutton>\n           <button class=\"knopf primaer\" id=\"btnSyncSpeichern\">Schliessen und Speichern<\u002Fbutton>` };\n}\n\n/* ---- Verwaltung (A-08, A-10, Formensprache M) ------------------------ */\n/* ===================================================================\n   U-18 — Verwaltung als Seite\n   -------------------------------------------------------------------\n   Neun gleichrangige Karten in einem Modal waren eine Wand. Als Seite\n   sind sie in drei Abschnitte gegliedert: was man pflegt, was still-\n   gelegt ist, was eingestellt wird. Gleiche Bauteile, andere Ordnung.\n   =================================================================== */\nfunction vwListe(items, art) {\n  return `<div class=\"vw-liste\">${items.map(o => `\n    <div class=\"z ${o.aktiv === false ? 'aus' : ''}\">\n      <span class=\"n\">${o.name}<\u002Fspan>\n      <span class=\"zw\">\n        <button class=\"knopf klein\" data-vwum=\"${art}:${o.id}\">Umbenennen<\u002Fbutton>\n        <button class=\"knopf klein\" data-vwaus=\"${art}:${o.id}\">${o.aktiv === false ? 'Einblenden' : 'Ausblenden'}<\u002Fbutton>\n        <button class=\"knopf klein gefahr\" data-vwloesch=\"${art}:${o.id}\">Löschen<\u002Fbutton>\n      <\u002Fspan><\u002Fdiv>`).join('')}<\u002Fdiv>`;\n}\n/* vwKarten() lieferte die neun Karten der alten Verwaltung im Modal. Seit dem\n   Umbau zur Seite (U-18/U-19) baut vwInhalt(seite) den Inhalt, und vwKarten\n   wurde von nirgends mehr gerufen — nachgeprueft ueber den ganzen Quelltext\n   und die Pruefstaende. Entfernt am 18.08.2026: zwei Bauplaene fuer dieselbe\n   Verwaltung heissen, dass eine Aenderung an der falschen landen kann.\n   vwListe() bleibt, sie traegt die Listen der neuen Seite. */\n\n/* ===================================================================\n   U-19 — Verwaltung: Register links, Inhalt rechts, Struktur als Baum\n   -------------------------------------------------------------------\n   Neun Karten nebeneinander waren unruhig, weil sie Ungleiches gleich\n   behandelten: eine Liste mit 37 Zeilen neben einem einzelnen Eingabe-\n   feld. Jetzt liegt links ein Register und rechts genau eine Sache.\n\n   Und der wichtigste Teil, die Struktur, ist kein Nebeneinander mehr,\n   sondern das, was er in Wahrheit ist: Konto traegt Kategorie traegt\n   Position. Das steht sonst nirgends — die Positionsliste musste die\n   Kategorie bisher in jeden Namen hineinschreiben.\n   =================================================================== */\nconst VW_SEITEN = [\n  ['struktur', 'Struktur',          'Konten, Kategorien und Positionen'],\n  ['steller',  'Rechnungssteller',  'wer dir Rechnungen schickt'],\n  ['sparziele','Sparziele',         'worauf du hinsparst'],\n  ['aus',      'Ausgeblendet',      'stillgelegte Zeilen und Kategorien'],\n  ['-',        '',                  ''],\n  ['lohntag',  'Lohntag',           'Bezugspunkt der Tageszahl'],\n  ['jahre',    'Budgetjahre',       'welche Jahrgänge es gibt'],\n  ['ordner',   'Ordner & Sicherung','wohin Belege abgelegt werden']\n];\nfunction vwZaehler(id) {\n  if (id === 'steller')   return D.steller.length;\n  if (id === 'sparziele') return D.sparziele.length;\n  /* U-21: gezaehlt wird, was ein ausAb TRAEGT — nicht, was heute unsichtbar\n     ist. Eine Zeile, die erst 2029 wegfaellt, ist bereits eine Entscheidung,\n     die man hier wiederfinden koennen muss. */\n  if (id === 'aus')       return D.zeilen.filter(z => z.ausAb != null).length\n                               + D.kategorien.filter(k => k.ausAb != null).length;\n  if (id === 'struktur')  return D.zeilen.length;\n  return null;\n}\n/* U-21: wie ein ausAb dem Menschen gegenueber heisst. Die Sentinel 0 ist\n   kein Jahr und darf nie als «ab 0» erscheinen. */\nfunction ausAbText(o) {\n  if (!o || o.ausAb == null) return '';\n  return o.ausAb === 0 ? 'ganz aus' : 'ab ' + o.ausAb;\n}\n/* U-21: die drei Knoepfe eines Objekts mit ausAb. Sichtbar heisst: ab dem\n   eingestellten Jahr wegnehmen oder ganz; unsichtbar heisst: zurueckholen.\n   Der Zusatz nach dem Doppelpunkt sagt vwAusblenden, welcher der drei Faelle\n   gemeint ist — ein Umschalter koennte drei Zustaende nicht auseinanderhalten. */\nfunction ausKnoepfe(art, o) {\n  if (o.ausAb != null)\n    return `<button class=\"knopf klein\" data-vwaus=\"${art}:${o.id}:ein\">Einblenden<\u002Fbutton>`;\n  return `<button class=\"knopf klein\" data-vwaus=\"${art}:${o.id}:ab\">ab ${S.jahr} aus<\u002Fbutton>\n          <button class=\"knopf klein\" data-vwaus=\"${art}:${o.id}:ganz\">ganz aus<\u002Fbutton>`;\n}\nfunction vwBaum() {\n  const zu = S.vwZu || [];\n  const konten = D.konten.slice().sort((a,b) => a.rang - b.rang);\n  return `<div class=\"baum\">${konten.map(k => {\n    const kats = D.kategorien.filter(c => c.kontoId === k.id).sort((a,b) => a.rang - b.rang);\n    const nZ = kats.reduce((a,c) => a + D.zeilen.filter(z => z.kategorieId === c.id).length, 0);\n    const kZu = zu.includes('k_' + k.id);\n    return `<div class=\"ast konto ${k.aktiv === false ? 'aus' : ''}\">\n      <div class=\"knoten n1\">\n        <button class=\"auf\" data-vwklapp=\"k_${k.id}\" aria-expanded=\"${!kZu}\"><span class=\"chev\">▾<\u002Fspan><\u002Fbutton>\n        <span class=\"nr num\">${k.nr}<\u002Fspan>\n        <span class=\"name\">${k.name}<\u002Fspan>\n        <span class=\"rolle\">${k.rolle || ''}<\u002Fspan>\n        <span class=\"zahl\">${kats.length} ${kats.length === 1 ? 'Kategorie' : 'Kategorien'} · ${nZ} ${nZ === 1 ? 'Position' : 'Positionen'}<\u002Fspan>\n        <!-- U-30: «Ändern» ERSETZT «Umbenennen» und kommt nicht dazu. Zwei\n             Gruende, in dieser Reihenfolge:\n             Der Name steht in der Maske, gleich als drittes Feld — ein\n             zweiter Weg zu demselben Feld ist eine zweite Stelle, an der\n             er geschrieben wird, und die eine davon prueft nichts.\n             Und: die Knoepfe stehen in derselben Zeile wie «2 Kategorien ·\n             7 Positionen». Ein vierter Knopf schnitte diese Angabe auf\n             «2 K» zusammen — der Preis fuer einen Griff, den der neue\n             ohnehin mitbringt. Kategorie und Position behalten ihr\n             «Umbenennen»: sie haben keine solche Maske. -->\n        <span class=\"zw\"><button class=\"knopf klein\" data-kaend=\"${k.id}\">Ändern<\u002Fbutton>\n          <button class=\"knopf klein\" data-vwaus=\"konto:${k.id}\">${k.aktiv === false ? 'Einblenden' : 'Ausblenden'}<\u002Fbutton>\n          <button class=\"knopf klein gefahr\" data-vwloesch=\"konto:${k.id}\">Löschen<\u002Fbutton><\u002Fspan>\n      <\u002Fdiv>\n      ${kZu ? '' : kats.map(c => {\n        const zeilen = D.zeilen.filter(z => z.kategorieId === c.id).sort((a,b) => a.rang - b.rang);\n        const cZu = zu.includes('c_' + c.id);\n        /* U-28: Der Ast traegt seine Kategorie — er ist das Band, in dem\n           ein Zug gilt. Ausserhalb gibt es kein Ziel. */\n        return `<div class=\"ast kategorie ${katSicht(c, S.jahr) ? '' : 'aus'}\" data-kat=\"${c.id}\">\n          <div class=\"knoten n2\">\n            <button class=\"auf\" data-vwklapp=\"c_${c.id}\" aria-expanded=\"${!cZu}\"><span class=\"chev\">▾<\u002Fspan><\u002Fbutton>\n            <span class=\"name\">${c.name}<\u002Fspan>\n            <span class=\"rolle\">${c.richtung === 'ein' ? 'Einnahme' : 'Ausgabe'}${ausAbText(c) ? ' · ' + ausAbText(c) : ''}<\u002Fspan>\n            <span class=\"zahl\">${zeilen.length} ${zeilen.length === 1 ? 'Position' : 'Positionen'}<\u002Fspan>\n            <span class=\"zw\"><button class=\"knopf klein\" data-vwum=\"kategorie:${c.id}\">Umbenennen<\u002Fbutton>\n              ${ausKnoepfe('kategorie', c)}\n              <button class=\"knopf klein gefahr\" data-vwloesch=\"kategorie:${c.id}\">Löschen<\u002Fbutton><\u002Fspan>\n          <\u002Fdiv>\n          ${cZu ? '' : (zeilen.length ? zeilen.map(z => {\n            const soll = (D.budget[String(S.jahr)] && D.budget[String(S.jahr)][z.id] || {}).soll;\n            const gesp = gespiegelt(z);\n            /* U-21: Eine Zeile kann aus zwei Gruenden fehlen — wegen ihres\n               eigenen ausAb oder wegen dem ihrer Kategorie. Im zweiten Fall\n               waere ein Knopf «Einblenden» eine Luege: man klickt, und nichts\n               geschieht, weil die Kategorie die Zeile weiter wegnimmt. Also\n               steht dort der Grund statt des Knopfs. */\n            const nurKat = z.ausAb == null && !katSicht(c, S.jahr);\n            return `<div class=\"knoten n3 ${zeileSicht(z, S.jahr) ? '' : 'aus'}\"\n              data-zeile=\"${z.id}\" data-zkat=\"${c.id}\" data-oart=\"zeile\">\n              ${zeilenGriff(z, true)}<span class=\"name\">${z.bezeichnung}<\u002Fspan>\n              <span class=\"rolle\">${zahlungsweg(z) || (gesp ? 'gespiegelt' : '')}${ausAbText(z) ? ' · ' + ausAbText(z) : ''}<\u002Fspan>\n              <span class=\"zahl num\">${gesp ? '—' : fmt0(soll) || ''}<\u002Fspan>\n              <span class=\"zw\">${gesp ? '<span class=\"meldung\">kommt von anderswo<\u002Fspan>'\n                : `<button class=\"knopf klein\" data-vwum=\"zeile:${z.id}\">Umbenennen<\u002Fbutton>\n                   ${nurKat ? `<span class=\"meldung\">über die Kategorie ${c.ausAb === 0 ? 'ganz' : 'ab ' + c.ausAb} aus<\u002Fspan>`\n                            : ausKnoepfe('zeile', z)}\n                   <button class=\"knopf klein gefahr\" data-vwloesch=\"zeile:${z.id}\">Löschen<\u002Fbutton>`}<\u002Fspan>\n            <\u002Fdiv>`;\n          }).join('') : '<div class=\"knoten n3 leer\"><span class=\"meldung\">Keine Position in dieser Kategorie.<\u002Fspan><\u002Fdiv>')}\n        <\u002Fdiv>`;\n      }).join('')}\n    <\u002Fdiv>`;\n  }).join('')}<\u002Fdiv>`;\n}\nfunction vwInhalt(seite) {\n  const liste = (items, art, leer) => items.length ? vwListe(items, art) : `<p class=\"meldung\">${leer}<\u002Fp>`;\n  if (seite === 'struktur') return `\n    <div class=\"vw-kopf\"><h2>Struktur<\u002Fh2>\n      <span class=\"meldung\">Jedes Konto trägt seine Kategorien, jede Kategorie ihre Positionen.\n        Die Zahl rechts ist das Soll ${S.jahr}.<\u002Fspan>\n      <span class=\"vw-werkzeug\">\n        <!-- U-30: «Konto anlegen» steht VOR «Kategorie anlegen» — der Baum\n             liest sich von oben nach unten (Konto trägt Kategorie trägt\n             Position), und die Knöpfe folgen ihm. Ohne diesen Knopf war der\n             Baum eine Ansicht ohne Wurzel: man konnte jede Ebene anlegen\n             ausser der obersten. -->\n        <button class=\"knopf klein\" data-vwneu=\"konto\">Konto anlegen<\u002Fbutton>\n        <button class=\"knopf klein\" data-vwneu=\"kategorie\">Kategorie anlegen<\u002Fbutton>\n        <button class=\"knopf klein\" id=\"btnBaumAlle\">${(S.vwZu||[]).length ? 'Alle aufklappen' : 'Alle zuklappen'}<\u002Fbutton>\n      <\u002Fspan><\u002Fdiv>\n    ${vwBaum()}`;\n  if (seite === 'steller') return `\n    <div class=\"vw-kopf\"><h2>Rechnungssteller<\u002Fh2>\n      <span class=\"meldung\">${D.steller.length} erfasst. Neue entstehen auch direkt beim Erfassen einer Rechnung.<\u002Fspan>\n      <span class=\"vw-werkzeug\"><button class=\"knopf klein\" data-vwneu=\"steller\">Neu<\u002Fbutton><\u002Fspan><\u002Fdiv>\n    <div class=\"vw-karte\">${liste(D.steller.slice().sort((a,b)=>a.name.localeCompare(b.name,'de-CH'))\n      .map(x=>({id:x.id,name:x.name,aktiv:x.aktiv})), 'steller', 'Noch keiner erfasst.')}<\u002Fdiv>`;\n  if (seite === 'sparziele') return `\n    <div class=\"vw-kopf\"><h2>Sparziele<\u002Fh2>\n      <span class=\"meldung\">Ein Sparziel sammelt Einzahlungen auf ein Konto und zeigt den Fortschritt.<\u002Fspan>\n      <span class=\"vw-werkzeug\"><button class=\"knopf klein\" data-vwneu=\"sparziel\">Neu<\u002Fbutton><\u002Fspan><\u002Fdiv>\n    <div class=\"vw-karte\">${liste(D.sparziele.map(x=>({id:x.id,name:x.name,aktiv:x.aktiv})), 'sparziel',\n      'Noch keines angelegt.')}<\u002Fdiv>`;\n  if (seite === 'aus') {\n    /* U-21: Die Kategorien stehen mit auf der Liste. Wer eine ganze Kategorie\n       ausblendet, nimmt damit auch ihre Zeilen weg — die tauchen hier nicht\n       einzeln auf, sonst suchte man den Knopf, der sie zurueckholt, an der\n       falschen Stelle. Die Jahresangabe steht bei jedem Eintrag: «ab 2029»\n       ist eine andere Entscheidung als «ganz aus», und beide muss man\n       auseinanderhalten koennen, ohne sie anzuklicken. */\n    const eintrag = (art, o, name) => `\n      <div class=\"z aus\">\n        <span class=\"n\">${name}<\u002Fspan>\n        <span class=\"rolle\">${ausAbText(o)}<\u002Fspan>\n        <span class=\"zw\">\n          <button class=\"knopf klein\" data-vwum=\"${art}:${o.id}\">Umbenennen<\u002Fbutton>\n          <button class=\"knopf klein\" data-vwaus=\"${art}:${o.id}:ein\">Einblenden<\u002Fbutton>\n          <!-- U-22: Hier gehoert der Loeschknopf besonders hin. Was seit Jahren\n               ausgeblendet ist, ist der wahrscheinlichste Kandidat — und man\n               sucht ihn genau dort, wo man den Eintrag zuletzt gesehen hat. -->\n          <button class=\"knopf klein gefahr\" data-vwloesch=\"${art}:${o.id}\">Löschen<\u002Fbutton>\n        <\u002Fspan><\u002Fdiv>`;\n    const kA = D.kategorien.slice().sort((x,y) => x.rang - y.rang)\n      .filter(k => k.ausAb != null)\n      .map(k => eintrag('kategorie', k, 'Kategorie ' + k.name));\n    const zA = D.zeilen.slice().sort((x,y) =>\n      (kategorie(x.kategorieId).rang - kategorie(y.kategorieId).rang) || (x.rang - y.rang))\n      .filter(z => z.ausAb != null)\n      .map(z => eintrag('zeile', z, kategorie(z.kategorieId).name + ' | ' + z.bezeichnung));\n    const alle = kA.concat(zA);\n    return `<div class=\"vw-kopf\"><h2>Ausgeblendet<\u002Fh2>\n      <span class=\"meldung\">Diese Zeilen und Kategorien sind ab dem genannten Jahr stillgelegt.\n        Die Jahre davor zeigen sie weiter; ihre Werte bleiben erhalten und kommen\n        mit «Einblenden» ganz zurück.<\u002Fspan><\u002Fdiv>\n      <div class=\"vw-karte\">${alle.length\n        ? `<div class=\"vw-liste\">${alle.join('')}<\u002Fdiv>`\n        : '<p class=\"meldung\">Nichts ist ausgeblendet.<\u002Fp>'}<\u002Fdiv>`;\n  }\n  if (seite === 'lohntag') return `\n    <div class=\"vw-kopf\"><h2>Lohntag<\u002Fh2>\n      <span class=\"meldung\">Bezugspunkt der Tageszahl: gerechnet wird bis zum nächsten Lohneingang,\n        nicht bis Monatsende.<\u002Fspan><\u002Fdiv>\n    <div class=\"vw-karte schmal\"><div class=\"feld\"><label>Tag im Monat<\u002Flabel>\n      <input class=\"num\" id=\"vwLohntag\" type=\"text\" inputmode=\"numeric\" value=\"${D.meta.lohntag}\"><\u002Fdiv>\n      <p class=\"meldung\" style=\"margin-top:10px\">Heute sind es <b>${tageBisLohn()} Tage<\u002Fb> bis zum\n        ${D.meta.lohntag}. — daraus wird «pro Tag ${fmt(proTag())}».<\u002Fp><\u002Fdiv>`;\n  if (seite === 'jahre') return `\n    <div class=\"vw-kopf\"><h2>Budgetjahre<\u002Fh2>\n      <span class=\"meldung\">Ein neues Jahr entsteht leer oder als Fortschreibung des Vorjahrs.<\u002Fspan>\n      <span class=\"vw-werkzeug\"><button class=\"knopf klein\" id=\"btnJahrNeu\">Jahr anlegen<\u002Fbutton><\u002Fspan><\u002Fdiv>\n    <div class=\"vw-karte schmal\">\n      ${Object.keys(D.budget).sort().map(j => {\n        /* U-22: Was in diesem Jahrgang ueberhaupt steht — sonst waere «Leeren»\n           ein Knopf ohne Vorwissen. Gezaehlt wird, was einen Wert traegt, nicht\n           was einen Behaelter hat. */\n        const hatWert = o => !!o && ((o.soll || 0) !== 0 || (o.m || []).some(x => (x || 0) !== 0));\n        const nZ = Object.keys(D.budget[j]).filter(z => hatWert(D.budget[j][z])).length;\n        const nR = D.verbindlichkeiten.filter(v => v.raten && hatWert(v.raten[j])).length;\n        return `<div class=\"jahrzeile ${+j === S.jahr ? 'jetzt' : ''}\">\n          <span class=\"j\">${j}<\u002Fspan>\n          <span class=\"e\">${nZ ? nZ + (nZ === 1 ? ' Zeile' : ' Zeilen') : 'keine Zeile'} mit Werten${\n            nR ? ' · ' + nR + (nR === 1 ? ' Ratenplan' : ' Ratenpläne') : ''}<\u002Fspan>\n          <!-- U-30: Zwei Knöpfe, zwei Fragen. «Leeren» setzt die Zahlen auf\n               null und lässt den Jahrgang stehen; «Löschen» nimmt den Jahrgang\n               selbst weg. Bis U-30 gab es nur den ersten — ein verschriebenes\n               Jahr war für immer da. -->\n          <span class=\"zw\"><button class=\"knopf klein gefahr\" data-jleer=\"${j}\">Leeren<\u002Fbutton>\n            <button class=\"knopf klein gefahr\" data-jweg=\"${j}\">Löschen<\u002Fbutton><\u002Fspan>\n        <\u002Fdiv>`;\n      }).join('')}\n      <p class=\"meldung\" style=\"margin-top:12px\"><b>Die Ratenpläne der Verbindlichkeiten werden\n        mitgeschrieben<\u002Fb> — sonst stünden nach dem Jahreswechsel zehn Schulden ohne Raten da.\n        Aus demselben Grund nimmt «Leeren» sie mit: ein Budgetjahr auf null und darunter\n        weiterlaufende Raten wären zwei Wahrheiten über dasselbe Jahr.<\u002Fp><\u002Fdiv>`;\n  if (seite === 'ordner') return `\n    <div class=\"vw-kopf\"><h2>Ordner &amp; Sicherung<\u002Fh2>\n      <span class=\"meldung\">GÄPP legt Belege und die Tagessicherung direkt in deinem GÄPP-Ordner ab.<\u002Fspan>\n      <span class=\"vw-werkzeug\"><button class=\"knopf klein\" id=\"btnOrdner\">Ordner freigeben<\u002Fbutton><\u002Fspan><\u002Fdiv>\n    <div class=\"vw-karte schmal\">\n      <p class=\"meldung\" id=\"vwOrdner\">${_ordner ? 'Freigegeben: ' + _ordner.name\n        : 'Keine Freigabe. Belege und Tagessicherung werden nicht abgelegt.'}<\u002Fp>\n      ${_ordnerRuege ? `<p class=\"meldung err\" id=\"vwOrdnerRuege\">${_ordnerRuege}<\u002Fp>` : ''}\n      <p class=\"meldung\" id=\"vwSicherung\">${sicherungText()}<\u002Fp>\n      <p class=\"meldung\" style=\"margin-top:12px\">Gib den <b>GÄPP-Ordner<\u002Fb> frei — nicht einen\n        Ordner darin. Belege gehen nach <b>04 - Rechnungsablage<\u002Fb>, getrennt nach Jahr,\n        die Tagessicherung nach <b>02 -&nbsp; DB Backup<\u002Fb>.\n        Funktioniert in Chrome und Edge, nicht in Firefox oder Safari.<\u002Fp><\u002Fdiv>`;\n  return '';\n}\nfunction zeichneVerwaltung() {\n  const seite = S.vwSeite || 'struktur';\n  $('#inhalt').innerHTML = `\n    <div class=\"vw-seite\">\n      <nav class=\"vw-register\" aria-label=\"Verwaltung\">\n        <span class=\"leisten-titel\">Verwaltung<\u002Fspan>\n        ${VW_SEITEN.map(([id, name, erl]) => id === '-' ? '<span class=\"vw-trenner\"><\u002Fspan>' :\n          `<button data-vwseite=\"${id}\" aria-current=\"${id === seite}\">\n             <span class=\"t\">${name}<\u002Fspan>\n             ${vwZaehler(id) === null ? '' : `<span class=\"z num\">${vwZaehler(id)}<\u002Fspan>`}\n             <span class=\"e\">${erl}<\u002Fspan><\u002Fbutton>`).join('')}\n      <\u002Fnav>\n      <div class=\"vw-inhalt\">${vwInhalt(seite)}<\u002Fdiv>\n    <\u002Fdiv>`;\n}\n\n/* ---- Das Blatt einer Rechnung: alles, was dazugehoert, an einer Stelle ---\n   U-27: Das Blatt hatte bis hierher KEINE Reiter — alles stand in einer\n   Tafel untereinander, der Beleg als vorletzte Zeile darin. Damit wohnten\n   Beleg und Zusatzunterlagen an zwei Orten, sobald es Zusatzunterlagen\n   gab. Es bekommt jetzt zwei Reiter nach dem Vorbild von blattSchuld:\n   was die Rechnung IST (Übersicht) und was zu ihr GEHOERT (Dokumente).\n   Die Belegzeile ist aus der Tafel verschwunden und steht nur noch im\n   zweiten Reiter — eine Angabe an zwei Stellen ist eine zu viel. */\nfunction blattRechnungZeigen(id) {\n  const r = D.rechnungen.find(x => x.id === id);\n  if (!r) return { titel:'Rechnung', koerper:'<p class=\"meldung\">Diese Rechnung gibt es nicht mehr.<\u002Fp>' };\n  const st = steller(r.stellerId), z = zeile(r.zeileId), k = konto(r.kontoId);\n  const gr = st && st.gruppeId ? D.stellerGruppen.find(g => g.id === st.gruppeId) : null;\n  const buch = D.buchungen.filter(b => b.rechnungId === r.id);\n  const feld = (k2, v2) => `<span class=\"wert\"><span class=\"k\">${k2}<\u002Fspan><span class=\"v\" style=\"font-size:15px\">${v2}<\u002Fspan><\u002Fspan>`;\n  const reiter = _blatt.reiter === 'dokumente' ? 'dokumente' : 'uebersicht';\n  _blatt.reiter = reiter;\n  const uebersicht = `<div class=\"kennzahlen\">\n        ${feld('Betrag', fmt(r.betrag))}\n        ${feld('Fällig', r.faelligkeit.split('-').reverse().join('.'))}\n        ${feld('Status', r.status === 'offen' ? '<span class=\"off\">offen<\u002Fspan>' : 'bezahlt')}\n        ${feld('Konto', k ? k.nr + ' ' + k.name : '—')}\n      <\u002Fdiv>\n      <table class=\"journal\"><tbody>\n        ${r.verbId ? `<tr><td>Gläubiger<\u002Ftd><td class=\"r\">${\n          (verbind(r.verbId) || {}).bezeichnung || '—'} — die Rate steht schon im Budget,\n          deshalb zählt diese Rechnung dort nicht noch einmal. Beim Abhaken sinkt der\n          Schuldenstand.<\u002Ftd><\u002Ftr>` : ''}\n        <tr><td>Position<\u002Ftd><td class=\"r\">${r.verbId\n          ? '— nicht nötig, die Rechnung hängt am Gläubiger'\n          : (z ? kategorie(z.kategorieId).name + ' | ' + z.bezeichnung : '—')}<\u002Ftd><\u002Ftr>\n        <tr><td>Rückstellung<\u002Ftd><td class=\"r\">${r.gedeckt\n          ? 'ja — wird aus dem Rückstellungstopf bezahlt und mindert weder das freie Geld noch die Budgetzeile'\n          : 'nein'}<\u002Ftd><\u002Ftr>\n        <tr><td>Mindert «Frei per Monatsende»<\u002Ftd><td class=\"r\">${\n          mindertFreies(r, ymOf(r.faelligkeit).j, ymOf(r.faelligkeit).m)\n            ? 'ja' : 'nein — ' + (r.verbId ? 'Rate eines Gläubigers, steht schon im Budget'\n                                : r.gedeckt ? 'Rückstellung' : 'wird nicht von einem freien Konto bezahlt')}<\u002Ftd><\u002Ftr>\n        ${r.notiz ? `<tr><td>Notiz<\u002Ftd><td class=\"r\">${r.notiz}<\u002Ftd><\u002Ftr>` : ''}\n        ${buch.length ? buch.map(b => `<tr><td>Zahlung<\u002Ftd><td class=\"r\">${\n          b.datum.split('-').reverse().join('.')} · ${fmt(b.betrag)} ab ${konto(b.kontoId).name}<\u002Ftd><\u002Ftr>`).join('') : ''}\n      <\u002Ftbody><\u002Ftable>\n      ${dokWegweiser('rechnung', r.id)}`;\n  return {\n    kennung: 'Rechnung · ' + (gr ? gr.name : 'ohne Gruppe'),\n    titel: (st ? st.name : '?') + ' · ' + fmt(r.betrag),\n    reiter: [['uebersicht','Übersicht'], ['dokumente', dokReiterName('rechnung', r)]],\n    koerper: reiter === 'dokumente' ? dokReiterHtml('rechnung', r.id) : uebersicht,\n    fuss: `<span class=\"schalter\" role=\"group\" style=\"margin-right:auto\">\n        <button data-rst=\"${r.id}:offen\"   aria-pressed=\"${r.status==='offen'}\">offen<\u002Fbutton>\n        <button data-rst=\"${r.id}:bezahlt\" aria-pressed=\"${r.status==='bezahlt'}\">bezahlt<\u002Fbutton><\u002Fspan>\n      <button class=\"knopf klein\" data-rweg=\"${r.id}\">Löschen<\u002Fbutton>\n      <button class=\"knopf klein\" data-rechauf=\"${r.id}\">Ändern<\u002Fbutton>\n      <button class=\"knopf\" data-zu>Schliessen<\u002Fbutton>` };\n}\n\n/* ---- Rechnung erfassen (A-55 bis A-60, A-83) ------------------------- */\nfunction blattRechnung(id) {\n  const r = id ? D.rechnungen.find(x => x.id === id) : null;\n  const g = (!r && _gelesen && !_gelesen.laeuft) ? _gelesen : null;\n  const e = r || { stellerId: (g && g.stellerId) || '', betrag: (g && g.betrag) || '',\n                   faelligkeit: (g && g.faelligkeit) || heuteISO(), zeileId:'rech_betrag',\n                   gedeckt:false, status:'offen', kontoId:'kred', verbId:'',\n                   notiz: g ? [g.nummer ? 'Rechnung ' + g.nummer : '',\n                               g.referenz ? 'Referenz ' + g.referenz : ''].filter(Boolean).join(' · ') : '' };\n  let belegZeile;\n  if (_belegDatei) {\n    belegZeile = `<b>${_belegDatei.name}<\u002Fb> liegt bereit und wird beim Speichern abgelegt.`;\n    if (_gelesen && _gelesen.laeuft) belegZeile += `<br><span class=\"meldung\">GÄPP liest den Beleg …<\u002Fspan>`;\n    else if (_gelesen && _gelesen.gefunden && _gelesen.gefunden.length)\n      belegZeile += `<br><span class=\"meldung\">Gelesen: <b>${_gelesen.gefunden.join(', ')}<\u002Fb>. ` +\n        `Alles darunter lässt sich überschreiben.<\u002Fspan>`;\n    else if (_gelesen && _gelesen.keinText)\n      belegZeile += `<br><span class=\"meldung\">Aus dieser Datei war kein Text zu holen — vermutlich ein Foto ` +\n        `oder ein gescanntes Blatt. Trag die Angaben von Hand ein.<\u002Fspan>`;\n    else if (_gelesen)\n      belegZeile += `<br><span class=\"meldung\">Im Text stand nichts, was GÄPP sicher zuordnen konnte.<\u002Fspan>`;\n  } else if (r && r.belegDatei) belegZeile = `Beleg <b>${r.belegDatei}<\u002Fb> ist abgelegt.`;\n  else if (r && r.belegOffen)   belegZeile = `Ein Beleg liegt im Zwischenspeicher und wird abgelegt, sobald der Ordner freigegeben ist.`;\n  else belegZeile = `Beleg hierher ziehen oder <b>klicken zum Auswählen<\u002Fb>`;\n  return { titel: r ? 'Rechnung ändern' : 'Rechnung erfassen', koerper: `\n    <div class=\"ablegeflaeche\" id=\"ablage\">${belegZeile}<\u002Fdiv>\n    <div class=\"maske\" style=\"margin-top:12px\">\n      ${r ? `<input type=\"hidden\" id=\"rId\" value=\"${r.id}\">` : ''}\n      <div class=\"feld\"><label>Rechnungssteller<\u002Flabel>\n        <select id=\"rSteller\">${stellerOptionen(e.stellerId)}<\u002Fselect><\u002Fdiv>\n      <div class=\"feld\"><label>Betrag<\u002Flabel>\n        <input class=\"num\" id=\"rBetrag\" type=\"text\" inputmode=\"decimal\" value=\"${e.betrag?fmt(e.betrag):''}\"><\u002Fdiv>\n      <div class=\"feld\"><label>Fällig am<\u002Flabel>\n        <input type=\"date\" id=\"rFaellig\" value=\"${e.faelligkeit}\"><\u002Fdiv>\n      <div class=\"feld\"><label>Zahlungskonto<\u002Flabel>\n        <select id=\"rKonto\">${kontoOptionen(e.kontoId)}<\u002Fselect><\u002Fdiv>\n      <div class=\"feld voll\"><label>Gehört zu Gläubiger<\u002Flabel>\n        <select id=\"rVerb\">${verbindOptionen(e.verbId)}<\u002Fselect><\u002Fdiv>\n      <div class=\"feld voll\"><label>Position<\u002Flabel>\n        <select id=\"rZeile\">${positionRechnung(e.zeileId, jahrVon(e.faelligkeit))}<\u002Fselect><\u002Fdiv>\n      <div class=\"feld voll\"><span class=\"meldung\">Eine Rechnung von einem Gläubiger —\n        Kartenkonto, Inkasso, Steuervereinbarung — ist keine neue Ausgabe: Ihre Rate steht\n        schon im Budget. Wähl den Gläubiger, dann zählt sie <b>nicht<\u002Fb> in die Budgetzeile\n        «Rechnungen», die Position wird nicht gebraucht, das Zahlungskonto setzt GÄPP selbst —\n        und beim Abhaken sinkt der Schuldenstand um den bezahlten Betrag.<\u002Fspan><\u002Fdiv>\n      <div class=\"feld haken voll\"><input type=\"checkbox\" id=\"rGedeckt\" ${e.gedeckt?'checked':''}>\n        <label for=\"rGedeckt\">Rückstellung — wird aus dem Rückstellungstopf bezahlt<\u002Flabel><\u002Fdiv>\n      <div class=\"feld voll\"><span class=\"meldung\">Mit Häkchen mindert die Rechnung weder\n        «Frei per Monatsende» noch die Budgetzeile «Rechnungen» — sonst stünde sie zweimal im Budget.<\u002Fspan><\u002Fdiv>\n      <div class=\"feld voll\"><label>Notiz<\u002Flabel>\n        <input type=\"text\" id=\"rNotiz\" value=\"${(e.notiz||'').replace(/\"/g,'&quot;')}\"><\u002Fdiv>\n      <div class=\"aktion\"><button class=\"knopf primaer\" id=\"btnRechSpeichern\">${r?'Ändern':'Erfassen'}<\u002Fbutton>\n        <span class=\"hint\" id=\"rHint\"><\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>` };\n}\n/* F-01: Zu welcher Verbindlichkeit gehoert die Rechnung? Leer heisst: zu\n   keiner — dann verhaelt sie sich wie jede andere Rechnung.\n   Bis zum 17.08.2026 gab es dieses Feld nicht. Die Monatsrechnung eines\n   Kartenkontos war damit nicht sauber erfassbar: Sie fand keine passende\n   Position, stand mit ihrem Betrag ein zweites Mal im Budget neben der\n   Rate desselben Glaeubigers, und beim Abhaken blieb der Schuldenstand\n   stehen, weil die erzeugte Buchung keine Verbindlichkeit kannte.\n   Ein Feld schliesst alle drei Luecken. */\nfunction verbindOptionen(sel) {\n  const liste = D.verbindlichkeiten.filter(v => v.aktiv !== false);\n  const nach = {};\n  GRUPPEN.forEach(g => { nach[g.id] = liste.filter(v => v.gruppe === g.id); });\n  return `<option value=\"\">— keiner, das ist eine gewöhnliche Rechnung —<\u002Foption>` +\n    GRUPPEN.filter(g => nach[g.id].length).map(g =>\n      `<optgroup label=\"${g.name}\">` + nach[g.id].map(v =>\n        `<option value=\"${v.id}\" ${sel === v.id ? 'selected' : ''}>${v.bezeichnung}<\u002Foption>`\n      ).join('') + `<\u002Foptgroup>`).join('');\n}\nfunction positionRechnung(sel, j) {\n  return zeilenWahl(j, sel).filter(x => !zeileGruppe[x.z.id])\n    .map(x => `<option value=\"${x.z.id}\" ${sel===x.z.id?'selected':''}>${x.k.name} | ${x.z.bezeichnung}<\u002Foption>`)\n    .join('');\n}\n\n/* Rechnungssteller alphabetisch — eine Liste, die nach Anlegereihenfolge sortiert\n   ist, sucht man dreimal durch. Ganz unten der Weg, einen neuen anzulegen, ohne\n   die Maske zu verlassen. */\nfunction stellerOptionen(sel) {\n  const liste = D.steller.filter(s => s.aktiv !== false)\n    .sort((a,b) => a.name.localeCompare(b.name, 'de-CH'));\n  return `<option value=\"\">— wählen —<\u002Foption>` +\n    liste.map(s => `<option value=\"${s.id}\" ${sel===s.id?'selected':''}>${s.name}<\u002Foption>`).join('') +\n    `<option value=\"__neu\">＋ Neuer Rechnungssteller …<\u002Foption>`;\n}\n\n/* ---- Serie anlegen (A-46, A-47) -------------------------------------- */\nfunction blattSerie(kontoId) {\n  return { titel:'Serie anlegen', koerper:`<div class=\"maske\">\n
