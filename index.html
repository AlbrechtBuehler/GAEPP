/* ===================================================================
   Belegablage und Tagessicherung (E-12, E-13)
   Ein Browser darf nicht frei ins Dateisystem schreiben. Er darf es,
   wenn der Mensch ihm einen Ordner ausdruecklich freigibt.
   =================================================================== */
let _ordner = null;

async function ordnerFreigeben() {
  if (!window.showDirectoryPicker) {
    alert('Dieser Browser kann keinen Ordner freigeben. GÄPP braucht dafür Chrome oder Edge.'); return;
  }
  try {
    _ordner = await window.showDirectoryPicker({ mode:'readwrite' });
    await ordnerMerken(_ordner);
    if (_blatt && _blatt.art === 'verwaltung') blattZeichnen();
  } catch (err) { /* abgebrochen */ }
}
/* Die Freigabe wird in IndexedDB gemerkt — localStorage kann keine Handles halten. */
function idb() {
  return new Promise((ok, nein) => {
    const r = indexedDB.open('gaepp', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('h');
    r.onsuccess = () => ok(r.result); r.onerror = () => nein(r.error);
  });
}
async function ordnerMerken(h) {
  try { const db = await idb();
    await new Promise(ok => { const t = db.transaction('h','readwrite');
      t.objectStore('h').put(h, 'ordner'); t.oncomplete = ok; });
  } catch (err) {}
}
async function ordnerHolen() {
  try {
    const db = await idb();
    const h = await new Promise(ok => { const t = db.transaction('h','readonly');
      const q = t.objectStore('h').get('ordner'); q.onsuccess = () => ok(q.result); });
    if (!h) return null;
    const p = await h.queryPermission({ mode:'readwrite' });
    if (p === 'granted') return h;
    return h;                     /* Bestaetigungsklick kann noch noetig sein */
  } catch (err) { return null; }
}
async function unterordner(name) {
  if (!_ordner) return null;
  try {
    if ((await _ordner.queryPermission({ mode:'readwrite' })) !== 'granted') {
      if ((await _ordner.requestPermission({ mode:'readwrite' })) !== 'granted') return null;
    }
    return await _ordner.getDirectoryHandle(name, { create:true });
  } catch (err) { return null; }
}
function belegName(datei, stellerName, betrag, datum) {
  const endung = (String(datei.name).match(/\.[a-z0-9]+$/i) || ['.pdf'])[0];
  return `${datum} - ${stellerName} - ${fmt(betrag)}${endung}`;
}
/* Ein Beleg geht nie verloren. Ist kein Ordner freigegeben oder klemmt der
   Zugriff, wandert die Datei in den Zwischenspeicher des Browsers und wird
   nachgereicht, sobald der Ordner wieder da ist. */
async function belegMerken(id, datei, name) {
  try {
    const db = await idb();
    await new Promise(ok => { const t = db.transaction('h','readwrite');
      t.objectStore('h').put({ blob: datei, name }, 'beleg:' + id); t.oncomplete = ok; });
    return true;
  } catch (err) { return false; }
}
async function belegAusSpeicher(id) {
  try {
    const db = await idb();
    return await new Promise(ok => { const t = db.transaction('h','readonly');
      const q = t.objectStore('h').get('beleg:' + id); q.onsuccess = () => ok(q.result); });
  } catch (err) { return null; }
}
async function belegVergessen(id) {
  try { const db = await idb();
    await new Promise(ok => { const t = db.transaction('h','readwrite');
      t.objectStore('h').delete('beleg:' + id); t.oncomplete = ok; });
  } catch (err) {}
}
async function belegSchreiben(datei, name) {
  const ord = await unterordner('03 - Dokumente');
  if (!ord) return false;
  try {
    const fh = await ord.getFileHandle(name, { create:true });
    const w = await fh.createWritable();
    await w.write(await datei.arrayBuffer()); await w.close();
    return true;
  } catch (err) { return false; }
}
/* Nachreichen: alles, was im Zwischenspeicher liegt, in den Ordner schreiben. */
async function belegeNachreichen() {
  let n = 0;
  for (const r of D.rechnungen.filter(x => x.belegOffen)) {
    const g = await belegAusSpeicher(r.id);
    if (!g) continue;
    if (await belegSchreiben(g.blob, g.name)) {
      r.belegDatei = g.name; r.belegOffen = false;
      await belegVergessen(r.id); n++;
    }
  }
  if (n) persist();
  return n;
}
async function belegOeffnen(id) {
  const r = D.rechnungen.find(x => x.id === id);
  if (!r) return;
  if (r.belegDatei) {
    const ord = await unterordner('03 - Dokumente');
    if (ord) {
      try {
        const fh = await ord.getFileHandle(r.belegDatei);
        const f = await fh.getFile();
        window.open(URL.createObjectURL(f), '_blank');
        return;
      } catch (err) { /* liegt nicht im Ordner — unten weiterversuchen */ }
    }
  }
  const g = await belegAusSpeicher(id);
  if (g) { window.open(URL.createObjectURL(g.blob), '_blank'); return; }
  alert('Der Beleg ist gerade nicht erreichbar. Gib den GÄPP-Ordner in der Verwaltung frei.');
}
/* Beim ersten Oeffnen am Tag eine Sicherung — eine Sicherung, an die man
   denken muss, ist im Ernstfall drei Monate alt. */
async function tagessicherung() {
  if (!D || _ro) return;
  const heute = heuteISO();
  if (localStorage.getItem('gaepp.sicherung') === heute) return;
  const ord = await unterordner('02 -  DB Backup');
  if (!ord) return;
  try {
    const fh = await ord.getFileHandle('GAEPP-Daten-' + heute + '.json', { create:true });
    const w = await fh.createWritable();
    await w.write(JSON.stringify(D, null, 1)); await w.close();
    localStorage.setItem('gaepp.sicherung', heute);
  } catch (err) {}
}
/* Der Ausgang fuer den Menschen (A-89) */
function jsonAb() {
  const b = new Blob([JSON.stringify(D, null, 1)], { type:'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(b); a.download = 'GAEPP-Daten-' + heuteISO() + '.json';
  a.click();
}
function jsonAuf() {
  const i = document.createElement('input');
  i.type = 'file'; i.accept = '.json,application/json';
  i.onchange = async () => {
    const f = i.files[0]; if (!f) return;
    try {
      const g = JSON.parse(await f.text());
      if (!g.meta || !g.konten) throw new Error('Das ist keine GÄPP-Datei.');
      uebernehmen(g); _sig = undefined; persist(); blattZu();
    } catch (err) { alert('Konnte nicht gelesen werden: ' + err.message); }
  };
  i.click();
}

/* ===================================================================
   GAEPP — Berichte, Export und Handbuch.

   Fuenf Berichte, jeder mit einem Satz, was er zeigt. Zeitraum und
   Kategorien werden vor dem Erzeugen gesetzt, nicht danach.

   Drei Festlegungen tragen diesen Teil:

   - **Ein Bericht sieht aus wie das Werkzeug, aus dem er kommt.**
     Dieselbe Farbwelt, dieselben Schriften, dieselbe Kachelanatomie.
     Erst der Druck macht Papier daraus — dann kippt die ganze Farbwelt
     auf weiss, und zwar ueber die Tokens, nicht ueber Sonderregeln.

   - **Zeilen lassen sich anklicken und ausblenden, und alles zieht mit.**
     Summen, Anteilsbalken und die Kennzahlen im Kopf. Ein eingefrorener
     Stand, bei dem das Total nach dem Ausblenden stehen bleibt,
     behauptet etwas Falsches.

   - **Gerechnet wird an einer Stelle.** Die Zahlenzellen tragen ihren
     Rohwert als data-w; Summen, Balken und Kennzahlen entstehen erst
     beim Zeichnen aus diesen Werten. Deshalb rechnet die gesicherte
     HTML-Datei mit demselben Code wie die Vorschau — er wird woertlich
     mitgegeben, nicht ein zweites Mal geschrieben.
   =================================================================== */

/* Was der naechste Bericht zeigen soll. Lebt nur in der Ansicht. */
let _ber = null;
function berStandard() {
  return { art:'monat', kontoId:'hhk', verbId:null,
           von: iso(S.jahr, S.monat, 1),
           bis: iso(S.jahr, S.monat, tageImMonat(S.jahr, S.monat)),
           kategorien: D.kategorien.filter(k => k.aktiv !== false).map(k => k.id),
           verlauf: true };
}
const BERICHTE = [
  { id:'monat',   name:'Monatsauszug — alle Konten',
    was:'Kopfzahlen, Verlauf, Aufstellung nach Kategorien mit Anteilsbalken, alle Konten mit Anfang und Ende, dazu die grössten Einzelposten.' },
  { id:'jahr',    name:'Jahresauszug — alle Konten',
    was:'Zwölf Monatsspalten je Konto, Kategorien über das ganze Jahr und Budget gegen Ist Monat für Monat. Querformat.' },
  { id:'konto',   name:'Kontobericht',
    was:'Ein Konto über den gewählten Zeitraum: Verlauf, Monat für Monat, jede Buchung mit laufendem Saldo, Bankwert und Differenz. Auch für eine Schuld.' },
  { id:'schuld',  name:'Verbindlichkeiten über alle Jahre',
    was:'Entwicklung je Gläubiger mit Stand, Rate, Zins und dem Monat, in dem sie getilgt ist — oder dem Vermerk, dass der Plan nicht reicht.' },
  { id:'export',  name:'Ganzes Tool, eingefroren',
    was:'Eine HTML-Datei zum Weiterreichen. Öffnet ohne Netz; Reiter, Klappköpfe und Filter arbeiten, ändern lässt sich nichts.' }
];

function blattBericht(arg) {
  if (String(arg || '').startsWith('zeige:')) return berichtVorschau(arg.slice(6));
  if (!_ber) _ber = berStandard();
  /* Aus einem Konto- oder Schuldblatt heraus ist die Sache schon klar. */
  const v = String(arg || '');
  if (v.startsWith('konto:'))  { _ber.art = 'konto';  _ber.kontoId = v.slice(6); _ber.verbId = null; }
  if (v.startsWith('schuld:')) { _ber.art = 'konto';  _ber.verbId  = v.slice(7); }
  return berichtWahl();
}

function berichtWahl() {
  const istKonto = _ber.art === 'konto';
  return { weit:true, titel:'Bericht und Export', koerper: `
    <div class="wahlliste">${BERICHTE.map(b => `
      <label><input type="radio" name="ber" value="${b.id}" ${_ber.art===b.id?'checked':''}>
        <span><span class="bez">${b.name}</span><span class="erl">${b.was}</span></span></label>`).join('')}
    </div>
    <div class="maske" style="margin-top:14px">
      ${istKonto ? `<div class="feld voll"><label>Welches Konto oder welche Schuld</label>
        <select id="berKonto">
          <optgroup label="Konten">${D.konten.filter(k=>k.aktiv!==false).sort((a,b)=>a.rang-b.rang)
            .map(k => `<option value="k:${k.id}" ${!_ber.verbId&&_ber.kontoId===k.id?'selected':''}>${k.nr} ${k.name}</option>`).join('')}</optgroup>
          <optgroup label="Verbindlichkeiten">${D.verbindlichkeiten.filter(v=>v.aktiv!==false)
            .map(v => `<option value="v:${v.id}" ${_ber.verbId===v.id?'selected':''}>${v.bezeichnung}</option>`).join('')}</optgroup>
        </select></div>` : ''}
      <div class="feld"><label>Von</label><input type="date" id="berVon" value="${_ber.von}"></div>
      <div class="feld"><label>Bis</label><input type="date" id="berBis" value="${_ber.bis}"></div>
      <div class="feld voll"><span class="filterzeile">
        <span class="lab">Zeitraum</span>
        <button class="knopf klein" data-zeit="monat">Dieser Monat</button>
        <button class="knopf klein" data-zeit="jahr">Dieses Jahr</button>
        <button class="knopf klein" data-zeit="alles">Ganzer Zeitraum</button>
      </span></div>
      <div class="feld haken voll"><input type="checkbox" id="berVerlauf" ${_ber.verlauf?'checked':''}>
        <label for="berVerlauf">Verlaufsgrafik mitgeben</label></div>
      <div class="feld voll"><span class="filterzeile"><span class="lab">Kategorien</span>
        ${D.kategorien.filter(k=>k.aktiv!==false).sort((a,b)=>a.rang-b.rang).map(k =>
          `<button class="filter" data-berkat="${k.id}" aria-pressed="${_ber.kategorien.includes(k.id)}">${k.name}</button>`).join('')}
      </span></div>
    </div>`,
    fuss:`<button class="knopf" data-zu>Abbrechen</button>
          <button class="knopf primaer" id="btnBerichtErzeugen">Erzeugen</button>` };
}

function berichtVorschau(art) {
  return { weit:true, titel:'Bericht',
    koerper:`<div id="berichtVorschau">${berichtHtml(art)}</div>`,
    fuss:`<button class="knopf" id="btnBerichtZurueck">Zurück zur Auswahl</button>
          <span class="meldung" data-ausgeblendet style="margin-right:auto;margin-left:10px"></span>
          <button class="knopf" id="btnBerichtHtml">Als HTML sichern</button>
          <button class="knopf primaer" id="btnDrucken">Drucken oder als PDF</button>`,
    /* Summen, Balken und Kennzahlen entstehen erst hier — mit demselben Code,
       der spaeter in der gesicherten Datei laeuft. */
    danach: () => berichtRechnen($('#berichtVorschau')) };
}

/* ===================================================================
   Zeilen ausblenden — und alles zieht nach.
   Diese Funktion wird woertlich in die gesicherte HTML-Datei kopiert
   (ueber Function.toString). Sie darf deshalb nichts aus der App
   benutzen ausser fmt, das genauso mitgegeben wird.
   =================================================================== */
function berichtRechnen(wz) {
  if (!wz) return;
  const zahl = td => td ? (parseFloat(td.getAttribute('data-w')) || 0) : 0;
  /* Eine Zelle beschriften. data-sig sagt, wie das Vorzeichen zu lesen ist. */
  const zeig = (el, v) => {
    const a = el.getAttribute('data-sig') || '';
    const leer = Math.abs(v) < 0.005;
    let t;
    if (a === 'plus')       t = leer ? '–' : '+' + fmt(v);
    else if (a === 'minus') t = leer ? '–' : '−' + fmt(Math.abs(v));
    else if (a === 'saldo') t = (v < -0.005 ? '−' : '+') + fmt(Math.abs(v));
    else                    t = fmt(v);
    el.textContent = t;
    el.classList.remove('ok', 'err');
    if (a === 'saldo') { if (v > 0.005) el.classList.add('ok'); if (v < -0.005) el.classList.add('err'); }
    else if (a === 'minus' && !leer) el.classList.add('err');
    else if (a === 'plus'  && !leer) el.classList.add('ok');
    else if (a === 'wert'  && v < -0.005) el.classList.add('err');
  };
  /* «1|-2» heisst: Spalte 1 minus Spalte 2, ueber alle sichtbaren Zeilen. */
  const summe = (zeilen, formel) => formel.split('|').reduce((s, teil) => {
    const neg = teil.charAt(0) === '-';
    const c = parseInt(neg ? teil.slice(1) : teil, 10);
    return s + (neg ? -1 : 1) * zeilen.reduce((x, tr) => x + zahl(tr.cells[c]), 0);
  }, 0);
  const rund = x => Math.round(x * 100) / 100;

  Array.prototype.forEach.call(wz.querySelectorAll('table.btab'), tab => {
    const alle  = Array.prototype.slice.call(tab.querySelectorAll('tbody tr.bz'));
    const sicht = alle.filter(tr => !tr.classList.contains('aus'));

    /* Fusszeile der Tabelle */
    Array.prototype.forEach.call(tab.querySelectorAll('tfoot td[data-sum]'), td =>
      zeig(td, rund(summe(sicht, td.getAttribute('data-sum')))));

    /* Zwischensummen je Gruppe */
    Array.prototype.forEach.call(tab.querySelectorAll('tbody tr[data-gsum]'), tr => {
      const g = tr.getAttribute('data-gsum');
      const teil = sicht.filter(x => x.getAttribute('data-g') === g);
      Array.prototype.forEach.call(tr.querySelectorAll('td[data-sum]'), td =>
        zeig(td, rund(summe(teil, td.getAttribute('data-sum')))));
    });

    /* Anteilsbalken — der Nenner ist die Summe der sichtbaren Zeilen. */
    const ac = tab.getAttribute('data-anteil');
    if (ac !== null && ac !== undefined) {
      const ganz = sicht.reduce((x, tr) => x + Math.abs(zahl(tr.cells[+ac])), 0);
      alle.forEach(tr => {
        const bar = tr.querySelector('.bbar'), pct = tr.querySelector('.bpct');
        if (!bar) return;
        const p = (!tr.classList.contains('aus') && ganz)
          ? Math.abs(zahl(tr.cells[+ac])) / ganz * 100 : 0;
        bar.style.width = p.toFixed(1) + '%';
        /* Eine leere Spur bedeutet nichts und lenkt ab — sie verschwindet ganz. */
        if (bar.parentNode) bar.parentNode.style.visibility = p ? '' : 'hidden';
        if (pct) pct.textContent = p >= 0.5 ? Math.round(p) + ' %' : '';
      });
    }

    /* Kennzahlen im Kopf haengen an genau einer Tabelle. */
    if (tab.getAttribute('data-kz')) {
      Array.prototype.forEach.call(wz.querySelectorAll('.bkennz b[data-sum]'), b =>
        zeig(b, rund(summe(sicht, b.getAttribute('data-sum')))));
    }
  });

  const n = wz.querySelectorAll('table.btab tbody tr.bz.aus').length;
  const txt = n ? n + (n === 1 ? ' Zeile ausgeblendet' : ' Zeilen ausgeblendet') : '';
  const wurzel = wz.ownerDocument || document;
  Array.prototype.forEach.call(wurzel.querySelectorAll('[data-ausgeblendet]'), el => {
    el.textContent = txt;
  });
}

/* ---- Bausteine, die alle Berichte teilen ---------------------------- */
function dmy(d) { return d.slice(8,10) + '.' + d.slice(5,7) + '.' + d.slice(0,4); }

/* Kopf: Etikett, Titel, Untertitel, rechts das Ausgabedatum. */
function berichtKopf(etikett, titel, unter, zahlen) {
  return `<div class="bericht"><div class="bkopf">
      <div><div class="cap">${etikett}</div><h1 class="ser">${titel}</h1>
        <div class="bsub">${unter}</div></div>
      <div class="bstand"><div class="cap s">Stand</div>
        <div class="num">${dmy(heuteISO())}</div></div>
    </div>` +
    (zahlen ? `<div class="bkennz">${zahlen.map(z =>
      `<div><div class="cap s">${z[0]}</div><b class="${z[2]||''}"${
        z[3] ? ` data-sum="${z[3]}" data-sig="${z[4]||'saldo'}"` : ''}>${z[1]}</b></div>`).join('')}</div>` : '');
}
function berichtFuss(zusatz) {
  return `<div class="bfuss">GÄPP · Passend | Präzise | Praktisch · erzeugt am ${dmy(heuteISO())}` +
    (zusatz ? ' · ' + zusatz : '') +
    /* Was ausgeblendet wurde, steht auch auf dem Papier — dort fehlen die
       Zeilen ganz, und eine Summe ohne diesen Hinweis waere eine Behauptung. */
    `<span data-ausgeblendet></span></div></div>`;
}
/* Eine Zahlenzelle. Der Rohwert steht als data-w daneben — das Ausblenden
   ist so nicht auf Textzerlegung angewiesen. */
function zz(v, art, klasse) {
  const w = rd(v || 0);
  const leer = Math.abs(w) < 0.005;
  let t, kl = klasse ? ' ' + klasse : '';
  if (art === 'plus')       { t = leer ? '<span class="nix">–</span>' : '+' + fmt(w); if (!leer) kl += ' ok'; }
  else if (art === 'minus') { t = leer ? '<span class="nix">–</span>' : '−' + fmt(Math.abs(w)); if (!leer) kl += ' err'; }
  else if (art === 'saldo') { t = (w < -0.005 ? '−' : '+') + fmt(Math.abs(w));
                              kl += w < -0.005 ? ' err' : (w > 0.005 ? ' ok' : ''); }
  /* Ein Bestand von null ist eine Aussage — er wird ausgeschrieben, nicht
     durch einen Strich ersetzt. Der Strich steht nur, wo nichts geflossen ist. */
  else                      { t = fmt(w); if (w < -0.005) kl += ' err'; art = art || 'wert'; }
  return `<td class="bzahl${kl}" data-w="${w}" data-sig="${art}">${t}</td>`;
}
/* Eine leere Fusszelle — ihren Wert setzt berichtRechnen. */
function fz(formel, art) {
  return `<td class="bzahl" data-sum="${formel}" data-sig="${art || 'wert'}"></td>`;
}
/* Der Balken sitzt in einer Spur fester Breite — sonst schiebt ein Anteil von
   neunzig Prozent den Prozentwert in die naechste Zeile. */
const balken = '<td class="banteil"><span class="bspur"><span class="bbar"></span></span>' +
               '<span class="bpct"></span></td>';

/* Der Verlauf als SVG — er ueberlebt Drucken, HTML-Sichern und Weiterreichen.
   Farben kommen aus den Tokens, damit der Druck sie mitkippt. */
function verlaufSvg(punkte, beschriftung, hoehe) {
  if (!punkte.length) return '';
  const h = hoehe || 150, b = 720, lr = 46, or_ = 12, ur = 22;
  const min = Math.min(0, ...punkte), max = Math.max(1, ...punkte);
  const x = i => lr + (punkte.length === 1 ? (b-lr-8)/2 : i * (b - lr - 8) / (punkte.length - 1));
  const y = v => or_ + (h - or_ - ur) * (1 - (v - min) / ((max - min) || 1));
  const d = punkte.map((v,i) => (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(v).toFixed(1)).join(' ');
  const flaeche = d + ' L' + x(punkte.length-1).toFixed(1) + ' ' + y(min).toFixed(1) +
                  ' L' + x(0).toFixed(1) + ' ' + y(min).toFixed(1) + ' Z';
  return `<svg class="ber-verlauf" viewBox="0 0 ${b} ${h}" preserveAspectRatio="none">
    <path d="${flaeche}" fill="var(--accent)" fill-opacity=".12"/>
    <line x1="${lr}" y1="${y(0).toFixed(1)}" x2="${b-8}" y2="${y(0).toFixed(1)}"
      stroke="var(--rule)" stroke-width=".8"/>
    <path d="${d}" fill="none" stroke="var(--accent)" stroke-width="1.8"/>
    ${punkte.map((v,i)=>`<circle cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="2" fill="var(--accent)"/>`).join('')}
    <text x="2" y="${(y(max)+4).toFixed(1)}" font-size="9" fill="var(--muted)">${fmt(max,0)}</text>
    <text x="2" y="${(y(min)+4).toFixed(1)}" font-size="9" fill="var(--muted)">${fmt(min,0)}</text>
    ${beschriftung.map((t,i)=> {
      if (beschriftung.length > 14 && i % 2) return '';
      /* Die erste und die letzte Beschriftung haengen am Rand — mittig gesetzt
         wuerde die letzte aus dem Bild laufen und abgeschnitten. */
      const anker = i === 0 ? 'start' : (i === beschriftung.length - 1 ? 'end' : 'middle');
      const px = i === 0 ? x(0) - 10 : (i === beschriftung.length - 1 ? b - 2 : x(i));
      return `<text x="${px.toFixed(1)}" y="${h-7}" font-size="9" fill="var(--muted)" text-anchor="${anker}">${t}</text>`;
    }).join('')}
  </svg>`;
}
/* Alle Buchungen im gewaehlten Zeitraum, nach den gewaehlten Kategorien gefiltert */
function berBuchungen(filter) {
  return D.buchungen.filter(b => {
    if (b.datum < _ber.von || b.datum > _ber.bis) return false;
    if (b.zeileId) {
      const z = zeile(b.zeileId);
      if (z && !_ber.kategorien.includes(z.kategorieId)) return false;
    }
    return !filter || filter(b);
  }).sort((a,b) => a.datum < b.datum ? -1 : 1);
}
function monateImZeitraum() {
  const a = ymOf(_ber.von), e = ymOf(_ber.bis), out = [];
  let j = a.j, m = a.m;
  while (j < e.j || (j === e.j && m <= e.m)) { out.push({ j, m }); m++; if (m === 12) { m = 0; j++; } }
  return out.slice(0, 120);
}
/* Was in einem Monat wirklich gebucht wurde — Gegenstueck zum Budgetwert. */
function istSaldoMonat(j, m) {
  return rd(D.buchungen.reduce((s, b) => {
    const d = ymOf(b.datum);
    if (d.j !== j || d.m !== m) return s;
    if (b.art === 'einnahme')  return s + b.betrag;
    if (b.art === 'ausgabe')   return s - b.betrag;
    if (b.art === 'korrektur') return s + (b.richtung === 'minus' ? -b.betrag : b.betrag);
    return s;
  }, 0));
}

function berichtHtml(art) {
  if (art === 'monat')  return berichtMonat();
  if (art === 'jahr')   return berichtJahr();
  if (art === 'konto')  return _ber.verbId ? berichtSchuld(_ber.verbId) : berichtKonto(_ber.kontoId);
  if (art === 'schuld') return berichtSchuldenplan();
  return '<p>Unbekannter Bericht.</p>';
}

/* ---- Monatsauszug: Kopfzahlen, Kategorien, Konten, Einzelposten ------ */
function berichtMonat() {
  const b = berBuchungen();
  const eb = ymOf(_ber.bis);

  /* Nach Kategorien — diese Tabelle traegt die Kennzahlen im Kopf. */
  const nachKat = {};
  b.forEach(x => {
    const z = x.zeileId ? zeile(x.zeileId) : null;
    const k = z ? kategorie(z.kategorieId) : null;
    const schl = k ? k.id : (x.art === 'umbuchung' ? '_um' : '_ohne');
    const name = k ? k.name : (x.art === 'umbuchung' ? 'Umbuchungen' : 'Ohne Position');
    const e = nachKat[schl] || (nachKat[schl] = { name, n:0, ein:0, aus:0 });
    e.n++;
    if (x.art === 'einnahme') e.ein += x.betrag;
    else if (x.art === 'ausgabe') e.aus += x.betrag;
    else if (x.art === 'korrektur') { if (x.richtung === 'minus') e.aus += x.betrag; else e.ein += x.betrag; }
  });
  const katZeilen = Object.values(nachKat).sort((a,b2) => (b2.aus - b2.ein) - (a.aus - a.ein)).map(e =>
    `<tr class="bz" data-bgrp="${e.name}"><td class="bn">${e.name}
      <div class="bsub">${e.n} ${e.n===1?'Buchung':'Buchungen'}</div></td>
      ${zz(e.ein,'plus')}${zz(e.aus,'minus')}${zz(rd(e.ein-e.aus),'saldo')}${balken}</tr>`).join('');

  /* Konten mit Anfang, Bewegung, Ende */
  const a = ymOf(_ber.von);
  const kontoZeilen = D.konten.filter(k => k.aktiv !== false).sort((x,y)=>x.rang-y.rang).map(k => {
    const anf = kontosaldo(k.id, a.m === 0 ? a.j-1 : a.j, a.m === 0 ? 11 : a.m-1);
    const end = kontosaldo(k.id, eb.j, eb.m);
    return `<tr class="bz" data-bgrp="${k.name}"><td class="bn">${k.nr} ${k.name}
      <div class="bsub">${k.frei ? 'frei verfügbar' : 'zweckgebunden'}</div></td>
      ${zz(anf)}${zz(rd(end-anf),'saldo')}${zz(end)}</tr>`;
  }).join('');
  const gesamt = rd(D.konten.reduce((s,k) => s + kontosaldo(k.id, eb.j, eb.m), 0));

  /* Die groessten Einzelposten — dort sieht man, wohin der Monat lief. */
  const gross = b.filter(x => x.art === 'ausgabe' || (x.art === 'korrektur' && x.richtung === 'minus'))
    .sort((x,y) => y.betrag - x.betrag).slice(0, 12);
  const grossZeilen = gross.map(x => {
    const z = x.zeileId ? zeile(x.zeileId) : null;
    const k = konto(x.kontoId);
    return `<tr class="bz" data-bgrp="${x.id}"><td class="bn">${z ? z.bezeichnung : artName(x.art)}
      <div class="bsub">${dmy(x.datum)}${x.text ? ' · ' + x.text : ''}</div></td>
      <td>${k ? k.nr + ' ' + k.name : '–'}</td>${zz(x.betrag,'minus')}${balken}</tr>`;
  }).join('');

  const mon = monateImZeitraum();
  const verlauf = _ber.verlauf && mon.length > 1
    ? verlaufSvg(mon.map(x => rd(D.konten.reduce((s,k)=>s+kontosaldo(k.id,x.j,x.m),0))),
                 mon.map(x => MON[x.m]), 150)
    : '';

  return berichtKopf('GÄPP · Auszug nach Kategorien',
      dmy(_ber.von) + ' bis ' + dmy(_ber.bis),
      'Alle Konten · ' + b.length + (b.length===1?' Buchung':' Buchungen') + ' im Zeitraum',
      [['Einnahmen', '', 'ok', '1', 'plus'],
       ['Ausgaben',  '', 'err', '2', 'minus'],
       ['Saldo',     '', '',   '1|-2', 'saldo'],
       ['Vermögen',  fmt(gesamt)],
       ['Schuldenstand', '−' + fmt(schuldenSumme(eb.j, eb.m)), 'err']]) +
    verlauf +
    `<h2 class="bh">Nach Kategorien</h2>
     <table class="btab" data-kz="1" data-anteil="2">
       <thead><tr><th class="bn">Kategorie</th><th class="bzahl">Einnahmen</th>
         <th class="bzahl">Ausgaben</th><th class="bzahl">Saldo</th>
         <th class="banteil">Anteil Ausgaben</th></tr></thead>
       <tbody>${katZeilen || '<tr><td class="bn" colspan="5">Im Zeitraum ist nichts gebucht.</td></tr>'}</tbody>
       <tfoot><tr><td class="bn">Total</td>${fz('1','plus')}${fz('2','minus')}${fz('1|-2','saldo')}
         <td class="banteil"></td></tr></tfoot></table>

     <h2 class="bh">Konten</h2>
     <table class="btab">
       <thead><tr><th class="bn">Konto</th><th class="bzahl">Anfang</th>
         <th class="bzahl">Bewegung</th><th class="bzahl">Ende</th></tr></thead>
       <tbody>${kontoZeilen}</tbody>
       <tfoot><tr><td class="bn">Summe</td>${fz('1')}${fz('2','saldo')}${fz('3')}</tr></tfoot></table>

     ${gross.length ? `<h2 class="bh">Grösste Einzelposten</h2>
     <table class="btab" data-anteil="2">
       <thead><tr><th class="bn">Position</th><th>Konto</th><th class="bzahl">Betrag</th>
         <th class="banteil">Anteil</th></tr></thead>
       <tbody>${grossZeilen}</tbody>
       <tfoot><tr><td class="bn">Summe dieser Posten</td><td></td>${fz('2','minus')}
         <td class="banteil"></td></tr></tfoot></table>` : ''}` +
    berichtFuss('Budgetsaldo des Monats ' + fmt(saldoBudgetiert(eb.j, eb.m)));
}

/* ---- Jahresauszug --------------------------------------------------- */
function berichtJahr() {
  const j = ymOf(_ber.von).j;
  const rows = D.konten.filter(k => k.aktiv !== false).sort((a,b)=>a.rang-b.rang).map(k =>
    `<tr class="bz" data-bgrp="${k.name}"><td class="bn">${k.nr} ${k.name}</td>${
      MON.map((_,m)=>zz(kontosaldo(k.id,j,m))).join('')}${zz(kontosaldo(k.id,j,11))}</tr>`).join('');
  const verm = MON.map((_,m) => rd(D.konten.reduce((s,k)=>s+kontosaldo(k.id,j,m),0)));
  const verlauf = _ber.verlauf ? verlaufSvg(verm, MON, 160) : '';

  /* Kategorien ueber das ganze Jahr */
  const von = _ber.von, bis = _ber.bis;
  _ber.von = iso(j,0,1); _ber.bis = iso(j,11,31);
  const jb = berBuchungen();
  _ber.von = von; _ber.bis = bis;
  const nachKat = {};
  jb.forEach(x => {
    const z = x.zeileId ? zeile(x.zeileId) : null;
    const k = z ? kategorie(z.kategorieId) : null;
    const schl = k ? k.id : (x.art === 'umbuchung' ? '_um' : '_ohne');
    const name = k ? k.name : (x.art === 'umbuchung' ? 'Umbuchungen' : 'Ohne Position');
    const e = nachKat[schl] || (nachKat[schl] = { name, n:0, ein:0, aus:0 });
    e.n++;
    if (x.art === 'einnahme') e.ein += x.betrag;
    else if (x.art === 'ausgabe') e.aus += x.betrag;
    else if (x.art === 'korrektur') { if (x.richtung === 'minus') e.aus += x.betrag; else e.ein += x.betrag; }
  });
  const katZeilen = Object.values(nachKat).sort((a,b2) => (b2.aus - b2.ein) - (a.aus - a.ein)).map(e =>
    `<tr class="bz" data-bgrp="${e.name}"><td class="bn">${e.name}
      <div class="bsub">${e.n} ${e.n===1?'Buchung':'Buchungen'}</div></td>
      ${zz(e.ein,'plus')}${zz(e.aus,'minus')}${zz(rd(e.ein-e.aus),'saldo')}${balken}</tr>`).join('');

  /* Budget gegen Ist — die Zeile, die zeigt, ob der Plan haelt */
  const bvi = MON.map((_,m) => {
    const plan = saldoBudgetiert(j,m), ist = istSaldoMonat(j,m);
    return `<tr class="bz" data-bgrp="${MON_LANG[m]}"><td class="bn">${MON_LANG[m]} ${j}</td>
      ${zz(plan,'saldo')}${zz(ist,'saldo')}${zz(rd(ist-plan),'saldo')}</tr>`;
  }).join('');

  return berichtKopf('GÄPP · Jahresauszug', 'Jahr ' + j, 'Kontostände am Monatsende',
      [['Vermögen Ende', fmt(verm[11])],
       ['Budgetsaldo', fmt(rd(MON.reduce((s,_,m)=>s+saldoBudgetiert(j,m),0)))],
       ['Schulden Ende', '−' + fmt(schuldenPrognose(j,11)), 'err']]) +
    verlauf +
    `<h2 class="bh">Konten Monat für Monat</h2>
     <table class="btab">
       <thead><tr><th class="bn">Konto</th>${MON.map(m=>`<th class="bzahl">${m}</th>`).join('')}
         <th class="bzahl">Ende</th></tr></thead>
       <tbody>${rows}</tbody>
       <tfoot><tr><td class="bn">Vermögen</td>${MON.map((_,m)=>fz(String(m+1))).join('')}${fz('13')}</tr></tfoot></table>

     <h2 class="bh">Nach Kategorien im ganzen Jahr</h2>
     <table class="btab" data-anteil="2">
       <thead><tr><th class="bn">Kategorie</th><th class="bzahl">Einnahmen</th>
         <th class="bzahl">Ausgaben</th><th class="bzahl">Saldo</th>
         <th class="banteil">Anteil Ausgaben</th></tr></thead>
       <tbody>${katZeilen || '<tr><td class="bn" colspan="5">Im Jahr ist nichts gebucht.</td></tr>'}</tbody>
       <tfoot><tr><td class="bn">Total</td>${fz('1','plus')}${fz('2','minus')}${fz('1|-2','saldo')}
         <td class="banteil"></td></tr></tfoot></table>

     <h2 class="bh">Budget gegen Ist</h2>
     <table class="btab">
       <thead><tr><th class="bn">Monat</th><th class="bzahl">Budgetiert</th>
         <th class="bzahl">Gebucht</th><th class="bzahl">Abweichung</th></tr></thead>
       <tbody>${bvi}</tbody>
       <tfoot><tr><td class="bn">Jahr ${j}</td>${fz('1','saldo')}${fz('2','saldo')}${fz('3','saldo')}</tr></tfoot></table>` +
    berichtFuss('Gebucht heisst: wirklich erfasste Einnahmen und Ausgaben, ohne Umbuchungen');
}

/* ---- Kontobericht: Verlauf, Monat fuer Monat, jede Buchung ---------- */
function berichtKonto(kId) {
  const k = konto(kId);
  const a = ymOf(_ber.von);
  const alle = berBuchungen(b => b.kontoId === kId || b.gegenkontoId === kId);
  let s = kontosaldo(kId, a.m === 0 ? a.j-1 : a.j, a.m === 0 ? 11 : a.m-1);
  const anfang = s;
  const punkte = [anfang];
  const zeilen = alle.map(b => {
    const w = wirkung(b, kId); s = rd(s + w); punkte.push(s);
    const z = b.zeileId ? zeile(b.zeileId) : null;
    return `<tr><td class="bn">${z ? z.bezeichnung : artName(b.art)}
      <div class="bsub">${dmy(b.datum)}${b.text ? ' · ' + b.text : ''}${
        b.art === 'umbuchung' ? ' · ' + (b.kontoId===kId ? 'an ' + konto(b.gegenkontoId).name
                                                         : 'von ' + konto(b.kontoId).name) : ''}</div></td>
      ${zz(w,'saldo')}${zz(s)}</tr>`;
  }).join('');

  /* Monat fuer Monat — der Teil, der im alten Bericht fehlte. */
  const mon = monateImZeitraum();
  let lauf = anfang;
  const monZeilen = mon.map(x => {
    let ein = 0, aus = 0;
    alle.forEach(b => { const d = ymOf(b.datum);
      if (d.j !== x.j || d.m !== x.m) return;
      const w = wirkung(b, kId); if (w > 0) ein += w; else aus += -w; });
    lauf = rd(lauf + ein - aus);
    return `<tr class="bz" data-bgrp="${MON[x.m]} ${x.j}"><td class="bn">${MON_LANG[x.m]} ${x.j}</td>
      ${zz(ein,'plus')}${zz(aus,'minus')}${zz(rd(ein-aus),'saldo')}${zz(lauf)}${balken}</tr>`;
  }).join('');

  const bw = letzterBankwert(k);
  const eb = ymOf(_ber.bis);
  const diff = bw ? rd(bw.wert - kontosaldo(kId, eb.j, eb.m)) : null;
  const verlauf = _ber.verlauf && punkte.length > 1
    ? verlaufSvg(punkte, alle.map(b => b.datum.slice(8,10) + '.' + b.datum.slice(5,7)), 150) : '';

  return berichtKopf('GÄPP · Kontoauszug', k.nr + ' ' + k.name,
      dmy(_ber.von) + ' bis ' + dmy(_ber.bis) + ' · ' + alle.length +
        (alle.length===1?' Buchung':' Buchungen') + ' · ' + (k.frei ? 'frei verfügbar' : 'zweckgebunden'),
      [['Anfang', fmt(anfang)], ['Ende', fmt(s), s < 0 ? 'err' : ''],
       ['Bankauszug', bw ? fmt(bw.wert) : '–'],
       ['Differenz', bw ? fmt(diff) : '–', diff ? 'err' : '']]) +
    verlauf +
    `<h2 class="bh">Monat für Monat</h2>
     <table class="btab" data-anteil="2">
       <thead><tr><th class="bn">Monat</th><th class="bzahl">Ein</th><th class="bzahl">Aus</th>
         <th class="bzahl">Bewegung</th><th class="bzahl">Endstand</th>
         <th class="banteil">Anteil Ausgaben</th></tr></thead>
       <tbody>${monZeilen}</tbody>
       <tfoot><tr><td class="bn">Zeitraum</td>${fz('1','plus')}${fz('2','minus')}${fz('1|-2','saldo')}
         <td class="bzahl">${fmt(s)}</td><td class="banteil"></td></tr></tfoot></table>

     <h2 class="bh">Jede Buchung</h2>
     <table class="btab">
       <thead><tr><th class="bn">Position</th><th class="bzahl">Betrag</th>
         <th class="bzahl">Saldo</th></tr></thead><tbody>
       <tr><td class="bn">Anfangsstand<div class="bsub">${dmy(_ber.von)}</div></td>
         <td class="bzahl"><span class="nix">–</span></td>${zz(anfang)}</tr>
       ${zeilen}
       </tbody>
       <tfoot><tr><td class="bn">Endstand ${dmy(_ber.bis)}</td><td class="bzahl"></td>
         <td class="bzahl">${fmt(s)}</td></tr></tfoot></table>` +
    (bw ? `<p class="ber-notiz">Bankauszug vom ${dmy(bw.datum)}: ${fmt(bw.wert)} · Quelle: ${bw.quelle || 'von Hand'}${
       diff ? ' · Differenz zum gebuchten Stand ' + fmt(diff) : ' · stimmt mit dem gebuchten Stand überein'}</p>` : '') +
    berichtFuss();
}

/* ---- Bericht ueber eine Verbindlichkeit ----------------------------- */
function berichtSchuld(vId) {
  const v = verbind(vId);
  const bew = [];
  D.buchungen.filter(b => b.verbId === vId && b.datum >= _ber.von && b.datum <= _ber.bis)
    .forEach(b => bew.push([b.datum, 'Zahlung' + (b.text ? ' · ' + b.text : ''), -b.betrag]));
  (v.erhoehungen||[]).filter(e => e.datum >= _ber.von && e.datum <= _ber.bis)
    .forEach(e => bew.push([e.datum, e.text || (e.art==='minderung'?'Minderung':'Erhöhung'),
      e.art==='minderung' ? -e.betrag : e.betrag]));
  bew.sort((a,b) => a[0] < b[0] ? -1 : 1);
  const a = ymOf(_ber.von), eb = ymOf(_ber.bis);
  let lauf = verbindStand(v, a.m === 0 ? a.j-1 : a.j, a.m === 0 ? 11 : a.m-1);
  const anfang = lauf;
  const zeilen = bew.map(r => { lauf = rd(lauf + r[2]);
    return `<tr><td class="bn">${r[1]}<div class="bsub">${dmy(r[0])}</div></td>
      ${zz(r[2],'saldo')}${zz(lauf)}</tr>`; }).join('');

  const mon = monateImZeitraum();
  const verlauf = _ber.verlauf && mon.length > 1
    ? verlaufSvg(mon.map(x => verbindPrognose(v, x.j, x.m)), mon.map(x => MON[x.m]), 150) : '';

  /* Jahr fuer Jahr — Stand, gezahlt, und was der Zins gefressen hat. */
  const jahre = Object.keys(D.budget).map(Number).sort();
  const jahrZeilen = jahre.map(j => {
    const anf = j === jahre[0] ? verbindStand(v, j-1, 11) : verbindPrognose(v, j-1, 11);
    const end = verbindPrognose(v, j, 11);
    let gez = 0;
    for (let m = 0; m < 12; m++) {
      const g = rd(D.buchungen.reduce((x,b) => { const d = ymOf(b.datum);
        return (b.verbId === v.id && d.j === j && d.m === m) ? x + b.betrag : x; }, 0));
      const h = ymOf(heuteISO());
      gez += g || (((j > h.j) || (j === h.j && m >= h.m)) ? rate(v, j, m) : 0);
    }
    const erh = rd((v.erhoehungen||[]).reduce((s,e) => ymOf(e.datum).j === j
      ? s + (e.art === 'minderung' ? -e.betrag : e.betrag) : s, 0));
    /* Was ueber Zahlungen und Erhoehungen hinaus dazukam, ist Zins und Gebuehr. */
    const kosten = rd(end - anf + gez - erh);
    return `<tr class="bz" data-bgrp="${j}"><td class="bn">${j}</td>
      ${zz(anf)}${zz(gez,'minus')}${zz(erh,'saldo')}${zz(kosten,'saldo')}${zz(end)}</tr>`;
  }).join('');

  const ende = tilgungsende(v);
  return berichtKopf('GÄPP · Verbindlichkeit', v.bezeichnung,
      GRUPPEN.find(g=>g.id===v.gruppe).name + ' · ' + dmy(_ber.von) + ' bis ' + dmy(_ber.bis) +
      ' · Herkunft: ' + v.herkunft,
      [['Stand heute', fmt(verbindStandHeute(v)), 'err'],
       ['Rate', fmt(rate(v, S.jahr, S.monat))],
       ['Zins im Monat', v.zinssatz ? v.zinssatz + ' %' : '–'],
       ['Gebühr', v.gebuehr ? fmt(v.gebuehr) : '–'],
       ['Getilgt', ende || 'nach Plan nicht', ende ? 'ok' : 'err']]) +
    verlauf +
    `<h2 class="bh">Bewegungen im Zeitraum</h2>
     <table class="btab">
       <thead><tr><th class="bn">Vorgang</th><th class="bzahl">Betrag</th>
         <th class="bzahl">Stand</th></tr></thead><tbody>
       <tr><td class="bn">Stand zu Beginn<div class="bsub">${dmy(_ber.von)}</div></td>
         <td class="bzahl"><span class="nix">–</span></td>${zz(anfang)}</tr>
       ${zeilen || '<tr><td class="bn" colspan="3">Im Zeitraum ist nichts gebucht.</td></tr>'}
       </tbody>
       <tfoot><tr><td class="bn">Stand am Ende ${dmy(_ber.bis)}</td><td class="bzahl"></td>
         <td class="bzahl">${fmt(lauf)}</td></tr></tfoot></table>

     <h2 class="bh">Jahr für Jahr</h2>
     <table class="btab">
       <thead><tr><th class="bn">Jahr</th><th class="bzahl">Anfang</th><th class="bzahl">Gezahlt</th>
         <th class="bzahl">Erhöhung</th><th class="bzahl">Zins und Gebühr</th>
         <th class="bzahl">Ende</th></tr></thead>
       <tbody>${jahrZeilen}</tbody>
       <tfoot><tr><td class="bn">Über alle Jahre</td><td class="bzahl"></td>${fz('2','minus')}
         ${fz('3','saldo')}${fz('4','saldo')}<td class="bzahl"></td></tr></tfoot></table>

     ${v.zahlung && v.zahlung.iban ? `<p class="ber-notiz">Zahlung an ${v.zahlung.iban}${
        v.zahlung.referenz ? ' · Referenz ' + v.zahlung.referenz : ''}</p>` : ''}
     ${v.vereinbarungBis ? `<p class="ber-notiz">Vereinbarung befristet bis ${dmy(v.vereinbarungBis)}.</p>` : ''}
     ${v.hinweis ? `<p class="ber-notiz">${v.hinweis}</p>` : ''}` +
    berichtFuss('Künftige Jahre sind gerechnet, nicht gebucht — mit Plan-Rate, Zins und Gebühr');
}

/* ---- Alle Verbindlichkeiten ueber alle Jahre ------------------------ */
function berichtSchuldenplan() {
  const jahre = Object.keys(D.budget).map(Number).sort();
  const nJ = jahre.length;
  const rows = GRUPPEN.map(g => {
    const liste = D.verbindlichkeiten.filter(v => v.aktiv !== false && v.gruppe === g.id);
    if (!liste.length) return '';
    const kopf = `<tr class="grp" data-gsum="${g.id}"><td class="bn">${g.name}</td>
      ${jahre.map((_,i) => `<td class="bzahl" data-sum="${i+1}" data-sig="wert"></td>`).join('')}
      <td class="bn"></td></tr>`;
    return kopf + liste.map(v => `<tr class="bz" data-g="${g.id}" data-bgrp="${v.bezeichnung}">
      <td class="bn">${v.bezeichnung}</td>
      ${jahre.map(j => zz(verbindPrognose(v, j, 11))).join('')}
      <td class="bn">${tilgungsende(v) || '<span class="err">nach Plan nicht</span>'}</td></tr>`).join('');
  }).join('');
  const summen = jahre.map(j => schuldenPrognose(j, 11));
  const verlauf = _ber.verlauf ? verlaufSvg(summen, jahre.map(String), 160) : '';

  /* Anteil am heutigen Schuldenberg — mit Rate, Zins und Balken. */
  const heute = D.verbindlichkeiten.filter(v => v.aktiv !== false)
    .map(v => ({ v, st: verbindStandHeute(v) }))
    .sort((a,b) => b.st - a.st);
  const anteilZeilen = heute.map(x => `<tr class="bz" data-bgrp="${x.v.bezeichnung}">
    <td class="bn">${x.v.bezeichnung}
      <div class="bsub">${GRUPPEN.find(g=>g.id===x.v.gruppe).name}</div></td>
    ${zz(x.st)}${zz(rate(x.v, S.jahr, S.monat),'minus')}
    <td class="bzahl">${[x.v.zinssatz ? x.v.zinssatz + ' %' : '',
        x.v.gebuehr ? fmt(x.v.gebuehr) : ''].filter(Boolean).join(' + ') ||
        '<span class="nix">–</span>'}</td>
    <td class="bn">${tilgungsende(x.v) || '<span class="err">nach Plan nicht</span>'}</td>${balken}</tr>`).join('');

  return berichtKopf('GÄPP · Verbindlichkeiten', 'Über alle Jahre',
      'Stand am Stichtag ' + dmy(D.meta.stichtag) + ' und prognostizierte Entwicklung',
      [['Am Stichtag', fmt(schuldenStichtag()), 'err'],
       ['Heute', fmt(rd(D.verbindlichkeiten.reduce((s,v)=>s+verbindStandHeute(v),0))), 'err'],
       ['Ende ' + jahre[nJ-1], fmt(summen[nJ-1]), summen[nJ-1] > 0.005 ? 'err' : 'ok']]) +
    verlauf +
    `<h2 class="bh">Stand am 31. Dezember, Jahr für Jahr</h2>
     <table class="btab">
       <thead><tr><th class="bn">Gläubiger</th>${jahre.map(j=>`<th class="bzahl">${j}</th>`).join('')}
         <th class="bn">Getilgt</th></tr></thead>
       <tbody>${rows}</tbody>
       <tfoot><tr><td class="bn">Summe</td>${jahre.map((_,i)=>fz(String(i+1))).join('')}
         <td class="bn"></td></tr></tfoot></table>

     <h2 class="bh">Anteil am heutigen Schuldenberg</h2>
     <table class="btab" data-anteil="1">
       <thead><tr><th class="bn">Gläubiger</th><th class="bzahl">Stand heute</th>
         <th class="bzahl">Rate</th><th class="bzahl">Zins und Gebühr</th><th class="bn">Getilgt</th>
         <th class="banteil">Anteil</th></tr></thead>
       <tbody>${anteilZeilen}</tbody>
       <tfoot><tr><td class="bn">Summe</td>${fz('1')}${fz('2','minus')}<td class="bzahl"></td>
         <td class="bn"></td><td class="banteil"></td></tr></tfoot></table>` +
    berichtFuss('Jahreswerte sind Stände am 31.12., gerechnet mit Zins und Gebühr');
}

function tilgungsende(v) {
  const a = ymOf(v.anfangsdatum);
  let j = a.j, m = a.m, s = v.anfangsstand;
  if (a.t >= tageImMonat(a.j, a.m)) { m++; if (m===12) { m=0; j++; } }
  const h = ymOf(heuteISO());
  for (let i = 0; i < 160 && s > 0.005; i++) {
    (v.erhoehungen||[]).forEach(e => { const d = ymOf(e.datum);
      if (d.j===j && d.m===m) s += (e.art==='minderung'?-e.betrag:e.betrag); });
    const gebucht = rd(D.buchungen.reduce((x,b) => { const d = ymOf(b.datum);
      return (b.verbId === v.id && d.j === j && d.m === m) ? x + b.betrag : x; }, 0));
    const kuenftig = (j > h.j) || (j === h.j && m >= h.m);
    s = rd(s * (1 + (v.zinssatz||0)/100) + (v.gebuehr||0) - (gebucht || (kuenftig ? rate(v, j, m) : 0)));
    if (s <= 0.005) return MON_LANG[m] + ' ' + j;
    m++; if (m===12) { m=0; j++; }
  }
  return null;
}

/* ---- Einen Bericht als eigenstaendige HTML-Datei sichern -------------
   Die Datei kann, was die Vorschau kann: Zeilen anklicken, ausblenden,
   Summen und Balken ziehen mit. Der Rechencode wird woertlich aus der App
   uebernommen — so gibt es keine zweite Fassung, die auseinanderlaufen
   koennte. Eingaben sind nicht bloss gesperrt, es gibt keine. */
function berichtAlsHtml() {
  const inhalt = $('#berichtVorschau').innerHTML;
  const stil = Array.from(document.styleSheets).map(bl => {
    try { return Array.from(bl.cssRules).map(r => r.cssText).join('\n'); } catch (e) { return ''; }
  }).join('\n');
  const tag = 'scr' + 'ipt';
  const titel = ($('#berichtVorschau h1') || { textContent:'Bericht' }).textContent;
  const skript = '<' + tag + '>\n' +
    fmt.toString() + '\n' + berichtRechnen.toString() + '\n' +
    'document.addEventListener("click", function (ev) {\n' +
    '  var tr = ev.target.closest ? ev.target.closest("tr.bz") : null;\n' +
    '  if (!tr) return;\n' +
    '  tr.classList.toggle("aus");\n' +
    '  berichtRechnen(tr.closest(".bericht"));\n' +
    '});\n' +
    'berichtRechnen(document.querySelector(".bericht"));\n' +
    '</' + tag + '>';
  const html = `<!DOCTYPE html><html lang="de-CH"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GÄPP — ${titel}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
${stil}
/* --- Die Hoehe ueberschreiben: hier ist kein Fenster, sondern ein Blatt. --- */
html,body{height:auto}
body{display:block;overflow:visible;background:var(--bg)}
</style></head><body>
<div class="efrahmen">
  <div class="ehinweis">
    <b>EINGEFRORENER STAND</b>
    <span>Ausgabe vom ${dmy(heuteISO())} · Zeilen lassen sich anklicken und ausblenden,
      Summen und Balken ziehen mit · keine Eingaben möglich</span>
    <span class="meldung" data-ausgeblendet></span>
    <button onclick="window.print()">Drucken oder als PDF</button>
  </div>
  <div class="ekarte">${inhalt}</div>
</div>
${skript}
</body></html>`;
  const b = new Blob([html], { type:'text/html' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(b);
  a.download = 'GAEPP-Bericht-' + heuteISO() + '.html';
  a.click();
}

/* ---- Eingefrorener HTML-Export des ganzen Tools (A-65, A-66) --------
   Oeffnet ohne Netz auf einem fremden Rechner. Reiter, Klappkoepfe und
   Filter arbeiten, aendern laesst sich nichts. */
function exportHtml() {
  const doc = document.documentElement.cloneNode(true);
  doc.querySelectorAll('script').forEach(s => s.remove());
  doc.querySelectorAll('link[rel="stylesheet"],link[rel="preconnect"]').forEach(l => l.remove());
  doc.querySelector('#inhalt').innerHTML = '';
  doc.querySelector('#blattHg').hidden = true;
  const tag = 'scr' + 'ipt';
  const daten = JSON.stringify(D).replace(/</g, '\\u003c');
  const skript =
    '<' + tag + '>window.GAEPP_FROZEN=' + daten + ';window.GAEPP_STAND=' +
    JSON.stringify(JSON.stringify({ jahr:S.jahr, monat:S.monat, zeitraum:S.zeitraum, modus:S.modus, reiter:S.reiter })) +
    ';</' + tag + '>' +
    '<' + tag + '>' + APP_QUELLTEXT + '</' + tag + '>';
  /* Ersetzung als Funktion, nicht als Zeichenkette: sonst deutet replace jedes
     $$ im eingefuegten Quelltext als Sonderzeichen und verkuerzt es zu $. */
  const html = '<!DOCTYPE html><html lang="de-CH">' +
    doc.innerHTML.replace('</body>', () => skript + '</body>') + '</html>';
  const b = new Blob([html], { type:'text/html' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(b); a.download = 'GAEPP-Stand-' + heuteISO() + '.html';
  a.click();
}

/* ===================================================================
   Benutzerhandbuch (A-90) — die acht Regeln, die man nicht erraet.
   Von Hand gepflegt, an einer Stelle.
   =================================================================== */
function blattHandbuch() {
  return { weit:true, titel:'Wie GÄPP tickt', koerper:`<div class="hb">
    <p>Acht Regeln stecken in GÄPP, die man nicht errät — sie stammen aus Entscheidungen,
       nicht aus Gewohnheit. Der Rest bedient sich von selbst.</p>

    <div class="regel"><h3>1. Eine offene Rechnung mindert den Kontostand nicht</h3>
    <p>Der Kontostand bildet ab, was die Bank sagt. Solange du eine Rechnung nicht bezahlt hast,
       ist das Geld noch da — die Bank weiss nichts von ihr. Was sie sehr wohl mindert, ist
       <b>«Frei per Monatsende»</b> — <b>aber nur, wenn sie auch von einem freien Konto bezahlt
       wird</b>. Läuft sie über Kreditoren, Rückstellungen oder Fixkosten, liegt das Geld dort
       schon bereit und war nie Teil deines freien Betrags.</p></div>

    <div class="regel"><h3>2. Mit Häkchen «Rückstellung» mindert sie gar nichts</h3>
    <p>Für manche Rechnungen legst du jeden Monat etwas zurück — Zahnarzt, Franchise, Serafe.
       Setzt du beim Erfassen das Häkchen <b>Rückstellung</b>, zählt die Rechnung weder gegen
       dein freies Geld noch in die Budgetzeile «Rechnungen». Sonst stünde sie zweimal da.
       <b>Du entscheidest das je Rechnung</b>, nicht die Position.</p></div>

    <div class="regel"><h3>3. Liquiditätskarte und «Frei per Monatsende» sind dieselbe Zahl</h3>
    <p>Die Karte oben und die Zeile im Budgetkopf rechnen nach derselben Regel: Bestand auf
       HHK minus die offenen, ungedeckten Rechnungen dieses Monats, die von dort bezahlt werden.
       Die Karte bricht den Wert zusätzlich auf die Tage bis zum nächsten Lohn herunter.
       <b>Nur der laufende Monat trägt einen Wert</b> — vergangene und künftige zeigen «–».</p></div>

    <div class="regel"><h3>4. Die Kachel öffnet ihr Blatt, das ist kein Ansichtswechsel</h3>
    <p>Ein Klick auf eine Kachel legt ein Blatt darüber. Die Kachelansicht bleibt darunter stehen,
       Escape bringt dich zurück, und du landest an derselben Stelle wie vorher.
       Gearbeitet wird im Blatt, gezeigt wird auf der Kachel.</p></div>

    <div class="regel"><h3>5. Du tippst nie ein Minuszeichen</h3>
    <p>Die Richtung kommt aus der Kategorie: Was unter Fixkosten steht, ist eine Ausgabe.
       In der Maske steht der Betrag, in den Summen erscheint er mit dem richtigen Vorzeichen.
       Einzige Ausnahme ist <b>Lohnabzug | Darlehen</b> — die Zeile steht beim Einkommen,
       läuft aber dagegen.</p></div>

    <div class="regel"><h3>6. Strg-Klick markiert, Doppelklick überträgt</h3>
    <p>In der Budgettabelle setzt ein einfacher Klick den Schreibcursor.
       <b>Strg-Klick</b> markiert eine Zelle und hebt die Markierung wieder auf.
       <b>Doppelklick</b> überträgt den Wert auf die folgenden Monate, auf Wunsch auch
       auf die Folgejahre.</p></div>

    <div class="regel"><h3>7. Der Punkt neben dem Zahnrad sagt, ob gesichert ist</h3>
    <p>Ocker heisst: es gibt eine Änderung, die noch nicht oben ist. GÄPP sichert von selbst,
       zweieinhalb Sekunden nachdem du aufgehört hast — zehn Handgriffe hintereinander
       ergeben <b>einen</b> Sicherungsvorgang, nicht zehn. Grün mit Uhrzeit heisst: alles oben.
       Rot heisst: es ging etwas schief, der Text daneben sagt was.</p></div>

    <div class="regel"><h3>8. Eine gelöschte Buchung ist endgültig weg</h3>
    <p>Stammdaten — Konten, Kategorien, Positionen — werden nie gelöscht, nur ausgeblendet;
       du holst sie in der Verwaltung zurück. <b>Buchungen, Rechnungen und Erhöhungen dagegen
       werden wirklich gelöscht</b>, nach einer Rückfrage. Das Netz darunter ist zweifach:
       jede Sicherung ist ein Punkt in der Git-Historie deines Datenrepos, und beim ersten
       Öffnen am Tag legt GÄPP eine Kopie in <b>02 -&nbsp; DB Backup</b>.</p></div>

    <h3>Berichte</h3>
    <p>In jedem Bericht lässt sich <b>jede Zeile anklicken</b>. Sie fällt zurück, und alles
       zieht mit: die Summen unten, die Anteilsbalken und die Kennzahlen im Kopf. So beantwortest
       du «was bliebe ohne diesen Posten» ohne zu rechnen. Ein zweiter Klick holt die Zeile
       zurück. Die gesicherte HTML-Datei kann dasselbe — auch auf einem fremden Rechner
       und ohne Netz.</p>

    <h3>Belege</h3>
    <p>Ein Beleg geht nie verloren. Ist der GÄPP-Ordner freigegeben, landet er sofort in
       <b>03 - Dokumente</b>, benannt nach Datum, Steller und Betrag. Ist er es nicht, wartet
       der Beleg im Browser und wird abgelegt, sobald du den Ordner freigibst — die Rechnung
       zeigt so lange <b>«liegt bereit, noch nicht abgelegt»</b>.</p>

    <h3>Was die Farben bedeuten</h3>
    <p><b>Orange</b> heisst «hier ist etwas aktiv oder auslösbar». <b>Rot</b> trägt das negative
       Vorzeichen und die zwei Fälle, in denen etwas nicht ging. <b>Grün</b> trägt das positive
       Vorzeichen — aber nie ein Guthaben für sich allein, sonst wäre der halbe Bildschirm grün.
       <b>Ocker</b> heisst «offen»: eine ungesicherte Änderung, eine offene Rechnung,
       ein Serienvorschlag, ein Beleg, der noch nicht abgelegt werden konnte.</p>
  </div>` };
}

function frage(text) { return window.confirm(text); }

/* ---- Werte in der Budgettabelle ------------------------------------- */
function budgetSetzen(zId, m, wert) {
  const j = String(S.jahr);
  if (!D.budget[j]) D.budget[j] = {};
  if (!D.budget[j][zId]) D.budget[j][zId] = { soll: 0, m: Array(12).fill(0) };
  D.budget[j][zId].m[m] = rd(wert);
  persist();
}
function rateSetzen(vId, m, wert) {
  const v = verbind(vId), j = String(S.jahr);
  if (!v.raten[j]) v.raten[j] = { soll: 0, m: Array(12).fill(0) };
  v.raten[j].m[m] = rd(wert);
  persist();
}
/* Doppelklick uebertraegt (A-33) */
function uebertragen(zId, m) {
  const wert = zeilenwert(zeile(zId), S.jahr, m);
  const bis = prompt('Wert ' + fmt(wert) + ' übertragen bis Monat (1–12), leer heisst bis Dezember:', '12');
  if (bis === null) return;
  const bisM = Math.min(11, Math.max(m, (parseInt(bis, 10) || 12) - 1));
  for (let i = m; i <= bisM; i++) budgetSetzen(zId, i, wert);
  const jahre = Object.keys(D.budget).map(Number).sort().filter(x => x > S.jahr);
  if (jahre.length && frage('Auch auf die Folgejahre ' + jahre[0] + ' bis ' + jahre[jahre.length-1] + ' übertragen?')) {
    jahre.forEach(j => {
      if (!D.budget[String(j)][zId]) D.budget[String(j)][zId] = { soll: wert, m: Array(12).fill(0) };
      for (let i = 0; i < 12; i++) D.budget[String(j)][zId].m[i] = wert;
    });
    persist();
  }
  zeichne();
}

/* ---- Klicks --------------------------------------------------------- */
document.addEventListener('click', async ev => {
  /* --- Bericht: eine Zeile anklicken blendet sie aus, und alles zieht mit.
     Steht vor der Knopf-Auswahl unten, weil eine Tabellenzeile kein Knopf ist. --- */
  const bzeile = ev.target.closest('#berichtVorschau tr.bz');
  if (bzeile) { bzeile.classList.toggle('aus'); return berichtRechnen($('#berichtVorschau')); }

  const t = ev.target.closest('[data-oeffne],[data-tat],[data-klapp],[data-filter],[data-reiter],' +
    '[data-blattreiter],[data-art],[data-krich],[data-takt],[data-sart],[data-zu],[data-weg],[data-add],' +
    '[data-spring],[data-schuld],[data-jedit],[data-jdel],[data-vbuch],[data-vskip],[data-rst],[data-rweg],' +
    '[data-beleg],[data-edel],[data-bericht],[data-vwum],[data-vwaus],[data-vwneu],[data-hb],' +
    '[data-rechauf],#ablage,button');
  if (!t) return;

  /* --- Kachel oeffnet ihr Blatt --- */
  const tat = t.dataset.tat;
  if (tat) { ev.stopPropagation();
    const [art, id] = tat.split(':');
    if (art === 'rechnungneu') { _belegDatei = null; _gelesen = null; return blattAuf('rechnung', null); }
    if (art === 'rstatus') { const r = D.rechnungen.find(x => x.id === id);
      if (r && r.status === 'offen') return rechnungBezahlen(r); return; }
    if (art === 'rechnung') return blattAuf('rechnungzeigen', id);
    blattAuf(art, id, art === 'konto' ? 'buchen' : art === 'schuld' ? 'zahlung' : null); return; }
  const oef = t.closest('[data-oeffne]');
  if (oef && !t.dataset.tat) {
    const [art, id] = oef.dataset.oeffne.split(':');
    if (art === 'rechnung') return blattAuf('rechnungzeigen', id);
    blattAuf(art, id, art === 'konto' ? 'journal' : art === 'schuld' ? 'zahlung' : null); return; }

  if (t.id === 'zurueck') return zeitSchritt(-1);
  if (t.id === 'vor')     return zeitSchritt(1);
  if (t.id === 'jetzt')   { const k = $('#kalender'); zeichneKalender(); k.hidden = !k.hidden;
                            t.setAttribute('aria-expanded', !k.hidden); return; }
  if (t.dataset.j !== undefined && t.closest('#jahre'))  { S.jahr = +t.dataset.j; $('#kalender').hidden = true; return zeichne(); }
  if (t.dataset.m !== undefined && t.closest('#monate')) { S.monat = +t.dataset.m; S.zeitraum = 'monat';
                                                           $('#kalender').hidden = true; return zeichne(); }
  if (t.id === 'ganzesJahr') { S.zeitraum = 'jahr'; $('#kalender').hidden = true; return zeichne(); }
  if (t.dataset.z) { S.zeitraum = t.dataset.z; return zeichne(); }
  if (t.dataset.m !== undefined && t.closest('#modus')) { S.modus = t.dataset.m; return zeichne(); }
  if (t.dataset.reiter) { S.reiter = t.dataset.reiter; return zeichne(); }

  if (t.id === 'btnVerwaltung') return blattAuf('verwaltung');
  if (t.id === 'btnSync' || t.id === 'btnErstStart') return blattAuf('sync');
  if (t.id === 'btnBericht') { _ber = berStandard(); return blattAuf('bericht', 'wahl:'); }
  if (t.id === 'btnHandbuch' || t.dataset.hb !== undefined) {
    entwurfSichern(); return blattAuf('handbuch', null, null, true); }

  /* --- Klappkoepfe, Filter --- */
  if (t.dataset.klapp) {
    const id = t.dataset.klapp;
    S.zu = S.zu.includes(id) ? S.zu.filter(x => x !== id) : S.zu.concat([id]);
    return zeichne();
  }
  if (t.id === 'btnKlappAlle') {
    const alle = D.kategorien.map(k => k.id).concat(GRUPPEN.map(g => 'g_' + g.id));
    S.zu = S.zu.length ? [] : alle; return zeichne();
  }
  if (t.dataset.filter) {
    const id = t.dataset.filter;
    S.filterAus = S.filterAus.includes(id) ? S.filterAus.filter(x => x !== id) : S.filterAus.concat([id]);
    return zeichne();
  }
  if (t.id === 'btnFilterAlle') { S.filterAus = []; return zeichne(); }
  if (t.id === 'btnSprung') return sprungliste(t);
  if (t.dataset.springziel) { const el = $(`[data-kat="${t.dataset.springziel}"]`);
    if (el) el.scrollIntoView({ block:'start' }); $('.sprung') && $('.sprung').remove(); return; }

  /* --- gespiegelte Zeile: Klick fuehrt in die Verbindlichkeiten --- */
  if (t.dataset.spring) {
    const g = zeileGruppe[t.dataset.spring];
    if (g) { S.reiter = 'verbind'; zeichne(); return; }
    if (t.dataset.spring === 'rech_betrag') { S.reiter = 'rechnung'; return zeichne(); }
  }
  if (t.dataset.schuld) return blattAuf('schuld', t.dataset.schuld, 'zahlung');

  /* --- Blatt --- */
  if (t.dataset.zu !== undefined) return blattZu();
  if (t.dataset.blattreiter) { entwurfSichern(); _blatt.reiter = t.dataset.blattreiter; return blattZeichnen(); }
  if (t.dataset.art)   { entwurfSichern(); _entwurf.art = t.dataset.art; return blattZeichnen(); }
  if (t.dataset.krich) { entwurfSichern(); _entwurf.richtung = t.dataset.krich; return blattZeichnen(); }
  if (t.dataset.takt || t.dataset.sart) {
    t.parentElement.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', b === t));
    return;
  }
  if (t.id === 'btnBuchen')  return buchungSpeichern();
  if (t.id === 'btnNaechstes') {
    const liste = D.konten.filter(k => k.aktiv !== false).sort((a,b)=>a.rang-b.rang);
    const i = liste.findIndex(k => k.id === _blatt.id);
    _blatt.id = liste[(i+1) % liste.length].id; _entwurf = null; return blattZeichnen();
  }
  if (t.id === 'btnAusbuchen') {
    const k = konto(_blatt.id), bw = letzterBankwert(k);
    const diff = rd(bw.wert - kontosaldo(k.id, S.jahr, S.monat));
    _entwurf = { kontoId:k.id, art:'korrektur', datum:heuteISO(), ganzerMonat:false,
                 betrag:fmt(Math.abs(diff)), richtung: diff < 0 ? 'minus' : 'plus', text:'', zeileId:'' };
    _blatt.reiter = 'buchen'; return blattZeichnen();
  }
  if (t.id === 'btnUebertrag') {
    const v = verbind(_blatt.id);
    const diff = rd(v.auszugswert - verbindStandHeute(v));
    const text = prompt('Warum weicht der Auszug ab? (Pflicht)', diff > 0 ? 'Saldoübertrag vom Gläubigerauszug' : '');
    if (!text) return;
    v.erhoehungen.push({ id:neueId('erh'), datum:v.auszugsdatum || heuteISO(),
      art: diff > 0 ? 'erhoehung' : 'minderung', betrag: Math.abs(diff), text });
    persist(); return blattZeichnen();
  }
  if (t.id === 'btnZahlung') {
    const v = verbind(_blatt.id), b = zahl($('#zBetrag').value);
    if (!b) { $('#zHint').textContent = 'Ohne Betrag geht es nicht.'; return; }
    D.buchungen.push({ id:neueId('b'), datum:$('#zDatum').value || heuteISO(), ganzerMonat:false,
      kontoId:$('#zKonto').value, art:'ausgabe', betrag:rd(b), gegenkontoId:null,
      zeileId:gruppeZeile[v.gruppe] ? null : null, text:$('#zText').value.trim() || ('Rate ' + v.bezeichnung),
      serieId:null, rechnungId:null, verbId:v.id, sparzielId:null, belegDatei:null, belegOffen:false });
    persist(); return blattZeichnen();
  }
  if (t.id === 'btnErhNeu') {
    const v = verbind(_blatt.id);
    const b = zahl(prompt('Betrag der Erhöhung (für eine Minderung mit Minus davor):', ''));
    if (!b) return;
    const minus = String(document.activeElement && '').length; /* Platzhalter */
    const text = prompt('Wofür? (Pflicht)', '');
    if (!text) return;
    v.erhoehungen.push({ id:neueId('erh'), datum:heuteISO(), art:'erhoehung', betrag:rd(b), text });
    persist(); return blattZeichnen();
  }
  if (t.dataset.edel) {
    const [vId, eId] = t.dataset.edel.split(':');
    if (!frage('Diese Erhöhung endgültig löschen?')) return;
    const v = verbind(vId);
    v.erhoehungen = v.erhoehungen.filter(e => e.id !== eId);
    persist(); return blattZeichnen();
  }
  if (t.id === 'btnSerieNeu') return blattAuf('serie', _blatt.id);
  if (t.id === 'btnSerieSpeichern') return serieSpeichern();
  if (t.dataset.vbuch) return vorschlagBuchen(t.dataset.vbuch);
  if (t.dataset.vskip) return vorschlagSkip(t.dataset.vskip);
  if (t.dataset.jdel) {
    if (!frage('Diese Buchung endgültig löschen? Sie ist danach weg — das Netz ist die Git-Historie.')) return;
    D.buchungen = D.buchungen.filter(b => b.id !== t.dataset.jdel);
    persist(); return blattZeichnen();
  }
  if (t.dataset.jedit) return journalBearbeiten(t.dataset.jedit);

  /* --- Rechnungen --- */
  if (t.id === 'btnRechNeu')       { _belegDatei = null; _gelesen = null; return blattAuf('rechnung', null); }
  if (t.id === 'btnRechSpeichern') return rechnungSpeichern();
  if (t.dataset.rweg) {
    if (!frage('Diese Rechnung endgültig löschen?')) return;
    D.rechnungen = D.rechnungen.filter(r => r.id !== t.dataset.rweg);
    persist();
    if (_blatt && (_blatt.art === 'rechnungzeigen' || _blatt.art === 'rechnung')) { _stapel = []; return blattZu(); }
    return zeichne();
  }
  if (t.dataset.rst) {
    const [id, st] = t.dataset.rst.split(':');
    const r = D.rechnungen.find(x => x.id === id);
    if (r.status === st) return;
    if (st === 'bezahlt') return rechnungBezahlen(r);
    r.status = 'offen'; persist();
    if (_blatt && _blatt.art === 'rechnungzeigen') return blattZeichnen();
    return zeichne();
  }
  if (t.dataset.beleg)   return belegOeffnen(t.dataset.beleg);
  if (t.dataset.rechauf) { _belegDatei = null; _gelesen = null;
    return blattAuf('rechnung', t.dataset.rechauf, null, _blatt && _blatt.art === 'rechnungzeigen'); }
  if (t.id === 'ablage' || t.closest('#ablage')) return belegWaehlen();

  /* --- Verwaltung --- */
  if (t.dataset.vwum)  return vwUmbenennen(t.dataset.vwum);
  if (t.dataset.vwaus) return vwAusblenden(t.dataset.vwaus);
  if (t.dataset.vwneu) return vwNeu(t.dataset.vwneu);
  if (t.id === 'btnOrdner') {
    await ordnerFreigeben();
    const n = await belegeNachreichen();
    if (n) alert(n + (n === 1 ? ' liegengebliebener Beleg wurde' : ' liegengebliebene Belege wurden') + ' abgelegt.');
    if (_blatt) blattZeichnen();
    return;
  }
  if (t.id === 'btnJahrNeu') return jahrAnlegen();

  /* --- Zeilen der Budgettabelle --- */
  if (t.dataset.weg) {
    const z = zeile(t.dataset.weg);
    if (!frage('«' + z.bezeichnung + '» ausblenden? Die Werte bleiben erhalten, du holst sie in der Verwaltung zurück.')) return;
    z.aktiv = false; persist(); return zeichne();
  }
  if (t.dataset.add) {
    const name = prompt('Bezeichnung der neuen Zeile in «' + kategorie(t.dataset.add).name + '»:');
    if (!name) return;
    const rang = Math.max(0, ...D.zeilen.filter(z => z.kategorieId === t.dataset.add).map(z => z.rang || 0)) + 1;
    D.zeilen.push({ id: neueId('z'), kategorieId: t.dataset.add, bezeichnung: name.trim(),
      zahlungsweg:{ tag:null, art:'' }, gespiegeltAus:null, gegenrichtung:false, rang, aktiv:true });
    persist(); return zeichne();
  }

  /* --- Sync --- */
  if (t.id === 'btnSyncSpeichern') {
    GH = { repo:$('#ghRepo').value.trim(), branch:$('#ghBranch').value.trim() || 'main', token:$('#ghToken').value.trim() };
    if (GH.repo && !/^[\w.-]+\/[\w.-]+$/.test(GH.repo)) { alert('Das Repo muss so aussehen: owner/name'); return; }
    localStorage.setItem(SCHLUESSEL_GH, JSON.stringify(GH));
    blattZu();
    if (GH.repo && GH.token) await ghPull();
    return;
  }
  if (t.id === 'btnPull') { GH = { repo:$('#ghRepo').value.trim(), branch:$('#ghBranch').value.trim()||'main', token:$('#ghToken').value.trim() };
    localStorage.setItem(SCHLUESSEL_GH, JSON.stringify(GH)); const ok = await ghPull(true);
    $('#syncStand').textContent = $('#syncText').textContent; if (ok) { blattZu(); } return; }
  if (t.id === 'btnPush') { await ghPush(); $('#syncStand').textContent = $('#syncText').textContent; return; }
  if (t.id === 'btnJsonAb')  return jsonAb();
  if (t.id === 'btnJsonAuf') return jsonAuf();

  /* --- Berichte --- */
  if (t.dataset.bericht) { _ber = berStandard();
    const v = t.dataset.bericht;
    if (v.startsWith('konto:'))  { _ber.art='konto'; _ber.kontoId=v.slice(6); _ber.verbId=null; }
    if (v.startsWith('schuld:')) { _ber.art='konto'; _ber.verbId=v.slice(7); }
    return blattAuf('bericht', v, null, true); }
  if (t.id === 'btnBerichtErzeugen') {
    berEinlesen();
    if (_ber.art === 'export') { exportHtml(); return blattZu(); }
    return blattAuf('bericht', 'zeige:' + _ber.art, null, true);
  }
  if (t.id === 'btnBerichtZurueck') return blattZu();
  if (t.id === 'btnBerichtHtml')    return berichtAlsHtml();
  if (t.dataset.berkat) {
    berEinlesen();
    const id = t.dataset.berkat;
    _ber.kategorien = _ber.kategorien.includes(id)
      ? _ber.kategorien.filter(x => x !== id) : _ber.kategorien.concat([id]);
    return blattZeichnen();
  }
  if (t.dataset.zeit) {
    berEinlesen();
    const h = ymOf(heuteISO());
    if (t.dataset.zeit === 'monat') {
      _ber.von = iso(S.jahr, S.monat, 1);
      _ber.bis = iso(S.jahr, S.monat, tageImMonat(S.jahr, S.monat));
    } else if (t.dataset.zeit === 'jahr') {
      _ber.von = iso(S.jahr, 0, 1); _ber.bis = iso(S.jahr, 11, 31);
    } else {
      const jahre = Object.keys(D.budget).map(Number).sort();
      _ber.von = D.meta.stichtag; _ber.bis = iso(jahre[jahre.length-1], 11, 31);
    }
    return blattZeichnen();
  }
  if (t.id === 'btnDrucken') {
    $('#druck').innerHTML = $('#berichtVorschau').innerHTML;
    window.print(); return;
  }
});

/* ---- Zellen: Strg-Klick markiert, Doppelklick uebertraegt (A-33/A-37) --- */
document.addEventListener('click', ev => {
  const td = ev.target.closest('td.bearbeitbar');
  if (!td || !ev.ctrlKey) return;
  ev.preventDefault();
  const k = (td.dataset.z || td.dataset.vr) + ':' + td.dataset.m;
  S.markiert = S.markiert.includes(k) ? S.markiert.filter(x => x !== k) : S.markiert.concat([k]);
  td.classList.toggle('markiert');
  persistAnsicht();
});
document.addEventListener('dblclick', ev => {
  const td = ev.target.closest('td.bearbeitbar[data-z]');
  if (!td) return;
  ev.preventDefault();
  uebertragen(td.dataset.z, +td.dataset.m);
});
document.addEventListener('change', ev => {
  if (ev.target.name === 'ber') { berEinlesen(); blattZeichnen(); return; }
  if (ev.target.id === 'rSteller' && ev.target.value === '__neu') {
    const name = prompt('Wie heisst der neue Rechnungssteller?');
    if (!name || !name.trim()) { ev.target.value = ''; return; }
    const s2 = { id: neueId('st'), name: name.trim(),
                 gruppeId: (D.stellerGruppen.find(g => g.name === 'Divers') || D.stellerGruppen[0]).id,
                 aktiv: true };
    D.steller.push(s2);
    persist();
    ev.target.innerHTML = stellerOptionen(s2.id);
    ev.target.value = s2.id;
    return;
  }
  const td = ev.target.closest('td.bearbeitbar');
  if (td) {
    const w = zahl(ev.target.value);
    if (td.dataset.z)  budgetSetzen(td.dataset.z, +td.dataset.m, w);
    if (td.dataset.vr) rateSetzen(td.dataset.vr, +td.dataset.m, w);
    ev.target.value = w ? fmt(w) : '';
    /* Die Kopfzeilen und Summen muessen sofort mitziehen. */
    zeichne();
    return;
  }
  if (ev.target.id === 'bankwert') {
    const k = konto(_blatt.id), w = zahl(ev.target.value);
    k.bankwerte = (k.bankwerte || []).filter(b => b.datum !== heuteISO());
    if (w) k.bankwerte.push({ datum: heuteISO(), wert: rd(w), quelle: 'von Hand' });
    persist(); blattZeichnen(); return;
  }
  if (ev.target.id === 'auszugswert') {
    const v = verbind(_blatt.id), w = zahl(ev.target.value);
    v.auszugswert = w ? rd(w) : null; v.auszugsdatum = w ? heuteISO() : null;
    persist(); blattZeichnen(); return;
  }
  if (ev.target.id === 'vwLohntag') {
    const n = parseInt(ev.target.value, 10);
    if (n >= 1 && n <= 31) { D.meta.lohntag = n; persist(); }
    return;
  }
});

/* ---- Tastatur -------------------------------------------------------- */
document.addEventListener('keydown', ev => {
  if (ev.key === 'Escape') {
    if ($('#kalender') && !$('#kalender').hidden) { $('#kalender').hidden = true; return; }

/* ---- Belege per Ziehen und Ablegen (A-56) ---------------------------- */
document.addEventListener('dragover', ev => {
  ev.preventDefault();
  const a = ev.target.closest && ev.target.closest('#ablage');
  if (a) a.classList.add('drueber');
});
document.addEventListener('dragleave', ev => {
  const a = ev.target.closest && ev.target.closest('#ablage');
  if (a) a.classList.remove('drueber');
});
document.addEventListener('drop', async ev => {
  ev.preventDefault();
  const f = ev.dataTransfer.files[0];
  if (!f || !D) return;
  await belegUebernehmen(f);
});
let _belegDatei = null;
/* Ziehen ist nicht der einzige Weg — ein Klick auf die Flaeche waehlt eine Datei. */
function belegWaehlen() {
  const i = document.createElement('input');
  i.type = 'file'; i.accept = 'image/*,.pdf,.png,.jpg,.jpeg,.webp,.heic';
  i.onchange = async () => { if (i.files[0]) await belegUebernehmen(i.files[0]); };
  i.click();
}
/* Eine abgelegte Datei: Maske oeffnen, lesen, dann mit dem Gelesenen neu zeichnen. */
async function belegUebernehmen(f) {
  _belegDatei = f; _gelesen = { laeuft:true, name:f.name };
  if (_blatt && _blatt.art === 'rechnung') blattZeichnen(); else blattAuf('rechnung', null);
  await belegAuswerten(f);
  if (_blatt && _blatt.art === 'rechnung') blattZeichnen();
}

/* ---- Hilfsfunktionen zu den Ereignissen ------------------------------ */
function sprungliste(knopf) {
  if ($('.sprung')) { $('.sprung').remove(); return; }
  const el = document.createElement('div');
  el.className = 'sprung';
  el.innerHTML = D.kategorien.filter(k => k.aktiv !== false && !S.filterAus.includes(k.id))
    .sort((a,b)=>a.rang-b.rang)
    .map(k => `<button data-springziel="${k.id}">${k.name}</button>`).join('');
  knopf.parentElement.appendChild(el);
}
function journalBearbeiten(id) {
  const b = D.buchungen.find(x => x.id === id);
  const neu = prompt('Betrag ändern:', fmt(b.betrag));
  if (neu === null) return;
  const w = zahl(neu);
  if (!w) return;
  b.betrag = rd(w); persist(); blattZeichnen();
}
function vorschlagBuchen(arg) {
  const [sid, datum] = arg.split(':');
  const s = D.serien.find(x => x.id === sid);
  const v = s.vorlage;
  D.buchungen.push({ id:neueId('b'), datum, ganzerMonat:false, kontoId:v.kontoId, art:v.art,
    betrag:rd(v.betrag), gegenkontoId:v.gegenkontoId || null, zeileId:v.zeileId || null,
    text:v.text || '', serieId:s.id, rechnungId:null, verbId:v.verbId || null, sparzielId:null,
    belegDatei:null, belegOffen:false });
  persist(); blattZeichnen();
}
function vorschlagSkip(arg) {
  const [sid, datum] = arg.split(':');
  const s = D.serien.find(x => x.id === sid);
  s.uebersprungen = (s.uebersprungen || []).concat([datum.slice(0,7)]);
  persist(); blattZeichnen();
}
function serieSpeichern() {
  const takt = $('[data-takt][aria-pressed="true"]').dataset.takt;
  const art  = $('[data-sart][aria-pressed="true"]').dataset.sart;
  const betrag = zahl($('#sBetrag').value);
  if (!betrag) return;
  D.serien.push({ id:neueId('s'), takt, start:$('#sStart').value || heuteISO(),
    ende:$('#sEnde').value || null, aktiv:true, uebersprungen:[],
    vorlage:{ kontoId:$('#sKonto').value, art, betrag:rd(betrag), zeileId:$('#sZeile').value || null,
      gegenkontoId:$('#sGegen').value || null, text:$('#sText').value.trim(),
      tag: parseInt($('#sTag').value, 10) || D.meta.lohntag } });
  persist(); blattZu();
}
async function rechnungSpeichern() {
  const st = $('#rSteller').value, betrag = zahl($('#rBetrag').value);
  if (!st)     { $('#rHint').textContent = 'Wer stellt die Rechnung?'; return; }
  if (!betrag) { $('#rHint').textContent = 'Ohne Betrag geht es nicht.'; return; }
  const faellig = $('#rFaellig').value || heuteISO();
  const vorhanden = $('#rId') ? D.rechnungen.find(x => x.id === $('#rId').value) : null;
  const r = vorhanden || { id: neueId('r'), status:'offen', belegDatei:null, belegOffen:false };
  r.stellerId = st; r.betrag = rd(betrag); r.faelligkeit = faellig;
  r.zeileId = $('#rZeile').value; r.gedeckt = $('#rGedeckt').checked;
  r.kontoId = $('#rKonto').value; r.notiz = $('#rNotiz').value.trim();
  if (!vorhanden) D.rechnungen.push(r);
  /* Ein Beleg geht nie verloren: erst in den Ordner, sonst in den Zwischenspeicher (E-12). */
  if (_belegDatei) {
    const name = belegName(_belegDatei, steller(st).name, r.betrag, faellig);
    if (await belegSchreiben(_belegDatei, name)) { r.belegDatei = name; r.belegOffen = false; }
    else { await belegMerken(r.id, _belegDatei, name); r.belegDatei = null; r.belegOffen = true; }
    _belegDatei = null;
  }
  _gelesen = null;
  persist(); blattZu();
}
/* «Bezahlt markieren» erzeugt die Zahlungsbuchung (Albrecht, 17.08.2026) */
function rechnungBezahlen(r) {
  const eingabe = prompt('Wann wurde sie bezahlt?', heuteISO());
  if (eingabe === null) return;              /* abgebrochen */
  const datum = /^\d{4}-\d{2}-\d{2}$/.test(eingabe) ? eingabe : heuteISO();
  D.buchungen.push({ id:neueId('b'), datum, ganzerMonat:false, kontoId:r.kontoId, art:'ausgabe',
    betrag:r.betrag, gegenkontoId:null, zeileId:r.zeileId, text:steller(r.stellerId).name,
    serieId:null, rechnungId:r.id, verbId:null, sparzielId:null,
    belegDatei:r.belegDatei, belegOffen:false });
  r.status = 'bezahlt';
  persist();
  if (_blatt && _blatt.art === 'rechnungzeigen') blattZeichnen(); else zeichne();
}
function vwUmbenennen(arg) {
  const [art, id] = arg.split(':');
  const o = { konto:konto, kategorie:kategorie, zeile:zeile, steller:steller,
              sparziel:i=>D.sparziele.find(x=>x.id===i) }[art](id);
  const feld = art === 'zeile' ? 'bezeichnung' : 'name';
  const neu = prompt('Neue Bezeichnung:', o[feld]);
  if (!neu) return;
  o[feld] = neu.trim(); persist(); blattZeichnen();
}
function vwAusblenden(arg) {
  const [art, id] = arg.split(':');
  const o = { konto:konto, kategorie:kategorie, zeile:zeile, steller:steller,
              sparziel:i=>D.sparziele.find(x=>x.id===i) }[art](id);
  o.aktiv = o.aktiv === false;
  persist(); blattZeichnen();
}
function vwNeu(art) {
  const name = prompt('Bezeichnung:');
  if (!name) return;
  if (art === 'kategorie') {
    const kId = prompt('Welches Konto führt diese Kategorie? (Nummer, z.B. 03)', '03');
    const k = D.konten.find(x => x.nr === String(kId).padStart(2,'0'));
    D.kategorien.push({ id:neueId('k'), name:name.trim(), kontoId:k ? k.id : 'hhk', richtung:'aus',
      rang: Math.max(...D.kategorien.map(x=>x.rang)) + 1, aktiv:true });
  }
  if (art === 'steller') {
    D.steller.push({ id:neueId('st'), name:name.trim(), gruppeId:D.stellerGruppen[0].id, aktiv:true });
  }
  if (art === 'sparziel') {
    const ziel = zahl(prompt('Zielbetrag:', '0'));
    D.sparziele.push({ id:neueId('sp'), name:name.trim(), zielbetrag:rd(ziel), kontoId:null, aktiv:true });
  }
  persist(); blattZeichnen();
}

/* Was in der Berichtsmaske steht, in den Zustand uebernehmen. */
function berEinlesen() {
  if (!_ber) _ber = berStandard();
  const w = $('input[name="ber"]:checked');
  if (w) _ber.art = w.value;
  if ($('#berVon')) _ber.von = $('#berVon').value || _ber.von;
  if ($('#berBis')) _ber.bis = $('#berBis').value || _ber.bis;
  if ($('#berVerlauf')) _ber.verlauf = $('#berVerlauf').checked;
  if ($('#berKonto')) {
    const v = $('#berKonto').value;
    if (v.startsWith('k:')) { _ber.kontoId = v.slice(2); _ber.verbId = null; }
    else { _ber.verbId = v.slice(2); }
  }
}

/* ---- Budgetjahr anlegen (A-86) — und dabei die Ratenplaene mitschreiben.
   Sonst stehen nach dem Jahreswechsel zehn Schulden ohne Raten da. ------ */
function jahrAnlegen() {
  const jahre = Object.keys(D.budget).map(Number).sort();
  const vorschlag = jahre[jahre.length-1] + 1;
  const eingabe = prompt('Welches Jahr anlegen?', String(vorschlag));
  if (!eingabe) return;
  const j = parseInt(eingabe, 10);
  if (!j || j < 2000 || j > 2100) return;
  if (D.budget[String(j)] && !frage('Das Jahr ' + j + ' gibt es schon. Überschreiben?')) return;
  const fort = frage('Das Vorjahr fortschreiben?\n\nOK  = Werte des Vorjahrs übernehmen\nAbbrechen = leeres Jahr');
  const vor = String(j - 1);
  D.budget[String(j)] = {};
  D.zeilen.forEach(z => {
    if (z.gespiegeltAus || zeileGruppe[z.id]) return;
    const q = fort && D.budget[vor] ? D.budget[vor][z.id] : null;
    D.budget[String(j)][z.id] = q ? { soll:q.soll, m:q.m.slice() } : { soll:0, m:Array(12).fill(0) };
  });
  /* Die Ratenplaene gehoeren dazu — ohne sie zeigen die gespiegelten Budgetzeilen null
     und die Tilgungsprognose endet am Jahreswechsel. */
  D.verbindlichkeiten.forEach(v => {
    const q = fort ? v.raten[vor] : null;
    v.raten[String(j)] = q ? { soll:q.soll, m:q.m.slice() } : { soll:0, m:Array(12).fill(0) };
  });
  persist();
  S.jahr = j;
  blattZeichnen();
}

/* ===================================================================
   Start
   =================================================================== */
async function start() {
  try { const g = JSON.parse(localStorage.getItem(SCHLUESSEL_GH) || 'null'); if (g) GH = g; } catch (err) {}
  try {
    const roh = JSON.parse(localStorage.getItem(SCHLUESSEL_DATEN) || 'null');
    if (roh && roh.d) { uebernehmen(roh.d); if (roh.s) S = Object.assign(S, roh.s); }
  } catch (err) {}
  /* Eingefrorener Export: Daten stecken in der Datei, nichts laesst sich aendern (A-65) */
  if (window.GAEPP_FROZEN) {
    D = window.GAEPP_FROZEN; _ro = true;
    document.body.classList.add('readonly');
    try { S = Object.assign(S, JSON.parse(window.GAEPP_STAND || '{}')); } catch (err) {}
    GH = { repo:'', branch:'main', token:'' };
    setSync('off', 'Eingefrorener Stand');
    zeichne();
    document.addEventListener('change', e => { e.preventDefault(); e.stopPropagation(); }, true);
    return;
  }
  _ordner = await ordnerHolen();
  zeichne();
  if (GH.repo && GH.token && !window.GAEPP_FROZEN) { await ghPull(); }
  else setSync('lokal', D ? 'Lokal — kein Repo verbunden' : 'Noch keine Daten');
  if (D) { _sig = JSON.stringify(D); tagessicherung(); }
  /* Ein Blatt, das beim Neuladen offen war, geht nicht wieder auf — die Ansicht
     soll beim Start ruhig sein. Der Zeitraum und die Klappzustaende bleiben. */
  S.blatt = null;
}
/* Der eingefrorene Export traegt denselben Quelltext wie die App. Er wird aus
   dem eigenen Script-Element gelesen — so steht er genau einmal in der Datei. */
function appQuelltext() { const s = document.getElementById('gaeppApp'); return s ? s.textContent : ''; }
Object.defineProperty(window, 'APP_QUELLTEXT', { get: appQuelltext });
document.addEventListener('DOMContentLoaded', start);
