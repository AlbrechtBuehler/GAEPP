/* ===================================================================
   Belegablage und Tagessicherung (E-12, E-13)
   Ein Browser darf nicht frei ins Dateisystem schreiben. Er darf es,
   wenn der Mensch ihm einen Ordner ausdruecklich freigibt.

   Am 17.08.2026 an drei Stellen ueberarbeitet:

   A0  GAEPP legte den gesuchten Unterordner blind an — auch dann, wenn
       der freigegebene Ordner selbst schon der gesuchte war. Wer
       «03 - Dokumente» freigab, bekam «03 - Dokumente\03 - Dokumente».
       Jetzt wird beim Freigeben geprueft, ob wirklich der GAEPP-Ordner
       gewaehlt wurde, und gesagt, wenn nicht.

   A1  Belege liegen nach Jahr getrennt in «04 - Rechnungsablage»; das
       Jahr kommt aus der Faelligkeit. Beim Buchen der Zahlung wandert
       der Beleg in den Unterordner «Bezahlt».

   F-03 Die Tagessicherung lief beim Start der App und scheiterte dort
       lautlos: Ein Browser erteilt eine Ordnerberechtigung nur nach
       einer Nutzergeste, und beim Start gibt es keine. Sie hat deshalb
       nie geschrieben. Jetzt fragt sie beim Start gar nicht erst,
       sondern holt nach, sobald geklickt wird — und sagt, wenn sie
       nicht schreiben konnte. Eine Sicherung, die lautlos ausfaellt,
       ist gefaehrlicher als gar keine, weil man sich auf sie verlaesst.
   =================================================================== */

/* Woran GAEPP seinen eigenen Ordner erkennt (A0). */
const GAEPP_UNTERORDNER = ['00 - Inbox', '01 - APP', '02 -  DB Backup',
                           '03 - Dokumente', '04 - Rechnungsablage', '05 Archiv'];
const ORD_BELEGE    = '04 - Rechnungsablage';
const ORD_SICHERUNG = '02 -  DB Backup';
const ORD_BEZAHLT   = 'Bezahlt';

let _ordner     = null;
let _ordnerRuege = null;   /* A0: was am freigegebenen Ordner nicht stimmt */
let _sichOffen  = false;   /* F-03: Sicherung wartet auf eine Nutzergeste */
let _sichFehler = null;    /* F-03: warum sie zuletzt nicht schreiben konnte */

/* ---- A0: Ist das wirklich der GAEPP-Ordner? ------------------------- */
async function ordnerPruefen(h) {
  if (!h) return null;
  if (GAEPP_UNTERORDNER.includes(h.name)) {
    return 'Du hast «' + h.name + '» freigegeben — das ist ein Ordner *innerhalb* von GÄPP. ' +
           'GÄPP braucht den GÄPP-Ordner selbst, sonst legt es seine Ordner ein zweites Mal an. ' +
           'Gib bitte den Ordner «GÄPP» frei.';
  }
  try {
    let treffer = 0;
    for await (const [name, eintrag] of h.entries()) {
      if (eintrag.kind === 'directory' && GAEPP_UNTERORDNER.includes(name)) treffer++;
    }
    if (treffer < 2) {
      return 'In «' + h.name + '» stehen die GÄPP-Ordner nicht. Wenn das der richtige Ordner ' +
             'ist, legt GÄPP sie beim ersten Schreiben an — sonst gib bitte den Ordner ' +
             '«GÄPP» frei.';
    }
  } catch (err) { return null; }   /* nicht lesbar: keine Behauptung aufstellen */
  return null;
}

async function ordnerFreigeben() {
  if (!window.showDirectoryPicker) {
    alert('Dieser Browser kann keinen Ordner freigeben. GÄPP braucht dafür Chrome oder Edge.'); return;
  }
  try {
    _ordner = await window.showDirectoryPicker({ mode:'readwrite' });
    _ordnerRuege = await ordnerPruefen(_ordner);
    await ordnerMerken(_ordner);
    if (_ordnerRuege) alert(_ordnerRuege);
    if (_blatt && _blatt.art === 'verwaltung') blattZeichnen();
  } catch (err) { /* abgebrochen */ }
}
/* Die Freigabe wird in IndexedDB gemerkt — localStorage kann keine Handles halten. */
function idb() {
  return new Promise((ok, nein) => {
    const r = indexedDB.open('gaepp', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('h');
    r.onsuccess = () => ok(r.result); r.onerror = () => nein(r.error);
  });
}
async function ordnerMerken(h) {
  try { const db = await idb();
    await new Promise(ok => { const t = db.transaction('h','readwrite');
      t.objectStore('h').put(h, 'ordner'); t.oncomplete = ok; });
  } catch (err) {}
}
async function ordnerHolen() {
  try {
    const db = await idb();
    const h = await new Promise(ok => { const t = db.transaction('h','readonly');
      const q = t.objectStore('h').get('ordner'); q.onsuccess = () => ok(q.result); });
    if (!h) return null;
    await h.queryPermission({ mode:'readwrite' });
    return h;                     /* Bestaetigungsklick kann noch noetig sein */
  } catch (err) { return null; }
}

/* opt.ohneGeste: nur fragen, was ohne Nutzergeste erlaubt ist (F-03).
   opt.nichtAnlegen: den Ordner nicht erzeugen, nur oeffnen, wenn er da ist. */
async function unterordner(name, opt) {
  if (!_ordner) return null;
  opt = opt || {};
  try {
    if ((await _ordner.queryPermission({ mode:'readwrite' })) !== 'granted') {
      /* F-03: Ohne Nutzergeste lehnt der Browser requestPermission ab. Beim
         Start wird deshalb gar nicht erst gefragt — es wird nachgeholt. */
      if (opt.ohneGeste) return null;
      if ((await _ordner.requestPermission({ mode:'readwrite' })) !== 'granted') return null;
    }
    /* A0: Ist der freigegebene Ordner selbst schon der gesuchte, wird nicht
       gedoppelt. Das ist das Netz unter der Pruefung beim Freigeben. */
    if (_ordner.name === name) return _ordner;
    return await _ordner.getDirectoryHandle(name, { create: !opt.nichtAnlegen });
  } catch (err) { return null; }
}

/* ---- A1: Jahresordner und «Bezahlt» --------------------------------- */
function belegJahr(r) {
  const d = (r && r.faelligkeit) || heuteISO();
  return String(d).slice(0, 4);
}
async function belegOrdner(jahr, bezahlt, opt) {
  const wurzel = await unterordner(ORD_BELEGE, opt);
  if (!wurzel) return null;
  try {
    const j = await wurzel.getDirectoryHandle(String(jahr), { create: !(opt && opt.nichtAnlegen) });
    if (!bezahlt) return j;
    return await j.getDirectoryHandle(ORD_BEZAHLT, { create: !(opt && opt.nichtAnlegen) });
  } catch (err) { return null; }
}
function belegName(datei, stellerName, betrag, datum) {
  const endung = (String(datei.name).match(/\.[a-z0-9]+$/i) || ['.pdf'])[0];
  return `${datum} - ${stellerName} - ${fmt(betrag)}${endung}`;
}
/* Ein Beleg geht nie verloren. Ist kein Ordner freigegeben oder klemmt der
   Zugriff, wandert die Datei in den Zwischenspeicher des Browsers und wird
   nachgereicht, sobald der Ordner wieder da ist. */
async function belegMerken(id, datei, name) {
  try {
    const db = await idb();
    await new Promise(ok => { const t = db.transaction('h','readwrite');
      t.objectStore('h').put({ blob: datei, name }, 'beleg:' + id); t.oncomplete = ok; });
    return true;
  } catch (err) { return false; }
}
async function belegAusSpeicher(id) {
  try {
    const db = await idb();
    return await new Promise(ok => { const t = db.transaction('h','readonly');
      const q = t.objectStore('h').get('beleg:' + id); q.onsuccess = () => ok(q.result); });
  } catch (err) { return null; }
}
async function belegVergessen(id) {
  try { const db = await idb();
    await new Promise(ok => { const t = db.transaction('h','readwrite');
      t.objectStore('h').delete('beleg:' + id); t.oncomplete = ok; });
  } catch (err) {}
}
async function belegSchreiben(datei, name, jahr) {
  const ord = await belegOrdner(jahr || heuteISO().slice(0,4), false);
  if (!ord) return false;
  try {
    const fh = await ord.getFileHandle(name, { create:true });
    const w = await fh.createWritable();
    await w.write(await datei.arrayBuffer()); await w.close();
    return true;
  } catch (err) { return false; }
}
/* Nachreichen: alles, was im Zwischenspeicher liegt, in den Ordner schreiben. */
async function belegeNachreichen() {
  let n = 0;
  for (const r of D.rechnungen.filter(x => x.belegOffen)) {
    const g = await belegAusSpeicher(r.id);
    if (!g) continue;
    if (await belegSchreiben(g.blob, g.name, belegJahr(r))) {
      r.belegDatei = g.name; r.belegOffen = false;
      await belegVergessen(r.id); n++;
    }
  }
  if (n) persist();
  return n;
}
/* Wo ein Beleg liegen kann — in dieser Reihenfolge gesucht. Der flache
   Wurzelordner steht mit drin, weil dort die Belege von vor dem Umbau
   liegen; sie werden nicht von selbst einsortiert. */
async function belegHandle(r) {
  const jahr = belegJahr(r);
  const orte = [
    () => belegOrdner(jahr, true,  { nichtAnlegen:true }),
    () => belegOrdner(jahr, false, { nichtAnlegen:true }),
    () => unterordner(ORD_BELEGE,  { nichtAnlegen:true })
  ];
  for (const hol of orte) {
    const ord = await hol();
    if (!ord) continue;
    try { return { ordner: ord, datei: await ord.getFileHandle(r.belegDatei) }; }
    catch (err) { /* hier nicht — naechster Ort */ }
  }
  return null;
}
async function belegOeffnen(id) {
  const r = D.rechnungen.find(x => x.id === id);
  if (!r) return;
  if (r.belegDatei) {
    const gefunden = await belegHandle(r);
    if (gefunden) {
      try {
        const f = await gefunden.datei.getFile();
        window.open(URL.createObjectURL(f), '_blank');
        return;
      } catch (err) { /* unten weiterversuchen */ }
    }
  }
  const g = await belegAusSpeicher(id);
  if (g) { window.open(URL.createObjectURL(g.blob), '_blank'); return; }
  alert('Der Beleg ist gerade nicht erreichbar. Gib den GÄPP-Ordner in der Verwaltung frei.');
}
/* A1: Beim Buchen der Zahlung wandert der Beleg nach «Bezahlt».
   Verschieben kann Chrome mit move(). Wo das fehlt, wird kopiert — und
   erst geloescht, wenn das Schreiben nachweislich geklappt hat. */
async function belegNachBezahlt(r) {
  if (!r || !r.belegDatei) return false;
  const gefunden = await belegHandle(r);
  if (!gefunden) return false;
  const ziel = await belegOrdner(belegJahr(r), true);
  if (!ziel) return false;
  if (gefunden.ordner === ziel) return true;          /* liegt schon richtig */
  try {
    if (typeof gefunden.datei.move === 'function') {
      await gefunden.datei.move(ziel);
      return true;
    }
    const f = await gefunden.datei.getFile();
    const neu = await ziel.getFileHandle(r.belegDatei, { create:true });
    const w = await neu.createWritable();
    await w.write(await f.arrayBuffer()); await w.close();
    const probe = await (await ziel.getFileHandle(r.belegDatei)).getFile();
    if (probe.size !== f.size) return false;          /* nicht loeschen, wenn unklar */
    await gefunden.ordner.removeEntry(r.belegDatei);
    return true;
  } catch (err) { return false; }
}

/* ---- F-03: Tagessicherung ------------------------------------------- */
/* Beim ersten Oeffnen am Tag eine Sicherung — eine Sicherung, an die man
   denken muss, ist im Ernstfall drei Monate alt. */
async function tagessicherung(opt) {
  if (!D || _ro) return false;
  const heute = heuteISO();
  if (localStorage.getItem('gaepp.sicherung') === heute) {
    _sichOffen = false; _sichFehler = null; return true;
  }
  const ord = await unterordner(ORD_SICHERUNG, opt);
  if (!ord) {
    /* Ohne Geste ist das kein Fehler, sondern ein «spaeter». Mit Geste
       schon: dann fehlt die Freigabe wirklich. */
    _sichOffen = true;
    _sichFehler = (opt && opt.ohneGeste) ? null
                : 'GÄPP konnte die Tagessicherung nicht ablegen — der GÄPP-Ordner ist nicht freigegeben.';
    return false;
  }
  try {
    const fh = await ord.getFileHandle('GAEPP-Daten-' + heute + '.json', { create:true });
    const w = await fh.createWritable();
    await w.write(JSON.stringify(D, null, 1)); await w.close();
    localStorage.setItem('gaepp.sicherung', heute);
    _sichOffen = false; _sichFehler = null;
    return true;
  } catch (err) {
    _sichOffen = true;
    _sichFehler = 'GÄPP konnte die Tagessicherung nicht schreiben: ' + (err.message || err);
    return false;
  }
}
/* Nachholen, sobald eine Nutzergeste vorliegt (F-03). Wird aus dem
   Klick-Handler gerufen und laeuft hoechstens einmal je Sitzung an. */
function sicherungNachholen() {
  if (!_sichOffen || !_ordner) return;
  _sichOffen = false;
  tagessicherung().then(ok => { if (!ok && _sichFehler) sicherungMelden(); });
}
function sicherungMelden() {
  const el = document.getElementById('vwSicherung');
  if (el) el.textContent = sicherungText();
}
/* Was der Mensch ueber den Stand der Sicherung wissen muss. */
function sicherungText() {
  const letzte = localStorage.getItem('gaepp.sicherung');
  if (_sichFehler) return _sichFehler;
  if (letzte === heuteISO()) return 'Tagessicherung: heute abgelegt.';
  if (!letzte) return 'Tagessicherung: bisher keine abgelegt. Gib dafür den GÄPP-Ordner frei.';
  const tage = Math.round((new Date(heuteISO()) - new Date(letzte)) / 86400000);
  return 'Tagessicherung: zuletzt am ' + letzte + (tage > 1 ? ' — das ist ' + tage + ' Tage her.' : '.');
}
/* Der Ausgang fuer den Menschen (A-89) */
function jsonAb() {
  const b = new Blob([JSON.stringify(D, null, 1)], { type:'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(b); a.download = 'GAEPP-Daten-' + heuteISO() + '.json';
  a.click();
}
function jsonAuf() {
  const i = document.createElement('input');
  i.type = 'file'; i.accept = '.json,application/json';
  i.onchange = async () => {
    const f = i.files[0]; if (!f) return;
    try {
      const g = JSON.parse(await f.text());
      if (!g.meta || !g.konten) throw new Error('Das ist keine GÄPP-Datei.');
      uebernehmen(g); _sig = undefined; persist(); blattZu();
    } catch (err) { alert('Konnte nicht gelesen werden: ' + err.message); }
  };
  i.click();
}

/* ===================================================================
   F-07: Einen Gläubiger anlegen, ändern, ausblenden.
   Bis zum 17.08.2026 gab es das nicht — die Verwaltung konnte
   Kategorien, Rechnungssteller und Sparziele anlegen, Verbindlichkeiten
   nicht. In einer App, deren Zweck die Entschuldung ist. Genau dieses
   fehlende Bauteil hat dazu gefuehrt, dass eine neue Steuerschuld als
   unsichtbarer Zuschlag auf eine bestehende Zeile geschrieben wurde,
   statt als eigene Zeile zu entstehen.
   =================================================================== */
/* Eine Zeile der Dokumentliste. Sie wird beim Hinzufuegen ins DOM geschoben
   statt das Blatt neu zu zeichnen — sonst waere jeder halb getippte Betrag
   in den Feldern darueber weg. Gelesen wird erst beim Speichern, aus dem
   DOM: ein zweiter Merker daneben waere ein zweiter Stand, der abweichen kann. */
function dokZeileHtml(d) {
  return `<div class="dok">
    <input type="text" class="dokName" value="${htmlAttr(d && d.name)}" placeholder="Bezeichnung">
    <input type="text" class="dokUrl"  value="${htmlAttr(d && d.url)}"  placeholder="https://…">
    <button class="knopf klein gefahr" type="button" data-dokweg="1">Entfernen</button></div>`;
}
function blattGlaeubiger(arg) {
  /* arg ist entweder «neu:<gruppe>» oder die id einer Verbindlichkeit. */
  const neu = String(arg || '').startsWith('neu:');
  const v = neu ? null : verbind(arg);
  const gruppe = neu ? String(arg).slice(4) : (v ? v.gruppe : 'privat');
  const e = v || { bezeichnung:'', gruppe, anfangsstand:'', anfangsdatum: heuteISO(),
                   zinssatz:'', gebuehr:'', kontoId:'schuld', hinweis:'', vereinbarungBis:'',
                   dokumente:[] };
  return {
    titel: v ? 'Gläubiger ändern' : 'Gläubiger anlegen',
    kennung: v ? 'Verbindlichkeit · ' + (GRUPPEN.find(g=>g.id===v.gruppe)||{}).name : null,
    koerper: `<div class="maske">
      ${v ? `<input type="hidden" id="gId" value="${v.id}">` : ''}
      <div class="feld voll"><label>Bezeichnung</label>
        <input type="text" id="gName" value="${(e.bezeichnung||'').replace(/"/g,'&quot;')}"
               placeholder="z.B. Steuern 2026"></div>
      <div class="feld"><label>Gruppe</label>
        <select id="gGruppe">${GRUPPEN.map(g =>
          `<option value="${g.id}" ${e.gruppe===g.id?'selected':''}>${g.name}</option>`).join('')}</select></div>
      <div class="feld"><label>Zahlungskonto</label>
        <select id="gKonto">${kontoOptionen(e.kontoId || 'schuld')}</select></div>
      <div class="feld"><label>Anfangssaldo</label>
        <input class="num" id="gStand" type="text" inputmode="decimal"
               value="${e.anfangsstand !== '' && e.anfangsstand != null ? fmt(e.anfangsstand) : ''}"></div>
      <div class="feld"><label>Stand per</label>
        <input type="date" id="gDatum" value="${e.anfangsdatum || heuteISO()}"></div>
      <!-- U-49: das andere Ende. «Stand per» sagt, ab wann es die Schuld gibt;
           dieses Feld sagt, ab wann es sie nicht mehr gibt. Die beiden gehoeren
           nebeneinander, weil sie dieselbe Frage von zwei Seiten beantworten. -->
      <div class="feld"><label>Ausgeblendet ab Jahr</label>
        <input class="num" id="gAusAb" type="text" inputmode="numeric"
               value="${e.ausAb != null && e.ausAb !== 0 ? e.ausAb : ''}"
               placeholder="leer = bleibt sichtbar"></div>
      <div class="feld"><label>Monatszins %</label>
        <input class="num" id="gZins" type="text" inputmode="decimal"
               value="${e.zinssatz != null && e.zinssatz !== '' ? e.zinssatz : ''}" placeholder="leer = zinsfrei"></div>
      <div class="feld"><label>Monatsgebühr</label>
        <input class="num" id="gGebuehr" type="text" inputmode="decimal"
               value="${e.gebuehr != null && e.gebuehr !== '' ? fmt(e.gebuehr) : ''}" placeholder="leer = keine"></div>
      <div class="feld"><label>Vereinbarung bis</label>
        <input type="date" id="gBis" value="${e.vereinbarungBis || ''}"></div>
      <div class="feld voll"><label>Hinweis — woher der Stand stammt</label>
        <input type="text" id="gHinweis" value="${(e.hinweis||'').replace(/"/g,'&quot;')}"
               placeholder="z.B. Schlussabrechnung vom 04.06.2026"></div>
      <div class="feld voll"><label>Dokumente — Zahlungsvereinbarung, Betreibung, Schreiben</label>
        <div class="doks" id="gDoks">${(e.dokumente || []).map(dokZeileHtml).join('')}</div>
        <div style="margin-top:6px"><button class="knopf klein" type="button" id="btnDokNeu">Dokument hinzufügen</button></div>
        <span class="meldung" style="margin-top:6px">Reine Verweise: GÄPP legt nichts ab und prüft
          nichts nach. Ein toter Link ist ehrlicher als eine Kopie, die auseinanderläuft.
          Die Adresse muss mit <b>http://</b> oder <b>https://</b> beginnen.</span></div>
      <div class="feld voll"><span class="meldung">Der Stand wird von hier an gerechnet:
        Anfangssaldo minus deine gebuchten Zahlungen plus Erhöhungen. Die Raten trägst du
        anschliessend in der Verbindlichkeitentabelle ein — Monat für Monat, wie beim Budget.</span></div>
      <div class="aktion"><button class="knopf primaer" id="btnGlaeubigerSpeichern">${v?'Ändern':'Anlegen'}</button>
        <span class="hint" id="gHint"></span></div>
    </div>`,
    /* U-30: Ausblenden und Loeschen stehen nebeneinander, und das ist Absicht.
       Sie beantworten zwei verschiedene Fragen — «ich will die Zeile nicht mehr
       sehen» und «diesen Glaeubiger hat es nie gegeben» —, und bis U-30 gab es
       auf die zweite gar keine Antwort: abhaengige('verbindlichkeit', …) konnte
       die Kaskade seit U-22, aber KEIN Knopf im ganzen Quelltext bot sie an.
       Wer einen falsch angelegten Glaeubiger loswerden wollte, blendete ihn aus
       und trug ihn danach in jeder Summe als Null mit. */
    fuss: (v ? `<button class="knopf klein" data-gaus="${v.id}">Ausblenden</button>
                <button class="knopf klein gefahr" data-vwloesch="verbindlichkeit:${v.id}">Löschen</button>` : '') +
          `<button class="knopf" data-zu>Schliessen</button>`
  };
}

/* ===================================================================
   U-30 — Ein Konto anlegen und ändern
   -------------------------------------------------------------------
   GAEPP konnte bis zum 18.08.2026 KEIN Konto anlegen. `data-vwneu` gab
   es fuer Kategorie, Rechnungssteller und Sparziel — die drei kleinsten
   Stammdaten. Das Konto, an dem alles haengt (Kategorie, Buchung,
   Rechnung, Verbindlichkeit, Sparziel), war nur ueber die JSON zu
   erreichen. Damit war GAEPP mit einer leeren Datei nicht einrichtbar:
   die App setzt acht Konten voraus, die sie selbst nicht herstellen kann.

   BLATT UND NICHT PROMPT — die Entscheidung und ihr Grund:
   vwNeu() fragt mit prompt(), und fuer «Bezeichnung» reicht das. Ein Konto
   hat acht Felder. Eine Kette aus acht prompt()-Fenstern hat kein Zurueck
   (Abbrechen im sechsten wirft die ersten fuenf weg), keine Vorschau, keine
   Vorgabe, die man sieht, und vor allem keinen Platz fuer den Satz, der
   `frei` erklaert. Genau dieses Feld entscheidet ueber «verfügbar» und
   «pro Tag» — die beiden Zahlen, wegen denen Albrecht die App taeglich
   oeffnet. Ein Haken ohne Erklaerung waere hier der teuerste Klick der
   ganzen App. Also dieselbe Bauart wie blattGlaeubiger (F-07): ein Blatt
   mit einer Maske, dieselben Felder fuer Anlegen und Aendern, dieselben
   Knoepfe in der Fusszeile.

   `sektion` steht als Auswahl und nicht als Haken, weil sie zwei Orte
   benennt und keinen Zustand: 'konten' erscheint im Bereich Konten und
   zaehlt in dessen Summe, 'reserve' steht unten in der eigenen Sektion.
   =================================================================== */
function naechsteKontoNr() {
  /* Die Nummer ist nicht die Kennung — sie ist das, was auf der Kachel und in
     jeder Auswahlliste vorn steht. Vorgeschlagen wird die naechste freie, damit
     niemand die Liste durchzaehlen muss; ueberschreiben laesst sie sich. */
  const n = D.konten.map(k => parseInt(k.nr, 10)).filter(x => !isNaN(x));
  return String((n.length ? Math.max(...n) : 0) + 1).padStart(2, '0');
}
function blattKontoMaske(arg) {
  const neu = String(arg || '') === 'neu';
  const k = neu ? null : konto(arg);
  const e = k || { nr: naechsteKontoNr(), name:'', rang: Math.max(0, ...D.konten.map(x => x.rang || 0)) + 1,
                   sektion:'konten', frei:true, rolle:'', anfangsstand:'', iban:'' };
  return {
    titel: k ? 'Konto ändern' : 'Konto anlegen',
    kennung: k ? 'Konto ' + k.nr : null,
    koerper: `<div class="maske">
      ${k ? `<input type="hidden" id="kId" value="${htmlAttr(k.id)}">` : ''}
      <div class="feld"><label>Nummer</label>
        <input type="text" id="kNr" value="${htmlAttr(e.nr)}" placeholder="z.B. 09"></div>
      <div class="feld"><label>Reihenfolge</label>
        <input class="num" id="kRang" type="text" inputmode="numeric" value="${htmlAttr(e.rang)}"></div>
      <div class="feld voll"><label>Name</label>
        <input type="text" id="kName" value="${htmlAttr(e.name)}" placeholder="z.B. Haushaltkonto"></div>
      <div class="feld"><label>Bereich</label>
        <select id="kSektion">
          <option value="konten" ${e.sektion !== 'reserve' ? 'selected' : ''}>Konten</option>
          <option value="reserve" ${e.sektion === 'reserve' ? 'selected' : ''}>Reserve</option>
        </select></div>
      <div class="feld"><label>Anfangssaldo</label>
        <input class="num" id="kStand" type="text" inputmode="decimal"
               value="${e.anfangsstand !== '' && e.anfangsstand != null ? fmt(e.anfangsstand) : ''}"></div>
      <div class="feld voll"><label>Rolle — wozu das Konto da ist</label>
        <input type="text" id="kRolle" value="${htmlAttr(e.rolle)}"
               placeholder="z.B. laufende Ausgaben"></div>
      <div class="feld voll"><label>IBAN</label>
        <input type="text" id="kIban" value="${htmlAttr(e.iban)}" placeholder="CH.."></div>
      <div class="feld haken voll"><input type="checkbox" id="kFrei" ${e.frei ? 'checked' : ''}>
        <label for="kFrei">Das Geld auf diesem Konto ist frei verfügbar</label></div>
      <div class="feld voll"><span class="meldung"><b>Der Haken ist das wichtigste Feld dieser Maske.</b>
        Nur Konten mit Haken zählen in «verfügbar» und damit in «pro Tag» — die beiden Zahlen
        oben im Kopf. Ein Konto <b>ohne</b> Haken ist gebundenes Geld: Rückstellungen,
        Kreditoren, alles, was schon jemandem gehört. Es steht weiter in der Liste und in der
        Kontosumme, aber es erhöht nicht, was du heute ausgeben kannst.</span></div>
      <div class="feld voll"><span class="meldung"><b>Bereich</b> entscheidet, wo die Kachel steht:
        «Konten» oben im gleichnamigen Bereich und in dessen Summe, «Reserve» unten in der
        eigenen Sektion. <b>Reihenfolge</b> ist die Zahl, nach der sortiert wird —
        kleiner steht weiter vorn.</span></div>
      <div class="aktion"><button class="knopf primaer" id="btnKontoSpeichern">${k ? 'Ändern' : 'Anlegen'}</button>
        <span class="hint" id="kHint"></span></div>
    </div>`,
    fuss: (k ? `<button class="knopf klein" data-vwaus="konto:${k.id}">${k.aktiv === false ? 'Einblenden' : 'Ausblenden'}</button>
                <button class="knopf klein gefahr" data-vwloesch="konto:${k.id}">Löschen</button>` : '') +
          `<button class="knopf" data-zu>Schliessen</button>`
  };
}
function kontoSpeichern() {
  const hint = t => { const h = $('#kHint'); if (h) h.textContent = t; };
  /* A-88: Im Schreibschutz ist merkeStand() still. Eine Maske, die dann trotzdem
     schriebe, legte ein Konto ohne Netz an — und in eine Datei, die die App gar
     nicht versteht. Der Riegel steht hier und nicht nur im CSS: die Felder sind
     dort abgeschaltet, der Knopf war es nie. */
  if (_ro) return hint('GÄPP ist schreibgeschützt und legt nichts an.');
  const name = ($('#kName').value || '').trim();
  if (!name) return hint('Ohne Namen geht es nicht.');
  let nr = ($('#kNr').value || '').trim();
  if (!nr) return hint('Ohne Nummer geht es nicht — sie steht auf jeder Kachel und vorn in jeder Auswahlliste.');
  /* Zweistellig, aber nur wenn es eine Zahl ist: «03» soll nicht als «3» neben
     «04» stehen. Wer eine Nummer wie «K1» will, behaelt sie. */
  if (/^\d+$/.test(nr)) nr = nr.padStart(2, '0');
  const alt = $('#kId') ? konto($('#kId').value) : null;
  if (D.konten.some(x => x.nr === nr && x !== alt))
    return hint('Die Nummer ' + nr + ' trägt schon ein anderes Konto. Zwei gleiche Nummern '
              + 'liessen sich in den Auswahllisten nicht auseinanderhalten.');
  const rangRoh = ($('#kRang').value || '').trim();
  const rang = rangRoh === '' ? Math.max(0, ...D.konten.map(x => x.rang || 0)) + 1 : parseInt(rangRoh, 10);
  if (isNaN(rang)) return hint('Die Reihenfolge muss eine Zahl sein.');
  /* Erste Anweisung nach der letzten Pruefung, vor der ersten Zuweisung (U-20). */
  merkeStand(alt ? 'Konto «' + name + '» geändert' : 'Konto «' + name + '» angelegt');
  /* bankwerte und dokumente entstehen leer und werden hier nie angefasst: der
     Bankabgleich sitzt in der Fusszeile des Kontoblatts, die Unterlagen im
     vierten Reiter. Eine Maske, die sie mitschriebe, waere die zweite Stelle
     fuer dieselbe Zahl. */
  const o = alt || { id: neueId('ko'), bankwerte: [], dokumente: [], aktiv: true };
  o.nr = nr;
  o.name = name;
  o.rang = rang;
  o.sektion = $('#kSektion').value === 'reserve' ? 'reserve' : 'konten';
  o.frei = !!$('#kFrei').checked;
  o.rolle = ($('#kRolle').value || '').trim();
  o.iban = ($('#kIban').value || '').trim();
  o.anfangsstand = rd(zahl($('#kStand').value));
  if (!alt) D.konten.push(o);
  persist(); blattZu(); zeichne();
}

/* ===================================================================
   GAEPP — Berichte, Export und Handbuch.

   Fuenf Berichte, jeder mit einem Satz, was er zeigt. Zeitraum und
   Kategorien werden vor dem Erzeugen gesetzt, nicht danach.

   Drei Festlegungen tragen diesen Teil:

   - **Ein Bericht sieht aus wie das Werkzeug, aus dem er kommt.**
     Dieselbe Farbwelt, dieselben Schriften, dieselbe Kachelanatomie.
     Erst der Druck macht Papier daraus — dann kippt die ganze Farbwelt
     auf weiss, und zwar ueber die Tokens, nicht ueber Sonderregeln.

   - **Zeilen lassen sich anklicken und ausblenden, und alles zieht mit.**
     Summen, Anteilsbalken und die Kennzahlen im Kopf. Ein eingefrorener
     Stand, bei dem das Total nach dem Ausblenden stehen bleibt,
     behauptet etwas Falsches.

   - **Gerechnet wird an einer Stelle.** Die Zahlenzellen tragen ihren
     Rohwert als data-w; Summen, Balken und Kennzahlen entstehen erst
     beim Zeichnen aus diesen Werten. Deshalb rechnet die gesicherte
     HTML-Datei mit demselben Code wie die Vorschau — er wird woertlich
     mitgegeben, nicht ein zweites Mal geschrieben.
   =================================================================== */

/* Was der naechste Bericht zeigen soll. Lebt nur in der Ansicht. */
let _ber = null;
/* U-21: Welche Kategorien in einem Berichtszeitraum ueberhaupt vorkommen.
   Laeuft der Bericht ueber eine Jahresgrenze, gilt die VEREINIGUNG der
   Jahre: sichtbar in EINEM davon reicht. Ein Bericht darf nichts weglassen,
   was im Zeitraum liegt — er beschreibt Vergangenes, und was vergangen ist,
   aendert sich durch eine spaetere Entscheidung nicht mehr. */
function berKategorien(von, bis) {
  const a = jahrVon(von), b = Math.max(a, jahrVon(bis));
  return D.kategorien.filter(k => {
    for (let j = a; j <= b; j++) if (katSicht(k, j)) return true;
    return false;
  });
}
/* Wird der Zeitraum verschoben, kommen Kategorien hinzu, die es dort noch
   (oder schon) gab. Die muessen von selbst angehakt sein, sonst fiele ihre
   Buchung stillschweigend aus dem Bericht. Was vorher schon zur Wahl stand
   und abgewaehlt war, bleibt abgewaehlt — das war eine Entscheidung. */
function berZeitraumSetzen(von, bis) {
  const vorher = berKategorien(_ber.von, _ber.bis).map(k => k.id);
  _ber.von = von; _ber.bis = bis;
  berKategorien(von, bis).forEach(k => {
    if (!vorher.includes(k.id) && !_ber.kategorien.includes(k.id)) _ber.kategorien.push(k.id);
  });
}
function berStandard() {
  const von = iso(S.jahr, S.monat, 1);
  const bis = iso(S.jahr, S.monat, tageImMonat(S.jahr, S.monat));
  return { art:'monat', kontoId:'hhk', verbId:null, von, bis,
           kategorien: berKategorien(von, bis).map(k => k.id),
           verlauf: true };
}
const BERICHTE = [
  { id:'monat',   name:'Monatsauszug — alle Konten',
    was:'Kopfzahlen, Verlauf, Aufstellung nach Kategorien mit Anteilsbalken, alle Konten mit Anfang und Ende, dazu die grössten Einzelposten.' },
  { id:'jahr',    name:'Jahresauszug — alle Konten',
    was:'Zwölf Monatsspalten je Konto, Kategorien über das ganze Jahr und Budget gegen Ist Monat für Monat. Querformat.' },
  { id:'konto',   name:'Kontobericht',
    was:'Ein Konto über den gewählten Zeitraum: Verlauf, Monat für Monat, jede Buchung mit laufendem Saldo, Bankwert und Differenz. Auch für eine Schuld.' },
  { id:'schuld',  name:'Verbindlichkeiten über alle Jahre',
    was:'Entwicklung je Gläubiger mit Stand, Rate, Zins und dem Monat, in dem sie getilgt ist — oder dem Vermerk, dass der Plan nicht reicht.' },
  { id:'export',  name:'Ganzes Tool, eingefroren',
    was:'Eine HTML-Datei zum Weiterreichen. Öffnet ohne Netz; Reiter, Klappköpfe und Filter arbeiten, ändern lässt sich nichts.' }
];

function blattBericht(arg) {
  if (String(arg || '').startsWith('zeige:')) return berichtVorschau(arg.slice(6));
  if (!_ber) _ber = berStandard();
  /* Aus einem Konto- oder Schuldblatt heraus ist die Sache schon klar. */
  const v = String(arg || '');
  if (v.startsWith('konto:'))  { _ber.art = 'konto';  _ber.kontoId = v.slice(6); _ber.verbId = null; }
  if (v.startsWith('schuld:')) { _ber.art = 'konto';  _ber.verbId  = v.slice(7); }
  return berichtWahl();
}

function berichtWahl() {
  const istKonto = _ber.art === 'konto';
  return { weit:true, titel:'Bericht und Export', koerper: `
    <div class="wahlliste">${BERICHTE.map(b => `
      <label><input type="radio" name="ber" value="${b.id}" ${_ber.art===b.id?'checked':''}>
        <span><span class="bez">${b.name}</span><span class="erl">${b.was}</span></span></label>`).join('')}
    </div>
    <div class="maske" style="margin-top:14px">
      ${istKonto ? `<div class="feld voll"><label>Welches Konto oder welche Schuld</label>
        <select id="berKonto">
          <optgroup label="Konten">${D.konten.filter(k=>k.aktiv!==false).sort((a,b)=>a.rang-b.rang)
            .map(k => `<option value="k:${k.id}" ${!_ber.verbId&&_ber.kontoId===k.id?'selected':''}>${k.nr} ${k.name}</option>`).join('')}</optgroup>
          <optgroup label="Verbindlichkeiten">${D.verbindlichkeiten.filter(v=>v.aktiv!==false)
            .map(v => `<option value="v:${v.id}" ${_ber.verbId===v.id?'selected':''}>${v.bezeichnung}</option>`).join('')}</optgroup>
        </select></div>` : ''}
      <div class="feld"><label>Von</label><input type="date" id="berVon" value="${_ber.von}"></div>
      <div class="feld"><label>Bis</label><input type="date" id="berBis" value="${_ber.bis}"></div>
      <div class="feld voll"><span class="filterzeile">
        <span class="lab">Zeitraum</span>
        <button class="knopf klein" data-zeit="monat">Dieser Monat</button>
        <button class="knopf klein" data-zeit="jahr">Dieses Jahr</button>
        <button class="knopf klein" data-zeit="alles">Ganzer Zeitraum</button>
      </span></div>
      <div class="feld haken voll"><input type="checkbox" id="berVerlauf" ${_ber.verlauf?'checked':''}>
        <label for="berVerlauf">Verlaufsgrafik mitgeben</label></div>
      <div class="feld voll"><span class="filterzeile"><span class="lab">Kategorien</span>
        ${berKategorien(_ber.von, _ber.bis).sort((a,b)=>a.rang-b.rang).map(k =>
          `<button class="filter" data-berkat="${k.id}" aria-pressed="${_ber.kategorien.includes(k.id)}">${k.name}</button>`).join('')}
      </span></div>
    </div>`,
    fuss:`<button class="knopf" data-zu>Abbrechen</button>
          <button class="knopf primaer" id="btnBerichtErzeugen">Erzeugen</button>` };
}

function berichtVorschau(art) {
  return { weit:true, titel:'Bericht',
    koerper:`<div id="berichtVorschau">${berichtHtml(art)}</div>`,
    fuss:`<button class="knopf" id="btnBerichtZurueck">Zurück zur Auswahl</button>
          <span class="meldung" data-ausgeblendet style="margin-right:auto;margin-left:10px"></span>
          <button class="knopf" id="btnBerichtHtml">Als HTML sichern</button>
          <button class="knopf primaer" id="btnDrucken">Drucken oder als PDF</button>`,
    /* Summen, Balken und Kennzahlen entstehen erst hier — mit demselben Code,
       der spaeter in der gesicherten Datei laeuft. */
    danach: () => berichtRechnen($('#berichtVorschau')) };
}

/* ===================================================================
   Zeilen ausblenden — und alles zieht nach.
   Diese Funktion wird woertlich in die gesicherte HTML-Datei kopiert
   (ueber Function.toString). Sie darf deshalb nichts aus der App
   benutzen ausser fmt, das genauso mitgegeben wird.
   =================================================================== */
function berichtRechnen(wz) {
  if (!wz) return;
  const zahl = td => td ? (parseFloat(td.getAttribute('data-w')) || 0) : 0;
  /* Eine Zelle beschriften. data-sig sagt, wie das Vorzeichen zu lesen ist. */
  const zeig = (el, v) => {
    const a = el.getAttribute('data-sig') || '';
    const leer = Math.abs(v) < 0.005;
    let t;
    if (a === 'plus')       t = leer ? '–' : '+' + fmt(v);
    else if (a === 'minus') t = leer ? '–' : '−' + fmt(Math.abs(v));
    else if (a === 'saldo') t = (v < -0.005 ? '−' : '+') + fmt(Math.abs(v));
    else                    t = fmt(v);
    el.textContent = t;
    el.classList.remove('ok', 'err');
    if (a === 'saldo') { if (v > 0.005) el.classList.add('ok'); if (v < -0.005) el.classList.add('err'); }
    else if (a === 'minus' && !leer) el.classList.add('err');
    else if (a === 'plus'  && !leer) el.classList.add('ok');
    else if (a === 'wert'  && v < -0.005) el.classList.add('err');
  };
  /* «1|-2» heisst: Spalte 1 minus Spalte 2, ueber alle sichtbaren Zeilen. */
  const summe = (zeilen, formel) => formel.split('|').reduce((s, teil) => {
    const neg = teil.charAt(0) === '-';
    const c = parseInt(neg ? teil.slice(1) : teil, 10);
    return s + (neg ? -1 : 1) * zeilen.reduce((x, tr) => x + zahl(tr.cells[c]), 0);
  }, 0);
  const rund = x => Math.round(x * 100) / 100;

  Array.prototype.forEach.call(wz.querySelectorAll('table.btab'), tab => {
    const alle  = Array.prototype.slice.call(tab.querySelectorAll('tbody tr.bz'));
    const sicht = alle.filter(tr => !tr.classList.contains('aus'));

    /* Fusszeile der Tabelle */
    Array.prototype.forEach.call(tab.querySelectorAll('tfoot td[data-sum]'), td =>
      zeig(td, rund(summe(sicht, td.getAttribute('data-sum')))));

    /* Zwischensummen je Gruppe */
    Array.prototype.forEach.call(tab.querySelectorAll('tbody tr[data-gsum]'), tr => {
      const g = tr.getAttribute('data-gsum');
      const teil = sicht.filter(x => x.getAttribute('data-g') === g);
      Array.prototype.forEach.call(tr.querySelectorAll('td[data-sum]'), td =>
        zeig(td, rund(summe(teil, td.getAttribute('data-sum')))));
    });

    /* Anteilsbalken — der Nenner ist die Summe der sichtbaren Zeilen. */
    const ac = tab.getAttribute('data-anteil');
    if (ac !== null && ac !== undefined) {
      const ganz = sicht.reduce((x, tr) => x + Math.abs(zahl(tr.cells[+ac])), 0);
      alle.forEach(tr => {
        const bar = tr.querySelector('.bbar'), pct = tr.querySelector('.bpct');
        if (!bar) return;
        const p = (!tr.classList.contains('aus') && ganz)
          ? Math.abs(zahl(tr.cells[+ac])) / ganz * 100 : 0;
        bar.style.width = p.toFixed(1) + '%';
        /* Eine leere Spur bedeutet nichts und lenkt ab — sie verschwindet ganz. */
        if (bar.parentNode) bar.parentNode.style.visibility = p ? '' : 'hidden';
        if (pct) pct.textContent = p >= 0.5 ? Math.round(p) + ' %' : '';
      });
    }

    /* Kennzahlen im Kopf haengen an genau einer Tabelle. */
    if (tab.getAttribute('data-kz')) {
      Array.prototype.forEach.call(wz.querySelectorAll('.bkennz b[data-sum]'), b =>
        zeig(b, rund(summe(sicht, b.getAttribute('data-sum')))));
    }
  });

  const n = wz.querySelectorAll('table.btab tbody tr.bz.aus').length;
  const txt = n ? n + (n === 1 ? ' Zeile ausgeblendet' : ' Zeilen ausgeblendet') : '';
  const wurzel = wz.ownerDocument || document;
  Array.prototype.forEach.call(wurzel.querySelectorAll('[data-ausgeblendet]'), el => {
    el.textContent = txt;
  });
}

/* ---- Bausteine, die alle Berichte teilen ---------------------------- */
function dmy(d) { return d.slice(8,10) + '.' + d.slice(5,7) + '.' + d.slice(0,4); }

/* Kopf: Etikett, Titel, Untertitel, rechts das Ausgabedatum. */
function berichtKopf(etikett, titel, unter, zahlen) {
  return `<div class="bericht"><div class="bkopf">
      <div><div class="cap">${etikett}</div><h1 class="ser">${titel}</h1>
        <div class="bsub">${unter}</div></div>
      <div class="bstand"><div class="cap s">Stand</div>
        <div class="num">${dmy(heuteISO())}</div></div>
    </div>` +
    (zahlen ? `<div class="bkennz">${zahlen.map(z =>
      `<div><div class="cap s">${z[0]}</div><b class="${z[2]||''}"${
        z[3] ? ` data-sum="${z[3]}" data-sig="${z[4]||'saldo'}"` : ''}>${z[1]}</b></div>`).join('')}</div>` : '');
}
function berichtFuss(zusatz) {
  return `<div class="bfuss">GÄPP · Passend | Präzise | Praktisch · erzeugt am ${dmy(heuteISO())}` +
    (zusatz ? ' · ' + zusatz : '') +
    /* Was ausgeblendet wurde, steht auch auf dem Papier — dort fehlen die
       Zeilen ganz, und eine Summe ohne diesen Hinweis waere eine Behauptung. */
    `<span data-ausgeblendet></span></div></div>`;
}
/* Eine Zahlenzelle. Der Rohwert steht als data-w daneben — das Ausblenden
   ist so nicht auf Textzerlegung angewiesen. */
function zz(v, art, klasse) {
  const w = rd(v || 0);
  const leer = Math.abs(w) < 0.005;
  let t, kl = klasse ? ' ' + klasse : '';
  if (art === 'plus')       { t = leer ? '<span class="nix">–</span>' : '+' + fmt(w); if (!leer) kl += ' ok'; }
  else if (art === 'minus') { t = leer ? '<span class="nix">–</span>' : '−' + fmt(Math.abs(w)); if (!leer) kl += ' err'; }
  else if (art === 'saldo') { t = (w < -0.005 ? '−' : '+') + fmt(Math.abs(w));
                              kl += w < -0.005 ? ' err' : (w > 0.005 ? ' ok' : ''); }
  /* Ein Bestand von null ist eine Aussage — er wird ausgeschrieben, nicht
     durch einen Strich ersetzt. Der Strich steht nur, wo nichts geflossen ist. */
  else                      { t = fmt(w); if (w < -0.005) kl += ' err'; art = art || 'wert'; }
  return `<td class="bzahl${kl}" data-w="${w}" data-sig="${art}">${t}</td>`;
}
/* Eine leere Fusszelle — ihren Wert setzt berichtRechnen. */
function fz(formel, art) {
  return `<td class="bzahl" data-sum="${formel}" data-sig="${art || 'wert'}"></td>`;
}
/* Der Balken sitzt in einer Spur fester Breite — sonst schiebt ein Anteil von
   neunzig Prozent den Prozentwert in die naechste Zeile. */
const balken = '<td class="banteil"><span class="bspur"><span class="bbar"></span></span>' +
               '<span class="bpct"></span></td>';

/* Der Verlauf als SVG — er ueberlebt Drucken, HTML-Sichern und Weiterreichen.
   Farben kommen aus den Tokens, damit der Druck sie mitkippt. */
function verlaufSvg(punkte, beschriftung, hoehe) {
  if (!punkte.length) return '';
  const h = hoehe || 150, b = 720, lr = 46, or_ = 12, ur = 22;
  const min = Math.min(0, ...punkte), max = Math.max(1, ...punkte);
  const x = i => lr + (punkte.length === 1 ? (b-lr-8)/2 : i * (b - lr - 8) / (punkte.length - 1));
  const y = v => or_ + (h - or_ - ur) * (1 - (v - min) / ((max - min) || 1));
  const d = punkte.map((v,i) => (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(v).toFixed(1)).join(' ');
  const flaeche = d + ' L' + x(punkte.length-1).toFixed(1) + ' ' + y(min).toFixed(1) +
                  ' L' + x(0).toFixed(1) + ' ' + y(min).toFixed(1) + ' Z';
  return `<svg class="ber-verlauf" viewBox="0 0 ${b} ${h}" preserveAspectRatio="none">
    <path d="${flaeche}" fill="var(--accent)" fill-opacity=".12"/>
    <line x1="${lr}" y1="${y(0).toFixed(1)}" x2="${b-8}" y2="${y(0).toFixed(1)}"
      stroke="var(--rule)" stroke-width=".8"/>
    <path d="${d}" fill="none" stroke="var(--accent)" stroke-width="1.8"/>
    ${punkte.map((v,i)=>`<circle cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="2" fill="var(--accent)"/>`).join('')}
    <text x="2" y="${(y(max)+4).toFixed(1)}" font-size="9" fill="var(--muted)">${fmt(max,0)}</text>
    <text x="2" y="${(y(min)+4).toFixed(1)}" font-size="9" fill="var(--muted)">${fmt(min,0)}</text>
    ${beschriftung.map((t,i)=> {
      if (beschriftung.length > 14 && i % 2) return '';
      /* Die erste und die letzte Beschriftung haengen am Rand — mittig gesetzt
         wuerde die letzte aus dem Bild laufen und abgeschnitten. */
      const anker = i === 0 ? 'start' : (i === beschriftung.length - 1 ? 'end' : 'middle');
      const px = i === 0 ? x(0) - 10 : (i === beschriftung.length - 1 ? b - 2 : x(i));
      return `<text x="${px.toFixed(1)}" y="${h-7}" font-size="9" fill="var(--muted)" text-anchor="${anker}">${t}</text>`;
    }).join('')}
  </svg>`;
}
/* Alle Buchungen im gewaehlten Zeitraum, nach den gewaehlten Kategorien gefiltert */
function berBuchungen(filter) {
  return D.buchungen.filter(b => {
    if (b.datum < _ber.von || b.datum > _ber.bis) return false;
    if (b.zeileId) {
      const z = zeile(b.zeileId);
      if (z && !_ber.kategorien.includes(z.kategorieId)) return false;
    }
    return !filter || filter(b);
  }).sort((a,b) => a.datum < b.datum ? -1 : 1);
}
function monateImZeitraum() {
  const a = ymOf(_ber.von), e = ymOf(_ber.bis), out = [];
  let j = a.j, m = a.m;
  while (j < e.j || (j === e.j && m <= e.m)) { out.push({ j, m }); m++; if (m === 12) { m = 0; j++; } }
  return out.slice(0, 120);
}
/* Was in einem Monat wirklich gebucht wurde — Gegenstueck zum Budgetwert. */
function istSaldoMonat(j, m) {
  return rd(D.buchungen.reduce((s, b) => {
    const d = ymOf(b.datum);
    if (d.j !== j || d.m !== m) return s;
    if (b.art === 'einnahme')  return s + b.betrag;
    if (b.art === 'ausgabe')   return s - b.betrag;
    if (b.art === 'korrektur') return s + (b.richtung === 'minus' ? -b.betrag : b.betrag);
    return s;
  }, 0));
}

function berichtHtml(art) {
  if (art === 'monat')  return berichtMonat();
  if (art === 'jahr')   return berichtJahr();
  if (art === 'konto')  return _ber.verbId ? berichtSchuld(_ber.verbId) : berichtKonto(_ber.kontoId);
  if (art === 'schuld') return berichtSchuldenplan();
  return '<p>Unbekannter Bericht.</p>';
}

/* ---- Monatsauszug: Kopfzahlen, Kategorien, Konten, Einzelposten ------ */
function berichtMonat() {
  const b = berBuchungen();
  const eb = ymOf(_ber.bis);

  /* Nach Kategorien — diese Tabelle traegt die Kennzahlen im Kopf. */
  const nachKat = {};
  b.forEach(x => {
    const z = x.zeileId ? zeile(x.zeileId) : null;
    const k = z ? kategorie(z.kategorieId) : null;
    const schl = k ? k.id : (x.art === 'umbuchung' ? '_um' : '_ohne');
    const name = k ? k.name : (x.art === 'umbuchung' ? 'Umbuchungen' : 'Ohne Position');
    const e = nachKat[schl] || (nachKat[schl] = { name, n:0, ein:0, aus:0 });
    e.n++;
    if (x.art === 'einnahme') e.ein += x.betrag;
    else if (x.art === 'ausgabe') e.aus += x.betrag;
    else if (x.art === 'korrektur') { if (x.richtung === 'minus') e.aus += x.betrag; else e.ein += x.betrag; }
  });
  const katZeilen = Object.values(nachKat).sort((a,b2) => (b2.aus - b2.ein) - (a.aus - a.ein)).map(e =>
    `<tr class="bz" data-bgrp="${e.name}"><td class="bn">${e.name}
      <div class="bsub">${e.n} ${e.n===1?'Buchung':'Buchungen'}</div></td>
      ${zz(e.ein,'plus')}${zz(e.aus,'minus')}${zz(rd(e.ein-e.aus),'saldo')}${balken}</tr>`).join('');

  /* Konten mit Anfang, Bewegung, Ende */
  const a = ymOf(_ber.von);
  const kontoZeilen = D.konten.filter(k => k.aktiv !== false).sort((x,y)=>x.rang-y.rang).map(k => {
    const anf = kontosaldo(k.id, a.m === 0 ? a.j-1 : a.j, a.m === 0 ? 11 : a.m-1);
    const end = kontosaldo(k.id, eb.j, eb.m);
    return `<tr class="bz" data-bgrp="${k.name}"><td class="bn">${k.nr} ${k.name}
      <div class="bsub">${k.frei ? 'frei verfügbar' : 'zweckgebunden'}</div></td>
      ${zz(anf)}${zz(rd(end-anf),'saldo')}${zz(end)}</tr>`;
  }).join('');
  const gesamt = rd(D.konten.reduce((s,k) => s + kontosaldo(k.id, eb.j, eb.m), 0));

  /* Die groessten Einzelposten — dort sieht man, wohin der Monat lief. */
  const gross = b.filter(x => x.art === 'ausgabe' || (x.art === 'korrektur' && x.richtung === 'minus'))
    .sort((x,y) => y.betrag - x.betrag).slice(0, 12);
  const grossZeilen = gross.map(x => {
    const z = x.zeileId ? zeile(x.zeileId) : null;
    const k = konto(x.kontoId);
    return `<tr class="bz" data-bgrp="${x.id}"><td class="bn">${z ? z.bezeichnung : artName(x.art)}
      <div class="bsub">${dmy(x.datum)}${x.text ? ' · ' + x.text : ''}</div></td>
      <td>${k ? k.nr + ' ' + k.name : '–'}</td>${zz(x.betrag,'minus')}${balken}</tr>`;
  }).join('');

  const mon = monateImZeitraum();
  const verlauf = _ber.verlauf && mon.length > 1
    ? verlaufSvg(mon.map(x => rd(D.konten.reduce((s,k)=>s+kontosaldo(k.id,x.j,x.m),0))),
                 mon.map(x => MON[x.m]), 150)
    : '';

  return berichtKopf('GÄPP · Auszug nach Kategorien',
      dmy(_ber.von) + ' bis ' + dmy(_ber.bis),
      'Alle Konten · ' + b.length + (b.length===1?' Buchung':' Buchungen') + ' im Zeitraum',
      [['Einnahmen', '', 'ok', '1', 'plus'],
       ['Ausgaben',  '', 'err', '2', 'minus'],
       ['Saldo',     '', '',   '1|-2', 'saldo'],
       ['Vermögen',  fmt(gesamt)],
       ['Schuldenstand', '−' + fmt(schuldenSumme(eb.j, eb.m)), 'err']]) +
    verlauf +
    `<h2 class="bh">Nach Kategorien</h2>
     <table class="btab" data-kz="1" data-anteil="2">
       <thead><tr><th class="bn">Kategorie</th><th class="bzahl">Einnahmen</th>
         <th class="bzahl">Ausgaben</th><th class="bzahl">Saldo</th>
         <th class="banteil">Anteil Ausgaben</th></tr></thead>
       <tbody>${katZeilen || '<tr><td class="bn" colspan="5">Im Zeitraum ist nichts gebucht.</td></tr>'}</tbody>
       <tfoot><tr><td class="bn">Total</td>${fz('1','plus')}${fz('2','minus')}${fz('1|-2','saldo')}
         <td class="banteil"></td></tr></tfoot></table>

     <h2 class="bh">Konten</h2>
     <table class="btab">
       <thead><tr><th class="bn">Konto</th><th class="bzahl">Anfang</th>
         <th class="bzahl">Bewegung</th><th class="bzahl">Ende</th></tr></thead>
       <tbody>${kontoZeilen}</tbody>
       <tfoot><tr><td class="bn">Summe</td>${fz('1')}${fz('2','saldo')}${fz('3')}</tr></tfoot></table>

     ${gross.length ? `<h2 class="bh">Grösste Einzelposten</h2>
     <table class="btab" data-anteil="2">
       <thead><tr><th class="bn">Position</th><th>Konto</th><th class="bzahl">Betrag</th>
         <th class="banteil">Anteil</th></tr></thead>
       <tbody>${grossZeilen}</tbody>
       <tfoot><tr><td class="bn">Summe dieser Posten</td><td></td>${fz('2','minus')}
         <td class="banteil"></td></tr></tfoot></table>` : ''}` +
    berichtFuss('Budgetsaldo des Monats ' + fmt(saldoBudgetiert(eb.j, eb.m)));
}

/* ---- Jahresauszug --------------------------------------------------- */
function berichtJahr() {
  const j = ymOf(_ber.von).j;
  const rows = D.konten.filter(k => k.aktiv !== false).sort((a,b)=>a.rang-b.rang).map(k =>
    `<tr class="bz" data-bgrp="${k.name}"><td class="bn">${k.nr} ${k.name}</td>${
      MON.map((_,m)=>zz(kontosaldo(k.id,j,m))).join('')}${zz(kontosaldo(k.id,j,11))}</tr>`).join('');
  const verm = MON.map((_,m) => rd(D.konten.reduce((s,k)=>s+kontosaldo(k.id,j,m),0)));
  const verlauf = _ber.verlauf ? verlaufSvg(verm, MON, 160) : '';

  /* Kategorien ueber das ganze Jahr */
  const von = _ber.von, bis = _ber.bis;
  _ber.von = iso(j,0,1); _ber.bis = iso(j,11,31);
  const jb = berBuchungen();
  _ber.von = von; _ber.bis = bis;
  const nachKat = {};
  jb.forEach(x => {
    const z = x.zeileId ? zeile(x.zeileId) : null;
    const k = z ? kategorie(z.kategorieId) : null;
    const schl = k ? k.id : (x.art === 'umbuchung' ? '_um' : '_ohne');
    const name = k ? k.name : (x.art === 'umbuchung' ? 'Umbuchungen' : 'Ohne Position');
    const e = nachKat[schl] || (nachKat[schl] = { name, n:0, ein:0, aus:0 });
    e.n++;
    if (x.art === 'einnahme') e.ein += x.betrag;
    else if (x.art === 'ausgabe') e.aus += x.betrag;
    else if (x.art === 'korrektur') { if (x.richtung === 'minus') e.aus += x.betrag; else e.ein += x.betrag; }
  });
  const katZeilen = Object.values(nachKat).sort((a,b2) => (b2.aus - b2.ein) - (a.aus - a.ein)).map(e =>
    `<tr class="bz" data-bgrp="${e.name}"><td class="bn">${e.name}
      <div class="bsub">${e.n} ${e.n===1?'Buchung':'Buchungen'}</div></td>
      ${zz(e.ein,'plus')}${zz(e.aus,'minus')}${zz(rd(e.ein-e.aus),'saldo')}${balken}</tr>`).join('');

  /* Budget gegen Ist — die Zeile, die zeigt, ob der Plan haelt */
  const bvi = MON.map((_,m) => {
    const plan = saldoBudgetiert(j,m), ist = istSaldoMonat(j,m);
    return `<tr class="bz" data-bgrp="${MON_LANG[m]}"><td class="bn">${MON_LANG[m]} ${j}</td>
      ${zz(plan,'saldo')}${zz(ist,'saldo')}${zz(rd(ist-plan),'saldo')}</tr>`;
  }).join('');

  return berichtKopf('GÄPP · Jahresauszug', 'Jahr ' + j, 'Kontostände am Monatsende',
      [['Vermögen Ende', fmt(verm[11])],
       ['Budgetsaldo', fmt(rd(MON.reduce((s,_,m)=>s+saldoBudgetiert(j,m),0)))],
       ['Schulden Ende', '−' + fmt(schuldenPrognose(j,11)), 'err']]) +
    verlauf +
    `<h2 class="bh">Konten Monat für Monat</h2>
     <table class="btab">
       <thead><tr><th class="bn">Konto</th>${MON.map(m=>`<th class="bzahl">${m}</th>`).join('')}
         <th class="bzahl">Ende</th></tr></thead>
       <tbody>${rows}</tbody>
       <tfoot><tr><td class="bn">Vermögen</td>${MON.map((_,m)=>fz(String(m+1))).join('')}${fz('13')}</tr></tfoot></table>

     <h2 class="bh">Nach Kategorien im ganzen Jahr</h2>
     <table class="btab" data-anteil="2">
       <thead><tr><th class="bn">Kategorie</th><th class="bzahl">Einnahmen</th>
         <th class="bzahl">Ausgaben</th><th class="bzahl">Saldo</th>
         <th class="banteil">Anteil Ausgaben</th></tr></thead>
       <tbody>${katZeilen || '<tr><td class="bn" colspan="5">Im Jahr ist nichts gebucht.</td></tr>'}</tbody>
       <tfoot><tr><td class="bn">Total</td>${fz('1','plus')}${fz('2','minus')}${fz('1|-2','saldo')}
         <td class="banteil"></td></tr></tfoot></table>

     <h2 class="bh">Budget gegen Ist</h2>
     <table class="btab">
       <thead><tr><th class="bn">Monat</th><th class="bzahl">Budgetiert</th>
         <th class="bzahl">Gebucht</th><th class="bzahl">Abweichung</th></tr></thead>
       <tbody>${bvi}</tbody>
       <tfoot><tr><td class="bn">Jahr ${j}</td>${fz('1','saldo')}${fz('2','saldo')}${fz('3','saldo')}</tr></tfoot></table>` +
    berichtFuss('Gebucht heisst: wirklich erfasste Einnahmen und Ausgaben, ohne Umbuchungen');
}

/* ---- Kontobericht: Verlauf, Monat fuer Monat, jede Buchung ---------- */
function berichtKonto(kId) {
  const k = konto(kId);
  const a = ymOf(_ber.von);
  const alle = berBuchungen(b => b.kontoId === kId || b.gegenkontoId === kId);
  let s = kontosaldo(kId, a.m === 0 ? a.j-1 : a.j, a.m === 0 ? 11 : a.m-1);
  const anfang = s;
  const punkte = [anfang];
  const zeilen = alle.map(b => {
    const w = wirkung(b, kId); s = rd(s + w); punkte.push(s);
    const z = b.zeileId ? zeile(b.zeileId) : null;
    return `<tr><td class="bn">${z ? z.bezeichnung : artName(b.art)}
      <div class="bsub">${dmy(b.datum)}${b.text ? ' · ' + b.text : ''}${
        b.art === 'umbuchung' ? ' · ' + (b.kontoId===kId ? 'an ' + konto(b.gegenkontoId).name
                                                         : 'von ' + konto(b.kontoId).name) : ''}</div></td>
      ${zz(w,'saldo')}${zz(s)}</tr>`;
  }).join('');

  /* Monat fuer Monat — der Teil, der im alten Bericht fehlte. */
  const mon = monateImZeitraum();
  let lauf = anfang;
  const monZeilen = mon.map(x => {
    let ein = 0, aus = 0;
    alle.forEach(b => { const d = ymOf(b.datum);
      if (d.j !== x.j || d.m !== x.m) return;
      const w = wirkung(b, kId); if (w > 0) ein += w; else aus += -w; });
    lauf = rd(lauf + ein - aus);
    return `<tr class="bz" data-bgrp="${MON[x.m]} ${x.j}"><td class="bn">${MON_LANG[x.m]} ${x.j}</td>
      ${zz(ein,'plus')}${zz(aus,'minus')}${zz(rd(ein-aus),'saldo')}${zz(lauf)}${balken}</tr>`;
  }).join('');

  const bw = letzterBankwert(k);
  const eb = ymOf(_ber.bis);
  const diff = bw ? rd(bw.wert - kontosaldo(kId, eb.j, eb.m)) : null;
  const verlauf = _ber.verlauf && punkte.length > 1
    ? verlaufSvg(punkte, alle.map(b => b.datum.slice(8,10) + '.' + b.datum.slice(5,7)), 150) : '';

  return berichtKopf('GÄPP · Kontoauszug', k.nr + ' ' + k.name,
      dmy(_ber.von) + ' bis ' + dmy(_ber.bis) + ' · ' + alle.length +
        (alle.length===1?' Buchung':' Buchungen') + ' · ' + (k.frei ? 'frei verfügbar' : 'zweckgebunden'),
      [['Anfang', fmt(anfang)], ['Ende', fmt(s), s < 0 ? 'err' : ''],
       ['Bankauszug', bw ? fmt(bw.wert) : '–'],
       ['Differenz', bw ? fmt(diff) : '–', diff ? 'err' : '']]) +
    verlauf +
    `<h2 class="bh">Monat für Monat</h2>
     <table class="btab" data-anteil="2">
       <thead><tr><th class="bn">Monat</th><th class="bzahl">Ein</th><th class="bzahl">Aus</th>
         <th class="bzahl">Bewegung</th><th class="bzahl">Endstand</th>
         <th class="banteil">Anteil Ausgaben</th></tr></thead>
       <tbody>${monZeilen}</tbody>
       <tfoot><tr><td class="bn">Zeitraum</td>${fz('1','plus')}${fz('2','minus')}${fz('1|-2','saldo')}
         <td class="bzahl">${fmt(s)}</td><td class="banteil"></td></tr></tfoot></table>

     <h2 class="bh">Jede Buchung</h2>
     <table class="btab">
       <thead><tr><th class="bn">Position</th><th class="bzahl">Betrag</th>
         <th class="bzahl">Saldo</th></tr></thead><tbody>
       <tr><td class="bn">Anfangsstand<div class="bsub">${dmy(_ber.von)}</div></td>
         <td class="bzahl"><span class="nix">–</span></td>${zz(anfang)}</tr>
       ${zeilen}
       </tbody>
       <tfoot><tr><td class="bn">Endstand ${dmy(_ber.bis)}</td><td class="bzahl"></td>
         <td class="bzahl">${fmt(s)}</td></tr></tfoot></table>` +
    (bw ? `<p class="ber-notiz">Bankauszug vom ${dmy(bw.datum)}: ${fmt(bw.wert)} · Quelle: ${bw.quelle || 'von Hand'}${
       diff ? ' · Differenz zum gebuchten Stand ' + fmt(diff) : ' · stimmt mit dem gebuchten Stand überein'}</p>` : '') +
    berichtFuss();
}

/* ---- Bericht ueber eine Verbindlichkeit ----------------------------- */
function berichtSchuld(vId) {
  const v = verbind(vId);
  const bew = [];
  D.buchungen.filter(b => b.verbId === vId && b.datum >= _ber.von && b.datum <= _ber.bis)
    .forEach(b => bew.push([b.datum, 'Zahlung' + (b.text ? ' · ' + b.text : ''), -b.betrag]));
  (v.erhoehungen||[]).filter(e => e.datum >= _ber.von && e.datum <= _ber.bis)
    .forEach(e => bew.push([e.datum, e.text || (e.art==='minderung'?'Minderung':'Erhöhung'),
      e.art==='minderung' ? -e.betrag : e.betrag]));
  bew.sort((a,b) => a[0] < b[0] ? -1 : 1);
  const a = ymOf(_ber.von), eb = ymOf(_ber.bis);
  let lauf = verbindStand(v, a.m === 0 ? a.j-1 : a.j, a.m === 0 ? 11 : a.m-1);
  const anfang = lauf;
  const zeilen = bew.map(r => { lauf = rd(lauf + r[2]);
    return `<tr><td class="bn">${r[1]}<div class="bsub">${dmy(r[0])}</div></td>
      ${zz(r[2],'saldo')}${zz(lauf)}</tr>`; }).join('');

  const mon = monateImZeitraum();
  const verlauf = _ber.verlauf && mon.length > 1
    ? verlaufSvg(mon.map(x => verbindPrognose(v, x.j, x.m)), mon.map(x => MON[x.m]), 150) : '';

  /* Jahr fuer Jahr — Stand, gezahlt, und was der Zins gefressen hat. */
  const jahre = Object.keys(D.budget).map(Number).sort();
  const jahrZeilen = jahre.map(j => {
    const anf = j === jahre[0] ? verbindStand(v, j-1, 11) : verbindPrognose(v, j-1, 11);
    const end = verbindPrognose(v, j, 11);
    let gez = 0;
    for (let m = 0; m < 12; m++) {
      const g = rd(D.buchungen.reduce((x,b) => { const d = ymOf(b.datum);
        return (b.verbId === v.id && d.j === j && d.m === m) ? x + b.betrag : x; }, 0));
      const h = ymOf(heuteISO());
      gez += g || (((j > h.j) || (j === h.j && m >= h.m)) ? rate(v, j, m) : 0);
    }
    const erh = rd((v.erhoehungen||[]).reduce((s,e) => ymOf(e.datum).j === j
      ? s + (e.art === 'minderung' ? -e.betrag : e.betrag) : s, 0));
    /* Was ueber Zahlungen und Erhoehungen hinaus dazukam, ist Zins und Gebuehr. */
    const kosten = rd(end - anf + gez - erh);
    return `<tr class="bz" data-bgrp="${j}"><td class="bn">${j}</td>
      ${zz(anf)}${zz(gez,'minus')}${zz(erh,'saldo')}${zz(kosten,'saldo')}${zz(end)}</tr>`;
  }).join('');

  const ende = tilgungsende(v);
  return berichtKopf('GÄPP · Verbindlichkeit', v.bezeichnung,
      GRUPPEN.find(g=>g.id===v.gruppe).name + ' · ' + dmy(_ber.von) + ' bis ' + dmy(_ber.bis) +
      ' · Herkunft: ' + v.herkunft,
      [['Stand heute', fmt(verbindStandHeute(v)), 'err'],
       ['Rate', fmt(rate(v, S.jahr, S.monat))],
       ['Zins im Monat', v.zinssatz ? v.zinssatz + ' %' : '–'],
       ['Gebühr', v.gebuehr ? fmt(v.gebuehr) : '–'],
       ['Getilgt', ende || 'nach Plan nicht', ende ? 'ok' : 'err']]) +
    verlauf +
    `<h2 class="bh">Bewegungen im Zeitraum</h2>
     <table class="btab">
       <thead><tr><th class="bn">Vorgang</th><th class="bzahl">Betrag</th>
         <th class="bzahl">Stand</th></tr></thead><tbody>
       <tr><td class="bn">Stand zu Beginn<div class="bsub">${dmy(_ber.von)}</div></td>
         <td class="bzahl"><span class="nix">–</span></td>${zz(anfang)}</tr>
       ${zeilen || '<tr><td class="bn" colspan="3">Im Zeitraum ist nichts gebucht.</td></tr>'}
       </tbody>
       <tfoot><tr><td class="bn">Stand am Ende ${dmy(_ber.bis)}</td><td class="bzahl"></td>
         <td class="bzahl">${fmt(lauf)}</td></tr></tfoot></table>

     <h2 class="bh">Jahr für Jahr</h2>
     <table class="btab">
       <thead><tr><th class="bn">Jahr</th><th class="bzahl">Anfang</th><th class="bzahl">Gezahlt</th>
         <th class="bzahl">Erhöhung</th><th class="bzahl">Zins und Gebühr</th>
         <th class="bzahl">Ende</th></tr></thead>
       <tbody>${jahrZeilen}</tbody>
       <tfoot><tr><td class="bn">Über alle Jahre</td><td class="bzahl"></td>${fz('2','minus')}
         ${fz('3','saldo')}${fz('4','saldo')}<td class="bzahl"></td></tr></tfoot></table>

     ${v.zahlung && v.zahlung.iban ? `<p class="ber-notiz">Zahlung an ${v.zahlung.iban}${
        v.zahlung.referenz ? ' · Referenz ' + v.zahlung.referenz : ''}</p>` : ''}
     ${v.vereinbarungBis ? `<p class="ber-notiz">Vereinbarung befristet bis ${dmy(v.vereinbarungBis)}.</p>` : ''}
     ${v.hinweis ? `<p class="ber-notiz">${v.hinweis}</p>` : ''}` +
    berichtFuss('Künftige Jahre sind gerechnet, nicht gebucht — mit Plan-Rate, Zins und Gebühr');
}

/* ---- Alle Verbindlichkeiten ueber alle Jahre ------------------------ */
/* U-49: Eine Zelle fuer ein Jahr, in dem es diesen Glaeubiger nicht gibt.
   Sie traegt bewusst KEIN data-w: berichtRechnen() liest den Rohwert von
   dort, und eine Null waere eine Aussage ueber einen Stand — hier gibt es
   aber keinen Stand, sondern die Schuld selbst nicht mehr. Der Strich ist
   dieselbe Schreibweise, die zz() fuer «nichts geflossen» benutzt. */
function zzWeg() { return '<td class="bzahl"><span class="nix">–</span></td>'; }
function berichtSchuldenplan() {
  const jahre = Object.keys(D.budget).map(Number).sort();
  const nJ = jahre.length;
  const rows = GRUPPEN.map(g => {
    /* U-49: Ein Glaeubiger steht im Bericht, sobald er in IRGENDEINEM
       gezeigten Jahr gilt — dieselbe Regel wie in der Ansicht «Alle Jahre».
       Wer ihn hier weglaesst, weil er heute ausgeblendet ist, nimmt ihm
       auch die Jahre, in denen er abbezahlt wurde; und genau die soll
       dieser Bericht zeigen. */
    const liste = D.verbindlichkeiten.filter(v =>
      v.gruppe === g.id && jahre.some(j => verbSicht(v, j)));
    if (!liste.length) return '';
    const kopf = `<tr class="grp" data-gsum="${g.id}"><td class="bn">${g.name}</td>
      ${jahre.map((_,i) => `<td class="bzahl" data-sum="${i+1}" data-sig="wert"></td>`).join('')}
      <td class="bn"></td></tr>`;
    return kopf + liste.map(v => `<tr class="bz" data-g="${g.id}" data-bgrp="${v.bezeichnung}">
      <td class="bn">${v.bezeichnung}${v.ausAb ? `<div class="bsub">ausgeblendet ab ${v.ausAb}</div>` : ''}</td>
      ${jahre.map(j => verbSicht(v, j) ? zz(verbindPrognose(v, j, 11)) : zzWeg()).join('')}
      <td class="bn">${v.ausAb
        ? 'ausgeblendet ab ' + v.ausAb
        : (tilgungsende(v) || '<span class="err">nach Plan nicht</span>')}</td></tr>`).join('');
  }).join('');
  const summen = jahre.map(j => schuldenPrognose(j, 11));
  const verlauf = _ber.verlauf ? verlaufSvg(summen, jahre.map(String), 160) : '';

  /* Anteil am heutigen Schuldenberg — mit Rate, Zins und Balken. */
  /* U-49: «heute» heisst das laufende Jahr — wer ab ihm ausgeblendet ist,
     gehoert nicht in eine Aufstellung des heutigen Schuldenbergs. */
  const heute = verbHeute()
    .map(v => ({ v, st: verbindStandHeute(v) }))
    .sort((a,b) => b.st - a.st);
  const anteilZeilen = heute.map(x => `<tr class="bz" data-bgrp="${x.v.bezeichnung}">
    <td class="bn">${x.v.bezeichnung}
      <div class="bsub">${GRUPPEN.find(g=>g.id===x.v.gruppe).name}</div></td>
    ${zz(x.st)}${zz(rate(x.v, S.jahr, S.monat),'minus')}
    <td class="bzahl">${[x.v.zinssatz ? x.v.zinssatz + ' %' : '',
        x.v.gebuehr ? fmt(x.v.gebuehr) : ''].filter(Boolean).join(' + ') ||
        '<span class="nix">–</span>'}</td>
    <td class="bn">${tilgungsende(x.v) || '<span class="err">nach Plan nicht</span>'}</td>${balken}</tr>`).join('');

  return berichtKopf('GÄPP · Verbindlichkeiten', 'Über alle Jahre',
      'Stand am Stichtag ' + dmy(D.meta.stichtag) + ' und prognostizierte Entwicklung',
      [['Am Stichtag', fmt(schuldenStichtag()), 'err'],
       ['Heute', fmt(rd(verbHeute().reduce((s,v)=>s+verbindStandHeute(v),0))), 'err'],   /* U-49 */
       ['Ende ' + jahre[nJ-1], fmt(summen[nJ-1]), summen[nJ-1] > 0.005 ? 'err' : 'ok']]) +
    verlauf +
    `<h2 class="bh">Stand am 31. Dezember, Jahr für Jahr</h2>
     <table class="btab">
       <thead><tr><th class="bn">Gläubiger</th>${jahre.map(j=>`<th class="bzahl">${j}</th>`).join('')}
         <th class="bn">Getilgt</th></tr></thead>
       <tbody>${rows}</tbody>
       <tfoot><tr><td class="bn">Summe</td>${jahre.map((_,i)=>fz(String(i+1))).join('')}
         <td class="bn"></td></tr></tfoot></table>

     <h2 class="bh">Anteil am heutigen Schuldenberg</h2>
     <table class="btab" data-anteil="1">
       <thead><tr><th class="bn">Gläubiger</th><th class="bzahl">Stand heute</th>
         <th class="bzahl">Rate</th><th class="bzahl">Zins und Gebühr</th><th class="bn">Getilgt</th>
         <th class="banteil">Anteil</th></tr></thead>
       <tbody>${anteilZeilen}</tbody>
       <tfoot><tr><td class="bn">Summe</td>${fz('1')}${fz('2','minus')}<td class="bzahl"></td>
         <td class="bn"></td><td class="banteil"></td></tr></tfoot></table>` +
    berichtFuss('Jahreswerte sind Stände am 31.12., gerechnet mit Zins und Gebühr · '
      + 'ein Strich heisst: in diesem Jahr gibt es diesen Gläubiger nicht');
}

function tilgungsende(v) {
  const a = ymOf(v.anfangsdatum);
  let j = a.j, m = a.m, s = v.anfangsstand;
  if (a.t >= tageImMonat(a.j, a.m)) { m++; if (m===12) { m=0; j++; } }
  const h = ymOf(heuteISO());
  for (let i = 0; i < 160 && s > 0.005; i++) {
    /* U-47: derselbe Eingriff wie in verbindLauf. Ohne ihn saehe die Frage
       «wann ist sie getilgt» eine andere Schuld als die Tabelle daneben. */
    { const x = m === 0 ? vortrag(v, j) : null; if (x !== null) s = x; }
    (v.erhoehungen||[]).forEach(e => { const d = ymOf(e.datum);
      if (d.j===j && d.m===m) s += (e.art==='minderung'?-e.betrag:e.betrag); });
    const gebucht = rd(D.buchungen.reduce((x,b) => { const d = ymOf(b.datum);
      return (b.verbId === v.id && d.j === j && d.m === m) ? x + b.betrag : x; }, 0));
    /* U-29: derselbe Schnitt wie in verbindLauf — der Tilgungsplan rechnet
       jeden Monat mit der Rate, gebuchte Zahlungen haben Vorrang. */
    s = rd(s * (1 + (v.zinssatz||0)/100) + (v.gebuehr||0) - (gebucht || rate(v, j, m)));
    if (s <= 0.005) return MON_LANG[m] + ' ' + j;
    m++; if (m===12) { m=0; j++; }
  }
  return null;
}

/* ---- Einen Bericht als eigenstaendige HTML-Datei sichern -------------
   Die Datei kann, was die Vorschau kann: Zeilen anklicken, ausblenden,
   Summen und Balken ziehen mit. Der Rechencode wird woertlich aus der App
   uebernommen — so gibt es keine zweite Fassung, die auseinanderlaufen
   koennte. Eingaben sind nicht bloss gesperrt, es gibt keine. */
function berichtAlsHtml() {
  const inhalt = $('#berichtVorschau').innerHTML;
  const stil = Array.from(document.styleSheets).map(bl => {
    try { return Array.from(bl.cssRules).map(r => r.cssText).join('\n'); } catch (e) { return ''; }
  }).join('\n');
  const tag = 'scr' + 'ipt';
  const titel = ($('#berichtVorschau h1') || { textContent:'Bericht' }).textContent;
  const skript = '<' + tag + '>\n' +
    fmt.toString() + '\n' + berichtRechnen.toString() + '\n' +
    'document.addEventListener("click", function (ev) {\n' +
    '  var tr = ev.target.closest ? ev.target.closest("tr.bz") : null;\n' +
    '  if (!tr) return;\n' +
    '  tr.classList.toggle("aus");\n' +
    '  berichtRechnen(tr.closest(".bericht"));\n' +
    '});\n' +
    'berichtRechnen(document.querySelector(".bericht"));\n' +
    '</' + tag + '>';
  const html = `<!DOCTYPE html><html lang="de-CH"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GÄPP — ${titel}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
${stil}
/* --- Die Hoehe ueberschreiben: hier ist kein Fenster, sondern ein Blatt. --- */
html,body{height:auto}
body{display:block;overflow:visible;background:var(--bg)}

/* ===================================================================
   U-32 — FARBWELT UND BUDGETTAFEL, ZWEITE FASSUNG
   -------------------------------------------------------------------
   Steht am Ende, damit sie ohne Eingriff in die Regeln darueber gilt.
   Anthrazit-Blau statt Nacht-Braun, Minze statt Orange; die Farben der
   Betraege bleiben, wie sie sind: Minze fuer Plus, Rose fuer Minus.
   =================================================================== */
:root{
  --bg:#0c0f13; --card:#12161c; --sheet:#151b23; --soft:#1b2531;
  --line:#1d232b; --rule:#2a3542; --ink:#f2f5f8; --muted:#8b95a2;
  --accent:#8ee6c8; --onaccent:#0c0f13;
  --ok:#8ee6c8; --err:#f0a08d; --open:#e3c98d;
  --hairline:#151b23;
}
body{font-family:'Space Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif}
.marke{letter-spacing:.02em}
.knopf.primaer:hover{filter:brightness(1.08)}
tr:hover td.bearbeitbar input::placeholder,
td.bearbeitbar input:focus::placeholder{color:#3d4753}

/* ---- Budgettafel: eine fixierte Spalte statt drei ------------------ */
.t-budget{--w1:268px}
.t-budget tbody td:nth-child(2),.t-budget tbody td:nth-child(3){position:static;left:auto;border-right:none}
.t-budget thead th:nth-child(2),.t-budget thead th:nth-child(3),

.t-budget th.n:nth-child(n+2),.t-budget td.n:nth-child(n+2),

.t-budget .n{font-size:12.5px;padding:0 9px}

td.bearbeitbar input:focus{outline:none;color:#fff;font-weight:500}

/* ---- Zahlungsweg: nur beim Ueberfahren der Zeile ------------------- */
.t-budget .namenszelle .weg{opacity:0;transition:opacity .12s}
.t-budget tr:hover .namenszelle .weg,
.t-budget tr:focus-within .namenszelle .weg{opacity:1}
.katkonto{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--muted);margin-left:8px}

/* ---- Fähnchen an der aktiven Zelle -------------------------------- */
.zellfahne{
  position:fixed;z-index:140;display:flex;align-items:center;gap:11px;white-space:nowrap;
  background:#1d2a2f;border:1px solid #2f4a4a;border-radius:7px;padding:6px 11px;

/* ---- Zeilenfarben: an die ZEILE, nicht an die Zellen ----------------
   Die alte Regel deckte die ersten DREI Zellen mit der Tafelfarbe, weil drei
   Spalten fixiert waren. In der Budgettafel ist nur noch eine fixiert — Jan
   und Feb bekamen die Deckfarbe der Namensspalte und die Kategoriezeile
   wurde zweifarbig. Also: die Zeile traegt die Farbe, die Zellen sind
   durchsichtig, und die fixierte erste Spalte erbt sie (sie muss deckend

.t-budget tbody tr{background:var(--card)}

table.gross.t-budget tbody td:nth-child(n+2){background:transparent}
table.gross.t-budget tbody td:nth-child(1){background:inherit}
table.gross.t-budget tbody td.jetzt:nth-child(n+2){background:rgba(142,230,200,.05)}
table.gross.t-budget tbody tr.zeile-kat td.jetzt:nth-child(n+2){background:rgba(142,230,200,.1)}
table.gross.t-budget tbody tr.zeile-daten:hover td.jetzt:nth-child(n+2){background:rgba(142,230,200,.11)}

/* ---- Kennzahlenband: die wichtigste Zahl ist nicht die kleinste ---- */
.kennzahlen .v{font-size:19px !important}
.kennzahlen .k{font-size:10.5px;letter-spacing:.12em}
