/* ---- Eingefrorener HTML-Export des ganzen Tools (A-65, A-66) --------
   Oeffnet ohne Netz auf einem fremden Rechner. Reiter, Klappkoepfe und
   Filter arbeiten, aendern laesst sich nichts. */
function exportHtml() {
  const doc = document.documentElement.cloneNode(true);
  doc.querySelectorAll('script').forEach(s => s.remove());
  doc.querySelectorAll('link[rel="stylesheet"],link[rel="preconnect"]').forEach(l => l.remove());
  doc.querySelector('#inhalt').innerHTML = '';
  doc.querySelector('#blattHg').hidden = true;
  doc.querySelectorAll('#zurueck').forEach(l => l.remove());   /* U-20: nichts zum Zurueckgehen im eingefrorenen Stand */
  /* U-25: Der eingefrorene Stand traegt kein S.vollbild — die Klasse aus
     dem geklonten DOM stuende also ohne den Zustand da, der sie erklaert,
     und die Seitenleiste fehlte bis zum ersten zeichne(). */
  doc.querySelector('#rahmen').classList.remove('vollbild');
  const tag = 'scr' + 'ipt';
  const daten = JSON.stringify(D).replace(/</g, '\\u003c');
  const skript =
    '<' + tag + '>window.GAEPP_FROZEN=' + daten + ';window.GAEPP_STAND=' +
    JSON.stringify(JSON.stringify({ jahr:S.jahr, monat:S.monat, zeitraum:S.zeitraum, modus:S.modus, reiter:S.reiter })) +
    ';</' + tag + '>' +
    '<' + tag + '>' + APP_QUELLTEXT + '</' + tag + '>';
  /* Ersetzung als Funktion, nicht als Zeichenkette: sonst deutet replace jedes
     $$ im eingefuegten Quelltext als Sonderzeichen und verkuerzt es zu $. */
  const html = '<!DOCTYPE html><html lang="de-CH">' +
    doc.innerHTML.replace('</body>', () => skript + '</body>') + '</html>';
  const b = new Blob([html], { type:'text/html' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(b); a.download = 'GAEPP-Stand-' + heuteISO() + '.html';
  a.click();
}

/* ===================================================================
   Benutzerhandbuch (A-90) — die acht Regeln, die man nicht erraet.
   Von Hand gepflegt, an einer Stelle.
   =================================================================== */
function blattHandbuch() {
  return { weit:true, titel:'Wie GÄPP tickt', koerper:`<div class="hb">
    <p>Dreizehn Regeln stecken in GÄPP, die man nicht errät — sie stammen aus Entscheidungen,
       nicht aus Gewohnheit. Der Rest bedient sich von selbst.</p>

    <div class="regel"><h3>1. Eine offene Rechnung mindert den Kontostand nicht</h3>
    <p>Der Kontostand bildet ab, was die Bank sagt. Solange du eine Rechnung nicht bezahlt hast,
       ist das Geld noch da — die Bank weiss nichts von ihr. Was sie sehr wohl mindert, ist
       <b>«Verfügbar heute»</b> — <b>aber nur, wenn sie auch von einem freien Konto bezahlt
       wird</b>. Läuft sie über Kreditoren, Rückstellungen oder Fixkosten, liegt das Geld dort
       schon bereit und war nie Teil deines freien Betrags.</p></div>

    <div class="regel"><h3>2. Mit Häkchen «Rückstellung» mindert sie gar nichts</h3>
    <p>Für manche Rechnungen legst du jeden Monat etwas zurück — Zahnarzt, Franchise,
       Radio- und Fernsehabgabe.
       Setzt du beim Erfassen das Häkchen <b>Rückstellung</b>, zählt die Rechnung weder gegen
       dein freies Geld noch in die Budgetzeile «Rechnungen». Sonst stünde sie zweimal da.
       <b>Du entscheidest das je Rechnung</b>, nicht die Position.</p></div>

    <div class="regel"><h3>3. Die Zahl im Dashboard und die in der Kopfzeile sind dieselbe</h3>
    <p>Beide rechnen nach derselben Regel: Bestand auf HHK minus die offenen, ungedeckten
       Rechnungen dieses Monats, die von dort bezahlt werden. Die Kopfzeile nennt sie
       <b>«Verfügbar heute»</b> und bricht sie zusätzlich auf die Tage bis zum nächsten Lohn
       herunter. <b>Nur der laufende Monat trägt einen Wert</b> — vergangene und künftige
       zeigen «–».</p>
    <p>Steht daneben <b>«Noch offen im Monat»</b> in Rot, ist die Zahl anklickbar. Dahinter
       liegt die Liste dessen, was budgetiert und noch nicht gebucht ist, mit einem Knopf je
       Posten. Nach dem Buchen bleibt der Saldo, wie er ist — die Zahl war schon drin, sie
       war nur noch nicht belegt.</p></div>

    <div class="regel"><h3>4. Lesen und Eintragen sind dieselbe Ansicht</h3>
    <p>Es gibt keinen Modus, zwischen dem du wechselst. Eine Karte zeigt und nimmt entgegen:
       klappst du eine Kategorie oder eine Gläubigergruppe auf, steht dort ihr Raster, und
       die Zellen darin sind die Felder, in die du tippst. Damit kannst du auch nicht
       versehentlich im falschen Modus stehen.</p>
    <p>Eine Ausnahme: <b>«Alle Jahre» nimmt nichts entgegen.</b> Dort ist jede Spalte ein
       Jahrgang, und ein Jahreswert ist die Summe von zwölf Monaten — er steht nirgends,
       also lässt er sich auch nicht ändern. Eingetragen wird im einzelnen Jahr.</p></div>

    <div class="regel"><h3>5. Kachel und Karte führen verschieden, beides ist kein Ansichtswechsel</h3>
    <p>Ein Klick auf eine <b>Kachel</b> legt ein Blatt darüber — Konten, Sparziele, Reserve
       arbeiten so. Die Ansicht bleibt darunter stehen, Escape bringt dich zurück, und du
       landest an derselben Stelle wie vorher. Eine <b>Karte</b> dagegen klappt auf, statt
       ein Blatt zu legen; Budget und Verbindlichkeiten arbeiten so. Es ist immer nur eine
       Karte offen: das Raster ist hoch, und zwei offene heben den Vergleich auf, für den
       die Karten da sind.</p>
    <p><b>Die Schulden stehen an einem Ort</b>, im Bereich Verbindlichkeiten. Der Bereich
       Konten führt Konten, Sparziele und Reserve — sonst stünden dieselben Gläubiger
       zweimal auf zwei verschiedene Arten da.</p></div>

    <div class="regel"><h3>6. Du tippst nie ein Minuszeichen</h3>
    <p>Die Richtung kommt aus der Kategorie: Was unter Fixkosten steht, ist eine Ausgabe.
       In der Maske steht der Betrag, in den Summen erscheint er mit dem richtigen Vorzeichen.
       Einzige Ausnahme ist <b>Lohnabzug | Darlehen</b> — die Zeile steht beim Einkommen,
       läuft aber dagegen.</p></div>

    <div class="regel"><h3>7. Strg-Klick markiert, Doppelklick überträgt</h3>
    <p>Im aufgeklappten Raster einer Kategorie setzt ein einfacher Klick den Schreibcursor.
       <b>Strg-Klick</b> markiert eine Zelle und hebt die Markierung wieder auf.
       <b>Doppelklick</b> überträgt den Wert auf die folgenden Monate, auf Wunsch auch
       auf die Folgejahre.</p></div>

    <div class="regel"><h3>8. Der Punkt neben dem Zahnrad sagt, ob gesichert ist</h3>
    <p>Ocker heisst: es gibt eine Änderung, die noch nicht oben ist. GÄPP sichert von selbst,
       zweieinhalb Sekunden nachdem du aufgehört hast — zehn Handgriffe hintereinander
       ergeben <b>einen</b> Sicherungsvorgang, nicht zehn. Grün mit Uhrzeit heisst: alles oben.
       Rot heisst: es ging etwas schief, der Text daneben sagt was.</p></div>

    <div class="regel"><h3>9. Löschen ist etwas anderes als Ausblenden</h3>
    <p><b>Ausblenden</b> nimmt eine Kategorie, eine Position oder <b>einen Gläubiger</b>
       <b>ab einem Jahr</b> aus der Ansicht; die Jahre davor zeigen sie weiter mit ihren
       Zahlen, und du holst sie zurück — Kategorien und Positionen in der Verwaltung, einen
       Gläubiger in seiner Maske, Feld «Ausgeblendet ab Jahr». <b>Löschen nimmt sie
       wirklich weg</b>, mit allem, was daran hängt — GÄPP zeigt vorher eine Aufstellung, was
       mitgeht. Nur eine Handvoll Kennungen ist gesperrt, weil GÄPP mit ihnen rechnet;
       dort sagt der Dialog, warum es nicht geht. Buchungen, Rechnungen und Erhöhungen werden
       ohnehin immer wirklich gelöscht. Das Netz darunter ist dreifach: die Leiste unten nimmt
       jeden Schritt zwölf Sekunden lang zurück, jede Sicherung ist ein Punkt in der
       Git-Historie deines Datenrepos, und beim ersten Öffnen am Tag legt GÄPP eine Kopie
       in <b>${ORD_SICHERUNG}</b>.</p></div>

    <div class="regel"><h3>10. Ziehen ordnet um, tippen nicht</h3>
    <p>Fährst du im aufgeklappten Raster über eine Position oder einen Gläubiger — oder in
       der Verwaltung über ein Konto —, erscheint links ein <b>Griff</b>. Zieh daran, und der Eintrag steht woanders —
       <b>Alt+Pfeil hoch/runter</b> tut dasselbe ohne Maus. Umgeordnet wird immer nur
       innerhalb des eigenen Blocks: eine Zeile bleibt in ihrer Kategorie, ein Gläubiger in
       seiner Gruppe, ein Konto in seinem Bereich. Das ist Absicht — die Kategorie einer Zeile
       ist eine Zuordnung und keine Position, und die änderst du in ihrer Maske. Die
       Reihenfolge der Konten gilt überall: Kacheln, Auswahllisten, Berichte.</p></div>

    <div class="regel"><h3>11. Ein neues Jahr entsteht nach Regeln, nicht als Kopie</h3>
    <p><b>«Jahr anlegen»</b> fragt für jede Kategorie einzeln, ob ihr Budget mitkommt — und für
       jeden Gläubiger getrennt zweierlei: ob sein <b>Endsaldo als Anfangssaldo</b> ins neue Jahr
       geht, und ob sein <b>Ratenplan</b> fortgeschrieben wird. Voreingestellt ist der häufige
       Fall: Budget mitnehmen, Saldo vortragen, Raten nicht — die Raten des neuen Jahres sind
       eine neue Entscheidung und keine Wiederholung. Was du nicht übernimmst, steht danach auf
       null; die Zeile bleibt stehen.</p>
    <p>Die dritte Spalte heisst <b>«Ab hier weg»</b> und ist für erledigte Gläubiger da.
       Sie blendet einen Gläubiger <b>ab dem neuen Jahr</b> aus — er verschwindet aus allen
       Jahren ab da, nicht nur aus dem einen, und die Vorjahre zeigen ihn weiter mit seinen
       Zahlen und in ihren Summen. Wessen Endsaldo null ist, steht schon angehakt da: getilgt
       ist getilgt. Ist er es nicht, sagt der Dialog es mit Zahl — verhindern tut er nichts,
       die Entscheidung ist deine.</p>
    <p>Ein <b>Anfangssaldo gilt ab dem 1. Januar seines Jahres</b> und lässt die Jahre davor
       unberührt — dein Verlauf bleibt stehen. Ohne ihn rechnet GÄPP über die Jahresgrenze
       durch. Du findest ihn im Blatt eines Gläubigers unter <b>«Anfangssaldi je Jahr»</b> und
       kannst ihn dort ändern oder wegnehmen. Weicht er von dem ab, was GÄPP selbst gerechnet
       hätte, steht die Abweichung daneben und ein <b>!</b> in der Standspalte — verrechnet wird
       sie nicht still.</p></div>

    <div class="regel"><h3>12. Die Monatsverteilung verschiebt Geld — sie erfüllt kein Budget</h3>
    <p>Nach dem Lohneingang wandert das Geld vom Lohnkonto in die Töpfe. Die Kachel
       <b>«Monatsverteilung»</b> im Dashboard zeigt alle Konten nebeneinander: was dort liegt,
       was das Budget diesen Monat für dieses Konto vorsieht, was schon umgebucht ist — und den
       Rest als Vorschlag. <b>Der Vorschlag ist ein Vorschlag.</b> Jedes Feld lässt sich
       überschreiben, auch das eines Kontos, das rechnerisch bedient ist.</p>
    <p><b>Diese Umbuchungen tragen keine Position.</b> Sie verschieben Geld zwischen deinen
       Konten und erfüllen damit keine Budgetzeile — das tut erst die Zahlung ab dem Zielkonto.
       Stünde die Position schon an der Umbuchung, zählte derselbe Betrag zweimal: einmal beim
       Verschieben, einmal beim Bezahlen.</p>
    <p>Steht ein Betrag so gebucht da, heisst der Knopf <b>«Ändern»</b>. Er bucht nichts, er
       führt zurück ins Feld. Der geänderte Wert ersetzt die Buchung, statt eine zweite
       anzulegen — und <b>0 nimmt sie ganz zurück</b>. Wo nichts zu tun ist, steht kein Knopf.</p></div>

    <div class="regel"><h3>13. Die Schuldenzeile liest sich von links nach rechts</h3>
    <p>Ganz links steht der <b>Anfang</b> — der Stand am 1. Januar des Jahres, das du ansiehst —,
       daneben der Stand <b>heute</b>. Dann kommen die zwölf Monate mit deinen Zahlungen, und
       rechts <b>Zahlungen</b> und <b>Ende</b>. Anfang minus Zahlungen ergibt Ende; geht das
       nicht auf, stimmt etwas in den Daten nicht — und dann ist das die Stelle, an der du es
       siehst.</p>
    <p>Unter jeder Gläubigerzeile steht eine zweite mit dem <b>Saldo nach jedem Monat</b>. Sie
       ist gerechnet; getippt wird in der Zeile darüber. Bis heute zeigt sie den wirklichen
       Stand, danach die Prognose nach deinem Ratenplan — das Geplante in leiserer Farbe. In
       «Alle Jahre» gibt es sie nicht, dort ist jede Spalte schon ein Jahresende.</p>
    <p><b>Grüne Zahlen heissen: dafür gibt es eine Buchung.</b> Sonst trägt Grün in GÄPP das
       positive Vorzeichen — in dieser einen Tabelle nicht, weil dort kein positiver Betrag
       vorkommt und sich die beiden Bedeutungen nie begegnen. Eine bewusste Ausnahme, kein
       Versehen. Zeigt eine grüne Zelle eine andere Zahl, als du gebucht hast, sagt es der Text
       beim Darüberfahren: die Zelle trägt den Plan, nicht die Buchung.</p></div>

    <h3>Berichte</h3>
    <p>In jedem Bericht lässt sich <b>jede Zeile anklicken</b>. Sie fällt zurück, und alles
       zieht mit: die Summen unten, die Anteilsbalken und die Kennzahlen im Kopf. So beantwortest
       du «was bliebe ohne diesen Posten» ohne zu rechnen. Ein zweiter Klick holt die Zeile
       zurück. Die gesicherte HTML-Datei kann dasselbe — auch auf einem fremden Rechner
       und ohne Netz.</p>

    <h3>Belege</h3>
    <p>Ein Beleg geht nie verloren. Ist der GÄPP-Ordner freigegeben, landet er sofort in
       <b>${ORD_BELEGE}</b>, nach Jahr getrennt und benannt nach Datum, Steller und Betrag. Ist er es nicht, wartet
       der Beleg im Browser und wird abgelegt, sobald du den Ordner freigibst — die Rechnung
       zeigt so lange <b>«liegt bereit, noch nicht abgelegt»</b>.</p>

    <h3>Was die Farben bedeuten</h3>
    <p><b>Orange</b> heisst «hier ist etwas aktiv oder auslösbar». <b>Rot</b> trägt das negative
       Vorzeichen und die zwei Fälle, in denen etwas nicht ging. <b>Grün</b> trägt das positive
       Vorzeichen — aber nie ein Guthaben für sich allein, sonst wäre der halbe Bildschirm grün.
       <b>Ocker</b> heisst «offen»: eine ungesicherte Änderung, eine offene Rechnung,
       ein Serienvorschlag, ein Beleg, der noch nicht abgelegt werden konnte.</p>
  </div>` };
}

function frage(text) { return window.confirm(text); }

/* ---- Werte in der Budgettabelle ------------------------------------- */
function budgetSetzen(zId, m, wert) {
  const j = String(S.jahr);
  if (!D.budget[j]) D.budget[j] = {};
  if (!D.budget[j][zId]) D.budget[j][zId] = { soll: 0, m: Array(12).fill(0) };
  D.budget[j][zId].m[m] = rd(wert);
  persist();
}
function sollSetzen(zId, wert) {
  const j = String(S.jahr);
  if (!D.budget[j]) D.budget[j] = {};
  if (!D.budget[j][zId]) D.budget[j][zId] = { soll: 0, m: Array(12).fill(0) };
  D.budget[j][zId].soll = rd(wert);
  persist();
}
function rateSetzen(vId, m, wert) {
  const v = verbind(vId), j = String(S.jahr);
  /* Wie budgetSetzen es vormacht: erst den Behaelter sichern, dann das Jahr.
     Ein Glaeubiger ohne raten-Objekt liess sich sonst keine Rate eintragen —
     der Zugriff warf, bevor er das Jahr anlegen konnte. */
  if (!v.raten) v.raten = {};
  if (!v.raten[j]) v.raten[j] = { soll: 0, m: Array(12).fill(0) };
  v.raten[j].m[m] = rd(wert);
  persist();
}
/* Doppelklick uebertraegt (A-33) */
/* ===================================================================
   U-17 — Wert uebertragen
   -------------------------------------------------------------------
   Zwei prompt()-Fenster hintereinander waren die schnellste Loesung, aber
   die schlechteste: keine Monatsnamen, keine Vorschau, kein Zurueck. Der
   Dialog zeigt jetzt beides — von wo bis wo — in der Formensprache der App.
   Er kann auch Raten, nicht nur Budgetzeilen.

   U-22: Aus dem einen Dialog sind drei Fragen geworden — uebertragen,
   loeschen, ein Jahr leeren. Das Geruest bleibt eines. Ein zweites waere
   ein zweiter Ort, an dem Escape, Abbrechen und der Fokus stimmen
   muessen, und der zweite Ort ist der, an dem es dann nicht stimmt.
   Was der rechte Knopf tut, steht in _dlgTun; ist es null, ist der Knopf
   nicht da (gesperrte Loeschung).
   =================================================================== */
let _ueber = null, _dlgTun = null;
function dialogAuf(titel, koerper, knopf, tun, gefahr) {
  _dlgTun = tun || null;
  $('#dialogTitel').textContent = titel;
  $('#dialogKoerper').innerHTML = koerper;
  const k = $('#btnUeberTun');
  k.textContent = knopf || '';
  k.className = 'knopf primaer' + (gefahr ? ' gefahr' : '');
  /* Gesperrt heisst: der Knopf ist nicht grau, sondern gar nicht da. Ein
     Knopf, der beim Klick erklaert, warum er nichts tut, laedt zum zweiten
     Klick ein — und irgendwann glaubt man, es habe doch geklappt. */
  k.hidden = !tun;
  $('#dialogHg').hidden = false;
}
/* Ein Weg hinaus, gleich ob Abbrechen, Escape oder erledigt. Alle drei
   Merker fallen zusammen weg — ein liegengebliebenes _loesch waere die
   Aufstellung von vorhin auf einem Datenstand von jetzt. */
function dialogZu() {
  _ueber = null; _loesch = null; _jahrLeer = null; _dlgTun = null;
  $('#dialogHg').hidden = true;
}
function uebertragen(art, id, m) {
  const rate0 = art === 'rate';
  const obj = rate0 ? verbind(id) : zeile(id);
  if (!obj) return;
  const wert = rate0 ? rate(obj, S.jahr, m) : zeilenwert(obj, S.jahr, m);
  const folge = rate0
    ? Object.keys(obj.raten || {}).map(Number).sort().filter(x => x > S.jahr)
    : Object.keys(D.budget).map(Number).sort().filter(x => x > S.jahr);
  _ueber = { art, id, m, wert, folge };
  const opt = (bis, gewaehlt) => MON_LANG.map((n,i) =>
    i >= (bis ? m : 0) ? `<option value="${i}"${i===gewaehlt?' selected':''}>${n}</option>` : '').join('');
  dialogAuf('Wert übertragen', `
    <p class="dlg-lead"><b class="num">${fmt(wert)}</b> für «${htmlText(obj.bezeichnung)}»</p>
    <div class="dlg-zeile">
      <span class="jahr num">${S.jahr}</span>
      <label>von <select id="ueberVon">${MON_LANG.map((n,i)=>`<option value="${i}"${i===m?' selected':''}>${n}</option>`).join('')}</select></label>
      <label>bis <select id="ueberBis">${opt(true, 11)}</select></label>
    </div>
    ${folge.length ? `<label class="dlg-haken"><input type="checkbox" id="ueberFolge">
      Auch auf die Folgejahre ${folge[0]}${folge.length>1 ? '–' + folge[folge.length-1] : ''} übertragen</label>` : ''}
    <p class="meldung" id="ueberVorschau"></p>`, 'Übertragen', uebertragenTun);
  ueberVorschau();
  $('#ueberVon').focus();
}
/* Der Dialog sagt vorher, was er tun wird — eine Uebertragung ueberschreibt
   in einem Zug bis zu zwoelf Monate. Die Leiste danach (U-20) faengt den
   Fehlgriff auf, nimmt aber die Ansage nicht ueberfluessig. */
function ueberVorschau() {
  if (!_ueber) return;
  const von = +$('#ueberVon').value, bis = +$('#ueberBis').value;
  const n = Math.max(0, bis - von + 1);
  const f = $('#ueberFolge') && $('#ueberFolge').checked ? _ueber.folge.length : 0;
  $('#ueberVorschau').textContent = n === 0
    ? 'Der bis-Monat liegt vor dem von-Monat — es wird nichts übertragen.'
    : `Überschreibt ${n} ${n===1?'Monat':'Monate'} in ${S.jahr}` +
      (f ? ` und alle zwölf Monate in ${f} ${f===1?'Folgejahr':'Folgejahren'}.` : '.');
}
function uebertragenTun() {
  if (!_ueber) return;
  const { art, id, wert, folge } = _ueber;
  const von = +$('#ueberVon').value, bis = +$('#ueberBis').value;
  const auchFolge = $('#ueberFolge') && $('#ueberFolge').checked;
  /* Vor der ersten Mutation, nicht danach: setzen() ruft je Monat persist(),
     und schon nach dem ersten haelt _sig einen halb geaenderten Stand. */
  const anz = Math.max(0, bis - von + 1);
  merkeStand('Wert auf ' + anz + (anz === 1 ? ' Monat' : ' Monate') + ' übertragen');
  const setzen = art === 'rate' ? rateSetzen : budgetSetzen;
  for (let i = von; i <= bis; i++) setzen(id, i, wert);
  if (auchFolge) {
    folge.forEach(j => {
      if (art === 'rate') {
        const v = verbind(id);
        if (!v.raten) v.raten = {};        /* Behaelter zuerst, sonst wirft der Zugriff */
        if (!v.raten[String(j)]) v.raten[String(j)] = { soll: wert, m: Array(12).fill(0) };
        for (let i = 0; i < 12; i++) v.raten[String(j)].m[i] = wert;
      } else {
        if (!D.budget[String(j)]) D.budget[String(j)] = {};

            'unter dem eine neu angelegte Kategorie landet.',
    schuld: 'Auf dieses Konto wird jede neue Verbindlichkeit angelegt und jede ' +

    kred:   'Dieses Konto führt die offenen Rechnungen: die Rechnungsmaske legt ' +
            'darauf an, und seine Kachel trägt den Knopf «Rechnung» statt «Buchen».'

  zeilen: {

                 'Ohne sie stünde die Gruppe im Budget mit null da, während die Schuld weiterläuft.',
    verb_privat: 'Diese Position spiegelt die Ratenpläne einer Gläubigergruppe. ' +
                 'Ohne sie stünde die Gruppe im Budget mit null da, während die Schuld weiterläuft.',
    verb_firmen: 'Diese Position spiegelt die Ratenpläne einer Gläubigergruppe. ' +

  ['konten',            'Konto',            'Konten'],
  ['kategorien',        'Kategorie',        'Kategorien'],
  ['zeilen',            'Position',         'Positionen'],
  ['verbindlichkeiten', 'Verbindlichkeit',  'Verbindlichkeiten'],
  ['sparziele',         'Sparziel',         'Sparziele'],
  ['steller',           'Rechnungssteller', 'Rechnungssteller'],

/* ---- Was mitginge ---------------------------------------------------
   Die transitive Huelle ueber die Fremdschluessel, als Arbeitsvorrat
   statt als Rekursion: ein Konto traegt Kategorien traegt Positionen
   traegt Rechnungen traegt Buchungen, und eine Rechnung kann ueber ihre
   Verbindlichkeit an einem Konto haengen, das schon drin ist. Ein Zyklus
   ist damit kein Sonderfall, sondern ein Treffer, der schon markiert ist.

   Rueckgabe ist bewusst schlicht (IDs, Zahlen, Zeichenketten) — der
   Pruefstand liest sie ueber die Fenstergrenze, und dort ueberlebt kein
   Set und kein Objekt aus D. */
function abhaengige(art, id) {
  const kopf = LOESCH_LISTE[art];
  if (!kopf || !D) return null;
  const treffer = {};
  Object.keys(LOESCH_LISTE).forEach(a => { treffer[LOESCH_LISTE[a]] = []; });
  const stapel = [[kopf, id]];
  while (stapel.length) {
    const [liste, i] = stapel.pop();
    if (treffer[liste].indexOf(i) >= 0) continue;
    treffer[liste].push(i);
    const zu = (l, passt) => (D[l] || []).forEach(o => { if (passt(o)) stapel.push([l, o.id]); });
    if (liste === 'konten') {
      zu('kategorien',        o => o.kontoId === i);
      zu('buchungen',         o => o.kontoId === i || o.gegenkontoId === i);
      zu('rechnungen',        o => o.kontoId === i);
      zu('serien',            o => o.vorlage && (o.vorlage.kontoId === i || o.vorlage.gegenkontoId === i));
      zu('verbindlichkeiten', o => o.kontoId === i);
      zu('sparziele',         o => o.kontoId === i);
    } else if (liste === 'kategorien') {
      zu('zeilen',            o => o.kategorieId === i);
    } else if (liste === 'zeilen') {
      zu('buchungen',         o => o.zeileId === i);
      zu('rechnungen',        o => o.zeileId === i);
      zu('serien',            o => o.vorlage && o.vorlage.zeileId === i);
    } else if (liste === 'rechnungen') {
      zu('buchungen',         o => o.rechnungId === i);
    } else if (liste === 'serien') {
      zu('buchungen',         o => o.serieId === i);
    } else if (liste === 'verbindlichkeiten') {
      zu('buchungen',         o => o.verbId === i);
      zu('rechnungen',        o => o.verbId === i);
    } else if (liste === 'sparziele') {
      zu('buchungen',         o => o.sparzielId === i);
    } else if (liste === 'steller') {
      zu('rechnungen',        o => o.stellerId === i);

  }

     wuerde sonst als Karteileiche stehenbleiben — unsichtbar, aber in jedem
     Export und in jedem Vergleich zweier Staende drin. */
  const budgetJahre = Object.keys(D.budget || {})
    .filter(j => treffer.zeilen.some(z => D.budget[j] && D.budget[j][z])).sort();
  /* Ratenplaene gehen mit ihrer Verbindlichkeit als Ganzes weg — sie stehen
     IN ihr, nicht daneben. Gezaehlt werden sie trotzdem, weil «1 Verbindlichkeit»
     nicht erkennen laesst, dass sieben Jahrgaenge Raten daranhaengen. */

    const v = verbind(vid);

  /* Fremde Konten: eine Umbuchung beruehrt zwei Konten. Wird sie geloescht,
     weil ihr eines Konto verschwindet, aendert sich der Saldo des anderen —
     und das ist die Wirkung, die am wenigsten erwartet wird. */
  const fremdeKonten = [];
  treffer.buchungen.forEach(bid => {
    const b = D.buchungen.find(x => x.id === bid);
    if (!b) return;
    [b.kontoId, b.gegenkontoId].forEach(k => {
      if (k && treffer.konten.indexOf(k) < 0 && fremdeKonten.indexOf(k) < 0) fremdeKonten.push(k);
    });

  /* Gesperrt ist auch, wer etwas Gesperrtes mitrisse. */
  let gesperrt = null;
  Object.keys(LOESCH_GESPERRT).forEach(liste => {
    treffer[liste].forEach(i => {
      if (gesperrt || !LOESCH_GESPERRT[liste][i]) return;
      gesperrt = { liste, id: i, name: loeschName(liste, i), grund: LOESCH_GESPERRT[liste][i],

  const zaehlung = [];
  let anzahl = 0;

    /* Das Objekt selbst ist nicht von sich selbst abhaengig. */
    const n = treffer[liste].length - (liste === kopf ? 1 : 0);
    if (n <= 0) return;

    zaehlung.push(n + ' ' + (n === 1 ? ein : viel));

    anzahl += budgetJahre.length;
    zaehlung.push('Budgetwerte in ' + budgetJahre.length + (budgetJahre.length === 1 ? ' Jahr' : ' Jahren'));
  }
  if (ratenJahre) zaehlung.push('Ratenpläne aus ' + ratenJahre + (ratenJahre === 1 ? ' Jahr' : ' Jahren'));

  return { art, id, liste: kopf, name: loeschName(kopf, id), treffer,
           budgetJahre, ratenJahre, fremdeKonten, zaehlung, anzahl, gesperrt,
           /* A-88 trifft U-20: im Schreibschutz ist merkeStand() still, und
              eine Kaskade ohne Rueckgaengig ist genau das, was hier nicht
              angeboten werden darf. Ein eigenes Feld und keine Sperre unter
              den anderen — der Grund ist ein anderer, und der Satz auch. */

/* ===================================================================
   U-32 — Fähnchen an der aktiven Zelle
   -------------------------------------------------------------------
   Die Kopfzeile ueber der Tabelle ist weg. Was sie sagte — welche Zeile,

   Tippen ohnehin ist: unmittelbar ueber der Zelle. Sie erscheint nur im

  const imFeld = ev.target && ev.target.id === 'suchfeld';
  if ((ev.ctrlKey || ev.metaKey) && !ev.shiftKey && (ev.key === 'k' || ev.key === 'K')) {

       ausgenommen — dort heisst Strg-K «nochmal von vorn». */
    const tag = ev.target && ev.target.tagName;

    ev.preventDefault(); sucheAuf(); return true;
  }
  if (!imFeld) return false;
  if (ev.key === 'Escape')    { ev.preventDefault(); sucheZu(); return true; }
  if (ev.key === 'ArrowDown') { ev.preventDefault(); sucheWahl(1);  return true; }
  if (ev.key === 'ArrowUp')   { ev.preventDefault(); sucheWahl(-1); return true; }
  if (ev.key === 'Enter')     { ev.preventDefault(); sucheGehen(_suchWahl); return true; }

      const a = document.activeElement;

  if ((ev.ctrlKey || ev.metaKey) && !ev.shiftKey && (ev.key === 'z' || ev.key === 'Z')) {

/* ===================================================================
   U-47 — Budgetjahr anlegen mit Regeln je Block (A-86)
   -------------------------------------------------------------------
   Bis hierher stellte jahrAnlegen() genau eine Frage: «Das Vorjahr
   fortschreiben? OK / Abbrechen» — und schrieb daraufhin ALLE Budgetzeilen
   UND alle Ratenplaene fort, oder keines von beidem. Alles oder nichts.

   Fuer Albrechts Fall ist beides falsch. Sein Haushaltsbudget steht und
   soll 1:1 weiterlaufen; seine Ratenplaene sind fuer das neue Jahr eine
   neue Entscheidung und duerfen nicht mitkopiert werden. Zwischen «alles»
   und «nichts» gab es keinen Platz dafuer.

   DIE DRITTE SPALTE IST DER EIGENTLICHE PUNKT. Vorher liess sich der
   Endsaldo einer Schuld nicht ins Folgejahr uebernehmen, weil es in GAEPP
   gar keinen Jahresanfangssaldo gab: ein Glaeubiger trug genau einen
   `anfangsstand` an einem `anfangsdatum`, alles andere war Durchrechnung.
   Der Saldovortrag (U-47 im Rechenkern) schafft ihn — und diese Maske ist
   die Stelle, an der er entsteht.

   GAEPP noch einen Browserdialog benutzte (N-05).

let _jn = null;
const jnWert = o => !!o && ((o.soll || 0) !== 0 || (o.m || []).some(x => (x || 0) !== 0));

function jahrAnlegen() {
  /* Ohne geladene Datendatei ist D null — dann gibt es kein Budget, in das
     ein Jahrgang gehoerte, und `D.budget` warf hier. Im Betrieb fuehrt zwar
     kein Weg hierher, solange nichts geladen ist; aber der leere Zustand ist
     ein Prueffall und kein Randfall (F-17), und eine Maske, die am ersten
     Zugriff platzt, ist keine Maske. */
  if (_ro || !D) return;
  const jahre = Object.keys(D.budget).map(Number).filter(j => !isNaN(j)).sort((a, b) => a - b);
  /* U-36: Ohne einen einzigen Jahrgang war jahre[jahre.length-1] undefined und
     der Vorschlag damit NaN. Im leeren Zustand ist das laufende Jahr der
     richtige Vorschlag. Der Vergleicher in .sort() stand hier als einziger
     Stelle nicht da (vgl. budgetJahre()). */
  const j = jahre.length ? jahre[jahre.length - 1] + 1 : new Date().getFullYear();
  _jn = { jahr: j, kat: new Set(), saldo: new Set(), raten: new Set(), weg: new Set() };

  dialogAuf('Jahr anlegen', jnMaske(), 'Jahr anlegen', jahrAnlegenTun, false);
}
/* Die Voreinstellung ist der haeufige Fall und nicht die Mitte: Budget
   uebernehmen, Saldo vortragen, Raten NICHT. Wer nichts anklickt, bekommt
   ein Jahr, das den Haushalt fortschreibt und die Schulden dort weiterfuehrt,
   wo sie am 31.12. standen — ohne die Zahlungen des Vorjahrs zu wiederholen.
   Ein Saldo von null wird nicht vorgetragen: eine getilgte Schuld braucht
   keinen Vortrag, und eine, die es im Zieljahr noch nicht gibt, erst recht
   nicht. */
function jnVoreinstellung() {
  jnKategorien().forEach(x => _jn.kat.add(x.k.id));
  _jn.saldo.clear(); _jn.raten.clear(); _jn.weg.clear();
  /* U-49: Ein Glaeubiger, dessen Endsaldo null ist, ist getilgt — und ein
     getilgter gehoert nicht ins neue Jahr. Er steht deshalb voreingestellt
     auf «ab hier weg» statt auf «Saldo vortragen»; die beiden schliessen
     einander aus. Wer trotzdem will, dass er stehenbleibt, nimmt den Haken
     weg — das ist ein Handgriff statt eines Suchens. */
  jnGlaeubiger().forEach(x => {
    if (Math.abs(x.end) < 0.005) _jn.weg.add(x.v.id); else _jn.saldo.add(x.v.id);
  });
}
/* Eine Kategorie steht in der Liste, wenn sie im ZIELJAHR sichtbar ist und
   mindestens eine eigene, nicht gespiegelte Zeile fuehrt. Gespiegelte Zeilen
   haben keine eigenen Werte — «Verbindlichkeiten» und «Rechnungen» waeren
   Haken ohne Wirkung. */
function jnKategorien() {
  const j = _jn.jahr, vor = String(j - 1);
  return D.kategorien.filter(k => katSicht(k, j)).map(k => {
    const zeilen = D.zeilen.filter(z => z.kategorieId === k.id && !gespiegelt(z) && zeileSicht(z, j));
    const mit = zeilen.filter(z => jnWert((D.budget[vor] || {})[z.id])).length;
    return { k, zeilen, mit };
  }).filter(x => x.zeilen.length);
}
/* Je Glaeubiger sein Stand am 31.12. des Vorjahrs — durchgerechnet mit Plan,
   also genau die Zahl, die in der Uebertragsspalte der Tabelle steht. */
function jnGlaeubiger() {
  const j = _jn.jahr, vor = String(j - 1);
  /* U-49: Wer schon frueher ausgeblendet wurde, steht hier nicht mehr — er
     ist keine Entscheidung dieses Jahrgangs mehr. Gefragt wird nach dem
     VORjahr: Ein Glaeubiger, der ab dem Zieljahr ausgeblendet ist, soll
     sichtbar bleiben, damit man ihn zurueckholen kann. */
  return GRUPPEN.map(g => ({ g, liste: ordListe('verb', g.id).filter(v => verbSicht(v, j - 1))
    .map(v => ({ v, end: rd(verbindPrognose(v, j - 1, 11)), hatRaten: jnWert((v.raten || {})[vor]) })) }))
    .filter(x => x.liste.length)

function jnMaske() {

  const saldoN = gl.filter(x => _jn.saldo.has(x.v.id) && !_jn.weg.has(x.v.id)).length;
  const ratenN = gl.filter(x => _jn.raten.has(x.v.id) && !_jn.weg.has(x.v.id)).length;

  let letzteG = null;
  const glZeilen = gl.map(x => {
    const kopf = x.g.id !== letzteG ? `<div class="jn-grp">${x.g.name}</div>` : '';
    letzteG = x.g.id;

      <span class="bet">${x.end > 0.005 || x.end < -0.005 ? fmt(x.end) : '–'}</span>
      <span class="zell"><input type="checkbox" data-jns="${x.v.id}"${an ? ' checked' : ''}
        ${weg ? 'disabled' : ''} aria-label="Endsaldo als Anfangssaldo ${j} übernehmen"></span>
      <span class="zell"><input type="checkbox" data-jnr="${x.v.id}"${_jn.raten.has(x.v.id) && !weg ? ' checked' : ''}
        ${x.hatRaten && !weg ? '' : 'disabled'} aria-label="Ratenplan ${vor} fortschreiben"></span>
      <span class="zell"><input type="checkbox" data-jnw="${x.v.id}"${weg ? ' checked' : ''}
        aria-label="Ab ${j} ausblenden"></span></div>`;
  }).join('');
  return `<div id="jnMaske">
    <div class="jn-jahr">
      <input id="jnJahr" value="${j}" inputmode="numeric" aria-label="Neues Jahr">
      <span class="v">Vorlage: <b>${vor}</b></span>
    </div>
    ${D.budget[k] ? `<p class="dlg-warnung"><b>Das Jahr ${j} gibt es schon.</b><br>
      Anlegen setzt Budget, Ratenpläne und Anfangssaldi dieses Jahrgangs neu. Was jetzt
      darin steht, ist danach weg — zwölf Sekunden lang rücknehmbar.</p>` : ''}

    <div>
      <div class="jn-kopf"><span class="t">Budget übernehmen</span>
        <span class="alle"><button type="button" data-jnalle="k1">alle</button>
        <button type="button" data-jnalle="k0">keine</button></span></div>
      <div class="jn-liste">${kats.length ? kats.map(x => `<label class="jn-kz${_jn.kat.has(x.k.id) ? '' : ' aus'}">
        <input type="checkbox" data-jnk="${x.k.id}"${_jn.kat.has(x.k.id) ? ' checked' : ''}>
        <span class="nam">${htmlText(x.k.name)}</span>
        <span class="anz">${x.mit ? x.mit + (x.mit === 1 ? ' Zeile' : ' Zeilen') : 'leer'}</span></label>`).join('')
        : '<p class="meldung">Keine Kategorie mit eigenen Zeilen.</p>'}</div>
    </div>

    ${gl.length ? `<div>
      <div class="jn-skopf"><span class="t">Schulden</span>
        <span class="sp">Endsaldo<br>31.12.${vor}</span>
        <span class="sp">Saldo<button type="button" data-jnalle="s${saldoN ? 0 : 1}">${saldoN ? 'keine' : 'alle'}</button></span>
        <span class="sp">Raten<button type="button" data-jnalle="r${ratenN ? 0 : 1}">${ratenN ? 'keine' : 'alle'}</button></span>
        <span class="sp">Ab hier<br>weg<button type="button" data-jnalle="w${wegN ? 0 : 1}">${wegN ? 'keine' : 'alle'}</button></span></div>

    <div class="jn-vor">
      <div class="z"><b class="num">${zeilenZahl}</b> Budgetzeilen mit Werten
        <span class="m">— aus ${kats.filter(x => _jn.kat.has(x.k.id)).length} von ${kats.length} Kategorien</span></div>
      ${gl.length ? `<div class="z"><b class="num">${saldoN}</b> Anfangssaldi gesetzt

      ${wegRest.length ? `<div class="jn-warn"><b>${wegRest.length === 1

    </div>

function jnNeu() { const el = $('#dialogKoerper'); if (el) el.innerHTML = jnMaske(); }
/* Zwei eigene Zuhoerer statt Eintraegen in der grossen Klick-Kette: Sie
   greifen nur, solange die Maske offen ist, und fallen mit ihr weg. */
document.addEventListener('change', ev => {
  const t = ev.target;
  if (!_jn || !t || !t.closest || !t.closest('#jnMaske')) return;
  if (t.id === 'jnJahr') {
    const x = parseInt(t.value, 10);
    if (!x || x < 2000 || x > 2100) { t.value = _jn.jahr; return; }
    /* Ein anderes Jahr heisst andere Endsaldi und andere sichtbare Zeilen.
       Die Voreinstellung wird deshalb neu gesetzt und nicht mitgeschleppt —
       eine Auswahl, die fuer 2027 galt, sagt ueber 2031 nichts. */
    _jn.jahr = x; _jn.kat.clear(); jnVoreinstellung(); return jnNeu();
  }
  const id = t.dataset.jnk || t.dataset.jns || t.dataset.jnr || t.dataset.jnw;
  if (!id) return;
  const menge = t.dataset.jnk ? _jn.kat : t.dataset.jns ? _jn.saldo
              : t.dataset.jnr ? _jn.raten : _jn.weg;
  if (t.checked) menge.add(id); else menge.delete(id);
  /* U-49: «ab hier weg» und «Saldo vortragen» schliessen einander aus — ein
     Glaeubiger, den es ab diesem Jahr nicht mehr gibt, braucht keinen
     Anfangssaldo und keinen Ratenplan. Wer ihn wegnimmt, nimmt beides mit. */
  if (t.dataset.jnw && t.checked) { _jn.saldo.delete(id); _jn.raten.delete(id); }
  jnNeu();
});
document.addEventListener('click', ev => {

  else {

    menge.clear();

      if (art === 's')      { if (!_jn.weg.has(x.v.id)) menge.add(x.v.id); }
      else if (art === 'r') { if (x.hatRaten && !_jn.weg.has(x.v.id)) menge.add(x.v.id); }
      else                  menge.add(x.v.id);
    });
    /* Wer alle wegnimmt, nimmt ihre Saldi und Raten mit — sonst stuenden
       Haken fuer Glaeubiger, die es im neuen Jahr gar nicht gibt. */
    if (art === 'w' && an) { _jn.saldo.clear(); _jn.raten.clear(); }

function jahrAnlegenTun() {
  if (_ro || !_jn) return;
  const j = _jn.jahr, k = String(j), vor = String(j - 1);
  /* Erste Anweisung nach der Bestaetigung — vor der ersten Zuweisung. */
  merkeStand('Budgetjahr ' + j + ' angelegt');
  /* Die Endsaldi werden VOR dem Schreiben gerechnet. Danach stuenden in
     v.raten[k] und v.staende[k] bereits die neuen Werte, und die Rechnung
     saehe ein Jahr, das es beim Rechnen noch nicht gab. Dass die Grenze im
     Dezember des Vorjahrs liegt, macht das hier folgenlos — verlassen sollte
     man sich darauf nicht. */
  const saldi = {};
  D.verbindlichkeiten.forEach(v => {
    if (_jn.saldo.has(v.id)) saldi[v.id] = rd(verbindPrognose(v, j - 1, 11));
  });
  D.budget[k] = {};
  D.zeilen.forEach(z => {
    if (gespiegelt(z)) return;
    /* U-21: Eine Zeile, die im neuen Jahr ausgeblendet ist, bekommt dort
       keinen Behaelter. Sonst schriebe das Fortschreiben ihre alten Werte in
       ein Jahr, in dem sie gar nicht mehr steht. */
    if (!zeileSicht(z, j)) return;
    const nimm = _jn.kat.has(z.kategorieId);
    const q = nimm && D.budget[vor] ? D.budget[vor][z.id] : null;
    D.budget[k][z.id] = q ? { soll:q.soll, m:q.m.slice() } : { soll:0, m:Array(12).fill(0) };
  });
  D.verbindlichkeiten.forEach(v => {
    if (!v.raten)   v.raten = {};      /* Behaelter zuerst, sonst wirft schon das Lesen */
    if (!v.staende) v.staende = {};
    /* U-49: Wer schon vor dem Zieljahr ausgeblendet war, bleibt unberuehrt.
       Er stand nicht in der Maske, also ist er auch keine Entscheidung
       dieses Jahrgangs — und ein Ratenplan fuer ein Jahr, in dem es ihn
       nicht gibt, waere eine Zahl ohne Gegenstand. */
    if (!verbSicht(v, j - 1)) return;
    if (_jn.weg.has(v.id)) {
      /* «Ab hier weg» heisst ab dem Zieljahr — und raeumt mit, was fuer
         dieses Jahr sonst dastuende. */
      v.ausAb = j;
      delete v.raten[k];
      delete v.staende[k];
      return;
    }
    /* Nicht weggewaehlt heisst: er bleibt. Ein `ausAb`, das genau auf dieses
       Jahr zeigte, wird damit zurueckgenommen — sonst liesse sich ein
       versehentliches Ausblenden nur in der Maske des Glaeubigers heilen. */
    if (v.ausAb === j) v.ausAb = null;
    const q = _jn.raten.has(v.id) ? v.raten[vor] : null;
    /* U-49: Kein Ratenplan, wo keiner gewollt ist. Bis hierher entstand
       einer aus lauter Nullen — und stand danach als ausdruecklich
       gepflegte Null da, die niemand eingetragen hat. jahrLeeren() sagt an
       derselben Stelle seit U-22 genau das Gegenteil; zwei Stellen
       derselben App beantworteten dieselbe Frage verschieden. */
    if (q) v.raten[k] = { soll:q.soll, m:q.m.slice() }; else delete v.raten[k];
    /* Kein Vortrag heisst: KEIN Eintrag. Eine gespeicherte Null waere etwas
       anderes als kein Vortrag — sie zwaenge die Schuld am 1.1. auf null,
       statt sie durchrechnen zu lassen. */
    if (v.id in saldi) v.staende[k] = saldi[v.id]; else delete v.staende[k];
  });
  persist();
  S.jahr = j;
  dialogZu();
  zeichne();
}

    const roh = JSON.parse(localStorage.getItem(SCHLUESSEL_DATEN) || 'null');
    if (roh && roh.d) { uebernehmen(roh.d); if (roh.s) S = Object.assign(S, roh.s); }
    ansichtFangen();   /* U-40 */
  } catch (err) {}
  /* Eingefrorener Export: Daten stecken in der Datei, nichts laesst sich aendern (A-65) */
  if (window.GAEPP_FROZEN) {
    D = window.GAEPP_FROZEN; _ro = true;
    document.body.classList.add('readonly');

    GH = { repo:'', branch:'main', token:'' };
    setSync('off', 'Eingefrorener Stand');

  /* Ein Blatt, das beim Neuladen offen war, geht nicht wieder auf — die Ansicht
     soll beim Start ruhig sein. Der Zeitraum und die Klappzustaende bleiben. */
  S.blatt = null;
}

/* ---- F-07: Glaeubiger speichern -------------------------------------
   Angelegt wird mit Anfangssaldo und Datum; der Stand rechnet sich von da
   an aus gebuchten Zahlungen und Erhoehungen (E-14). Die Raten traegt
   Albrecht danach in der Tabelle ein, Monat fuer Monat.
   Ohne dieses Bauteil landete eine neue Schuld frueher als unsichtbarer
   Zuschlag auf einer fremden Zeile. */
function glaeubigerSpeichern() {
  const name = ($('#gName').value || '').trim();
  if (!name) { $('#gHint').textContent = 'Ohne Bezeichnung geht es nicht.'; return; }
  const stand = zahl($('#gStand').value);
  const zins  = $('#gZins').value.trim()    === '' ? null : zahl($('#gZins').value);
  const geb   = $('#gGebuehr').value.trim() === '' ? null : rd(zahl($('#gGebuehr').value));
  const alt   = $('#gId') ? verbind($('#gId').value) : null;
  /* U-22: Die Dokumentliste wird VOR der ersten Zuweisung gelesen und geprueft.
     Eine abgelehnte Adresse darf nicht die Haelfte der Maske gespeichert
     zuruecklassen — sonst stuende der neue Zinssatz drin und der Grund fuer
     den Abbruch daneben. */
  const doks = [];
  let boese = null;
  $$('#gDoks .dok').forEach(r => {
    const n = ($('.dokName', r).value || '').trim();
    const u = ($('.dokUrl',  r).value || '').trim();
    if (!n && !u) return;                    /* leere Zeile ist keine Absicht */
    if (!dokUrlOk(u)) { if (!boese) boese = u || n; return; }
    doks.push({ name: n || u, url: u });
  });
  if (boese) {
    $('#gHint').textContent = 'Die Adresse muss mit http:// oder https:// beginnen — «'
      + boese.slice(0, 40) + '» tut das nicht.';
    return;
  }
  const v = alt || { id: neueId('v'), raten: {}, erhoehungen: [], aktiv: true,
                     auszugswert: null, auszugsdatum: null, vertreter: '', nominal: null,
                     dokumente: [] };
  v.bezeichnung  = name;
  /* U-31: Die Gruppe entscheidet ueber den Block, in dem der Rang gilt.
     Wechselt sie, waere der alte Rang die Stelle in einer fremden Liste —
     der Glaeubiger landete irgendwo mitten in der neuen Gruppe. Ein
     Wechsel haengt ihn deshalb hinten an; von dort laesst er sich mit
     einem Zug dahin bringen, wo er hingehoert.
     Dasselbe gilt fuer den ganz neuen: er kommt ans Ende seiner Gruppe. */
  const gAlt = v.gruppe;
  v.gruppe       = $('#gGruppe').value;
  if (!alt || gAlt !== v.gruppe)
    v.rang = Math.max(0, ...D.verbindlichkeiten
      .filter(x => x !== v && x.gruppe === v.gruppe).map(x => x.rang || 0)) + RANG_SCHRITT;
  v.kontoId      = $('#gKonto').value;
  v.anfangsstand = rd(stand);
  v.anfangsdatum = $('#gDatum').value || heuteISO();
  /* U-49: leer heisst «bleibt sichtbar» und nicht «Jahr 0». Eine Zahl
     ausserhalb der gefuehrten Jahre waere ein Tippfehler und kein Wunsch —
     sie wird verworfen, statt den Glaeubiger unsichtbar zu machen. */
  {
    const roh = ($('#gAusAb').value || '').trim();
    const x = parseInt(roh, 10);
    v.ausAb = (roh === '' || !x || x < 2000 || x > 2100) ? null : x;
  }
  v.zinssatz     = zins;
  v.gebuehr      = geb;
  v.vereinbarungBis = $('#gBis').value || null;
  v.hinweis      = ($('#gHinweis').value || '').trim();
  v.dokumente    = doks;
  /* Eine von Hand angelegte Zeile ist genau so belegt, wie ihr Hinweis sagt. */
  v.herkunft     = v.hinweis ? 'belegt' : 'geschaetzt';
  if (!alt) D.verbindlichkeiten.push(v);
  persist(); blattZu(); zeichne();
}

</script>
