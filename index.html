 — nur dort sichtbar, hier mitgefuehrt,\n   damit die Datei ihr Aussehen aus derselben Quelle bekommt. */\n.efrahmen{max-width:1080px;margin:0 auto;padding:26px 22px 60px}\n.ehinweis{background:var(--soft);border-radius:var(--radius-sm);padding:11px 16px;\n  font-size:12.5px;color:var(--muted);margin-bottom:20px;display:flex;gap:12px;\n  flex-wrap:wrap;align-items:center}\n.ehinweis b{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.16em;color:var(--ink)}\n.ehinweis button{margin-left:auto;background:var(--accent);border:none;color:var(--onaccent);\n  border-radius:var(--radius-sm);padding:7px 14px;font-family:inherit;font-size:12.5px;cursor:pointer}\n.ekarte{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);\n  box-shadow:var(--shadow);padding:28px 32px}\n\n/* --- Druck: aus der Nacht wird Papier, ueber die Tokens ---------------\n   Nicht Regel fuer Regel umschreiben, sondern die Farbwelt tauschen.\n   Sonst vergisst man beim naechsten neuen Element genau eine Stelle. */\n@media print{\n  /* In der App bleibt nur #druck stehen. In der gesicherten Berichtsdatei\n     gibt es kein #druck — dort ist .efrahmen der ganze Inhalt und muss\n     die Ausnahme sein, sonst druckt sie ein leeres Blatt. */\n  body > *:not(.efrahmen){display:none !important}\n  #druck{display:block !important;position:static}\n  #druck,.efrahmen{\n    --bg:#fff; --card:#fff; --sheet:#fff; --soft:#f2f2f2; --line:#ddd; --rule:#bbb;\n    --ink:#111; --muted:#555; --accent:#a85c00; --onaccent:#fff;\n    --ok:#2f6b48; --err:#a33; --shadow:none}\n  body{background:#fff}\n  #druck .bericht,.efrahmen .bericht{background:#fff;color:#111}\n  /* Das Kopfband der gesicherten Datei erklaert die Bedienung — auf Papier\n     gibt es nichts zu bedienen. Was fehlt, sagt die Fusszeile. */\n  .ehinweis{display:none}\n  .efrahmen{max-width:none;padding:0}\n  .ekarte{border:none;box-shadow:none;padding:0}\n  /* Eine ausgeblendete Zeile gehoert nicht aufs Papier — blassgrau gedruckt\n     sieht sie nach Druckfehler aus. Dass welche fehlen, sagt die Fusszeile. */\n  .btab tbody tr.aus{display:none}\n  .btab tr{page-break-inside:avoid}\n  .bericht .bh{page-break-after:avoid}\n  .bbar{-webkit-print-color-adjust:exact;print-color-adjust:exact}\n  .bkennz{-webkit-print-color-adjust:exact;print-color-adjust:exact}\n}\n#druck{display:none}\n\n/* --- Rueckgaengig-Leiste (U-20) --------------------------------------\n   Hoehenlage 110: ueber dem Blatt (100) — «Rechnung bezahlt» passiert im\n   Blatt, die Leiste muss darueber liegen — und unter dem modalen Dialog\n   (120). Solange eine Frage offen steht, wird also kein Rueckgaengig\n   angeboten; das ist die richtige Semantik und kostet keine Extralogik.\n   Die Druckregel oben blendet sie mit body > *:not(.efrahmen) schon aus. */\n.zurueckleiste{\n  position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:110;\n  display:flex;align-items:center;gap:12px;max-width:min(90vw,560px);\n  background:var(--card);border:1px solid var(--rule);border-radius:var(--radius);\n  box-shadow:var(--shadow);padding:9px 11px 9px 16px}\n.zurueckleiste .tx{font-size:12.5px;color:var(--ink);line-height:1.45}\n.zurueckleiste .knopf{flex:0 0 auto}\n.zurueckleiste #btnZurueckZu{color:var(--muted);padding:4px 9px;font-size:13px;line-height:1}\n\n/* --- Handbuch --- */\n.hb h3{font-size:13.5px;font-weight:600;margin:16px 0 5px;letter-spacing:-.01em}\n.hb h3:first-child{margin-top:0}\n.hb p{font-size:12.5px;color:var(--muted);line-height:1.6;margin-bottom:7px}\n.hb p b{color:var(--ink);font-weight:600}\n.hb .regel{border-left:2px solid var(--accent);padding-left:12px;margin-bottom:14px}\n\n/* --- Erster Start: die App hat noch keine Daten --- */\n.leerstart{max-width:520px;margin:60px auto;text-align:center}\n.leerstart h2{font-size:19px;font-weight:600;letter-spacing:-.015em;margin-bottom:8px}\n.leerstart p{color:var(--muted);font-size:13px;line-height:1.6;margin-bottom:16px}\n\n/* --- Schreibgeschuetzt (A-88) --- */\nbody.readonly td.bearbeitbar input,body.readonly .feld input,body.readonly .feld select{\n  pointer-events:none;opacity:.65}\n\n/* --- Beträge dürfen nicht abgeschnitten werden -----------------------\n   Die Monatsspalten waren 78 px breit (Formensprache L). Der groesste Wert\n   im Budget ist fuenfstellig mit Rappen und Tausendertrennung — neun\n   Zeichen. Bei 12 px Schrift und 8 px Polster passt das nicht; die Zahl\n   wurde beschnitten. Statt die Spalte zu verbreitern (dann rollt die\n   Tabelle bei 1600 px wieder seitlich) sitzen Schrift und Polster eine\n   Spur enger.\n   Der konkrete Betrag stand hier frueher im Klartext und ist am 17.08.2026\n   entfernt worden: Diese Datei ist die oeffentliche Huelle, und A-78 gilt\n   auch fuer Kommentare. */\ntable.gross .n{font-size:11.5px;padding:0 5px}\ntable.gross td.bearbeitbar input{font-size:11.5px;padding:0 4px}\ntable.gross tr.zeile-gesamt > td,table.gross thead tr.zeile-frei td{font-size:12px}\n/* 84 statt 78 px je Monat, dafuer die Spalte Zahlungsweg von 126 auf 108 px.\n   Damit bleibt die Gesamtbreite unter der eines 1600-px-Fensters und die\n   Tabelle rollt weiterhin nicht seitlich. Ohne Netz greift die Fallback-\n   Schrift, die breiter baut als IBM Plex Mono - danach ist gemessen. */\n.t-budget{--w2:108px;--w3:84px}\ntable.gross th.n,table.gross td.n,table.gross td.bearbeitbar{min-width:84px;max-width:84px}\ntable.gross th:last-child,table.gross td:last-child{min-width:100px;max-width:100px}\n.t-verbind th.n,.t-verbind td.n,.t-verbind td.bearbeitbar{min-width:84px;max-width:84px}\n.t-rechnung th.n,.t-rechnung td.n{min-width:98px;max-width:98px}\n.t-rechnung th:last-child,.t-rechnung td:last-child{min-width:130px;max-width:130px}\n/* Beschreibender Text darf mit Auslassungspunkten enden - eine Zahl nie. */\ntable.gross td.zahlung{overflow:hidden;text-overflow:ellipsis}\n\n/* --- Zwischenueberschrift in der Sektion Schulden --------------------\n   Vorhandenes Bauteil aus dem Mockup, hier mit Summe und Ratenzahl. */\n.sektion .untertitel{margin:16px 0 9px;align-items:baseline}\n.sektion .untertitel:first-of-type{margin-top:0}\n.sektion .untertitel .num{color:var(--ink);font-size:13px}\n.sektion .untertitel span:last-child{color:var(--muted);font-size:11.5px;margin-left:auto}\n.sektion .untertitel + .raster{margin-bottom:4px}\n\n/* --- Ablegeflaeche nimmt eine Datei entgegen (A-56) --- */\n.ablegeflaeche{cursor:pointer}\n.ablegeflaeche:hover,.ablegeflaeche.drueber{border-color:var(--accent);color:var(--ink)}\n.ablegeflaeche b{color:var(--ink);font-weight:600}\n\n/* ===================================================================\n   U — Spaltenbreiten des Umbaus. Steht bewusst am Ende: die Breiten\n   der Zahlenspalten werden weiter oben zweimal gesetzt, und die\n   Faltspalte muss beide Male gewinnen.\n   =================================================================== */\ntable.gross th.faltzelle,table.gross td.faltzelle,\n.t-verbind th.faltzelle,.t-verbind td.faltzelle{\n  width:28px;min-width:28px;max-width:28px;padding:0;overflow:hidden}\n/* Bleibt Platz uebrig, bekommen ihn die Zahlenspalten — aber gerechnet,\n   nicht vom Browser proportional verteilt. Sonst wuchs ausgerechnet die\n   Namensspalte am staerksten, und die fixierten Spalten stimmten beim\n   Seitwaertsrollen nicht mehr mit ihren left-Werten ueberein (U-4).\n   Die ersten drei Spalten behalten ihre Breite auf den Pixel. */\ntable.gross th.n:nth-child(n+4),table.gross td.n:nth-child(n+4),\ntable.gross td.bearbeitbar:nth-child(n+4){min-width:var(--wz,84px);max-width:var(--wz,84px)}\ntable.gross th.faltzelle,table.gross td.faltzelle{\n  width:28px !important;min-width:28px !important;max-width:28px !important}\ntable.gross th:last-child,table.gross td:last-child{min-width:var(--wl,100px);max-width:var(--wl,100px)}\n/* Auf den Inhalt gemessen — mit der Fallback-Schrift, die breiter baut. */\n.t-budget{--w1:208px;--w2:112px;--w3:78px}\n.t-verbind{--w1:226px;--w2:86px;--w3:80px}\ntable.fixiert th:nth-child(1),table.fixiert td:nth-child(1){min-width:var(--w1);max-width:var(--w1)}\ntable.fixiert th:nth-child(2),table.fixiert td:nth-child(2){min-width:var(--w2);max-width:var(--w2)}\ntable.fixiert th:nth-child(3),table.fixiert td:nth-child(3){min-width:var(--w3);max-width:var(--w3)}\n\n/* ===================================================================\n   U-25 — Vollbild fuer die Tafel\n   -------------------------------------------------------------------\n   Eine Klasse am Rahmen, sonst nichts. Kein zweiter Seitenaufbau, kein\n   Umhaengen von Knoten: was weicht, weicht mit display:none, und alles\n   darunter — Blatt, Dialog, Rueckgaengig-Leiste — bleibt unberuehrt an\n   seiner Stelle. Damit ist der Rueckweg dieselbe Klasse weniger und\n   kann nicht halb misslingen.\n   =================================================================== */\n.rahmen.vollbild .seitenleiste,\n.rahmen.vollbild .kopfzeile{display:none}\n/* Der Rand von zwanzig Pixel kostet vierzig Pixel Breite. Genau die holt\n   man sich mit dem Vollbild, also faellt er hier mit. Die Tafel verliert\n   dabei ihre Rundung: eine abgerundete Ecke am Fensterrand sieht aus wie\n   ein Fehler, nicht wie eine Karte. */\n.rahmen.vollbild .inhalt[data-modus=\"tabellen\"]{padding:0}\n.rahmen.vollbild .tafel{border-radius:0;border-left:none;border-right:none;border-top:none}\n/* Der Titel gibt seinen Dehnplatz an die Kennzahlen ab — sie gehoeren\n   neben ihn und nicht ans andere Ende zu den Schaltern. */\n.rahmen.vollbild .tafel-kopf .titel{margin-right:0}\n.tafel-kopf .kopfband{margin-right:auto;gap:18px}\n.tafel-kopf .kopfband .wert .v{font-size:13.5px}\n#btnVollbild{font-size:14px;line-height:1;padding-left:9px;padding-right:9px}\n\n/* ===================================================================\n   U-25 — Greifer fuer die Spaltenbreiten\n   -------------------------------------------------------------------\n   Sechs Pixel auf der Trennlinie der Kopfzelle, wie in jeder\n   Tabellenkalkulation. Unsichtbar, bis der Zeiger darauf steht: zwanzig\n   dauerhafte Striche mehr im Kopf machen die Tabelle unruhiger, als sie\n   an Auffindbarkeit gewinnen — gesucht wird der Greifer ohnehin dort,\n   wo man ihn kennt. Die Kopfzellen sind bereits sticky und damit\n   positioniert; der Greifer haengt sich absolut an sie und wandert\n   deshalb beim Seitwaertsrollen mit ihrer Spalte.\n   =================================================================== */\n.greifer{position:absolute;top:0;right:0;width:6px;height:100%;z-index:2;\n  cursor:col-resize;background:transparent;border:none;padding:0;touch-action:none}\n.greifer:hover,.greifer:focus-visible{background:var(--accent);outline:none}\n/* Waehrend des Zugs gehoert der Zeiger dem Zug — auch ueber fremden\n   Zellen. Ohne die Sperre markiert der Browser unterwegs Kopftext. */\nbody.zieht,body.zieht *{cursor:col-resize !important;user-select:none}\n\n\n/* ===================================================================\n   U-32 — FARBWELT UND BUDGETTAFEL, ZWEITE FASSUNG\n   -------------------------------------------------------------------\n   Steht am Ende, damit sie ohne Eingriff in die Regeln darueber gilt.\n   Anthrazit-Blau statt Nacht-Braun, Minze statt Orange; die Farben der\n   Betraege bleiben, wie sie sind: Minze fuer Plus, Rose fuer Minus.\n   =================================================================== */\n:root{\n  --bg:#0c0f13; --card:#12161c; --sheet:#151b23; --soft:#1b2531;\n  --line:#1d232b; --rule:#2a3542; --ink:#f2f5f8; --muted:#8b95a2;\n  --accent:#8ee6c8; --onaccent:#0c0f13;\n  --ok:#8ee6c8; --err:#f0a08d; --open:#e3c98d;\n  --hairline:#151b23;\n}\nbody{font-family:'Space Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif}\n.marke{letter-spacing:.02em}\n.knopf.primaer:hover{filter:brightness(1.08)}\ntr:hover td.bearbeitbar input::placeholder,\ntd.bearbeitbar input:focus::placeholder{color:#3d4753}\n\n/* ---- Budgettafel: eine fixierte Spalte statt drei ------------------ */\n.t-budget{--w1:268px}\n.t-budget tbody td:nth-child(2),.t-budget tbody td:nth-child(3){position:static;left:auto;border-right:none}\n.t-budget thead th:nth-child(2),.t-budget thead th:nth-child(3),\n.t-budget thead td:nth-child(2),.t-budget thead td:nth-child(3){left:auto;border-right:none}\n.t-budget th:nth-child(1),.t-budget td:nth-child(1){border-right:1px solid var(--rule)}\n.t-budget th.n:nth-child(n+2),.t-budget td.n:nth-child(n+2),\n.t-budget td.bearbeitbar:nth-child(n+2){min-width:var(--wz,96px);max-width:var(--wz,96px)}\n.t-budget th:last-child,.t-budget td:last-child{min-width:var(--wl);max-width:var(--wl)}\n/* Die alte Regel hob die dritte Spalte (Soll) hervor — dort steht jetzt ein Monat. */\n.t-budget tr.zeile-daten td:nth-child(3){color:var(--muted)}\n.t-budget tr.zeile-daten:hover td:nth-child(3){color:var(--ink)}\n\n/* ---- Der gewonnene Platz geht in die Lesbarkeit ------------------- */\n.t-budget .n{font-size:12.5px;padding:0 9px}\n.t-budget td.bearbeitbar input{font-size:12.5px;padding:0 9px}\n.t-budget tr.zeile-daten > td{height:32px}\n\n/* ---- Laufender Monat als durchgehendes Band ----------------------- */\n.t-budget td.jetzt{background:rgba(142,230,200,.05)}\n.t-budget thead th.jetzt,.t-budget thead td.jetzt{background:#17232b}\n.t-budget thead th.jetzt{color:var(--accent)}\n\n/* ---- Aktive Zelle: eine, deutlich ---------------------------------- */\ntd.bearbeitbar:focus-within{background:var(--bg);box-shadow:inset 0 0 0 2px var(--accent)}\ntd.bearbeitbar input:focus{outline:none;color:#fff;font-weight:500}\n\n/* ---- Zahlungsweg: nur beim Ueberfahren der Zeile ------------------- */\n.t-budget .namenszelle .weg{opacity:0;transition:opacity .12s}\n.t-budget tr:hover .namenszelle .weg,\n.t-budget tr:focus-within .namenszelle .weg{opacity:1}\n.katkonto{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--muted);margin-left:8px}\n\n/* ---- Fähnchen an der aktiven Zelle -------------------------------- */\n.zellfahne{\n  position:fixed;z-index:140;display:flex;align-items:center;gap:11px;white-space:nowrap;\n  background:#1d2a2f;border:1px solid #2f4a4a;border-radius:7px;padding:6px 11px;\n  box-shadow:0 10px 24px -14px rgba(0,0,0,.95);pointer-events:none;\n}\n.zellfahne b{font-size:11.5px;font-weight:500;color:#fff}\n.zellfahne .mo{font-size:11.5px;color:var(--muted)}\n.zellfahne .num{font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--muted)}\n.zellfahne .taste{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--accent)}\n\n/* ---- Zeilenfarben: an die ZEILE, nicht an die Zellen ----------------\n   Die alte Regel deckte die ersten DREI Zellen mit der Tafelfarbe, weil drei\n   Spalten fixiert waren. In der Budgettafel ist nur noch eine fixiert — Jan\n   und Feb bekamen die Deckfarbe der Namensspalte und die Kategoriezeile\n   wurde zweifarbig. Also: die Zeile traegt die Farbe, die Zellen sind\n   durchsichtig, und die fixierte erste Spalte erbt sie (sie muss deckend\n   bleiben, weil sie beim Rollen ueber die anderen gleitet). */\n.t-budget tbody tr{background:var(--card)}\n.t-budget tbody tr.zeile-kat{background:var(--soft)}\n.t-budget tbody tr.zeile-leerfalt{background:#141a21}\n.t-budget tbody tr.zeile-daten:hover{background:var(--soft)}\ntable.gross.t-budget tbody td:nth-child(n+2){background:transparent}\ntable.gross.t-budget tbody td:nth-child(1){background:inherit}\ntable.gross.t-budget tbody td.jetzt:nth-child(n+2){background:rgba(142,230,200,.05)}\ntable.gross.t-budget tbody tr.zeile-kat td.jetzt:nth-child(n+2){background:rgba(142,230,200,.1)}\ntable.gross.t-budget tbody tr.zeile-daten:hover td.jetzt:nth-child(n+2){background:rgba(142,230,200,.11)}\n\n/* ---- Kennzahlenband: die wichtigste Zahl ist nicht die kleinste ---- */\n.kennzahlen .v{font-size:19px !important}\n.kennzahlen .k{font-size:10.5px;letter-spacing:.12em}\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n\n\n<div class=\"rahmen\" id=\"rahmen\">\n\n<aside class=\"seitenleiste\" id=\"seitenleiste\">\n  <div class=\"seiten-kopf\">\n    <span class=\"marke\">GÄPP<\u002Fspan>\n    <button class=\"falten\" id=\"btnFalten\" aria-label=\"Leiste einklappen\" title=\"Leiste ein- und ausklappen\">«<\u002Fbutton>\n  <\u002Fdiv>\n  <!-- U-23: Die Suche steht in der Seitenleiste, nicht in der Kopfzeile.\n       Drei Gruende, alle drei gegen die Kopfzeile: sie traegt das\n       Kennzahlenband, und zeichne() blendet sie im Dashboard und in der\n       Verwaltung ganz aus — ein Suchfeld, das in zwei von sechs Bereichen\n       verschwindet, ist keines. Sie wird bei jedem zeichne() neu\n       geschrieben, die Leiste dagegen nie: ein halb getippter Suchbegriff\n       ueberlebt hier den Bereichswechsel, den er ausloest. Und sie steht\n       ueber dem Inhalt, waehrend die Suche zu den Wegweisern gehoert —\n       sie fuehrt irgendwohin, sie zeigt nichts an. Der Platz unter der\n       Marke ist der, an dem man sie sucht. -->\n  <div class=\"suchblock\" id=\"suchblock\">\n    <span class=\"ic\" title=\"Suchen\">⌕<\u002Fspan>\n    <input id=\"suchfeld\" type=\"text\" autocomplete=\"off\" spellcheck=\"false\" role=\"combobox\" aria-controls=\"suchliste\" aria-expanded=\"false\" placeholder=\"Suchen\" aria-label=\"Suchen\">\n    <span class=\"taste tx\" id=\"suchTaste\"><\u002Fspan>\n    <div class=\"suchliste\" id=\"suchliste\" role=\"listbox\" aria-label=\"Treffer\" hidden=\"\"><\u002Fdiv>\n  <\u002Fdiv>\n\n  <nav class=\"bereiche\" id=\"bereiche\" aria-label=\"Bereiche\">\n    <button data-bereich=\"dashboard\" title=\"Dashboard\"><span class=\"ic\">◈<\u002Fspan><span class=\"tx\">Dashboard<\u002Fspan><\u002Fbutton>\n    <button data-bereich=\"start\" title=\"Konten\"><span class=\"ic\">◱<\u002Fspan><span class=\"tx\">Konten<\u002Fspan><\u002Fbutton>\n    <button data-bereich=\"budget\" title=\"Budget\"><span class=\"ic\">▤<\u002Fspan><span class=\"tx\">Budget<\u002Fspan><\u002Fbutton>\n    <button data-bereich=\"verbind\" title=\"Verbindlichkeiten\"><span class=\"ic\">▥<\u002Fspan><span class=\"tx\">Verbindlichkeiten<\u002Fspan><\u002Fbutton>\n    <button data-bereich=\"rechnung\" title=\"Rechnungen\"><span class=\"ic\">▧<\u002Fspan><span class=\"tx\">Rechnungen<\u002Fspan><\u002Fbutton>\n  <\u002Fnav>\n\n  <!-- U-9: Der Zeitraum stand als «Monat | Jahr | Alle Jahre» in der Kopfzeile —\n       drei abstrakte Woerter. Hier stehen stattdessen die drei Zeitraeume selbst,\n       ineinander verschachtelt wie eine Lupe, die aufzieht. Man sieht, worauf man\n       schaut, und wo das im Groesseren liegt. Die Pfeile springen in der Stufe,\n       auf der man gerade steht. -->\n  <div class=\"zeitblock\" id=\"zeitblock\">\n    <span class=\"leisten-titel tx\">Zeitraum<\u002Fspan>\n    <div class=\"stufen\" id=\"stufen\" role=\"group\" aria-label=\"Zeitraum\">\n      <button class=\"stufe\" data-z=\"alle\" data-tief=\"0\"><span class=\"ic\">◇<\u002Fspan><span class=\"tx\" id=\"lblAlle\">—<\u002Fspan><\u002Fbutton>\n      <button class=\"stufe\" data-z=\"jahr\" data-tief=\"1\"><span class=\"ic\">◈<\u002Fspan><span class=\"tx\" id=\"lblJahr\">—<\u002Fspan>\n        <span class=\"schritt\"><i data-schritt=\"-1\" title=\"ein Jahr zurück\">‹<\u002Fi><i data-schritt=\"1\" title=\"ein Jahr vor\">›<\u002Fi><\u002Fspan><\u002Fbutton>\n      <button class=\"stufe\" data-z=\"monat\" data-tief=\"2\"><span class=\"ic\">◆<\u002Fspan><span class=\"tx\" id=\"lblMonat\">—<\u002Fspan>\n        <span class=\"schritt\"><i data-schritt=\"-1\" title=\"ein Monat zurück\">‹<\u002Fi><i data-schritt=\"1\" title=\"ein Monat vor\">›<\u002Fi><\u002Fspan><\u002Fbutton>\n    <\u002Fdiv>\n    <div class=\"kalender\" id=\"kalender\" hidden=\"\">\n      <div class=\"jahre\" id=\"jahre\"><\u002Fdiv>\n      <div class=\"monate\" id=\"monate\"><\u002Fdiv>\n      <div class=\"fuss\"><button class=\"knopf klein\" id=\"ganzesJahr\">Ganzes Jahr ansehen<\u002Fbutton><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"seiten-fuss\">\n    <button id=\"btnBericht\" title=\"Bericht\"><span class=\"ic\">▦<\u002Fspan><span class=\"tx\">Bericht<\u002Fspan><\u002Fbutton>\n    <button id=\"btnVerwaltung\" data-bereich=\"verwaltung\" title=\"Verwaltung\"><span class=\"ic\">☰<\u002Fspan><span class=\"tx\">Verwaltung<\u002Fspan><\u002Fbutton>\n    <button id=\"btnHandbuch\" title=\"Wie GÄPP tickt\"><span class=\"ic\">?<\u002Fspan><span class=\"tx\">Wie GÄPP tickt<\u002Fspan><\u002Fbutton>\n    <button id=\"btnSync\" class=\"syncknopf\" title=\"Daten und Sync\">\n      <span class=\"punkt\" id=\"syncPunkt\" data-st=\"off\"><\u002Fspan>\n      <span class=\"tx\" id=\"syncText\">Nicht verbunden<\u002Fspan><\u002Fbutton>\n    <span class=\"motto tx\">Passend | Präzise | Praktisch<\u002Fspan>\n  <\u002Fdiv>\n<\u002Faside>\n\n<div class=\"haupt\">\n<header class=\"kopfzeile\">\n  <div class=\"kopfband\" id=\"kopfband\"><\u002Fdiv>\n  <span class=\"spacer\"><\u002Fspan>\n  <span class=\"kopftitel\" id=\"kopftitel\"><\u002Fspan>\n<\u002Fheader>\n\n<main class=\"inhalt\" id=\"inhalt\" data-modus=\"kacheln\"><\u002Fmain>\n\n<\u002Fdiv>\n<\u002Fdiv>\n\n<!-- U-17: kleiner Dialog, gleiche Formensprache wie das Blatt, aber ohne\n     dessen Maschinerie — er traegt genau eine Frage. -->\n<div class=\"dialog-hg\" id=\"dialogHg\" hidden=\"\">\n  <div class=\"dialog\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"dialogTitel\">\n    <div class=\"dialog-kopf\"><h2 id=\"dialogTitel\"><\u002Fh2><\u002Fdiv>\n    <div class=\"dialog-koerper\" id=\"dialogKoerper\"><\u002Fdiv>\n    <div class=\"dialog-fuss\">\n      <button class=\"knopf\" id=\"btnUeberAus\">Abbrechen<\u002Fbutton>\n      <button class=\"knopf primaer\" id=\"btnUeberTun\">Übertragen<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<div class=\"blatt-hg\" id=\"blattHg\" hidden=\"\">\n  <div class=\"blatt\" id=\"blattRahmen\" role=\"dialog\" aria-modal=\"true\" tabindex=\"-1\" aria-labelledby=\"blattTitel\">\n    <div class=\"blatt-kopf\" id=\"blattKopf\">\n      <span class=\"kennung\" id=\"blattKennung\" hidden=\"\"><\u002Fspan>\n      <h2 id=\"blattTitel\"><\u002Fh2>\n    <\u002Fdiv>\n    <div class=\"reiter\" id=\"blattReiter\" role=\"tablist\" hidden=\"\"><\u002Fdiv>\n    <div class=\"blatt-koerper\" id=\"blattKoerper\"><\u002Fdiv>\n    <div class=\"blatt-fuss\" id=\"blattFuss\"><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<div id=\"druck\"><\u002Fdiv>\n\n<!-- U-20: direktes Kind von <body>. zeichne() schreibt nur #inhalt, #kopfband\n     und .kopfzeile.hidden — ein Knoten auf dieser Ebene liegt ausserhalb des\n     Neuzeichnens und ueberlebt es unberuehrt, ohne dass der Zeichner ihn kennt.\n     Deshalb einmal hier angelegt und danach nur noch Text und hidden. -->\n<div id=\"zurueck\" class=\"zurueckleiste\" role=\"status\" aria-live=\"polite\" hidden=\"\">\n  <span class=\"tx\"><\u002Fspan>\n  <button class=\"knopf klein\" id=\"btnZurueck\">Rückgängig<\u002Fbutton>\n  <button class=\"knopf klein\" id=\"btnZurueckZu\" aria-label=\"Schliessen\">×<\u002Fbutton>\n<\u002Fdiv>\n\n<script id=\"gaeppApp\">\n/* ===================================================================\n   GAEPP — Kern: Zustand, Persistenz, Synchronisation, Rechenregeln.\n   Albrechts privates Haushaltsbuch. Ein Nutzer, eine Datei, eine Wahrheit.\n\n   Die Datendatei liegt im privaten Repo (A-79), diese Datei ist die leere\n   Huelle (A-78): keine Betraege, keine Kontonummern, keine Belege.\n   =================================================================== */\n'use strict';\n\nconst $  = (s, r) => (r || document).querySelector(s);\nconst $$ = (s, r) => Array.from((r || document).querySelectorAll(s));\n\nconst MON       = ['Jan','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'];\nconst MON_LANG  = ['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];\nconst TAGE      = [31,28,31,30,31,30,31,31,30,31,30,31];\nconst SCHLUESSEL_DATEN = 'gaepp.v1';        /* wird nie gehoben (Datenanbindung) */\nconst SCHLUESSEL_GH    = 'gaepp.github';\nconst SCHEMA_APP = 4;                        /* Stand dieser App (A-88). Von 2 auf 3 am 17.08.2026:\n   die Entitaet «rechnungen» traegt seither ein Feld fuer die Verbindlichkeit\n   (F-01). Von 3 auf 4 am 18.08.2026: Zeilen und Kategorien tragen statt\n   `aktiv` ein `ausAb` (U-21) — eine aeltere Fassung wuerde ein ausgeblendetes\n   `ausAb:2029` als sichtbar lesen und das Budget zu hoch ansetzen.\n   Eine aeltere Fassung der App laedt diese Datei nur noch lesend und\n   kann sie nicht ueberschreiben — genau dafuer ist die Nummer da.\n   U-22 hebt sie BEWUSST NICHT auf 5, obwohl zwei Felder dazukommen\n   (`dokumente` bei den Verbindlichkeiten, `periodizitaet` bei den\n   Zeilen). Der Massstab ist nicht «etwas ist neu», sondern «eine\n   aeltere Fassung liest die Zahlen falsch». Beide Felder rechnen\n   nichts: die Dokumente sind Verweise, die Periodizitaet ist eine\n   Beschreibung. Eine aeltere Fassung ueberliest sie und gibt sie beim\n   Speichern unveraendert zurueck — kein Rappen aendert sich. Wer die\n   Nummer bei jedem neuen Feld hebt, sperrt Albrecht aus Gruenden aus,\n   die keine sind, und dann glaubt ihr niemand mehr, wenn es zaehlt. */\nconst DATEI_IM_REPO = 'gaepp-daten.json';\n\n/* ---- Zahlen und Datum, Schweizer Konventionen ------------------------ */\nfunction tageImMonat(j, m) { return (m === 1 && ((j % 4 === 0 && j % 100 !== 0) || j % 400 === 0)) ? 29 : TAGE[m]; }\nfunction fmt(x, stellen) {\n  if (x === null || x === undefined || x === '' || (typeof x === 'number' && !isFinite(x))) return '–';\n  const n = Math.round(Number(x) * 100) / 100;\n  const s = Math.abs(n).toFixed(stellen === undefined ? 2 : stellen);\n  const t = s.split('.');\n  t[0] = t[0].replace(/\\B(?=(\\d{3})+(?!\\d))/g, \"'\");\n  return (n < 0 ? '−' : '') + t.join('.');\n}\n/* Null wird nicht ausgeschrieben — sie ist in einer Tabelle mit sechzig Zeilen nur Laerm. */\nfunction fmt0(x) { return (!x || Math.abs(x) < 0.005) ? '' : fmt(x); }\n/* U-32: In der Budgettafel stehen ganze Franken. Rappen erscheinen nur, wenn\n   der Betrag welche hat — gerundet wird ANGEZEIGT, nie gespeichert. */\nfunction ganzerFranken(x) { const n = Number(x) || 0; return Math.abs(n - Math.round(n)) < 0.005; }\nfunction fmtG(x, stellen) { if (stellen !== undefined) return fmt(x, stellen); return ganzerFranken(x) ? fmt(x, 0) : fmt(x, 2); }\nfunction fmtG0(x) { return (!x || Math.abs(x) < 0.005) ? '' : fmtG(x); }\n/* Der gestellte Tag fuer den Pruefstand. heuteISO() ist die einzige Quelle des\n   heutigen Datums und wird an ueber fuenfzig Stellen gerufen — Stand, Prognose,\n   freies Geld, Faltung, Serien haengen alle daran. Ohne diesen Zweig laesst sich\n   der Rechenkern nicht pruefen, und eine Pruefung mit dem echten Datum wuerde\n   beim naechsten Monatswechsel von selbst rot. Im Normalbetrieb ist der Zweig\n   tot: window.GAEPP_HEUTE wird nur vom Pruefstand gesetzt. */\nfunction heuteISO() { if (window.GAEPP_HEUTE) return window.GAEPP_HEUTE; const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }\nfunction hhmm() { return new Date().toLocaleTimeString('de-CH', { hour:'2-digit', minute:'2-digit' }); }\nfunction iso(j, m, t) { return j + '-' + String(m+1).padStart(2,'0') + '-' + String(t).padStart(2,'0'); }\nfunction ymOf(datum) { return { j: +datum.slice(0,4), m: +datum.slice(5,7) - 1, t: +datum.slice(8,10) }; }\nfunction rd(x) { return Math.round((Number(x) || 0) * 100) / 100; }\nfunction neueId(p) { return p + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2,6); }\n\n/* ---- Fremder Text in HTML (U-22) ------------------------------------\n   Bis hierher stand an jeder Einbaustelle nur .replace(/\"/g,'&quot;').\n   Das genuegt in einem Attribut und nirgends sonst: der Name eines\n   Dokumentlinks kommt aus einem Eingabefeld und stuende sonst als\n   Markup in der Seite. Zwei Funktionen, weil Text und Attribut nicht\n   dasselbe brauchen — und weil eine Funktion, die beides halb macht,\n   an beiden Stellen falsch ist. */\nfunction htmlText(s) {\n  return String(s === null || s === undefined ? '' : s)\n    .replace(/&/g, '&amp;').replace(/<\u002Fg, '&lt;').replace(/>/g, '&gt;');\n}\nfunction htmlAttr(s) { return htmlText(s).replace(/\"/g, '&quot;'); }\n\n/* ---- Zustand -------------------------------------------------------- */\nlet D = null;            /* die Daten — kommen aus dem Repo, nie aus dieser Datei */\nlet S = {                /* der Anzeigezustand — nur localStorage, nie in die Datei */\n  jahr: 2026, monat: 7, zeitraum: 'monat', modus: 'dashboard',\n  reiter: 'budget', zu: [], filterAus: [], filterNur: [], markiert: [], blatt: null,\n  vwSeite: 'struktur', vwZu: [],\n  /* monateAlle faltet die leeren Spalten auf, zeilenAlle die leeren Zeilen (U-23).\n     Zwei Schalter statt einem: waagrecht und senkrecht sind zwei verschiedene\n     Fragen. Wer die Vergangenheit sehen will, will deswegen noch lange nicht\n     dreissig Zeilen mit Nullen sehen — und umgekehrt. */\n  leisteSchmal: false, monateAlle: false, zeilenAlle: false,\n  /* U-25: Beides ist Ansicht und geht deshalb nie in die JSON. vollbild\n     raeumt Seitenleiste und Kopfzeile weg, breiten haelt die gezogenen\n     Spaltenbreiten — je Tabelle getrennt, weil Budget und Verbindlich-\n     keiten verschiedene Vorgaben haben, und nur das, was von der Vorgabe\n     ABWEICHT. Sonst friere eine alte Sitzung die heutigen Vorgabewerte\n     ein, und eine geaenderte Zahl im Stylesheet kaeme nie an. */\n  vollbild: false, breiten: { budget: {}, verbind: {} }\n};\nlet GH = { repo:'', branch:'main', token:'' };\nlet _sig, _sha = null, _pushT = null, _ro = false;\n\n/* ===================================================================\n   Persistenz. Der localStorage nimmt jede Aenderung sofort auf,\n   GitHub bekommt sie verzoegert und gebuendelt. Vorbild PEPAPP.\n   =================================================================== */\nfunction nutzdaten() { return D; }\n\nfunction persist() {\n  if (!D) return;\n  const sig = JSON.stringify(D);\n  try {\n    localStorage.setItem(SCHLUESSEL_DATEN, JSON.stringify({ d: D, s: S }));\n  } catch (err) { /* Speicher voll oder gesperrt — der Push traegt trotzdem */ }\n  if (_sig === undefined) { _sig = sig; return; }\n  if (sig !== _sig) { _sig = sig; schedulePush(); }\n}\n/* Der Anzeigezustand geht in den Speicher, aber NICHT in den Fingerabdruck —\n   sonst pusht die App bei jedem Klick. */\nfunction persistAnsicht() {\n  if (!D) return;\n  try { localStorage.setItem(SCHLUESSEL_DATEN, JSON.stringify({ d: D, s: S })); } catch (err) {}\n}\n\n/* ===================================================================\n   U-20 — Rueckgaengig. Ein Schritt, zwoelf Sekunden.\n   -------------------------------------------------------------------\n   Kein Befehlsstapel, sondern ein Abzug des ganzen Datenstands. persist()\n   legt nach jeder Aenderung _sig ab; zu Beginn der naechsten Aktion haelt\n   _sig also genau den Zustand davor. Merken kostet damit eine Zuweisung\n   statt eines zweiten stringify, und Ausfuehren ist ein JSON.parse von\n   rund einer Millisekunde — das verschwindet neben zeichne(), das\n   schuldenfreiGecacht() ueber mehrere Jahrgaenge laufen laesst.\n\n   Der Austausch von D ist gefahrlos, weil die App alles ueber IDs\n   adressiert: _blatt, _ueber und _ber halten {art, id}, keine Referenz\n   auf ein Unterobjekt von D. Und _sfCache haengt an einer Signatur ueber\n   die Daten, nicht an Objektidentitaet — er invalidiert sich selbst.\n\n   Ein Schritt, kein Stapel: bei einer Datei, die alle 2500 ms nach GitHub\n   geht, waere ein Stapel eine zweite Zeitachse neben der Git-Historie.\n\n   Zwoelf Sekunden, weil innerhalb der ersten 2.5 s der falsche Commit gar\n   nicht erst entsteht — persist() ruft nach der Wiederherstellung\n   schedulePush(), das den laufenden Timer mit clearTimeout abraeumt, und\n   es geht ein einziger Push mit dem richtigen Stand raus. Danach entsteht\n   ein zweiter Commit, der zuruecknimmt. Laenger waere gefaehrlich: ein\n   stilles Rueckgaengig auf eine Aktion von vor zehn Minuten ist bei\n   Geldbetraegen schlimmer als keines.\n   =================================================================== */\nlet _undo = null, _undoT = null;\nconst UNDO_DAUER = 12000;\n\n/* Regel fuer die Einhaengepunkte: merkeStand() ist die erste Anweisung\n   nach der Bestaetigung und VOR jeder Mutation. uebertragenTun() zeigt\n   warum — es ruft budgetSetzen() je Monat, und jedes davon ruft persist();\n   nach dem ersten Monat ist _sig bereits verdorben. */\nfunction merkeStand(text) {\n  if (_ro) return;\n  /* Rueckfall auf ein frisches stringify: _sig ist beim allerersten Mal\n     undefined und wird von ghPull zurueckgesetzt. */\n  _undo = { stand: _sig === undefined ? JSON.stringify(D) : _sig, text };\n  const l = $('#zurueck');\n  if (l) { $('.tx', l).textContent = text; l.hidden = false; }\n  undoUhrStellen();\n}\n/* Merker und Leiste haben dieselbe Lebensdauer. Laeuft die Zeit ab, ist\n   auch _undo weg — sonst taete Strg-Z danach still etwas Falsches statt\n   nichts. */\nfunction undoUhrStellen() {\n  clearTimeout(_undoT);\n  _undoT = setTimeout(rueckgaengigWeg, UNDO_DAUER);\n}\nfunction rueckgaengigTun() {\n  if (_ro || !_undo) return;\n  D = JSON.parse(_undo.stand);\n  /* Offene Masken zeigen auf Daten, die es so nicht mehr gibt: ein halb\n     getippter Entwurf, ein Uebertragungsdialog, ein Blatt zu einer wieder\n     vorhandenen Rechnung. Alles zu, dann steht die Ansicht sauber. */\n  _entwurf = null; _ueber = null; _loesch = null; _jahrLeer = null; _dlgTun = null;\n  _stapel = []; _blatt = null; S.blatt = null;\n  $('#blattHg').hidden = true; $('#dialogHg').hidden = true;\n  persist();\n  rueckgaengigWeg();\n  zeichne();\n}\nfunction rueckgaengigWeg() {\n  clearTimeout(_undoT); _undoT = null; _undo = null;\n  const l = $('#zurueck');\n  if (l) l.hidden = true;\n}\n/* Wer die Leiste liest oder ansteuert, soll nicht abgeschnitten werden:\n   Zeiger und Fokus halten die Uhr an, das Verlassen stellt sie neu. */\n(function () {\n  const l = $('#zurueck');\n  if (!l) return;                    /* fehlt im eingefrorenen Export */\n  const halt = () => clearTimeout(_undoT);\n  const weiter = () => { if (_undo) undoUhrStellen(); };\n  l.addEventListener('mouseenter', halt);\n  l.addEventListener('focusin', halt);\n  l.addEventListener('mouseleave', weiter);\n  l.addEventListener('focusout', weiter);\n})();\n\nfunction ghUrl() { return 'https://api.github.com/repos/' + GH.repo + '/contents/' + DATEI_IM_REPO; }\nfunction ghHead() {\n  return { Authorization: 'Bearer ' + GH.token, Accept: 'application/vnd.github+json',\n           'X-GitHub-Api-Version': '2022-11-28' };\n}\nfunction b64enc(str) {\n  const b = new TextEncoder().encode(str);\n  let out = '';\n  for (let i = 0; i < b.length; i += 0x8000) out += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000));\n  return btoa(out);\n}\nfunction b64dec(b64) {\n  const bin = atob(String(b64 || '').replace(/\\s/g, ''));\n  const u = new Uint8Array(bin.length);\n  for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);\n  return new TextDecoder().decode(u);\n}\nfunction setSync(st, msg) {\n  const p = $('#syncPunkt'), t = $('#syncText');\n  if (p) p.dataset.st = st;\n  if (t) t.textContent = msg;\n}\nfunction schedulePush() {\n  if (_ro) return;                          /* A-88: veraltete App pusht nie */\n  /* Ohne Repo arbeitet GAEPP lokal. Das ist ein Betriebszustand, kein Fehler und\n     kein Abbruch: gespeichert wird trotzdem, nur eben in diesem Browser. */\n  if (!GH.repo || !GH.token) { setSync('lokal', 'Lokal gesichert ' + hhmm()); return; }\n  clearTimeout(_pushT);\n  setSync('busy', 'Ungesicherte Änderung');\n  _pushT = setTimeout(ghPush, 2500);\n}\nasync function ghPush(retry) {\n  if (_ro || !GH.repo || !GH.token) return;\n  clearTimeout(_pushT);\n  setSync('busy', 'Sichert');\n  D.meta.geaendert = new Date().toISOString();\n  const body = {\n    message: 'GAEPP ' + new Date().toISOString().slice(0,16).replace('T',' '),\n    content: b64enc(JSON.stringify(D, null, 1)),\n    branch: GH.branch || 'main'\n  };\n  if (_sha) body.sha = _sha;\n  try {\n    const r = await fetch(ghUrl(), { method:'PUT',\n      headers:{ ...ghHead(), 'Content-Type':'application/json' }, body: JSON.stringify(body) });\n    /* Konflikt: aktuelle SHA holen und genau einmal wiederholen — wie in PEPAPP */\n    if ((r.status === 409 || r.status === 422) && !retry) {\n      const g = await fetch(ghUrl() + '?ref=' + encodeURIComponent(GH.branch || 'main'),\n                            { headers: ghHead(), cache:'no-store' });\n      _sha = g.ok ? (await g.json()).sha : null;\n      return ghPush(true);\n    }\n    if (!r.ok) throw new Error('Fehler ' + r.status);\n    const j = await r.json();\n    _sha = j.content && j.content.sha;\n    setSync('ok', 'Gesichert ' + hhmm());\n  } catch (err) {\n    setSync('err', String(err.message || err));\n  }\n}\nasync function ghPull(still) {\n  if (!GH.repo || !GH.token) return false;\n  setSync('busy', 'Lädt');\n  try {\n    const r = await fetch(ghUrl() + '?ref=' + encodeURIComponent(GH.branch || 'main'),\n                          { headers: ghHead(), cache:'no-store' });\n    if (r.status === 404) { _sha = null; setSync('err', DATEI_IM_REPO + ' fehlt im Repo'); return false; }\n    if (r.status === 401 || r.status === 403) throw new Error('Token abgelehnt');\n    if (!r.ok) throw new Error('Fehler ' + r.status);\n    const j = await r.json();\n    _sha = j.sha;\n    const geladen = JSON.parse(b64dec(j.content));\n    if (!uebernehmen(geladen)) return false;\n    _sig = undefined;\n    setSync('ok', 'Geladen ' + hhmm());\n    if (!still) { zeichne(); tagessicherung({ ohneGeste:true }); }\n    return true;\n  } catch (err) {\n    setSync('err', String(err.message || err));\n    return false;\n  }\n}\n\n/* ---- Datenlisten absichern ------------------------------------------\n   Die App greift an ueber hundert Stellen ohne Rueckfallwert direkt auf\n   D.konten, D.rechnungen und die uebrigen Listen zu. Fehlt eine davon in\n   der geladenen Datei, wirft der erste Zugriff, der Zeichner bricht ab\n   und die Seite bleibt weiss — ohne Meldung, aus der man das schliessen\n   koennte. Eine fehlende Liste ist aber kein Fehler, sondern eine Liste\n   mit null Eintraegen: hier einmal angelegt, statt an 142 Stellen\n   abgefragt. */\nfunction normalisieren(d) {\n  /* Nichts geladen bleibt nichts geladen — sonst stuende statt der leeren\n     Huelle eine Datei ohne Inhalt da, die sich speichern liesse. */\n  if (!d || typeof d !== 'object') return d;\n  ['konten','kategorien','zeilen','buchungen','serien','verbindlichkeiten',\n   'sparziele','rechnungen','steller','stellerGruppen']\n    .forEach(k => { if (!Array.isArray(d[k])) d[k] = []; });\n  if (!d.budget || typeof d.budget !== 'object') d.budget = {};\n  if (!d.meta   || typeof d.meta   !== 'object') d.meta   = {};\n  /* U-22: Dokumentlinks eines Glaeubigers. Fehlt das Feld, entsteht es\n     leer — sonst muesste jede Lesestelle den Fall «gar nicht da» neben\n     dem Fall «leer» mitdenken, und die eine, die es vergisst, wirft. */\n  d.verbindlichkeiten.forEach(v => { if (!Array.isArray(v.dokumente)) v.dokumente = []; });\n  /* U-27: Dasselbe Feld bei den Rechnungen. Eine Rechnung hat ihren Beleg —\n     das ist die Datei im Ordner, die GAEPP selbst abgelegt hat. Daneben\n     gibt es das, was um sie herum liegt: Mahnung, Ratenzusage, Schriftwechsel.\n     Dafuer ist dieses Feld da, und es heisst genau so wie bei den\n     Verbindlichkeiten, weil es dasselbe ist. */\n  d.rechnungen.forEach(r => { if (!Array.isArray(r.dokumente)) r.dokumente = []; });\n  /* U-28: Und dasselbe Feld bei den Konten. Was zu einem Konto gehoert, ist\n     anderer Art als bei einer Schuld — Kontoauszuege, der Bankvertrag, das\n     Merkblatt zur Kontofuehrung —, aber es ist dieselbe Frage: eine Adresse,\n     unter der etwas liegt. Deshalb dasselbe Feld und dasselbe Bauteil statt\n     eines zweiten, das nach einem halben Jahr anders aussieht. */\n  d.konten.forEach(k => { if (!Array.isArray(k.dokumente)) k.dokumente = []; });\n  /* U-31: die Reihenfolge der Glaeubiger innerhalb ihrer Gruppe. `zeilen`\n     tragen `rang` seit je, `verbindlichkeiten` nicht — sie standen in der\n     Reihenfolge da, in der sie in der Datei stehen. Genau die wird hier\n     festgeschrieben: beim ersten Laden aendert sich am Bild kein Pixel,\n     erst der erste Zug vergibt neu. */\n  verbRangFuellen(d);\n  if (d.meta.lohntag       === undefined) d.meta.lohntag       = 25;\n  if (d.meta.waehrung      === undefined) d.meta.waehrung      = 'CHF';\n  if (d.meta.schemaVersion === undefined) d.meta.schemaVersion = SCHEMA_APP;\n  return d;\n}\n/* U-31: Gefuellt wird je Gruppe, in Dateireihenfolge, in Zehnerschritten —\n   und nur, was fehlt. Eine Datei, die schon Raenge traegt, bleibt unberuehrt;\n   ein einzelner Nachzuegler ohne Rang bekommt den seiner Dateistellung und\n   steht damit dort, wo er bisher zu sehen war. Dass er dabei mit einem\n   bestehenden Rang zusammenfallen kann, ist hingenommen: die Ordnung ist\n   dann fuer einen Moment nicht eindeutig, und der erste Zug in dieser\n   Gruppe schreibt ohnehin alle Raenge neu durch.\n   KEINE Schemaerhoehung. Ein zusaetzliches Feld, das eine aeltere Fassung\n   der App schlicht nicht liest, ist kein Grund, ihr die Datei zu sperren —\n   sie zeigt die Glaeubiger dann in Dateireihenfolge, also so wie bisher.\n   Anders als bei U-21, wo `aktiv` VERSCHWAND und eine alte Fassung deshalb\n   ausgeblendete Zeilen wieder eingeblendet haette. */\nfunction verbRangFuellen(d) {\n  const gez = {};\n  (d.verbindlichkeiten || []).forEach(v => {\n    const g = v.gruppe || '';\n    gez[g] = (gez[g] || 0) + 1;\n    if (typeof v.rang !== 'number') v.rang = gez[g] * RANG_SCHRITT;\n  });\n}\n/* ---- U-21: aktiv wird ausAb (Schema 3 → 4) ---------------------------\n   Der alte Zustand `aktiv:false` heisst «seit je aus» und wird zur\n   Sentinel 0; alles andere zu null. Danach faellt `aktiv` weg — zwei\n   Felder fuer dieselbe Frage waeren zwei Wahrheiten, und die zweite\n   veraltet still. Die Migration laeuft auf JEDER geladenen Datei, auch\n   auf einer schon migrierten: sie fuegt nur hinzu, was fehlt, und ist\n   damit gefahrlos wiederholbar.\n   Nach der Migration aendert sich am Bild kein Pixel — genau das ist\n   der Sinn einer Migration. */\nfunction migriere4(d) {\n  [d.zeilen, d.kategorien].forEach(liste => (liste||[]).forEach(o => {\n    if (!('ausAb' in o)) o.ausAb = (o.aktiv === false) ? 0 : null;\n    delete o.aktiv;\n  }));\n}\n/* ---- Schemaversion und Ueberschreibschutz (A-88) --------------------\n   Bei Geldbetraegen ist Verhindern besser als Wiederherstellen. */\nfunction uebernehmen(geladen) {\n  /* Die Version wird VOR dem Auffuellen gelesen: normalisieren traegt eine\n     fehlende schemaVersion als die der App nach, und danach liesse sich eine\n     zu neue Datei nicht mehr von einer alten ohne meta unterscheiden. */\n  const v = (geladen && geladen.meta && geladen.meta.schemaVersion) || 1;\n  geladen = normalisieren(geladen);\n  /* Erst normalisieren, dann migrieren: migriere4 laeuft ueber d.zeilen und\n     d.kategorien, und die legt normalisieren an, falls sie in der Datei\n     fehlen. Umgekehrt wuerde die Migration an einer fehlenden Liste werfen. */\n  if (geladen && typeof geladen === 'object') migriere4(geladen);\n  if (v > SCHEMA_APP) {\n    D = geladen; _ro = true;\n    document.body.classList.add('readonly');\n    kopfmeldung('Diese Datendatei ist neuer als die App (Schema ' + v + ' gegen ' + SCHEMA_APP +\n                '). GÄPP hat sie schreibgeschützt geladen und sichert nichts. Lade die neue Fassung der App.');\n    setSync('err', 'App veraltet — schreibgeschützt');\n    return true;\n  }\n  D = geladen;\n  if (v < SCHEMA_APP) D.meta.schemaVersion = SCHEMA_APP;   /* beim ersten Speichern anheben */\n  _ro = false; document.body.classList.remove('readonly');\n  kopfmeldung(null);\n  return true;\n}\nfunction kopfmeldung(text) {\n  let el = $('#kopfmeldung');\n  if (!text) { if (el) el.remove(); return; }\n  if (!el) {\n    el = document.createElement('div'); el.id = 'kopfmeldung'; el.className = 'kopfmeldung';\n    /* Die Meldung gehoert zwischen Kopfzeile und Inhalt. Sie wurde bisher mit\n       document.body.insertBefore eingehaengt — seit dem Umbau der Seite\n       (body > .rahmen > .haupt > .inhalt) ist .inhalt aber kein Kind von body\n       mehr, und der Aufruf warf NotFoundError. Bemerkt hat es niemand, weil die\n       Meldung nur zuendet, wenn eine Datei mit hoeherer Schemaversion geladen\n       wird — also ausgerechnet dann, wenn die App vor dem Ueberschreiben warnen\n       muesste. Das Elternelement kommt jetzt vom Zielknoten selbst, damit der\n       naechste Umbau sie nicht wieder abwirft. */\n    const ziel = $('.inhalt');\n    if (ziel && ziel.parentNode) ziel.parentNode.insertBefore(el, ziel);\n    else document.body.appendChild(el);\n  }\n  el.textContent = text;\n}\n\n/* ===================================================================\n   Nachschlagen\n   =================================================================== */\nconst konto      = id => D.konten.find(k => k.id === id);\nconst kategorie  = id => D.kategorien.find(k => k.id === id);\nconst zeile      = id => D.zeilen.find(z => z.id === id);\nconst verbind    = id => D.verbindlichkeiten.find(v => v.id === id);\nconst steller    = id => D.steller.find(s => s.id === id);\nconst GRUPPEN    = [{ id:'steuer', name:'Steuerverwaltung' },\n                    { id:'privat', name:'Schulden Privat' },\n                    { id:'firmen', name:'Schulden Firmen' }];\nconst gruppeZeile = { steuer:'verb_steuer', privat:'verb_privat', firmen:'verb_firmen' };\nconst zeileGruppe = { verb_steuer:'steuer', verb_privat:'privat', verb_firmen:'firmen' };\n/* Eine gespiegelte Zeile holt ihre Zahlen von anderswo: die drei Schulden-\n   zeilen aus den Ratenplaenen, «Rechnungen» aus den erfassten Rechnungen.\n   Die Frage wurde an vier Stellen gleich beantwortet; jetzt an einer. */\nfunction gespiegelt(z) { return !!(z && (z.gespiegeltAus || zeileGruppe[z.id])); }\n\n/* ===================================================================\n   Rechenregeln. Nichts davon wird gespeichert (Datenschema, Abschnitt 5).\n   =================================================================== */\n\n/* ---- Rate einer Verbindlichkeit in einem Monat ---------------------- */\nfunction rate(v, j, m) {\n  const r = v.raten && v.raten[String(j)];\n  return r && r.m ? (r.m[m] || 0) : 0;\n}\n/* ---- Gespiegelte Budgetzeile: Summe der Raten einer Gruppe (A-91) ----\n   Monat fuer Monat aus den Ratenplaenen, nie aus dem Soll-Feld. */\nfunction gespiegelteRate(gruppe, j, m) {\n  return rd(D.verbindlichkeiten.reduce((s, v) =>\n    (v.aktiv !== false && v.gruppe === gruppe) ? s + rate(v, j, m) : s, 0));\n}\n/* ---- Gespiegelte Zeile «Rechnungen» (A-92) --------------------------\n   Summe der ungedeckten Rechnungen mit Faelligkeit in diesem Monat.\n   Eine gedeckte Rechnung wird aus dem Rueckstellungstopf bezahlt und\n   stuende sonst zweimal im Budget.\n   Dasselbe gilt seit dem 17.08.2026 fuer eine Rechnung, die an einer\n   Verbindlichkeit haengt (F-01): Ihre Rate steht bereits in der\n   gespiegelten Zeile ihrer Gruppe. Wer sie hier mitzaehlt, zaehlt\n   denselben Franken zweimal. */\nfunction rechnungImBudget(r) {\n  return !r.gedeckt && !r.verbId;\n}\nfunction gespiegelteRechnung(j, m) {\n  return rd(D.rechnungen.reduce((s, r) => {\n    const f = ymOf(r.faelligkeit);\n    return (rechnungImBudget(r) && f.j === j && f.m === m) ? s + r.betrag : s;\n  }, 0));\n}\n/* ---- Monatswert einer Budgetzeile ----------------------------------- */\nfunction zeilenwert(z, j, m) {\n  if (z.gespiegeltAus === 'rechnungen') return gespiegelteRechnung(j, m);\n  if (zeileGruppe[z.id])                return gespiegelteRate(zeileGruppe[z.id], j, m);\n  const b = D.budget[String(j)] && D.budget[String(j)][z.id];\n  return b && b.m ? (b.m[m] || 0) : 0;\n}\nfunction zeilenSoll(z, j) {\n  if (gespiegelt(z)) {\n    /* Soll und Monatswerte einer gespiegelten Zeile folgten verschiedenen Regeln:\n       gespiegelteRate filtert nach aktiv, zeilenSoll filterte nur nach gruppe.\n       Wer einen Glaeubiger ausblendete, sah dieselbe Zeile mit Soll 700 und\n       Monatswerten 0 — zwei Wahrheiten in einer Zeile. Derselbe Filter wie in\n       gespiegelteRate (A-91). */\n    const v = D.verbindlichkeiten.filter(x => x.aktiv !== false && x.gruppe === zeileGruppe[z.id]);\n    /* Ein Glaeubiger ohne Ratenplan hat kein raten-Objekt — x.raten[j] wirft dann,\n       statt null zu liefern. rate() prueft das eine Ebene hoeher (x.raten && …),\n       hier fehlte die Pruefung. */\n    if (v.length) return rd(v.reduce((s,x) => s + (((x.raten && x.raten[String(j)]) || {}).soll || 0), 0));\n    return null;\n  }\n  const b = D.budget[String(j)] && D.budget[String(j)][z.id];\n  return b ? b.soll : 0;\n}\nfunction zeilenJahr(z, j) {\n  let s = 0; for (let m = 0; m < 12; m++) s += zeilenwert(z, j, m);\n  return rd(s);\n}\n/* ===================================================================\n   U-21 — Ausblenden ab einem Stichjahr\n   -------------------------------------------------------------------\n   Frueher trug jede Zeile und jede Kategorie ein einzelnes `aktiv`.\n   Wer eine Zeile ausblendete, weil sie 2029 wegfaellt, loeschte sie\n   damit ruecklaeufig auch aus 2026 — die Vergangenheit wurde nach-\n   traeglich falsch. Jetzt steht dort `ausAb`:\n     null  nie ausgeblendet (Normalfall)\n     2029  ab 2029 unsichtbar, 2028 und frueher zeigen sie weiter\n     0     seit je aus (Migrationswert des alten `aktiv:false`)\n   Die 0 ist die Sentinel, weil `j < 0` fuer jedes reale Jahr falsch\n   ist, ohne dass ein Jahrgang dafuer existieren muesste. Ein Wert wie\n   «erstes Budgetjahr» braeche, sobald jemand ein frueheres anlegt.\n   Der Name liest sich wie die Funktion und buendelt den Versatz um\n   eins an genau einer Stelle: hier.\n\n   ZWEITE REGEL, die hier stehen bleiben muss:\n   Sichtbarkeit steckt NUR in den Auswahlfunktionen (zeilenVon, die\n   Kategorienfilter), NIE in den Wertfunktionen (zeilenwert, zeilenSoll,\n   zeilenJahr, gespiegelteRate). Wer sie in zeilenwert einbaut, bricht\n   uebertragen(), budgetSetzen() und jahrAnlegen() — die muessen auf\n   ausgeblendeten Zeilen weiterarbeiten, sonst laesst sich eine Zeile\n   nie wieder einblenden.\n\n   Konten, Verbindlichkeiten, Steller, Sparziele und Serien bekommen\n   KEIN ausAb: ein Konto ist kein Anzeigeobjekt, sondern ein Saldo.\n   kontosaldo() laeuft vom Anfangsstand ueber alle Buchungen,\n   freiPerMonatsende() summiert alle Konten mit `frei`. «Ab 2027 weg»\n   hiesse entweder, dass sein Guthaben ab 2027 aus dem Vermoegen\n   verschwindet — das waere falsch —, oder dass es unsichtbar\n   weiterzaehlt — dann fehlt eine Zahl in einer Summe, die sich nicht\n   mehr aufschluesseln laesst. Das richtige Modell fuer ein Konto ist\n   ein Abschluss mit Umbuchung des Restsaldos; ein eigenes Vorhaben.\n   =================================================================== */\nfunction jahrSicht(o, j) { return !o || o.ausAb == null || j < o.ausAb; }\nfunction katSicht(k, j)  { return jahrSicht(k, j); }\n/* zeileSicht fragt die Kategorie mit ab, statt deren ausAb in die Zeilen\n   zu kopieren: eine Wahrheit statt zweier, die auseinanderlaufen koennen —\n   und beim Wiedereinblenden einer Kategorie kommen ihre Zeilen von selbst\n   mit. */\nfunction zeileSicht(z, j) { return jahrSicht(z, j) && katSicht(kategorie(z.kategorieId), j); }\n\n/* ---- Kategorie: sichtbare Zeilen in der richtigen Reihenfolge --------\n   Das Jahr ist Pflicht, kein Zusatz: ohne es waere «sichtbar» wieder\n   eine Eigenschaft der Zeile statt eine des Jahres, und genau das war\n   der Fehler. Von hier erben katSumme und saldoBudgetiert das Jahr. */\nfunction zeilenVon(katId, j) {\n  return D.zeilen.filter(z => z.kategorieId === katId && zeileSicht(z, j))\n                 .sort((a,b) => (a.rang||0) - (b.rang||0));\n}\nfunction katSumme(k, j, m) {\n  return rd(zeilenVon(k.id, j).reduce((s,z) => s + zeilenwert(z, j, m) * (z.gegenrichtung ? -1 : 1), 0));\n}\n/* ---- Saldo budgetiert: Einnahmen minus Ausgaben ---------------------- */\nfunction saldoBudgetiert(j, m) {\n  let ein = 0, aus = 0;\n  D.kategorien.filter(k => katSicht(k, j)).forEach(k => {\n    const w = katSumme(k, j, m);\n    if (k.richtung === 'ein') ein += w; else aus += w;\n  });\n  return rd(ein - aus);\n}\nfunction saldoKumuliert(j, m) {\n  let s = 0; for (let i = 0; i <= m; i++) s += saldoBudgetiert(j, i);\n  return rd(s);\n}\n/* ---- Kontosaldo: Anfangsstand plus Buchungen (E-8: Vorschlaege zaehlen nicht) --- */\nfunction kontosaldo(kId, bisJ, bisM) {\n  const k = konto(kId);\n  let s = k.anfangsstand;\n  D.buchungen.forEach(b => {\n    const d = ymOf(b.datum);\n    if (bisJ !== undefined && (d.j > bisJ || (d.j === bisJ && bisM !== undefined && d.m > bisM))) return;\n    if (b.kontoId === kId) {\n      if (b.art === 'einnahme')       s += b.betrag;\n      else if (b.art === 'ausgabe')   s -= b.betrag;\n      else if (b.art === 'umbuchung') s -= b.betrag;\n      else if (b.art === 'korrektur') s += b.betrag * (b.richtung === 'minus' ? -1 : 1);\n    }\n    if (b.art === 'umbuchung' && b.gegenkontoId === kId) s += b.betrag;\n  });\n  return rd(s);\n}\n/* ---- Stand einer Verbindlichkeit (E-14, E-15) ------------------------\n   Anfangsstand, dann Monat fuer Monat: Stand x (1+Zins) + Gebuehr − Rate,\n   dazu Erhoehungen und Minderungen. Zins und Gebuehr fallen am Monatsende\n   an; ist das Anfangsdatum schon der Monatsletzte, ist der Monat\n   abgeschlossen und die Fortschreibung beginnt im Folgemonat. */\nfunction verbindLauf(v, bisJ, bisM, mitPlan) {\n  const a = ymOf(v.anfangsdatum), h = ymOf(heuteISO());\n  let s = v.anfangsstand, j = a.j, m = a.m;\n  const z = v.zinssatz || 0, g = v.gebuehr || 0;\n  if (a.t >= tageImMonat(a.j, a.m)) { m++; if (m === 12) { m = 0; j++; } }\n  while (j < bisJ || (j === bisJ && m <= bisM)) {\n    (v.erhoehungen || []).forEach(e => {\n      const d = ymOf(e.datum);\n      if (d.j === j && d.m === m) s += (e.art === 'minderung' ? -e.betrag : e.betrag);\n    });\n    const gebucht = rd(D.buchungen.reduce((x,b) => {\n      const d = ymOf(b.datum);\n      return (b.verbId === v.id && d.j === j && d.m === m) ? x + b.betrag : x; }, 0));\n    /* Der Stand kennt nur gebuchte Zahlungen. Die Prognose rechnet ab dem laufenden\n       Monat mit den geplanten Raten weiter — was noch nicht passiert ist, ist kein Ist. */\n    /* U-29: Bis hierher zog die Prognose eine geplante Rate NUR ab dem\n       laufenden Monat ab — vergangene Monate zaehlten nur, was gebucht war.\n       Fuer eine App, in der Jahrgaenge nacherfasst werden, ist das falsch:\n       Wer einen Ratenplan fuer Januar bis Juli eintraegt, sieht am\n       Jahresende trotzdem die ungetilgte Schuld und haelt das Werkzeug fuer\n       kaputt. Es war kaputt.\n       Die Prognose rechnet jetzt jeden Monat mit dem Plan. Eine gebuchte\n       Zahlung hat weiter Vorrang — sie steht in der Zeile darunter zuerst,\n       und nur wo keine steht, greift die Rate. Doppelt gezaehlt wird nichts.\n       Der STAND (mitPlan=false) bleibt unberuehrt: er kennt nach wie vor\n       ausschliesslich gebuchte Zahlungen. Ist und Plan bleiben getrennt —\n       die Trennung sitzt jetzt dort, wo sie hingehoert, im Aufrufer. */\n    /* Der Schnitt bei null steht HIER und nur hier, und er gilt nur fuer die\n       geplante Rate. Begruendung, in dieser Reihenfolge geprueft:\n       — Eine gebuchte Ueberzahlung bleibt sichtbar. Sie ist eine Tatsache: der\n         Glaeubiger schuldet dann Geld zurueck. Wer sie abschneidet, luegt ueber\n         gebuchtes Geld. Deshalb kein Schnitt am Ende von verbindLauf und keiner\n         bei den Anzeigern — beide traefen auch das Ist.\n       — Eine geplante Rate, die ueber die Restschuld hinausschiesst, ist keine\n         Tatsache, sondern ein Rechenfehler der Fortschreibung: sie zahlt weiter,\n         wo nichts mehr offen ist. Bezahlt wird hoechstens, was noch aussteht.\n       — Eine Kennzeichnung statt eines Schnitts waere die Antwort, wenn die\n         Ueberzahlung Information traegt. Sie traegt hier keine: der Ratenplan\n         bleibt Monat fuer Monat sichtbar, und wann eine Schuld getilgt ist,\n         sagt schuldenfrei(). Eine negative Schuld im Uebertrag sagt gar nichts.\n       Vorher lief die Prognose ins Minus; schuldenfrei() fing das mit\n       Math.max(0, …) ab, Tabelle und Uebertragsspalte nicht. */\n    /* Auf einer getilgten Schuld faellt nichts mehr an (U-24). Zins und Gebuehr\n       liefen bisher bedingungslos weiter — eine Verbindlichkeit, deren Stand\n       null war, wuchs Monat fuer Monat um die Gebuehr wieder an. Sichtbar wurde\n       das an der leeren Huelle: alle Glaeubiger auf 0.00, und das Dashboard\n       meldete trotzdem einen Rest. In den Echtdaten sank derselbe Glaeubiger\n       bis auf einen Restbetrag und stieg danach wieder, weil sein Ratenplan\n       endete und die Gebuehr weiterlief.\n       Die Grenze ist 0.005 — dieselbe Schwelle, ab der fmt0() etwas anzeigt.\n       Eine gebuchte Ueberzahlung (negativer Stand) wird ebenfalls nicht\n       verzinst: sie ist eine Forderung gegen den Glaeubiger, keine Schuld.\n       Steigt der Stand spaeter durch eine Erhoehung wieder ueber null, greift\n       beides sofort wieder — die Erhoehungen stehen oben in der Schleife. */\n    const roh = s < 0.005 ? s : s * (1 + z/100) + g;\n    const ab = gebucht || (mitPlan ? Math.min(rate(v, j, m), Math.max(0, roh)) : 0);\n    s = rd(roh - ab);\n    m++; if (m === 12) { m = 0; j++; }\n    if (j > bisJ + 60) break;\n  }\n  return rd(s);\n}\n/* Stand: was heute wirklich offen ist (Datenschema, Abschnitt 6). */\nfunction verbindStand(v, bisJ, bisM)    { return verbindLauf(v, bisJ, bisM, false); }\n/* Prognose: derselbe Lauf, ab dem laufenden Monat mit den geplanten Raten. */\nfunction verbindPrognose(v, bisJ, bisM) { return verbindLauf(v, bisJ, bisM, true); }\n/* Stand per heute. Zins und Gebuehr fallen am Monatsende an — am 17. August ist der\n   Augustzins noch nicht angefallen. Deshalb laeuft die Fortschreibung bis Ende des\n   Vormonats; was im laufenden Monat schon gebucht oder erhoeht wurde, kommt danach\n   ohne Zins dazu. Sonst wiese die Kachel eine Schuld aus, die es heute nicht gibt. */\nfunction verbindStandHeute(v) {\n  const h = ymOf(heuteISO());\n  const vm = h.m === 0 ? { j: h.j - 1, m: 11 } : { j: h.j, m: h.m - 1 };\n  let s = verbindStand(v, vm.j, vm.m);\n  (v.erhoehungen || []).forEach(e => {\n    const d = ymOf(e.datum);\n    if (d.j === h.j && d.m === h.m && e.datum <= heuteISO())\n      s += (e.art === 'minderung' ? -e.betrag : e.betrag);\n  });\n  D.buchungen.forEach(b => {\n    const d = ymOf(b.datum);\n    if (b.verbId === v.id && d.j === h.j && d.m === h.m && b.datum <= heuteISO()) s -= b.betrag;\n  });\n  return rd(s);\n}\n/* Der Stand, den eine Ansicht fuer einen Zeitpunkt zeigt: fuer den laufenden\n   Monat der Stand von heute, sonst der am Monatsende. Kachel und Tabelle\n   muessen dieselbe Zahl zeigen. */\nfunction standPer(v, j, m) {\n  const h = ymOf(heuteISO());\n  return (j === h.j && m === h.m) ? verbindStandHeute(v) : verbindStand(v, j, m);\n}\nfunction schuldenSumme(j, m) {\n  return rd(D.verbindlichkeiten.filter(v => v.aktiv !== false)\n            .reduce((s,v) => s + verbindStand(v, j, m), 0));\n}\nfunction schuldenPrognose(j, m) {\n  return rd(D.verbindlichkeiten.filter(v => v.aktiv !== false)\n            .reduce((s,v) => s + verbindPrognose(v, j, m), 0));\n}\n/* Stichtagssumme — die Zahl, gegen die abgenommen wird. */\nfunction schuldenStichtag() {\n  return rd(D.verbindlichkeiten.filter(v => v.aktiv !== false)\n            .reduce((s,v) => s + v.anfangsstand, 0));\n}\n/* ---- Getilgt-Anteil fuer den Balken auf der Kachel ------------------- */\nfunction getilgtAnteil(v) {\n  const jetzt = verbindStandHeute(v);\n  if (!v.anfangsstand) return 0;\n  return Math.max(0, Math.min(1, 1 - jetzt / v.anfangsstand));\n}\n/* ---- Frei per Monatsende (A-82, E-4) --------------------------------\n   Nur der laufende Monat traegt einen Wert. Vergangene und kuenftige\n   Monate zeigen «–» — die Prognoseformel ist mit E-5 entfallen. */\nfunction istLaufenderMonat(j, m) { const h = ymOf(heuteISO()); return j === h.j && m === h.m; }\n/* Eine Rechnung mindert das freie Geld nur, wenn sie auch davon bezahlt wird.\n   Liegt ihr Zahlungskonto woanders — Kreditoren, Rückstellungen, Fixkosten —,\n   ist das Geld dort schon reserviert und war nie Teil des freien Betrags.\n   Dasselbe gilt fuer eine Rechnung mit gesetztem Haken «Rueckstellung». */\nfunction mindertFreies(r, j, m) {\n  const f = ymOf(r.faelligkeit);\n  if (r.status !== 'offen' || r.gedeckt) return false;\n  /* F-01: Eine Glaeubigerrechnung mindert das freie Geld nicht — ihre Rate\n     ist im Budget schon eingeplant und laeuft ueber das Schuldenkonto. */\n  if (r.verbId) return false;\n  if (f.j !== j || f.m !== m) return false;\n  const k = konto(r.kontoId);\n  return !k || !!k.frei;\n}\nfunction offeneAufFreiem(j, m) {\n  return rd(D.rechnungen.reduce((s,r) => mindertFreies(r, j, m) ? s + r.betrag : s, 0));\n}\nfunction freiPerMonatsende(j, m) {\n  if (!istLaufenderMonat(j, m)) return null;\n  const bestand = rd(D.konten.filter(k => k.frei).reduce((s,k) => s + kontosaldo(k.id, j, m), 0));\n  return rd(bestand - offeneAufFreiem(j, m));\n}\n/* ---- Tageszahl (A-11, E-10): bis zum naechsten Lohneingang ----------- */\nfunction tageBisLohn() {\n  const h = ymOf(heuteISO()), lt = D.meta.lohntag || 25;\n  if (h.t < lt) return lt - h.t;\n  return tageImMonat(h.j, h.m) - h.t + lt;\n}\nfunction proTag() {\n  const h = ymOf(heuteISO());\n  const frei = freiPerMonatsende(h.j, h.m);\n  if (frei === null) return null;\n  const t = tageBisLohn();\n  return t > 0 ? rd(frei / t) : null;\n}\n/* ---- Bankabgleich (A-87) -------------------------------------------- */\nfunction letzterBankwert(k) {\n  const l = (k.bankwerte || []).slice().sort((a,b) => a.datum < b.datum ? 1 : -1)[0];\n  return l || null;\n}\n/* ---- Serien: Vorschlaege werden gerechnet, nie gespeichert (E-8) -----\n   Eine Serie reicht nur bis zum heutigen Tag, nie in die Zukunft. */\nfunction vorschlaege(kId, j, m) {\n  const h = ymOf(heuteISO());\n  if (j > h.j || (j === h.j && m > h.m)) return [];\n  const ym = j + '-' + String(m+1).padStart(2,'0');\n  return D.serien.filter(s => {\n    if (s.aktiv === false) return false;\n    if (s.vorlage.kontoId !== kId && s.vorlage.gegenkontoId !== kId) return false;\n    const a = ymOf(s.start);\n    if (j < a.j || (j === a.j && m < a.m)) return false;\n    if (s.ende) { const e = ymOf(s.ende); if (j > e.j || (j === e.j && m > e.m)) return false; }\n    const abstand = (j - a.j) * 12 + (m - a.m);\n    if (s.takt === 'quartalsweise' && abstand % 3) return false;\n    if (s.takt === 'jaehrlich'     && abstand % 12) return false;\n    if ((s.uebersprungen || []).includes(ym)) return false;\n    if (D.buchungen.some(b => b.serieId === s.id && b.datum.slice(0,7) === ym)) return false;\n    return true;\n  }).map(s => ({ serie: s, datum: iso(j, m, Math.min(s.vorlage.tag || 25, tageImMonat(j,m))) }));\n}\n\n/* ===================================================================\n   GAEPP — Ansicht: Kopfzeile, Kacheln, Tabellen.\n   Die Kachel zeigt. Das Blatt arbeitet. (Formensprache C)\n   =================================================================== */\n\n/* ---- Kopfzeile: Zeitwahl ------------------------------------------- */\nfunction zeitTitel() {\n  if (S.zeitraum === 'alle')  return 'Alle Jahre';\n  if (S.zeitraum === 'jahr')  return String(S.jahr);\n  return MON_LANG[S.monat] + ' ' + S.jahr;\n}\nfunction zeichneKopf() {\n  const jahre = Object.keys(D.budget).map(Number).sort();\n  const spanne = jahre.length ? (jahre[0] === jahre[jahre.length-1] ? String(jahre[0])\n                : jahre[0] + '–' + jahre[jahre.length-1]) : '—';\n  $('#lblAlle').textContent  = spanne;\n  $('#lblJahr').textContent  = String(S.jahr);\n  $('#lblMonat').textContent = MON_LANG[S.monat] + ' ' + S.jahr;\n  $$('#stufen .stufe').forEach(b => b.setAttribute('aria-pressed', b.dataset.z === S.zeitraum));\n\n  const bereich = S.modus === 'dashboard'  ? 'dashboard'\n                : S.modus === 'verwaltung' ? 'verwaltung'\n                : S.modus === 'kacheln'    ? 'start' : S.reiter;\n  $$('[data-bereich]').forEach(b => { if (b.closest('.seitenleiste'))\n    b.setAttribute('aria-current', b.dataset.bereich === bereich); });\n  $('#rahmen').classList.toggle('schmal', !!S.leisteSchmal);\n  /* U-25: Das Vollbild gehoert der Tafel, nicht der App. Wer sie verlaesst\n     — ueber die Suche geht das auch ohne Seitenleiste —, bekommt Wegweiser\n     und Kennzahlenband zurueck. Sonst saesse er im Dashboard ohne einen\n     einzigen Ausgang, denn der Schalter steht nur im Tafelkopf. Der\n     Reiterwechsel Budget ↔ Verbindlichkeiten ↔ Rechnungen ist davon nicht\n     betroffen: dort bleibt der Schalter stehen, also bleibt das Vollbild. */\n  if (S.vollbild && S.modus !== 'tabellen') { S.vollbild = false; browserVollbildAus(); }\n  $('#rahmen').classList.toggle('vollbild', !!S.vollbild);\n  const titel = { dashboard:'Dashboard', start:'Konten', budget:'Budget', verwaltung:'Verwaltung',\n                  verbind:'Verbindlichkeiten', rechnung:'Rechnungen' }[bereich] || '';\n  $('#kopftitel').textContent = titel + (S.modus === 'tabellen' ? ' · ' + zeitTitel() : '');\n  kopfbandZeichnen();\n}\n/* Die drei Liquiditaetszahlen begleiten die Tabellenarbeit. Im Dashboard\n   stehen sie gross, in den Kacheln traegt der Sektionskopf die Summe —\n   dort waere das Band eine dritte Wiederholung. */\nfunction kopfbandZeichnen() {\n  const b = $('#kopfband'); if (!b) return;\n  /* U-13: Das Band steht ueberall ausser im Dashboard — dort stehen dieselben\n     Zahlen gross. Zwei Werte traegt es immer, weil sie ueberall gelten:\n     was heute frei ist und was das pro Tag heisst. Der Rest richtet sich\n     nach dem Bereich und zeigt bewusst das, was der Bereich selbst NICHT\n     schon zeigt — sonst steht eine Zahl zweimal auf demselben Bild. */\n  if (!D || S.modus === 'dashboard') { b.innerHTML = ''; return; }\n  const h = ymOf(heuteISO());\n  const w = (k, v, leise) =>\n    `<span class=\"wert${leise ? ' leise' : ''}\"><span class=\"k\">${k}<\u002Fspan><span class=\"v num\">${v}<\u002Fspan><\u002Fspan>`;\n  const teile = [ w('verfügbar', fmt(freiPerMonatsende(h.j, h.m))), w('pro Tag', fmt(proTag())) ];\n  const bereich = S.modus === 'kacheln' ? 'start' : S.reiter;\n\n  if (bereich === 'start' || bereich === 'budget')\n    teile.push(w('bis Dez', fmt(verfuegbarPer(h.j, 11)), true));\n\n  if (bereich === 'budget')\n    teile.push(w('Saldo ' + MON[h.m], fmt(saldoBudgetiert(h.j, h.m)), true));\n\n  if (bereich === 'verbind') {\n    const verb = D.verbindlichkeiten.filter(v => v.aktiv !== false);\n    teile.push(w('Schulden', fmt(rd(verb.reduce((a,v) => a + verbindStandHeute(v), 0))), true));\n    const sf = schuldenfreiGecacht();\n    teile.push(w('schuldenfrei', sf.monate !== null ? MON[sf.monat] + ' ' + sf.jahr : 'Rest ' + fmt(sf.rest), true));\n  }\n  if (bereich === 'rechnung') {\n    const off = D.rechnungen.filter(r => r.status === 'offen').sort((a,b2) => a.faelligkeit < b2.faelligkeit ? -1 : 1);\n    teile.push(w('offen', fmt(rd(off.reduce((a,r) => a + r.betrag, 0))), true));\n    teile.push(w('nächste', off.length ? kurzdatum(off[0].faelligkeit) : '—', true));\n  }\n  b.innerHTML = teile.join('');\n}\n/* schuldenfrei() laeuft ueber bis zu sieben Jahrgaenge mal zehn Glaeubiger.\n   Fuer eine Kopfzeile, die bei jedem Tastendruck neu gezeichnet wird, ist\n   das zu teuer — deshalb einmal je Datenstand rechnen. */\nlet _sfCache = null, _sfSig = null;\nfunction schuldenfreiGecacht() {\n  const sig = JSON.stringify(D.verbindlichkeiten.map(v => [v.id, v.raten, v.anfangsstand, v.aktiv]));\n  if (sig !== _sfSig) { _sfSig = sig; _sfCache = schuldenfrei(); }\n  return _sfCache;\n}\nfunction zeitSchritt(d) {\n  if (S.zeitraum === 'alle') return;\n  if (S.zeitraum === 'jahr') { S.jahr += d; }\n  else {\n    S.monat += d;\n    if (S.monat > 11) { S.monat = 0; S.jahr++; }\n    if (S.monat < 0)  { S.monat = 11; S.jahr--; }\n  }\n  zeichne();\n}\n/* ---- U-30: die Jahrgaenge an einer Stelle ---------------------------\n   Object.keys(D.budget).map(Number).sort() steht ein Dutzend Mal wortgleich\n   im Quelltext. Solange nur jahrAnlegen() daran schrieb, war das harmlos —\n   die Liste wuchs, und jede Stelle bekam es mit. Seit ein Jahrgang auch\n   VERSCHWINDEN kann, ist es die Frage, die man nur einmal beantworten will.\n   Umgestellt sind hier die drei Stellen, an denen ein leeres Budget zu\n   undefined und damit zu NaN wuerde: die Spaltenkoepfe, das Zeitende und\n   der Kalender. Die uebrigen bleiben stehen, weil sie summieren oder\n   filtern — dort ist die leere Liste die richtige Antwort. Wer sie\n   spaeter mitnimmt, aendert nichts, ausser dass es kuerzer wird.\n   .sort() ohne Vergleicher waere hier ein Fehler, der erst 2100 auffiele\n   (Zeichenkettenordnung); der Vergleicher steht deshalb ausdruecklich da. */\nfunction budgetJahre() {\n  return Object.keys(D.budget || {}).map(Number).filter(j => !isNaN(j)).sort((a, b) => a - b);\n}\n/* Der Anzeigezustand ueberlebt die Daten: S liegt im localStorage, D kommt\n   aus GitHub oder aus einer Datei. S.jahr kann deshalb auf einen Jahrgang\n   zeigen, den es nicht (mehr) gibt — nach «Jahrgang löschen», nach einem Pull,\n   nach dem Laden einer anderen Datei. Was dann passierte, war nicht ein Absturz,\n   sondern etwas Schlimmeres: die Budgettabelle zeigte lauter Nullen, und die\n   erste eingetippte Zahl legte den Jahrgang ueber budgetSetzen still WIEDER AN.\n   Ein Jahr, das jemand geloescht hat, kaeme so durch die Hintertuer zurueck.\n   Gefangen wird zum naechstgelegenen vorhandenen Jahrgang: naeher als\n   «immer der erste» und ohne Vorliebe fuer vorwaerts oder rueckwaerts. */\nfunction jahrFangen() {\n  const j = budgetJahre();\n  if (!j.length || j.indexOf(S.jahr) >= 0) return false;\n  S.jahr = j.reduce((a, b) => Math.abs(b - S.jahr) < Math.abs(a - S.jahr) ? b : a);\n  return true;\n}\nfunction zeichneKalender() {\n  const jahre = budgetJahre();\n  $('#jahre').innerHTML = jahre.map(j =>\n    `<button data-j=\"${j}\" aria-pressed=\"${j===S.jahr}\">${j}<\u002Fbutton>`).join('');\n  $('#monate').innerHTML = MON.map((n,i) =>\n    `<button data-m=\"${i}\" aria-pressed=\"${i===S.monat && S.zeitraum==='monat'}\">${n}<\u002Fbutton>`).join('');\n}\n\n/* ===================================================================\n   Kachelansicht\n   =================================================================== */\nfunction kachelHtml(o) {\n  const balken = o.anteil === undefined ? '' :\n    `<div class=\"balken\"><div style=\"width:${Math.round(o.anteil*100)}%\"><\u002Fdiv><\u002Fdiv>`;\n  const etikett = o.ueberzogen ? '<span class=\"etikett\">überzogen<\u002Fspan>' : '';\n  return `<article class=\"karte kachel\" data-oeffne=\"${o.art}:${o.id}\">\n    <div>\n      <span class=\"kennung\">${o.kennung}<\u002Fspan>\n      <button class=\"name\" type=\"button\">${o.name}<\u002Fbutton>\n      <div class=\"rolle\">${o.rolle || ''}<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"mitte\">\n      <span class=\"wert\"><span class=\"k\">${o.label}<\u002Fspan>\n        <span class=\"v gross ${o.wert < 0 ? 'neg' : ''}\">${fmt(o.wert)}<\u002Fspan>${etikett}<\u002Fspan>\n      ${balken}\n    <\u002Fdiv>\n    <div class=\"fuss\">\n      <span class=\"meta\">${o.meta || ''}<\u002Fspan>\n      <button class=\"knopf klein\" type=\"button\" data-tat=\"${o.tat || (o.art + ':' + o.id)}\">${o.knopf}<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Farticle>`;\n}\nfunction zeitEnde() {\n  if (S.zeitraum === 'monat') return { j: S.jahr, m: S.monat };\n  if (S.zeitraum === 'jahr')  return { j: S.jahr, m: 11 };\n  const jahre = budgetJahre();\n  /* U-30: Ohne den Rueckfall liefert «Alle Jahre» bei leerem Budget undefined,\n     und daraus wird in kontosaldo() und verbindLauf() ein NaN, das durch jede\n     Kachel wandert. Ein Budget ohne Jahrgaenge ist kein Sonderfall mehr,\n     seit man den letzten loeschen kann. */\n  return { j: jahre.length ? jahre[jahre.length-1] : S.jahr, m: 11 };\n}\n/* ===================================================================\n   DASHBOARD (U-5)\n   -------------------------------------------------------------------\n   Kein zweiter Kachelteppich, sondern die Fragen, die man an einem\n   Werktag stellt: Wie viel habe ich, was schulde ich, was liegt an.\n   Jede Zahl fuehrt per Klick dorthin, wo sie herkommt — das Dashboard\n   rechnet nichts Eigenes und haelt keine zweite Wahrheit.\n   =================================================================== */\nfunction kpiHtml(o) {\n  const balken = o.anteil === undefined ? '' :\n    `<div class=\"balken\"><div style=\"width:${Math.round(Math.max(0,Math.min(1,o.anteil))*100)}%\"><\u002Fdiv><\u002Fdiv>`;\n  return `<article class=\"karte kachel kpi\" data-bereich=\"${o.bereich}\">\n    <div><span class=\"kennung\">${o.kennung}<\u002Fspan>\n      <button class=\"name\" type=\"button\">${o.name}<\u002Fbutton><\u002Fdiv>\n    <div class=\"mitte\">\n      <span class=\"wert\"><span class=\"v gross ${o.wert < 0 ? 'neg' : ''}\">${fmt(o.wert)}<\u002Fspan><\u002Fspan>\n      ${balken}<\u002Fdiv>\n    <div class=\"fuss\"><span class=\"meta\">${o.meta || ''}<\u002Fspan><span class=\"pfeil\">›<\u002Fspan><\u002Fdiv>\n  <\u002Farticle>`;\n}\nfunction zeichneDashboard() {\n  const h = ymOf(heuteISO());\n  const frei = freiPerMonatsende(h.j, h.m), pt = proTag(), tage = tageBisLohn();\n  const hhk  = D.konten.filter(k => k.frei);\n  const zyklus = tageImMonat(h.j, h.m);\n  const verb = D.verbindlichkeiten.filter(v => v.aktiv !== false);\n  const schuld = rd(verb.reduce((s,v) => s + verbindStandHeute(v), 0));\n  const offen  = D.rechnungen.filter(r => r.status === 'offen')\n                   .sort((a,b) => a.faelligkeit < b.faelligkeit ? -1 : 1);\n  const offenS = rd(offen.reduce((s,r) => s + r.betrag, 0));\n\n  const nm = h.m === 11 ? { j: h.j + 1, m: 0 } : { j: h.j, m: h.m + 1 };\n  const naechst = verfuegbarPer(nm.j, nm.m);\n  const jahresE = verfuegbarPer(h.j, 11);\n  const restMon = 11 - h.m;\n  const frei0   = frei === null ? 0 : frei;\n  const schnitt = restMon > 0 && jahresE !== null ? rd((jahresE - frei0) / restMon) : null;\n  const sf = schuldenfrei();\n\n  const zahl = (w, kl) => `<span class=\"v gross ${kl||''} ${w < 0 ? 'neg' : ''}\">${fmt(w)}<\u002Fspan>`;\n\n  $('#inhalt').innerHTML = `\n  <div class=\"dash-oben\">\n\n    <article class=\"karte kpi hero\" data-bereich=\"budget\">\n      <span class=\"kennung\">Verfügbar<\u002Fspan>\n      <div class=\"hero-zahl\">\n        <span class=\"v riesig\">${fmt(pt)}<\u002Fspan>\n        <span class=\"hero-zu\">pro Tag<br><b>${tage}<\u002Fb> Tage bis zum ${D.meta.lohntag}.<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"zyklus\" title=\"${zyklus - tage} von ${zyklus} Tagen des Lohnmonats vorbei\">\n        <div style=\"width:${Math.round((zyklus - tage) / zyklus * 100)}%\"><\u002Fdiv><\u002Fdiv>\n      <div class=\"hero-fuss\">\n        <span><span class=\"k\">Total diesen Monat<\u002Fspan><span class=\"num gross2\">${fmt(frei)}<\u002Fspan><\u002Fspan>\n        <span><span class=\"k\">Schulden heute<\u002Fspan><span class=\"num gross2\">${fmt(schuld)}<\u002Fspan><\u002Fspan>\n      <\u002Fdiv>\n    <\u002Farticle>\n\n    <article class=\"karte rechenweg\">\n      <span class=\"kennung\">So kommt die Zahl zustande<\u002Fspan>\n      <div class=\"rechnung\">\n        ${hhk.map(k => `<div class=\"zeile\"><span>${k.name}<\u002Fspan><span class=\"num\">${fmt(kontosaldo(k.id,h.j,h.m))}<\u002Fspan><\u002Fdiv>`).join('')}\n        <div class=\"zeile\"><span>./. offene Rechnungen ab freiem Konto<\u002Fspan><span class=\"num\">${fmt(offeneAufFreiem(h.j, h.m))}<\u002Fspan><\u002Fdiv>\n        <div class=\"zeile ergebnis\"><span>verfügbar<\u002Fspan><span class=\"num\">${fmt(frei)}<\u002Fspan><\u002Fdiv>\n        <div class=\"zeile teiler\"><span>geteilt durch ${tage} Tage<\u002Fspan><span class=\"num\">${fmt(pt)}<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Farticle>\n\n  <\u002Fdiv>\n\n  <div class=\"sektion\"><h2>Wie es weitergeht<\u002Fh2>\n    <div class=\"raster\">\n      ${kpiHtml({ bereich:'budget', kennung:'Ende ' + MON_LANG[nm.m], name:'Verfügbar nächster Monat',\n        wert: naechst, meta: 'Budget ' + MON_LANG[nm.m] + ' ' + (saldoBudgetiert(nm.j, nm.m) >= 0 ? '+' : '') + fmt(saldoBudgetiert(nm.j, nm.m)) })}\n      ${kpiHtml({ bereich:'budget', kennung:'Ende Dezember ' + h.j, name:'Verfügbar bis Jahresende',\n        wert: jahresE, meta: schnitt === null ? '—' : 'im Schnitt ' + (schnitt >= 0 ? '+' : '') + fmt(schnitt) + ' pro Monat · ' + restMon + ' Monate' })}\n      ${schuldkachelHtml(sf, verb, schuld)}\n      ${kpiHtml({ bereich:'rechnung', kennung:'Rechnungen', name:'Offen', wert: offenS,\n        meta: offen.length ? offen.length + (offen.length===1?' Rechnung · fällig ':' Rechnungen · nächste ')\n              + kurzdatum(offen[0].faelligkeit) : 'nichts offen' })}\n    <\u002Fdiv><\u002Fdiv>\n\n  ${fristenHtml(verb)}`;\n}\n\n/* Die Schuldenkachel traegt zwei Dinge, die sonst nirgends stehen: wann\n   Schluss ist — und, wenn es kein Schluss wird, warum nicht. Dazu der\n   Verlauf als Linie, damit die Richtung sichtbar ist und nicht nur der Stand. */\nfunction schuldkachelHtml(sf, verb, schuld) {\n  const jahre = Object.keys(D.budget).map(Number).sort();\n  const werte = jahre.map(j => rd(verb.reduce((a,v) => a + Math.max(0, verbindPrognose(v, j, 11)), 0)));\n  const linie = sparkHtml([schuld].concat(werte));\n  if (sf.monate !== null) {\n    const jahreT = Math.floor(sf.monate / 12), monT = sf.monate % 12;\n    const dauer = (jahreT ? jahreT + (jahreT === 1 ? ' Jahr ' : ' Jahre ') : '') + (monT ? monT + ' Mt.' : '');\n    return `<article class=\"karte kachel kpi\" data-bereich=\"verbind\">\n      <div><span class=\"kennung\">Schuldenfrei<\u002Fspan>\n        <button class=\"name\" type=\"button\">${MON_LANG[sf.monat]} ${sf.jahr}<\u002Fbutton><\u002Fdiv>\n      <div class=\"mitte\"><span class=\"wert\"><span class=\"v gross\">${dauer || 'jetzt'}<\u002Fspan><\u002Fspan>${linie}<\u002Fdiv>\n      <div class=\"fuss\"><span class=\"meta\">wenn die erfassten Raten so laufen<\u002Fspan><span class=\"pfeil\">›<\u002Fspan><\u002Fdiv>\n    <\u002Farticle>`;\n  }\n  return `<article class=\"karte kachel kpi warnung\" data-bereich=\"verbind\">\n    <div><span class=\"kennung\">Schuldenfrei<\u002Fspan>\n      <button class=\"name\" type=\"button\">nicht bis ${sf.bis}<\u002Fbutton><\u002Fdiv>\n    <div class=\"mitte\"><span class=\"wert\"><span class=\"v gross off\">${fmt(sf.rest)}<\u002Fspan><\u002Fspan>${linie}<\u002Fdiv>\n    <div class=\"fuss\"><span class=\"meta\">Rest Ende ${sf.bis} · Raten enden vorher<\u002Fspan><span class=\"pfeil\">›<\u002Fspan><\u002Fdiv>\n  <\u002Farticle>`;\n}\n\n/* Eine Linie ohne Achsen. Sie beantwortet eine Frage: geht es runter? */\nfunction sparkHtml(werte) {\n  const w = 210, hh = 34, max = Math.max(...werte, 1), min = 0;\n  const pkt = werte.map((v,i) => {\n    const x = werte.length < 2 ? 0 : (i / (werte.length - 1)) * w;\n    const y = hh - ((v - min) / (max - min || 1)) * hh;\n    return x.toFixed(1) + ',' + y.toFixed(1);\n  });\n  return `<svg class=\"spark\" viewBox=\"0 0 ${w} ${hh}\" preserveAspectRatio=\"none\" aria-hidden=\"true\">\n    <polyline points=\"${pkt.join(' ')}\"/>\n    <circle cx=\"${pkt[pkt.length-1].split(',
