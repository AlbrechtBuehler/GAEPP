<body>
<!-- Das Rollfeld: Wortmarke und Kennzahlenband rollen mit dem Blatt weg;
     nur die Zeile mit Jahrgang und Ansicht bleibt oben stehen. Ohne das
     stuenden auf einem Schirm von 900 px vier Kopfbausteine uebereinander und
     es blieben elf Datenzeilen uebrig — der vierte, der Blatttitel, ist am
     selben Tag ganz gestrichen worden. -->
<div id="rollfeld">
<div class="kopf" id="leiste"></div>
<div id="band"></div>
<div class="druckkopf" id="druckkopf"></div>
<div class="blatt" id="blatt"></div>
</div>
<div class="druckfuss" id="druckfuss"></div>
<div class="fusszeile" id="fusszeile"></div>
<div id="dialoge"></div>
<script>
"use strict";
/* ==========================================================================
   GÄPP — Tabellenwerkzeug
   Zwei Tabellen je Jahr (Budget, Rechnungen) und eine Jahresübersicht.
   Alles gerechnet, nichts abgeschrieben. Keine Kommastellen.
   Die Daten stehen NICHT in dieser Datei — sie kommen aus gaepp-daten.json,
   aus dem Browserspeicher oder aus dem privaten Repo.
   ========================================================================== */

/* Die Version steht genau hier. Fusszeile, Handbuch, HTML-Export und CSV lesen sie —
   abgeschrieben wird sie nirgends. */
const VERSION = '3.0.0';
const RUNDE = 10;   /* Verteilen rundet auf volle Zehner, immer aufwaerts. */

const MK = ['Jan','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'];
/* Die Monate heissen 01 bis 12 — im Blatt, im Export und im CSV. MK bleibt fuer
   Saetze, in denen ein Monat ausgeschrieben gehoert (das Kennzahlenband). */
const MZ = ['01','02','03','04','05','06','07','08','09','10','11','12'];
const ML = ['Januar','Februar','März','April','Mai','Juni','Juli','August',
            'September','Oktober','November','Dezember'];
const STAENDE = ['Offen','Bank','Bezahlt','Nicht eingetroffen'];
const N12 = () => new Array(12).fill(0);

let ZAEHLER = 0;
const neueId = () => 'p' + (++ZAEHLER);
const slug = s => String(s).toLowerCase().replace(/[^a-z0-9]+/g, '');
const esc = s => String(s == null ? '' : s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

/* ---------------------------------------------------------------- Zustand */
const S = {
  jahr: null, ansicht: 'budget', alleWas: 'budget', nullen: false,
  auf: [], haken: {}, jahre: [], daten: {}, rechnungen: {},
  neu: null, ueb: null, exp: null, wegJahr: null, zieht: null, ziel: null,
  korr: null, korrWarn: null, basis: null, hb: false,
  stichmonat: '2026-08', sync: 'nicht verbunden', syncText: '',
  geladen: false, mobil: false, mMonat: null, trennFrage: false
};

/* Anzeigezustand (auf, nullen, theme, jahr, ansicht) geht nie in die Datendatei. */
function nutzdaten() {
  return {
    schemaVersion: 1,
    meta: { waehrung:'CHF', stichmonat:S.stichmonat, geaendert:new Date().toISOString() },
    jahre: S.jahre.slice().sort((a,b) => a-b),
    daten: S.daten, rechnungen: S.rechnungen, haken: S.haken
  };
}
/* Eine Datei aus fremder Hand darf die Anzeige nicht zum Absturz bringen. Alles,
   was gerechnet oder gezeichnet wird, kommt hier in eine brauchbare Form: zwoelf
   Monatswerte, Ganzzahlen, Zeichenketten. Was nicht zu retten ist, wird zu null. */
const zw12 = r => { const a = Array.isArray(r) ? r.slice(0,12) : [];
  while (a.length < 12) a.push(0);
  return a.map(x => { const n = Number(x); return isFinite(n) ? Math.round(n) : 0; }); };
const zGanz = x => { const n = Number(x); return isFinite(n) ? Math.round(n) : 0; };
const zText = x => (x == null ? '' : String(x));

function uebernimm(d) {
  if (!d || typeof d !== 'object') throw new Error('Keine gültige Datei.');
  if (!d.daten || !d.jahre) throw new Error('Der Datei fehlen «jahre» oder «daten».');
  S.jahre = (Array.isArray(d.jahre) ? d.jahre : []).map(Number)
    .filter(x => isFinite(x)).sort((a,b) => a-b);
  if (!S.jahre.length) throw new Error('Die Datei führt keinen einzigen Jahrgang.');
  S.daten = d.daten;
  S.rechnungen = d.rechnungen || {};
  S.haken = d.haken || {};
  let ersatz = 0;
  const heilePos = p => { p.reihe = zw12(p.reihe); p.basis = zGanz(p.basis);
    p.name = zText(p.name); p.key = zText(p.key) || ('ohne' + (++ersatz)); };
  S.jahre.forEach(j => {
    if (!Array.isArray(S.daten[j])) S.daten[j] = [];
    S.daten[j].forEach(b => {
      b.name = zText(b.name); b.key = zText(b.key);
      if (b.art === 'schulden') { if (!Array.isArray(b.gruppen)) b.gruppen = [];
        b.gruppen.forEach(g => { g.name = zText(g.name); g.key = zText(g.key);
          if (!Array.isArray(g.pos)) g.pos = []; g.pos.forEach(heilePos); }); }
      else { if (!Array.isArray(b.pos)) b.pos = []; b.pos.forEach(heilePos); }
    });
    if (!Array.isArray(S.rechnungen[j])) S.rechnungen[j] = [];
    S.rechnungen[j].forEach(g => { g.name = zText(g.name);
      if (!Array.isArray(g.rechnungen)) g.rechnungen = [];
      g.rechnungen.forEach(r => { r.reihe = zw12(r.reihe); r.betrag = zGanz(r.betrag);
        r.zweck = zText(r.zweck); r.datum = zText(r.datum);
        if (STAENDE.indexOf(r.stand) < 0) r.stand = STAENDE[0]; }); });
  });
  if (d.meta && d.meta.stichmonat) S.stichmonat = d.meta.stichmonat;
  /* Zähler über alle vergebenen Ids heben, damit neue Ids nie kollidieren. */
  let hoch = 0;
  const merke = id => { const m = /^p(\d+)$/.exec(String(id||'')); if (m) hoch = Math.max(hoch, +m[1]); };
  S.jahre.forEach(j => (S.daten[j]||[]).forEach(b => { merke(b.id);
    if (b.art === 'schulden') (b.gruppen||[]).forEach(g => { merke(g.id); (g.pos||[]).forEach(p => merke(p.id)); });
    else (b.pos||[]).forEach(p => merke(p.id)); }));
  S.jahre.forEach(j => (S.rechnungen[j]||[]).forEach(g => { merke(g.id);
    (g.rechnungen||[]).forEach(r => merke(r.id)); }));
  ZAEHLER = Math.max(ZAEHLER, hoch);
  if (!S.jahr || S.jahre.indexOf(S.jahr) < 0) {
    const hj = parseInt(S.stichmonat.slice(0,4), 10);
    S.jahr = S.jahre.indexOf(hj) >= 0 ? hj : (S.jahre[S.jahre.length - 1] || null);
  }
  S.geladen = true;
}

/* ------------------------------------------------------------- Formatieren */
/* Symmetrisch runden: minus zwei Komma fuenf wird minus drei, nicht minus zwei.
   Math.round rundet bei einer halben Einheit zur Null hin und behandelt Plus und
   Minus dadurch verschieden. */
const runde = n => (n < 0 ? -1 : 1) * Math.round(Math.abs(n));
function fmt(n, immer) {
  const r = runde(n || 0);
  if (r === 0 && !S.nullen && !immer) return '';
  return (r < 0 ? '−' : '') + String(Math.abs(r)).replace(/\B(?=(\d{3})+(?!\d))/g, "'");
}
function zahl(v) {
  let s = String(v == null ? '' : v).replace(/[\s'’]/g,'').replace(/−/g,'-');
  s = s.replace(/[^0-9.,-]/g,'');
  /* Steht ein Komma da, ist es der Dezimaltrenner und der Punkt trennt Tausender:
     «1.234,50» ist eintausendzweihundertvierunddreissig Franken fuenfzig. */
  if (s.indexOf(',') >= 0) s = s.replace(/\./g,'').replace(',','.');
  /* Mehr als ein Punkt kann nur eine Tausendertrennung sein: «1.234.567». */
  else if ((s.match(/\./g) || []).length > 1) s = s.replace(/\./g,'');
  const n = parseFloat(s);
  return isNaN(n) ? 0 : runde(n);
}
const su = r => (r || []).reduce((s,x) => s + (x||0), 0);
/* Raten koennen eine Schuld auf null tilgen, aber nicht ins Minus. Eine Basis,
   die schon im Minus steht, bleibt dort — sie ist ein Befund, und eine Rate darf
   einen Befund nicht wegrechnen. */
const nachRaten = (basis, raten) => {
  if (raten < 0) return basis - raten;            /* negative Rate: die Schuld waechst */
  return basis <= 0 ? basis : Math.max(0, basis - raten);
};
const jahre = () => S.jahre.slice().sort((a,b) => a-b);
const vorjahr = j => { const k = S.jahre.filter(x => x < j); return k.length ? Math.max.apply(null,k) : null; };
const offen = id => S.auf.indexOf(id) >= 0;
const hakenAn = (pid,m) => !!S.haken[pid + ':' + m];
/* Rechnungen tragen ihre Monatshaken im selben Vorrat wie das Budget. Eine ganz
   als «Bezahlt» gemeldete Rechnung gilt in jedem ihrer Monate als abgehakt. */
const monatBezahlt = (r,m) => r.stand === 'Bezahlt' || hakenAn(r.id, m);
const stellerGruen = (g,m) => {
  const mit = (g.rechnungen||[]).filter(r => ((r.reihe||[])[m]||0) !== 0);
  return mit.length > 0 && mit.every(r => monatBezahlt(r,m));
};
/* Alle Monate mit einem Wert abgehakt? Dann ist die Rechnung bezahlt. */
const rechnungRund = r => {
  const mit = (r.reihe||[]).map((v,m) => ({v,m})).filter(x => x.v !== 0);
  return mit.length > 0 && mit.every(x => hakenAn(r.id, x.m));
};
const schuldBlock = j => (S.daten[j] || []).find(b => b.art === 'schulden');
/* Bis 2.0.0 schlug das Basis-Fenster bei Rueckstellungen «verteilen» vor und
   sonst «uebertragen». Das Fenster kennt seit dem Umbau drei benannte Wege mit
   Vorschau und braucht diesen Vorschlag nicht mehr — das Feld «verteilen»
   entsteht in bau() also, ohne dass es jemand liest. bau() gehoert zu den
   Stellen, die nicht angefasst werden; die Zeile bleibt darum stehen, bis
   Albrecht sie streichen laesst. */
const istRueckstellung = b => /r(ue|ü|u)ckstell/i.test(String(b && b.key || '') + ' ' + String(b && b.name || ''));
/* Verteilen: Betrag durch zwoelf, auf volle Zehner AUFgerundet. Nie abrunden. */
const proMonat = betrag => Math.ceil(Math.abs(betrag) / 12 / RUNDE) * RUNDE * (betrag < 0 ? -1 : 1);
/* Rechnungssteller stehen immer alphabetisch — Ansicht, Druck und Export gleich. */
const steller = j => (S.rechnungen[j] || []).slice().sort((a,b) =>
  String(a.name||'').localeCompare(String(b.name||''), 'de-CH', { sensitivity:'base', numeric:true }));

/* ---- Manuelle Korrekturen an Schuldsalden ---------------------------------
   p.korr = { basis: [{id,betrag,notiz}], rest: [{id,betrag,notiz}] }
   betrag positiv = Saldo erhoehen, negativ = Saldo reduzieren.

     basis(J) = (geerbt ? rest(J-1) : eigener Anfangsstand) + Summe korr.basis(J)
     rest(J)  = max(0, basis(J) - Summe Raten(J))          + Summe korr.rest(J)

   Damit ist die Fortschreibung ins Folgejahr keine Aktion, sondern die Rechnung
   selbst — wie eine Verknuepfung im Excel. Nichts wird von Hand ausgeloest. */
const korrListe = (p, art) => ((p && p.korr && p.korr[art]) || []);
const korrSum = (p, art) => korrListe(p, art).reduce((s,x) => s + (x.betrag||0), 0);
const hatKorr = p => korrListe(p,'basis').length > 0 || korrListe(p,'rest').length > 0;

function posVon(j, gKey, pKey) {
  const blk = schuldBlock(j); if (!blk) return null;
  const g = (blk.gruppen||[]).find(x => x.key === gKey); if (!g) return null;
  return (g.pos||[]).find(x => x.key === pKey) || null;
}

/* Anfangsstand = Rest des Vorjahrs. Ändert sich eine Rate 2026, wandert der
   neue Rest von selbst in 2027 und weiter. Rekursiv bis zum ersten Jahrgang. */
function basisVon(j, gKey, pKey, eigen) {
  const kb = korrSum(posVon(j, gKey, pKey), 'basis');
  /* Die Raten klemmen bei null — mehr als die Schuld kann keine Rate tilgen.
     Eine Korrektur klemmt NICHT: Wer mehr wegnimmt, als da ist, soll das sehen.
     Ein Plan, der nicht aufgeht, ist ein Befund und keine Aufgabe fuer den
     Taschenrechner — und sonst zeigten Rest und Basis des Folgejahrs zwei
     verschiedene Zahlen fuer dieselbe Sache. */
  const selbst = () => (eigen || 0) + kb;
  const v = vorjahr(j);
  if (v === null) return selbst();
  const vp = posVon(v, gKey, pKey);
  if (!vp) return selbst();
  const vorBasis = basisVon(v, gKey, pKey, vp.basis);
  /* Ein Jahrgang, der die Schuld nur dem Namen nach fuehrt — kein Anfangsstand,
     keine Rate, keine Korrektur — traegt nichts bei und ist durchlaessig. Sonst
     wuerde ein leeres Geruest den Anfangsstand des Folgejahrs auf null ziehen. */
  if (vorBasis === 0 && su(vp.reihe) === 0 && korrSum(vp,'rest') === 0) return selbst();
  return nachRaten(vorBasis, su(vp.reihe)) + korrSum(vp,'rest') + kb;
}

/* Der Rest am 31.12. — dieselbe Zahl, die im Folgejahr die Basis ist.
   Derselbe Rechenweg wie oben, damit die beiden nie auseinanderlaufen. */
function restVon(j, gKey, pKey) {
  const p = posVon(j, gKey, pKey); if (!p) return 0;
  return nachRaten(basisVon(j, gKey, pKey, p.basis), su(p.reihe)) + korrSum(p,'rest');
}

/* Traegt das direkte Vorjahr dieselbe Schuld? Dann ist die Basis geerbt und
   nicht tippbar — der Anfangsstand ist der Rest des Vorjahrs, keine Wahl. */
function basisGeerbt(j, gKey, pKey) {
  const v = vorjahr(j); if (v === null) return false;
  const vp = posVon(v, gKey, pKey); if (!vp) return false;
  return basisVon(v, gKey, pKey, vp.basis) !== 0 || su(vp.reihe) !== 0 || korrSum(vp,'rest') !== 0;
}

/* Spaetere Jahrgaenge, die fuer dieselbe Schuld eine eigene Korrektur am
   Anfangssaldo tragen — der Grund fuer die Warnung beim Fortschreiben. */
function folgeKorrekturen(j, gKey, pKey) {
  return jahre().filter(x => x > j).map(x => {
    const p = posVon(x, gKey, pKey);
    if (!p || !korrListe(p,'basis').length) return null;
    return { jahr:x, betrag:korrSum(p,'basis'),
      notizen: korrListe(p,'basis').map(k => k.notiz).filter(Boolean) };
  }).filter(Boolean);
}

/* ------------------------------------------------- Zeilen eines Jahrgangs */
function bau(jahr, alles) {
  const bl = S.daten[jahr] || [], out = [];
  const plus = (a,b) => a.map((x,i) => x + b[i]);
  let einnahmen = N12(), ausgaben = N12();

  /* Gegenposten Tilgung: Einnahmenseite der Jahre, die nur Schulden führen. */
  const tilgung = N12();
  bl.forEach(b => { if (b.art !== 'schulden') return;
    (b.gruppen||[]).forEach(g => (g.pos||[]).forEach(p =>
      (p.reihe||[]).forEach((v,m) => { tilgung[m] += v; }))); });

  bl.forEach(b => {
    const bAuf = alles || offen(b.id);
    let bsum = N12(), bBasis = 0, bRest = 0;
    const kinder = [];

    if (b.art === 'schulden') {
      (b.gruppen||[]).forEach(g => {
        const gAuf = alles || offen(g.id);
        let gsum = N12(), gBasis = 0, gRest = 0;
        const enkel = [];
        (g.pos||[]).forEach(p => {
          const basis = basisVon(jahr, g.key, p.key, p.basis);
          const rest = nachRaten(basis, su(p.reihe)) + korrSum(p,'rest');
          gsum = plus(gsum, p.reihe); gBasis += basis; gRest += rest;
          enkel.push({ typ:'pos', id:p.id, eltern:g.id, name:p.name, bs:basis,
            reihe:p.reihe, jw:rest, tief:3, geerbt: basisGeerbt(jahr, g.key, p.key),
            schuld:true, korr:hatKorr(p) });
        });
        kinder.push({ typ:'gkopf', id:g.id, eltern:b.id, name:g.name, reihe:gsum, auf:gAuf,
          bs:gBasis, jw:gRest, anzahl:(g.pos||[]).length });
        if (gAuf) enkel.forEach(x => kinder.push(x));
        bsum = plus(bsum, gsum); bBasis += gBasis; bRest += gRest;
      });
    } else {
      (b.pos||[]).forEach(p => {
        const r = p.spiegel === 'tilgung' ? tilgung : p.reihe;
        bsum = plus(bsum, r);
        kinder.push({ typ:'pos', id:p.id, eltern:b.id, name:p.name, bs:p.basis, reihe:r,
          jw:su(r), tief:2, fix: !!p.fix, verteilen: istRueckstellung(b),
          marke: p.spiegel === 'tilgung' ? 'gegenposten zur tilgung' : '' });
      });
      bRest = su(bsum);
    }

    out.push({ typ:'kopf', id:b.id, name:b.name, reihe:bsum, auf:bAuf,
      bs: b.art === 'schulden' ? bBasis : 0, jw:bRest, schulden: b.art === 'schulden',
      anzahl: b.art === 'schulden' ? (b.gruppen||[]).length : (b.pos||[]).length });
    if (bAuf) kinder.forEach(x => out.push(x));
    if (b.vz === 1) einnahmen = plus(einnahmen, bsum); else ausgaben = plus(ausgaben, bsum);
  });

  const rech = N12();
  (S.rechnungen[jahr] || []).forEach(g => (g.rechnungen||[]).forEach(r =>
    (r.reihe||[]).forEach((v,m) => { rech[m] += v; })));
  out.push({ typ:'summe', id:'rech', name:'Rechnungen', reihe:rech, jw:su(rech),
    klein:true, marke:'aus dem Blatt Rechnungen' });
  ausgaben = ausgaben.map((x,i) => x + rech[i]);
  out.push({ typ:'summe', id:'aus', name:'Ausgaben zusammen', reihe:ausgaben,
    jw:su(ausgaben), stark:true });

  const saldo = einnahmen.map((e,i) => e - ausgaben[i]);
  let lauf = 0;
  const kum = saldo.map(s => (lauf += s));
  return { zeilen:out, saldo, kum, einnahmen, ausgaben, rech };
}

/* Kopfzelle grün, wenn jeder Posten darunter in diesem Monat abgehakt ist. */
function kopfGruen(jahr, blockId, m) {
  const b = (S.daten[jahr]||[]).find(x => x.id === blockId); if (!b) return false;
  const alle = b.art === 'schulden'
    ? (b.gruppen||[]).reduce((a,g) => a.concat(g.pos||[]), []) : (b.pos||[]);
  const mit = alle.filter(p => (p.reihe||[])[m] !== 0);
  return mit.length > 0 && mit.every(p => hakenAn(p.id, m));
}
function gruppeGruen(jahr, gid, m) {
  const b = schuldBlock(jahr); if (!b) return false;
  const g = (b.gruppen||[]).find(x => x.id === gid); if (!g) return false;
  const mit = (g.pos||[]).filter(p => (p.reihe||[])[m] !== 0);
  return mit.length > 0 && mit.every(p => hakenAn(p.id, m));
}

/* ------------------------------------------------------------ Kennzahlen */
function kennzahlen() {
  const js = jahre();
  if (!js.length) return null;
  const hj0 = parseInt(S.stichmonat.slice(0,4), 10);
  const hm = parseInt(S.stichmonat.slice(5,7), 10) - 1;
  const hj = js.indexOf(hj0) >= 0 ? hj0 : js[js.length-1];

  const blk = schuldBlock(hj);
  /* Stand einer einzelnen Schuld am Stichmonat. Eine Korrektur am Jahresende ist
     am 31.12. gebucht — sie zaehlt hier nur, wenn der Stichmonat der Dezember
     ist. Sonst zeigten zwei Anzeigen derselben Zahl sie verschieden. */
  const standHeute = (g, p) =>
    nachRaten(basisVon(hj, g.key, p.key, p.basis), su((p.reihe||[]).slice(0, hm+1)))
    + (hm === 11 ? korrSum(p,'rest') : 0);

  let rest = 0;
  if (blk) (blk.gruppen||[]).forEach(g => (g.pos||[]).forEach(p => { rest += standHeute(g, p); }));

  /* Anfangsstand: jede Schuld mit dem Stand ihres EIGENEN ersten Jahres — nicht
     alle aus einem Jahrgang. Gemessen wird an den Zahlen, nicht an der Laenge der
     Liste: ein Geruest fuehrt seine Glaeubiger dem Namen nach und traegt nichts. */
  let anfang = 0, erstJahr = null;
  const anfangVon = (gKey, pKey) => {
    for (const j of js) {
      if (j > hj) break;                          /* was spaeter beginnt, laeuft noch nicht */
      const p = posVon(j, gKey, pKey);
      if (!p || basisGeerbt(j, gKey, pKey)) continue;
      const a = basisVon(j, gKey, pKey, p.basis);
      if (a === 0) continue;
      return { a, j };
    }
    return null;
  };
  /* Gezaehlt werden genau die Schulden, die auch in «Restschuld heute» stecken.
     Sonst stuende in «Getilgt bisher» eine Schuld, die noch gar nicht laeuft. */
  if (blk) (blk.gruppen||[]).forEach(g => (g.pos||[]).forEach(p => {
    const t = anfangVon(g.key, p.key);
    if (!t) return;
    anfang += t.a;
    if (erstJahr === null || t.j < erstJahr) erstJahr = t.j;
  }));

  /* Getilgt ist, was vom Anfangsstand verschwunden ist. Roh aufsummierte Raten
     gehen nicht auf — eine Rate, die groesser ist als die Restschuld, tilgt nur
     bis null. «Anfang minus Getilgt» muss die Restschuld ergeben, sonst steht
     im Band eine Quote, die niemand nachrechnen kann. */
  const getilgt = anfang - rest;

  /* Schuldenfrei: jede Schuld laeuft fuer sich. Wer alle Raten in einen Topf
     wirft, rechnet die Rate einer getilgten Schuld auf die uebrigen an und wird
     zu frueh fertig. Nach dem letzten erfassten Jahr wiederholt sich dessen Rate. */
  const letzte = js[js.length-1];
  const rateVon = (j, gKey, pKey, m) => {
    const p = posVon(j >= letzte ? letzte : j, gKey, pKey);
    return p ? ((p.reihe||[])[m] || 0) : 0; };
  const korrVon = (j, gKey, pKey, art) => {
    const p = posVon(j, gKey, pKey); return p ? korrSum(p, art) : 0; };

  let frei = null, haengt = false, unstimmig = false;
  if (blk) (blk.gruppen||[]).forEach(g => (g.pos||[]).forEach(p => {
    let stand = standHeute(g, p);
    if (stand <= 0) return;                       /* diese Schuld ist durch */
    let jL = hj, mL = hm, schritte = 0, ueberspringe = (hm === 11), fertig = null;
    while (schritte < 480) {
      mL++;
      if (mL > 11) { if (ueberspringe) ueberspringe = false;
        else stand += korrVon(jL, g.key, p.key, 'rest');
        mL = 0; jL++; stand += korrVon(jL, g.key, p.key, 'basis'); }
      const rate = rateVon(jL, g.key, p.key, mL);
      if (rate <= 0 && stand > 0 && schritte > 240) break;
      stand -= rate; schritte++;
      if (stand <= 0) { fertig = { j:jL, m:mL }; break; }
    }
    if (!fertig) { haengt = true; return; }
    if (!frei || fertig.j > frei.j || (fertig.j === frei.j && fertig.m > frei.m)) frei = fertig;
  }));
  if (haengt) frei = null;
  else if (!frei) frei = { j:hj, m:hm };          /* keine offene Schuld mehr */

  /* Ein Befund ist ein Befund, egal in welchem Monat man draufschaut. Deshalb
     wird jeder Jahrgang gefragt und nicht nur der Stichmonat. */
  js.forEach(j => { const b = schuldBlock(j); if (!b) return;
    (b.gruppen||[]).forEach(g => (g.pos||[]).forEach(p => {
      if (basisVon(j, g.key, p.key, p.basis) < 0 || restVon(j, g.key, p.key) < 0) unstimmig = true;
    })); });

  let off = 0;
  (S.daten[hj]||[]).forEach(b => {
    if (b.vz === 1) return;
    const liste = b.art === 'schulden'
      ? (b.gruppen||[]).reduce((a,g) => a.concat(g.pos||[]), []) : (b.pos||[]);
    liste.forEach(p => { const v = (p.reihe||[])[hm];
      if (v !== 0 && !hakenAn(p.id, hm)) off += v; });
  });
  /* Wie im Budget: was in diesem Monat weder abgehakt noch als bezahlt gemeldet ist. */
  (S.rechnungen[hj]||[]).forEach(g => (g.rechnungen||[]).forEach(r => {
    if (r.stand !== 'Bezahlt' && !hakenAn(r.id, hm)) off += (r.reihe||[])[hm] || 0; }));

  return { jahr:hj, monat:hm, rest, getilgt, anfang, offen:off, erstJahr,
    quote: anfang ? Math.round(getilgt/anfang*100) : 0, frei,
    /* Ein Saldo unter null heisst: eine Korrektur nimmt mehr weg, als da ist.
       Das ist ein Befund, keine Zahl, mit der weitergerechnet wird. */
    unstimmig: unstimmig || rest < 0 };
}

/* ==================================================================== Bild */
const F = n => fmt(n);
/* Spaltenbreiten. Name, Basis, Jahr und die Randspalten stehen fest; die zwoelf
   Monate teilen sich den Rest — das leistet table-layout:fixed von selbst.
   Die Summe ist zugleich die Mindestbreite: darunter wird quer gescrollt. */
const B = {
  budget: { name:300, basis:100, monat:74,  jahr:130 },
  rech:   { name:300, datum:104, betrag:100, monat:64, saldo:100, stand:150 },
  alle:   { name:340, jahr:110, total:160 }
};

/* Die Kennzeichen, ueber die ein Feld nach dem Neuzeichnen wiedergefunden wird.
   Links der Name im dataset, rechts der im Auszeichnungstext. */
const MERKFELD = [['z','z'],['rm','rm'],['r','r'],['f','f'],['p','p'],['s','s'],['m','m'],['b','b'],
                  ['korrB','korr-b'],['korrN','korr-n']];

/* Ein Neuzeichnen kann waehrend des Neuzeichnens ausgeloest werden: das Ersetzen
   des Blatts nimmt dem getippten Feld den Fokus, das loest «change» aus, und
   «change» zeichnet neu. Die aeussere Zuweisung von innerHTML brach dann mit
   NotFoundError ab. Deshalb ein Riegel und hoechstens zwei Nachzuege. */
let zeichnet = false, nachzug = 0;
/* Wer eine Zeile anlegt, will sie benennen. Das Feld gibt es erst nach dem
   Neuzeichnen — deshalb der Wunsch, der danach eingeloest wird. */
let fokusWunsch = null;
function zeichne() {
  if (zeichnet) { nachzug++; return; }
  zeichnet = true;
  try {
    let runden = 0;
    do { nachzug = 0; zeichneJetzt(); runden++; } while (nachzug && runden < 3);
  } catch (e) {
    /* Ein Datenstand, der die Anzeige zum Absturz bringt, darf die App nicht
       unbedienbar zuruecklassen. Es muss immer einen Weg zurueck geben. */
    notausgang(e);
  } finally { zeichnet = false; }
}
function notausgang(e) {
  /* Eine Datei aus fremder Hand darf die Anzeige nicht stillegen — und wenn sie
     es doch tut, muss ein Weg zurueck dastehen. Ein catch, das dieselbe Funktion
     noch einmal ruft, ist kein Weg zurueck. */
  try {
    ['band','druckkopf','druckfuss','dialoge'].forEach(id => {
      const el = document.getElementById(id); if (el) el.innerHTML = ''; });
    const l = document.getElementById('leiste');
    if (l) l.innerHTML = '<div class="kopf1"><span class="wort">GÄPP</span></div>';
    const f = document.getElementById('fusszeile');
    if (f) f.innerHTML = '';
    document.getElementById('blatt').innerHTML =
      '<div class="leerraum"><h2>Dieser Datenstand lässt sich nicht anzeigen.</h2>'
      + '<p>' + esc(String(e && e.message || e)) + '</p>'
      + '<span class="reihe"><button class="tat" data-laden="1">Andere Datei laden</button>'
      + '<button class="ab" data-vergiss="1">Browserspeicher leeren und neu starten</button>'
      + '</span></div>';
  } catch(err) {}
}
/* Ein Klick von einer Zelle in die naechste loest auf der alten «change» aus.
   Wird daraufhin sofort neu gezeichnet, ist die angeklickte Zelle weg, bevor der
   Klick dort ankommt. Deshalb wird nach einer Aenderung erst im naechsten
   Durchgang gezeichnet. */
let baldZeichnen = null;
function zeichneBald() {
  if (baldZeichnen) return;
  baldZeichnen = setTimeout(() => { baldZeichnen = null; zeichne(); }, 0);
}
function zeichneJetztFalls() {
  if (!baldZeichnen) return;
  clearTimeout(baldZeichnen); baldZeichnen = null; zeichne();
}
/* Nur der Rahmen. Eine Meldung aus dem Sichern geht das Blatt nichts an — wer
   dort gerade tippt, soll seinen halben Satz behalten. */
function zeichneRahmen() {
  const l = document.getElementById('leiste');
  if (l) l.innerHTML = leiste();
}

function zeichneJetzt() {
  const akt = document.activeElement;
  const merk = akt && akt.dataset ? { k:akt.className,
    pos:(akt.selectionStart != null ? akt.selectionStart : null),
    bis:(akt.selectionEnd != null ? akt.selectionEnd : null) } : null;
  if (merk) MERKFELD.forEach(f => { merk[f[0]] = akt.dataset[f[0]]; });

  const mob = mobilAn();
  document.body.setAttribute('data-mobil', mob ? '1' : '0');
  document.getElementById('leiste').innerHTML = mob ? mobilKopf() : leiste();
  document.getElementById('band').innerHTML = mob ? mobilBand() : band();
  document.getElementById('druckkopf').innerHTML = blattrahmenKopf('gedruckt');
  document.getElementById('druckfuss').innerHTML = blattrahmenFuss();
  document.getElementById('blatt').innerHTML = mob ? mobilListe() : blatt();
  document.getElementById('fusszeile').innerHTML = mob ? mobilFuss() : fusszeile();
  document.getElementById('dialoge').innerHTML = dialoge();

  klebEinstellen();
  if (mob) { const a = document.querySelector('.mMonate .an');
    if (a && a.scrollIntoView) { try { a.scrollIntoView({ block:'nearest', inline:'center' }); } catch(e) {} } }

  if (merk) {
    const teile = [];
    MERKFELD.forEach(f => { if (merk[f[0]] != null) teile.push('[data-'+f[1]+'="'+merk[f[0]]+'"]'); });
    if (teile.length) {
      const kand = document.querySelectorAll(teile.join(''));
      /* Verglichen wird nur der erste Klassenteil. Eine Zelle, die durch die
         eigene Eingabe von «zelle» auf «zelle gruen» wechselt, waere sonst nach
         dem Neuzeichnen nicht mehr wiederzufinden — der Fokus fiele ins Leere. */
      const erste = c => String(c || '').trim().split(/\s+/)[0];
      for (const el of kand) {
        if (erste(el.className) === erste(merk.k)) {
          el.focus();
          if (merk.pos != null && el.setSelectionRange) {
            try { el.setSelectionRange(merk.pos, merk.bis != null ? merk.bis : merk.pos); } catch(e){} }
          break; }
      }
    }
  }

  if (fokusWunsch) {
    const ziel = document.querySelector(fokusWunsch);
    fokusWunsch = null;
    if (ziel) { ziel.focus(); if (ziel.select) { try { ziel.select(); } catch(e){} } }
  }
}

/* Saldo budgetiert und Saldo kumuliert bleiben unter dem Tabellenkopf stehen,
   damit beim Tippen weiter unten sichtbar ist, wie der Saldo reagiert. */
function klebEinstellen() {
  const kopf = document.querySelector('thead th');
  if (!kopf) return;
  /* Der Spaltenkopf klebt seit dem Rollfeld nicht mehr am oberen Rand, sondern
     unter der Kopfzeile. Wo genau, wird aus seinem eigenen «top» gelesen — im
     Export steht dort null, im Werkzeug die Hoehe der Kopfzeile. Eine hier
     eingetragene Zahl waere dieselbe Angabe ein zweites Mal. */
  let oben = (parseFloat(getComputedStyle(kopf).top) || 0)
    + Math.round(kopf.getBoundingClientRect().height);
  document.querySelectorAll('tr.saldo').forEach(tr => {
    tr.querySelectorAll('td').forEach(td => { td.style.top = oben + 'px'; });
    oben += Math.round(tr.getBoundingClientRect().height);
  });
}

/* ------------------------------------------------------------ Kopfleiste --
   Drei Zeilen statt einer Werkzeugleiste. Von acht Knoepfen bleiben drei
   Zeichen: Quadrat (Export), Kreis (Handbuch), Dreieck (Zustand des
   Datenkanals). «Alles zuklappen» und «Nullen zeigen» liegen auf z und n. */
function dreieck(gefuellt) {
  return gefuellt
    ? '<svg width="12" height="10.5" viewBox="0 0 12 10.5" fill="currentColor" aria-hidden="true"><path d="M6 0 12 10.5H0Z"/></svg>'
    : '<svg width="12" height="10.5" viewBox="0 0 12 10.5" fill="none" stroke="currentColor" stroke-width="1" aria-hidden="true"><path d="M6 .8 11.3 10H.7Z"/></svg>';
}
function zeichenreihe() {
  /* Gefuellt heisst gesichert. Kontur heisst: nicht verbunden, oder es laeuft
     gerade etwas. Ein Fehler bleibt Kontur — und steht im Titel. */
  const voll = S.sync === 'gesichert';
  return '<span class="zeichen">'
    + '<button data-exp="1" title="Export — Drucken oder als HTML sichern" aria-label="Export">'
    + '<span class="z-quadrat"></span></button>'
    + '<button data-hb="1" title="Handbuch" aria-label="Handbuch">'
    + '<span class="z-kreis"></span></button>'
    + '<button data-sync-auf="1" title="' + esc(S.syncText || S.sync) + '" aria-label="Datenkanal">'
    + dreieck(voll) + '</button></span>';
}
function leiste() {
  const kopf1 = '<div class="kopf1"><span class="wort">GÄPP</span>' + zeichenreihe() + '</div>';
  if (!S.geladen) return kopf1;

  const js = jahre(), an = S.ansicht === 'alle';
  const jk = js.map(j => '<button class="jg' + (!an && S.jahr === j ? ' an' : '')
    + '" data-geh-jahr="' + j + '">' + j + '</button>').join('');
  /* In «Alle Jahre» sind zwei Woerter hell: die Ansicht und das, was sie zeigt. */
  const hell = w => an ? (w === 'alle' || w === S.alleWas) : w === S.ansicht;
  const wort = (w, t) => '<button class="ans' + (hell(w) ? ' an' : '') + '" data-geh-'
    + (w === 'alle' ? 'alle="1"' : 'ansicht="' + w + '"') + '>' + t + '</button>';

  const kopf2 = '<div class="kopf2"><span class="jgs">' + jk
    + '<button class="jgtat" data-neu-jahr="1" title="Neuen Jahrgang anlegen">+</button>'
    + (js.length > 1 && !an
        ? '<button class="jgtat" data-weg-jahr="1" title="Jahrgang ' + S.jahr + ' löschen">−</button>' : '')
    + '</span><span class="anss">'
    + wort('budget','Budget') + wort('rechnung','Rechnungen') + wort('alle','Alle Jahre')
    + '</span></div>';

  return kopf1 + kopf2;
}
/* Papier und HTML-Export tragen denselben Kopf: Wortmarke, Blatttitel,
   Stichmonat, rechts wann und aus welcher Fassung. Kein Fenster, keine
   Werkzeuge. Der Text steht an einer Stelle, damit Druck und Export nicht
   auseinanderlaufen. */
const zwei = n => (n < 10 ? '0' : '') + n;
const tagDatum = d => zwei(d.getDate()) + '.' + zwei(d.getMonth()+1) + '.' + d.getFullYear();
function blattrahmenKopf(wie) {
  const sm = S.stichmonat;
  const heute = tagDatum(new Date());
  return '<span class="dkWort">GÄPP</span>'
    + '<span class="dkTitel">' + esc(blattTitel()) + '</span>'
    + '<span class="dkStich">Stichmonat ' + esc(sm.slice(5,7)) + ' · ' + esc(sm.slice(0,4)) + '</span>'
    + '<span class="dkRechts">' + wie + ' ' + heute + ' · GÄPP V ' + VERSION + '</span>';
}
function blattrahmenFuss() {
  return '<span>Beträge in CHF, ohne Rappen</span>'
    + '<span><b>halbfett</b> = abgehakt</span>'
    + '<span class="dfRechts">Passend | Präzise | Praktisch</span>';
}
function blattTitel() {
  if (S.ansicht === 'alle')
    return S.alleWas === 'rechnung' ? 'Alle Jahre · Rechnungen' : 'Alle Jahre';
  return (S.ansicht === 'rechnung' ? 'Rechnungen ' : 'Budget ') + S.jahr;
}

/* ------------------------------------------------------ Kennzahlenband ----
   Vier Zahlen, je eine Kurzzeile darunter. Der ganze Satz steht im Titel —
   das Band traegt die Zahl, nicht die Erklaerung. */
function band() {
  const was = S.ansicht === 'alle' ? S.alleWas : S.ansicht;
  if (was !== 'budget' || !S.geladen) return '';
  const k = kennzahlen(); if (!k) return '';
  const js = jahre();
  const frei = k.frei ? MK[k.frei.m] + ' ' + k.frei.j : null;
  const monate = k.frei ? (k.frei.j - k.jahr) * 12 + (k.frei.m - k.monat) : null;

  const kach = [
    ['Restschuld heute', fmt(k.rest, true),
      MK[k.monat] + ' ' + k.jahr,
      k.rest < 0 ? 'Unter null — eine Korrektur nimmt mehr weg, als da ist.'
                 : 'Raten bis ' + MK[k.monat] + ' abgezogen'],
    ['Schuldenfrei',
      k.unstimmig ? '—' : (frei || '—'),
      k.unstimmig ? 'der Plan geht nicht auf'
        : (frei ? (monate > 0 ? 'in ' + monate + (monate === 1 ? ' Monat' : ' Monaten')
                              : 'keine offene Schuld mehr')
                : 'nicht nach diesem Plan'),
      k.unstimmig ? 'Erst die Korrekturen richtigstellen.'
                  : 'Jede Schuld für sich gerechnet'],
    ['Getilgt bisher', fmt(k.getilgt, true),
      k.anfang <= 0 ? 'kein Anfangsstand' : k.quote + ' %',
      k.anfang <= 0 ? 'Keine Schuld mit Anfangsstand erfasst.'
        : (k.quote < 0 || k.quote > 100)
          ? 'Die Zahlen gehen nicht auf — ' + k.quote + ' % von ' + fmt(k.anfang, true)
          : 'von ' + fmt(k.anfang, true) + ' seit ' + (k.erstJahr || js[0])],
    ['Offen im ' + ML[k.monat], fmt(k.offen, true),
      k.offen > 0 ? 'noch offen' : 'erledigt', '']
  ];
  return '<div class="band">' + kach.map(x =>
    '<span' + (x[3] ? ' title="' + esc(x[3]) + '"' : '') + '>'
    + '<span class="k">' + esc(x[0]) + '</span>'
    + '<span class="v">' + esc(x[1]) + '</span>'
    + '<span class="m">' + esc(x[2]) + '</span></span>').join('') + '</div>';
}

/* ---------------------------------------------------------------- Mobil ---
   Ein Monat je Bildschirm. Gerechnet wird mit denselben Funktionen wie am
   Schreibtisch — bau() liefert die Zeilen, hier wird nur eine Spalte davon
   gezeigt. Es gibt keinen zweiten Rechenweg. */
const MOBIL_BIS = 560;
function mobilAn() { return S.mobil; }
function mMonat() {
  if (S.mMonat != null) return S.mMonat;
  const st = stichIm(S.jahr);
  return st >= 0 ? st : 0;
}
function mobilKopf() {
  const voll = S.sync === 'gesichert';
  return '<div class="mKopf"><span class="wort">GÄPP</span>'
    + '<span class="zeichen">'
    + '<button data-sync-auf="1" title="' + esc(S.syncText || S.sync) + '">' + dreieck(voll) + '</button>'
    + '<button data-exp="1" title="Export"><span class="z-quadrat"></span></button>'
    + '<button data-hb="1" title="Handbuch"><span class="z-kreis"></span></button>'
    + '</span></div>'
    + (S.geladen ? mobilSchiene() + mobilNav() : '');
}
function mobilSchiene() {
  const m = mMonat();
  return '<div class="mSchiene"><span class="mMonate">'
    + MZ.map((x,i) => '<button class="' + (i === m ? 'an' : '') + '" data-m-monat="' + i + '">'
        + x + '</button>').join('')
    + '</span><span class="mJahr">' + S.jahr + '</span></div>';
}
/* Der Entwurf zeigt mobil nur ein Blatt. Ohne einen Weg zum Jahrgang und zur
   Ansicht waere das Telefon aber eine Sackgasse: man kaeme weder ins Vorjahr
   noch zu den Rechnungen. Deshalb diese eine schmale Zeile. */
function mobilNav() {
  const js = jahre(), an = S.ansicht === 'alle';
  const hell = w => an ? (w === 'alle' || w === S.alleWas) : w === S.ansicht;
  return '<div class="mNav"><span class="mJgs">'
    + js.map(j => '<button class="jg' + (!an && S.jahr === j ? ' an' : '')
        + '" data-geh-jahr="' + j + '">' + j + '</button>').join('')
    + '</span><span class="mAns">'
    + '<button class="ans' + (hell('budget') ? ' an' : '') + '" data-geh-ansicht="budget">Budget</button>'
    + '<button class="ans' + (hell('rechnung') ? ' an' : '') + '" data-geh-ansicht="rechnung">Rechnungen</button>'
    + '</span></div>';
}
function mobilBand() {
  if (!S.geladen || mobilWas() !== 'budget') return '';
  const k = kennzahlen(); if (!k) return '';
  const frei = k.frei ? MK[k.frei.m] + ' ' + String(k.frei.j).slice(2) : '—';
  return '<div class="mBand">'
    + '<span><span class="k">Restschuld</span><span class="v">' + esc(fmt(k.rest, true)) + '</span></span>'
    + '<span><span class="k">Schuldenfrei</span><span class="v">' + esc(k.unstimmig ? '—' : frei) + '</span></span>'
    + '</div>';
}
function mobilWas() { return S.ansicht === 'alle' ? S.alleWas : S.ansicht; }

/* Kleinbetraege werden zu einer Zeile zusammengefasst: was in diesem Monat
   weniger als ein Zwanzigstel seiner Sektion ausmacht, steht mit den anderen
   Kleinen in einer Zeile. Erst ab zwei solchen — eine einzelne zusammenzufassen
   brauchte niemand. */
function mobilFalten(kinder, summe) {
  const grenze = Math.abs(summe) / 20;
  const klein = kinder.filter(x => x.wert !== 0 && Math.abs(x.wert) < grenze);
  if (klein.length < 2) return { zeilen: kinder, gefaltet: null };
  const gross = kinder.filter(x => klein.indexOf(x) < 0);
  return { zeilen: gross, gefaltet: {
    name: klein.map(x => x.name).join(' · '),
    wert: klein.reduce((a,x) => a + x.wert, 0) } };
}
function mZeile(kl, name, wert, hak) {
  return '<div class="' + kl + ' mZeile' + (hak ? ' hak' : '') + '">'
    + '<span class="n">' + esc(name) + '</span>'
    + '<span class="w">' + F(wert) + '</span></div>';
}
function mobilListe() {
  if (!S.geladen) return leerText();
  return mobilWas() === 'rechnung' ? mobilRechnungen() : mobilBudget();
}
function mobilBudget() {
  const m = mMonat(), b = bau(S.jahr);
  const teile = [];
  /* Gruppen und ihre Positionen duerfen nicht flach nebeneinander stehen —
     wer die Zeilen addierte, kaeme auf das Doppelte. Die Gruppe traegt ihre
     eigene Stufe, ihre Glaeubiger stehen darunter. */
  let sammler = null, sumFuer = 0;
  const spuele = () => {
    if (!sammler) return;
    const g = mobilFalten(sammler.kinder, sumFuer);
    g.zeilen.forEach(x => teile.push(mZeile(sammler.kl, x.name, x.wert, x.hak)));
    if (g.gefaltet) teile.push(mZeile(sammler.kl, g.gefaltet.name, g.gefaltet.wert, false));
    sammler = null;
  };
  b.zeilen.forEach(z => {
    if (z.typ === 'kopf') {
      spuele();
      teile.push('<button class="mKat mZeile" data-klapp="' + z.id + '">'
        + '<span class="n">' + esc(z.name) + '</span>'
        + '<span class="w">' + F(z.reihe[m]) + '</span></button>');
      if (z.auf) { sammler = { kl:'mPos', kinder:[] }; sumFuer = z.reihe[m]; }
      return;
    }
    if (z.typ === 'gkopf') {
      spuele();
      teile.push('<button class="mGrp mZeile" data-klapp="' + z.id + '">'
        + '<span class="n">' + esc(z.name) + '</span>'
        + '<span class="w">' + F(z.reihe[m]) + '</span></button>');
      if (z.auf) { sammler = { kl:'mPos tief', kinder:[] }; sumFuer = z.reihe[m]; }
      return;
    }
    if (z.typ === 'pos') {
      if (!sammler) return;
      sammler.kinder.push({ name:z.name, wert:z.reihe[m],
        hak: hakenAn(z.id, m) && z.reihe[m] !== 0 });
      return;
    }
    spuele();
    teile.push(mZeile(z.stark ? 'mSum stark' : 'mSum', z.name, z.reihe[m], false));
  });
  spuele();
  return '<div class="mListe">' + teile.join('') + '</div>';
}
function mobilRechnungen() {
  const m = mMonat(), gruppen = steller(S.jahr), teile = [];
  let tot = 0;
  gruppen.forEach(g => {
    const liste = g.rechnungen || [], auf = offen(g.id);
    const mon = liste.reduce((a,r) => a + ((r.reihe||[])[m] || 0), 0);
    tot += mon;
    teile.push('<button class="mKat mZeile" data-klapp="' + g.id + '">'
      + '<span class="n">' + esc(g.name) + '</span>'
      + '<span class="w">' + F(mon) + '</span></button>');
    if (!auf) return;
    liste.forEach(r => teile.push(mZeile('mPos', r.zweck, (r.reihe||[])[m] || 0,
      monatBezahlt(r,m) && ((r.reihe||[])[m] || 0) !== 0)));
  });
  if (!gruppen.length) teile.push('<div class="leerraum"><p>In diesem Jahrgang steht keine Rechnung.</p></div>');
  else teile.push(mZeile('mSum stark', 'Rechnungen ' + MZ[m], tot, false));
  return '<div class="mListe">' + teile.join('') + '</div>';
}
function mobilFuss() {
  if (!S.geladen) return '';
  const m = mMonat(), b = bau(S.jahr);
  return '<span class="k">Saldo ' + MZ[m] + '</span>'
    + '<span class="v">' + fmt(b.saldo[m], true) + '</span>';
}

/* ------------------------------------------------------------ Das Blatt */
function blatt() {
  if (!S.geladen) return leerText();
  if (S.ansicht === 'alle') return S.alleWas === 'rechnung' ? alleJahreRechnungen() : alleJahre();
  if (S.ansicht === 'rechnung') return rechnungsblatt();
  return budgetblatt();
}
/* Der Anspruch links, die Version daneben, rechts eine Angabe darueber, worauf
   man gerade schaut. Alle drei Zahlen sind gezaehlt, keine steht als Konstante. */
function fusszeile() {
  if (!S.geladen) return '';
  const js = jahre();
  const haken = Object.keys(S.haken).length;
  const zahlwort = ['kein','ein','zwei','drei','vier','fünf','sechs','sieben','acht',
                    'neun','zehn','elf','zwölf'];
  const jw = js.length < zahlwort.length ? zahlwort[js.length] : String(js.length);
  return '<span class="claim">Passend | Präzise | Praktisch</span>'
    + '<span class="ver">GÄPP V ' + VERSION + '</span>'
    + '<span class="rechts">'
    + (jw.charAt(0).toUpperCase() + jw.slice(1))
    + (js.length === 1 ? ' Jahrgang' : ' Jahrgänge')
    + ' · ' + haken + (haken === 1 ? ' Haken' : ' Haken')
    + ' · alles gerechnet</span>';
}
function leerText() {
  return '<div class="leerraum"><h2>Keine Daten geladen.</h2>'
    + '<p>Die Zahlen stehen in einer JSON-Datei, nicht in dieser hier.</p>'
    + '<span class="reihe"><button class="tat" data-laden="1">Datei laden</button>'
    + '<button class="ab" data-sync-auf="1">Repo verbinden</button></span></div>';
}

/* Die Spalten teilen sich die Fensterbreite im Verhaeltnis ihrer Grundmasse.
   Die Summe der Grundmasse ist zugleich die Mindestbreite: darunter wird quer
   gescrollt, darueber wachsen alle Spalten mit. */
function spalten(art) {
  const b = B[art];
  return { min: art === 'budget'
    ? b.name + b.basis + 12 * b.monat + b.jahr
    : b.name + b.datum + b.betrag + 12 * b.monat + b.saldo + b.stand };
}
/* Der Stichmonat steht im Kopf halbfett — aber nur in dem Jahrgang, zu dem er
   gehoert. In jedem anderen ist kein Monat ausgezeichnet. */
function stichIm(jahr) {
  const sj = parseInt(S.stichmonat.slice(0,4), 10);
  return jahr === sj ? parseInt(S.stichmonat.slice(5,7), 10) - 1 : -1;
}
function monatsKoepfe(jahr) {
  const st = stichIm(jahr);
  return MZ.map((m,i) => '<th class="c-mon' + (i === st ? ' stich' : '') + '">' + m + '</th>').join('');
}
function tabelle(sp, inhalt) {
  return '<table style="min-width:' + sp.min + 'px">' + inhalt + '</table>';
}

/* ------------------------------------------------------------ Budget -----
   Der Rang einer Zeile steht in ihrer Schriftgroesse und ihrem Gewicht — nicht
   in einer Flaeche und nicht in einer Farbe. Abgehakt heisst halbfett. Eine
   Zahl unter null traegt ihr Vorzeichen, sonst nichts.
   Die Klassen tragen die Gestaltung; hier steht nur, welche Zeile welchen Rang
   hat. Ohne das stuenden dieselben Masse an hundert Stellen inline. */
function budgetblatt() {
  const jahr = S.jahr, b = bau(jahr);

  const kopf = '<thead><tr><th class="c-name"></th><th class="c-basis"></th>'
    + monatsKoepfe(jahr)
    + '<th class="c-jahr">Jahr / Rest</th></tr>'
    /* Nur noch eine Saldozeile. Der kumulierte Wert ist in der Jahresspalte
       ohnehin dieselbe Zahl wie die Jahressumme — zweimal stuende er zweimal. */
    + '<tr class="saldo"><td class="c-name">Saldo budgetiert</td>'
    + '<td class="c-basis"></td>'
    + b.saldo.map(v => '<td class="c-mon">' + F(v) + '</td>').join('')
    + '<td class="c-jahr" title="Kumuliert über das Jahr">' + F(su(b.saldo)) + '</td></tr>'
    + '</thead>';

  const zeilen = [];

  b.zeilen.forEach(z => {
    if (z.typ === 'kopf' || z.typ === 'gkopf') {
      const haupt = z.typ === 'kopf';
      /* Die Basis steht nur, wo sie ein Anfangsstand ist: bei den Schulden. */
      const zeigtBasis = haupt ? z.schulden : true;
      zeilen.push('<tr class="' + (haupt ? 'kat' : 'grp') + '" data-k="' + z.id + '"'
        + ' data-p="' + esc(z.eltern || '') + '" data-id="' + z.id + '">'
        + '<td class="c-name"><span class="namenszeile">'
        + '<button class="klapper" data-klapp="' + z.id + '" title="' + esc(z.name) + '">'
        + '<span class="chev">' + (z.auf ? '−' : '+') + '</span>' + esc(z.name) + '</button>'
        + (z.auf ? '' : '<span class="anzahl" title="'
            + (z.schulden ? 'Gruppen in dieser Sektion' : 'Zeilen in dieser Sektion')
            + '">' + esc(z.anzahl) + '</span>')
        + '<span class="werkzeug"><button class="plus" data-neu-pos="' + z.id
        + '" title="Zeile einfügen">+</button></span>'
        + '</span></td>'
        + '<td class="c-basis">' + (zeigtBasis && z.bs ? F(z.bs) : '') + '</td>'
        /* Ist in diesem Monat alles darunter abgehakt, sagt die Zeile es selbst:
           bei der Gruppe im Gewicht, bei der Kategorie im Titel — dort ist das
           Gewicht schon vergeben. */
        + z.reihe.map((v,m) => { const alles = haupt ? kopfGruen(jahr, z.id, m)
              : gruppeGruen(jahr, z.id, m);
            const an = alles && v !== 0;
            return '<td class="c-mon' + (an && !haupt ? ' hak' : '') + '"'
              + (an ? ' title="in diesem Monat ist alles darunter abgehakt"' : '') + '>'
              + F(v) + '</td>'; }).join('')
        + '<td class="c-jahr">' + F(z.jw) + '</td></tr>');
      return;
    }

    if (z.typ === 'pos') {
      /* Eine feste Zeile (der Gegenposten Tilgung) traegt keine Eingabefelder. */
      const nurText = !!z.fix;
      const name = nurText
        ? esc(z.name) + (z.marke ? '<span class="marke">' + esc(z.marke) + '</span>' : '')
        : '<input class="namensfeld" data-p="' + z.id + '" value="' + esc(z.name) + '">'
          + (z.korr ? '<span class="korrmarke" title="Von Hand korrigiert — Doppelklick auf Basis oder Rest zeigt die Korrekturen">korrigiert</span>' : '')
          + '<span class="werkzeug">'
          + '<button class="griff" draggable="true" data-griff="' + z.id + '" '
          + 'title="Verschieben — ziehen, oder mit Pfeil rauf und runter">⠿</button>'
          + '<button class="weg" data-weg="' + z.id + '" title="Zeile löschen">×</button></span>';

      let basis;
      if (z.schuld) {
        basis = z.geerbt
          ? '<td class="c-basis geerbt" data-kb="' + z.id + '"'
            + ' title="Saldovortrag: Rest des Vorjahrs plus die Korrekturen dieses Jahres — gerechnet. Doppelklick korrigiert ihn.">'
            + F(z.bs) + '</td>'
          : '<td class="c-basis" data-kb="' + z.id + '" title="Anfangsstand. Doppelklick korrigiert ihn.">'
            + '<input class="zelle" data-b="' + z.id + '" value="' + F(z.bs) + '"></td>';
      } else {
        /* Ausserhalb der Schulden bleibt die Zelle leer — die Basis ist dort eine
           Referenzzahl und kein Anfangsstand. Der Doppelklick auf die Zelle
           oeffnet sie weiterhin: sonst waere «uebertragen und verteilen» nicht
           mehr erreichbar. */
        basis = '<td class="c-basis"' + (nurText ? '' : ' data-bs="' + z.id + '"'
          + ' title="Doppelklick überträgt oder verteilt die Basis dieser Zeile auf die Monate"')
          + '></td>';
      }

      zeilen.push('<tr class="pos' + (S.ziel === z.id ? ' ziel' : '') + '"'
        + ' data-p="' + esc(z.eltern || '') + '" data-id="' + z.id + '">'
        + '<td class="c-name"><span class="namenszeile">' + name + '</span></td>'
        + basis
        + z.reihe.map((v,m) => { const an = hakenAn(z.id, m) && v !== 0;
            return '<td class="c-mon' + (an ? ' hak' : '') + '"'
              + (an ? ' title="abgehakt — Rechtsklick nimmt den Haken weg"' : '') + '>'
              + (nurText ? F(v)
                 : '<input class="zelle" data-z="' + z.id + '" data-m="' + m
                   + '" value="' + F(v) + '">')
              + '</td>'; }).join('')
        /* Ein Rest unter null ist ein Befund. Farbe gibt es dafuer nicht mehr —
           das Vorzeichen traegt ihn, der Titel erklaert ihn. */
        + '<td class="c-jahr"'
        + (z.schuld ? ' data-kr="' + z.id + '" title="'
            + (z.jw < 0 ? 'Rest am 31.12. unter null — der Plan geht nicht auf. '
                        : 'Rest am 31.12. — ')
            + 'Doppelklick korrigiert ihn"' : '')
        + '>' + F(z.jw) + '</td></tr>');
      return;
    }

    /* Summen: «Rechnungen» leise, «Ausgaben zusammen» als staerkste Zeile. */
    zeilen.push('<tr class="' + (z.stark ? 'sumstark' : 'sum') + '">'
      + '<td class="c-name">' + esc(z.name)
      + (z.marke ? '<span class="marke">' + esc(z.marke) + '</span>' : '') + '</td>'
      + '<td class="c-basis"></td>'
      + z.reihe.map(v => '<td class="c-mon">' + F(v) + '</td>').join('')
      + '<td class="c-jahr">' + F(z.jw) + '</td></tr>');
  });

  return tabelle(spalten('budget'), kopf + '<tbody>' + zeilen.join('') + '</tbody>');
}

/* -------------------------------------------------------- Rechnungen -----
   Dieselben Raenge wie im Budget: der Steller traegt den Rang der Kategorie,
   die Rechnung den der Position. Die Stand-Spalte kommt ohne farbige Marke aus
   — «Bezahlt» steht halbfett in Tinte, alles andere leise. */
function rechnungsblatt() {
  const jahr = S.jahr, gruppen = steller(jahr);
  const kopf = '<thead><tr><th class="c-name"></th>'
    + '<th class="c-datum">Datum</th><th class="c-betrag">Betrag</th>'
    + monatsKoepfe(jahr)
    + '<th class="c-saldo">Saldo</th><th class="c-stand">Stand</th></tr></thead>';

  const rMon = N12(), oMon = N12(), bMon = N12();
  let rBetrag = 0, rSaldo = 0, oBetrag = 0, bBetrag = 0;
  gruppen.forEach(g => (g.rechnungen||[]).forEach(r => {
    rBetrag += r.betrag; rSaldo += r.betrag - su(r.reihe);
    const ziel = r.stand === 'Bezahlt' ? bMon : oMon;
    if (r.stand === 'Bezahlt') bBetrag += r.betrag; else oBetrag += r.betrag;
    (r.reihe||[]).forEach((v,m) => { rMon[m] += v; ziel[m] += v; });
  }));

  const zeilen = [];
  gruppen.forEach(g => {
    const liste = g.rechnungen || [], auf = offen(g.id), mon = N12();
    let bet = 0, sal = 0, offene = 0;
    liste.forEach(r => { bet += r.betrag; sal += r.betrag - su(r.reihe);
      if (r.stand !== 'Bezahlt') offene++;
      (r.reihe||[]).forEach((v,m) => { mon[m] += v; }); });

    zeilen.push('<tr class="kat" data-k="' + g.id + '" data-p="">'
      + '<td class="c-name"><span class="namenszeile">'
      + '<button class="klapper" data-klapp="' + g.id + '" title="' + esc(g.name) + '">'
      + '<span class="chev">' + (auf ? '−' : '+') + '</span></button>'
      + '<input class="namensfeld" data-s="' + g.id + '" value="' + esc(g.name) + '">'
      + (auf ? '' : '<span class="anzahl" title="Rechnungen dieses Stellers">'
          + liste.length + '</span>')
      + '<span class="werkzeug"><button class="plus" data-neu-rech="' + g.id
      + '" title="Rechnung einfügen">+</button>'
      + '<button class="weg" data-weg-steller="' + g.id + '" title="Steller löschen">×</button></span>'
      + '</span></td>'
      + '<td class="c-datum"></td>'
      + '<td class="c-betrag">' + fmt(bet, true) + '</td>'
      + mon.map((v,m) => { const alles = stellerGruen(g,m) && v !== 0;
          return '<td class="c-mon"'
            + (alles ? ' title="in diesem Monat ist alles darunter bezahlt"' : '') + '>'
            + F(v) + '</td>'; }).join('')
      + '<td class="c-saldo">' + (Math.abs(sal) < 0.5 ? '—' : fmt(sal, true)) + '</td>'
      + '<td class="c-stand' + (offene ? '' : ' bezahlt') + '">'
      + (offene ? offene + ' offen' : 'bezahlt') + '</td></tr>');
    if (!auf) return;

    liste.forEach(r => {
      const sa = r.betrag - su(r.reihe), bez = r.stand === 'Bezahlt';
      zeilen.push('<tr class="pos" data-p="' + g.id + '">'
        + '<td class="c-name"><span class="namenszeile">'
        + '<input class="namensfeld" data-r="' + r.id + '" data-f="zweck" value="' + esc(r.zweck) + '">'
        + '<span class="werkzeug"><button class="weg" data-weg-rech="' + r.id
        + '" title="Rechnung löschen">×</button></span></span></td>'
        + '<td class="c-datum"><input class="datumsfeld" data-r="' + r.id
        + '" data-f="datum" value="' + esc(r.datum) + '"></td>'
        + '<td class="c-betrag' + (bez ? ' hak' : '') + '">'
        + '<input class="zelle" data-r="' + r.id + '" data-f="betrag" data-bez="' + r.id
        + '" value="' + fmt(r.betrag, true) + '"></td>'
        + (r.reihe||N12()).map((v,m) => { const an = monatBezahlt(r,m) && v !== 0;
            return '<td class="c-mon' + (an ? ' hak' : '') + '">'
              + '<input class="zelle" data-rm="' + r.id + '" data-m="' + m
              + '" value="' + F(v) + '"></td>'; }).join('')
        + '<td class="c-saldo">' + (Math.abs(sa) < 0.5 ? '—' : fmt(sa, true)) + '</td>'
        + '<td class="c-stand' + (bez ? ' bezahlt' : '') + '">'
        + '<select class="standwahl" data-r="' + r.id + '" data-f="stand">'
        + STAENDE.map(x => '<option' + (x === r.stand ? ' selected' : '') + '>' + x + '</option>').join('')
        + '</select></td></tr>');
    });
  });

  const summe = (name, betrag, mon, saldo, stark) =>
    '<tr class="' + (stark ? 'sumstark' : 'sum') + '">'
    + '<td class="c-name">' + esc(name) + '</td>'
    + '<td class="c-datum"></td>'
    + '<td class="c-betrag">' + fmt(betrag, true) + '</td>'
    + mon.map(v => '<td class="c-mon">' + F(v) + '</td>').join('')
    + '<td class="c-saldo">' + (saldo === null ? '' : fmt(saldo, true)) + '</td>'
    + '<td class="c-stand"></td></tr>';
  zeilen.push(summe('Total', rBetrag, rMon, rSaldo, true));
  zeilen.push(summe('davon offen', oBetrag, oMon, null, false));
  zeilen.push(summe('davon bezahlt', bBetrag, bMon, null, false));

  return tabelle(spalten('rech'), kopf + '<tbody>' + zeilen.join('') + '</tbody>')
    + '<button class="neusteller" data-neu-steller="1">Neuer Rechnungssteller</button>';
}

/* -------------------------------------------------------- Alle Jahre ----- */
function alleSpalten(js) {
  return { min: B.alle.name + js.length * B.alle.jahr + B.alle.total };
}
function alleKopf(js) {
  return '<thead><tr><th class="c-name c-alle"></th>'
    + js.map(j => '<th class="c-jahrspalte">' + j + '</th>').join('')
    + '<th class="c-total">Total</th></tr></thead>';
}
function alleZeile(name, werte, total, rang) {
  if (rang === 'stark17' && String(name).length > 20) rang += ' eng';
  return '<tr class="' + rang + '">'
    + '<td class="c-name">' + esc(name) + '</td>'
    + werte.map(v => '<td>' + F(v) + '</td>').join('')
    + '<td class="c-total">' + F(total) + '</td></tr>';
}
function alleJahre() {
  const js = jahre(), bauten = js.map(j => bau(j, true));
  const kopfW = (b,n) => { const z = b.zeilen.find(x => x.typ === 'kopf' && x.name === n); return z ? su(z.reihe) : 0; };
  const restW = (b,n) => { const z = b.zeilen.find(x => x.typ === 'kopf' && x.name === n); return z ? z.jw : 0; };
  const grW   = (b,n) => { const z = b.zeilen.find(x => x.typ === 'gkopf' && x.name === n); return z ? su(z.reihe) : 0; };
  /* Die Aufgliederung wird aus den Daten gelesen, nicht aufgezaehlt. Eine feste
     Liste laesst eine neue Kategorie aus der Aufgliederung fallen und trotzdem
     in der Summe stehen — dann sind Zahlen da, die nirgends erscheinen. */
  const ausgabeNamen = [], gruppenNamen = [];
  let schuldName = 'Verbindlichkeiten';
  js.forEach(j => (S.daten[j]||[]).forEach(b => {
    if (b.art === 'schulden') { schuldName = b.name;
      (b.gruppen||[]).forEach(g => { if (gruppenNamen.indexOf(g.name) < 0) gruppenNamen.push(g.name); }); }
    else if (b.vz !== 1 && ausgabeNamen.indexOf(b.name) < 0) ausgabeNamen.push(b.name);
  }));
  const def = [['Einnahmen', b => su(b.einnahmen), 'stark17']]
    .concat(ausgabeNamen.map(n => [n, b => kopfW(b,n), 'aufglied']))
    .concat(gruppenNamen.map(n => [n, b => grW(b,n), 'aufglied']))
    .concat([
      ['Raten zusammen',       b => kopfW(b, schuldName), 'zwischen'],
      ['Rechnungen',           b => su(b.rech),           'zwischen'],
      ['Ausgaben',             b => su(b.ausgaben),       'stark17'],
      ['Saldo',                b => su(b.saldo),          'stark17'],
      ['Restschuld am 31.12.', b => restW(b, schuldName), 'stark17|letzte']
    ]);
  const zeilen = def.map(([name, fn, rang]) => {
    const w = bauten.map(fn);
    const letzte = rang.indexOf('|letzte') > 0;
    const total = letzte ? w[w.length-1] : w.reduce((s,x) => s+x, 0);
    return alleZeile(name, w, total, letzte ? 'stark17' : rang);
  }).join('');
  return tabelle(alleSpalten(js), alleKopf(js) + '<tbody>' + zeilen + '</tbody>');
}

/* Analog zum Budget: ein Jahr ist eine Spalte, eine Zeile ist ein Steller.
   Gezeigt wird der Rechnungsbetrag — die fuehrende Zahl der Rechnungstafel. */
function alleJahreRechnungen() {
  const js = jahre();
  const namen = [];
  js.forEach(j => steller(j).forEach(g => {
    if (namen.indexOf(g.name) < 0) namen.push(g.name); }));
  namen.sort((a,b) => String(a).localeCompare(String(b), 'de-CH', { sensitivity:'base', numeric:true }));

  const betragVon = (j, name, filter) => steller(j)
    .filter(g => g.name === name)
    .reduce((s,g) => s + (g.rechnungen||[])
      .filter(r => !filter || filter(r))
      .reduce((t,r) => t + (r.betrag||0), 0), 0);
  const summeZ = (name, werte, rang) =>
    alleZeile(name, werte, werte.reduce((s,x) => s+x, 0), rang);
  /* Was im Budget als Zeile «Rechnungen» steht, ist die auf Monate verteilte
     Summe — nicht die Summe der Rechnungsbetraege. Beide stehen hier mit Namen
     nebeneinander, damit ein Klick weiter nicht zwei Zahlen fuer dasselbe zeigt. */
  const verteiltIn = j => (S.rechnungen[j]||[]).reduce((s,g) =>
    s + (g.rechnungen||[]).reduce((t,r) => t + su(r.reihe), 0), 0);

  const zeilen = namen.map(n => summeZ(n, js.map(j => betragVon(j, n)), 'aufglied')).join('')
    + summeZ('Rechnungsbeträge zusammen', js.map(j => namen.reduce((s,n) => s + betragVon(j, n), 0)), 'stark17')
    + summeZ('davon offen', js.map(j => namen.reduce((s,n) => s + betragVon(j, n, r => r.stand !== 'Bezahlt'), 0)), 'zwischen')
    + summeZ('davon bezahlt', js.map(j => namen.reduce((s,n) => s + betragVon(j, n, r => r.stand === 'Bezahlt'), 0)), 'zwischen')
    + summeZ('auf Monate verteilt', js.map(verteiltIn), 'stark17');

  const sp = alleSpalten(js);
  if (!namen.length) return tabelle(sp, alleKopf(js) + '<tbody></tbody>')
    + '<div class="leerraum"><p>In keinem Jahrgang steht eine Rechnung.</p></div>';
  return tabelle(sp, alleKopf(js) + '<tbody>' + zeilen + '</tbody>');
}

/* ------------------------------------------------------------ Dialoge ----
   Rahmen eine Haarlinie stark, kein Radius, keine Flaeche. Der Titel traegt den
   Dialog; die Fusszeile traegt die Aktionen — sekundaer leise, primaer in einem
   Rahmen aus Tinte. Es gibt keine gefuellte Taste mehr. */
function dfuss(teile) { return '<div class="dfuss">' + teile.join('') + '</div>'; }
function haken(an, kennung, text) {
  return '<button class="haken' + (an ? ' an' : '') + '" ' + kennung + '>'
    + '<span class="kasten"></span><span>' + text + '</span></button>';
}
function kreis(an, kennung, text) {
  return '<button class="kreiszeile' + (an ? ' an' : '') + '" ' + kennung + '>'
    + '<span class="kreis"></span><span>' + text + '</span></button>';
}
function dialogRahmen(name, koerper, fuss, gross) {
  return '<div class="schleier" data-schleier="' + name + '">'
    + '<div class="dialog' + (gross ? ' gross' : '') + '">'
    + '<div class="dkoerper">' + koerper + '</div>' + fuss + '</div></div>';
}
function dtitel(titel, beisatz) {
  return '<div class="dtitel"><h2>' + esc(titel) + '</h2>'
    + (beisatz ? '<span class="dbei">' + esc(beisatz) + '</span>' : '') + '</div>';
}

function dialoge() {
  let h = '';
  if (S.ueb)  h += uebDialog();
  if (S.neu)  h += neuJahrDialog();
  if (S.wegJahr) h += wegJahrDialog();
  if (S.exp)  h += sichernDialog();
  if (S.syncAuf) h += kanalDialog();
  if (S.basis) h += basisDialog();
  if (S.korr)  h += korrDialog();
  if (S.korrWarn) h += korrWarnDialog();
  if (S.hb)    h += handbuchDialog();
  return h;
}

/* ---- Sichern: Jahrgaenge frei waehlbar, Navigation bleibt im Export ------ */
function sichernDialog() {
  const js = jahre(), e = S.exp;
  const boxen = js.map(j => '<button class="jbox' + (e.jahre.indexOf(j) >= 0 ? ' an' : '')
    + '" data-exp-jahr="' + j + '">' + j + '</button>').join('');
  const alleAn = e.jahre.length === js.length;
  const keine  = e.jahre.length === 0;
  const nurDies = e.jahre.length === 1 && e.jahre[0] === S.jahr;
  return dialogRahmen('exp',
    dtitel('Sichern')
    + '<span class="mlabel">Jahrgänge</span>'
    + '<div class="jboxen">' + boxen + '</div>'
    + '<div class="schnell">'
    + '<button' + (alleAn ? ' class="an"' : '') + ' data-exp-wahl="alle">alle</button>'
    + '<button' + (keine ? ' class="an"' : '') + ' data-exp-wahl="keine">keine</button>'
    + (S.ansicht === 'alle' ? '' :
       '<button' + (nurDies ? ' class="an"' : '') + ' data-exp-wahl="dies">nur ' + S.jahr + '</button>')
    + '</div>'
    + '<div class="hakenliste">'
    + haken(e.rech, 'data-exp-rech="1"', 'Rechnungen')
    + haken(e.uebersicht, 'data-exp-ueb="1"', 'Jahresübersicht')
    + haken(e.navi, 'data-exp-navi="1"',
        'Navigation — Jahrgang, Ansicht und Klappen bleiben bedienbar')
    + haken(e.nullen, 'data-exp-nullen="1"', 'Nullen zeigen')
    + '</div>'
    + '<p class="dsatz">Die HTML-Datei ist dasselbe Werkzeug, eingefroren: gleiche Schrift, '
    + 'gleiche Linien, gleiche Bedienung — nur ändern lässt sich nichts. '
    + 'CSV kommt je Jahrgang als eigene Datei.</p>',
    dfuss(['<button class="ab" data-zu="exp">Abbrechen</button>',
      /* Drucken steht hier, weil das Quadrat oben genau das verspricht — «Export
         — Drucken oder als HTML sichern». Ohne diese Taste waere der Druck seit
         dem Umbau nicht mehr erreichbar. */
      '<button class="ab rechtsweg" data-drucken="1">Drucken</button>',
      '<button class="ter" data-exp-csv="1">CSV</button>',
      '<button class="tat" data-exp-html="1">HTML sichern</button>']));
}

/* ---- Korrekturen: Betrag, Notiz, worauf sie wirkt ------------------------
   Die Spalte «wirkt auf» ist bei einer bestehenden Zeile eine Angabe und kein
   Knopf — sie sah aus wie der Umschalter der neuen Zeile und loeschte statt
   umzuschalten. Geloescht wird jetzt ueber ein eigenes Zeichen am Rand. */
function korrDialog() {
  const k = S.korr, p = posVon(k.jahr, k.gKey, k.pKey);
  if (!p) return '';
  const vz = n => (n > 0 ? '+' : n < 0 ? '−' : '') + fmt(Math.abs(n), true);
  const zeile = (x, art) =>
    '<div class="korrzeile">'
    + '<input class="betrag" data-korr-b="' + esc(x.id) + '" value="' + vz(x.betrag) + '">'
    + '<input class="notiz" data-korr-n="' + esc(x.id) + '" value="' + esc(x.notiz || '')
    + '" placeholder="Notiz">'
    + '<span class="wirkt">' + (art === 'basis' ? 'Basis' : 'Rest') + '</span>'
    + '<button class="weg" data-korr-weg="' + esc(x.id)
    + '" title="Diese Korrektur entfernen">×</button>'
    + '</div>';
  const alle = korrListe(p,'basis').map(x => zeile(x,'basis'))
    .concat(korrListe(p,'rest').map(x => zeile(x,'rest'))).join('');

  const basisJetzt = basisVon(k.jahr, k.gKey, k.pKey, p.basis);
  const restJetzt  = restVon(k.jahr, k.gKey, k.pKey);
  return dialogRahmen('korr',
    dtitel('Korrekturen', p.name + ' · ' + k.jahr)
    + '<div class="korrkopf"><span>Betrag</span><span>Notiz</span><span>wirkt auf</span>'
    + '<span></span></div>'
    + '<div class="korrliste">' + alle
    + '<div class="korrzeile leer">'
    + '<input class="betrag" data-korr-betrag="1" value="' + esc(k.betrag) + '" placeholder="0">'
    + '<input class="notiz" data-korr-notiz="1" value="' + esc(k.notiz) + '" placeholder="neue Zeile">'
    + '<button class="wirkt umschalt" data-korr-art="1" title="Umschalten: wirkt auf die Basis oder auf den Rest">'
    + (k.art === 'basis' ? 'Basis' : 'Rest') + '</button>'
    + '<span></span></div>'
    + '</div>'
    + '<div class="korrfuss"><button class="ab" data-korr-add="1">Zeile hinzufügen</button>'
    + '<span class="ergebnis">Basis <b>' + fmt(basisJetzt, true) + '</b> · Rest <b>'
    + fmt(restJetzt, true) + '</b></span></div>'
    /* Bestehende Zeilen sind sofort geschrieben — «Abbrechen» waere eine
       Zusage, die dieses Fenster nicht halten kann. */
    + '<p class="dsatz" style="margin-top:16px">Jede Änderung an einer bestehenden Zeile '
    + 'wirkt sofort. «Übernehmen» trägt die neue Zeile ein und schliesst.</p>',
    dfuss(['<button class="ab" data-zu="korr">Schliessen</button>',
      '<button class="tat rechtsweg" data-korr-an="1">Übernehmen</button>']));
}

/* ---- Verteilen: drei Wege, darunter die Vorschau ------------------------- */
function verteilWege(wert) {
  const je = proMonat(wert);
  return {
    gleich: { text: 'gleichmässig auf zwölf Monate — ' + fmt(je, true) + ' je Monat',
              reihe: new Array(12).fill(je) },
    voll:   { text: 'in jedem Monat der volle Betrag — ' + fmt(wert, true) + ' je Monat',
              reihe: new Array(12).fill(wert) },
    einmal: { text: 'einmalig in Monat 12',
              reihe: new Array(11).fill(0).concat([wert]) }
  };
}
function basisDialog() {
  const b = S.basis, wege = verteilWege(b.wert), gewaehlt = b.weg || 'gleich';
  const reihe = wege[gewaehlt].reihe;
  const vorschau = '<table class="vorschau"><thead><tr>'
    + MZ.map(m => '<th>' + m + '</th>').join('') + '</tr></thead><tbody><tr>'
    + reihe.map(v => '<td' + (v ? ' class="belegt"' : '') + '>' + (v ? fmt(v, true) : '—') + '</td>').join('')
    + '</tr></tbody></table>';
  return dialogRahmen('basis',
    dtitel('Verteilen', b.name)
    /* Im Blatt bleibt die Basis ausserhalb der Schulden leer — hier ist sie
       eintragbar. Ohne diese Zeile gaebe es keine Stelle mehr, an der man sie
       ueberhaupt setzen koennte. */
    + '<div class="kanal" style="margin-bottom:22px"><span class="kl">Basis</span>'
    + '<span><input data-basis-wert="1" value="' + fmt(b.wert, true) + '"></span></div>'
    + '<div class="kreiswahl">'
    + kreis(gewaehlt === 'gleich', 'data-basis-weg="gleich"', esc(wege.gleich.text))
    + kreis(gewaehlt === 'voll',   'data-basis-weg="voll"',   esc(wege.voll.text))
    + kreis(gewaehlt === 'einmal', 'data-basis-weg="einmal"', esc(wege.einmal.text))
    + '</div>'
    + '<span class="mlabel">Vorschau</span>' + vorschau,
    dfuss(['<button class="ab" data-zu="basis">Abbrechen</button>',
      '<button class="tat rechtsweg" data-basis-tat="' + gewaehlt + '">Verteilen</button>']));
}
function basisTat(weg) {
  const b = S.basis; if (!b) return;
  const w = verteilWege(b.wert)[weg] || verteilWege(b.wert).gleich;
  mitPos(b.id, p => { p.reihe = w.reihe.slice(); });
  S.basis = null; neu();
}

/* ---- Uebertragen: ein Monatswert auf einen Bereich ----------------------- */
function uebDialog() {
  const u = S.ueb, uJ = jahre().filter(j => j > u.jahr);
  const monatwahl = (kennung, wert) => '<select class="standwahl" style="width:auto" ' + kennung + '>'
    + MZ.map((n,i) => '<option value="' + i + '"' + (i === wert ? ' selected' : '') + '>' + n + '</option>').join('')
    + '</select>';
  return dialogRahmen('ueb',
    dtitel('Übertragen', u.name)
    + '<div class="kanal">'
    + '<span class="kl">Wert</span><span><input data-ueb-wert="1" value="' + fmt(u.wert, true) + '"></span>'
    + '<span class="kl">von Monat</span><span>' + monatwahl('data-ueb-von="1"', u.von) + '</span>'
    + '<span class="kl">bis Monat</span><span>' + monatwahl('data-ueb-bis="1"', u.bis) + '</span>'
    + '</div>'
    + '<div class="hakenliste" style="margin-top:20px">'
    + haken(u.folge, 'data-ueb-folge="1"', 'auch in die Folgejahre — '
        + (uJ.length ? uJ.join(', ') : 'keinem weiteren Jahrgang')) + '</div>'
    + '<p class="dsatz">Der Wert ersetzt, was in diesen Monaten steht.'
    + (u.folge && uJ.length ? ' In ' + uJ.join(' und ') + ' werden alle zwölf Monate gesetzt.'
       : (u.folge ? ' Es gibt noch keinen Folgejahrgang — leg einen an, dann greift die Option.' : ''))
    + '</p>',
    dfuss(['<button class="ab" data-zu="ueb">Abbrechen</button>',
      '<button class="tat rechtsweg" data-ueb-an="1">Übertragen</button>']));
