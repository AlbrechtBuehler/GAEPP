/* ---------------------------------------------------------------------------
   Farben. Dunkel ist die Vorgabe; hell gibt es nur auf Papier.
   Kein Akzent, kein Gruen, kein Rot, kein Orange. Rang entsteht aus Groesse
   und Gewicht, nicht aus Flaeche und nicht aus Farbe.
--------------------------------------------------------------------------- */
:root{
 --grund:#2e3133;      /* Grund des Fensters */
 --umgebung:#1f2224;   /* Umgebung */
 --tinte:#f2f4f4;      /* Zahlen, Titel, abgehakt */
 --sek:#d2d5d6;        /* Werkzeuge, Positionszahlen */
 --ruhig:#bcbfc0;      /* Saetze */
 --mA:#aaaeaf;         /* Muted A */
 --mB:#a5a9aa;         /* Muted B — Versal-Labels, Monatskoepfe */
 --mC:#929698;         /* Muted C — Meta */
 --rStark:#878c8e;     /* Regel stark: Kategorie, Summe, Kopf */
 --rMittel:#5f6467;    /* Regel mittel: Gruppe, Dialogfuss */
 --rLeise:#43474a;     /* Regel leise: Position */
 --faint:#6e7274;      /* geerbte Basis, leere Vorschau */
}
*{box-sizing:border-box}
/* Die Kante, an der die Spaltenkoepfe haengen bleiben: die Hoehe der einen
   Kopfzeile, die beim Rollen stehen bleibt. Die Saldozeile klebt darunter —
   ihre Kante rechnet klebEinstellen() aus, indem es diese hier LIEST. Eine
   zweite Zahl daneben waere eine, die man von Hand nachfuehren muesste. */
:root{--klebeoben:50px}
html,body{margin:0;background:var(--grund)}
body{font-family:'Jost',system-ui,sans-serif;color:var(--tinte);
 -webkit-font-smoothing:antialiased;height:100vh;overflow:hidden;
 display:flex;flex-direction:column}
input,select,button{font-family:inherit}
/* Sichtbarer Ring in Tinte statt der Browservorgabe. */
:focus{outline:none}
:focus-visible{outline:1px solid var(--tinte);outline-offset:1px}
.zahl{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}

/* ---------- Rollfeld ----------
   Was hier drin liegt, rollt gemeinsam. Die Wortmarke und das Kennzahlenband
   duerfen dabei aus dem Bild wandern — die Zeile mit Jahrgang und Ansicht
   nicht, denn ohne sie weiss man beim Blaettern nicht mehr, worin man
   blaettert. */
#rollfeld{flex:1;min-height:0;overflow:auto}
/* «display:contents» loest die Leiste als Kasten auf: kopf1 und kopf2 werden
   damit unmittelbare Kinder des Rollfelds. Nur so klebt kopf2 ueber die ganze
   Rollstrecke — eine klebende Zeile haelt nur, solange ihr eigener Kasten im
   Bild ist, und der waere nach 145 px durchgelaufen. */
#leiste{display:contents}

/* ---------- Kopf, zwei Zeilen ----------
   Die dritte ist am 23.08.2026 gestrichen — siehe weiter unten. */
.kopf{flex:none}
.kopf1{display:flex;align-items:baseline;gap:34px;padding:0 54px;height:96px}
.wort{font:300 34px/1 'Jost',sans-serif;letter-spacing:.3em;text-transform:uppercase;
 color:var(--tinte);align-self:center}
.zeichen{margin-left:auto;display:flex;align-items:center;gap:26px;align-self:center}
.zeichen button,.zeichen span.z{display:inline-flex;align-items:center;justify-content:center;
 width:26px;height:26px;background:none;border:none;padding:0;cursor:pointer;color:var(--sek)}
.zeichen button:hover{color:var(--tinte)}
.z-quadrat{width:11px;height:11px;border:1px solid currentColor}
.z-kreis{width:12.5px;height:12.5px;border:1px solid currentColor;border-radius:50%}

/* Die einzige Kopfzeile, die stehen bleibt. Sie traegt den Grund des Fensters,
   damit das Blatt nicht sichtbar dahinter durchrollt — das ist Deckung, keine
   Flaeche im Sinne des Entwurfs, dieselbe Begruendung wie bei den klebenden
   Zellen. Die Hoehe steht fest, weil die Spaltenkoepfe genau darunter kleben. */
.kopf2{display:flex;align-items:flex-end;gap:44px;padding:0 54px 18px;
 border-bottom:1px solid var(--rStark);
 position:sticky;top:0;z-index:6;background:var(--grund);height:var(--klebeoben)}
.jgs{display:flex;align-items:flex-end;gap:24px}
.jg{background:none;border:none;padding:0;cursor:pointer;
 font:200 22px/1 'Jost',sans-serif;letter-spacing:.08em;color:var(--mC);
 font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
.jg:hover{color:var(--sek)}
.jg.an{font:500 30px/1 'Jost',sans-serif;letter-spacing:.06em;color:var(--tinte);
 font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
.jgtat{background:none;border:none;padding:0;cursor:pointer;
 font:200 20px/1 'Jost',sans-serif;color:var(--mC)}
.jgtat:hover{color:var(--tinte)}
.anss{margin-left:auto;display:flex;align-items:flex-end;gap:36px}
.ans{background:none;border:none;padding:0;cursor:pointer;
 font:200 12px/1 'Jost',sans-serif;letter-spacing:.3em;text-transform:uppercase;color:var(--mC)}
.ans:hover{color:var(--sek)}
.ans.an{font:500 14px/1 'Jost',sans-serif;letter-spacing:.3em;text-transform:uppercase;color:var(--tinte)}

/* Die dritte Kopfzeile — Blatttitel und Legende — ist am 23.08.2026 gestrichen
   worden. Der Titel sagte «Budget 2026»; dieselbe Auskunft steht eine Zeile
   darueber schon zweimal, als heller Jahrgang und als helles Ansichtswort. Die
   Legende erklaerte, was halbfett heisst und welche Tasten es gibt — das steht
   im Handbuch hinter dem Kreis. GAEPP ist ein Werkzeug fuer einen, der es
   kennt: was er auswendig weiss, muss nicht dauernd dastehen. Gewonnen: 60 px
   fuer knapp zwei Zeilen mehr. */

/* ---------- Kennzahlenband ---------- */
.band{display:grid;grid-template-columns:repeat(4,1fr);
 border-bottom:1px solid var(--rStark);flex:none}
.band>span{padding:28px 30px 32px;display:block;min-width:0}
.band .k{display:block;font:400 10px/1 'Jost',sans-serif;letter-spacing:.3em;
 text-transform:uppercase;color:var(--mB)}
.band .v{display:block;font:200 56px/1 'Jost',sans-serif;letter-spacing:.01em;
 color:var(--tinte);margin:18px 0 14px;
 font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1;
 white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.band .m{display:block;font:400 10px/1 'Jost',sans-serif;letter-spacing:.24em;
 text-transform:uppercase;color:var(--mC)}

/* ---------- Blatt und Tabelle ---------- */
/* Das Blatt rollt nicht mehr selbst — das tut jetzt das Rollfeld um es herum.
   Die Luft oben kam bis zum 23.08.2026 von der Titelzeile darueber; seit die
   gestrichen ist, steht sie hier. Ohne sie stiessen die Spaltenkoepfe
   unmittelbar an die Regel unter dem Kennzahlenband. */
.blatt{padding:20px 54px 34px}
table{width:100%;border-collapse:separate;border-spacing:0;table-layout:fixed}
/* Klebende Zellen brauchen einen Grund, sonst scrollen die Zeilen sichtbar
   hindurch. Es ist derselbe Ton wie das Blatt — keine Flaeche im Sinne des
   Entwurfs, sondern Deckung. */
th,thead td{background:var(--grund)}
th{position:sticky;top:var(--klebeoben);z-index:3;height:34px;padding:0 12px 8px 0;text-align:right;
 border-bottom:1px solid var(--rStark);
 font:400 10px/1 'Jost',sans-serif;letter-spacing:.2em;text-transform:uppercase;color:var(--mB)}
th.c-name{left:0;z-index:5;text-align:left;padding:0 0 8px;letter-spacing:.26em;width:300px}
/* In «Alle Jahre» traegt die Namensspalte lange Versalien und ist breiter.
   Ein eigener Name statt th.c-name.alle: gleich schwer wie th.c-name, aber
   spaeter im Text — so bleiben Druck und Export bei ihren 210 px. */
th.c-alle{width:340px}
th.c-basis{width:100px}
th.c-jahr{padding:0 0 8px 12px;letter-spacing:.26em;width:130px}
th.stich{font:500 12px/1 'Jost',sans-serif;letter-spacing:.2em;color:var(--tinte)}
th.c-datum{width:104px}
th.c-betrag{width:100px}
th.c-saldo{width:100px}
th.c-stand{text-align:left;padding:0 0 8px 12px;letter-spacing:.26em;width:150px}
th.c-jahrspalte{font:400 16px/1 'Jost',sans-serif;letter-spacing:.1em;text-transform:none;
 color:var(--tinte);padding:0 16px 8px 0;
 font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
th.c-total{padding:0 0 8px 16px;letter-spacing:.26em;width:160px}

td{padding:0 12px 0 0;text-align:right;white-space:nowrap;
 font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
td.c-name{position:sticky;left:0;z-index:1;text-align:left;padding:0;
 background:var(--grund);overflow:hidden;font-variant-numeric:normal}
td.c-jahr,td.c-total{padding:0 0 0 12px}
/* Die einzige senkrechte Linie im Blatt. Sie trennt die zwoelf Monate von der
   Spalte, die sie zusammenfasst — zwischen den Monaten steht keine, sonst
   waere das Blatt ein Gitter und der Rang laege wieder in Linien statt in der
   Schrift. */
th.c-jahr,td.c-jahr,th.c-total,td.c-total{border-left:1px solid var(--rMittel)}
th.c-name,td.c-name{white-space:nowrap}

/* Saldozeile — klebt unter dem Kopf */
tr.saldo td{position:sticky;z-index:2;height:56px;padding-bottom:8px;
 border-bottom:1px solid var(--rMittel);color:var(--tinte);
 font:500 17px/1 'Jost',sans-serif;
 font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
tr.saldo td.c-name{z-index:4;letter-spacing:.2em;text-transform:uppercase;white-space:nowrap}
tr.saldo td.c-jahr{font-size:18px}

/* Kategorie */
tr.kat td{height:54px;border-top:1px solid var(--rStark);vertical-align:bottom;
 padding-bottom:12px;color:var(--tinte);font:500 15px/1 'Jost',sans-serif;
 font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
tr.kat td.c-name{padding:0;font-variant-numeric:normal}
tr.kat td.c-jahr{font-size:16px}
.klapper{display:inline-flex;align-items:baseline;gap:14px;background:none;border:none;
 padding:0;cursor:pointer;color:var(--tinte);font:500 15px/1 'Jost',sans-serif;
 letter-spacing:.26em;text-transform:uppercase;white-space:nowrap;text-align:left}
.chev{font:200 15px/1 'Jost',sans-serif;color:var(--mB);letter-spacing:0;flex:none}
.anzahl{font:300 12px/1 'Jost',sans-serif;color:var(--mC);margin-left:14px;letter-spacing:0}

/* Gruppe */
tr.grp td{height:40px;border-top:1px solid var(--rMittel);color:var(--tinte);
 font:400 14px/1 'Jost',sans-serif;
 font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
tr.grp td.c-name{padding:0 0 0 22px;font-variant-numeric:normal}
tr.grp td.c-jahr{font-weight:500}
tr.grp td.hak{font-weight:500}
tr.grp .klapper{gap:11px;padding:0;font:400 15px/1 'Jost',sans-serif;letter-spacing:.06em;
 text-transform:none}
tr.grp .chev{font-size:13px}
tr.grp .anzahl{margin-left:11px}

/* Position */
tr.pos td{height:34px;border-top:1px solid var(--rLeise);color:var(--sek);
 font:300 13.5px/1 'Jost',sans-serif;
 font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
tr.pos td.c-name{padding:0 0 0 40px;font:300 13.5px/1.2 'Jost',sans-serif;
 letter-spacing:.02em;color:var(--sek);font-variant-numeric:normal}
tr.pos td.hak{font-weight:500;color:var(--tinte)}
tr.pos td.c-jahr{font-weight:400;color:var(--tinte)}
tr.pos td.c-basis{color:var(--mA)}
/* Die geerbte Basis steht NACH der eigenen: beide Regeln wiegen gleich schwer,
   also entscheidet die Reihenfolge. Umgekehrt bekaeme auch die geerbte Basis
   Muted A und waere von der eigenen nicht mehr zu unterscheiden. */
tr.pos td.geerbt{font-weight:200;color:var(--mC)}
tr.pos.tief td.c-name{padding-left:56px}
.korrmarke{font:300 10px/1 'Jost',sans-serif;letter-spacing:.16em;text-transform:uppercase;
 color:var(--tinte);margin-left:12px}

/* Summe und Summe stark */
tr.sum td{height:44px;border-top:1px solid var(--rStark);color:var(--tinte);
 font:400 14px/1 'Jost',sans-serif;
 font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
tr.sum td.c-name{padding:0 0 0 22px;font:400 11.5px/1 'Jost',sans-serif;letter-spacing:.24em;
 text-transform:uppercase;color:var(--mA);font-variant-numeric:normal}
tr.sum td.c-jahr{font-weight:500}
.marke{font:300 10px/1 'Jost',sans-serif;letter-spacing:.16em;text-transform:uppercase;
 color:var(--mC);margin-left:14px}
tr.sumstark td{height:64px;border-top:1px solid var(--rStark);color:var(--tinte);
 font:500 18px/1 'Jost',sans-serif;
 font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
tr.sumstark td.c-name{padding:0;font:500 19px/1 'Jost',sans-serif;letter-spacing:.24em;
 text-transform:uppercase;white-space:nowrap;font-variant-numeric:normal}
tr.sumstark td.c-jahr{font-size:19px}

/* Alle Jahre: Zwischenzeile */
tr.zwischen td{height:48px;border-top:1px solid var(--rMittel);color:var(--tinte);
 font:400 15px/1 'Jost',sans-serif;
 font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
tr.zwischen td.c-name{padding:0;font:400 12px/1 'Jost',sans-serif;letter-spacing:.24em;
 text-transform:uppercase;color:var(--mA);font-variant-numeric:normal}
tr.aufglied td{height:40px;border-top:1px solid var(--rLeise);color:var(--sek);
 font:300 13.5px/1 'Jost',sans-serif;
 font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
tr.aufglied td.c-name{padding:0 0 0 22px;font-variant-numeric:normal}
tr.stark17 td{height:64px;border-top:1px solid var(--rStark);color:var(--tinte);
 font:500 18px/1 'Jost',sans-serif;
 font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
tr.stark17 td.c-name{padding:0;font:500 17px/1 'Jost',sans-serif;letter-spacing:.24em;
 text-transform:uppercase;font-variant-numeric:normal}
/* Ein langer Versalname passt bei .24em nicht in 340 px und wuerde abgeschnitten.
   Lieber enger setzen als anschneiden — eine Beschriftung, die man nicht ganz
   lesen kann, ist keine. */
tr.stark17.eng td.c-name{font-size:15px;letter-spacing:.12em}

/* Rechnungen: Stand-Spalte ohne farbige Marke.
   «tr» steht mit im Selektor, damit die Spalte den Rangregeln der Zeile
   (tr.kat td, tr.pos td) vorgeht: die tragen zwei Namen wie diese hier und
   wuerden sonst allein durch ihre Stellung im Text gewinnen. */
tr td.c-stand{text-align:left;padding:0 0 0 12px;font:400 11px/1 'Jost',sans-serif;
 letter-spacing:.12em;color:var(--mA);font-variant-numeric:normal}
tr td.c-stand.bezahlt{font-weight:500;color:var(--tinte)}

/* ---------- Eingabefelder: unsichtbar, bis man sie anfasst ---------- */
.zelle,.namensfeld,.datumsfeld{background:none;border:none;padding:0;margin:0;
 font:inherit;color:inherit;letter-spacing:inherit;text-transform:inherit;
 font-variant-numeric:inherit;font-feature-settings:inherit;width:100%}
.zelle{text-align:right}
.namensfeld{text-align:left}
.datumsfeld{text-align:right}
.zelle:hover,.namensfeld:hover,.datumsfeld:hover{color:var(--tinte)}
/* Kreuzpeilung: Wer auf einer Zahl steht, soll sehen, zu welchem Monat und zu
   welcher Zeile sie gehoert. Beides wird heller — keine Flaeche, keine Linie,
   nur Text, der auf Tinte geht. Das ist die Hover-Regel der Formensprache,
   angewandt auf zwei Stellen statt auf eine. */
thead th.peil{color:var(--tinte)}
tr td.c-name.peil{color:var(--tinte)}
/* Wo man steht, wird an der ZELLE gezeigt. Bis hierher war es eine Linie von
   einem Pixel unter der Zahl — auf 34 px Zeilenhoehe und in Muted A ist die
   nicht zu finden. Der Ring in Tinte ist ohnehin das, was die Formensprache
   fuer den Fokus vorschreibt; er sitzt an der Zelle und nicht am Eingabefeld,
   denn gefragt ist, wo die Zelle anfaengt, nicht wie breit das Feld ist.
   Nach innen versetzt, damit er nicht in die Nachbarzelle ragt. */
.zelle:focus,.namensfeld:focus,.datumsfeld:focus{outline:none;color:var(--tinte)}
td:has(.zelle:focus),td:has(.namensfeld:focus),
td:has(.datumsfeld:focus),td:has(.standwahl:focus){
 outline:1px solid var(--tinte);outline-offset:-1px}
.standwahl{background:none;border:none;padding:0;font:inherit;color:inherit;
 letter-spacing:inherit;text-transform:inherit;cursor:pointer;width:100%;
 -webkit-appearance:none;appearance:none}
.standwahl:focus{outline:none;box-shadow:inset 0 -1px 0 var(--tinte)}
.standwahl option{background:var(--grund);color:var(--tinte)}
.namenszeile{display:flex;align-items:center;min-width:0}
tr.kat td.c-name .namenszeile{align-items:baseline;padding-bottom:12px}
tr.kat td.c-name .namensfeld{font:500 15px/1 'Jost',sans-serif;letter-spacing:.26em;
 text-transform:uppercase;color:var(--tinte)}
tr.kat td.c-name .klapper+.namensfeld{margin-left:14px}
.werkzeug{opacity:0;display:inline-flex;gap:8px;margin-left:10px;flex:none}
tr:hover .werkzeug,tr:focus-within .werkzeug{opacity:1}
.griff,.weg,.plus{background:none;border:none;padding:0 2px;cursor:pointer;color:var(--mC);
 font:300 12px/1 'Jost',sans-serif;line-height:1}
.plus{font-size:14px}
.griff{cursor:grab}
.griff:hover,.weg:hover,.plus:hover{color:var(--tinte)}
tr.ziel td{box-shadow:inset 0 2px 0 var(--tinte)}
.neusteller{background:none;border:none;padding:0;margin:22px 0 0;cursor:pointer;
 font:400 11px/1 'Jost',sans-serif;letter-spacing:.2em;text-transform:uppercase;color:var(--mC)}
.neusteller:hover{color:var(--tinte)}

/* ---------- Fusszeile ---------- */
.fusszeile{display:flex;align-items:center;gap:26px;padding:0 54px;height:44px;
 border-top:1px solid var(--rStark);flex:none}
.fusszeile .claim{font:400 10px/1 'Jost',sans-serif;letter-spacing:.34em;
 text-transform:uppercase;color:var(--mA)}
.fusszeile .ver{font:300 11.5px/1 'Jost',sans-serif;letter-spacing:.1em;color:var(--mC);
 font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
.fusszeile .rechts{margin-left:auto;font:300 11.5px/1 'Jost',sans-serif;letter-spacing:.06em;
 color:var(--mC)}

/* ---------- Kopf und Fuss fuer Papier und Export ---------- */
.druckkopf,.druckfuss{display:none}
.druckkopf,.expkopf{align-items:baseline;gap:18px;padding-bottom:14px;
 border-bottom:1px solid var(--tinte)}
.druckfuss,.expfuss{align-items:baseline;gap:20px;padding-top:14px;
 border-top:1px solid var(--tinte);font:300 10.5px/1 'Jost',sans-serif;letter-spacing:.1em;
 color:var(--ruhig)}
.druckfuss b,.expfuss b{font-weight:500;color:var(--tinte)}
.dkWort{font:300 22px/1 'Jost',sans-serif;letter-spacing:.26em;text-transform:uppercase;
 color:var(--tinte)}
.dkTitel{font:500 15px/1 'Jost',sans-serif;letter-spacing:.06em;color:var(--tinte)}
.dkStich{font:300 12px/1 'Jost',sans-serif;letter-spacing:.1em;color:var(--ruhig)}
.dkRechts{margin-left:auto;font:300 11px/1 'Jost',sans-serif;letter-spacing:.1em;color:var(--mC);
 font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
.dfRechts{margin-left:auto}

/* ---------- Leerzustand ---------- */
.leerraum{flex:1;padding:32px 54px;display:flex;flex-direction:column;justify-content:center;
 max-width:640px}
.leerraum h2{margin:0 0 14px;font:300 30px/1.1 'Jost',sans-serif;letter-spacing:.01em;
 color:var(--tinte)}
.leerraum p{margin:0 0 26px;font:300 14px/1.6 'Jost',sans-serif;color:var(--ruhig)}
.leerraum .reihe{display:flex;gap:12px}

/* ---------- Der eingefrorene HTML-Export ---------- */
[data-view]{display:flex;flex-direction:column;height:100vh;padding:38px 40px}
[data-view] .expkopf{display:flex;flex:none}
[data-view] .expfuss{display:flex;flex:none;margin-top:auto}
/* Im Export gibt es kein Rollfeld — dort rollt das Blatt wieder selbst, und
   die Spaltenkoepfe kleben ganz oben, weil keine Kopfzeile darueber steht. */
[data-view] .blatt{flex:1;min-height:0;overflow:auto;padding:0;margin-top:4px}
[data-view] th{top:0}
[data-view] table{min-width:0 !important}
[data-view] th.c-name{width:210px}
[data-view] th.c-basis{width:74px}
[data-view] th.c-jahr{width:92px;letter-spacing:.12em}
[data-view] th.c-datum{width:82px}
[data-view] th.c-betrag,[data-view] th.c-saldo{width:78px}
[data-view] th.c-stand{width:104px}
[data-view] th.c-total{width:110px}
[data-view] th,[data-view] thead td{background:var(--grund)}
.expnav{display:flex;align-items:flex-end;gap:44px;padding:16px 0 12px;flex:none}
.expnav .jgs,.expnav .anss{display:flex;align-items:flex-end;gap:20px}
.expnav .anss{margin-left:auto;gap:28px}
[data-ziel],[data-klapp-ex]{cursor:pointer}

/* ---------- Dialoge ---------- */
.schleier{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40;display:flex;
 align-items:center;justify-content:center;padding:24px}
.dialog{width:660px;max-width:100%;max-height:92vh;overflow:auto;background:var(--grund);
 border:1px solid var(--rStark);display:flex;flex-direction:column}
.dialog.gross{width:820px}
.dkoerper{padding:26px 28px 22px}
.dtitel{display:flex;align-items:baseline;gap:14px;margin-bottom:24px}
.dtitel h2{margin:0;font:300 26px/1 'Jost',sans-serif;letter-spacing:.02em;color:var(--tinte)}
.dbei{font:400 10px/1 'Jost',sans-serif;letter-spacing:.24em;text-transform:uppercase;color:var(--mC)}
.mlabel{font:400 10px/1 'Jost',sans-serif;letter-spacing:.24em;text-transform:uppercase;
 color:var(--mC);margin-bottom:11px;display:block}
.dsatz{font:300 13px/1.6 'Jost',sans-serif;color:var(--ruhig);max-width:560px;margin:0}
.dfuss{display:flex;align-items:center;gap:26px;padding:16px 28px;border-top:1px solid var(--rMittel)}
.ab{background:none;border:none;padding:0;cursor:pointer;
 font:400 11px/1 'Jost',sans-serif;letter-spacing:.2em;text-transform:uppercase;color:var(--mC)}
.ab:hover{color:var(--sek)}
.ter{background:none;border:none;padding:0;cursor:pointer;
 font:400 11px/1 'Jost',sans-serif;letter-spacing:.2em;text-transform:uppercase;color:var(--tinte)}
.tat{display:flex;align-items:center;height:38px;padding:0 20px;background:none;
 border:1px solid var(--tinte);cursor:pointer;
 font:500 11px/1 'Jost',sans-serif;letter-spacing:.2em;text-transform:uppercase;color:var(--tinte)}
.rechtsweg{margin-left:auto}
.jboxen{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.jbox{display:flex;align-items:center;justify-content:center;width:74px;height:38px;
 background:none;border:1px solid var(--rMittel);cursor:pointer;
 font:200 15px/1 'Jost',sans-serif;letter-spacing:.06em;color:var(--mC);
 font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
.jbox.an{border-color:var(--tinte);font-weight:500;color:var(--tinte)}
.schnell{display:flex;gap:20px;font:400 10px/1 'Jost',sans-serif;letter-spacing:.2em;
 text-transform:uppercase;color:var(--mC);margin-bottom:26px}
.schnell button{background:none;border:none;padding:0;cursor:pointer;font:inherit;
 letter-spacing:inherit;text-transform:inherit;color:inherit}
.schnell button.an{color:var(--tinte);font-weight:500}
.hakenliste{display:flex;flex-direction:column;gap:13px;margin-bottom:24px}
.haken{display:flex;align-items:center;gap:11px;background:none;border:none;padding:0;
 cursor:pointer;text-align:left;font:300 14px/1.35 'Jost',sans-serif;color:var(--mC)}
.haken.an{color:var(--tinte)}
.kasten{width:12px;height:12px;border:1px solid var(--rStark);flex:none}
.haken.an .kasten{background:var(--tinte);border-color:var(--tinte)}
.kreiswahl{display:flex;flex-direction:column;gap:15px;margin-bottom:26px}
.kreiszeile{display:flex;align-items:center;gap:12px;background:none;border:none;padding:0;
 cursor:pointer;text-align:left;font:300 14px/1.35 'Jost',sans-serif;color:var(--tinte)}
.kreis{width:12px;height:12px;border:1px solid var(--rStark);border-radius:50%;flex:none}
.kreiszeile.an .kreis{background:var(--tinte);border-color:var(--tinte)}
.kreiszeile b{font-weight:500}
.vorschau{width:100%;border-collapse:separate;border-spacing:0;table-layout:fixed}
.vorschau th{position:static;height:auto;padding:0 0 7px;text-align:right;
 font:400 10px/1 'Jost',sans-serif;letter-spacing:.14em;text-transform:none;color:var(--mC);
 border-bottom:1px solid var(--rStark);background:none}
.vorschau td{padding:11px 0 0;text-align:right;font:300 13px/1 'Jost',sans-serif;color:var(--faint)}
.vorschau td.belegt{font-weight:500;color:var(--tinte)}
.korrkopf,.korrzeile{display:grid;grid-template-columns:120px 1fr 90px 18px;gap:0 16px;
 align-items:baseline}
.korrkopf{font:400 10px/1 'Jost',sans-serif;letter-spacing:.24em;text-transform:uppercase;
 color:var(--mC);padding-bottom:9px;border-bottom:1px solid var(--rStark)}
.korrkopf span:first-child,.korrkopf span:last-child{text-align:right}
.korrzeile{padding:14px 0;border-bottom:1px solid var(--rLeise)}
.korrliste{max-height:38vh;overflow:auto}
.korrzeile .betrag{text-align:right;font:400 15px/1 'Jost',sans-serif;color:var(--tinte);
 font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1;
 background:none;border:none;padding:0;width:100%}
.korrzeile .notiz{font:300 14px/1.4 'Jost',sans-serif;color:var(--tinte);
 background:none;border:none;padding:0;width:100%}
.korrzeile .betrag:focus,.korrzeile .notiz:focus{outline:none;box-shadow:inset 0 -1px 0 var(--tinte)}
.korrzeile .wirkt{text-align:right;font:400 10px/1 'Jost',sans-serif;letter-spacing:.2em;
 text-transform:uppercase;color:var(--mC);background:none;border:none;padding:0}
/* Nur der Umschalter der neuen Zeile ist ein Knopf; die Angabe an einer
   bestehenden Zeile ist Text. */

/* ---------------------------------------------------------------------------
   Papier. Hell ist keine zweite Fassung des Werkzeugs, sondern die Fassung
   fuer den Druck — den Schalter im Kopf gibt es nicht mehr.
--------------------------------------------------------------------------- */
@page{size:A4 landscape;margin:10mm}
@media print{
 :root{
  --grund:#ffffff;    /* Papier ist weiss; ein flaechiges Grau kostet Toner und
                         wird von den meisten Browsern ohnehin nicht gedruckt */
  --umgebung:#dcdedf;
  --tinte:#1d1f20; --sek:#3f4244; --ruhig:#5c6062;
  --mA:#6b6f71; --mB:#707476; --mC:#7c8082;
  --rStark:#979b9d; --rMittel:#c6c9ca; --rLeise:#e3e5e6; --faint:#a8acae;
 }
 html,body{height:auto;overflow:visible;background:#fff}
 .kopf1,.kopf2,.band,.fusszeile,.schleier,.werkzeug,.plus,.neusteller{display:none !important}
 .druckkopf{display:flex}
 .druckfuss{display:flex;margin-top:16px}
 #rollfeld{overflow:visible;display:block}
 .kopf2{position:static}
 /* «tr.saldo td» wiegt schwerer als «th,thead td» weiter oben und bleibt sonst
    klebend — mit einer Kante, die das Skript fuers Fenster gesetzt hat. Auf
    Papier gibt es nichts, woran etwas kleben koennte; die Zeile steht dort
    einfach unter dem Kopf. */
 tr.saldo td{position:static}
 .blatt{overflow:visible;padding:0;flex:none}
 /* Der Kopf klebt am Bildschirm; auf Papier steht er einfach oben, und die
    Saldozeile steht direkt darunter. */
 th,thead td,td.c-name{position:static}
 th,thead td,td.c-name{background:transparent}
 table{margin-top:6px;min-width:0 !important}
 th.c-name{width:210px}
 th.c-basis{width:74px}
 th.c-jahr{width:92px;letter-spacing:.12em}
 th.c-datum{width:82px}
 th.c-betrag,th.c-saldo{width:78px}
 th.c-stand{width:104px}
 th.c-total{width:110px}
 th{height:auto;padding:10px 8px 7px 0;font-size:9px;letter-spacing:.16em;
  border-bottom:1px solid var(--tinte);color:var(--ruhig)}
 th.stich{font:500 10px/1 'Jost',sans-serif;letter-spacing:.16em;color:var(--tinte)}
 th.c-name{padding:10px 0 7px}
 th.c-jahr,th.c-stand,th.c-total{padding:10px 0 7px 8px}
 td{padding:0 8px 0 0}
 td.c-jahr,td.c-total{padding:0 0 0 8px}
 tr.saldo td{height:auto;padding:14px 8px 12px 0;font-size:14px;
  border-bottom:1px solid var(--rMittel)}
 tr.saldo td.c-name{padding:14px 0 12px}
 tr.saldo td.c-jahr{font-size:14px;padding:14px 0 12px 8px}
 tr.kat td{height:auto;padding:11px 8px 9px 0;font-size:11.5px;border-top:1px solid var(--tinte)}
 tr.kat td.c-name{padding:11px 0 9px;font-size:12px;letter-spacing:.22em}
 tr.kat td.c-jahr{font-size:12px;padding:11px 0 9px 8px}
 /* Auf Papier stehen Name und Zahlen einer Kategoriezeile auf derselben Linie:
    der Bodenabstand des Knopfes schoebe den Namen sonst eine Zeile hoch. */
 tr.kat td{vertical-align:middle;padding-bottom:9px}
 tr.kat td.c-name .namenszeile{padding-bottom:0;align-items:center}
 tr.kat .klapper{padding:0;font:500 12px/1 'Jost',sans-serif;letter-spacing:.22em;
  text-transform:uppercase}
 tr.grp .klapper{padding:0;font:400 12px/1 'Jost',sans-serif;letter-spacing:.02em}
 /* Chevron, Zaehler und Beisatz sind Bedienhilfen — auf Papier bedient niemand. */
 .chev,.anzahl,.marke,.korrmarke{display:none}
 tr.grp td{height:auto;padding:8px 8px 7px 0;font-size:11px;border-top:1px solid var(--rMittel)}
 tr.grp td.c-name{padding:8px 0 7px 18px;font-size:12px}
 tr.grp td.c-jahr{padding:8px 0 7px 8px}
 tr.pos td{height:auto;padding:8px 8px 7px 0;font-size:11px;border-top:1px solid var(--rLeise);
  color:var(--tinte)}
 tr.pos td.c-name{padding:8px 0 7px 18px;font-size:11.5px;line-height:1.2;color:var(--tinte)}
 tr.pos td.c-jahr{padding:8px 0 7px 8px}
 tr.sum td{height:auto;padding:9px 8px 8px 0;font-size:11px;border-top:1px solid var(--tinte)}
 tr.sum td.c-name{padding:9px 0 8px;font-size:11px;letter-spacing:.2em;color:var(--ruhig)}
 tr.sum td.c-jahr{padding:9px 0 8px 8px}
 tr.sumstark td,tr.stark17 td{height:auto;padding:13px 8px 11px 0;font-size:13px;
  border-top:1px solid var(--tinte)}
 tr.sumstark td.c-name,tr.stark17 td.c-name{padding:13px 0 11px;font-size:14px;letter-spacing:.22em}
 tr.sumstark td.c-jahr,tr.stark17 td.c-total{font-size:13.5px;padding:13px 0 11px 8px}
 tr.zwischen td,tr.aufglied td{height:auto;padding:8px 8px 7px 0;font-size:11px}
 /* Eine Kategorie- oder Gruppenzeile am Seitenfuss, deren Zeilen auf der
    naechsten Seite stehen, ist eine Ueberschrift ohne Text. */
 tr.kat,tr.grp,tr.saldo,tr.sumstark,tr.stark17{break-inside:avoid;break-after:avoid}
 tr.pos,tr.sum,tr.zwischen,tr.aufglied{break-inside:avoid}
 .zelle,.namensfeld,.datumsfeld,.standwahl{color:var(--tinte)}
 .korrmarke{color:var(--sek)}
}
</style>
