   auch fuer Kommentare. */
table.gross .n{font-size:11.5px;padding:0 5px}
table.gross td.bearbeitbar input{font-size:11.5px;padding:0 4px}
table.gross tr.zeile-gesamt > td,table.gross thead tr.zeile-frei td{font-size:12px}
/* 84 statt 78 px je Monat, dafuer die Spalte Zahlungsweg von 126 auf 108 px.
   Damit bleibt die Gesamtbreite unter der eines 1600-px-Fensters und die
   Tabelle rollt weiterhin nicht seitlich. Ohne Netz greift die Fallback-
   Schrift, die breiter baut als IBM Plex Mono - danach ist gemessen. */
.t-budget{--w2:108px;--w3:84px}
table.gross th.n,table.gross td.n,table.gross td.bearbeitbar{min-width:84px;max-width:84px}
table.gross th:last-child,table.gross td:last-child{min-width:100px;max-width:100px}
.t-verbind th.n,.t-verbind td.n,.t-verbind td.bearbeitbar{min-width:84px;max-width:84px}
.t-rechnung th.n,.t-rechnung td.n{min-width:98px;max-width:98px}
.t-rechnung th:last-child,.t-rechnung td:last-child{min-width:130px;max-width:130px}
/* Beschreibender Text darf mit Auslassungspunkten enden - eine Zahl nie. */
table.gross td.zahlung{overflow:hidden;text-overflow:ellipsis}

/* --- Zwischenueberschrift in der Sektion Schulden --------------------
   Vorhandenes Bauteil aus dem Mockup, hier mit Summe und Ratenzahl. */
.sektion .untertitel{margin:16px 0 9px;align-items:baseline}
.sektion .untertitel:first-of-type{margin-top:0}
.sektion .untertitel .num{color:var(--ink);font-size:13px}
.sektion .untertitel span:last-child{color:var(--muted);font-size:11.5px;margin-left:auto}
.sektion .untertitel + .raster{margin-bottom:4px}

/* --- Ablegeflaeche nimmt eine Datei entgegen (A-56) --- */
.ablegeflaeche{cursor:pointer}
.ablegeflaeche:hover,.ablegeflaeche.drueber{border-color:var(--accent);color:var(--ink)}
.ablegeflaeche b{color:var(--ink);font-weight:600}

/* ===================================================================
   U — Spaltenbreiten des Umbaus. Steht bewusst am Ende: die Breiten
   der Zahlenspalten werden weiter oben zweimal gesetzt, und die
   Faltspalte muss beide Male gewinnen.
   =================================================================== */
table.gross th.faltzelle,table.gross td.faltzelle,
.t-verbind th.faltzelle,.t-verbind td.faltzelle{
  width:28px;min-width:28px;max-width:28px;padding:0;overflow:hidden}
/* Bleibt Platz uebrig, bekommen ihn die Zahlenspalten — aber gerechnet,
   nicht vom Browser proportional verteilt. Sonst wuchs ausgerechnet die
   Namensspalte am staerksten, und die fixierten Spalten stimmten beim
   Seitwaertsrollen nicht mehr mit ihren left-Werten ueberein (U-4).
   Die ersten drei Spalten behalten ihre Breite auf den Pixel. */
table.gross th.n:nth-child(n+4),table.gross td.n:nth-child(n+4),
table.gross td.bearbeitbar:nth-child(n+4){min-width:var(--wz,84px);max-width:var(--wz,84px)}
table.gross th.faltzelle,table.gross td.faltzelle{
  width:28px !important;min-width:28px !important;max-width:28px !important}
table.gross th:last-child,table.gross td:last-child{min-width:var(--wl,100px);max-width:var(--wl,100px)}
/* Auf den Inhalt gemessen — mit der Fallback-Schrift, die breiter baut. */
.t-budget{--w1:208px;--w2:112px;--w3:78px}
.t-verbind{--w1:226px;--w2:86px;--w3:80px}
table.fixiert th:nth-child(1),table.fixiert td:nth-child(1){min-width:var(--w1);max-width:var(--w1)}
table.fixiert th:nth-child(2),table.fixiert td:nth-child(2){min-width:var(--w2);max-width:var(--w2)}
table.fixiert th:nth-child(3),table.fixiert td:nth-child(3){min-width:var(--w3);max-width:var(--w3)}

/* ===================================================================
   U-25 — Vollbild fuer die Tafel
   -------------------------------------------------------------------
   Eine Klasse am Rahmen, sonst nichts. Kein zweiter Seitenaufbau, kein
   Umhaengen von Knoten: was weicht, weicht mit display:none, und alles
   darunter — Blatt, Dialog, Rueckgaengig-Leiste — bleibt unberuehrt an
   seiner Stelle. Damit ist der Rueckweg dieselbe Klasse weniger und
   kann nicht halb misslingen.
   =================================================================== */
.rahmen.vollbild .seitenleiste,
.rahmen.vollbild .kopfzeile{display:none}
/* Der Rand von zwanzig Pixel kostet vierzig Pixel Breite. Genau die holt
   man sich mit dem Vollbild, also faellt er hier mit. Die Tafel verliert
   dabei ihre Rundung: eine abgerundete Ecke am Fensterrand sieht aus wie
   ein Fehler, nicht wie eine Karte. */
.rahmen.vollbild .inhalt[data-modus="tabellen"]{padding:0}
.rahmen.vollbild .tafel{border-radius:0;border-left:none;border-right:none;border-top:none}
/* Der Titel gibt seinen Dehnplatz an die Kennzahlen ab — sie gehoeren
   neben ihn und nicht ans andere Ende zu den Schaltern. */
.rahmen.vollbild .tafel-kopf .titel{margin-right:0}
.tafel-kopf .kopfband{margin-right:auto;gap:18px}
.tafel-kopf .kopfband .wert .v{font-size:13.5px}
#btnVollbild{font-size:14px;line-height:1;padding-left:9px;padding-right:9px}

/* ===================================================================
   U-25 — Greifer fuer die Spaltenbreiten
   -------------------------------------------------------------------
   Sechs Pixel auf der Trennlinie der Kopfzelle, wie in jeder
   Tabellenkalkulation. Unsichtbar, bis der Zeiger darauf steht: zwanzig
   dauerhafte Striche mehr im Kopf machen die Tabelle unruhiger, als sie
   an Auffindbarkeit gewinnen — gesucht wird der Greifer ohnehin dort,
   wo man ihn kennt. Die Kopfzellen sind bereits sticky und damit
   positioniert; der Greifer haengt sich absolut an sie und wandert
   deshalb beim Seitwaertsrollen mit ihrer Spalte.
   =================================================================== */
.greifer{position:absolute;top:0;right:0;width:6px;height:100%;z-index:2;
  cursor:col-resize;background:transparent;border:none;padding:0;touch-action:none}
.greifer:hover,.greifer:focus-visible{background:var(--accent);outline:none}
/* Waehrend des Zugs gehoert der Zeiger dem Zug — auch ueber fremden
   Zellen. Ohne die Sperre markiert der Browser unterwegs Kopftext. */
body.zieht,body.zieht *{cursor:col-resize !important;user-select:none}


/* ===================================================================
   U-32 — FARBWELT UND BUDGETTAFEL, ZWEITE FASSUNG
   -------------------------------------------------------------------
   Steht am Ende, damit sie ohne Eingriff in die Regeln darueber gilt.
   Anthrazit-Blau statt Nacht-Braun, Minze statt Orange; die Farben der
   Betraege bleiben, wie sie sind: Minze fuer Plus, Rose fuer Minus.
   =================================================================== */
:root{
  --bg:#0c0f13; --card:#12161c; --sheet:#151b23; --soft:#1b2531;
  --line:#1d232b; --rule:#2a3542; --ink:#f2f5f8; --muted:#8b95a2;
  --accent:#8ee6c8; --onaccent:#0c0f13;
  --ok:#8ee6c8; --err:#f0a08d; --open:#e3c98d;
  --hairline:#151b23;
}
body{font-family:'Space Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif}
.marke{letter-spacing:.02em}
.knopf.primaer:hover{filter:brightness(1.08)}
tr:hover td.bearbeitbar input::placeholder,
td.bearbeitbar input:focus::placeholder{color:#3d4753}

/* ---- Budgettafel: eine fixierte Spalte statt drei ------------------ */
.t-budget{--w1:268px}
.t-budget tbody td:nth-child(2),.t-budget tbody td:nth-child(3){position:static;left:auto;border-right:none}
.t-budget thead th:nth-child(2),.t-budget thead th:nth-child(3),
.t-budget thead td:nth-child(2),.t-budget thead td:nth-child(3){left:auto;border-right:none}
.t-budget th:nth-child(1),.t-budget td:nth-child(1){border-right:1px solid var(--rule)}
.t-budget th.n:nth-child(n+2),.t-budget td.n:nth-child(n+2),
.t-budget td.bearbeitbar:nth-child(n+2){min-width:var(--wz,96px);max-width:var(--wz,96px)}
.t-budget th:last-child,.t-budget td:last-child{min-width:var(--wl);max-width:var(--wl)}
/* Die alte Regel hob die dritte Spalte (Soll) hervor — dort steht jetzt ein Monat. */
.t-budget tr.zeile-daten td:nth-child(3){color:var(--muted)}
.t-budget tr.zeile-daten:hover td:nth-child(3){color:var(--ink)}

/* ---- Der gewonnene Platz geht in die Lesbarkeit ------------------- */
.t-budget .n{font-size:12.5px;padding:0 9px}
.t-budget td.bearbeitbar input{font-size:12.5px;padding:0 9px}
.t-budget tr.zeile-daten > td{height:32px}

/* ---- Laufender Monat als durchgehendes Band ----------------------- */
.t-budget td.jetzt{background:rgba(142,230,200,.05)}
.t-budget thead th.jetzt,.t-budget thead td.jetzt{background:#17232b}
.t-budget thead th.jetzt{color:var(--accent)}

/* ---- Aktive Zelle: eine, deutlich ---------------------------------- */
td.bearbeitbar:focus-within{background:var(--bg);box-shadow:inset 0 0 0 2px var(--accent)}
td.bearbeitbar input:focus{outline:none;color:#fff;font-weight:500}

/* ---- Zahlungsweg: nur beim Ueberfahren der Zeile ------------------- */
.t-budget .namenszelle .weg{opacity:0;transition:opacity .12s}
.t-budget tr:hover .namenszelle .weg,
.t-budget tr:focus-within .namenszelle .weg{opacity:1}
.katkonto{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--muted);margin-left:8px}

/* ---- Fähnchen an der aktiven Zelle -------------------------------- */
.zellfahne{
  position:fixed;z-index:140;display:flex;align-items:center;gap:11px;white-space:nowrap;
  background:#1d2a2f;border:1px solid #2f4a4a;border-radius:7px;padding:6px 11px;
  box-shadow:0 10px 24px -14px rgba(0,0,0,.95);pointer-events:none;
}
.zellfahne b{font-size:11.5px;font-weight:500;color:#fff}
.zellfahne .mo{font-size:11.5px;color:var(--muted)}
.zellfahne .num{font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--muted)}
.zellfahne .taste{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--accent)}

/* ---- Zeilenfarben: an die ZEILE, nicht an die Zellen ----------------
   Die alte Regel deckte die ersten DREI Zellen mit der Tafelfarbe, weil drei
   Spalten fixiert waren. In der Budgettafel ist nur noch eine fixiert — Jan
   und Feb bekamen die Deckfarbe der Namensspalte und die Kategoriezeile
   wurde zweifarbig. Also: die Zeile traegt die Farbe, die Zellen sind
   durchsichtig, und die fixierte erste Spalte erbt sie (sie muss deckend
   bleiben, weil sie beim Rollen ueber die anderen gleitet). */
.t-budget tbody tr{background:var(--card)}
.t-budget tbody tr.zeile-kat{background:var(--soft)}
.t-budget tbody tr.zeile-leerfalt{background:#141a21}
.t-budget tbody tr.zeile-daten:hover{background:var(--soft)}
table.gross.t-budget tbody td:nth-child(n+2){background:transparent}
table.gross.t-budget tbody td:nth-child(1){background:inherit}
table.gross.t-budget tbody td.jetzt:nth-child(n+2){background:rgba(142,230,200,.05)}
table.gross.t-budget tbody tr.zeile-kat td.jetzt:nth-child(n+2){background:rgba(142,230,200,.1)}
table.gross.t-budget tbody tr.zeile-daten:hover td.jetzt:nth-child(n+2){background:rgba(142,230,200,.11)}

/* ---- Kennzahlenband: die wichtigste Zahl ist nicht die kleinste ---- */
.kennzahlen .v{font-size:19px !important}
.kennzahlen .k{font-size:10.5px;letter-spacing:.12em}

/* ===================================================================
   Kartenansichten (U-40). Streifen statt Zeilen: die Spaltenkante der
   Tabelle bleibt, die Karte kommt dazu. Grid statt table, damit eine
   Karte aufklappen kann, ohne die Spalten der anderen zu verschieben.
   =================================================================== */
.kansicht{display:flex;align-items:center;gap:10px}
.kansicht .schalter{display:flex;background:var(--bg);border:1px solid var(--line);
  border-radius:8px;padding:2px}
.kansicht .schalter button{padding:6px 14px;border:0;border-radius:6px;background:none;
  font:400 12px/1.4 'Space Grotesk',sans-serif;color:var(--muted);cursor:pointer}
.kansicht .schalter button[aria-pressed="true"]{background:var(--soft);color:var(--accent);font-weight:500}
.kansicht .schalter button:disabled{opacity:.4;cursor:not-allowed}

.kflaeche{padding:18px var(--edge) 26px}
.kgruppe{display:flex;align-items:baseline;gap:12px;padding:15px 14px 8px}
.kgruppe .t{font:600 12.5px/1 'Space Grotesk',sans-serif;color:var(--ink)}
.kgruppe .num{font:500 12.5px/1 'IBM Plex Mono',monospace;color:#dbe2ea}
.kgruppe .z{font:400 11px/1 'IBM Plex Mono',monospace;color:#757f8c}

/* Der Spaltenkopf über den Streifen — dieselbe Rasterdefinition wie die
   Streifen selbst, sonst wandert die Kante beim ersten Umbau auseinander. */
.kkopf{display:grid;align-items:center;height:30px;border-bottom:1px solid var(--line);
  font:400 10.5px/1 'IBM Plex Mono',monospace;letter-spacing:.12em;
  text-transform:uppercase;color:#757f8c}
.streifen{background:var(--card);border:1px solid var(--line);border-radius:10px;
  margin-bottom:6px;overflow:hidden}
.streifen>.reihe{display:grid;align-items:center;height:48px;cursor:pointer}
.streifen.offen{background:var(--sheet);border-color:var(--rule);
  box-shadow:0 0 0 1px rgba(142,230,200,.3)}
.streifen.offen>.reihe{height:52px}
.streifen:hover:not(.offen){border-color:var(--rule)}
.streifen .nam{padding-left:14px;display:flex;align-items:baseline;gap:10px;overflow:hidden}
.streifen .nam .chev{font:400 10px/1 'IBM Plex Mono',monospace;color:#5f6874}
.streifen.offen .nam .chev{color:var(--accent)}
.streifen .nam .t{font:400 14px/1 'Space Grotesk',sans-serif;color:#dbe2ea;white-space:nowrap}
.streifen.offen .nam .t{font-weight:500;color:#fff}
.streifen .nam .z{font:400 11px/1 'IBM Plex Mono',monospace;color:#757f8c;white-space:nowrap}
.streifen .nam .z.warn{color:var(--err)}
.streifen .n{text-align:right;font:400 13.5px/1 'IBM Plex Mono',monospace;color:#c3ccd6}
.streifen .n.gross{font:500 17px/1 'IBM Plex Mono',monospace;color:var(--ink)}
.streifen.offen .n.gross{font-size:18px;color:#fff}
.streifen .n.err{font-weight:500;color:var(--err)}
.streifen .n.leer{color:#5f6874}
.streifen .n.gespiegelt-wert{font-style:italic;color:#c3ccd6}
.streifen .tat{padding-right:14px;text-align:right}

/* Getilgt/Verbraucht: derselbe Balken wie auf der Kachel, nur liegend. */
.kbalken{padding-left:22px;display:flex;align-items:center;gap:10px}
.kbalken .bar{flex:1;height:4px;background:var(--soft);border-radius:2px;overflow:hidden}
.kbalken .bar>div{height:100%;background:var(--accent)}
.kbalken .p{font:400 11px/1 'IBM Plex Mono',monospace;color:var(--muted)}
.kspark{padding:0 26px}
.kspark svg{width:100%;height:22px;display:block}
.kspark polyline{fill:none;stroke:#5c8f80;stroke-width:1.4}
.streifen.offen .kspark polyline{stroke:var(--accent);stroke-width:1.6}
/* Jahresverlauf als zwölf Balken (Budget). Der laufende Monat leuchtet. */
.kjahr{padding:0 26px;display:flex;align-items:flex-end;gap:4px;height:26px}
/* U-44: gedeckelt. Bei zwoelf Monaten sind die Saeulen schmal, bei zwei
   Jahrgaengen wuerden aus denselben flex:1 zwei handbreite Bloecke — das
   liest sich als Fortschrittsbalken und nicht als Verlauf. */
.kjahr i{flex:1;max-width:22px;background:#2c4a44;border-radius:1px;min-height:2px}
.kjahr{justify-content:flex-start}
.kjahr i.kuenftig{background:#232b34}
.kjahr i.jetzt{background:var(--accent)}
.streifen .pfeil{font:400 12px/1 'IBM Plex Mono',monospace;color:#5f6874;text-align:center}

/* Der aufgeklappte Teil. Er sitzt IM Streifen, damit die Zeile beim
   Zuklappen an derselben Stelle stehen bleibt. */
.kauf{border-top:1px solid var(--rule);background:#0f141a;padding:15px 18px 16px}
.kauf .lab{font:400 10.5px/1 'IBM Plex Mono',monospace;letter-spacing:.12em;
  text-transform:uppercase;color:#757f8c}
.kauf .tat-reihe{display:flex;gap:8px;margin-top:14px}
.kauf .knopf{white-space:nowrap}

/* Monatsraster im aufgeklappten Streifen (Verbindlichkeiten, 12 Zellen). */
.mraster{display:grid;grid-template-columns:repeat(var(--mm,12),1fr);gap:1px;background:#1a2029;
  border:1px solid #1a2029;border-radius:7px;overflow:hidden;margin-top:9px}
.mraster>div{background:var(--card);padding:8px 4px;text-align:center}
.mraster .m{font:400 9.5px/1 'IBM Plex Mono',monospace;color:#757f8c}
.mraster .v{font:400 12.5px/1 'IBM Plex Mono',monospace;color:#c3ccd6;margin-top:5px}
.mraster>div.jetzt{background:#16202a;box-shadow:inset 0 0 0 1px rgba(142,230,200,.4)}
.mraster>div.jetzt .m{color:var(--accent)}
.mraster>div.jetzt .v{font-weight:500;color:#fff}

/* Positionsraster im aufgeklappten Streifen (Budget, Positionen × Monate). */
.praster{margin-top:12px}
/* U-41: Zeilenhoehe 40 statt 34, und KEINE Trennlinie mehr zwischen den
   Positionen. Zwoelf Spalten mal acht Zeilen mit einer Linie zwischen jeder
   ergeben ein Gitter, in dem der Text an den Linien klebt — gemessen stimmte
   die Ausrichtung, eng war der Rhythmus. Gefuehrt wird jetzt ueber einen
   sehr leisen Wechsel im Hintergrund, wie zebra() es in der Tabelle tut.
   Die einzige Linie im Raster steht dort, wo sie etwas trennt: ueber der
   Summe. */
.praster .r{display:grid;align-items:center;height:40px;
  font:400 13px/1 'IBM Plex Mono',monospace;color:#c3ccd6}
.praster .r[data-zeile]:nth-of-type(even){background:rgba(255,255,255,.016)}
.praster .r.kopf{height:28px;font:400 10px/1 'IBM Plex Mono',monospace;
  letter-spacing:.1em;text-transform:uppercase;color:#757f8c}
.praster .r.summe{height:42px;margin-top:7px;border-top:1px solid var(--rule);
  font-weight:500;color:#dbe2ea;background:none}
.praster .p{padding-left:22px;display:flex;align-items:baseline;gap:9px;overflow:hidden}
.praster .p .t{font:400 13.5px/1 'Space Grotesk',sans-serif;color:#dbe2ea;white-space:nowrap}
/* U-50: die kleine Datumszeile unter «Anfang» und «Ende». Sie sagt, auf
   welchen Tag sich der Saldo bezieht — ohne sie hiessen zwei Spalten
   dasselbe und meinten Verschiedenes. */
.praster .kopf .c .kl{display:block;font-size:9px;font-weight:400;color:var(--muted);
  letter-spacing:0;margin-top:1px;white-space:nowrap}
.praster .c.leer{color:var(--muted)}
/* ===================================================================
   U-50 — die Saldozeile und die gruene Buchung
   -------------------------------------------------------------------
   Beide Regeln zielen ausdruecklich auf `.saldo-r` und `.gebucht` und
   nicht auf `.praster .r` — dieselbe Klasse benutzt das aufgeklappte
   Kategorieraster im Budget, und was hier steht, gilt sonst dort mit.
   =================================================================== */
.praster .r.saldo-r{border-bottom:1px solid var(--hairline);padding-top:0;padding-bottom:5px}
.praster .r.saldo-r:hover{background:none}
.praster .r.saldo-r .p{padding-left:26px}
.praster .r.saldo-r .st{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.praster .r.saldo-r .c{font-size:11.5px;color:#9fb0c2;font-variant-numeric:tabular-nums}
/* Bis heute gerechnet, danach geplant — dieselbe Trennung wie die
   gestrichelte Linie im Verlauf, andere Bauteile. */
.praster .r.saldo-r .c.plan{color:#5b6b7c}
.praster .r.saldo-r .c.jetzt{color:var(--ink);font-weight:600}
/* Gruen heisst hier «dafuer gibt es eine Buchung». Ausnahme von der Regel
   «Gruen ist das positive Vorzeichen», mit Albrecht am 19.08.2026 so
   entschieden: In dieser Tabelle kommt kein positiver Betrag vor, die
   beiden Bedeutungen begegnen sich nie. Dokumentiert im Handbuch. */
.praster .c.gebucht{color:var(--ok)}
/* Der Text steht im Eingabefeld, nicht in der Zelle — die Zellfarbe allein
   faerbt also nichts. Und `.praster .c.bearbeitbar input` ist GENAUSO
   spezifisch wie `.praster .c.gebucht input`; bei Gleichstand gewinnt die
   spaetere Regel, und das war die graue. Deshalb hier eine Klasse mehr:
   `.c.bearbeitbar.gebucht` schlaegt `.c.bearbeitbar`, unabhaengig davon,
   wo im Stylesheet die beiden stehen. Auf die Reihenfolge zu bauen hiesse,
   dass der naechste Umbau die Farbe wieder ausknipst, ohne dass es jemand
   merkt. */
.praster .c.gebucht input,
.praster .c.bearbeitbar.gebucht input,
/* Auch im laufenden Monat: dort faerbt `.c.jetzt input` weiss, und weiss
   heisst «dieser Monat», nicht «gebucht». Die Hervorhebung des Monats
   traegt der Hintergrund — die Farbe der Zahl gehoert der Buchung. */
.praster .c.jetzt.gebucht input,
.praster .c.jetzt.bearbeitbar.gebucht input{color:var(--ok)}
.praster .p .weg{font:400 10.5px/1 'IBM Plex Mono',monospace;color:#757f8c;white-space:nowrap}
.praster .c{text-align:right;padding-right:12px}
.praster .c.jetzt{background:rgba(142,230,200,.06);color:#fff;height:100%;
  display:flex;align-items:center;justify-content:flex-end;gap:7px}
/* U-41: Der Rahmen je Zelle ist raus. Bei acht Positionen stossen acht
   Rahmen aneinander und ergeben einen durchgehenden roten Kasten — dieselbe
   Klebrigkeit wie bei den Trennlinien, nur in Alarmfarbe. Der Hintergrund
   allein sagt dasselbe und laesst die Spalte eine Spalte bleiben. */
.praster .c.jetzt.hatoffen{background:rgba(240,160,141,.12)}
.praster .c .pkt{width:5px;height:5px;border-radius:50%;background:var(--accent)}
.praster .c.hatoffen .pkt{background:none;border:1px solid var(--err)}
.praster .j{text-align:right;padding-right:22px;color:var(--ink)}
.praster .fuss{display:flex;align-items:center;gap:14px;padding:11px 0 0;
  border-top:1px solid var(--line);margin-top:2px;
  font:400 11.5px/1 'IBM Plex Mono',monospace;color:#757f8c}
.praster .fuss .leg{display:flex;align-items:center;gap:6px}

/* Das Band über den Karten: budgetiert und nicht gebucht. */
.offenband{background:#1a1c1c;border:1px solid #3a2f2b;border-radius:10px;
  padding:14px 18px 15px;margin-bottom:20px}
.offenband .kopf{display:flex;align-items:center;gap:14px;margin-bottom:12px}
.offenband .kopf .lab{font:400 10.5px/1 'IBM Plex Mono',monospace;letter-spacing:.14em;
  text-transform:uppercase;color:var(--err)}
.offenband .kopf .sum{font:500 20px/1 'IBM Plex Mono',monospace;color:#fff}
.offenband .kopf .z{font:400 11.5px/1 'IBM Plex Mono',monospace;color:var(--muted)}
.offenband .kopf .hin{margin-left:auto;font:400 11.5px/1 'IBM Plex Mono',monospace;color:#757f8c}
.offenband .posten{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.offenband .posten>div{display:flex;align-items:center;gap:12px;background:var(--card);

.offenband .posten .n{font:500 17px/1 'IBM Plex Mono',monospace;color:#fff}

.k-verbind .kkopf,.k-verbind .streifen>.reihe{
  grid-template-columns:360px 130px 118px 190px 140px 1fr 54px}
.k-verbind .praster .r{grid-template-columns:var(--pgrid)}
.k-budget .kkopf,.k-budget .streifen>.reihe{
  grid-template-columns:360px 108px 108px 108px 170px 118px 1fr 34px}
.k-budget .praster .r{grid-template-columns:280px repeat(12,1fr) 100px}

/* Halbbreit: die Spalten fallen weg, die Karte wird zweizeilig (Bild 6b).
   Kein eigener Bauplan — dieselben Bausteine, anders gestapelt. */
@media (max-width:1200px){
  .k-verbind .kkopf,.k-budget .kkopf{display:none}
  .k-verbind .streifen>.reihe,.k-budget .streifen>.reihe{
    display:flex;flex-wrap:wrap;align-items:baseline;gap:9px;height:auto;padding:11px 14px 12px}
  .streifen .nam{padding-left:0;flex:1 1 100%}
  .streifen .n.gross{margin-left:auto}
  .kbalken{flex:1 1 100%;padding-left:0}
  .kspark,.kjahr,.streifen .pfeil{display:none}
  .streifen .tat{padding-right:0}
  .offenband .posten{grid-template-columns:1fr}
  .praster .r{grid-template-columns:1fr}
  .praster .c,.praster .j{text-align:left;padding:0}
  /* Statt der zwölf Spalten die Monatstafel — vier mal drei. */
  .mraster{grid-template-columns:repeat(4,1fr)}
}
/* ===================================================================
   Eingabefelder in den Karten (U-41). Lesen und Eintragen sind nicht
   mehr zwei Ansichten: die Zelle, die den Wert zeigt, nimmt ihn auch
   entgegen. Der Feldrahmen bleibt unsichtbar, bis die Maus darauf steht
   — sonst wird aus einem Raster ein Formular mit vierzehn Kaesten.
   =================================================================== */
/* U-44: Das ganze Raster kommt als eine Variable von der Funktion, nicht als
   zwei. Eine auf 0 gesetzte Soll-Spur zaehlt im Grid weiter mit — die Kopf-
   zeile hat in «Alle Jahre» aber gar keine Soll-Zelle, und damit rutschte
   jede Zelle eine Spur nach links. */
.k-budget .praster .r{grid-template-columns:var(--pgrid)}
.praster .c.bearbeitbar,.mraster>div.bearbeitbar{padding:0}
.praster .c.bearbeitbar input{width:100%;height:34px;display:block;background:none;
  border:1px solid transparent;border-radius:5px;text-align:right;padding:0 9px;
  color:#c3ccd6;font:400 13px/1 'IBM Plex Mono',monospace}
.praster .c.bearbeitbar.jetzt{display:block}
.praster .c.bearbeitbar.jetzt input{color:#fff}
.praster .c.bearbeitbar input:hover{border-color:var(--line)}
.praster .c.bearbeitbar input:focus{border-color:var(--accent);background:#0b1116;
  color:#fff;outline:none}
.praster .c.bearbeitbar.markiert input{background:rgba(240,160,141,.12)}
.mraster>div.bearbeitbar{padding:8px 3px 7px}
.mraster>div.bearbeitbar input{width:100%;height:24px;margin-top:2px;background:none;
  border:1px solid transparent;border-radius:4px;text-align:center;padding:0 2px;
  color:#c3ccd6;font:400 12.5px/1 'IBM Plex Mono',monospace}
.mraster>div.bearbeitbar input:hover{border-color:var(--rule)}
.mraster>div.bearbeitbar input:focus{border-color:var(--accent);background:#0b1116;
  color:#fff;outline:none}
/* Ziehen im Raster (U-41). Dieselben Bauteile wie in der Tabelle: der Griff
   sitzt absolut in der Namenszelle, die Ziellinie ist ein Innenschatten und
   kein Rahmen — ein Rahmen machte die Zeile zwei Pixel hoeher, und das Raster
   zappelte bei jedem Wechsel des Ziels. */
.praster .p{position:relative}
.praster .r:hover .zeilengriff{opacity:1}
.praster .r.zieht-mich{opacity:.45}
.praster .r.zieh-vor{box-shadow:inset 0 2px 0 0 var(--accent)}
.praster .r.zieh-nach{box-shadow:inset 0 -2px 0 0 var(--accent)}
.praster .p .zwerk{margin-left:auto;opacity:0;transition:opacity .12s}
.praster .r:hover .p .zwerk{opacity:1}
.praster .p .zwerk button{background:none;border:0;padding:0 2px;cursor:pointer;
  font:400 10.5px/1 'IBM Plex Mono',monospace;color:#5f6874}
.praster .p .zwerk button:hover{color:var(--err)}
.praster .p .t{cursor:pointer}
.praster .p .t:hover{color:#fff}
/* Der Zaehler steht rechts beim Pfeil statt als Wort in der Zeile — er sagt,

.k-budget .kkopf,.k-budget .streifen>.reihe{

.streifen .nam button.t{background:none;border:0;padding:0;cursor:pointer;

/* Ausgeblendet sieht anders aus als «nur nicht uebernommen»: durchgestrichen
   heisst «den gibt es ab hier nicht mehr», grau heisst «der bleibt, ohne Wert». */
.jn-zeile.weg .nam{color:var(--muted);text-decoration:line-through;text-decoration-thickness:1px}
.jn-zeile.weg .bet{color:var(--muted)}

  padding-top:7px;margin-top:2px}

<script id="gaeppApp">
/* ===================================================================
   GAEPP — Kern: Zustand, Persistenz, Synchronisation, Rechenregeln.
   Albrechts privates Haushaltsbuch. Ein Nutzer, eine Datei, eine Wahrheit.

   Die Datendatei liegt im privaten Repo (A-79), diese Datei ist die leere
   Huelle (A-78): keine Betraege, keine Kontonummern, keine Belege.
   =================================================================== */
'use strict';

const $  = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));

const MON       = ['Jan','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'];
const MON_LANG  = ['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
const TAGE      = [31,28,31,30,31,30,31,31,30,31,30,31];
const SCHLUESSEL_DATEN = 'gaepp.v1';        /* wird nie gehoben (Datenanbindung) */
const SCHLUESSEL_GH    = 'gaepp.github';
const SCHEMA_APP = 6;                        /* Stand dieser App (A-88). Von 2 auf 3 am 17.08.2026:
   die Entitaet «rechnungen» traegt seither ein Feld fuer die Verbindlichkeit
   (F-01). Von 3 auf 4 am 18.08.2026: Zeilen und Kategorien tragen statt
   `aktiv` ein `ausAb` (U-21) — eine aeltere Fassung wuerde ein ausgeblendetes
   `ausAb:2029` als sichtbar lesen und das Budget zu hoch ansetzen.
   Eine aeltere Fassung der App laedt diese Datei nur noch lesend und
   kann sie nicht ueberschreiben — genau dafuer ist die Nummer da.
   U-22 hebt sie BEWUSST NICHT auf 5, obwohl zwei Felder dazukommen
   (`dokumente` bei den Verbindlichkeiten, `periodizitaet` bei den
   Zeilen). Der Massstab ist nicht «etwas ist neu», sondern «eine
   aeltere Fassung liest die Zahlen falsch». Beide Felder rechnen
   nichts: die Dokumente sind Verweise, die Periodizitaet ist eine
   Beschreibung. Eine aeltere Fassung ueberliest sie und gibt sie beim
   Speichern unveraendert zurueck — kein Rappen aendert sich. Wer die
   Nummer bei jedem neuen Feld hebt, sperrt Albrecht aus Gruenden aus,
   die keine sind, und dann glaubt ihr niemand mehr, wenn es zaehlt. */
const DATEI_IM_REPO = 'gaepp-daten.json';

/* ---- Zahlen und Datum, Schweizer Konventionen ------------------------ */
function tageImMonat(j, m) { return (m === 1 && ((j % 4 === 0 && j % 100 !== 0) || j % 400 === 0)) ? 29 : TAGE[m]; }
function fmt(x, stellen) {
  if (x === null || x === undefined || x === '' || (typeof x === 'number' && !isFinite(x))) return '–';
  const n = Math.round(Number(x) * 100) / 100;
  const s = Math.abs(n).toFixed(stellen === undefined ? 2 : stellen);
  const t = s.split('.');
  t[0] = t[0].replace(/\B(?=(\d{3})+(?!\d))/g, "'");
  return (n < 0 ? '−' : '') + t.join('.');
}
/* Null wird nicht ausgeschrieben — sie ist in einer Tabelle mit sechzig Zeilen nur Laerm. */
function fmt0(x) { return (!x || Math.abs(x) < 0.005) ? '' : fmt(x); }
/* U-32: In der Budgettafel stehen ganze Franken. Rappen erscheinen nur, wenn
   der Betrag welche hat — gerundet wird ANGEZEIGT, nie gespeichert. */
function ganzerFranken(x) { const n = Number(x) || 0; return Math.abs(n - Math.round(n)) < 0.005; }
function fmtG(x, stellen) { if (stellen !== undefined) return fmt(x, stellen); return ganzerFranken(x) ? fmt(x, 0) : fmt(x, 2); }
function fmtG0(x) { return (!x || Math.abs(x) < 0.005) ? '' : fmtG(x); }
/* Der gestellte Tag fuer den Pruefstand. heuteISO() ist die einzige Quelle des
   heutigen Datums und wird an ueber fuenfzig Stellen gerufen — Stand, Prognose,
   freies Geld, Faltung, Serien haengen alle daran. Ohne diesen Zweig laesst sich
   der Rechenkern nicht pruefen, und eine Pruefung mit dem echten Datum wuerde
   beim naechsten Monatswechsel von selbst rot. Im Normalbetrieb ist der Zweig
   tot: window.GAEPP_HEUTE wird nur vom Pruefstand gesetzt. */
function heuteISO() { if (window.GAEPP_HEUTE) return window.GAEPP_HEUTE; const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
function hhmm() { return new Date().toLocaleTimeString('de-CH', { hour:'2-digit', minute:'2-digit' }); }
function iso(j, m, t) { return j + '-' + String(m+1).padStart(2,'0') + '-' + String(t).padStart(2,'0'); }
function ymOf(datum) { return { j: +datum.slice(0,4), m: +datum.slice(5,7) - 1, t: +datum.slice(8,10) }; }
function rd(x) { return Math.round((Number(x) || 0) * 100) / 100; }
function neueId(p) { return p + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2,6); }

/* ---- Fremder Text in HTML (U-22) ------------------------------------
   Bis hierher stand an jeder Einbaustelle nur .replace(/"/g,'&quot;').
   Das genuegt in einem Attribut und nirgends sonst: der Name eines
   Dokumentlinks kommt aus einem Eingabefeld und stuende sonst als
   Markup in der Seite. Zwei Funktionen, weil Text und Attribut nicht
   dasselbe brauchen — und weil eine Funktion, die beides halb macht,
   an beiden Stellen falsch ist. */
function htmlText(s) {
  return String(s === null || s === undefined ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
function htmlAttr(s) { return htmlText(s).replace(/"/g, '&quot;'); }

let D = null;            /* die Daten — kommen aus dem Repo, nie aus dieser Datei */
let S = {                /* der Anzeigezustand — nur localStorage, nie in die Datei */
  jahr: 2026, monat: 7, zeitraum: 'monat', modus: 'dashboard',

     Zwei Schalter statt einem: waagrecht und senkrecht sind zwei verschiedene
     Fragen. Wer die Vergangenheit sehen will, will deswegen noch lange nicht

  leisteSchmal: false, monateAlle: false, zeilenAlle: false,

     kOffen haelt die aufgeklappte Karte — leer heisst alle zu, das Gegenteil

  kOffen: [],

  rGrp: 'monat', rBezAuf: false

let GH = { repo:'', branch:'main', token:'' };
let _sig, _sha = null, _pushT = null, _ro = false;

/* ===================================================================
   Persistenz. Der localStorage nimmt jede Aenderung sofort auf,
   GitHub bekommt sie verzoegert und gebuendelt. Vorbild PEPAPP.
   =================================================================== */
function nutzdaten() { return D; }

function persist() {
  if (!D) return;
  const sig = JSON.stringify(D);
  try {
    localStorage.setItem(SCHLUESSEL_DATEN, JSON.stringify({ d: D, s: S }));
  } catch (err) { /* Speicher voll oder gesperrt — der Push traegt trotzdem */ }
  if (_sig === undefined) { _sig = sig; return; }
  if (sig !== _sig) { _sig = sig; schedulePush(); }
}
/* Der Anzeigezustand geht in den Speicher, aber NICHT in den Fingerabdruck —
   sonst pusht die App bei jedem Klick. */
function persistAnsicht() {
  if (!D) return;
  try { localStorage.setItem(SCHLUESSEL_DATEN, JSON.stringify({ d: D, s: S })); } catch (err) {}
}
/* U-41: Ein alter Stand aus der Zeit des Umschalters traegt noch `ansicht`
   und vielleicht ein kOffen falscher Gestalt. Beides faengt diese Stelle ab,
   gerufen an den zwei Orten, an denen S von aussen gefuellt wird. Ohne sie
   liesse ein `kOffen: null` aus einer alten Sitzung die erste Karte werfen. */
function ansichtFangen() {
  if (!Array.isArray(S.kOffen)) S.kOffen = [];
  delete S.ansicht;
  /* U-55: Ein Stand aus der Zeit vor dem 19.08.2026 kennt beide Felder nicht.
     Object.assign laesst die Vorgabe dann stehen — aber nicht, wenn dort
     einmal etwas anderes gelandet ist. Alles ausser 'steller' heisst Monat. */
  if (S.rGrp !== 'steller') S.rGrp = 'monat';
  S.rBezAuf = !!S.rBezAuf;
}

/* ===================================================================
   U-20 — Rueckgaengig. Ein Schritt, zwoelf Sekunden.
   -------------------------------------------------------------------
   Kein Befehlsstapel, sondern ein Abzug des ganzen Datenstands. persist()
   legt nach jeder Aenderung _sig ab; zu Beginn der naechsten Aktion haelt
   _sig also genau den Zustand davor. Merken kostet damit eine Zuweisung
   statt eines zweiten stringify, und Ausfuehren ist ein JSON.parse von
   rund einer Millisekunde — das verschwindet neben zeichne(), das
   schuldenfreiGecacht() ueber mehrere Jahrgaenge laufen laesst.

   Der Austausch von D ist gefahrlos, weil die App alles ueber IDs
   adressiert: _blatt, _ueber und _ber halten {art, id}, keine Referenz
   auf ein Unterobjekt von D. Und _sfCache haengt an einer Signatur ueber
   die Daten, nicht an Objektidentitaet — er invalidiert sich selbst.

   Ein Schritt, kein Stapel: bei einer Datei, die alle 2500 ms nach GitHub
   geht, waere ein Stapel eine zweite Zeitachse neben der Git-Historie.

   Zwoelf Sekunden, weil innerhalb der ersten 2.5 s der falsche Commit gar
   nicht erst entsteht — persist() ruft nach der Wiederherstellung
   schedulePush(), das den laufenden Timer mit clearTimeout abraeumt, und
   es geht ein einziger Push mit dem richtigen Stand raus. Danach entsteht
   ein zweiter Commit, der zuruecknimmt. Laenger waere gefaehrlich: ein
   stilles Rueckgaengig auf eine Aktion von vor zehn Minuten ist bei
   Geldbetraegen schlimmer als keines.
   =================================================================== */
let _undo = null, _undoT = null;
const UNDO_DAUER = 12000;

/* Regel fuer die Einhaengepunkte: merkeStand() ist die erste Anweisung
   nach der Bestaetigung und VOR jeder Mutation. uebertragenTun() zeigt
   warum — es ruft budgetSetzen() je Monat, und jedes davon ruft persist();
   nach dem ersten Monat ist _sig bereits verdorben. */
function merkeStand(text) {
  if (_ro) return;
  /* Rueckfall auf ein frisches stringify: _sig ist beim allerersten Mal
     undefined und wird von ghPull zurueckgesetzt. */
  _undo = { stand: _sig === undefined ? JSON.stringify(D) : _sig, text };
  const l = $('#zurueck');
  if (l) { $('.tx', l).textContent = text; l.hidden = false; }
  undoUhrStellen();
}
/* Merker und Leiste haben dieselbe Lebensdauer. Laeuft die Zeit ab, ist
   auch _undo weg — sonst taete Strg-Z danach still etwas Falsches statt
   nichts. */
function undoUhrStellen() {
  clearTimeout(_undoT);
  _undoT = setTimeout(rueckgaengigWeg, UNDO_DAUER);
}
function rueckgaengigTun() {
  if (_ro || !_undo) return;
  D = JSON.parse(_undo.stand);
  /* Offene Masken zeigen auf Daten, die es so nicht mehr gibt: ein halb
     getippter Entwurf, ein Uebertragungsdialog, ein Blatt zu einer wieder
     vorhandenen Rechnung. Alles zu, dann steht die Ansicht sauber. */
  _entwurf = null; _ueber = null; _loesch = null; _jahrLeer = null; _dlgTun = null;
  _stapel = []; _blatt = null; S.blatt = null;
  $('#blattHg').hidden = true; $('#dialogHg').hidden = true;
  persist();
  rueckgaengigWeg();
  zeichne();
}
function rueckgaengigWeg() {
  clearTimeout(_undoT); _undoT = null; _undo = null;
  const l = $('#zurueck');
  if (l) l.hidden = true;
}
/* Wer die Leiste liest oder ansteuert, soll nicht abgeschnitten werden:
   Zeiger und Fokus halten die Uhr an, das Verlassen stellt sie neu. */
(function () {
  const l = $('#zurueck');
  if (!l) return;                    /* fehlt im eingefrorenen Export */
  const halt = () => clearTimeout(_undoT);
  const weiter = () => { if (_undo) undoUhrStellen(); };
  l.addEventListener('mouseenter', halt);
  l.addEventListener('focusin', halt);
  l.addEventListener('mouseleave', weiter);
  l.addEventListener('focusout', weiter);
})();

function ghUrl() { return 'https://api.github.com/repos/' + GH.repo + '/contents/' + DATEI_IM_REPO; }
function ghHead() {
  return { Authorization: 'Bearer ' + GH.token, Accept: 'application/vnd.github+json',
           'X-GitHub-Api-Version': '2022-11-28' };
}
function b64enc(str) {
  const b = new TextEncoder().encode(str);
  let out = '';
  for (let i = 0; i < b.length; i += 0x8000) out += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000));
  return btoa(out);
}
function b64dec(b64) {
  const bin = atob(String(b64 || '').replace(/\s/g, ''));
  const u = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
  return new TextDecoder().decode(u);
}
function setSync(st, msg) {
  const p = $('#syncPunkt'), t = $('#syncText');
  if (p) p.dataset.st = st;
  if (t) t.textContent = msg;
}
function schedulePush() {
  if (_ro) return;                          /* A-88: veraltete App pusht nie */
  /* Ohne Repo arbeitet GAEPP lokal. Das ist ein Betriebszustand, kein Fehler und
     kein Abbruch: gespeichert wird trotzdem, nur eben in diesem Browser. */
  if (!GH.repo || !GH.token) { setSync('lokal', 'Lokal gesichert ' + hhmm()); return; }
  clearTimeout(_pushT);
  setSync('busy', 'Ungesicherte Änderung');
  _pushT = setTimeout(ghPush, 2500);
}
async function ghPush(retry) {
  if (_ro || !GH.repo || !GH.token) return;
  clearTimeout(_pushT);
  setSync('busy', 'Sichert');
  D.meta.geaendert = new Date().toISOString();
  const body = {
    message: 'GAEPP ' + new Date().toISOString().slice(0,16).replace('T',' '),
    content: b64enc(JSON.stringify(D, null, 1)),
    branch: GH.branch || 'main'
  };
  if (_sha) body.sha = _sha;
  try {
    const r = await fetch(ghUrl(), { method:'PUT',
      headers:{ ...ghHead(), 'Content-Type':'application/json' }, body: JSON.stringify(body) });
    /* Konflikt: aktuelle SHA holen und genau einmal wiederholen — wie in PEPAPP */
    if ((r.status === 409 || r.status === 422) && !retry) {
      const g = await fetch(ghUrl() + '?ref=' + encodeURIComponent(GH.branch || 'main'),
                            { headers: ghHead(), cache:'no-store' });
      _sha = g.ok ? (await g.json()).sha : null;
      return ghPush(true);
    }
    if (!r.ok) throw new Error('Fehler ' + r.status);
    const j = await r.json();
    _sha = j.content && j.content.sha;
    setSync('ok', 'Gesichert ' + hhmm());
  } catch (err) {
    setSync('err', String(err.message || err));
  }
}
async function ghPull(still) {
  if (!GH.repo || !GH.token) return false;
  setSync('busy', 'Lädt');
  try {
    const r = await fetch(ghUrl() + '?ref=' + encodeURIComponent(GH.branch || 'main'),
                          { headers: ghHead(), cache:'no-store' });
    if (r.status === 404) { _sha = null; setSync('err', DATEI_IM_REPO + ' fehlt im Repo'); return false; }
    if (r.status === 401 || r.status === 403) throw new Error('Token abgelehnt');
    if (!r.ok) throw new Error('Fehler ' + r.status);
    const j = await r.json();
    _sha = j.sha;
    const geladen = JSON.parse(b64dec(j.content));
    if (!uebernehmen(geladen)) return false;
    _sig = undefined;
    setSync('ok', 'Geladen ' + hhmm());
    if (!still) { zeichne(); tagessicherung({ ohneGeste:true }); }
    return true;
  } catch (err) {
    setSync('err', String(err.message || err));
    return false;
  }
}

/* ---- Datenlisten absichern ------------------------------------------
   Die App greift an ueber hundert Stellen ohne Rueckfallwert direkt auf
   D.konten, D.rechnungen und die uebrigen Listen zu. Fehlt eine davon in
   der geladenen Datei, wirft der erste Zugriff, der Zeichner bricht ab
   und die Seite bleibt weiss — ohne Meldung, aus der man das schliessen
   koennte. Eine fehlende Liste ist aber kein Fehler, sondern eine Liste
   mit null Eintraegen: hier einmal angelegt, statt an 142 Stellen
   abgefragt. */
function normalisieren(d) {
  /* Nichts geladen bleibt nichts geladen — sonst stuende statt der leeren
     Huelle eine Datei ohne Inhalt da, die sich speichern liesse. */
  if (!d || typeof d !== 'object') return d;
  ['konten','kategorien','zeilen','buchungen','serien','verbindlichkeiten',
   'sparziele','rechnungen','steller','stellerGruppen']
    .forEach(k => { if (!Array.isArray(d[k])) d[k] = []; });
  if (!d.budget || typeof d.budget !== 'object') d.budget = {};
  if (!d.meta   || typeof d.meta   !== 'object') d.meta   = {};
  /* U-22: Dokumentlinks eines Glaeubigers. Fehlt das Feld, entsteht es
     leer — sonst muesste jede Lesestelle den Fall «gar nicht da» neben
     dem Fall «leer» mitdenken, und die eine, die es vergisst, wirft. */
  d.verbindlichkeiten.forEach(v => { if (!Array.isArray(v.dokumente)) v.dokumente = []; });
  /* U-27: Dasselbe Feld bei den Rechnungen. Eine Rechnung hat ihren Beleg —
     das ist die Datei im Ordner, die GAEPP selbst abgelegt hat. Daneben
     gibt es das, was um sie herum liegt: Mahnung, Ratenzusage, Schriftwechsel.
     Dafuer ist dieses Feld da, und es heisst genau so wie bei den
     Verbindlichkeiten, weil es dasselbe ist. */
  d.rechnungen.forEach(r => { if (!Array.isArray(r.dokumente)) r.dokumente = []; });
  /* U-28: Und dasselbe Feld bei den Konten. Was zu einem Konto gehoert, ist
     anderer Art als bei einer Schuld — Kontoauszuege, der Bankvertrag, das
     Merkblatt zur Kontofuehrung —, aber es ist dieselbe Frage: eine Adresse,
     unter der etwas liegt. Deshalb dasselbe Feld und dasselbe Bauteil statt
     eines zweiten, das nach einem halben Jahr anders aussieht. */
  d.konten.forEach(k => { if (!Array.isArray(k.dokumente)) k.dokumente = []; });
  /* U-31: die Reihenfolge der Glaeubiger innerhalb ihrer Gruppe. `zeilen`
     tragen `rang` seit je, `verbindlichkeiten` nicht — sie standen in der
     Reihenfolge da, in der sie in der Datei stehen. Genau die wird hier
     festgeschrieben: beim ersten Laden aendert sich am Bild kein Pixel,
     erst der erste Zug vergibt neu. */
  /* U-47: Der Saldovortrag je Jahr. Fehlt das Feld, wird es leer angelegt —
     eine Datei ohne Vortrag rechnet danach Zeichen fuer Zeichen wie vorher.
     SCHEMAERHOEHUNG 4 -> 5, und die ist noetig: Anders als bei `rang` (U-31)
     oder `dokumente` (U-22) aendert dieses Feld ZAHLEN. Eine aeltere Fassung
     der App laese es nicht, ignorierte damit jeden Vortrag und zeigte zu hohe
     Staende — und schriebe die Datei beim naechsten Sichern mit ihrer eigenen,
     falschen Rechnung zurueck. Genau den Fall soll die Versionszahl anzeigen
     (A-88, Abschnitt 7 des Datenschemas). */
  (d.verbindlichkeiten || []).forEach(v => {
    if (!v.staende || typeof v.staende !== 'object') v.staende = {};
    /* U-49: Ausblenden ab einem Stichjahr, jetzt auch fuer Glaeubiger.
       SCHEMAERHOEHUNG 5 -> 6. Sie ist noetig, weil eine aeltere Fassung der
       App das Feld nicht liest: Sie zeigte einen ab 2027 ausgeblendeten
       Glaeubiger weiter an UND rechnete ihn in den Schuldenberg — sie
       versteht die Datei falsch, und genau das soll die Versionszahl
       anzeigen (A-88). `null` heisst nie ausgeblendet. */
    if (!('ausAb' in v)) v.ausAb = null;
  });
  verbRangFuellen(d);
  /* U-35: dasselbe fuer die Konten. Jedes Konto, das GAEPP selbst angelegt
     hat, traegt `rang` — aber eine von Hand geschriebene oder aeltere Datei
     muss es nicht, und `sektion` fehlt dort ebenso. Ohne Rang stuenden
     mehrere Konten auf 0, die Reihenfolge waere nicht eindeutig, und der
     erste Zug liesse sie sichtbar springen. Gefuellt wird je Bereich, in
     Dateireihenfolge, in Zehnerschritten — und nur, was fehlt.
     KEINE Schemaerhoehung, aus demselben Grund wie bei U-31: ein Feld,
     das eine aeltere Fassung nicht liest, aendert keinen Rappen. */
  kontoRangFuellen(d);
  if (d.meta.lohntag       === undefined) d.meta.lohntag       = 25;
  if (d.meta.waehrung      === undefined) d.meta.waehrung      = 'CHF';
  if (d.meta.schemaVersion === undefined) d.meta.schemaVersion = SCHEMA_APP;
  return d;
}
/* U-31: Gefuellt wird je Gruppe, in Dateireihenfolge, in Zehnerschritten —
   und nur, was fehlt. Eine Datei, die schon Raenge traegt, bleibt unberuehrt;
   ein einzelner Nachzuegler ohne Rang bekommt den seiner Dateistellung und
   steht damit dort, wo er bisher zu sehen war. Dass er dabei mit einem
   bestehenden Rang zusammenfallen kann, ist hingenommen: die Ordnung ist
   dann fuer einen Moment nicht eindeutig, und der erste Zug in dieser
   Gruppe schreibt ohnehin alle Raenge neu durch.
   KEINE Schemaerhoehung. Ein zusaetzliches Feld, das eine aeltere Fassung
   der App schlicht nicht liest, ist kein Grund, ihr die Datei zu sperren —
   sie zeigt die Glaeubiger dann in Dateireihenfolge, also so wie bisher.
   Anders als bei U-21, wo `aktiv` VERSCHWAND und eine alte Fassung deshalb
   ausgeblendete Zeilen wieder eingeblendet haette. */
function kontoRangFuellen(d) {
  const gez = {};
  (d.konten || []).forEach(k => {
    /* Der Bereich zuerst: er entscheidet, in welchem Block gezaehlt wird.
       Ohne Angabe steht ein Konto bei den Konten — dort, wo es bisher
       auch stand, denn nur «reserve» wird ausdruecklich abgefragt. */
    if (k.sektion !== 'reserve') k.sektion = 'konten';
    gez[k.sektion] = (gez[k.sektion] || 0) + 1;
    if (typeof k.rang !== 'number') k.rang = gez[k.sektion] * RANG_SCHRITT;
  });
}
function verbRangFuellen(d) {
  const gez = {};
  (d.verbindlichkeiten || []).forEach(v => {
    const g = v.gruppe || '';
    gez[g] = (gez[g] || 0) + 1;
    if (typeof v.rang !== 'number') v.rang = gez[g] * RANG_SCHRITT;
  });
}
/* ---- U-21: aktiv wird ausAb (Schema 3 → 4) ---------------------------
   Der alte Zustand `aktiv:false` heisst «seit je aus» und wird zur
   Sentinel 0; alles andere zu null. Danach faellt `aktiv` weg — zwei
   Felder fuer dieselbe Frage waeren zwei Wahrheiten, und die zweite
   veraltet still. Die Migration laeuft auf JEDER geladenen Datei, auch
   auf einer schon migrierten: sie fuegt nur hinzu, was fehlt, und ist
   damit gefahrlos wiederholbar.
   Nach der Migration aendert sich am Bild kein Pixel — genau das ist
   der Sinn einer Migration. */
function migriere4(d) {
  [d.zeilen, d.kategorien].forEach(liste => (liste||[]).forEach(o => {
    if (!('ausAb' in o)) o.ausAb = (o.aktiv === false) ? 0 : null;
    delete o.aktiv;
  }));
}
/* ---- Schemaversion und Ueberschreibschutz (A-88) --------------------
   Bei Geldbetraegen ist Verhindern besser als Wiederherstellen. */
function uebernehmen(geladen) {
  /* Die Version wird VOR dem Auffuellen gelesen: normalisieren traegt eine
     fehlende schemaVersion als die der App nach, und danach liesse sich eine
     zu neue Datei nicht mehr von einer alten ohne meta unterscheiden. */
  const v = (geladen && geladen.meta && geladen.meta.schemaVersion) || 1;
  geladen = normalisieren(geladen);
  /* Erst normalisieren, dann migrieren: migriere4 laeuft ueber d.zeilen und
     d.kategorien, und die legt normalisieren an, falls sie in der Datei
     fehlen. Umgekehrt wuerde die Migration an einer fehlenden Liste werfen. */
  if (geladen && typeof geladen === 'object') migriere4(geladen);
  if (v > SCHEMA_APP) {
    D = geladen; _ro = true;
    document.body.classList.add('readonly');
    kopfmeldung('Diese Datendatei ist neuer als die App (Schema ' + v + ' gegen ' + SCHEMA_APP +
                '). GÄPP hat sie schreibgeschützt geladen und sichert nichts. Lade die neue Fassung der App.');
    setSync('err', 'App veraltet — schreibgeschützt');
    return true;
  }
  D = geladen;
  if (v < SCHEMA_APP) D.meta.schemaVersion = SCHEMA_APP;   /* beim ersten Speichern anheben */
  _ro = false; document.body.classList.remove('readonly');
  kopfmeldung(null);
  return true;
}
function kopfmeldung(text) {
  let el = $('#kopfmeldung');
  if (!text) { if (el) el.remove(); return; }
  if (!el) {
    el = document.createElement('div'); el.id = 'kopfmeldung'; el.className = 'kopfmeldung';
    /* Die Meldung gehoert zwischen Kopfzeile und Inhalt. Sie wurde bisher mit
       document.body.insertBefore eingehaengt — seit dem Umbau der Seite
       (body > .rahmen > .haupt > .inhalt) ist .inhalt aber kein Kind von body
       mehr, und der Aufruf warf NotFoundError. Bemerkt hat es niemand, weil die
       Meldung nur zuendet, wenn eine Datei mit hoeherer Schemaversion geladen
       wird — also ausgerechnet dann, wenn die App vor dem Ueberschreiben warnen
       muesste. Das Elternelement kommt jetzt vom Zielknoten selbst, damit der
       naechste Umbau sie nicht wieder abwirft. */
    const ziel = $('.inhalt');
    if (ziel && ziel.parentNode) ziel.parentNode.insertBefore(el, ziel);
    else document.body.appendChild(el);
  }
  el.textContent = text;
}

/* ===================================================================
   Nachschlagen
   =================================================================== */
const konto      = id => D.konten.find(k => k.id === id);
const kategorie  = id => D.kategorien.find(k => k.id === id);
const zeile      = id => D.zeilen.find(z => z.id === id);
const verbind    = id => D.verbindlichkeiten.find(v => v.id === id);
const steller    = id => D.steller.find(s => s.id === id);
const GRUPPEN    = [{ id:'steuer', name:'Steuerverwaltung' },

/* ---- Kopfzeile: Zeitwahl ------------------------------------------- */
function zeitTitel() {
  if (S.zeitraum === 'alle')  return 'Alle Jahre';

     tiefer noch einmal steht: «2024» über «2024». Zwei gleich beschriftete

     steht in «Alle Jahre» und findet dort weder den Knopf «Gläubiger

  const spanne = !jahre.length ? '—'
    : jahre[0] === jahre[jahre.length-1] ? 'Alle Jahre'

  $('#lblJahr').textContent  = String(S.jahr);

  const bereich = S.modus === 'dashboard'  ? 'dashboard'
                : S.modus === 'verwaltung' ? 'verwaltung'

    b.setAttribute('aria-current', b.dataset.bereich === bereich); });

/* Die drei Liquiditaetszahlen begleiten die Tabellenarbeit. Im Dashboard

/* schuldenfrei() laeuft ueber bis zu sieben Jahrgaenge mal zehn Glaeubiger.

}

   sondern etwas Schlimmeres: die Budgettabelle zeigte lauter Nullen, und die
   erste eingetippte Zahl legte den Jahrgang ueber budgetSetzen still WIEDER AN.
   Ein Jahr, das jemand geloescht hat, kaeme so durch die Hintertuer zurueck.
   Gefangen wird zum naechstgelegenen vorhandenen Jahrgang: naeher als
   «immer der erste» und ohne Vorliebe fuer vorwaerts oder rueckwaerts. */
function jahrFangen() {
  const j = budgetJahre();
  if (!j.length || j.indexOf(S.jahr) >= 0) return false;
  S.jahr = j.reduce((a, b) => Math.abs(b - S.jahr) < Math.abs(a - S.jahr) ? b : a);
  return true;
}
function zeichneKalender() {
  const jahre = budgetJahre();
  $('#jahre').innerHTML = jahre.map(j =>
    `<button data-j="${j}" aria-pressed="${j===S.jahr}">${j}</button>`).join('');
  $('#monate').innerHTML = MON.map((n,i) =>
    `<button data-m="${i}" aria-pressed="${i===S.monat && S.zeitraum==='monat'}">${n}</button>`).join('');
}

function zeitEnde() {
  if (S.zeitraum === 'monat') return { j: S.jahr, m: S.monat };
  if (S.zeitraum === 'jahr')  return { j: S.jahr, m: 11 };
  const jahre = budgetJahre();
  /* U-30: Ohne den Rueckfall liefert «Alle Jahre» bei leerem Budget undefined,
     und daraus wird in kontosaldo() und verbindLauf() ein NaN, das durch jede
     Kachel wandert. Ein Budget ohne Jahrgaenge ist kein Sonderfall mehr,
     seit man den letzten loeschen kann. */
  return { j: jahre.length ? jahre[jahre.length-1] : S.jahr, m: 11 };

}

/* Die Schuldenkachel traegt zwei Dinge, die sonst nirgends stehen: wann
   Schluss ist — und, wenn es kein Schluss wird, warum nicht. Dazu der
   Verlauf als Linie, damit die Richtung sichtbar ist und nicht nur der Stand. */
function schuldkachelHtml(sf, verb, schuld) {
  const jahre = Object.keys(D.budget).map(Number).sort();

  if (sf.monate !== null) {
    const jahreT = Math.floor(sf.monate / 12), monT = sf.monate % 12;

}

/* Eine Linie ohne Achsen. Sie beantwortet eine Frage: geht es runter? */
function sparkHtml(werte) {
  const w = 210, hh = 34, max = Math.max(...werte, 1), min = 0;
  const pkt = werte.map((v,i) => {
    const x = werte.length < 2 ? 0 : (i / (werte.length - 1)) * w;
    const y = hh - ((v - min) / (max - min || 1)) * hh;
    return x.toFixed(1) + ',' + y.toFixed(1);
  });
  return `<svg class="spark" viewBox="0 0 ${w} ${hh}" preserveAspectRatio="none" aria-hidden="true">
    <polyline points="${pkt.join(' ')}"/>
    <circle cx="${pkt[pkt.length-1].split(',')[0]}" cy="${pkt[pkt.length-1].split(',')[1]}" r="2.5"/></svg>`;
}

/* U-40: Hier stand fristenHtml() — die Sektion «Was ausläuft» des
   Dashboards. Sie faellt mit ihrem einzigen Aufrufer weg; die Frist steht
   jetzt auf der Glaeubigerkarte, rot ab 120 Tagen. `vereinbarungBis` bleibt

   derselben Aussage geht. */

function zeichneKacheln() {
  const e = zeitEnde();
  /* Die Liquiditaetskarte ist mit U-5 ins Dashboard gewandert. Hier stand
     sie doppelt (U-10). */

  const konten = D.konten.filter(k => k.aktiv !== false && k.sektion === 'konten')
    .sort((a,b) => a.rang - b.rang).map(k => {
      const s = kontosaldo(k.id, e.j, e.m);
      const n = D.buchungen.filter(b => b.kontoId === k.id || b.gegenkontoId === k.id).length;
      const letzte = D.buchungen.filter(b => b.kontoId === k.id).map(b => b.datum).sort().pop();
      /* Konto 05 fuehrt die offenen Rechnungen — von dort wird eine erfasst,
         nicht gebucht. Die Kachel traegt deshalb ein anderes Wort. */
      const offen = D.rechnungen.filter(r => r.status === 'offen' && r.kontoId === k.id);
      const rech = k.id === 'kred';
      return kachelHtml({ art:'konto', id:k.id, kennung:'Konto ' + k.nr, name:k.name, rolle:k.rolle,
        label:'Saldo', wert:s, ueberzogen: s < 0,
        knopf: rech ? 'Rechnung' : 'Buchen', tat: rech ? 'rechnungneu:' + k.id : null,
        meta: rech
          ? (offen.length ? offen.length + (offen.length===1?' offene Rechnung · ':' offene Rechnungen · ')
              + fmt(rd(offen.reduce((s2,r)=>s2+r.betrag,0))) : 'keine offene Rechnung')
          : n + (n === 1 ? ' Buchung' : ' Buchungen') + (letzte ? ' · zuletzt ' + kurzdatum(letzte) : '') });
    }).join('');

  /* U-40: Hier stand der Kachelteppich der Schulden. Dieselben Glaeubiger
     standen im Bereich Verbindlichkeiten noch einmal als Tabelle — zwei Orte,
     zwei Formen, eine Sache. Sie fuehrt jetzt der Bereich Verbindlichkeiten
     allein, dort als Streifenkarten mit dem Budgetplan, den die Kachel nie
     hatte. GRUPPEN, standPer und getilgtAnteil bleiben stehen: verbindKarten()
     rechnet damit weiter, und das Dashboard tut es ohnehin. */
  const sparziele = D.sparziele.filter(s => s.aktiv !== false).map(s => {
    const st = sparstand(s.id, e.j, e.m);
    return kachelHtml({ art:'sparziel', id:s.id, kennung:'Sparziel', name:s.name, rolle:'',

      meta: s.zielbetrag ? Math.round(st/s.zielbetrag*100) + ' % · es fehlen ' + fmt(s.zielbetrag - st) : '' });
  }).join('');

  const res = D.konten.find(k => k.sektion === 'reserve');
  const reserve = res ? kachelHtml({ art:'konto', id:res.id, kennung:'Konto ' + res.nr, name:res.name,
    rolle:res.rolle, label:'Stand', wert:kontosaldo(res.id, e.j, e.m), knopf:'Einzahlen', meta:'' }) : '';

  const kListe = D.konten.filter(k => k.aktiv !== false && k.sektion === 'konten');
  const kTotal = rd(kListe.reduce((s,k) => s + kontosaldo(k.id, e.j, e.m), 0));
  const kFrei  = rd(kListe.filter(k => k.frei).reduce((s,k) => s + kontosaldo(k.id, e.j, e.m), 0));

  $('#inhalt').innerHTML =
    /* U-30: Der Leertext stand hier auf null — bei null Konten war der Bereich
       einfach leer, und wer mit einer leeren Datei anfing, sah eine Seite ohne

       Sparzielen darunter, weil es dieselbe Lage ist. */
    sektion('Konten', konten, 'Noch kein Konto angelegt. Du legst eines in der Verwaltung '
      + 'unter «Struktur» an — Konto trägt Kategorie trägt Position, in dieser Reihenfolge.',
      false, kTotal,
      kListe.length + ' Konten · davon frei verfügbar ' + fmt(kFrei)) +

}
function sektion(titel, inhalt, leertext, eigenesRaster, wert, zusatz) {
  /* Der Wert im Sektionskopf ist dasselbe Bauteil wie bei den Schulden —
     nur eine Ebene hoeher (U-10). */
  const kopf = `<h2>${titel}${wert === undefined || wert === null ? '' :
    `<span class="h2-wert num">${fmt(wert)}</span>`}${zusatz ? `<span class="h2-zu">${zusatz}</span>` : ''}</h2>`;
  if (!inhalt) {
    if (!leertext) return '';
    return `<section class="sektion">${kopf}<p class="meldung">${leertext}</p></section>`;
  }
  return `<section class="sektion">${kopf}` +
    (eigenesRaster ? inhalt : `<div class="raster">${inhalt}</div>`) + `</section>`;
}
function kurzdatum(d) { const x = ymOf(d); return x.t + '. ' + MON[x.m]; }
/* Stand eines Sparziels per Stichtag. Beide Aufrufer geben Jahr und Monat mit
   und erwarten den Stand zu diesem Zeitpunkt — die Funktion hat sie bisher
   entgegengenommen und nicht angeschaut. Folge: beim Rueckwaertsblaettern stand
   der Sparstand still, waehrend Konten und Schulden mitliefen. Die Zeitgrenze
   ist dieselbe wie in kontosaldo, damit eine Kachel nicht anders rechnet als
   die daneben. */
function sparstand(sid, j, m) {
  return rd(D.buchungen.reduce((s,b) => {
    if (b.sparzielId !== sid) return s;
    const d = ymOf(b.datum);
    if (j !== undefined && (d.j > j || (d.j === j && m !== undefined && d.m > m))) return s;
    return s + b.betrag;
  }, 0));
}
/* ---- Liquiditaetskarte (A-11, A-12) --------------------------------- */
function liqKarteHtml() {
  const h = ymOf(heuteISO());
